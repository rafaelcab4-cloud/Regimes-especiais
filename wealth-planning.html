<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Wealth Planning — Material de Consulta Patrimonial</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.5.0/css/flag-icons.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root{
  --ink:#1a2332;--ink-2:#2c3e52;--ink-soft:#5b6b7d;
  --paper:#f6f3ee;--paper-2:#ecead9;--line:#dcd5c7;--line-soft:#e9e3d5;
  --accent:#8b2e2e;--accent-2:#a85e3a;--gold:#a98b4a;
  --green:#3d6b4a;--amber:#a26d20;--red:#8b2e2e;--blue:#2e4f8b;--purple:#5e3d7a;
  --bg:#faf8f3;
  --tag-ok-bg:#e7eee8;--tag-ok-c:#3d6b4a;
  --tag-chg-bg:#f5ecd9;--tag-chg-c:#8a6620;
  --tag-ext-bg:#f1dfdf;--tag-ext-c:#7a2727;
  --tag-new-bg:#dde5ef;--tag-new-c:#2a4877;
  --tag-risk-bg:#e9dfee;--tag-risk-c:#553870;
  --font-serif:'Cormorant Garamond',serif;
  --font-sans:'Inter',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font-sans);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
a{color:inherit}
.serif{font-family:var(--font-serif);font-weight:500;letter-spacing:-0.005em}
.mono{font-family:var(--font-mono)}
.fi{border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,0.08)}

/* ════ TOP HEADER ════ */
.topbar{background:#fff;border-bottom:1px solid var(--line-soft);position:sticky;top:0;z-index:50}
.topbar-inner{max-width:1480px;margin:0 auto;padding:22px 36px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:32px}
.brand-search{display:flex;align-items:center;gap:14px;color:var(--ink-soft)}
.icon-btn{width:36px;height:36px;border:1px solid var(--line);background:transparent;border-radius:50%;cursor:pointer;color:var(--ink-soft);display:inline-flex;align-items:center;justify-content:center;transition:all .2s}
.icon-btn:hover{border-color:var(--ink);color:var(--ink)}
.brand-mark{text-align:center;text-decoration:none;display:block;cursor:pointer}
.brand-title{font-family:var(--font-serif);font-size:30px;font-weight:500;letter-spacing:0.14em;color:var(--ink);text-transform:uppercase;line-height:1}
.brand-sub{font-family:var(--font-sans);font-size:9.5px;letter-spacing:0.42em;color:var(--ink-soft);margin-top:8px;text-transform:uppercase;font-weight:400}
.brand-sub::before,.brand-sub::after{content:'+';margin:0 8px;color:var(--accent);font-weight:600}
.topbar-actions{display:flex;align-items:center;gap:18px;justify-content:flex-end}
.topbar-meta{font-size:10px;letter-spacing:0.18em;color:var(--ink-soft);text-transform:uppercase;font-weight:500;white-space:nowrap}
.topbar-meta span{color:var(--accent);font-weight:600}

/* ════ SECTION NAV (top-level, replaces flagnav) ════ */
.secnav{background:#fff;border-bottom:1px solid var(--line-soft);position:sticky;top:89px;z-index:49}
.secnav-inner{max-width:1480px;margin:0 auto;padding:0 36px;display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:thin}
.secnav-inner::-webkit-scrollbar{height:0}
.sec-tab{flex:1;min-width:150px;padding:16px 14px;border:none;background:none;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;gap:4px;border-bottom:2px solid transparent;transition:all .2s;color:var(--ink-soft);text-decoration:none}
.sec-tab:hover{color:var(--ink);background:linear-gradient(180deg,transparent,rgba(0,0,0,0.02))}
.sec-tab.active{color:var(--ink);border-bottom-color:var(--accent)}
.sec-tab .n{font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.14em;color:var(--accent);font-weight:500}
.sec-tab .t{font-size:12.5px;letter-spacing:0.03em;font-weight:600;line-height:1.3}
.sec-tab.home{flex:0 0 auto;min-width:auto;padding:16px 22px;justify-content:center}

/* ════ COUNTRY SUB-NAV (inside Regimes Especiais) ════ */
.subnav{background:#fff;border-bottom:1px solid var(--line-soft)}
.subnav-inner{max-width:1480px;margin:0 auto;padding:0 36px;display:flex;align-items:stretch;overflow-x:auto;scrollbar-width:thin}
.subnav-inner::-webkit-scrollbar{height:0}
.flag-tab{flex:1;min-width:96px;padding:14px 8px 12px;border:none;background:none;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:6px;border-bottom:2px solid transparent;transition:all .2s;position:relative;color:var(--ink-soft);text-decoration:none}
.flag-tab:hover{color:var(--ink);background:linear-gradient(180deg,transparent,rgba(0,0,0,0.02))}
.flag-tab.active{color:var(--ink);border-bottom-color:var(--accent)}
.flag-tab .flag-icon{width:26px;height:19px;filter:saturate(0.92);transition:transform .25s ease}
.flag-tab:hover .flag-icon{transform:translateY(-2px)}
.flag-tab.active .flag-icon{filter:saturate(1.05)}
.flag-tab .label{font-size:9.5px;letter-spacing:0.14em;text-transform:uppercase;font-weight:500;text-align:center;line-height:1.3}
.flag-tab .alert-dot{position:absolute;top:10px;right:14px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.flag-tab.home{flex:0 0 auto;min-width:auto;padding:14px 18px}

/* ════ HERO ════ */
.hero{max-width:1480px;margin:0 auto;padding:48px 36px 24px}
.hero-eyebrow{font-size:11px;letter-spacing:0.32em;color:var(--accent);text-transform:uppercase;font-weight:600;margin-bottom:14px}
.hero-title{font-family:var(--font-serif);font-size:54px;font-weight:400;line-height:1.05;letter-spacing:-0.015em;color:var(--ink);margin-bottom:18px;max-width:1000px}
.hero-title em{font-style:italic;color:var(--accent);font-weight:500}
.hero-sub{font-size:15px;color:var(--ink-soft);max-width:760px;line-height:1.7}
.hero-meta{margin-top:34px;display:flex;flex-wrap:wrap;gap:0;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
.hero-stat{flex:1 1 0;min-width:160px;padding:18px 24px;border-right:1px solid var(--line-soft)}
.hero-stat:last-child{border-right:none}
.hero-stat .num{font-family:var(--font-serif);font-size:34px;font-weight:500;color:var(--ink);line-height:1}
.hero-stat .num em{color:var(--accent);font-style:normal}
.hero-stat .lbl{font-size:10px;letter-spacing:0.2em;color:var(--ink-soft);margin-top:6px;text-transform:uppercase;font-weight:500}

/* ════ HOME — SECTION TOC CARDS ════ */
.toc{max-width:1480px;margin:0 auto;padding:8px 36px 40px}
.toc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px}
.toc-card{background:#fff;border:1px solid var(--line-soft);padding:26px 26px 22px;text-decoration:none;color:inherit;display:block;transition:all .2s;position:relative}
.toc-card:hover{border-color:var(--line);box-shadow:0 8px 30px -18px rgba(26,35,50,0.18);transform:translateY(-2px)}
.toc-card .n{font-family:var(--font-mono);font-size:11px;letter-spacing:0.2em;color:var(--accent);font-weight:600;margin-bottom:10px}
.toc-card .t{font-family:var(--font-serif);font-size:24px;font-weight:600;color:var(--ink);margin-bottom:10px;line-height:1.2}
.toc-card .d{font-size:12.5px;color:var(--ink-soft);line-height:1.65}
.toc-card .cnt{margin-top:16px;padding-top:12px;border-top:1px dashed var(--line);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink-soft);font-weight:500}

/* ════ SECTION / TABLE (kept for Regimes Especiais overview) ════ */
.section{max-width:1480px;margin:0 auto;padding:32px 36px}
.section-head{margin-bottom:22px;border-top:1px solid var(--line);padding-top:28px;display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:12px}
.section-num{font-family:var(--font-mono);font-size:11px;letter-spacing:0.18em;color:var(--accent);font-weight:500}
.section-title{font-family:var(--font-serif);font-size:32px;font-weight:500;color:var(--ink);line-height:1.1;margin-top:4px}
.section-meta{font-size:11px;letter-spacing:0.2em;text-transform:uppercase;color:var(--ink-soft);font-weight:500}
.tablewrap{border:1px solid var(--line-soft);background:#fff;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:920px}
thead{background:var(--ink);color:rgba(255,255,255,0.92)}
th{padding:14px 16px;text-align:left;font-weight:500;font-size:10px;letter-spacing:0.2em;text-transform:uppercase;font-family:var(--font-sans)}
td{padding:16px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover,tbody tr:focus-visible{background:#faf8f3}
tbody tr:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
tbody tr:last-child td{border-bottom:none}
.t-flag{width:22px;height:16px;margin-right:10px;vertical-align:middle}
.t-name{font-family:var(--font-serif);font-size:17px;font-weight:600;color:var(--ink);display:inline-block;vertical-align:middle}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:10px;padding:4px 9px;border-radius:2px;font-weight:500;letter-spacing:0.05em;text-transform:uppercase;border:1px solid transparent}
.p-ok{background:var(--tag-ok-bg);color:var(--tag-ok-c);border-color:#cbdacd}
.p-changed{background:var(--tag-chg-bg);color:var(--tag-chg-c);border-color:#e6d4a3}
.p-ext{background:var(--tag-ext-bg);color:var(--tag-ext-c);border-color:#dec0c0}
.p-new{background:var(--tag-new-bg);color:var(--tag-new-c);border-color:#bdcadd}
.p-risk{background:var(--tag-risk-bg);color:var(--tag-risk-c);border-color:#cdbed4}

/* ════ COUNTRY DETAIL HERO ════ */
.detail-hero{background:linear-gradient(135deg,#1a2332 0%,#2c3e52 100%);color:#fff;padding:48px 36px 40px;position:relative;overflow:hidden}
.detail-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 90% 20%,rgba(168,94,58,0.18),transparent 50%);pointer-events:none}
.detail-hero-inner{max-width:1480px;margin:0 auto;position:relative;z-index:1;display:grid;grid-template-columns:1fr auto;gap:32px;align-items:end}
.dh-flag{width:72px;height:52px;margin-bottom:14px;filter:drop-shadow(0 4px 12px rgba(0,0,0,0.3))}
.dh-eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:0.3em;color:var(--gold);text-transform:uppercase;font-weight:500;margin-bottom:10px}
.dh-name{font-family:var(--font-serif);font-size:58px;font-weight:400;line-height:1;letter-spacing:-0.02em;color:#fff;margin-bottom:14px}
.dh-back{background:transparent;border:1px solid rgba(255,255,255,0.25);color:#fff;padding:11px 20px;font-size:11px;letter-spacing:0.2em;text-transform:uppercase;font-weight:500;cursor:pointer;font-family:inherit;transition:all .2s;display:inline-flex;align-items:center;gap:10px;text-decoration:none}
.dh-back:hover{background:rgba(255,255,255,0.1);border-color:#fff}
.dh-summary{margin-top:24px;display:flex;gap:0;border-top:1px solid rgba(255,255,255,0.12);padding-top:24px;flex-wrap:wrap}
.dh-stat{flex:1 1 0;min-width:200px;padding-right:30px;border-right:1px solid rgba(255,255,255,0.1);margin-right:30px}
.dh-stat:last-child{border-right:none;margin-right:0;padding-right:0}
.dh-stat .l{font-family:var(--font-mono);font-size:10px;letter-spacing:0.2em;color:rgba(255,255,255,0.5);text-transform:uppercase;margin-bottom:6px}
.dh-stat .v{font-family:var(--font-serif);font-size:19px;color:#fff;font-weight:500;line-height:1.25}

/* COLUMNS */
.detail-body{padding:44px 36px;display:grid;grid-template-columns:1fr 1fr;gap:40px;max-width:1480px;margin:0 auto}
@media(max-width:960px){.detail-body{grid-template-columns:1fr}}
.col-head{font-family:var(--font-serif);font-size:26px;font-weight:500;color:var(--ink);margin-bottom:6px;display:flex;align-items:baseline;gap:12px}
.col-head .num{font-family:var(--font-mono);font-size:11px;color:var(--accent);font-weight:500;letter-spacing:0.2em}
.col-sub{font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:var(--ink-soft);font-weight:500;margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid var(--line)}

/* ════ TOPIC / REGIME CARD (shared) ════ */
.topics-col{max-width:880px}
.regime{background:#fff;border:1px solid var(--line-soft);margin-bottom:24px;padding:26px 28px;transition:all .2s}
.regime:hover{border-color:var(--line);box-shadow:0 8px 30px -18px rgba(26,35,50,0.18)}
.regime-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line-soft)}
.regime-name{font-family:var(--font-serif);font-size:21px;font-weight:600;line-height:1.25;color:var(--ink);flex:1}
.regime-status{font-family:var(--font-mono);font-size:9px;padding:5px 9px;font-weight:500;white-space:nowrap;letter-spacing:0.18em;text-transform:uppercase;border:1px solid;flex-shrink:0;margin-top:3px}
.s-ok{background:var(--tag-ok-bg);color:var(--tag-ok-c);border-color:#cbdacd}
.s-changed{background:var(--tag-chg-bg);color:var(--tag-chg-c);border-color:#e6d4a3}
.s-ext{background:var(--tag-ext-bg);color:var(--tag-ext-c);border-color:#dec0c0}
.s-new{background:var(--tag-new-bg);color:var(--tag-new-c);border-color:#bdcadd}
.s-risk{background:var(--tag-risk-bg);color:var(--tag-risk-c);border-color:#cdbed4}
.s-eyebrow{background:#faf8f3;color:var(--ink-soft);border-color:var(--line-soft)}
.regime-desc{font-size:13.5px;color:var(--ink-2);line-height:1.75;margin-bottom:18px}
.regime-desc strong{color:var(--ink);font-weight:600}
.regime-desc em{color:var(--accent);font-style:italic}
.regime-grid{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-bottom:18px;border-top:1px solid var(--line-soft);border-left:1px solid var(--line-soft)}
.kv{padding:11px 14px;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);background:#faf8f3}
.kv-l{font-family:var(--font-mono);font-size:9px;letter-spacing:0.18em;color:var(--ink-soft);text-transform:uppercase;font-weight:500;margin-bottom:4px}
.kv-v{font-size:13px;font-weight:500;color:var(--ink);font-family:var(--font-sans)}
.regime-legal{font-family:var(--font-mono);font-size:10.5px;line-height:1.6;color:var(--ink-soft);background:#faf8f3;border-left:2px solid var(--line);padding:9px 12px;margin-bottom:16px}
.rg-legal-label{text-transform:uppercase;letter-spacing:0.18em;font-weight:500;color:var(--accent);margin-right:6px}

.rg-block{margin-bottom:18px;padding-top:16px;border-top:1px solid var(--line-soft)}
.rg-block>summary{display:flex;align-items:baseline;justify-content:space-between;gap:12px;cursor:pointer;list-style:none}
.rg-block>summary::-webkit-details-marker,.rg-block>summary::marker{display:none;content:''}
.rg-block>summary:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.rg-block-title{font-family:var(--font-mono);font-size:9.5px;letter-spacing:0.22em;text-transform:uppercase;font-weight:600;color:var(--accent);display:flex;align-items:center;gap:8px}
.rg-acc-caret{flex-shrink:0;color:var(--accent);transition:transform .18s ease;display:inline-block}
.rg-block[open]>summary .rg-acc-caret{transform:rotate(90deg)}
.rg-acc-meta{font-family:var(--font-mono);font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:var(--ink-soft);white-space:nowrap;flex-shrink:0}
.rg-block-content{margin-top:14px}
.rg-block-body{font-size:13px;color:var(--ink-2);line-height:1.75}
.rg-block-body strong{color:var(--ink);font-weight:600}
.rg-block-body em{color:var(--accent);font-style:italic}

.rg-checklist{list-style:none;display:flex;flex-direction:column;gap:9px}
.rg-checklist li{position:relative;padding-left:20px;font-size:13px;line-height:1.7;color:var(--ink-2)}
.rg-checklist li::before{content:'';position:absolute;left:3px;top:8px;width:6px;height:6px;border:1px solid var(--accent)}
.rg-checklist strong{color:var(--ink);font-weight:600}

.rg-steps{list-style:none;counter-reset:rgstep;display:flex;flex-direction:column;gap:14px}
.rg-steps li{counter-increment:rgstep;position:relative;padding-left:30px}
.rg-steps li::before{content:counter(rgstep,decimal-leading-zero);position:absolute;left:0;top:1px;font-family:var(--font-mono);font-size:10px;font-weight:500;color:var(--accent);letter-spacing:0.06em}
.rg-step-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:3px}
.rg-step-name{font-size:13px;font-weight:600;color:var(--ink);line-height:1.4}
.rg-step-timing{font-family:var(--font-mono);font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink-soft);background:#faf8f3;border:1px solid var(--line-soft);padding:3px 7px;white-space:nowrap;flex-shrink:0}
.rg-step-detail{font-size:12.5px;line-height:1.7;color:var(--ink-2)}
.rg-step-detail strong{color:var(--ink);font-weight:600}

.rg-costs{border-top:1px solid var(--line-soft)}
.rg-cost-row{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.rg-cost-item{font-size:12.5px;color:var(--ink-2);line-height:1.5}
.rg-cost-value{font-family:var(--font-mono);font-size:12px;font-weight:500;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums;line-height:1.5}
.rg-cost-note{grid-column:1/-1;font-size:9.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink-soft);font-weight:400;line-height:1.6;margin-top:4px}

.brazil-box{border-left:2px solid var(--green);padding:14px 18px;margin-bottom:14px;background:#eef3ef}
.brazil-box .l{font-family:var(--font-mono);font-size:9px;letter-spacing:0.22em;text-transform:uppercase;color:var(--green);font-weight:600;margin-bottom:6px}
.brazil-box .t{font-size:13px;color:var(--ink-2);line-height:1.7}
.brazil-box .t strong{color:var(--ink);font-weight:600}
.impact-box{border-left:2px solid var(--blue);padding:14px 18px;margin-bottom:14px;background:#f4f6fa}
.impact-box .l{font-family:var(--font-mono);font-size:9px;letter-spacing:0.22em;text-transform:uppercase;color:var(--blue);font-weight:600;margin-bottom:6px}
.impact-box .t{font-size:13px;color:var(--ink-2);line-height:1.7}
.warn-box{border-left:2px solid var(--amber);padding:14px 18px;margin-bottom:14px;background:#fbf6e8}
.warn-box .l{font-family:var(--font-mono);font-size:9px;letter-spacing:0.22em;text-transform:uppercase;color:var(--amber);font-weight:600;margin-bottom:6px}
.warn-box .t{font-size:13px;color:var(--ink-2);line-height:1.7}
.src-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.src-link{font-family:var(--font-mono);font-size:10px;color:var(--ink-soft);text-decoration:none;letter-spacing:0.05em;display:inline-flex;align-items:center;gap:5px;border-bottom:1px solid transparent;padding-bottom:1px}
.src-link:hover{color:var(--accent);border-bottom-color:var(--accent)}

/* ════ FOOTER ════ */
.footer{margin-top:60px;padding:32px 36px;border-top:1px solid var(--line);background:#fff}
.footer-inner{max-width:1480px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink-soft);font-weight:500}
.footer-legend{display:flex;gap:18px;flex-wrap:wrap}
.leg-item{display:inline-flex;align-items:center;gap:7px}
.leg-dot{width:8px;height:8px;border-radius:50%}
.ld-ok{background:var(--green)}
.ld-chg{background:var(--amber)}
.ld-ext{background:var(--accent)}
.ld-new{background:var(--blue)}
.ld-risk{background:var(--purple)}

.fadein{animation:fade .35s ease both}

<script>
/* ════════════════════ DATA ════════════════════ */
const SOC = {"sectionId":"sociedades","sectionTitle":"Sociedades","sectionSubtitle":"Estruturas societárias offshore usadas em planejamento patrimonial internacional — natureza jurídica, documentos constitutivos, regras de substância e transparência, e sua interação com a legislação brasileira.","topics":[{"name":"LLC americana (Limited Liability Company)","eyebrow":"Estados Unidos · Entidade Híbrida","legalBasis":"Direito estadual (ex.: Delaware Limited Liability Company Act, 6 Del. C. § 18-101 e ss.; Wyoming Limited Liability Company Act, Wyo. Stat. § 17-29-101 e ss.); tratamento fiscal federal por Treasury Regulations § 301.7701-2 e § 301.7701-3 (\"check-the-box\")","desc":"A LLC (Limited Liability Company) é uma criatura do direito estadual americano, sem correspondente direto no direito brasileiro: combina a responsabilidade limitada típica de uma sociedade de capital com a flexibilidade contratual e a possibilidade de tratamento fiscal \"passthrough\" típica de uma sociedade de pessoas. Não existe uma \"LLC Act\" federal — cada estado tem sua própria lei, e a entidade é regida pela lei do estado de constituição independentemente de onde opere.\n\nPara fins fiscais federais nos EUA, a classificação da LLC não é automática: sob o regime <em>check-the-box</em> (Treasury Regulations § 301.7701-3, em vigor desde 1º de janeiro de 1997), uma LLC com um único sócio (\"member\") é, por padrão, uma <strong>disregarded entity</strong> — a Receita americana (IRS) simplesmente ignora a existência da entidade e trata as suas operações como se fossem do próprio titular. Uma LLC com dois ou mais sócios é, por padrão, tratada como <strong>partnership</strong> (sociedade de pessoas, tributada nos sócios, não na entidade). Em ambos os casos, é possível eleger tributação como corporation (Form 8832) ou, cumpridos requisitos, como S-Corporation (Form 2553) — mas essa eleição, uma vez feita, normalmente não pode ser alterada novamente nos 60 meses seguintes.","kv":[{"l":"Natureza","v":"Híbrida: capital + pessoas"},{"l":"Tributação padrão (1 sócio)","v":"Disregarded entity"},{"l":"Tributação padrão (2+ sócios)","v":"Partnership"},{"l":"Documento constitutivo","v":"Articles / Certificate of Organization"},{"l":"Contrato de governança","v":"Operating Agreement"},{"l":"Estados mais usados","v":"Delaware, Wyoming, Nevada"}],"requirements":["Nomeação de registered agent no estado de constituição","Certificate/Articles of Organization arquivado no Secretary of State","Operating Agreement (não é sempre exigido por lei, mas é o documento que efetivamente rege a entidade)","EIN (Employer Identification Number) junto ao IRS para abertura de conta bancária e cumprimento de obrigações fiscais","Formulário 8832 caso se deseje eleição de classificação fiscal diversa da padrão"],"sections":[{"title":"Por que Delaware, Wyoming e Nevada","body":"<strong>Delaware</strong> é o estado dominante para LLCs que servem a estruturas de investimento e holding, por conta do seu corpo jurisprudencial extenso (Court of Chancery, tribunal especializado em direito societário) e da flexibilidade contratual do Delaware LLC Act, que permite ao Operating Agreement praticamente reescrever as regras supletivas da lei. O Certificate of Formation de Delaware não exige a listagem de members ou managers, o que confere um grau relevante de privacidade em nível estadual — a informação de titularidade não fica em registro público estadual (ainda que, para fins fiscais brasileiros e de compliance bancário/AML americano, isso não afaste o dever de identificação do beneficiário final perante o banco e, potencialmente, perante o Financial Crimes Enforcement Network — FinCEN).\n\n<strong>Wyoming</strong> foi o primeiro estado americano a criar a LLC (1977) e mantém legislação favorável a holdings e a ativos digitais, com custos de manutenção tipicamente mais baixos que Delaware e sem imposto de renda estadual.\n\n<strong>Nevada</strong> também não tributa renda no nível estadual e oferece proteção patrimonial (asset protection) considerada robusta, com regras de \"charging order\" como remédio exclusivo do credor de um member em determinadas hipóteses. A escolha entre os três depende do uso pretendido (holding de participações, veículo operacional, titularidade de imóveis) e deve ser feita com aconselhamento fiscal e societário americano específico."},{"title":"Governança: members e managers","body":"A LLC pode ser <em>member-managed</em> (todos os sócios participam diretamente da administração) ou <em>manager-managed</em> (a administração é delegada a um ou mais managers, que podem ou não ser sócios). Essa escolha, os direitos econômicos e políticos de cada classe de participação, as regras de transferência de quotas (\"membership interests\"), de distribuição de resultados e de dissolução são todas definidas contratualmente no Operating Agreement — documento que, na maioria dos estados, não é arquivado publicamente. Essa flexibilidade é o que torna a LLC um veículo tão versátil em wealth planning: pode ser desenhada para funcionar como holding familiar, como veículo de co-investimento entre gerações, ou como estrutura de detenção de ativo único (imóvel, participação societária, obra de arte, iate)."}],"brazilNote":"Sob a Lei nº 14.754, de 12 de dezembro de 2023, em vigor desde 1º de janeiro de 2024, pessoa física residente fiscal no Brasil que controle entidade no exterior está sujeita ao regime de <strong>transparência fiscal (regra antidiferimento)</strong>: os lucros apurados pela entidade controlada no exterior em 31 de dezembro de cada ano são automaticamente tributados no Brasil à alíquota de 15%, no ajuste anual, independentemente de distribuição efetiva. A lei também prevê a possibilidade de o contribuinte optar, de forma irrevogável e entidade a entidade, pelo <strong>tratamento transparente</strong>, no qual os ativos, direitos e rendimentos da controlada no exterior são declarados diretamente pela pessoa física como se detidos por ela — regime regulamentado pela Instrução Normativa RFB nº 2.180/2024.\n\nO ponto de atenção prático é que uma LLC americana unipessoal, embora seja \"disregarded entity\" para o IRS (isto é, invisível para o fisco americano), <strong>não é automaticamente transparente para o fisco brasileiro</strong>: a Lei 14.754/2023 e a IN RFB 2.180/2024 tratam a entidade controlada segundo seus próprios critérios de \"controle\" e de classificação (o conceito brasileiro de entidade controlada no exterior é definido pela lei doméstica, não pela classificação fiscal americana). Na prática, boa parte da doutrina e das consultorias tributárias tem apontado que, para o titular de LLC unipessoal desregardada, a opção pela transparência da Lei 14.754/2023 tende a alinhar o tratamento brasileiro à realidade econômica da entidade (já que nos EUA ela já é ignorada), mas a análise deve ser feita caso a caso, considerando o tipo de ativo detido, a existência de sócios adicionais e a eventual incidência de outras regras (ex.: bens imóveis americanos detidos por meio de LLC, e tributação de sucessão americana — estate tax — sobre não residentes). [VERIFICAR: posicionamento formal e atualizado da Receita Federal sobre o enquadramento específico de single-member LLC disregarded como \"entidade controlada\" para fins do art. 8º da Lei 14.754/2023, para além do que consta na IN RFB 2.180/2024 e no documento de Perguntas e Respostas da Receita Federal.]","sources":[{"t":"IRS — Treas. Reg. § 301.7701-3, Classification of certain business entities (check-the-box)","u":"https://www.irs.gov/irm/part5/irm_05-001-021"},{"t":"Delaware Limited Liability Company Act — Delaware Code Title 6, Ch. 18","u":"https://delcode.delaware.gov/title6/c018/"},{"t":"Wyoming Limited Liability Company Act — Wyo. Stat. Title 17, Ch. 29","u":"https://wyoleg.gov/statutes/compress/title17.pdf"},{"t":"Planalto — Lei nº 14.754, de 12 de dezembro de 2023","u":"https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2023/lei/l14754.htm"},{"t":"Receita Federal — Instrução Normativa RFB nº 2.180/2024 (Perguntas e Respostas)","u":"https://www.gov.br/fazenda/pt-br/acesso-a-informacao/perguntas-frequentes/tributacao-offshore/29-4-24-perguntas-e-respostas-offshores-lei-14-754-e-in-rfb-2-180.pdf"}]},{"name":"BVI Business Company","eyebrow":"Ilhas Virgens Britânicas · PIC Clássica","legalBasis":"BVI Business Companies Act, 2004 (No. 16 of 2004), conforme sucessivas emendas — última consolidação relevante em vigor desde 2 de janeiro de 2025; Beneficial Ownership Secure Search System Act, 2017 (\"BOSS Act\"); Economic Substance (Companies and Limited Partnerships) Act, 2018, conforme emendado em 2021","desc":"A BVI Business Company (BC) é a estrutura societária offshore mais difundida globalmente, sucessora da antiga International Business Company (IBC) após a unificação promovida pela BVI Business Companies Act, 2004, que revogou o regime dual anterior. É constituída como companhia limitada por ações (o formato mais comum em wealth planning), podendo também ser limitada por garantia, ilimitada, ou híbrida.\n\nA companhia é registrada junto ao BVI Registry of Corporate Affairs por meio de um <strong>registered agent</strong> licenciado nas Ilhas Virgens Britânicas — pessoa física não pode constituir uma BC diretamente; a lei exige a intermediação de um agente registrado autorizado pela BVI Financial Services Commission (FSC), responsável por due diligence de cliente (KYC/AML) e pela manutenção de registros estatutários mínimos.","kv":[{"l":"Documento constitutivo","v":"Memorandum and Articles of Association"},{"l":"Registro de sócios","v":"Register of Members — privado, arquivado no Registry desde jan/2025"},{"l":"Registro de diretores","v":"Register of Directors — privado, não acessível ao público"},{"l":"Agente registrado","v":"Obrigatório (BVI Registered Agent licenciado)"},{"l":"Escritório registrado","v":"Obrigatório (endereço físico na BVI, mantido pelo agente)"},{"l":"Beneficiário final","v":"BOSS System — acesso restrito, não público"}],"requirements":["Registered agent licenciado na BVI","Registered office na BVI (endereço físico, tipicamente o do próprio agente)","Memorandum and Articles of Association arquivados no Registry","Register of Members mantido internamente e, desde as emendas em vigor a partir de 2 de janeiro de 2025, arquivado de forma privada junto ao Registrar","Register of Directors arquivado de forma privada junto ao Registrar em até 14 dias da nomeação de diretor","Informação de beneficiário final submetida ao agente registrado para alimentar o BOSS System","Annual return / avaliação anual de economic substance quando a companhia exercer relevant activity"],"sections":[{"title":"Sigilo dos registros societários","body":"A BVI historicamente construiu sua reputação sobre o sigilo dos registros de sócios e diretores. Com as emendas à Business Companies Act em vigor desde 2 de janeiro de 2025, o Register of Members passou a ser obrigatoriamente arquivado junto ao Registrar de forma privada — seguindo o mesmo modelo já aplicado ao Register of Directors havia alguns anos. Isso significa que a informação passa a existir centralizada no órgão regulador, mas <strong>continua não acessível ao público</strong>: não há um portal de busca pública de sócios ou diretores de companhias BVI, ao contrário do que ocorre, por exemplo, no registro de diretores das Bahamas.\n\nA justificativa oficial dessas mudanças é o alinhamento a padrões internacionais de transparência definidos pelo Global Forum on Transparency and Exchange of Information for Tax Purposes e pelo GAFI/FATF — ou seja, a informação fica mais acessível a autoridades e trocas de informação bilaterais/multilaterais, sem se tornar pública."},{"title":"Substância econômica (Economic Substance Act)","body":"A Economic Substance (Companies and Limited Partnerships) Act, 2018, com emendas relevantes em vigor desde 30 de junho de 2021, exige que toda companhia e limited partnership constituída na BVI avalie anualmente se exerce uma \"relevant activity\" (holding business, banking, insurance, fund management, financing and leasing, headquartering, shipping, distribution and service centre business, ou intellectual property business, entre outras). Companhias puramente passivas de holding de participações (pure equity holding entities) estão sujeitas a um teste de substância reduzido; companhias que exercem relevant activity operacional devem demonstrar direção e gestão efetivas na BVI, atividades geradoras de renda essenciais (CIGA) conduzidas localmente, e pessoal, despesa e presença física adequados no território. A partir da emenda de 2021, fundos de investimento (investment fund business) foram expressamente excluídos do conceito de relevant activity, embora a atividade de gestão de fundos (fund management business) permaneça dentro do escopo."}],"warning":"A ausência de substância econômica adequada em companhia que exerça relevant activity pode resultar em sanções, troca automática de informação com a jurisdição de residência fiscal dos beneficiários finais e, em casos extremos, dissolução compulsória (strike-off) da companhia.","sources":[{"t":"BVI Financial Services Commission — BVI Business Companies Act (Revised Edition, texto consolidado)","u":"https://www.bvifsc.vg/sites/default/files/bvi_business_companies_act.pdf"},{"t":"BVI Financial Services Commission — Beneficial Ownership Secure Search System Act (Revised Edition)","u":"https://www.bvifsc.vg/sites/default/files/beneficial_ownership_secure_search_system_act.pdf"},{"t":"Harneys — Latest amendments to the BVI Business Companies Act 2004","u":"https://www.harneys.com/insights/latest-amendments-to-the-bvi-business-companies-act-2004/"},{"t":"Conyers — Ten Things You Need To Know About BVI Economic Substance","u":"https://www.conyers.com/publications/view/ten-things-you-need-to-know-about-bvi-economic-substance/"}]},{"name":"Cayman Islands Exempted Company","eyebrow":"Ilhas Cayman · PIC Institucional","legalBasis":"Companies Act (Cayman Islands), consolidação periodicamente revisada (última consolidação identificada: Companies Act, 2026 Revision); Beneficial Ownership Transparency Act, 2023, e Beneficial Ownership Transparency Regulations, 2024 (em vigor desde 31 de julho de 2024); International Tax Co-operation (Economic Substance) Act, consolidação periodicamente revisada","desc":"A Exempted Company é a forma societária cayman mais utilizada tanto para veículos de investimento institucional (fundos, SPVs de private equity) quanto para PICs de wealth planning. \"Exempted\" refere-se à isenção de determinadas obrigações aplicáveis a companhias domésticas (ordinary companies) — em contrapartida, a exempted company está proibida de exercer negócios com o público nas Ilhas Cayman e de deter imóveis localmente sem licença.\n\nA companhia é constituída por meio de Memorandum and Articles of Association registrados junto ao Registrar of Companies (Cayman Islands General Registry), e deve manter um <strong>registered office</strong> nas Ilhas Cayman, tipicamente fornecido por um corporate service provider licenciado.","kv":[{"l":"Documento constitutivo","v":"Memorandum and Articles of Association"},{"l":"Registro de sócios","v":"Register of Members — privado, mantido no registered office"},{"l":"Registro de diretores/officers","v":"Lista de diretores correntes arquivada e consultável mediante taxa; registro completo mantido privadamente no registered office"},{"l":"Escritório registrado","v":"Obrigatório (registered office nas Ilhas Cayman)"},{"l":"Beneficiário final","v":"Beneficial Ownership Register (BOR) — privado, plataforma centralizada"}],"requirements":["Registered office nas Ilhas Cayman, mantido por provedor de serviços licenciado","Memorandum and Articles of Association arquivados no Registrar of Companies","Register of Members mantido no registered office (não arquivado publicamente para exempted companies)","Register of Directors, Alternate Directors and Officers mantido no registered office","Lista de diretores correntes disponível para consulta pública mediante taxa nominal junto ao Registrar","Beneficial Ownership Register (BOR) estabelecido e mantido, salvo elegibilidade a rota alternativa (Contact Person / regimes de isenção)","Avaliação anual de economic substance quando exercida relevant activity"],"sections":[{"title":"Sigilo dos registros — a distinção entre Register of Members e Register of Directors","body":"Nas Ilhas Cayman, o Register of Members de uma exempted company não é público e não é arquivado no Registrar — permanece no registered office, sujeito às restrições de inspeção que os próprios Articles da companhia estabelecerem. Já o Register of Directors, Alternate Directors and Officers segue lógica distinta: a lista de diretores correntes (nome e, quando aplicável, cargo) é arquivada junto ao Registrar e pode ser objeto de inspeção física pelo público mediante pagamento de taxa nominal — ainda que o registro completo, mantido no registered office, permaneça de acesso restrito, sujeito a autorização do conselho ou dos próprios Articles."},{"title":"Beneficial Ownership Transparency Act, 2023","body":"A partir de 31 de julho de 2024, a Beneficial Ownership Transparency Act, 2023, e seu regulamento consolidaram e substituíram o regime anterior de beneficial ownership (que estava disperso em legislações específicas por tipo de entidade). Entidades classificadas como \"legal persons\" sob a lei devem instruir seu corporate service provider a estabelecer e manter um beneficial ownership register (BOR) privado no registered office, identificando e mantendo atualizada a informação de titularidade final. O BOR é centralizado eletronicamente e não é público — o acesso é reservado ao Registrar (por iniciativa própria ou a pedido de autoridades regulatórias específicas). Desde 28 de fevereiro de 2025, terceiros podem requerer acesso pontual a informação de beneficiário final de uma legal person específica sob o regime de \"legitimate interest access\", mediante comprovação de vínculo da consulta com investigação de lavagem de dinheiro ou financiamento ao terrorismo — mecanismo análogo ao previsto na 5ª Diretiva Antibranqueamento da União Europeia, mas de aplicação restrita e sujeita a requisitos probatórios."}],"sources":[{"t":"Cayman Islands Government — Companies Act (2026 Revision), texto consolidado","u":"https://gov.ky/documents/35692/0/Companies+Act+(2026+Revision),.pdf/345cf168-32c9-8b07-c7f3-1e645b076320?t=1769711733775"},{"t":"Cayman Islands Monetary Authority — Beneficial Ownership Transparency Act, 2023 (Act 13 of 2023)","u":"https://www.cima.ky/upimages/lawsregulations/BeneficialOwnershipTransparencyAct,2023_1705419742.pdf"},{"t":"Cayman Islands General Registry — Companies Register FAQ","u":"https://www.ciregistry.ky/faq_category/companies-register/"},{"t":"Cayman Islands Government — International Tax Co-operation (Economic Substance) Act","u":"https://gov.ky/documents/35692/0/International+Tax+Co-operation+(Economic+Substance)+Act+(2026+Revision),+.pdf/099118d2-c42f-65b8-6d98-cb5f43cd4ad9?t=1770320165001"}]},{"name":"Bahamas International Business Company (IBC)","eyebrow":"Bahamas · PIC Tradicional","legalBasis":"International Business Companies Act, 2000 (Ch. 309 das Leis das Bahamas), conforme emendado; Register of Beneficial Ownership Act, 2018; Commercial Entities (Substance Requirements) Act, 2018 (\"CESRA\"), em vigor desde 31 de dezembro de 2018","desc":"A Bahamas IBC é o veículo offshore tradicional das Bahamas, regido pela International Business Companies Act, 2000, que substituiu e modernizou a legislação anterior de 1989. É constituída por meio de Memorandum and Articles of Association registrados junto à Registrar General's Department (Companies Registry) das Bahamas, mediante intermediação de um agente registrado licenciado.\n\nUma característica distintiva da Bahamas IBC frente a BVI e Cayman é que a <strong>lista de diretores e officers é, por força de lei, matéria de registro público</strong>: deve ser arquivada no Companies Registry em até doze meses da nomeação (e qualquer alteração, em igual prazo), sob pena de a companhia estar sujeita a strike-off, e é aberta à inspeção pelo público em horário de expediente.","kv":[{"l":"Documento constitutivo","v":"Memorandum and Articles of Association"},{"l":"Registro de sócios/acionistas","v":"Register of Members — privado, mantido pelo registered agent"},{"l":"Registro de diretores/officers","v":"Register of Directors and Officers — PÚBLICO, arquivado no Companies Registry"},{"l":"Agente registrado","v":"Obrigatório (registered agent licenciado nas Bahamas)"},{"l":"Beneficiário final","v":"Register of Beneficial Ownership — sigiloso, acesso restrito a autoridades"}],"requirements":["Registered agent licenciado nas Bahamas","Registered office nas Bahamas","Memorandum and Articles of Association arquivados no Companies Registry","Register of Directors and Officers arquivado no Companies Registry em até 12 meses da nomeação, e mantido publicamente consultável","Register of Members mantido pelo registered agent, sem publicidade equivalente à dos diretores","Informação de beneficiário final submetida ao sistema seguro de busca sob a Register of Beneficial Ownership Act, 2018","Avaliação de substância econômica sob a CESRA quando exercida relevant activity, salvo se a entidade for tax resident fora das Bahamas e centralmente gerida e controlada no exterior"],"sections":[{"title":"A exceção de publicidade dos diretores — implicação prática","body":"Diferentemente da BVI e de Cayman, onde a informação de diretores é mantida em sigilo (ou de acesso restrito mediante taxa, no caso cayman), nas Bahamas a identidade de diretores e officers é, desde a reforma legislativa da IBC Act, matéria de registro público. Esse é um ponto de atenção relevante ao estruturar wealth planning: para famílias que priorizam privacidade, é comum não indicar o beneficiário final como diretor pessoa física da IBC, optando por diretores corporativos ou profissionais (corporate directors / nominee directors fornecidos pelo registered agent), mantendo a titularidade econômica e o controle por meio de instrumentos privados (acordo de acionistas, procurações, e a própria estrutura de Register of Members, que não tem o mesmo grau de publicidade)."},{"title":"Register of Beneficial Ownership Act, 2018","body":"A Register of Beneficial Ownership Act, 2018, estabeleceu um sistema de busca segura (\"secure search system\") administrado pelo Attorney-General's Office como autoridade competente, no qual cada registered agent carrega a informação de beneficiário final das entidades sob sua responsabilidade. O registro <strong>não é acessível ao público</strong>: apenas pessoas designadas de autoridades regulatórias específicas — Attorney General's Office, Financial Intelligence Unit, Central Bank of The Bahamas, Compliance Commission e Securities Commission — podem, mediante autorização e a partir de local seguro designado, realizar buscas no sistema."}],"sources":[{"t":"Government of The Bahamas — International Business Companies Act, 2000 (Ch. 309), texto consolidado","u":"http://laws.bahamas.gov.bs/cms/images/LEGISLATION/PRINCIPAL/2000/2000-0045/2000-0045_2.pdf"},{"t":"Government of The Bahamas — Register of Beneficial Ownership Act, 2018","u":"https://laws.bahamas.gov.bs/cms/images/LEGISLATION/PRINCIPAL/2018/2018-0038/2018-0038_1.pdf"},{"t":"Bahamas Financial Services Board — texto da IBC Act (chapter 309)","u":"https://bfsb-bahamas.com/legislation/IBC_Act.pdf"},{"t":"Office of the Attorney General (Bahamas) — Register of Beneficial Ownership Act, filing","u":"https://www.oag.gov.bs/notices/the-register-of-beneficial-ownership-act"}]},{"name":"Comparativo de documentos societários e sigilo","eyebrow":"Quadro Comparativo · BVI · Cayman · Bahamas · LLC (EUA)","legalBasis":"Consolidação comparativa a partir da legislação primária de cada jurisdição (ver fontes de cada tópico acima)","desc":"Os documentos que \"rodam\" cada uma dessas estruturas cumprem funções equivalentes, mas divergem significativamente quanto à publicidade e ao órgão que os mantém. O quadro abaixo resume, para cada jurisdição, quem mantém cada registro e o grau de acesso de terceiros — informação central para decidir qual estrutura melhor atende à necessidade de sigilo versus custo de compliance de cada família.","kv":[{"l":"BVI — Register of Members","v":"Privado, arquivado no Registrar (desde jan/2025)"},{"l":"BVI — Register of Directors","v":"Privado, arquivado no Registrar"},{"l":"BVI — Beneficiário final (BOSS)","v":"Não público; acesso restrito a autoridades designadas"},{"l":"Cayman — Register of Members","v":"Privado, mantido no registered office, não arquivado no Registrar"},{"l":"Cayman — Register of Directors/Officers","v":"Lista corrente consultável no Registrar mediante taxa; registro completo privado no registered office"},{"l":"Cayman — Beneficiário final (BOR)","v":"Não público; acesso via Registrar e legitimate interest access (desde fev/2025)"},{"l":"Bahamas — Register of Members","v":"Privado, mantido pelo registered agent"},{"l":"Bahamas — Register of Directors/Officers","v":"PÚBLICO, arquivado e consultável no Companies Registry"},{"l":"Bahamas — Beneficiário final","v":"Não público; acesso restrito a autoridades designadas"},{"l":"LLC (EUA, ex. Delaware)","v":"Members/managers não constam do Certificate arquivado; Operating Agreement é privado"}],"sections":[{"title":"Equivalência funcional dos documentos constitutivos","body":"Em todas as três jurisdições offshore, o documento constitutivo é o <strong>Memorandum and Articles of Association</strong> (ou, na estrutura mais recente permitida em algumas reformas, um documento único de Articles) — funcionalmente equivalente ao Contrato Social/Estatuto Social brasileiro. Na LLC americana, esse papel é dividido entre o Certificate/Articles of Organization (arquivado publicamente, com conteúdo mínimo) e o Operating Agreement (documento privado, que de fato rege a relação entre os sócios) — uma divisão que não tem paralelo direto nas estruturas societárias de common law offshore, em que Memorandum and Articles cumprem ambas as funções em um único documento arquivado."},{"title":"Leitura do quadro para fins de wealth planning","body":"Do ponto de vista de sigilo perante terceiros privados (não autoridades), a ordem de discrição, da mais alta para a mais baixa, é aproximadamente: <strong>LLC americana (Delaware/Wyoming/Nevada)</strong> e <strong>BVI</strong> — nenhuma informação de titularidade ou administração consta de registro público — seguidas de <strong>Cayman</strong> — apenas a lista de diretores correntes é consultável mediante taxa — e, por último, <strong>Bahamas</strong>, onde diretores e officers são, por lei, matéria pública. Em nenhuma das quatro estruturas o beneficiário final é publicamente acessível: em todas, a informação de titularidade última é mantida em sistema de acesso restrito a autoridades. Essa hierarquia não deve ser o único critério de escolha de jurisdição — custo de manutenção, exigências de substância econômica, rede de acordos de troca de informação e o perfil do ativo a ser detido (imóvel, participação operacional, carteira de investimentos) pesam tanto quanto o grau de sigilo."}],"sources":[{"t":"Harneys — Latest amendments to the BVI Business Companies Act 2004","u":"https://www.harneys.com/insights/latest-amendments-to-the-bvi-business-companies-act-2004/"},{"t":"Cayman Islands General Registry — Directors & Officers FAQ","u":"https://www.ciregistry.ky/faq_category/directors-officers/"},{"t":"International Business Companies Act, 2000 (Bahamas), Ch. 309","u":"http://laws.bahamas.gov.bs/cms/images/LEGISLATION/PRINCIPAL/2000/2000-0045/2000-0045_2.pdf"},{"t":"Delaware Limited Liability Company Act — Delaware Code Title 6, Ch. 18","u":"https://delcode.delaware.gov/title6/c018/"}]},{"name":"Cisão societária (corporate split / demerger) em planejamento patrimonial","eyebrow":"Reorganização Societária · Brasil e Offshore","legalBasis":"Lei nº 6.404/1976 (Lei das S.A.), arts. 229 e 230, aplicável subsidiariamente às sociedades limitadas por força do art. 1.053, parágrafo único, do Código Civil; BVI Business Companies Act, 2004, Parte IX (fusão, consolidação, arrangements) e Parte X (continuation); Cayman Islands Companies Act (consolidação em vigor), Parte V (mergers, consolidations e schemes of arrangement)","desc":"A cisão é, no direito brasileiro, a operação pela qual uma companhia transfere parcelas do seu patrimônio para uma ou mais sociedades, constituídas para esse fim ou já existentes (art. 229, Lei 6.404/1976). É <strong>total</strong> quando todo o patrimônio é vertido, extinguindo-se a sociedade cindida, ou <strong>parcial</strong> quando apenas parte do patrimônio é transferida, subsistindo a sociedade cindida com capital reduzido. A sociedade que absorve o patrimônio sucede a cindida nos direitos e obrigações relacionados no ato de cisão — e, na cisão com extinção, todas as sucessoras respondem solidariamente pelas obrigações não expressamente relacionadas, na proporção do patrimônio líquido recebido.\n\nEm planejamento patrimonial, a cisão é empregada primariamente para <strong>segregar patrimônio e isolar risco</strong>: separar ativos operacionais (sujeitos a risco de negócio) de ativos financeiros e imobiliários de longo prazo (que se deseja proteger e destinar à sucessão), ou separar patrimônio entre ramos familiares distintos antes de uma sucessão, evitando que herdeiros fiquem em condomínio forçado sobre a integralidade dos bens. É também instrumento comum para preparar uma estrutura para doação com reserva de usufruto (ver tópico específico) ou para viabilizar a saída de um sócio sem liquidação de toda a sociedade.","kv":[{"l":"Base legal (Brasil)","v":"Lei 6.404/1976, arts. 229-230"},{"l":"Aplicação a limitadas","v":"Por remissão do art. 1.053, § único, CC"},{"l":"Cisão total","v":"Extingue a sociedade cindida"},{"l":"Cisão parcial","v":"Sociedade cindida subsiste, capital reduzido"},{"l":"Sucessão de obrigações","v":"Conforme ato de cisão; solidariedade na extinção"},{"l":"Mecanismo BVI/Cayman equivalente","v":"Scheme of arrangement / merger-consolidation; sem \"cisão\" nominal"}],"sections":[{"title":"Mecanismos análogos nas jurisdições offshore","body":"Nem a BVI nem Cayman possuem um instituto nominalmente idêntico à \"cisão\" brasileira — a técnica de common law para reorganizações patrimoniais equivalentes é normalmente estruturada por meio de <strong>redução de capital com distribuição em espécie (capital reduction / distribution in specie)</strong> de ativos para uma nova subsidiária ou companhia irmã, seguida ou não de um <strong>scheme of arrangement</strong> aprovado judicialmente, ou por meio de fusão/consolidação estatutária seguida de nova constituição. A BVI Business Companies Act, 2004, disciplina merger e consolidation na Parte IX (com o mecanismo de scheme of arrangement tratado, conforme o texto consolidado, em conjunto com as disposições sobre continuation) e permite, na Parte X, a <strong>continuation</strong> — redomiciliação da companhia para fora da BVI (ou de fora para dentro), preservando sua personalidade jurídica, o que pode ser combinado com reorganizações de patrimônio para migrar uma estrutura entre jurisdições sem ruptura de continuidade jurídica.\n\nNas Ilhas Cayman, desde a Companies (Amendment) Act 2009, existe mecanismo de <strong>merger e consolidation estatutários</strong> que dispensa aprovação judicial (ao contrário do scheme of arrangement tradicional, que permanece disponível e sujeito a aprovação da Grand Court), permitindo fusões entre companhias cayman e entre companhias cayman e estrangeiras de forma mais célere e barata. A escolha entre scheme of arrangement (com chancela judicial, mais formal e mais robusto para vincular credores minoritários dissidentes) e merger/consolidation estatutário (mais rápido, sem intervenção judicial) depende da complexidade da estrutura e da necessidade de vincular partes não consentâneas."},{"title":"Cisão como preparação para sucessão","body":"Um uso recorrente da cisão em wealth planning brasileiro é preceder a doação de participações societárias com reserva de usufruto: cinde-se a holding original, separando os ativos que se pretende destinar a cada ramo familiar ou a cada finalidade (proteção patrimonial versus liquidez, por exemplo), de modo que a doação subsequente da nua-propriedade das novas sociedades resultantes da cisão possa ser feita de forma segmentada, com regras de governança e de usufruto potencialmente distintas para cada braço patrimonial. Essa técnica também facilita a valoração para fins de ITCMD, ao isolar o patrimônio a ser doado do patrimônio operacional de maior risco ou de composição heterogênea."}],"warning":"A escolha entre scheme of arrangement e merger/consolidation estatutária em BVI/Cayman, assim como a estruturação de uma cisão brasileira que anteceda doação de participações offshore, envolve questões de direito societário estrangeiro e de direito tributário (ganho de capital, ITCMD, e possível incidência de imposto de transmissão nas jurisdições offshore, quando aplicável) que exigem assessoria jurídica local especializada em cada uma das jurisdições envolvidas.","sources":[{"t":"Planalto — Lei nº 6.404, de 15 de dezembro de 1976 (consolidada)","u":"https://www.planalto.gov.br/ccivil_03/leis/l6404consol.htm"},{"t":"Planalto — Código Civil, Lei nº 10.406/2002 (sociedades limitadas)","u":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"t":"BVI Financial Services Commission — BVI Business Companies Act (texto consolidado)","u":"https://www.bvifsc.vg/sites/default/files/bvi_business_companies_act.pdf"},{"t":"Harneys — Continuations and mergers or consolidations involving BVI companies","u":"https://www.harneys.com/insights/continuations-and-mergers-or-consolidations-involving-bvi-companies/"},{"t":"Ogier — Cayman Islands mergers and consolidations","u":"https://www.ogier.com/news-and-insights/insights/cayman-islands-mergers-and-consolidations/"}]},{"name":"Usufruto de participações societárias como instrumento sucessório","eyebrow":"Planejamento Sucessório · Nua-Propriedade e Usufruto","legalBasis":"Código Civil, Lei nº 10.406/2002, arts. 1.390 a 1.411 (usufruto, disposições gerais); direito comparado de common law: instituto do life estate / life interest","desc":"O usufruto é direito real sobre coisa alheia que confere ao usufrutuário o uso e o gozo (fruição) de bem de titularidade de outrem — o nu-proprietário — por prazo determinado ou, mais comumente em planejamento sucessório, de forma vitalícia. O art. 1.390 do Código Civil dispõe que o usufruto pode recair sobre um ou mais bens, móveis ou imóveis, sobre um patrimônio inteiro ou parte dele, abrangendo, no todo ou em parte, os frutos e utilidades — abrangência ampla o suficiente para incluir participações societárias (quotas de sociedade limitada e ações de sociedade anônima).\n\nEm wealth planning, o instrumento clássico é a <strong>doação de participações societárias com reserva de usufruto</strong>: o titular (tipicamente os pais, fundadores do patrimônio) doa a nua-propriedade das quotas ou ações aos herdeiros (tipicamente os filhos), reservando para si, vitaliciamente, o usufruto — que lhe garante o direito aos frutos (dividendos, lucros distribuídos) e, a depender da redação do instrumento e do estatuto/contrato social, o exercício do direito de voto e de outras prerrogativas de gestão, ainda que a titularidade formal (nua-propriedade) já tenha sido transferida.","kv":[{"l":"Base legal","v":"CC/2002, arts. 1.390 a 1.411"},{"l":"Extinção","v":"Morte do usufrutuário (usufruto vitalício)"},{"l":"Objeto","v":"Bem, patrimônio inteiro ou fração — inclui quotas/ações"},{"l":"Instrumento típico","v":"Doação com reserva de usufruto (nua-propriedade ao herdeiro)"},{"l":"Equivalente common law","v":"Life estate / life interest (sem identidade plena)"}],"requirements":["Instrumento de doação com cláusula de reserva de usufruto, lavrado por escritura pública quando exigível","Registro/averbação da transferência de nua-propriedade no livro de registro de ações nominativas (S.A.) ou no contrato social (sociedade limitada)","Definição contratual, no ato de doação e no estatuto/contrato social, de quais prerrogativas societárias (voto, preferência, informação) permanecem com o usufrutuário e quais migram para o nu-proprietário","Avaliação do impacto de ITCMD sobre a nua-propriedade transferida, conforme a legislação do Estado competente"],"sections":[{"title":"Usufruto de quotas e ações na prática societária","body":"A doutrina e a prática de mercado (a começar pela publicação técnica \"Usufruto de quotas na sociedade limitada\") reconhecem que o Código Civil não disciplina em detalhe o exercício do usufruto sobre participações societárias, cabendo ao contrato social ou estatuto (e ao próprio instrumento de instituição do usufruto) definir com precisão a repartição de direitos entre usufrutuário e nu-proprietário — em especial o direito de voto, que nem sempre acompanha automaticamente o usufruto e deve ser expressamente atribuído. Essa lacuna normativa torna a redação cuidadosa do instrumento de doação e do contrato/estatuto social ainda mais determinante do que em outras modalidades de usufruto (por exemplo, sobre bem imóvel), sob pena de litígio entre usufrutuário e nu-proprietário quanto ao alcance de seus respectivos direitos."},{"title":"Correspondência em common law: life estate / life interest","body":"Nas jurisdições de common law relevantes para este material (BVI, Cayman, Bahamas, EUA), não existe um instituto de direito real chamado \"usufruto\" — a figura funcionalmente mais próxima é o <strong>life estate</strong> (ou life interest/life tenancy), no qual uma pessoa (life tenant) detém direito de uso e fruição de um bem por toda a sua vida, com a titularidade plena revertendo a um terceiro (remainderman) por ocasião de sua morte. A relação entre life tenant e remainderman é tradicionalmente tratada, inclusive por manifestações do IRS americano, como uma relação de propriedade direta (property interest), e não como uma relação fiduciária de trust — o que a aproxima estruturalmente do usufruto brasileiro, embora os regimes de direito das coisas de common law e civil law não sejam equivalentes em todos os efeitos (em especial quanto a registro, oponibilidade a terceiros e disciplina de frutos).\n\nNa prática de estruturação de PICs offshore (BVI/Cayman/Bahamas) por famílias brasileiras, o usufruto sobre quotas/ações de holding brasileira normalmente coexiste com — mas não se confunde com — os mecanismos de controle tipicamente empregados na companhia offshore em si, como classes distintas de ações com direitos de voto diferenciados, ou o uso de trust (instituto estranho ao direito brasileiro, mas nativo nas quatro jurisdições de common law aqui tratadas) para deter a companhia offshore, com o settlor/instituidor mantendo prerrogativas equivalentes às de um usufrutuário por meio de carta de desejos (letter of wishes) e da posição de protector. [VERIFICAR: tratamento tributário específico, na legislação brasileira pós-Lei 14.754/2023, da combinação de usufruto sobre holding nacional com trust estrangeiro detentor de PIC offshore — cenário de sobreposição de regimes que exige análise tributária dedicada e não está coberto com precisão suficiente pelas fontes primárias consultadas nesta pesquisa.]"}],"brazilNote":"O usufruto sobre participações societárias é frequentemente combinado, no planejamento sucessório brasileiro, com a doação da nua-propriedade de quotas/ações de uma holding patrimonial nacional que, por sua vez, detém a PIC offshore — de modo que a mecânica sucessória (usufruto/nua-propriedade) opera inteiramente sob o direito brasileiro, na holding nacional, enquanto a estrutura offshore permanece um nível abaixo, sob controle indireto da holding. Isso evita a necessidade de replicar o instituto do usufruto — que não existe nativamente nas jurisdições de common law aqui tratadas — diretamente sobre as ações da companhia offshore.","sources":[{"t":"Planalto — Código Civil, Lei nº 10.406/2002 (usufruto, arts. 1.390 e seguintes)","u":"https://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"t":"Migalhas — Usufruto de quotas na sociedade limitada","u":"https://www.migalhas.com.br/depeso/392004/usufruto-de-quotas-na-sociedade-limitada"},{"t":"Mondaq — Estate Planning: Where usufruct and US tax laws collide","u":"https://www.mondaq.com/unitedstates/property-taxes/748380/estate-planning-where-usufruct-and-us-tax-laws-collide"}]}]};
const SUC = {"sectionId":"sucessorio","sectionTitle":"Veículos Sucessórios","sectionSubtitle":"Trust, testamento, holding patrimonial e fundações privadas como instrumentos de transmissão e governança patrimonial — com atenção específica aos limites que a legítima e a ordem pública brasileiras impõem a estruturas de common law.","topics":[{"name":"Trust — o instituto em common law","eyebrow":"Conceito e estrutura","legalBasis":"Instituto de common law sem correspondente direto no Código Civil brasileiro; regulado pela lei da jurisdição de constituição (trust law local) e, em nível internacional, pela Convenção de Haia de 1985 sobre a Lei Aplicável aos Trusts e seu Reconhecimento (o Brasil não é signatário)","desc":"O trust é a estrutura fiduciária central do wealth planning em jurisdições de common law. Não existe personalidade jurídica própria: o <em>settlor</em> (instituidor) transfere a titularidade legal de bens a um ou mais <em>trustees</em>, que passam a administrá-los em regime de <em>equitable ownership</em> em benefício dos <em>beneficiaries</em> (beneficiários), segundo os termos fixados no instrumento constitutivo. A separação entre titularidade legal (<em>legal title</em>, do trustee) e titularidade econômica (<em>beneficial/equitable title</em>, dos beneficiários) é o núcleo conceitual que não tem equivalente direto no direito civil brasileiro, onde a propriedade é unitária (art. 1.228 do Código Civil).\n\nOs quatro elementos essenciais de qualquer trust válido são: (i) o <strong>settlor</strong>, que institui o trust e transfere os bens (<em>trust property</em> ou <em>corpus</em>); (ii) o(s) <strong>trustee(s)</strong>, que detêm a titularidade legal e o dever fiduciário de administrar os bens conforme os termos do trust e a lei aplicável; (iii) o(s) <strong>beneficiary(ies)</strong>, titulares do interesse econômico; e (iv), em estruturas mais sofisticadas, o <strong>protector</strong>, um terceiro (indivíduo ou comitê) com poderes de supervisão sobre o trustee — tipicamente o poder de destituí-lo, de vetar certas distribuições ou de consentir em mudanças de lei aplicável — sem, contudo, assumir os deveres fiduciários do trustee.\n\nDois eixos classificam a generalidade dos trusts usados em wealth planning. O primeiro é revogabilidade: um <strong>revocable trust</strong> pode ser desfeito ou alterado pelo settlor a qualquer momento, o que preserva controle mas tipicamente não produz os efeitos de segregação patrimonial e neutralidade sucessória buscados em blindagem patrimonial (em muitas jurisdições, inclusive para fins da própria Lei 14.754/2023, ele é tratado como transparente para o settlor); um <strong>irrevocable trust</strong> transfere definitivamente a titularidade, é a estrutura efetivamente usada para proteção patrimonial e planejamento sucessório, e implica perda de controle direto do settlor sobre os bens. O segundo eixo é o grau de discricionariedade do trustee: em um <strong>fixed interest trust</strong>, as parcelas e o momento de distribuição a cada beneficiário já estão definidos no instrumento; em um <strong>discretionary trust</strong>, o trustee detém poder discricionário sobre quem recebe, quanto e quando, dentro de uma classe de beneficiários possíveis — os beneficiários têm mera expectativa (<em>hope value</em>), não direito exigível, o que é frequentemente usado para proteção contra credores e para flexibilidade multigeracional.","kv":[{"l":"Partes","v":"Settlor, trustee, beneficiary, protector (opcional)"},{"l":"Documento central","v":"Trust deed / trust instrument"},{"l":"Orientação não vinculante","v":"Letter of wishes"},{"l":"Eixo 1","v":"Revocable vs. irrevocable"},{"l":"Eixo 2","v":"Fixed interest vs. discretionary"}],"requirements":["As \"três certezas\" de common law para validade: certeza de intenção (constituir trust), certeza de objeto (bens identificáveis) e certeza de beneficiários (classe determinável)","Trust deed / trust instrument assinado, definindo poderes do trustee, classe de beneficiários e regras de distribuição","Letter of wishes — carta não vinculante do settlor ao trustee orientando o exercício da discricionariedade, revisável a qualquer momento e não registrada publicamente","Nomeação do trustee (individual ou corporate trustee licenciado na jurisdição) e, quando aplicável, do protector"],"sections":[{"title":"Documentos-chave: trust deed e letter of wishes","body":"O <strong>trust deed</strong> (ou trust instrument) é o documento juridicamente vinculante que cria o trust: define a lei aplicável (<em>proper law</em>), os poderes administrativos e dispositivos do trustee, a classe de beneficiários, eventuais poderes reservados ao settlor ou ao protector, e a duração (perpetuity period, onde aplicável). É o documento que um tribunal examina em disputa.\n\nA <strong>letter of wishes</strong> é um documento distinto, não vinculante e normalmente não registrado, no qual o settlor expressa ao trustee como deseja que a discricionariedade prevista no deed seja exercida — por exemplo, prioridades entre beneficiários, condições informais para distribuições, ou orientações sobre a governança de ativos operacionais. O trustee deve considerá-la, mas não está juridicamente obrigado a segui-la à risca; essa distinção é o que preserva a natureza discricionária (e, portanto, a eficácia protetiva) do trust perante credores e ex-cônjuges do beneficiário."},{"title":"Jurisdições comumente usadas e diferenças de alto nível","body":"<strong>Jersey e Guernsey</strong> (Ilhas do Canal): trust law consolidado (Trusts (Jersey) Law 1984, com emendas subsequentes), judiciário especializado, firewall legislation forte contra reivindicações de herdeiros forçados estrangeiros, e trusts que podem durar indefinidamente (sem regra de perpetuidade).\n\n<strong>BVI</strong> (Ilhas Virgens Britânicas): base no Trustee Act e no VISTA — Virgin Islands Special Trusts Act, 2003, que permite ao trustee deter ações de uma company operacional BVI sem o dever fiduciário usual de intervir na gestão do negócio, adequado para reter participações em empresas familiares; perpetuidade de até 360 anos; isenção tributária local salvo residentes/negócios locais.\n\n<strong>Cayman Islands</strong>: STAR Trusts (Special Trusts Alternative Regime) permitem trusts com finalidade (purpose trusts) e beneficiários não humanos, e perpetuidade de até 150 anos sob o regime padrão; forte infraestrutura de trustees corporativos regulados pela CIMA.\n\n<strong>Bahamas</strong>: Purpose Trusts e Executive Entrenchment provisions (que reforçam a posição do protector), tradicionalmente usada para famílias latino-americanas por proximidade geográfica e regime de sigilo bancário.\n\n<strong>South Dakota e Nevada (EUA)</strong>: cada vez mais usados por famílias americanas e não-americanas por ausência de imposto estadual sobre trusts, dynasty trusts perpétuos, e legislação de asset protection trusts (self-settled) — mas trusts domésticos americanos não escapam da tributação federal e das regras FATCA/CRS aplicáveis a beneficiários estrangeiros.\n\nA escolha entre jurisdições passa por: existência e qualidade de firewall legislation contra forced heirship estrangeiro, regime de sigilo e transparência (registros de beneficiários finais e trocas CRS), estabilidade política e reputação regulatória, e disponibilidade de trustees corporativos licenciados com histórico consolidado."}],"warning":"Trust não é, por si, uma estrutura de sonegação: a opacidade histórica dessas jurisdições foi substancialmente reduzida por CRS (Common Reporting Standard) e por registros de beneficiários finais. O valor do trust em wealth planning contemporâneo está em governança multigeracional, proteção patrimonial legítima e flexibilidade sucessória — não em ocultação de ativos perante o Fisco brasileiro, que desde a Lei 14.754/2023 tributa a estrutura em regime de transparência (ver tópico seguinte).","sources":[{"t":"STEP — Society of Trust and Estate Practitioners","u":"https://www.step.org"},{"t":"Harneys — Comparison of key trust features for BVI and Cayman Islands","u":"https://www.harneys.com/insights/comparison-of-key-trust-features-for-the-british-virgin-islands-and-the-cayman-islands/"},{"t":"Bedell Cristin — 21st century trusts: why offshore, and on whose shores?","u":"https://www.bedellcristin.com/knowledge/briefings/fy-2021/21st-century-trusts-why-offshore-and-on-whose-shores/"}]},{"name":"Trust estrangeiro e a legislação brasileira","eyebrow":"Tributação e declaração","legalBasis":"Lei nº 14.754, de 12 de dezembro de 2023, arts. 10 a 13; Instrução Normativa RFB nº 2.180, de 11 de março de 2024","desc":"Até 2023, o Brasil não tinha regramento legal específico para trusts, o que gerava insegurança jurídica sobre o momento de tributação e a própria declaração dos bens na Declaração de Ajuste Anual (DAA). A Lei 14.754/2023 — que também reformou a tributação de aplicações financeiras no exterior e de entidades controladas offshore — supriu essa lacuna adotando, como regra geral, um <strong>regime de transparência fiscal</strong>: para fins de IRPF, o trust não tem existência autônoma. Os bens, direitos e rendimentos a ele alocados são atribuídos diretamente a uma pessoa física, seja o instituidor, seja o(s) beneficiário(s), conforme o desenho do trust e o momento do fato gerador.\n\nA regra de imputação, conforme o art. 10 da lei, é temporal: durante a vigência do trust, os rendimentos e ganhos de capital relativos aos bens são tributados na pessoa considerada titular na data do fato gerador. Nos termos regulamentados pela Receita Federal (IN RFB 2.180/2024), os bens permanecem, para fins fiscais, sob titularidade do instituidor após a constituição do trust, e só se transferem ao beneficiário no momento da distribuição feita pelo trust a esse beneficiário ou por ocasião do falecimento do instituidor — o que ocorrer primeiro. Em trusts irrevogáveis já distribuídos, o beneficiário responde pela tributação sobre rendimentos e ganhos de capital relativos aos bens que já lhe foram distribuídos, segundo as regras aplicáveis a esse titular (art. 12, II da lei exige que o instituidor seja necessariamente pessoa física — quando o trust é constituído com recursos aportados por pessoa jurídica estrangeira, é preciso caminhar a cadeia societária até identificar a pessoa física que detém, em última instância, a titularidade econômica).\n\nA consequência prática é que <strong>não há mais margem para tratar o trust estrangeiro como um véu de opacidade fiscal para o titular brasileiro</strong>: a obrigação de declarar bens, direitos e rendimentos do trust na DAA, e de recolher IRPF sobre rendimentos e ganhos de capital segundo as regras de tributação de aplicações no exterior (Lei 14.754/2023, arts. 1º a 9º), aplica-se tanto ao instituidor quanto, a partir da distribuição, ao beneficiário residente no Brasil.","kv":[{"l":"Regime geral","v":"Transparência fiscal (trust não é sujeito passivo autônomo)"},{"l":"Tributação até distribuição","v":"Imputada ao instituidor"},{"l":"Tributação após distribuição / óbito","v":"Imputada ao beneficiário"},{"l":"Norma regulamentadora","v":"IN RFB nº 2.180/2024"},{"l":"Instrumento de declaração","v":"DAA — Declaração de Ajuste Anual"}],"process":[{"step":"Constituição do trust por instituidor brasileiro","detail":"Bens permanecem, para fins de IRPF, sob titularidade do instituidor; devem ser informados na Declaração de Bens e Direitos da DAA"},{"step":"Distribuição do trust a beneficiário","detail":"A partir da distribuição, a titularidade fiscal se transfere ao beneficiário; rendimentos e ganhos de capital relativos aos bens distribuídos passam a ser tributados na pessoa do beneficiário"},{"step":"Falecimento do instituidor (trust ainda não distribuído)","detail":"A transferência de titularidade fiscal ao(s) beneficiário(s) ocorre nesse momento, ainda que o trust, sob a lei estrangeira, permaneça formalmente em vigor"}],"warning":"A tentativa de tributação de distribuições de trust a título de ITCMD (imposto estadual sobre doação/herança) enfrenta um obstáculo constitucional relevante: o STF, no julgamento do RE 851.108/SP (Tema 825 de repercussão geral), fixou que Estados não podem instituir ITCMD sobre doação e herança de bens no exterior sem lei complementar federal prévia disciplinando a competência, nos termos do art. 155, §1º, III, da Constituição. Como a lei complementar exigida não foi editada, a cobrança de ITCMD sobre distribuições de trust estrangeiro a beneficiário brasileiro permanece juridicamente contestável — tema ainda em evolução na jurisprudência dos tribunais estaduais e do próprio STF. [VERIFICAR: desdobramentos jurisprudenciais posteriores a 2024 sobre a exigibilidade de ITCMD em distribuições de trust específicas, e eventual edição da lei complementar do art. 155, §1º, III, CF]","brazilNote":"O regime de transparência da Lei 14.754/2023 elimina a principal vantagem histórica do trust estrangeiro para residentes fiscais brasileiros — o diferimento indefinido da tributação. Isso não elimina a utilidade do trust como instrumento de governança sucessória e proteção patrimonial (sobretudo para blindagem contra credores e organização multigeracional de ativos internacionais), mas reposiciona sua função: deixa de ser primariamente uma ferramenta de otimização fiscal para se tornar uma ferramenta de estruturação de controle e sucessão, operando lado a lado com — não em substituição a — o planejamento de ITCMD e IRPF doméstico.","sources":[{"t":"Planalto — Lei nº 14.754/2023","u":"https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2023/lei/l14754.htm"},{"t":"Receita Federal — Norma que regulamenta a tributação de offshores, trusts e rendimentos no exterior (IN RFB 2.180/2024)","u":"https://www.gov.br/receitafederal/pt-br/assuntos/noticias/2024/marco/receita-federal-edita-norma-que-regulamenta-a-tributacao"},{"t":"Ministério da Fazenda — Perguntas e Respostas sobre Offshores, Lei 14.754/2023 e IN RFB 2.180","u":"https://www.gov.br/fazenda/pt-br/acesso-a-informacao/perguntas-frequentes/tributacao-offshore/29-4-24-perguntas-e-respostas-offshores-lei-14-754-e-in-rfb-2-180.pdf"}]},{"name":"Testamento no Brasil — formas e legítima","eyebrow":"Direito sucessório interno","legalBasis":"Código Civil (Lei nº 10.406/2002), Livro V, Título III, arts. 1.857 a 1.990; legítima: art. 1.846","desc":"O testamento é definido pelo art. 1.857 do Código Civil como o ato pelo qual a pessoa capaz pode dispor, para depois de sua morte, da totalidade dos seus bens ou de parte deles. É negócio jurídico unilateral, personalíssimo, gratuito, solene e revogável a qualquer tempo pelo testador enquanto vivo — não se admite testamento conjuntivo (art. 1.863, vedação ao testamento de mão comum).\n\nA liberdade de testar não é absoluta. O art. 1.846 estabelece que pertence de pleno direito aos <strong>herdeiros necessários</strong> — descendentes, ascendentes e cônjuge (art. 1.845) — a metade dos bens da herança, constituindo a <strong>legítima</strong>. O testador só pode dispor livremente da outra metade (a \"porção disponível\") quando existirem herdeiros necessários; na ausência deles, a liberdade de testar é plena sobre a totalidade do patrimônio. Essa reserva é a limitação estrutural mais relevante de todo planejamento sucessório brasileiro e o ponto central de tensão com estruturas de common law como o trust irrevogável, que na prática podem excluir herdeiros necessários da parcela que legalmente lhes pertence.\n\nO Código Civil prevê três formas ordinárias de testamento (art. 1.862): <strong>público</strong>, <strong>cerrado</strong> e <strong>particular</strong>; e três formas especiais, de uso excepcional e validade temporalmente limitada às circunstâncias que as justificaram (arts. 1.886 a 1.896): <strong>marítimo</strong>, <strong>aeronáutico</strong> e <strong>militar</strong>.","kv":[{"l":"Legítima","v":"50% da herança, reservada por lei aos herdeiros necessários (art. 1.846 CC)"},{"l":"Porção disponível","v":"50% restante, livremente testável quando há herdeiros necessários"},{"l":"Herdeiros necessários","v":"Descendentes, ascendentes e cônjuge (art. 1.845 CC)"},{"l":"Revogabilidade","v":"Livre, a qualquer tempo, pelo testador vivo e capaz"},{"l":"Formas ordinárias","v":"Público, cerrado, particular (art. 1.862 CC)"},{"l":"Formas especiais","v":"Marítimo, aeronáutico, militar (arts. 1.886–1.896 CC)"}],"sections":[{"title":"Formas ordinárias: público, cerrado e particular","body":"<strong>Testamento público</strong> (arts. 1.864–1.867): lavrado por tabelião de notas, em seu livro de notas, segundo as declarações do testador (que pode se valer de minuta ou apontamentos), lido em voz alta ao testador e a duas testemunhas e assinado por todos. É a forma mais segura e a mais utilizada em wealth planning por reduzir substancialmente o risco de nulidade formal e de contestação futura quanto à autenticidade da vontade do testador — o tabelião, dotado de fé pública, atesta a capacidade aparente do testador no ato.\n\n<strong>Testamento cerrado</strong> (arts. 1.868–1.875): escrito pelo próprio testador ou por terceiro a seu rogo, e aprovado pelo tabelião em auto de aprovação lavrado após leitura em presença de duas testemunhas; o conteúdo permanece sigiloso até a abertura, após o óbito, em juízo. Menos utilizado hoje pela exigência de abertura judicial e por riscos formais.\n\n<strong>Testamento particular</strong> (arts. 1.876–1.880): escrito e assinado pelo próprio testador, sem intervenção de tabelião, lido a pelo menos três testemunhas que o subscrevem — exige posterior confirmação judicial após o óbito, com oitiva das testemunhas. É a forma mais vulnerável à contestação e mais frequentemente objeto de disputa sucessória; o CPC, no art. 23, I, atribui à autoridade judiciária brasileira competência exclusiva para confirmar testamento particular quando praticado no Brasil."},{"title":"Testamentos especiais: marítimo, aeronáutico e militar","body":"São formas excepciona
