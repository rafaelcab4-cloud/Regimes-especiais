istinguir SCE-IED/SCE-Crédito (capital estrangeiro entrando no Brasil) da CBE (capital brasileiro no exterior) — regimes e sistemas diferentes"],"warning":"O RDE-IED e o RDE-ROF, como nomenclaturas e telas de sistema, não devem mais ser referenciados como sistema vigente em orientações a clientes — ainda que a base legal remota (Lei 4.131/1962 e Lei 11.371/2006) continue citada nos manuais atuais do Bacen. Antes de qualquer orientação prática, confirmar em bcb.gov.br a nomenclatura e o fluxo vigentes, pois o Bacen já promoveu mais de uma atualização de manual desde a virada para o SCE.","sources":[{"t":"Banco Central do Brasil — Manual SCE-IED (PDF)","u":"https://www.bcb.gov.br/content/estabilidadefinanceira/rde/manuais_RDE/Manual-SCE-IED3.pdf"},{"t":"Banco Central do Brasil — Manual SCE-Crédito (PDF)","u":"https://www.bcb.gov.br/content/estabilidadefinanceira/rde/manuais_RDE/Manual-SCE-Credito.pdf"},{"t":"Planalto — Lei 4.131/1962","u":"https://www.planalto.gov.br/ccivil_03/leis/l4131.htm"},{"t":"Planalto — Lei 11.371/2006","u":"https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2006/lei/l11371.htm"},{"t":"Planalto — Lei 14.286/2021 (Marco Legal do Câmbio)","u":"https://www.planalto.gov.br/ccivil_03/_ato2019-2022/2021/lei/l14286.htm"}]},{"name":"SCE-IED — Investimento Externo Direto","eyebrow":"Módulo de participação societária de não residente em empresa brasileira","legalBasis":"Lei 11.371/2006; Resolução BCB 278/2022 (regulamenta a Lei 14.286/2021)","desc":"O SCE-IED é o módulo através do qual a empresa brasileira <strong>receptora</strong> de aporte de capital de investidor não residente — pessoa física ou jurídica domiciliada no exterior — registra e mantém atualizada perante o Bacen a participação estrangeira em seu capital social. A responsabilidade pelo registro recai sobre a empresa receptora do investimento no Brasil, não sobre o investidor estrangeiro. É também nesse módulo que se registra o capital destacado (dotação) de filial ou sucursal de empresa estrangeira autorizada a operar no país.\n\nO registro de um aporte inicial gera um código SCE-IED próprio para o receptor, ao qual passam a ser vinculadas as operações de câmbio subsequentes relacionadas a esse investimento (novos aportes, redução de capital, remessa de lucros e dividendos, repatriamento). Segundo fontes consultadas, operações cambiais vinculadas a investimento direto sujeitam-se a registro a partir do patamar de <strong>USD 100.000,00</strong> (ou equivalente em outra moeda) [VERIFICAR: valor de corte exato e sua base normativa (artigo da Resolução BCB 278/2022 ou norma complementar) diretamente no manual SCE-IED do Bacen — fontes de mercado convergem no valor, mas não localizei o dispositivo legal correspondente para citação precisa].\n\nAlém do registro do ingresso, a empresa receptora com participação de não residente está sujeita a declarações periódicas de natureza econômico-financeira, cuja periodicidade varia conforme o total de ativos da empresa na data-base:\n\n<strong>Declaração Anual</strong> — devida por receptoras com participação de não residente e ativo total igual ou superior a R$ 100 milhões na data-base de 31/12 do ano anterior, a ser prestada entre 1º de janeiro e 31 de março do ano seguinte.\n\n<strong>Declaração Trimestral</strong> — devida por receptoras com ativo total igual ou superior a R$ 300 milhões na data-base de cada trimestre civil, com janelas de entrega nos três meses subsequentes a cada fechamento trimestral.\n\n<strong>Declaração Quinquenal (Censo)</strong> — nos anos-calendário em que se aplica o Censo de Capitais Estrangeiros no País, a exigência de declaração anual é substituída pela declaração quinquenal, devida por toda receptora com participação de não residente (qualquer valor de participação) e ativo total igual ou superior a R$ 100 mil na data-base de 31/12 do ano anterior, também no período de 1º de janeiro a 31 de março.\n\nReceptoras com ativo total abaixo dos limiares aplicáveis ficam dispensadas da declaração periódica correspondente, mas permanecem obrigadas ao registro do ingresso do investimento e à sua manutenção cadastral. [VERIFICAR: os valores de corte de R$ 100 milhões (anual), R$ 300 milhões (trimestral) e R$ 100 mil (quinquenal/censo) contra o texto vigente do manual SCE-IED e eventual norma que os fixe, pois esses limiares já foram reajustados no passado e podem voltar a sê-lo; e VERIFICAR se 2026 é de fato ano de Censo Quinquenal (ano-base 2025), o que, segundo as fontes consultadas, dispensaria a declaração anual desse ano-base específico].\n\nA omissão, o atraso ou a inconsistência na declaração periódica podem levar à <strong>suspensão do código SCE-IED</strong> da receptora, o que impede a vinculação de novas operações de câmbio de natureza de investimento direto (aportes, remessas de lucro, repatriamento) até a regularização — com efeito prático imediato sobre qualquer movimentação de capital planejada. Multas administrativas também são cominadas por infração ao dever de declarar. [VERIFICAR: faixa de multa aplicável especificamente ao SCE-IED, com percentuais e limites mínimo/máximo, e o dispositivo normativo correspondente — os valores citados por escritórios de advocacia e fontes de mercado variam entre si (algumas mencionam multas de 1% a 10% do valor sujeito a declaração com teto entre R$ 25 mil e R$ 250 mil; outras citam a faixa geral de R$ 2.500 a R$ 250.000 aplicável a outras declarações cambiais), o que sugere que essas cifras podem estar sendo replicadas por analogia entre regimes distintos (CBE, IED, ROF) sem verificação individual — não usar nenhuma delas com clientes sem confirmação no normativo aplicável ao SCE-IED especificamente].","kv":[{"l":"O que declara","v":"Participação de não residente em empresa brasileira"},{"l":"Responsável","v":"Empresa receptora no Brasil"},{"l":"Registro de ingresso","v":"A cada aporte/operação relevante"},{"l":"Declaração anual","v":"Ativo ≥ R$ 100 mi — jan/mar"},{"l":"Declaração trimestral","v":"Ativo ≥ R$ 300 mi — trimestral"},{"l":"Declaração quinquenal (Censo)","v":"Ativo ≥ R$ 100 mil — jan/mar, em ano de Censo"}],"requirements":["Empresa brasileira com qualquer participação societária de não residente deve manter código SCE-IED ativo","Verificar anualmente o ativo total na data-base de 31/12 para determinar se há obrigação de declaração anual, trimestral ou quinquenal","Vincular toda operação de câmbio relacionada ao investimento (aporte, redução, dividendo, repatriamento) ao código SCE-IED do receptor","Confirmar, a cada ciclo declaratório, se o ano corresponde a ano de Censo Quinquenal, que substitui a declaração anual"],"process":[{"step":"Obtenção do código de receptor","timing":"No primeiro aporte estrangeiro","detail":"Empresa brasileira registra-se como receptora de IED e recebe código próprio no sistema"},{"step":"Registro de cada operação","timing":"Conforme ocorrência","detail":"Aportes, reduções de capital e outras movimentações societárias com não residente são lançados e vinculados ao código"},{"step":"Declaração periódica econômico-financeira","timing":"Anual, trimestral ou quinquenal, conforme porte","detail":"Prestação de informações patrimoniais e societárias da receptora dentro da janela aplicável"},{"step":"Vinculação cambial","timing":"A cada remessa/ingresso via câmbio","detail":"Banco autorizado a operar em câmbio exige o código SCE-IED válido para cursar a operação"}],"warning":"A suspensão do código SCE-IED por descumprimento declaratório trava operações de câmbio de investimento direto — inclusive a remessa de dividendos e o repatriamento de capital de um investidor não residente — até a regularização. Em planejamento patrimonial internacional, isso é particularmente sensível quando a receptora integra uma estrutura com prazo apertado para distribuição ou saída (venda, redomiciliação).","sources":[{"t":"Banco Central do Brasil — Manual SCE-IED (PDF)","u":"https://www.bcb.gov.br/content/estabilidadefinanceira/rde/manuais_RDE/Manual-SCE-IED3.pdf"},{"t":"gov.br — Declarar capitais estrangeiros decorrentes de investimento estrangeiro direto (SCE-IED)","u":"https://www.gov.br/pt-br/servicos/Declarar-capitais-estrangeiros-decorrentes-de-investimento-estrangeiro-direto-SCE-IED"},{"t":"Planalto — Lei 11.371/2006","u":"https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2006/lei/l11371.htm"}]},{"name":"SCE-Crédito — Capitais estrangeiros sob forma de crédito","eyebrow":"Sucessor do RDE-ROF","legalBasis":"Resolução BCB 278/2022 (regulamenta a Lei 14.286/2021); manual de declarante atualizado pela Resolução BCB 492/2025","desc":"O SCE-Crédito é o módulo destinado ao registro de operações financeiras de <strong>crédito externo</strong> — isto é, operações em que um não residente é credor de pessoa física ou jurídica residente no Brasil — sucedendo o antigo RDE-ROF (Registro de Operações Financeiras). Abrange, entre outras modalidades: empréstimos e financiamentos diretos captados no exterior (inclusive entre partes relacionadas — operações <em>intercompany</em> com controladora, controlada ou coligada estrangeira), emissão de títulos de dívida no mercado internacional, emissão de valores mobiliários por colocação privada no mercado interno com credor não residente, importação financiada de bens ou serviços com prazo de pagamento superior a 180 dias, recebimento antecipado de exportação e arrendamento mercantil financeiro (leasing) internacional, quando sujeitas a prestação de informação ao Bacen.\n\nA obrigação de registrar depende do tipo de operação e de valores de corte específicos por modalidade, fixados pela Resolução BCB 278/2022: segundo fontes consultadas, empréstimos e financiamentos diretos (incluindo emissão de títulos internacionais e colocação privada doméstica com credor não residente) sujeitam-se a registro a partir de <strong>USD 1.000.000,00</strong> (ou equivalente); importações financiadas de bens ou serviços com prazo superior a 180 dias, a partir de <strong>USD 500.000,00</strong> (ou equivalente). [VERIFICAR: esses valores de corte, e a tabela completa por modalidade de operação, diretamente no texto da Resolução BCB 278/2022 e no Manual SCE-Crédito vigente — os patamares acima refletem o que fontes de mercado reportam, mas o Bacen pode segmentar de forma mais granular por tipo de instrumento].\n\nUma vez caracterizada a obrigação, a operação deve ser declarada no SCE-Crédito em prazo de <strong>até 30 dias</strong> contados da sua ocorrência — regra que também se aplica a conversões dentro de uma mesma operação de crédito externo (por exemplo, capitalização de juros ou encargos ao principal). [VERIFICAR: o prazo de 30 dias contra o texto vigente do Manual SCE-Crédito e/ou da Resolução BCB 278/2022, inclusive se há prazos diferenciados por tipo de evento — registro do ingresso, alteração contratual, amortização, vencimento antecipado — dentro desse mesmo módulo].\n\nO SCE-Crédito substitui integralmente o antigo RDE-ROF como ambiente de registro; não há, na estrutura atual, um sistema de Registro de Operações Financeiras autônomo e paralelo — o ROF como nomenclatura de sistema está descontinuado, tendo sua função absorvida pelo módulo Crédito do SCE. O manual de procedimentos ao declarante foi objeto de atualização pela Resolução BCB 492/2025, o que reforça que este é um módulo em revisão normativa ativa e recomenda checagem de vigência a cada novo ciclo de trabalho. [VERIFICAR: o conteúdo específico das alterações trazidas pela Resolução BCB 492/2025 ao módulo SCE-Crédito, diretamente no texto da resolução ou no comunicado do Bacen que a acompanhou].\n\nAs consequências de descumprimento seguem a mesma lógica do SCE-IED: risco de impedimento de operações de câmbio vinculadas à operação de crédito não regularizada (o que inclui o próprio ingresso dos recursos ou o pagamento de amortizações e juros ao credor no exterior) e sujeição a multa administrativa. [VERIFICAR: faixa de multa e dispositivo normativo aplicável especificamente ao SCE-Crédito — pelas mesmas razões apontadas no tópico do SCE-IED, não usar valores de multa reportados por fontes secundárias sem confirmação no normativo correspondente].","kv":[{"l":"O que declara","v":"Crédito externo tomado por residente no Brasil"},{"l":"Sucede","v":"RDE-ROF (Registro de Operações Financeiras)"},{"l":"Prazo de registro","v":"Até 30 dias da ocorrência [VERIFICAR]"},{"l":"Corte — empréstimo/financiamento direto","v":"USD 1.000.000 [VERIFICAR]"},{"l":"Corte — importação financiada > 180 dias","v":"USD 500.000 [VERIFICAR]"},{"l":"Abrange intercompany","v":"Sim — crédito de controladora/coligada estrangeira"}],"requirements":["Mapear toda captação de crédito externo da empresa brasileira, incluindo mútuos intercompany com controladora ou coligada no exterior","Verificar se o valor e a modalidade da operação atingem o patamar de registro obrigatório antes de considerar a operação dispensada","Registrar dentro do prazo (a confirmar) a partir da ocorrência do evento — ingresso, alteração contratual ou capitalização de encargos","Confirmar, a cada operação, se o manual/norma vigente do SCE-Crédito já incorpora as alterações da Resolução BCB 492/2025"],"process":[{"step":"Caracterização da operação","timing":"Antes da contratação, idealmente","detail":"Confirmar modalidade (empréstimo direto, importação financiada, título, leasing) e se atinge o valor de corte aplicável"},{"step":"Registro no SCE-Crédito","timing":"Até 30 dias da ocorrência [VERIFICAR]","detail":"Lançamento das condições contratuais — credor, valor, prazo, encargos — pelo declarante residente"},{"step":"Vinculação cambial do ingresso","timing":"No desembolso dos recursos","detail":"Operação de câmbio de ingresso referenciada ao registro no SCE-Crédito"},{"step":"Atualização de eventos","timing":"Conforme ocorrência","detail":"Amortizações, capitalização de juros, repactuações e o pagamento final são refletidos no registro"}],"warning":"Em operações intercompany — crédito de holding estrangeira a subsidiária brasileira, comum em estruturas de wealth planning com veículo no exterior financiando operação local — o registro no SCE-Crédito costuma ser subestimado exatamente por não haver captação bancária de mercado envolvida. O dever de declarar independe da natureza relacionada das partes.","sources":[{"t":"Banco Central do Brasil — Manual SCE-Crédito (PDF)","u":"https://www.bcb.gov.br/content/estabilidadefinanceira/rde/manuais_RDE/Manual-SCE-Credito.pdf"},{"t":"gov.br — Declarar capitais estrangeiros decorrentes de operações de crédito (SCE-Crédito)","u":"https://www.gov.br/pt-br/servicos/declarar-capitais-estrangeiros-decorrentes-de-operacoes-de-credito-sce-credito"}]},{"name":"Processo prático de declaração","eyebrow":"Acesso ao sistema e fluxo declaratório","legalBasis":"Resolução BCB 278/2022; normas de acesso a sistemas do Bacen para pessoas físicas e jurídicas","desc":"O acesso ao SCE-IED e ao SCE-Crédito se dá por ambiente eletrônico do Banco Central, mediante identificação do declarante — a própria empresa ou pessoa física receptora do capital, ou seu representante legalmente constituído. A prática de mercado indica autenticação por certificado digital ICP-Brasil e, quando a declaração é conduzida por terceiro (escritório de contabilidade, consultoria ou departamento jurídico), a formalização de procuração eletrônica que habilite o procurador a atuar em nome do declarante perante o sistema do Bacen. [VERIFICAR: o nome atual e a URL exata do portal de acesso ao SCE (se integrado ao \"BCB Declara\", a um módulo específico do Sisbacen para empresas, ou a outro ambiente), o método de autenticação vigente (gov.br, certificado digital, ou ambos) e o procedimento formal de outorga de procuração eletrônica para o SCE especificamente — essas informações mudam com frequência e devem ser confirmadas na página de acesso do próprio Bacen antes de orientar um declarante].\n\nEm linhas gerais, o fluxo declaratório em qualquer um dos dois módulos segue a mesma lógica: (i) credenciamento do declarante e obtenção de um código/registro próprio para a empresa ou operação; (ii) registro do fato gerador (aporte societário no SCE-IED; contratação de crédito no SCE-Crédito); (iii) vinculação das operações de câmbio subsequentes a esse código, exigida pelo banco autorizado a operar em câmbio como condição para cursar a remessa; e (iv) cumprimento das declarações periódicas de atualização, quando aplicável ao porte ou à natureza da operação.\n\nRecomenda-se, para qualquer estrutura patrimonial internacional com componente societário ou de crédito no Brasil, manter um calendário de compliance cambial documentado — com as datas de cada janela declaratória, o histórico de códigos SCE ativos por veículo, e a evidência de cada protocolo entregue — de modo a permitir auditoria e resposta rápida a fiscalização.","requirements":["Confirmar o método de acesso vigente ao ambiente do SCE (certificado digital, gov.br, ou combinação) antes de iniciar qualquer registro","Formalizar procuração eletrônica quando a declaração for conduzida por terceiro em nome do declarante","Manter calendário interno de compliance cambial com todas as janelas declaratórias aplicáveis a cada veículo do grupo patrimonial"],"process":[{"step":"Credenciamento do declarante","timing":"Previamente ao primeiro registro","detail":"Habilitação de acesso ao sistema, diretamente ou por procurador eletrônico [VERIFICAR fluxo exato]"},{"step":"Registro do fato gerador","timing":"Conforme prazo do módulo aplicável","detail":"Aporte societário (SCE-IED) ou contratação de crédito (SCE-Crédito)"},{"step":"Vinculação cambial","timing":"A cada operação de câmbio","detail":"Banco autorizado exige o código SCE válido para liquidar a operação"},{"step":"Declarações periódicas","timing":"Conforme calendário do módulo","detail":"Atualização econômico-financeira (IED) ou de eventos contratuais (Crédito)"}],"sources":[{"t":"Banco Central do Brasil — Manual SCE-IED (PDF)","u":"https://www.bcb.gov.br/content/estabilidadefinanceira/rde/manuais_RDE/Manual-SCE-IED3.pdf"},{"t":"gov.br — Declarar capitais estrangeiros decorrentes de investimento estrangeiro direto (SCE-IED)","u":"https://www.gov.br/pt-br/servicos/Declarar-capitais-estrangeiros-decorrentes-de-investimento-estrangeiro-direto-SCE-IED"},{"t":"gov.br — Declarar capitais estrangeiros decorrentes de operações de crédito (SCE-Crédito)","u":"https://www.gov.br/pt-br/servicos/declarar-capitais-estrangeiros-decorrentes-de-operacoes-de-credito-sce-credito"}]},{"name":"Interação com wealth planning internacional","eyebrow":"Onde o SCE aparece na estrutura patrimonial","legalBasis":"Resolução BCB 278/2022","desc":"Para o consultor de planejamento patrimonial, o SCE-IED e o SCE-Crédito não são obrigações periféricas de compliance contábil — são pontos de controle que condicionam a própria execução de movimentos de capital dentro de uma estrutura internacional. Duas situações recorrentes merecem atenção direta:\n\n<strong>Aporte de investidor não residente em veículo brasileiro.</strong> Quando uma holding offshore controlada por um residente brasileiro (ou por terceiro não residente) aporta capital em uma empresa operacional ou patrimonial no Brasil — por exemplo, para capitalizar uma sociedade que deterá um imóvel ou uma participação societária local —, esse aporte caracteriza investimento estrangeiro direto e aciona a obrigação de registro no SCE-IED pela receptora brasileira, independentemente de o investidor final, olhando através da cadeia societária, ser o próprio brasileiro. É um ponto frequentemente negligenciado em estruturas em que o mesmo indivíduo está de ambos os lados da operação (residente que controla o veículo estrangeiro que investe na empresa brasileira): a obrigação declaratória da receptora existe de todo modo, e sua omissão trava a distribuição futura de dividendos ou o repatriamento de capital pela via cambial.\n\n<strong>Crédito de coligada ou controlada estrangeira a empresa brasileira do grupo.</strong> Estruturas de wealth planning que utilizam uma holding no exterior para financiar — em vez de capitalizar — uma operação ou veículo no Brasil (mútuo intercompany, por exemplo, para otimizar dedutibilidade de juros ou por razões de flexibilidade de saída) acionam o SCE-Crédito. A escolha entre capitalizar (SCE-IED) e emprestar (SCE-Crédito) tem, portanto, consequência declaratória distinta além dos efeitos tributários e societários já normalmente considerados no desenho da estrutura.\n\nOs riscos de não conformidade em ambos os módulos convergem para o mesmo ponto de dor prático: o <strong>bloqueio de operações no mercado de câmbio</strong> vinculadas ao registro irregular ou suspenso — o que pode inviabilizar, no momento exato em que a estrutura precisa de liquidez ou de uma saída (venda de participação, distribuição para atender a um evento familiar, redomiciliação), justamente a remessa que a estrutura foi desenhada para viabilizar. A isso somam-se a exposição a multa administrativa e o risco reputacional e de escrutínio adicional em eventual fiscalização cambial ou patrimonial mais ampla, na qual a inconsistência declaratória no SCE costuma ser o primeiro sinal que atrai atenção do órgão regulador para o restante da estrutura.","requirements":["Mapear, no desenho de qualquer estrutura com veículo estrangeiro e componente brasileiro, se o fluxo de capital será aporte (SCE-IED) ou crédito (SCE-Crédito) — e registrar antes de o fluxo cambial correspondente ser necessário","Verificar a situação declaratória do SCE de toda entidade brasileira do grupo antes de planejar uma remessa, distribuição ou repatriamento","Tratar a regularidade do SCE como pré-condição de exequibilidade de qualquer evento de liquidez da estrutura, não como formalidade posterior"],"warning":"Um código SCE suspenso por pendência declaratória bloqueia a operação de câmbio vinculada — o que pode paralisar exatamente a remessa (distribuição, repatriamento, pagamento de amortização a credor externo) que motivou a análise da estrutura em primeiro lugar. A checagem da situação declaratória deve anteceder qualquer planejamento de evento de liquidez internacional envolvendo entidade brasileira.","sources":[{"t":"Banco Central do Brasil — Manual SCE-IED (PDF)","u":"https://www.bcb.gov.br/content/estabilidadefinanceira/rde/manuais_RDE/Manual-SCE-IED3.pdf"},{"t":"Banco Central do Brasil — Manual SCE-Crédito (PDF)","u":"https://www.bcb.gov.br/content/estabilidadefinanceira/rde/manuais_RDE/Manual-SCE-Credito.pdf"}]},{"name":"Comparativo SCE-IED vs. SCE-Crédito","eyebrow":"Síntese dos dois módulos","legalBasis":"Resolução BCB 278/2022 (ambos os módulos)","desc":"Os dois módulos partem da mesma base legal e do mesmo princípio — registro declaratório sob responsabilidade do residente que recebe o capital —, mas se aplicam a naturezas de operação e a calendários distintos. A tabela a seguir resume os pontos de maior relevância prática para o consultor de wealth planning.","kv":[{"l":"Natureza da operação — IED","v":"Participação societária de não residente"},{"l":"Natureza da operação — Crédito","v":"Empréstimo, financiamento, título de dívida, importação financiada"},{"l":"Responsável pelo registro — ambos","v":"Pessoa física/jurídica residente receptora"},{"l":"Periodicidade — IED","v":"Registro do fato + declaração anual, trimestral ou quinquenal (por porte)"},{"l":"Periodicidade — Crédito","v":"Registro do fato em até 30 dias [VERIFICAR] + atualização por evento"},{"l":"Sistema antecessor — IED","v":"RDE-IED"},{"l":"Sistema antecessor — Crédito","v":"RDE-ROF"},{"l":"Base legal comum","v":"Lei 11.371/2006; Resolução BCB 278/2022"},{"l":"Efeito de descumprimento — ambos","v":"Suspensão do código e bloqueio de operação de câmbio vinculada; multa administrativa [VERIFICAR valores]"}],"sections":[{"title":"Quando cada módulo é acionado em uma estrutura típica","body":"Se o veículo estrangeiro do grupo familiar subscreve capital em uma sociedade brasileira — seja para deter um ativo local, seja para capitalizar uma operação —, o evento é de <strong>investimento direto</strong> e o registro cabe no SCE-IED. Se, em vez disso, o veículo estrangeiro concede um mútuo, financia uma importação da empresa brasileira ou subscreve um título de dívida emitido por ela, o evento é de <strong>crédito externo</strong> e o registro cabe no SCE-Crédito. A mesma estrutura pode acionar os dois módulos simultaneamente — por exemplo, um aporte inicial de capital seguido, anos depois, de um mútuo complementar da mesma holding estrangeira à subsidiária brasileira — e cada evento deve ser tratado e monitorado separadamente, com seu próprio calendário de conformidade."}],"sources":[{"t":"Banco Central do Brasil — Manual SCE-IED (PDF)","u":"https://www.bcb.gov.br/content/estabilidadefinanceira/rde/manuais_RDE/Manual-SCE-IED3.pdf"},{"t":"Banco Central do Brasil — Manual SCE-Crédito (PDF)","u":"https://www.bcb.gov.br/content/estabilidadefinanceira/rde/manuais_RDE/Manual-SCE-Credito.pdf"}]}]};
const REGIMES = {"COUNTRIES":{"ch":{"id":"ch","flagCode":"ch","name":"Suíça","region":"Europa","alert":false,"sumFiscal":"Lump-Sum / Forfait Fiscal (CHF 435k+ base)","sumFS":"ok","sumVisa":"Residência fiscal por Lump-Sum","sumVS":"ok","fiscal":[{"name":"Lump-Sum (Forfait Fiscal / Pauschalbesteuerung)","status":"ok","legalBasis":"Art. 14 LIFD/DBG (RS 642.11) e Art. 6 LHID (RS 642.14). Ordonnance sobre a imposição segundo a despesa em matéria de imposto federal direto, de 20/2/2013 (RO 2013/157). Ordonnance do DFF de 10/9/2025 (RO 2025 579), que fixa a indexação para 2026. Circulaire AFC n.º 44, de 24/7/2018 (substitui a n.º 9/1993). Legislação cantonal própria em cada cantão que pratica o regime.","desc":"O regime de forfait fiscal — regulamentado pelo Art. 14 da Lei Federal sobre Impostos Diretos (LIFD/DBG) — é aplicado desde o século XIX. Em vez de tributar a renda e o patrimônio global efetivos, o sistema aplica alíquotas ordinárias sobre uma base tributável fictícia calculada a partir das <strong>despesas de vida anuais do contribuinte</strong>.\n\n<strong>Base de cálculo:</strong> o valor tributável é o <strong>maior</strong> entre quatro grandezas: (i) sete vezes o aluguel ou valor locativo da residência principal; (ii) três vezes o custo anual de pensão, para quem reside em hotel; (iii) as despesas de vida mundiais efetivas do contribuinte e dependentes; (iv) o mínimo legal indexado. Desde 1/jan/2016, para o imposto cantonal e comunal, a fortuna é considerada por <strong>majoração de 10%</strong> sobre a base retida.\n\n<strong>Cantões elegíveis (21 de 26):</strong> regime abolido em Zurique, Basileia-Cidade, Basileia-Campo, Schaffhausen e Appenzell Ausserrhoden.\n\n<strong>Imposto anual efetivo estimado:</strong> CHF 150.000–350.000 dependendo do cantão, do imóvel e do perfil.","kv":[{"l":"Base federal mín. (2026)","v":"CHF 435.000"},{"l":"Mín. cantonal Genebra (2026)","v":"CHF 426.357"},{"l":"Regra do imóvel","v":"7× aluguel ou valor locativo"},{"l":"Regra do hotel","v":"3× custo anual de pensão"},{"l":"Majoração p/ fortuna (ICC)","v":"+10% sobre a base"},{"l":"Imposto efetivo","v":"CHF 150k–350k/ano"},{"l":"Cantões elegíveis","v":"21 de 26"},{"l":"Duração do ruling","v":"~5 anos, renovável"},{"l":"Patrimônio mínimo legal","v":"❌ Não existe"}],"requirements":["<strong>Nacionalidade estrangeira.</strong> Cidadãos suíços não podem aderir; bipátridas com nacionalidade suíça também ficam excluídos.","<strong>Primeira instalação fiscal na Suíça</strong>, ou retorno após ausência mínima de 10 anos. A Circular n.º 44 eliminou a possibilidade, antes admitida, de suíços que retornavam após 10 anos usarem o forfait no ano de retorno.","<strong>Ausência de atividade lucrativa na Suíça ou a partir da Suíça.</strong> A detenção passiva de participações, o recebimento de dividendos e a gestão do patrimônio privado próprio não contam como atividade lucrativa. Atividade lucrativa exercida no exterior é admitida para fins fiscais (mas veja a restrição migratória no regime de residência).","<strong>Ambos os cônjuges</strong> que vivem em economia doméstica comum devem preencher <strong>individual e integralmente</strong> todas as condições — mudança introduzida pela revisão de 2014 e pela Circular 44; antes, bastava que um deles preenchesse.","Não há, na lei federal, patamar mínimo de <strong>patrimônio ou renda</strong> — apenas a base de despesa mínima indexada. Referências de mercado a USD 20M+ refletem prática de planejamento, não exigência legal."],"process":[{"step":"Pré-análise e escolha do cantão","timing":"Semanas 0–4","detail":"Verificação de que o cantão pratica o regime (21 de 26) e comparação de mínimos cantonais e alíquotas efetivas."},{"step":"Submissão do pedido à administração fiscal cantonal","detail":"Dossiê com carta descritiva da situação civil, profissional e econômica; atestado de que não exercerá atividade lucrativa na Suíça; <strong>proposta de montante</strong> de base tributável; cópia do contrato de locação ou formulário de valor locativo; e o formulário cantonal oficial sobre o padrão de vida do contribuinte e dependentes."},{"step":"Negociação e assinatura da convenção fiscal (ruling)","timing":"Validade de ~5 anos","detail":"Acordo firmado entre a administração e o contribuinte, podendo ter prazo reduzido conforme as circunstâncias. Recomenda-se ruling prévio confirmando a ausência de atividade lucrativa proibida. Mudança de cantão durante a vigência exige nova negociação com o cantão de destino."},{"step":"Pedido migratório paralelo","detail":"Apresentado à autoridade cantonal de migração, que se baseia no interesse fiscal cantonal atestado pelo ruling. <em>Prazo oficial de decisão não localizado em fonte publicada.</em>"},{"step":"Anúncio de chegada na comuna (Anmeldung)","timing":"Até 14 dias da mudança","detail":"Registro obrigatório junto ao controle de habitantes do município de residência."},{"step":"Biometria e emissão do permit","detail":"Convite escrito para comparecer ao centro de documentos de identidade. O permit é emitido em formato cartão e enviado à comuna; os dados biométricos têm validade de 5 anos."},{"step":"Renovação","timing":"Anual / quinquenal","detail":"Mesmo formulário cantonal usado por novos residentes serve para renovações. A indexação da base mínima ocorre <strong>automaticamente e em separado</strong> para o imposto federal direto e para o cantonal e comunal."}],"costs":[{"item":"Base tributável mínima federal (2026)","value":"CHF 435.000"},{"item":"Base mínima cantonal — Genebra (2026)","value":"CHF 426.357","note":"acrescida de majoração de 10% pela fortuna"},{"item":"Imposto total anual — Vaud","value":"CHF 250.000–400.000","note":"estimativa de mercado, não oficial"},{"item":"Imposto total anual — Valais","value":"CHF 180.000–300.000","note":"estimativa de mercado, não oficial"},{"item":"Imposto total anual — Ticino","value":"CHF 200.000–350.000","note":"estimativa de mercado, não oficial"},{"item":"AVS/AI/APG — pessoas sem atividade lucrativa","value":"CHF 530 – 26.500/ano","note":"por pessoa; teto atingido com fortuna determinante ≥ CHF 8.950.000"},{"item":"Seguro-saúde LAMal — prêmio médio adulto (2026)","value":"CHF 465,30/mês","note":"jovem adulto CHF 326,30 · criança CHF 122,50"},{"item":"Carga marginal máxima ordinária por cantão","value":"21,9% – 43,2%","note":"de Zug a Genebra, entre capitais cantonais"}],"sections":[{"title":"Como a base tributável é calculada, na prática","body":"Exemplo numérico, Genebra, 2026:\n\nAluguel anual de <strong>CHF 90.000</strong> → 7× = <strong>CHF 630.000</strong>.\nDespesas de vida mundiais declaradas: CHF 480.000.\nMínimo federal: CHF 435.000. Mínimo cantonal: CHF 426.357.\n\n<strong>Base para o imposto federal direto (IFD)</strong> = maior valor = <strong>CHF 630.000</strong>.\n<strong>Base para o imposto cantonal e comunal (ICC)</strong> = 630.000 + 10% = <strong>CHF 693.000</strong>.\n\nSobre essas bases aplicam-se as tabelas ordinárias de IFD e ICC.\n\n<em>Ponto de virada:</em> a regra dos 7× o aluguel passa a prevalecer sobre o mínimo federal quando o aluguel anual supera cerca de <strong>CHF 62.143</strong>."},{"title":"Cálculo de controle (calcul de contrôle)","body":"Paralelamente à base de despesa, a administração calcula o imposto que incidiria sobre <strong>todos os elementos de renda e fortuna de fonte suíça</strong>, mais os rendimentos para os quais se pede alívio convencional. <strong>Retém-se a base que resultar no imposto mais alto.</strong>\n\nNa prática, isso significa que rendimentos suíços relevantes podem anular a vantagem do forfait."},{"title":"O que o regime cobre e o que não cobre","body":"<strong>Substitui:</strong> o imposto de renda federal, cantonal e comunal e — via majoração de 10%, em cantões como Genebra — o imposto sobre a fortuna.\n\n<strong>Não exonera:</strong> impostos indiretos; o imposto sobre imóveis suíços apurado no cálculo de controle; nem os impostos cantonais sobre sucessões e doações.\n\n<em>NÃO CONFIRMADO em fonte oficial:</em> o tratamento exato de ganhos de capital mobiliários vs. imobiliários sob o forfait — o imposto cantonal sobre ganhos imobiliários (gain immobilier) permanece devido, mas a articulação com o regime carece de confirmação normativa direta."},{"title":"Herança e doações: matéria estritamente cantonal","body":"<strong>Não há imposto sucessório federal</strong> — a matéria é integralmente cantonal.\n\n<strong>Cônjuge sobrevivente é isento em todos os 26 cantões, sem exceção.</strong> Descendentes diretos são isentos na maioria dos cantões (entre eles Zurique, Berna, Vaud, Friburgo e Valais). <strong>Schwyz e Obwalden isentam todos os herdeiros</strong>, qualquer que seja o grau de parentesco. Neuchâtel não tributa a linha direta.\n\nVaud, desde 1/jan/2025, aplica franquia sucessória de até <strong>CHF 1.000.000 por estirpe</strong> e franquia de doação de <strong>CHF 300.000 por filho por ano civil</strong>.\n\n<em>NÃO CONFIRMADO:</em> a lista completa dos cantões que ainda tributam descendentes diretos."},{"title":"Acesso a tratados de dupla tributação sob o forfait","body":"Este é um dos pontos mais técnicos do regime. <strong>Alemanha, Áustria, Bélgica, Itália, Noruega, Estados Unidos e Canadá</strong> reconhecem a residência do forfaitaire, mas só concedem os benefícios convencionais se <strong>todos</strong> os rendimentos provenientes desses Estados — não apenas os tributados na fonte — forem tributáveis segundo o direito suíço e efetivamente submetidos ao IFD e ao ICC. É a figura do <strong>forfait majoré</strong> (imposição modificada), que Genebra documenta em página oficial própria.\n\n<strong>França é caso à parte:</strong> instrução publicada no Journal Officiel de 26/12/2012 encerrou mais de 40 anos de tolerância. A França passou a recusar o benefício da convenção França–Suíça aos forfaitaires, inclusive no forfait majoré, quando tributados sobre o valor locativo."},{"title":"Perda do regime e consequências","body":"O regime cessa se qualquer condição deixar de ser preenchida — aquisição da nacionalidade suíça, início de atividade lucrativa na Suíça, ou separação de cônjuges com um deles deixando de cumprir os requisitos.\n\n<strong>Consequência:</strong> passagem à tributação ordinária mundial sobre renda e fortuna.\n\n<em>NÃO CONFIRMADO em fonte oficial:</em> os efeitos retroativos e os prazos exatos dessa transição."}],"brazilNote":"A <strong>Convenção Brasil–Suíça</strong> foi assinada em 3/5/2018, <strong>entrou em vigor em 16/3/2021</strong>, foi promulgada pelo Decreto n.º 10.714 de 8/6/2021 e produz efeitos, em geral, desde 1/jan/2022.\n\n<strong>Alíquotas convencionais:</strong> dividendos a <strong>10%</strong> quando o beneficiário efetivo é sociedade detentora de ao menos 10% do capital; pisos convencionais de <strong>4,9%</strong> para juros e <strong>10%</strong> para royalties. A convenção cobre também a CSLL, contém <strong>cláusula PPT (antiabuso)</strong> e trata de entidades transparentes como trusts e partnerships.\n\n<em>NÃO CONFIRMADO:</em> as alíquotas gerais de dividendos, juros e serviços técnicos exigem leitura do texto integral do Decreto 10.714/2021. Também não foi localizada posição oficial da Receita Federal ou da administração suíça sobre se o forfait afeta o acesso a esse tratado — o Brasil <strong>não</strong> consta da lista de países que restringem benefícios convencionais a forfaitaires.\n\n<strong>Saída fiscal do Brasil</strong> (IN SRF 208/2002): Comunicação de Saída Definitiva do dia da saída até o <strong>último dia de fevereiro</strong> do ano-calendário seguinte; Declaração de Saída Definitiva entregue <strong>de março a maio</strong>, sem prorrogação.\n\n<strong>CRS:</strong> a coleta de dados entre Brasil e Suíça começou em 1/jan/2018, com o primeiro intercâmbio automático efetivo em 2019, referente ao ano-base 2018.","impact":"Não exige declaração de ativos e rendimentos globais. Ganhos de capital sobre ativos financeiros mobiliários pessoais são isentos — regra geral suíça para pessoas físicas sem atividade de negociação profissional, preservada também sob este regime. Rede de 60+ tratados de dupla tributação. Elegibilidade a passaporte suíço após 10–12 anos.","warning":"Ambos os cônjuges devem preencher individualmente todos os requisitos — regra endurecida pela Circular 44. O acesso a tratados de dupla tributação é restrito: sete países exigem o forfait majoré e a França recusa o benefício convencional desde 2012. Proposta de imposto sucessório federal sobre patrimônio >CHF 50M esteve em debate político (não aprovada); referendo de 2014 rejeitou a abolição do regime por 59% a 41%.","sources":[{"t":"Fedlex · LIFD Art. 14 (RS 642.11)","u":"https://www.fedlex.admin.ch/eli/cc/1991/1184_1184_1184/fr"},{"t":"Fedlex · Ordonnance imposition d'après la dépense (RO 2013/157)","u":"https://www.fedlex.admin.ch/eli/cc/2013/157/fr"},{"t":"EFD/DFF · Imposition d'après la dépense","u":"https://www.efd.admin.ch/fr/imposition-depense"},{"t":"ge.ch · Le calcul lié à l'imposition d'après la dépense","u":"https://www.ge.ch/imposition-apres-depense/calcul-lie-imposition-apres-depense"},{"t":"ge.ch · L'imposition modifiée (forfait majoré)","u":"https://www.ge.ch/imposition-apres-depense/imposition-modifiee"},{"t":"OFSP · Prêmios LAMal 2026","u":"https://www.bag.admin.ch/fr/newnsb/d2okh_kUK_OFhmMDfpyiy"},{"t":"AHV/AVS · Cotisations des non-actifs (memento 2.03)","u":"https://www.ahv-iv.ch/p/2.03.f"},{"t":"Receita Federal · Decreto 10.714/2021 (CDT Brasil–Suíça)","u":"https://www.gov.br/receitafederal/pt-br/acesso-a-informacao/legislacao/acordos-internacionais/acordos-para-evitar-a-dupla-tributacao/suica/decreto-no-10-714-de-8-de-junho-de-2021"}]}],"visa":[{"name":"Residência por Lump-Sum Fiscal (B-permit)","status":"ok","legalBasis":"LEI/AIG (RS 142.20): Art. 28 (rentistas), Art. 30 al. 1 let. b (derrogação por interesse público preponderante) e Art. 44 (reagrupamento familiar). OASA/VZAE (RS 142.201): Art. 25 (rentistas) e Art. 32 (interesses cantonais maiores em matéria fiscal). Directives LEI da SEM. ALCP/FZA (RS 0.142.112.681) para nacionais da UE/AELE.","desc":"A Suíça não opera um golden visa formal por investimento imobiliário. A residência é obtida por um processo binário: <strong>(i) ruling fiscal</strong> negociado com a autoridade tributária cantonal e <strong>(ii) permissão de residência</strong> concedida pela autoridade de migração cantonal.\n\nO resultado é uma permissão de residência <strong>B</strong>, anual e renovável. A última estatística oficial disponível registra <strong>4.557 titulares</strong> ao final de 2018, que pagaram CHF 821 milhões em impostos naquele ano.\n\n<strong>Há duas vias distintas para nacionais de países fora da UE/AELE — e a diferença entre elas é frequentemente confundida:</strong>\n\n<strong>Via do interesse fiscal (Art. 30 al. 1 let. b LEI):</strong> a autorização é concedida por derrogação, e o Art. 32 da OASA cita expressamente os \"interesses cantonais maiores em matéria fiscal\" como fundamento. A SEM <strong>não exige</strong> idade mínima nem laços estreitos prévios com a Suíça nesse fundamento.\n\n<strong>Via do rentista (Art. 28 LEI / Art. 25 OASA):</strong> exige, cumulativamente, <strong>idade mínima de 55 anos</strong>, laços pessoais especiais com a Suíça, meios financeiros suficientes e <strong>nenhuma atividade lucrativa nem na Suíça nem no exterior</strong> — restrição mais severa do que a regra fiscal do Art. 14 LIFD, que admite atividade no exterior.\n\nNacionais da UE/AELE seguem o Acordo de Livre Circulação (ALCP), com requisitos de meios financeiros suficientes e cobertura de saúde.","kv":[{"l":"Tipo de permissão","v":"B-permit anual"},{"l":"Titulares (últ. estatística oficial)","v":"4.557 (2018)"},{"l":"Arrecadação (2018)","v":"CHF 821 milhões"},{"l":"Via interesse fiscal","v":"Art. 30 al. 1 let. b — sem idade mínima"},{"l":"Via rentista","v":"Art. 28 — 55 anos + sem atividade global"},{"l":"Anmeldung na comuna","v":"Até 14 dias da chegada"},{"l":"Permit C (estabelecimento)","v":"5 anos (UE/AELE) · 10 anos (demais)"},{"l":"Naturalização","v":"10–12 anos"}],"requirements":["<strong>Via interesse fiscal (Art. 30 al. 1 let. b LEI + Art. 32 OASA):</strong> demonstração de interesse cantonal maior em matéria fiscal, atestado pelo ruling. A SEM não exige laços prévios com a Suíça nesse fundamento.","<strong>Via rentista (Art. 28 LEI + Art. 25 OASA), cumulativamente:</strong> idade mínima de <strong>55 anos</strong>; laços pessoais especiais com a Suíça; meios financeiros suficientes; e <strong>nenhuma atividade lucrativa na Suíça nem no exterior</strong>, salvo a gestão do próprio patrimônio.","<strong>Nacionais da UE/AELE:</strong> residência sem atividade lucrativa ao abrigo do ALCP, com meios financeiros suficientes e cobertura de saúde. <em>Valores de suficiência não confirmados em fonte oficial.</em>","Contratação obrigatória do <strong>seguro-saúde LAMal</strong>.","Manutenção de <strong>domicílio efetivo</strong> no cantão — a prática é cantonal e não há regra numérica federal publicada de dias mínimos de permanência."],"process":[{"step":"Ruling fiscal cantonal","detail":"Negociado antes ou em paralelo ao pedido migratório — a autoridade de migração se baseia no interesse fiscal cantonal atestado pelo acordo."},{"step":"Pedido à autoridade cantonal de migração","detail":"Aprovação cantonal seguida de <strong>aprovação federal da SEM</strong> nos casos fundados no Art. 30 al. 1 let. b LEI. <em>Prazos oficiais não publicados.</em>"},{"step":"Entrada na Suíça","detail":"Com visto D quando exigido pela nacionalidade. <em>NÃO CONFIRMADO: se brasileiros, isentos de visto de curta duração, precisam de visto nacional D para residência.</em>"},{"step":"Anúncio de chegada na comuna (Anmeldung)","timing":"Até 14 dias","detail":"Registro junto ao controle de habitantes do município."},{"step":"Biometria e emissão do permit","detail":"Comparecimento ao centro de documentos de identidade; permit em formato cartão, enviado à comuna. Dados biométricos válidos por 5 anos."},{"step":"Contratação do seguro LAMal","detail":"Obrigatória para todos os residentes. <em>Prazo legal de 3 meses da chegada não confirmado em fonte oficial.</em>"},{"step":"Renovação anual","detail":"Verificação da manutenção do ruling, do pagamento efetivo do imposto, da ausência de atividade lucrativa e da residência efetiva no cantão. O permit C (estabelecimento) vem após 5 anos para UE/AELE ou 10 anos para as demais nacionalidades."}],"costs":[{"item":"Custo fiscal","value":"Idêntico ao forfait","note":"o permit é condicionado ao ruling"},{"item":"AVS/AHV sem atividade lucrativa","value":"CHF 530 – 26.500/ano","note":"por pessoa; casal sem atividade pode aproximar-se de CHF 53.000/ano"},{"item":"LAMal — adulto (2026)","value":"CHF 465,30/mês","note":"média nacional"},{"item":"LAMal — criança (2026)","value":"CHF 122,50/mês"},{"item":"Emolumentos de permit e biometria","value":"Não confirmado","note":"tabela oficial de emolumentos cantonais não localizada"}],"sections":[{"title":"Interação entre o regime fiscal e o migratório","body":"A autorização de residência depende do ruling fiscal. A perda do regime fiscal tende a retirar o fundamento do Art. 30 al. 1 let. b LEI e afeta a renovação do permit.\n\n<em>NÃO CONFIRMADO:</em> se a consequência migratória da perda do regime fiscal é automática."},{"title":"Residência efetiva e dias de permanência","body":"A manutenção do permit exige domicílio efetivo no cantão. A doutrina especializada suíça trata das exigências de duração mínima de estadia para o forfaitaire.\n\n<em>NÃO CONFIRMADO:</em> não há regra numérica federal publicada de dias mínimos — a prática é definida cantão a cantão. A Suíça também não fixa uma contagem de dias isolada como critério de residência fiscal, diferentemente do que ocorre em convenções internacionais."},{"title":"Família","body":"Cônjuge e filhos são incluídos na base de cálculo do forfait, mas precisam de processo migratório próprio de <strong>reagrupamento familiar (Art. 44 LEI)</strong>, dentro do prazo de 5 anos da concessão do permit principal — ou 12 meses, se o filho tiver mais de 12 anos.\n\nLembrete importante do regime fiscal: <strong>ambos os cônjuges</strong> devem preencher individualmente todos os requisitos do forfait."}],"brazilNote":"Brasileiros são <strong>nacionais de terceiro Estado</strong> para efeitos da LEI e, portanto, sujeitos à via do interesse fiscal (Art. 30 al. 1 let. b) ou à via do rentista (Art. 28, com idade mínima de 55 anos) — não ao ALCP, que se aplica apenas a nacionais da UE/AELE.\n\nAplicam-se integralmente as obrigações brasileiras de saída fiscal descritas no regime fiscal: Comunicação de Saída Definitiva até o último dia de fevereiro do ano seguinte e Declaração de Saída Definitiva de março a maio.\n\nO <strong>CRS entre Brasil e Suíça</strong> tem coleta de dados desde 1/jan/2018, com o primeiro intercâmbio automático em 2019.","impact":"Combina residência estável e privacidade fiscal. A via do interesse fiscal (Art. 30) não impõe idade mínima, ao contrário da via do rentista (Art. 28, 55 anos). Direcionado a patrimônio líquido a partir de USD 20M — referência de mercado, sem exigência legal formal.","warning":"A via do rentista (Art. 28) exige ausência de atividade lucrativa também no exterior — restrição mais severa que a do regime fiscal do Art. 14 LIFD, que admite atividade fora da Suíça. Confirme qual via fundamenta o pedido antes de estruturar a mudança.","sources":[{"t":"SEM · Directives LEI (PDF)","u":"https://www.sem.admin.ch/dam/sem/fr/data/rechtsgrundlagen/weisungen/auslaender/weisungen-aug-f.pdf"},{"t":"EFD/DFF · Imposition d'après la dépense (estatísticas)","u":"https://www.efd.admin.ch/fr/imposition-depense"},{"t":"vd.ch · Titre de séjour e biometria","u":"https://www.vd.ch/population/documents-didentite/nouveau-titre-de-sejour-et-deplacement-au-centre-de-biometrie"},{"t":"Lausanne · Anúncio de chegada em 14 dias","u":"https://www.lausanne.ch/prestations/controle-des-habitants/arrivee-etrangers-permis-b-f-l-etudiants-touristes.html"}]}]},"it":{"id":"it","flagCode":"it","name":"Itália","region":"Europa","alert":true,"sumFiscal":"Flat Tax €300k/ano (desde jan/2026)","sumFS":"changed","sumVisa":"Investor Visa €250k–€2M","sumVS":"ok","fiscal":[{"name":"Flat Tax para Novos Residentes (Art. 24-bis TUIR)","status":"changed","legalBasis":"Art. 24-bis TUIR (D.P.R. 917/1986), introduzido pelo art. 1, co. 152, da L. 232/2016; dispensa de monitoraggio, IVIE/IVAFE e regra sucessória no co. 153. Provvedimento do Diretor da Agenzia delle Entrate de 8/3/2017. Circolare 17/E de 23/5/2017. Elevação a €200.000 pelo D.L. 113/2024 (conv. L. 143/2024); a €300.000 pela L. 199/2025 (Legge di Bilancio 2026).","desc":"Criado em 2017, o regime sofreu três reajustes: €100k (2017–ago/2024) → €200k (ago/2024–dez/2025) → €300k/ano (desde 1 jan/2026). Aplica imposto fixo anual <em>substitutivo</em> de €300.000 sobre <strong>todos os rendimentos de fonte estrangeira</strong>. Rendimentos italianos são tributados normalmente (IRPEF). Quem já exerceu a opção antes de cada aumento mantém o valor vigente à época da adesão.\n\n<strong>Familiar:</strong> €50.000/pessoa/ano. <strong>Duração máxima:</strong> 15 anos, com renovação tácita ano a ano.\n\n<strong>Exclusão:</strong> mais-valias de participações qualificadas (art. 67, co. 1, letra \"c\", TUIR) realizadas nos <strong>primeiros cinco períodos de imposta</strong> ficam fora do regime substitutivo, tributadas pelo regime ordinário (art. 68, co. 3, TUIR).","kv":[{"l":"Imposto fixo anual","v":"€300.000"},{"l":"Familiar","v":"€50.000/pessoa"},{"l":"Duração","v":"15 anos"},{"l":"Não-residente prévia","v":"9 dos 10 anos"},{"l":"Renda italiana","v":"IRPEF normal"},{"l":"Crédito ext.","v":"❌ Não disponível"},{"l":"IVIE / IVAFE","v":"❌ Não devidas"},{"l":"Quadro RW (monitoraggio)","v":"❌ Dispensado"},{"l":"Pagamento","v":"Até 30/jun (F24 ELIDE, cód. NRPP)"},{"l":"Interpello (ruling)","v":"Facultativo · resposta em 120 dias"}],"requirements":["Pessoa física que transfere a residência fiscal para a Itália — <strong>independe de nacionalidade</strong>; italianos repatriados também podem aderir.","<strong>Não ter sido residente fiscal na Itália em ao menos 9 dos 10 períodos de imposta anteriores</strong> ao início da validade da opção.","Adquirir efetivamente a residência fiscal italiana pelo art. 2 do TUIR, reescrito pelo D.Lgs. 209/2023 (efeitos desde 1/jan/2024). Basta <strong>um</strong> de quatro critérios alternativos, por mais da metade do período de imposta (183 dias; 184 em ano bissexto), computadas frações de dia.","Familiares elegíveis à extensão são apenas os do <strong>art. 433 do Código Civil</strong>: cônjuge, filhos e descendentes, pais e ascendentes, genros e noras, sogros, irmãos e irmãs germanos ou unilaterais.","Cada familiar deve satisfazer <strong>autonomamente</strong> o teste de não-residência de 9 dos 10 anos."],"process":[{"step":"Interpello probatorio (opcional)","timing":"Resposta em 120 dias","detail":"Pedido à Agenzia delle Entrate nos termos do art. 11, co. 1, letra \"f\", da L. 212/2000, instruído com a <strong>check-list obrigatória</strong> anexa ao Provvedimento de 8/3/2017. Não é condição de acesso ao regime. Causas de inadmissibilidade incluem check-list incompleta ou documentação de suporte ausente. Isento de taxa."},{"step":"Transferência efetiva da residência","detail":"Inscrição na anagrafe da população residente e configuração de um dos critérios do art. 2 do TUIR por mais de 183 dias no período de imposta."},{"step":"Exercício da opção na declaração de renda","timing":"Ano da transferência ou o seguinte","detail":"A opção é feita na <em>dichiarazione dei redditi</em> relativa ao período em que a residência foi transferida <strong>ou na do período imediatamente seguinte</strong>. É obrigatório indicar a jurisdição de última residência fiscal e os <strong>Estados que o contribuinte exclui</strong> do perímetro da substitutiva."},{"step":"Pagamento do imposto substitutivo","timing":"Até 30 de junho, anualmente","detail":"Parcela única, via <strong>F24 ELIDE</strong>, código tributo <strong>NRPP</strong> (\"Imposta sostitutiva dell'Irpef – Nuovi residenti – art. 24-bis, co. 2, TUIR\"). O não pagamento integral no prazo causa <em>decadência</em> do regime."},{"step":"Extensão a familiares","detail":"Indicada na declaração do período em que <strong>o familiar</strong> transfere a residência, ou na seguinte. Pode ser feita a qualquer momento ao longo da vigência da opção e revogada individualmente."}],"costs":[{"item":"Imposto substitutivo anual (titular)","value":"€300.000"},{"item":"Por familiar estendido","value":"€50.000/ano"},{"item":"IRPEF sobre renda de fonte italiana","value":"23% / 33% / 43%","note":"escalões 2026: até €28k · €28–50k · acima de €50k"},{"item":"IVIE e IVAFE","value":"Não devidas"},{"item":"Imposto sucessório — cônjuge e linha reta","value":"4%","note":"acima de franquia de €1.000.000 por beneficiário"},{"item":"Imposto sucessório — irmãos","value":"6%","note":"acima de franquia de €100.000"},{"item":"Imposto sucessório — demais parentes até 4º grau","value":"6%","note":"sem franquia"},{"item":"Imposto sucessório — demais pessoas","value":"8%","note":"sem franquia"},{"item":"Interpello probatorio","value":"Isento"}],"sections":[{"title":"O que conta como renda de fonte estrangeira","body":"O perímetro da substitutiva é a renda produzida no exterior segundo o <strong>art. 165, co. 2, do TUIR</strong>, que remete de forma espelhada ao art. 23. Pelo art. 23, co. 1, letra \"c\", a renda de trabalho dependente é <strong>produzida na Itália quando a prestação é executada no território do Estado</strong>.\n\n<strong>Consequência prática para trabalho remoto:</strong> quem reside na Itália e trabalha fisicamente da Itália para empregador estrangeiro gera <strong>renda italiana</strong>, tributada por IRPEF ordinária — fica fora da flat tax. É um dos erros de planejamento mais comuns neste regime.\n\nO art. 23, co. 2, sujeita à tributação italiana, independentemente do local de execução, as pensões, o TFR, os royalties e as compensações por patentes pagos por sujeitos residentes ou por estabelecimentos permanentes italianos."},{"title":"Cherry picking e acesso a tratados","body":"Imposto pago no exterior sobre renda coberta pela substitutiva <strong>não gera crédito</strong> e não é recuperável. O único mecanismo para acessar proteção convencional e crédito por impostos estrangeiros é <strong>excluir a jurisdição</strong> do perímetro da opção, submetendo aquela renda à tributação ordinária italiana.\n\nA exclusão abrange <strong>toda a renda produzida naquele país</strong> e é <strong>irreversível</strong>: jurisdições excluídas não podem ser reintegradas à flat tax em anos seguintes.\n\n<em>Ponto em aberto:</em> não há posição oficial consolidada sobre se administrações fiscais estrangeiras concedem benefícios convencionais a residentes italianos sob o 24-bis — a questão do requisito \"liable to tax\" do art. 4 das convenções é objeto de debate doutrinário."},{"title":"Monitoraggio fiscale, IVIE e IVAFE","body":"O <strong>art. 1, co. 153, da L. 232/2016</strong> dispensa os optantes do <em>monitoraggio fiscale</em>: não preenchem o quadro RW para investimentos e ativos estrangeiros, e não devem IVIE (imposto sobre imóveis no exterior) nem IVAFE (sobre ativos financeiros no exterior).\n\nPara referência, quem não está no regime paga IVIE de 1,06% e IVAFE de 0,2% (0,4% para jurisdições privilegiadas), além de €34,20 fixos por conta corrente com saldo médio superior a €5.000.\n\n<em>Ponto de atenção documentado:</em> há divergências interpretativas entre o texto legal e posições da Agenzia sobre a extensão da dispensa, especialmente quanto a participações qualificadas durante o período de exclusão quinquenal."},{"title":"Sucessões e doações sob o regime","body":"Durante a validade do 24-bis, o imposto de sucessão e doação incide <strong>apenas sobre bens e direitos existentes na Itália</strong>, com exclusão integral dos ativos estrangeiros. É uma das características estruturais do regime.\n\n<em>NÃO CONFIRMADO:</em> se a regra se estende automaticamente aos familiares incluídos por extensão da opção."},{"title":"Saída do regime: revoca vs. decadenza","body":"Três eventos distintos encerram o regime, com efeitos diferentes:\n\n<strong>Cessação natural</strong> — ao fim dos 15 anos contados do primeiro período de validade.\n\n<strong>Revoca</strong> — voluntária, a qualquer tempo. A substitutiva já paga é utilizável em compensação. <strong>Não impede</strong> o reexercício futuro da opção.\n\n<strong>Decadenza</strong> — por omissão ou pagamento parcial da substitutiva no prazo, ou por transferência da residência para outro Estado. <strong>Impede o reexercício futuro da opção.</strong> Não se admite <em>remissione in bonis</em> para o pagamento em atraso.\n\nA decadência do titular principal extingue também a extensão aos familiares; o inverso não ocorre."}],"brazilNote":"A <strong>Convenção Brasil–Itália</strong> foi assinada em Roma em 3/10/1978, promulgada pelo Decreto 85.985 de 6/5/1981 e está em vigor desde 24/4/1981. O art. 4 define \"residente de um Estado Contratante\" e traz a sequência de critérios de desempate para dupla residência.\n\n<strong>Aplicação prática sob o 24-bis:</strong> a renda de fonte brasileira é renda estrangeira para o optante e cai na substitutiva — <strong>sem crédito pelo IRRF brasileiro</strong>. Para invocar as reduções convencionais na fonte brasileira e recuperar o imposto retido, seria necessário excluir o Brasil do perímetro da opção.\n\n<em>NÃO CONFIRMADO:</em> não foi localizada posição da Receita Federal ou da Agenzia delle Entrate sobre se o optante do 24-bis é considerado \"residente\" para fins do art. 4 do tratado Brasil–Itália.\n\n<strong>Saída fiscal do Brasil</strong> (IN SRF 208/2002): Comunicação de Saída Definitiva até o <strong>último dia de fevereiro</strong> do ano seguinte à saída; Declaração de Saída Definitiva até o <strong>último dia útil de abril</strong> do mesmo ano. Sem esses atos, o contribuinte permanece residente fiscal no Brasil, tributado em bases universais.","impact":"Aplica-se a rendas globais acima de €2M/ano. O valor equivale a 3× o praticado pela Grécia (€100k/ano). Residentes anteriores ao aumento de 2026 mantêm a alíquota vigente à época da opção.","warning":"Regime aumentado 3 vezes em 8 anos, sem garantia de estabilidade por horizonte de 15 anos. Renda de trabalho prestado fisicamente em território italiano não se qualifica como renda estrangeira, mesmo se paga por empregador no exterior. A decadência por falta de pagamento impede o reexercício futuro da opção.","sources":[{"t":"Agenzia delle Entrate · Scheda opzione neo-residenti","u":"https://www.agenziaentrate.gov.it/portale/schede/agevolazioni/opzione-per-i-neo-residenti/infogen-opzionale-neo-residenti"},{"t":"Agenzia delle Entrate · Circolare 20/E (4/11/2024) — residência fiscal","u":"https://www.agenziaentrate.gov.it/portale/documents/20143/6519685/circolare+n.+20+de+4+novembre+2024+residenza+pdf.pdf"},{"t":"Agenzia delle Entrate · Imposta di successione","u":"https://www.agenziaentrate.gov.it/portale/schede/pagamenti/imposta-di-successione/aliquote-e-franchigie"},{"t":"Normattiva · Art. 24-bis TUIR (D.P.R. 917/1986)","u":"https://www.normattiva.it"},{"t":"Decreto 85.985/1981 · CDT Brasil–Itália","u":"https://www.planalto.gov.br/ccivil_03/atos/decretos/1981/d85985.html"}]},{"name":"Flat Tax 7% para Aposentados Estrangeiros (Art. 24-ter TUIR)","status":"ok","legalBasis":"Art. 24-ter TUIR (D.P.R. 917/1986), introduzido pela L. 145/2018 (Legge di Bilancio 2019) e modificado pela L. 58/2019 (conversão do D.L. 34/2019). Provvedimento do Diretor da Agenzia delle Entrate de 31/5/2019. Risoluzione 19/E/2020 (código tributo 1899). Limite populacional elevado a 30.000 habitantes pelo art. 26 da L. 34 de 11/3/2026.","desc":"Alíquota substitutiva de <strong>7%</strong> para quem transfere residência fiscal para municípios elegíveis do <strong>Sul da Itália</strong> (Sicília, Calábria, Sardenha, Campânia, Basilicata, Abruzzo, Molise, Puglia). Duração de <strong>10 anos</strong> — o período de exercício mais os 9 seguintes.\n\n<strong>Escopo mais amplo do que o nome sugere:</strong> apesar de ser conhecido como \"regime dos aposentados\", a alíquota de 7% incide sobre <strong>toda categoria de renda produzida no exterior</strong> — dividendos, juros, aluguéis, mais-valias — e não apenas sobre a pensão. A pensão estrangeira é <strong>requisito de acesso</strong>, não o limite do perímetro tributável.\n\n<strong>Atualização (7/abr/2026):</strong> o limite populacional dos municípios elegíveis foi ampliado de 20.000 para 30.000 habitantes pelo art. 26 da Legge 11 de março de 2026, n. 34 (\"Legge annuale PMI\"), publicada na Gazzetta Ufficiale em 23/03/2026 — o que tornou elegíveis centros urbanos médios antes excluídos.","kv":[{"l":"Alíquota","v":"7% sobre toda renda estrangeira"},{"l":"Duração","v":"10 anos"},{"l":"Não-residente prévia","v":"5 anos"},{"l":"Localização","v":"Sul, <30.000 hab. (desde abr/2026)"},{"l":"Zonas sísmicas","v":"Limite de 3.000 hab."},{"l":"Renda italiana","v":"IRPEF normal"},{"l":"Familiar","v":"Sem extensão — qualifica separadamente"},{"l":"Pagamento","v":"Até 30/jun (F24, cód. 1899)"}],"requirements":["Ser <strong>titular de rendimento de pensão de fonte estrangeira</strong> — rendimentos do art. 49, co. 2, letra \"a\", do TUIR pagos por sujeitos estrangeiros. A prassi estendeu o regime também a rendimentos de liquidação/capital correlatos.","<strong>Não ter sido residente fiscal na Itália nos 5 períodos de imposta anteriores</strong> ao de início da opção.","Transferir a residência <strong>de um país com o qual esteja em vigor acordo de cooperação administrativa em matéria fiscal</strong> (troca de informações) com a Itália.","Transferir a residência fiscal para um <em>comune</em> de uma das <strong>8 regiões elegíveis</strong> com população <strong>não superior a 30.000 habitantes</strong>.","Para <em>comuni</em> em zonas sísmicas listadas no D.L. 189/2016 e atingidos pelo sismo de 6/4/2009, o limite permanece em <strong>3.000 habitantes</strong>.","Adquirir residência fiscal italiana pelos critérios do art. 2 do TUIR (mesmo teste dos 183 dias do regime 24-bis)."],"process":[{"step":"Verificar a elegibilidade do município","detail":"Confirmar antes da mudança que o <em>comune</em> pertence a uma das 8 regiões e respeita o limite populacional, cruzando com dados do ISTAT. Este é o ponto de maior risco operacional do regime."},{"step":"Transferir a residência e inscrever-se na anagrafe","detail":"Registro no <em>comune</em> elegível e configuração da residência fiscal pelo art. 2 do TUIR."},{"step":"Exercer a opção na declaração de renda","timing":"Ano da transferência","detail":"Indicando obrigatoriamente: a jurisdição de última residência fiscal (entre as com acordo de cooperação administrativa); os Estados estrangeiros excluídos da substitutiva; o Estado de residência do sujeito que paga a pensão; e o montante da renda estrangeira submetida à substitutiva."},{"step":"Pagamento do imposto substitutivo","timing":"Até 30 de junho, anualmente","detail":"Parcela única, via F24, código tributo <strong>1899</strong> (instituído pela Risoluzione 19/E/2020) — código distinto do NRPP usado no 24-bis."}],"costs":[{"item":"Imposto substitutivo","value":"7% da renda estrangeira","note":"alíquota proporcional, sem valor mínimo nem forfait"},{"item":"Extensão a familiares","value":"Não existe","note":"cada pessoa exerce a própria opção, se qualificar"},{"item":"IRPEF sobre renda de fonte italiana","value":"23% / 33% / 43%","note":"escalões 2026"},{"item":"Imposto sucessório","value":"Regime ordinário italiano","note":"sem a limitação a bens italianos que existe no 24-bis"}],"sections":[{"title":"Municípios elegíveis: como verificar","body":"Não há lista oficial única publicada pela Agenzia delle Entrate. A verificação se faz cruzando dois dados: (a) o <em>comune</em> pertencer a uma das <strong>8 regiões</strong> listadas; (b) a <strong>população residente</strong> conforme dados do ISTAT.\n\n<em>NÃO CONFIRMADO:</em> permanece indefinido, em fonte primária, qual data de referência do ISTAT vale (censo permanente vs. população em 1º de janeiro do ano anterior) e se a perda de elegibilidade por crescimento populacional afeta quem já optou. Exige verificação caso a caso antes da mudança."},{"title":"Diferenças estruturais frente ao regime 24-bis","body":"Comparação puramente descritiva entre os dois regimes italianos:\n\n<strong>Base de cálculo:</strong> proporcional (7% da renda efetiva) no 24-ter; forfetária (€300.000 fixos) no 24-bis.\n<strong>Não-residência prévia:</strong> 5 anos no 24-ter; 9 dos 10 anos no 24-bis.\n<strong>Duração:</strong> 10 anos no 24-ter; 15 anos no 24-bis.\n<strong>Localização:</strong> vínculo geográfico obrigatório no 24-ter; livre escolha do domicílio no 24-bis.\n<strong>Troca de informações:</strong> exigida com o país de origem no 24-ter; não exigida no 24-bis.\n<strong>Família:</strong> sem extensão no 24-ter; €50.000 por familiar no 24-bis.\n<strong>Sucessões:</strong> regime ordinário no 24-ter; limitado a bens italianos no 24-bis."},{"title":"Cherry picking","body":"Mesma lógica do 24-bis: o contribuinte pode indicar Estados excluídos da substitutiva, cuja renda passa a ser tributada por IRPEF ordinária, com crédito por impostos estrangeiros."}],"brazilNote":"Para aposentados brasileiros, é necessário verificar se a pensão é paga por sujeito estrangeiro — pensões do <strong>INSS</strong> e de previdência privada brasileira qualificam como fonte estrangeira para a Itália.\n\nO <strong>requisito de troca de informações está satisfeito</strong>: Brasil e Itália têm CDT em vigor com cláusula de troca de informações (Decreto 85.985/1981) e ambos aderem ao CRS da OCDE.\n\n<strong>Tributação na fonte brasileira:</strong> a pensão paga do Brasil pode sofrer retenção; sob a substitutiva de 7% <strong>não há crédito</strong>, salvo se o Brasil for excluído do perímetro da opção.\n\n<em>NÃO CONFIRMADO:</em> o tratamento de pensões públicas vs. privadas sob os arts. 18 e 19 do CDT Brasil–Itália não foi verificado no texto convencional.\n\n<strong>Saída fiscal do Brasil:</strong> mesmas obrigações da IN SRF 208/2002 — Comunicação até o último dia de fevereiro; Declaração até o último dia útil de abril.","impact":"Aplicável a titulares de pensão estrangeira que fixem residência no Sul da Itália. A alíquota de 7% incide sobre a renda estrangeira efetiva de qualquer categoria, em contraste com o valor fixo de €300k do regime para novos residentes.","warning":"A elegibilidade do município é o principal risco operacional: não há lista oficial publicada, e a data de referência dos dados do ISTAT não está definida em fonte primária. Confirme o enquadramento do comune antes de transferir a residência.","sources":[{"t":"Agenzia delle Entrate · Regime pensionati esteri","u":"https://www.agenziaentrate.gov.it/portale/schede/agevolazioni/regime-opzionale-per-i-pensionati-esteri-che-cose-cittadini"},{"t":"Agenzia delle Entrate · Come si perfeziona l'opzione","u":"https://www.agenziaentrate.gov.it/portale/schede/agevolazioni/regime-opzionale-per-i-pensionati-esteri/come-si-perfeziona-l-opzione-cittadini"},{"t":"Legge 11 marzo 2026, n. 34 (GU 23/03/2026)","u":"https://www.gazzettaufficiale.it"}]}],"visa":[{"name":"Investor Visa — Visto per Investitori (VPI)","status":"ok","legalBasis":"Art. 26-bis do D.Lgs. 286/1998 (Testo Unico Immigrazione), introduzido pelo art. 1, co. 148-149, da L. 232/2016. Decreto interministerial MISE–MAECI–Interno de 21/7/2017 (procedimento e composição do Comitato). Policy Guidance e Manuale Operativo publicados pelo MIMIT.","desc":"Programa formal com quatro modalidades: (A) <strong>€250.000</strong> em startup inovadora inscrita na seção especial do Registro delle Imprese; (B) <strong>€500.000</strong> em quotas ou ações de sociedade de capitais italiana operante; (C) <strong>€1.000.000</strong> em <strong>doação filantrópica a fundo perdido</strong>, em projeto de interesse público nas áreas de cultura, instrução, gestão da imigração, pesquisa científica ou recuperação de bens culturais e paisagísticos; (D) <strong>€2.000.000</strong> em títulos da dívida pública italiana (BTP e afins).\n\n<strong>Característica distintiva:</strong> o desembolso ocorre <strong>depois</strong> da aprovação — o investimento só precisa ser efetivado em até 3 meses da entrada na Itália, e não como condição prévia ao pedido.\n\n<strong>Órgão gestor:</strong> Ministero delle Imprese e del Made in Italy (MIMIT, sucessor do MISE), através do Comitato Investor Visa for Italy.\n\n<strong>Sem requisito de permanência mínima</strong> para obtenção ou renovação do permesso — o que separa o status migratório do status fiscal.","kv":[{"l":"Startup inovadora","v":"€250.000"},{"l":"Sociedade de capitais IT","v":"€500.000"},{"l":"Doação filantrópica","v":"€1.000.000"},{"l":"Títulos públicos (BTP)","v":"€2.000.000"},{"l":"Deliberação do Comitê","v":"Até 30 dias"},{"l":"Validade do Nulla Osta","v":"6 meses"},{"l":"Visto inicial","v":"2 anos"},{"l":"Prazo p/ efetivar investimento","v":"3 meses da entrada"},{"l":"Renovação","v":"3 anos"},{"l":"Permanência mínima","v":"❌ Não exigida"}],"requirements":["Ser <strong>cidadão não-UE</strong> (extracomunitário), maior de idade. Brasileiros com cidadania italiana ou de outro Estado-membro não são elegíveis e não precisam do instrumento.","Assumir <strong>compromisso de realizar uma das quatro modalidades</strong> de investimento ou doação.","Comprovar <strong>titularidade e disponibilidade</strong> dos recursos, demonstrando que são lícitos e efetivamente transferíveis para a Itália.","Apresentar <strong>declaração escrita de compromisso</strong> de utilizar os recursos na modalidade indicada dentro de 3 meses da entrada.","<strong>Ausência de condenações</strong> e de motivos de segurança que impeçam a entrada.","Manter o investimento por, no mínimo, 2 anos (modalidades A, B e D)."],"process":[{"step":"Registro no portal e submissão","detail":"Criação de conta em <em>investorvisa.mise.gov.it</em> e preenchimento do formulário eletrônico. Procedimento integralmente digital e gratuito nesta fase. Upload de passaporte, comprovação da origem lícita dos fundos, descrição do investimento-alvo, declaração de compromisso e certidões de antecedentes, em italiano ou inglês."},{"step":"Instrução pelo Comitato Investor Visa for Italy","timing":"30 dias para deliberar","detail":"O Comitê pode solicitar documentação integrativa; o requerente tem <strong>30 dias</strong> para atender, com o processo suspenso nesse intervalo. Deliberação e emissão do <strong>Nulla Osta</strong> em até 30 dias da apresentação completa."},{"step":"Pedido de visto no consulado","timing":"Janela de 6 meses","detail":"A partir do recebimento do Nulla Osta, o requerente tem 6 meses para apresentar o pedido na representação diplomático-consular italiana competente pela sua residência. É emitido <strong>visto nacional tipo D, válido por 2 anos</strong>."},{"step":"Entrada e pedido do permesso di soggiorno","timing":"8 dias da entrada","detail":"Pedido do <em>permesso di soggiorno \"per investitori\"</em> junto ao Sportello Unico/Questura, via kit postale, em até 8 dias da entrada em território italiano. Duração de 2 anos."},{"step":"Efetivação do investimento","timing":"3 meses da entrada","detail":"Realização integral do investimento ou doação, com upload da comprovação no portal antes do vencimento do prazo. <strong>O descumprimento acarreta revogação.</strong>"},{"step":"Renovação e residência de longo período","timing":"3 anos / 5 anos","detail":"Renovação por 3 anos mediante nulla osta do Comitê atestando a manutenção do investimento. Após <strong>5 anos</strong> de manutenção contínua, abre-se a possibilidade do <em>permesso di soggiorno UE per soggiornanti di lungo periodo</em>."}],"costs":[{"item":"Procedimento de Nulla Osta (portal)","value":"Sem taxa"},{"item":"Contributo do permesso di soggiorno","value":"€50,00","note":"faixa de mais de 1 e até 2 anos"},{"item":"Marca da bollo","value":"€16,00"},{"item":"Produção do permesso eletrônico","value":"€30,46"},{"item":"Serviço postal (kit postale)","value":"€30,00"},{"item":"Total aproximado do permesso","value":"≈ €126,46","note":"não inclui taxa consular do visto"},{"item":"Taxa consular do visto tipo D","value":"Não confirmada","note":"varia por representação e reciprocidade"}],"sections":[{"title":"Sequência completa de prazos","body":"Apresentação do pedido → <strong>30 dias</strong> (deliberação do Comitê) → <strong>6 meses</strong> (janela para pedir o visto) → <strong>2 anos</strong> (validade do visto para entrada) → <strong>8 dias</strong> (pedido do permesso após entrar) → <strong>3 meses</strong> (efetivação do investimento) → <strong>2 anos</strong> (duração do permesso) → <strong>3 anos</strong> (renovações) → <strong>5 anos</strong> (permesso UE de longo período)."},{"title":"Status migratório não é status fiscal","body":"O VPI <strong>não confere por si um regime fiscal</strong>. A residência fiscal segue os critérios do art. 2 do TUIR: sem permanência física relevante, o titular pode manter-se <strong>não-residente fiscal na Itália</strong>, tributado apenas sobre renda de fonte italiana pelo art. 23.\n\nO VPI é <strong>combinável com o regime do art. 24-bis</strong> para quem efetivamente transfere a residência — o próprio portal do Investor Visa dedica seção ao regime fiscal para novos residentes."},{"title":"Família","body":"Cônjuge e filhos <strong>não são incluídos automaticamente</strong> no visto do investidor. Exige-se pedido específico de <em>ricongiungimento familiare</em>, com instrução própria no Sportello Unico per l'Immigrazione, resultando em <em>permesso di soggiorno per motivi familiari</em> em processo apartado, que não segue os prazos do Comitê.\n\n<em>NÃO CONFIRMADO:</em> se o titular de VPI goza de procedimento simplificado ou de dispensa dos requisitos de renda e alojamento normalmente exigidos no ricongiungimento."},{"title":"Causas de revogação","body":"Não realização do investimento no prazo de 3 meses; desinvestimento antecipado; alteração da destinação do investimento; irrastreabilidade do titular no endereço declarado. O Comitê pode revogar o permesso a qualquer tempo se a Secretaria constatar qualquer dessas hipóteses."}],"brazilNote":"Brasileiros são elegíveis por serem cidadãos não-UE. Quem já possui cidadania italiana ou de outro Estado-membro não precisa do instrumento.\n\n<strong>Transferência de recursos:</strong> operações de câmbio para a Itália sujeitam-se às normas do Banco Central do Brasil; ativos mantidos no exterior podem exigir a <strong>Declaração de Capitais Brasileiros no Exterior (CBE)</strong> ao BCB, quando ultrapassados os limites vigentes.\n\n<strong>Comprovação de origem lícita</strong> ao Comitê pode exigir declarações de imposto de renda brasileiras, contratos e extratos — documentos que devem ser traduzidos e, conforme o caso, apostilados (Brasil e Itália são partes da Convenção da Apostila da Haia).\n\n<strong>Atenção:</strong> o VPI <strong>não desencadeia por si a saída fiscal do Brasil</strong>. A Comunicação e a Declaração de Saída Definitiva só são cabíveis se houver efetiva mudança de residência. O titular de VPI que não se transfere fisicamente <strong>permanece residente fiscal brasileiro</strong>, tributado em bases universais.","impact":"A modalidade de startup (€250k) é a de menor valor entre as quatro e pode ser combinada com o regime de 7% do Sul da Itália. A modalidade de títulos públicos (€2M) não exige atividade empresarial ativa. O capital só é desembolsado após a aprovação do pedido.","warning":"O investimento deve ser efetivado em até 3 meses da entrada, sob pena de revogação. Alterar a destinação do investimento ou desinvestir antecipadamente também causa revogação. Família não é incluída automaticamente — exige processo de reunificação familiar em separado.","sources":[{"t":"MIMIT · Investor Visa","u":"https://www.mimit.gov.it/it/impresa/competitivita-e-nuove-imprese/investor-visa"},{"t":"Investor Visa for Italy · Come funziona","u":"https://investorvisa.mise.gov.it/index.php/it/investor-visa-come-funziona"},{"t":"Investor Visa · Policy Guidance (PDF)","u":"https://investorvisa.mise.gov.it/images/documenti/Investor_Visa_for_Italy_Policy_guidance_ENG_19_07_2021.pdf"},{"t":"Poste Italiane · Kit postale permesso di soggiorno","u":"https://www.poste.it/guida-rilascio-e-rinnovo-permesso-di-soggiorno"}]}]},"pt":{"id":"pt","flagCode":"pt","name":"Portugal","region":"Europa","alert":true,"sumFiscal":"IFICI / NHR 2.0 — escopo restrito","sumFS":"changed","sumVisa":"Golden Visa restrito (sem imóvel urbano)","sumVS":"changed","fiscal":[{"name":"NHR — Non-Habitual Resident (Regime Original)","status":"ext","legalBasis":"Art. 16.º, n.os 8 a 12, do CIRS (versão anterior). Revogação e regime transitório pela Lei n.º 82/2023, de 29 de dezembro (Orçamento do Estado para 2024).","desc":"Criado em 2009, foi por mais de 14 anos o regime português de referência para residentes com rendimentos de fonte estrangeira. Oferecia isenção de imposto sobre rendimentos estrangeiros por 10 anos, mais alíquota flat de 20% sobre rendimentos profissionais de alto valor acrescentado. Encerrado para novas adesões em 1/jan/2024, com janela transitória até 31/mar/2025.\n\nO estatuto dura <strong>10 anos contados do primeiro ano de residência fiscal e não é renovável nem prorrogável</strong>. Não há renovação anual — mantém-se automaticamente até ao termo. Findo o prazo, o contribuinte passa a ser tributado pelas regras gerais do IRS.","kv":[{"l":"Status","v":"❌ Extinto jan/2024"},{"l":"Beneficiários antigos","v":"Mantêm os 10 anos"},{"l":"Janela transitória","v":"Encerrada mar/2025"},{"l":"Renovação","v":"❌ Não existe"},{"l":"Migração para o IFICI","v":"❌ Vedada"},{"l":"Base legal","v":"Lei 82/2023"}],"sections":[{"title":"O que muda para quem já tem NHR","body":"O estatuto extingue-se automaticamente ao fim dos 10 anos, sem qualquer possibilidade de renovação ou prorrogação para o mesmo beneficiário.\n\n<strong>Migração NHR → IFICI é vedada.</strong> O art. 58.º-A do EBF exclui expressamente quem beneficia ou beneficiou do NHR (e do Programa Regressar), com exceções transitórias estreitas que só operaram em 2024. O titular de NHR não pode \"saltar\" para o IFICI para estender o benefício.\n\n<em>NÃO CONFIRMADO:</em> o texto literal do número do art. 58.º-A que contém essa exclusão.\n\n<strong>Consequência de planeamento:</strong> no ano 11, rendimentos estrangeiros até então isentos entram na tributação normal, categoria a categoria, pelas taxas progressivas do IRS."}],"impact":"Afeta o planejamento fiscal de residentes com renda passiva estrangeira em Portugal. Regimes de imposto fixo alternativos incluem Grécia (€100k) e EAU (zero IR pessoal). Não há transição para o IFICI: o ex-beneficiário está expressamente excluído daquele regime.","warning":"O prazo de 10 anos é improrrogável e a migração para o IFICI é vedada por lei. Quem se aproxima do ano 10 deve planejar a transição para a tributação geral do IRS ou avaliar outra jurisdição — não há continuidade automática de benefício em Portugal.","sources":[{"t":"Portal das Finanças · AT","u":"https://www.portaldasfinancas.gov.pt"},{"t":"Ordem dos Advogados · Adesão ao RNH até março de 2025","u":"https://portal.oa.pt/comunicacao/imprensa/2024/2/20/adesao-ao-regime-do-residente-nao-habitual-sera-possivel-ate-marco-de-2025/"}]},{"name":"IFICI — Incentivo à Investigação e Inovação (NHR 2.0)","status":"new","legalBasis":"Art. 58.º-A do Estatuto dos Benefícios Fiscais, aditado pela Lei n.º 82/2023, de 29/12 (OE2024). Portaria n.º 352/2024/1, de 23 de
