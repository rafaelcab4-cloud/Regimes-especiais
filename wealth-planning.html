ógio reinicia integralmente.\n\n<strong>Comparação numérica:</strong> sob o regime anterior, o <em>deemed domicile</em> para IHT persistia por <strong>3 anos fiscais</strong> após a perda da residência. O novo regime pode estender esse período a até <strong>10 anos</strong>.","kv":[{"l":"Critério","v":"Residência: 10 de 20 anos fiscais"},{"l":"Alíquota padrão","v":"40%"},{"l":"Alíquota reduzida (legado beneficente)","v":"36%"},{"l":"Transferências em vida a trusts","v":"20%"},{"l":"Nil-rate band (NRB)","v":"£325.000"},{"l":"Residence nil-rate band (RNRB)","v":"£175.000"},{"l":"Teto conjugado por casal","v":"£1.000.000"},{"l":"Isenção conjugal — cônjuge LTR","v":"Ilimitada"},{"l":"Isenção conjugal — cônjuge não-LTR","v":"Limitada a £325.000"},{"l":"IHT tail mínimo","v":"3 anos fiscais"},{"l":"IHT tail máximo","v":"10 anos fiscais"},{"l":"Ten-year anniversary charge","v":"Até 6%"}],"sections":[{"title":"Alíquotas, faixas e regras de isenção","body":"· Alíquota-padrão sobre o excedente: <strong>40%</strong>\n· Alíquota reduzida (10% ou mais do espólio líquido a instituições beneficentes): <strong>36%</strong>\n· Transferências tributáveis em vida a trusts (<em>lifetime rate</em>): <strong>20%</strong>\n· <strong>Nil-rate band (NRB): £325.000</strong>\n· <strong>Residence nil-rate band (RNRB): £175.000</strong> — imóvel residencial transmitido a descendentes diretos\n· <strong>Taper da RNRB:</strong> reduz £1 para cada £2 de espólio acima de <strong>£2.000.000</strong>\n· NRB e RNRB são <strong>transferíveis entre cônjuges</strong> — até 100% da parcela não utilizada (TNRB e TRNRB)\n· <strong>Teto conjugado por casal: £1.000.000</strong> (£650.000 de NRB mais £350.000 de RNRB)\n· Congelamento das faixas até <strong>2030/31</strong> <em>— o Autumn Budget 2025 pode ter estendido para 2031; verificar</em>\n· <strong>Isenção conjugal:</strong> ilimitada se o cônjuge for LTR; <strong>limitada ao valor da NRB (£325.000)</strong> se não for, salvo <em>election</em> para ser tratado como LTR\n· <strong>Taper relief</strong> em PETs (<em>potentially exempt transfers</em>): 7 anos, com redução progressiva do imposto a partir do 3.º ano"},{"title":"Trusts — o fim da proteção permanente","body":"<strong>Mudança estrutural.</strong> A natureza de «propriedade excluída» (<em>excluded property</em>) dos ativos não britânicos em trust <strong>deixou de ser fixada permanentemente pelo domicílio do settlor no momento da constituição</strong>. Passou a ser <strong>testada na data de cada fato gerador de IHT</strong>, com referência ao status de LTR do settlor.\n\n<strong>Consequências práticas:</strong>\n· se o settlor é <strong>LTR na data do evento</strong>, os ativos não britânicos do trust entram no <em>relevant property regime</em>: <strong>entry charge de 20%</strong> (transferências em vida acima da NRB), <strong>ten-year anniversary charge de até 6%</strong> e <em>exit charges</em> proporcionais;\n· se o settlor <strong>deixa de ser LTR</strong>, os ativos voltam a ser <em>excluded property</em> — o regime é «liga-desliga»;\n· trusts constituídos por settlors <strong>falecidos antes de 6/abr/2025</strong> e trusts em que o settlor jamais será LTR permanecem protegidos.\n\n<strong>Gift with reservation of benefit (GWR):</strong> desde 6/abr/2025 os ativos de trust <em>settlor-interested</em> podem ser tratados como parte do espólio do settlor. <em>O escopo exato das regras GWR aplicáveis deve ser verificado.</em>"},{"title":"Medidas do Autumn Budget de 26 de novembro de 2025","body":"<strong>Teto de £5 milhões para relevant property charges</strong> — trusts de propriedade excluída constituídos <strong>antes de 30/out/2024</strong> têm as cobranças decenais e de saída limitadas a uma base de £5.000.000. Vigência: <strong>6 de abril de 2026</strong>.\n\n<strong>Regra anti-<em>decanting</em></strong> — cobrança de IHT quando ativos de trust são transferidos do Reino Unido para fora após o settlor deixar de ser LTR. Vigência <strong>imediata: 26 de novembro de 2025</strong>.\n\n<strong>Fundos de previdência não utilizados</strong> passam a integrar o espólio para IHT (anunciado no Autumn Budget 2024). Vigência: <strong>abril de 2027</strong>.\n\n<strong>Reforma de Agricultural Property Relief e Business Property Relief</strong> — alívio de 100% limitado a £1 milhão combinados; 50% acima disso. Vigência: <strong>abril de 2026</strong>. <em>A confirmar.</em>\n\n<strong>Imposto sobre patrimônio (wealth tax) e exit tax: NÃO foram introduzidos</strong> no Autumn Budget 2025."}],"brazilNote":"<strong>Não existe tratado sucessório entre Brasil e Reino Unido.</strong> A Convenção assinada em 2022 (ainda não em vigor) trata <strong>exclusivamente de tributos sobre a renda</strong>.\n\n<strong>Comparação estrutural:</strong>\n· <strong>IHT:</strong> federal (HMRC), alíquota de 40%, incide sobre o <strong>espólio</strong> (<em>estate tax</em>), isenção de £325.000 mais £175.000, isenção conjugal ilimitada apenas se o cônjuge for LTR;\n· <strong>ITCMD:</strong> <strong>estadual</strong> (CF, art. 155, I), alíquota de até 8% (teto da Resolução do Senado n.º 9/1992), incide sobre o <strong>quinhão de cada herdeiro</strong>, com faixas de isenção variáveis por estado, e <strong>progressividade obrigatória a partir de 2026</strong> pela EC 132/2023.\n\n<strong>Cenário A — brasileiro LTR no Reino Unido que falece:</strong> IHT de 40% sobre o <strong>patrimônio mundial</strong> acima de £325.000/£500.000, e ITCMD sobre bens situados no Brasil, até 8%.\n<strong>Alívio disponível:</strong> o Reino Unido concede <strong>alívio unilateral</strong> por imposto sucessório estrangeiro incidente sobre bens situados no exterior — <strong>IHTA 1984, s. 159</strong>. O ITCMD pago no Brasil sobre bens brasileiros é, em princípio, creditável contra o IHT britânico atribuível àqueles bens.\n<strong>No sentido inverso, não há alívio:</strong> a legislação brasileira de ITCMD <strong>não prevê, em regra, crédito por imposto sucessório estrangeiro</strong> — as leis estaduais são silentes.\n\n<strong>Cenário B — o risco mais subestimado da reforma.</strong> O brasileiro que deixou o Reino Unido mas está <strong>dentro do IHT tail (3 a 10 anos)</strong> permanece com o patrimônio <strong>mundial</strong> exposto ao IHT britânico de 40%, ainda que já seja residente fiscal exclusivo no Brasil e sem qualquer vínculo econômico remanescente com o Reino Unido.\n\n<strong>Cenário C — brasileiro não residente com imóvel em Londres:</strong> IHT de 40% sobre o valor do imóvel acima da NRB, <strong>inclusive quando detido por sociedade estrangeira</strong> (regra mantida desde abril de 2017). Empréstimos usados para adquirir ou manter o imóvel também podem ser trazidos ao escopo.\n\n<strong>Do lado brasileiro:</strong> o STF, no Tema 825 (RE 851.108), decidiu que os Estados não podem cobrar ITCMD sobre bens no exterior sem lei complementar federal. A EC 132/2023 estabeleceu regra transitória de competência (art. 16 do ADCT), mas subsistem controvérsias sobre autoaplicabilidade e sobre a necessidade de lei estadual nova, com observância de anterioridade. <em>Há divergência entre fontes sobre a existência e o conteúdo de uma Lei Complementar n.º 227/2026 regulamentadora — item de verificação prioritária.</em>\n\n<strong>Instrumentos de mitigação documentados</strong> (sem juízo sobre eficácia): seguro de vida britânico em trust, fora do espólio se corretamente estruturado; apólice <em>whole-of-life</em> dimensionada para a obrigação de IHT; doações em vida com sobrevida de 7 anos (PET), observado o novo escopo de LTR; <em>election</em> de cônjuge não-LTR para ser tratado como LTR, o que transforma a isenção limitada a £325.000 em ilimitada, ao custo de expor o patrimônio mundial do cônjuge; e planejamento do momento de perda da condição de LTR frente aos prazos da cauda.","warning":"O <strong>IHT tail de até 10 anos</strong> é a exposição mais subestimada da reforma de 2025. Um brasileiro que residiu 20 anos ou mais no Reino Unido e retorna ao Brasil permanece com o <strong>patrimônio mundial sujeito a IHT de 40%</strong> por uma década inteira após a saída — sem tratado sucessório, sem crédito no Brasil, e com o ITCMD estadual brasileiro incidindo cumulativamente sobre os bens situados no Brasil.\n\nO antigo planejamento por <em>excluded property trust</em> constituído antes de atingir o <em>deemed domicile</em> <strong>perdeu a característica de proteção permanente</strong>: o teste passou a ser feito na data de cada fato gerador.","sources":[{"t":"Saffery · Reformas de IHT para non-doms","u":"https://www.saffery.com/insights/articles/inheritance-tax-reforms-for-uk-non-doms/"},{"t":"ICAEW · Mudanças no IHT a partir de 6 de abril de 2025","u":"https://www.icaew.com/technical/tax/tax-faculty/taxline/articles/2025/changes-to-iht-from-6-april-2025"},{"t":"Boodle Hatfield · Long term residence e a sua importância para o IHT","u":"https://www.boodlehatfield.com/articles/long-term-residence-and-its-importance-for-uk-inheritance-tax-iht-purposes"},{"t":"Tax Journal · Excluded property trusts e 6 de abril de 2025","u":"https://www.taxjournal.com/articles/excluded-property-trusts-6-april-2025-"},{"t":"Travers Smith · Autumn Budget 2025 — Personal Taxes","u":"https://www.traverssmith.com/knowledge/knowledge-container/autumn-budget-2025-personal-taxes/"}]},{"name":"Alíquotas ordinárias, SRT e regras de saída","status":"changed","legalBasis":"Statutory Residence Test: <strong>Finance Act 2013, Schedule 45</strong>, em vigor desde 6/abr/2013; guia HMRC <strong>RDR3</strong>; manual RDRM11000–RDRM13000. Temporary non-residence: FA 2013, Sch. 45, Parte 4, e TCGA 1992, ss. 1M e 1N. Alíquotas: Autumn Budget de 26/nov/2025.","desc":"Quadro das alíquotas ordinárias e das regras que determinam quando alguém é — e deixa de ser — residente fiscal britânico.\n\n<strong>Todas as faixas referem-se a Inglaterra, País de Gales e Irlanda do Norte.</strong> A <strong>Escócia tem tabela própria</strong> de <em>income tax</em>, com 6 faixas e alíquotas até 48% — relevante para quem se instala em Edimburgo ou Glasgow. <em>As alíquotas escocesas de 2026/27 não puderam ser verificadas.</em>\n\nO ano fiscal britânico vai de <strong>6 de abril a 5 de abril</strong>.","kv":[{"l":"Personal allowance","v":"£12.570 (0%)"},{"l":"Basic rate","v":"20% até £50.270"},{"l":"Higher rate","v":"40% até £125.140"},{"l":"Additional rate","v":"45% acima de £125.140"},{"l":"Marginal efetiva £100k–£125,14k","v":"60% (taper)"},{"l":"Congelamento das faixas","v":"Até 2030/31"},{"l":"Dividendos 2026/27","v":"10,75% · 35,75% · 39,35%"},{"l":"Juros e aluguéis — desde 2027","v":"22% · 42% · 47%"},{"l":"CGT","v":"18% e 24%"},{"l":"CGT annual exempt amount","v":"£3.000"},{"l":"NIC — empregado","v":"8% e 2%"},{"l":"NIC — empregador","v":"15% acima de £5.000/ano"},{"l":"SDLT — surcharge não residente","v":"+2%"},{"l":"SDLT — habitação adicional","v":"+5%"}],"sections":[{"title":"Income tax e a alíquota marginal de 60%","body":"<strong>2025/26 e 2026/27</strong> (Inglaterra, País de Gales e Irlanda do Norte):\n· Personal allowance: £0 – £12.570 → <strong>0%</strong>\n· Basic rate: £12.571 – £50.270 → <strong>20%</strong>\n· Higher rate: £50.271 – £125.140 → <strong>40%</strong>\n· Additional rate: acima de £125.140 → <strong>45%</strong>\n\n<strong>Congelamento estendido:</strong> as faixas permanecem congeladas até <strong>2030/31</strong> — extensão anunciada no Autumn Budget de 26/nov/2025; anteriormente iam até 2027/28.\n\n<strong>Taper da personal allowance:</strong> redução de <strong>£1 para cada £2</strong> de <em>adjusted net income</em> acima de <strong>£100.000</strong>; a allowance é integralmente eliminada em <strong>£125.140</strong>. <strong>A alíquota marginal efetiva na faixa de £100.000 a £125.140 é de 60%</strong> — ponto frequentemente ignorado no planejamento de remuneração.\n\n· <em>Personal savings allowance:</em> £1.000 (basic rate), £500 (higher rate), £0 (additional rate)\n· <em>Starting rate for savings:</em> £5.000 a 0%, reduzido conforme outros rendimentos"},{"title":"Dividendos, juros e aluguéis — os aumentos escalonados","body":"<strong>Dividendos — alteração em 6 de abril de 2026:</strong>\n· <em>Dividend allowance</em>: £500 a 0% (mantida)\n· <em>Ordinary rate</em> (basic): 8,75% → <strong>10,75%</strong> (+2 p.p.)\n· <em>Upper rate</em> (higher): 33,75% → <strong>35,75%</strong> (+2 p.p.)\n· <em>Additional rate</em>: <strong>39,35%</strong> (inalterada)\n\n<strong>Juros (savings) e aluguéis (property income) — alteração em 6 de abril de 2027.</strong> O Autumn Budget 2025 criou alíquotas próprias, com acréscimo de <strong>2 pontos percentuais em todas as faixas</strong>:\n· Basic: 20% → <strong>22%</strong>\n· Higher: 40% → <strong>42%</strong>\n· Additional: 45% → <strong>47%</strong>"},{"title":"Capital Gains Tax","body":"· <em>Annual exempt amount</em> — pessoa física: <strong>£3.000</strong> (trusts: £1.500)\n· Ganhos dentro da faixa <em>basic rate</em> remanescente: <strong>18%</strong>\n· Ganhos acima da faixa <em>basic rate</em>: <strong>24%</strong>\n· Imóvel residencial (não <em>main residence</em>): 18% / 24%\n· <em>Carried interest</em>: 32% em 2025/26; regime substituído a partir de 6/abr/2026 <em>— a confirmar</em>\n· <em>Business Asset Disposal Relief</em> (BADR), teto de £1 milhão vitalício: <strong>14%</strong> desde 6/abr/2025; <strong>18%</strong> a partir de 6/abr/2026 <em>— a confirmar</em>\n\n<strong>Histórico:</strong> as alíquotas gerais eram 10%/20% até 29/out/2024, e foram elevadas a <strong>18%/24% com efeito imediato em 30 de outubro de 2024</strong> (Autumn Budget 2024), alinhando-as às já aplicáveis a imóveis residenciais.\n\nO ganho de capital <strong>«empilha» sobre a renda</strong>: a parcela que cabe na faixa <em>basic rate</em> não utilizada é tributada a 18%; o excedente, a 24%."},{"title":"National Insurance Contributions","body":"<strong>Classe 1 — empregado:</strong> <strong>8%</strong> entre o <em>Primary Threshold</em> (£12.570/ano; £242/semana) e o <em>Upper Earnings Limit</em> (£50.270/ano; £967/semana); <strong>2%</strong> acima do UEL.\n\n<strong>Classe 1 — empregador: 15%</strong> acima do <em>Secondary Threshold</em> de <strong>£5.000/ano</strong> (£417/mês).\n<em>Employment Allowance</em>: £10.500 em 2025/26.\n\n<strong>Classe 2 — autônomo:</strong> voluntária desde 2024/25, cerca de £3,50/semana.\n<strong>Classe 4 — autônomo:</strong> 6% entre £12.570 e £50.270; 2% acima.\n<strong>Classe 3 — voluntária:</strong> cerca de £17,75/semana.\n\n<strong>Observação relevante para o custo de patrocínio de vistos:</strong> o NIC patronal saltou de 13,8% com limiar de £9.100 para <strong>15% com limiar de £5.000</strong> em abril de 2025 — o que altera materialmente o custo de contratar sob patrocínio.\n\n<strong>Anunciado:</strong> introdução de NIC sobre contribuições previdenciárias via <em>salary sacrifice</em> acima de £2.000/ano, a partir de <strong>abril de 2029</strong>. <em>A confirmar.</em>"},{"title":"Stamp Duty Land Tax e o custo real para o comprador brasileiro","body":"Escócia aplica <strong>LBTT</strong> e País de Gales aplica <strong>LTT</strong>, com tabelas e sobretaxas distintas.\n\n<strong>Tabela residencial base (desde 1/abr/2025):</strong>\n· até £125.000 → 0%\n· £125.001 – £250.000 → 2%\n· £250.001 – £925.000 → 5%\n· £925.001 – £1.500.000 → 10%\n· acima de £1.500.000 → 12%\n\n<strong>Sobretaxas cumulativas:</strong>\n· <strong>Não residente</strong> (<em>non-resident surcharge</em>, FA 2021, Sch. 16): <strong>+2%</strong> em todas as faixas, desde 1/abr/2021;\n· <strong>Habitação adicional</strong> (HRAD): <strong>+5%</strong> em todas as faixas — elevada de 3% para 5% em <strong>31 de outubro de 2024</strong>;\n· Aquisição por pessoa jurídica acima de £500.000: <strong>17%</strong> flat, elevada de 15% em 31/out/2024. <em>A confirmar.</em>\n\n<strong>Efeito combinado para um comprador brasileiro não residente adquirindo segunda residência: +7 pontos percentuais</strong> sobre cada faixa, atingindo <strong>19% na faixa superior</strong>.\n\n<strong>Teste de não residência para SDLT:</strong> o comprador é não residente se esteve presente no Reino Unido <strong>menos de 183 dias nos 12 meses anteriores</strong> à data efetiva da transação. Há regra de <strong>reembolso</strong> se o comprador atingir 183 dias de presença nos 12 meses <em>posteriores</em> — pedido de restituição à HMRC dentro de 2 anos.\n\n<em>First-time buyers relief</em> (faixa nula até £300.000, alívio parcial até £500.000) <strong>não está disponível</strong> a quem já possui imóvel em qualquer lugar do mundo.\n\n<strong>Outros tributos sobre imóveis:</strong>\n· <strong>ATED</strong> — encargo anual sobre imóveis residenciais acima de £500.000 detidos por sociedades, com faixas progressivas indexadas. <em>Valores de 2026/27 a confirmar.</em>\n· <strong>NRCGT</strong> — não residentes são tributados sobre ganhos em imóveis britânicos (diretos desde abr/2015 para residenciais e abr/2019 para comerciais) e sobre participações em sociedades «<em>property-rich</em>» (75% ou mais do valor em imóveis britânicos) quando detêm 25% ou mais. <strong>Declaração e pagamento em 60 dias</strong> da conclusão.\n· <strong>High Value Council Tax Surcharge («mansion tax»)</strong> — Autumn Budget 2025, início em <strong>2028/29</strong>, sobre imóveis residenciais na Inglaterra avaliados em £2 milhões ou mais (preços de 2026): £2,0m–£2,5m → £2.500/ano; £2,5m–£3,5m → £3.500; £3,5m–£5,0m → £5.000; acima de £5,0m → £7.500. Reavaliação quinquenal pela Valuation Office Agency; responsabilidade do <strong>proprietário</strong>, não do inquilino."},{"title":"Statutory Residence Test — a ordem hierárquica","body":"O SRT é aplicado <strong>em ordem estrita</strong>: se um <em>automatic overseas test</em> é satisfeito, a análise para (não residente). Só então se examinam os <em>automatic UK tests</em>. Só se nenhum for conclusivo aplica-se o <em>sufficient ties test</em>.\n\n<strong>Contagem de dias — regra da meia-noite:</strong> conta-se o dia em que o indivíduo está no Reino Unido <strong>à meia-noite</strong>. Exceções: <em>transit days</em> (passagem em conexão sem atividades substanciais); <em>exceptional circumstances</em> — até <strong>60 dias/ano</strong> desconsiderados por circunstâncias fora do controle (doença grave, desastre natural, restrições governamentais); e a <em>deeming rule</em> — dias sem pernoite podem contar se o indivíduo tiver 3 ou mais vínculos, tiver sido residente em algum dos 3 anos anteriores e acumular mais de 30 dias de presença sem pernoite.\n\n<strong>Automatic overseas tests</strong> — se qualquer um for satisfeito, <strong>não residente</strong>:\n· <strong>AOT 1</strong> — foi residente em um ou mais dos 3 anos anteriores <strong>e</strong> passou <strong>menos de 16 dias</strong> no Reino Unido no ano\n· <strong>AOT 2</strong> — <strong>não</strong> foi residente em nenhum dos 3 anos anteriores <strong>e</strong> passou <strong>menos de 46 dias</strong>\n· <strong>AOT 3</strong> — trabalha <strong>em tempo integral no exterior</strong> (média de ≥35 horas/semana, sem <em>significant break</em> de 31 dias ou mais) durante todo o ano <strong>e</strong> passou <strong>menos de 91 dias</strong> no Reino Unido <strong>e</strong> teve <strong>menos de 31 dias de trabalho</strong> britânico (dias com mais de 3 horas de trabalho)\n· <strong>AOT 4 e 5</strong> — hipóteses de falecimento\n\n<strong>Automatic UK tests</strong> — se qualquer um for satisfeito e nenhum AOT o for, <strong>residente</strong>:\n· <strong>AUT 1</strong> — passou <strong>183 dias ou mais</strong> no Reino Unido no ano fiscal\n· <strong>AUT 2</strong> — teve uma <em>home</em> no Reino Unido por <strong>≥91 dias consecutivos</strong> (dos quais ≥30 no ano fiscal), esteve presente nela em <strong>≥30 dias</strong> no ano, <strong>e</strong> houve uma janela de 91 dias consecutivos em que não teve residência no exterior (ou, tendo, esteve presente nela menos de 30 dias no ano)\n· <strong>AUT 3</strong> — trabalhou <strong>em tempo integral no Reino Unido</strong> por qualquer período de <strong>365 dias</strong> (média ≥35h/semana), com <strong>mais de 75% dos dias de trabalho</strong> no Reino Unido, e ao menos um dia de trabalho britânico tanto no período de 365 dias quanto no ano fiscal\n· <strong>AUT 4</strong> — hipótese de falecimento"},{"title":"Sufficient ties test — os 5 vínculos e as tabelas","body":"<strong>Os cinco vínculos:</strong>\n1. <strong>Family tie</strong> — cônjuge, parceiro civil, parceiro em coabitação, ou <strong>filho menor de 18 anos</strong> residente no Reino Unido (com exceção para filho em escola de tempo integral, se o indivíduo passa menos de 61 dias com ele fora das férias)\n2. <strong>Accommodation tie</strong> — dispõe de acomodação no Reino Unido, disponível por <strong>≥91 dias consecutivos</strong>, e passa pelo menos <strong>1 noite</strong> nela no ano (<strong>16 noites</strong> se for casa de parente)\n3. <strong>Work tie</strong> — <strong>40 dias ou mais</strong> no ano em que trabalha <strong>mais de 3 horas</strong> no Reino Unido\n4. <strong>90-day tie</strong> — passou <strong>mais de 90 dias</strong> no Reino Unido em <strong>qualquer um</strong> dos 2 anos fiscais anteriores\n5. <strong>Country tie</strong> — esteve presente no Reino Unido em <strong>mais dias</strong> do que em qualquer outro país isolado no ano — <strong>aplicável somente a <em>leavers</em></strong>\n\n<strong>«ARRIVERS»</strong> — não foi residente em nenhum dos 3 anos anteriores (máximo de 4 vínculos, pois o <em>country tie</em> não se aplica):\n· menos de 46 dias → não residente (AOT 2)\n· 46 – 90 dias → residente com <strong>4 vínculos</strong> (todos)\n· 91 – 120 dias → <strong>3 vínculos</strong>\n· 121 – 182 dias → <strong>2 vínculos</strong>\n· 183 dias ou mais → residente automaticamente\n\n<strong>«LEAVERS»</strong> — foi residente em pelo menos um dos 3 anos anteriores (os 5 vínculos aplicáveis):\n· menos de 16 dias → não residente (AOT 1)\n· 16 – 45 dias → residente com <strong>4 vínculos</strong>\n· 46 – 90 dias → <strong>3 vínculos</strong>\n· 91 – 120 dias → <strong>2 vínculos</strong>\n· 121 – 182 dias → <strong>1 vínculo</strong>\n· 183 dias ou mais → residente automaticamente\n\n<strong>O ponto mais subestimado no planejamento de saída:</strong> um brasileiro que sai do Reino Unido e mantém casa disponível, cônjuge no país e mais de 90 dias de presença nos dois anos anteriores acumula <strong>3 vínculos</strong> — e, nesse cenário, <strong>46 dias de presença já o tornam residente</strong>. A assimetria entre <em>arriver</em> (mínimo de 46 dias) e <em>leaver</em> (mínimo de 16 dias) é decisiva.\n\n<strong>Registos a manter</strong> (o ónus da prova é do contribuinte): cartões de embarque, extratos com data e local, registos de entrada e saída, agenda de trabalho com horas por dia e por país, contratos de locação e escrituras, comprovantes de dias com filhos, matrícula escolar."},{"title":"Split year treatment — os 8 casos","body":"O ano fiscal britânico é <strong>indivisível por regra</strong>; o <em>split year</em> é a exceção. Aplica-se <strong>apenas ao próprio contribuinte</strong> (não ao cônjuge automaticamente) e <strong>não afeta</strong> a aplicação do SRT em si — a pessoa continua sendo residente no ano, mas o ano é dividido em parte britânica e parte estrangeira.\n\n<strong>Casos de SAÍDA do Reino Unido:</strong>\n· <strong>Caso 1</strong> — início de trabalho em tempo integral no exterior\n· <strong>Caso 2</strong> — cônjuge ou parceiro de quem inicia trabalho em tempo integral no exterior\n· <strong>Caso 3</strong> — deixa de ter residência (<em>home</em>) no Reino Unido\n\n<strong>Casos de CHEGADA ao Reino Unido:</strong>\n· <strong>Caso 4</strong> — passa a ter residência apenas no Reino Unido\n· <strong>Caso 5</strong> — início de trabalho em tempo integral no Reino Unido\n· <strong>Caso 6</strong> — cessação de trabalho em tempo integral no exterior (retorno)\n· <strong>Caso 7</strong> — cônjuge ou parceiro de quem cessa trabalho em tempo integral no exterior\n· <strong>Caso 8</strong> — passa a ter uma residência no Reino Unido\n\nHá regras de prioridade se mais de um caso se aplica; o caso aplicável determina a <strong>data de divisão</strong> (<em>split date</em>). Guia HMRC: RDR3, seções 5 e 6; manual RDRM12000+.\n\n<strong>Interação com o FIG:</strong> a parte estrangeira de um <em>split year</em> de chegada <strong>conta como ano fiscal completo de residência</strong> para efeito da contagem dos 4 anos do FIG."},{"title":"Temporary non-residence — a regra dos 5 anos","body":"<strong>Base legal:</strong> FA 2013, Sch. 45, Parte 4 (parágrafos 109–115); TCGA 1992, ss. 1M e 1N para ganhos de capital.\n\n<strong>Definição:</strong> o indivíduo é <em>temporary non-resident</em> se (i) foi residente britânico em <strong>pelo menos 4 dos 7 anos fiscais</strong> anteriores ao ano de partida, e (ii) o período de não residência dura <strong>5 anos ou menos</strong>.\n\n<strong>Consequência:</strong> ao retornar, são tributados <strong>no ano do retorno</strong> os seguintes itens surgidos durante a ausência:\n· <strong>ganhos de capital</strong> sobre ativos detidos antes da partida (TCGA 1992, ss. 1M/1N)\n· <strong>distribuições de <em>close companies</em></strong> — dividendos de empresas fechadas controladas\n· <strong>remessas de FIG pré-partida</strong> por ex-usuários da remittance basis\n· <em>chargeable event gains</em> de apólices de seguro de vida\n· <em>offshore income gains</em> (fundos não-<em>reporting</em>)\n· <strong>retiradas flexíveis e <em>lump sums</em> de previdência</strong>\n· distribuições de trusts e <em>relevant foreign income</em>\n\n<strong>Contagem dos 5 anos:</strong> partes estrangeiras de <em>split years</em> na partida e no retorno <strong>contam</strong> para completar o período. O cálculo é feito em períodos de residência, não em anos fiscais integrais."},{"title":"A sequência de relógios ao sair do Reino Unido","body":"Quatro contagens distintas correm em paralelo após a saída, e cada uma tem um prazo próprio:\n\n· <strong>Escapar da recaptura de CGT e demais itens</strong> (<em>temporary non-residence</em>) → mais de <strong>5 anos</strong> de não residência\n· <strong>Encerrar a exposição mundial ao IHT</strong> (<em>IHT tail</em>) → <strong>3 a 10 anos fiscais</strong>, conforme os anos de residência acumulados\n· <strong>Reacessar o regime FIG</strong> de 4 anos → <strong>10 anos fiscais consecutivos</strong>\n· <strong>Resetar a contagem 10/20 de long-term residence para IHT</strong> → <strong>10 anos fiscais consecutivos</strong>\n\n<strong>Implicação prática:</strong> um cliente que residiu 4 ou mais dos 7 anos anteriores e planeja realizar um ganho de capital relevante precisa manter a não residência por <strong>mais de 5 anos</strong> para que o ganho não seja recapturado — e isso soma-se ao IHT tail e à exigência de 10 anos para reacessar o FIG."}],"brazilNote":"<strong>Sem tratado em vigor</strong> (ver o dossiê imigratório para o estado da Convenção de 2022), a eliminação da dupla tributação depende exclusivamente de mecanismos unilaterais:\n\n<strong>Lado brasileiro — reciprocidade.</strong> Lei n.º 8.383/1991, art. 26; IN SRF n.º 208/2002, art. 16; RIR/2018. A Receita Federal <strong>reconhece a existência de reciprocidade de tratamento com o Reino Unido</strong>, ao lado de Estados Unidos e Alemanha. A prova pode ser feita por cópia da lei estrangeira ou por declaração da autoridade fiscal estrangeira. <strong>Limite:</strong> o crédito é limitado ao imposto brasileiro devido sobre o mesmo rendimento, não gera restituição do excedente, e é apurado <strong>rendimento a rendimento</strong>. <em>Verificar o ato normativo específico que reconhece a reciprocidade.</em>\n\n<strong>Lado britânico — alívio unilateral.</strong> TIOPA 2010, Parte 2, ss. 8, 9 e 18 — crédito por imposto estrangeiro pago sobre rendimento de fonte estrangeira; alternativa de <strong>dedução</strong> do imposto estrangeiro da base tributável, quando mais eficiente. Manual HMRC: INTM160000+.\n\n<strong>Retenção brasileira na fonte sobre remessas ao Reino Unido, sem tratado:</strong>\n· <strong>Dividendos</strong> — 0% até 31/dez/2025; a partir de <strong>1/jan/2026, retenção de 10%</strong> <em>(Lei n.º 15.270/2025 — confirmar alíquota, base e regras de transição, incluindo a exceção para lucros apurados até 2025 com distribuição deliberada até 31/12/2025)</em>\n· <strong>Juros</strong> — 15% (25% se o beneficiário estiver em jurisdição de tributação favorecida)\n· <strong>Juros sobre capital próprio (JCP)</strong> — 15%\n· <strong>Royalties</strong> — 15%, mais CIDE-Royalties de 10% a cargo da fonte\n· <strong>Serviços técnicos e assistência técnica</strong> — 15%, mais CIDE de 10%, PIS/COFINS-Importação e ISS\n· <strong>Aluguéis de imóvel no Brasil</strong> — 15%\n· <strong>Ganho de capital de não residente</strong> sobre bem no Brasil — 15% até R$ 5 milhões; 17,5% de R$ 5 a 10 milhões; 20% de R$ 10 a 30 milhões; 22,5% acima de R$ 30 milhões (Lei n.º 13.259/2016)\n· <strong>Aposentadoria e pensão do INSS pagas a não residente</strong> — 25%\n· <strong>Trabalho e serviços em geral</strong> — 25%\n\n<strong>Lista de jurisdições de tributação favorecida:</strong> o <strong>Reino Unido não consta</strong> do art. 1.º da IN RFB 1.037/2010. Constam, porém, várias <strong>dependências da Coroa e territórios ultramarinos britânicos</strong>: Ilha de Man, Jersey, Guernsey, Ilhas Virgens Britânicas, Ilhas Cayman, Gibraltar, Bermudas, Anguilla, Montserrat, Turks e Caicos, Santa Helena, entre outros. Estruturação via essas jurisdições atrai retenção de <strong>25%</strong> e regras brasileiras mais rígidas de preços de transferência e subcapitalização.\n\n<em>Questão em aberto de alto impacto:</em> não foi localizado ato da Receita Federal classificando o <strong>regime FIG britânico</strong> como <em>regime fiscal privilegiado</em> na forma do art. 2.º da IN RFB 1.037/2010 — dispositivo que alcança regimes que não tributam renda ou a tributam a alíquota máxima inferior a 17%, ou que concedem vantagem a não residentes sem exigência de atividade substantiva. Eventual classificação atrairia preços de transferência, subcapitalização e limitação de dedutibilidade. <strong>Ponto a monitorar.</strong>\n\n<strong>Se o cliente permanece residente fiscal brasileiro</strong> (por exemplo, sob visto britânico temporário sem cruzar os limiares do SRT): tributação em bases universais, com carnê-leão mensal até 27,5% sobre rendimentos do exterior; ganho de capital em moeda estrangeira a 15%–22,5%; e, desde 1/jan/2024, a <strong>Lei n.º 14.754/2023</strong> (regulamentada pela IN RFB n.º 2.180/2024) aplica alíquota <strong>única de 15%</strong> sobre rendimentos de aplicações financeiras no exterior e sobre <strong>lucros de entidades controladas no exterior</strong>, estas apuradas em 31 de dezembro de cada ano, <strong>independentemente de distribuição</strong>. Trusts têm regras específicas — o instituidor é tributado enquanto mantiver controle ou poder de revogação. Acresce a <strong>DCBE</strong> ao Banco Central quando os ativos no exterior atingem os limiares regulamentares.","sources":[{"t":"GOV.UK · RDR3 — Statutory Residence Test","u":"https://gov.uk/government/publications/rdr3-statutory-residence-test-srt/guidance-note-for-statutory-residence-test-srt-rdr3"},{"t":"House of Commons Library · Direct taxes — rates and allowances 2026/27","u":"https://commonslibrary.parliament.uk/research-briefings/cbp-10618/"},{"t":"House of Commons Library · Budget 2025 — income tax sobre imóveis, poupança e dividendos","u":"https://commonslibrary.parliament.uk/research-briefings/cbp-10450/"},{"t":"House of Commons Library · High Value Council Tax Surcharge","u":"https://commonslibrary.parliament.uk/research-briefings/cbp-10934/"},{"t":"Burges Salmon · As regras britânicas de temporary non-residence","u":"https://www.burges-salmon.com/our-thinking/the-uks-temporary-non-residence-rules/"},{"t":"Deloitte · UK Tax Rates 2026/27 (PDF)","u":"https://taxscape.deloitte.com/taxtables/deloitte-uk-tax-rates-2026-27.pdf"},{"t":"Receita Federal · IN SRF n.º 208/2002","u":"https://www.normaslegais.com.br/legislacao/instrucao-normativa-srf-208-2002.htm"}]}],"visa":[{"name":"Fim do Tier 1 (Investor) — não há golden visa no Reino Unido","status":"ext","legalBasis":"Encerrado em <strong>17 de fevereiro de 2022, às 16h00</strong> (horário de Londres), com efeito imediato, pelo <em>Statement of Changes in the Immigration Rules</em>, <strong>HC 1043</strong>. Revisão de operação publicada em 12/jan/2023 (Written Statement HCWS492).","desc":"<strong>Não existe, no Reino Unido, qualquer rota de residência por investimento passivo.</strong>\n\nO Tier 1 (Investor) exigia investimento de <strong>£2.000.000</strong> (com vias aceleradas de 3 e 2 anos a £5 milhões e £10 milhões) e foi encerrado <strong>com efeito imediato</strong> em 17 de fevereiro de 2022, para todas as novas solicitações, independentemente da nacionalidade.\n\n<strong>Justificativa oficial do Home Office:</strong> a categoria «não entregou resultados para o povo britânico» e criou «oportunidades para elites corruptas acessarem o Reino Unido».\n\n<strong>Situação residual:</strong> titulares existentes podem <strong>estender</strong> e requerer <strong>settlement</strong>; as solicitações de ILR permanecem abertas até <strong>17 de fevereiro de 2028</strong>. <em>Prazo final a confirmar.</em>\n\n<strong>Conclusão factual para o consultor:</strong> ao aconselhar cliente brasileiro que busca residência no Reino Unido, <strong>não há caminho por aquisição de imóvel, títulos públicos ou aporte em fundo</strong>. As rotas disponíveis exigem empreendimento ativo com endosso (Innovator Founder), mérito individual reconhecido (Global Talent), patrocínio empregatício (Skilled Worker), expansão de empresa estrangeira (Expansion Worker) ou diploma de universidade listada (High Potential Individual).","kv":[{"l":"Encerramento","v":"17/fev/2022, 16h00"},{"l":"Instrumento","v":"HC 1043"},{"l":"Investimento anterior","v":"£2.000.000"},{"l":"Vias aceleradas anteriores","v":"£5M (3 anos) · £10M (2 anos)"},{"l":"Criação","v":"2008 (antecessor desde 1994)"},{"l":"Titulares existentes","v":"Podem estender e obter ILR"},{"l":"Prazo final para ILR","v":"17/fev/2028 (a confirmar)"},{"l":"Substituto por investimento passivo","v":"Não existe"}],"brazilNote":"Para o brasileiro, a consequência é direta: <strong>não há como comprar residência no Reino Unido</strong>. Qualquer material que ofereça «golden visa britânico» está desatualizado em mais de quatro anos.\n\nAs vias reais exigem: (i) um negócio inovador com endosso de organismo aprovado; (ii) reconhecimento internacional ou nacional na área de atuação; (iii) oferta de emprego de empregador com <em>sponsor licence</em>; (iv) ser executivo sénior de empresa estrangeira que abre operação britânica; ou (v) diploma de universidade constante da <em>Global Universities List</em> — na qual <strong>universidades brasileiras não constam</strong>.\n\nTitulares brasileiros do antigo Tier 1 (Investor) devem observar o prazo de fevereiro de 2028 para o pedido de ILR.","sources":[{"t":"Parlamento do Reino Unido · The Tier 1 (Investor) route — review of operation (HCWS492)","u":"https://questions-statements.parliament.uk/written-statements/detail/2023-01-12/hcws492"},{"t":"Farrer & Co · Tier 1 (Investor) visa closes on 17 February 2022","u":"https://www.farrer.co.uk/news-and-insights/tier-1-investor-visa-closes-on-17-february-2022/"}]},{"name":"Innovator Founder visa","status":"ok","legalBasis":"Immigration Rules, <strong>Appendix Innovator Founder</strong>. Criada em <strong>13 de abril de 2023</strong>, substituindo as rotas <em>Innovator</em> e <em>Start-up</em>. A reforma de abril de 2023 <strong>eliminou o requisito de investimento mínimo de £50.000</strong> e autorizou emprego secundário (nível de qualificação RQF 3 ou superior).","desc":"Rota para fundador de negócio <strong>inovador, viável e escalável</strong>, com endosso obrigatório de organismo aprovado.\n\n<strong>Não há valor mínimo de investimento</strong> desde a reforma de 13/abr/2023 — mas <strong>não é rota para investidor passivo</strong>: exige-se papel-chave e contínuo no dia a dia do negócio.\n\n<strong>Permissão inicial de 3 anos</strong>, extensível por mais 3, indefinidamente, com novo endosso. <strong>ILR (settlement) após 3 anos</strong>, mediante novo endosso e comprovação de que o negócio atendeu pelo menos <strong>2 dos 7 critérios</strong> de settlement.\n\n<strong>Contact points obrigatórios</strong> aos 12 e aos 24 meses, com o organismo endossante. O descumprimento permite ao endossante <strong>retirar o endosso</strong>, o que leva ao cancelamento da permissão pelo Home Office.","kv":[{"l":"Investimento mínimo","v":"Nenhum (desde abr/2023)"},{"l":"Endosso","v":"Obrigatório, de organismo aprovado"},{"l":"Validade do endosso","v":"3 meses"},{"l":"Permissão inicial","v":"3 anos"},{"l":"ILR","v":"Após 3 anos"},{"l":"Inglês","v":"B2 (CEFR)"},{"l":"Manutenção financeira","v":"£1.270 por 28 dias"},{"l":"Contact points","v":"12 e 24 meses"},{"l":"Emprego secundário","v":"Permitido (RQF 3+)"},{"l":"Dependentes — trabalho","v":"Irrestrito"}],"requirements":["<strong>Carta de endosso</strong> emitida por <em>endorsing body</em> aprovado, com no máximo <strong>3 meses</strong> de emissão.","Plano de negócio que satisfaça <strong>cumulativamente</strong> os três critérios avaliados pelo endossante: <strong>inovação</strong> (ideia genuína e original, que atenda necessidade de mercado ou crie vantagem competitiva); <strong>viabilidade</strong> (plano realista e alcançável com os recursos do requerente — competências, conhecimento, experiência e domínio do mercado); e <strong>escalabilidade</strong> (evidência de potencial de criação de empregos e de crescimento em mercados nacionais e internacionais).","<strong>Papel ativo:</strong> ser fundador ou cofundador com papel-chave e contínuo no dia a dia do negócio — <strong>não é rota para investidor passivo</strong>.","<strong>Sem valor mínimo de investimento</strong>, desde 13/abr/2023.","<strong>Inglês nível B2 (CEFR)</strong> — Appendix English Language.","<strong>Manutenção financeira: £1.270</strong> mantidos por <strong>28 dias consecutivos</strong>, com o dia final no máximo 31 dias antes da solicitação. Dispensado se já estiver no Reino Unido há 12 meses ou mais.","Idade de <strong>18 anos ou mais</strong>.","Ausência de <em>adverse immigration history</em>."],"process":[{"step":"Elaboração do plano de negócio","detail":"Plano de negócio e <em>pitch deck</em>, dimensionados para os três critérios do endossante.","timing":"4–12 semanas"},{"step":"Pedido de endosso","detail":"Submissão ao <em>endorsing body</em>, com taxa. <strong>Três organismos endossam novas solicitações:</strong> UK Endorsing Services (UKES), Innovator International e Envestors Limited.\n<em>Nota: a lista sofreu alterações recorrentes, inclusive na primavera de 2026. Confirmar a lista vigente em gov.uk antes de contratar.</em>","timing":"Análise documental"},{"step":"Entrevista com o painel","detail":"Entrevista presencial ou por vídeo com o painel do organismo endossante.","timing":"—"},{"step":"Emissão da endorsement letter","detail":"Carta de endosso com validade de <strong>3 meses</strong> para a solicitação do visto.","timing":"2–8 semanas (varia por endossante)"},{"step":"Solicitação de visto","detail":"Pedido online ao UKVI, com pagamento da taxa e do Immigration Health Surcharge integral e antecipado.","timing":"Até 3 meses após o endosso"},{"step":"Biometria","detail":"Recolha biométrica em <em>Visa Application Centre</em> — VFS Global, com postos em São Paulo, Rio de Janeiro, Brasília e outras cidades brasileiras.","timing":"Agendamento"},{"step":"Decisão","detail":"<strong>3 semanas</strong> para pedidos de fora do Reino Unido; <strong>8 semanas</strong> para pedidos de dentro. Serviços opcionais: <em>Priority</em> (5 dias úteis) e <em>Super Priority</em> (próximo dia útil).","timing":"3–8 semanas"},{"step":"Contact point aos 12 meses","detail":"Reunião obrigatória com o organismo endossante. O descumprimento permite a <strong>retirada do endosso</strong> e o cancelamento da permissão.","timing":"12 meses"},{"step":"Contact point aos 24 meses","detail":"Segunda reunião obrigatória.","timing":"24 meses"},{"step":"ILR aos 3 anos","detail":"Solicitação de <em>Indefinite Leave to Remain</em>, com novo endosso e comprovação de <strong>2 dos 7 critérios</strong> de settlement.","timing":"6 meses de decisão"}],"costs":[{"item":"Endosso (ao endorsing body)","value":"£1.000 + IVA","note":"Varia por endossante; a confirmar"},{"item":"Cada contact point meeting (2 obrigatórios)","value":"£500 + IVA cada","note":"A confirmar"},{"item":"Visto — de fora do Reino Unido","value":"£1.357","note":"Valor anterior: £1.274; taxas reajustadas em 8/abr/2026 — a confirmar"},{"item":"Visto — de dentro do Reino Unido (switch)","value":"£1.693","note":"Valor anterior: £1.590; a confirmar"},{"item":"Immigration Health Surcharge — adulto","value":"£1.035 por ano de permissão","note":"Pago integralmente e antecipadamente; reembolso proporcional em caso de recusa"},{"item":"Immigration Health Surcharge — menor de 18","value":"£776 por ano"},{"item":"Indefinite Leave to Remain","value":"£3.226 por requerente","note":"Era £3.029; confirmado para 8/abr/2026"},{"item":"Naturalisation (adulto)","value":"£1.709","note":"Era £1.605; confirmado para 8/abr/2026"}],"sections":[{"title":"Os 7 critérios de settlement — bastam 2","body":"Para o ILR aos 3 anos, o negócio deve ter atendido <strong>pelo menos 2 dos 7 critérios</strong>:\n\n1. Investimento de <strong>£50.000</strong> no negócio\n2. <strong>Duplicação</strong> do número de clientes nos últimos 3 anos, acima da média do setor\n3. Envolvimento significativo em <strong>P&amp;D</strong> e registo de <strong>propriedade intelectual</strong> no Reino Unido\n4. <strong>Faturamento anual bruto de £1.000.000</strong>\n5. Faturamento anual de <strong>£500.000</strong>, dos quais <strong>£100.000 de exportação</strong>\n6. Criação de <strong>10 empregos em tempo integral</strong> para residentes\n7. Criação de <strong>5 empregos em tempo integral</strong> com salário médio de <strong>£25.000/ano</strong>\n\n<em>Nota de verificação: os valores dos critérios 4, 5 e 7 podem ter sido atualizados desde 2023.</em>"},{"title":"Regras de família","body":"<strong>Cônjuge ou parceiro</strong> (incluindo <em>unmarried partner</em> com 2 anos de relação) e <strong>filhos menores de 18 anos</strong> podem acompanhar.\n\n<strong>Dependentes têm direito irrestrito de trabalhar</strong> — inclusive por conta própria — e de estudar.\n\n<strong>Manutenção financeira adicional:</strong> £285 (parceiro) + £315 (1.º filho) + £200 (cada filho adicional), mantidos por 28 dias. <strong>Dispensado</strong> após 12 meses de residência do requerente principal.\n\nDependentes seguem o mesmo caminho ao ILR, com requisito próprio de <strong>Life in the UK Test</strong> e <strong>inglês B1</strong> para maiores de 18 anos."},{"title":"Custo consolidado — família de 4 pessoas, ciclo até a cidadania","body":"Exemplo com taxas oficiais, para família brasileira (2 adultos e 2 filhos), Innovator Founder de 3 anos, solicitando do exterior:\n\n· Endosso (principal): £1.000\n· Visto — principal: £1.357\n· Visto — cônjuge: £1.357\n· Visto — 2 filhos: £2.714\n· IHS — 2 adultos × 3 anos: £6.210\n· IHS — 2 menores × 3 anos: £4.656\n· 2 <em>contact points</em>: £1.000\n<strong>Subtotal antes do ILR: ≈£18.294</strong>\n\n· ILR (4 pessoas, aos 3 anos): £12.904\n· Naturalização (4 pessoas, no ano seguinte): £5.127 (2 × £1.709 de adulto + 2 × £1.000 de registo de criança)\n<strong>Total do ciclo até a cidadania, apenas taxas oficiais: ≈£36.325</strong>\n\n<em>Não inclui honorários advocatícios, tradução, apostilamento, testes de inglês, Life in the UK, passaportes, nem os custos de constituição e operação do negócio.</em>"}],"brazilNote":"Brasileiros são <em>non-visa nationals</em> para visitas de até 6 meses, mas desde 2025 é obrigatória a <strong>ETA — Electronic Travel Authorisation</strong> antes do embarque: taxa de <strong>£16</strong> (elevada de £10 em 9/abr/2025), validade de <strong>2 anos</strong> ou até o vencimento do passaporte, múltiplas entradas, emissão em geral até 3 dias úteis. <em>Confirmar a data exata de início da obrigatoriedade para brasileiros e o valor vigente.</em>\n\nDocumentos brasileiros exigem <strong>apostila da Haia</strong> e tradução juramentada. A biometria é feita nos postos da VFS Global no Brasil.\n\n<strong>Não há acordo de previdência social entre Brasil e Reino Unido</strong> — ver a nota do dossiê de cidadania. Isso significa ausência de totalização e risco de dupla contribuição.\n\n<strong>Planejamento fiscal integrado:</strong> quem entra pelo Innovator Founder e satisfaz o teste de 10 anos de não residência prévia pode combinar a rota com o <strong>regime FIG</strong>, obtendo 4 anos de isenção sobre rendimentos e ganhos brasileiros, com remessa livre ao Reino Unido. O ILR chega ao 3.º ano — antes, portanto, do fim da janela do FIG.","sources":[{"t":"DavidsonMorris · Innovator Founder Visa — guia 2026","u":"https://www.davidsonmorris.com/innovator-founder-visa/"},{"t":"Richmond Chambers · UK Innovator Founder Visa — guia 2026","u":"https://immigrationbarrister.co.uk/business-immigration/business-visas/uk-innovator-founder-visa/"},{"t":"Garth Coates · Innovator Founder — mudanças na lista de endorsing bodies (primavera de 2026)","u":"https://garthcoates.com/innovator-founder-visa/innovator-founder-visa-update-changes-explained/"},{"t":"Thorntons Solicitors · Aumentos das taxas de imigração a partir de 8/abr/2026","u":"https://www.thorntons-law.co.uk/knowledge/home-office-immigration-fee-increases-from-8-april-2026-key-changes-for-applicants-and-sponsors"}]},{"name":"Global Talent visa","status":"ok","legalBasis":"Immigration Rules, <strong>Appendix Global Talent</strong> e <strong>Appendix Global Talent: Prestigious Prizes</strong>. Substituiu o Tier 1 (Exceptional Talent) em <strong>20 de fevereiro de 2020</strong>.","desc":"Rota em <strong>duas etapas</strong>: (1) <strong>endosso</strong> por organismo aprovado — dispensada para vencedores de prémio da lista <em>Prestigious Prizes</em>; e (2) <strong>solicitação de visto</strong> ao UKVI.\n\n<strong>Características operacionais que a distinguem:</strong>\n· <strong>sem patrocinador</strong> e <strong>sem oferta de emprego</strong>\n· <strong>sem requisito salarial</strong> e <strong>sem requisito de qualificação</strong>\n· <strong>sem requisito de inglês na etapa do visto</strong> — exigido apenas no ILR\n· <strong>sem exigência de manutenção financeira</strong>\n· <strong>liberdade total de emprego</strong>: pode ser empregado, autónomo, empresário, ou alternar entre eles\n· duração escolhida pelo requerente: <strong>1 a 5 anos</strong>, pagando o IHS proporcional\n\n<strong>Duas categorias de endosso:</strong>\n· <strong>Exceptional Talent</strong> — <strong>líder reconhecido</strong> em seu campo; evidência de reconhecimento internacional consolidado, prémios, cargos de liderança, cobertura de mídia de grande alcance. <strong>ILR em 3 anos, em todos os campos.</strong>\n· <strong>Exceptional Promise</strong> — <strong>líder potencial</strong>, em ascensão; trajetória inicial com reconhecimento nacional, cartas de recomendação, contribuições recentes relevantes. Geralmente aplicável a quem está há menos de 5 anos no campo. <strong>ILR em 3 anos</strong> em ciências, engenharia, humanidades e medicina; <strong>5 anos</strong> em artes, cultura e tecnologia digital.","kv":[{"l":"Patrocinador","v":"Nenhum"},{"l":"Oferta de emprego","v":"Não exigida"},{"l":"Requisito salarial","v":"Nenhum"},{"l":"Inglês na etapa do visto","v":"Não exigido"},{"l":"Manutenção financeira","v":"Não exigida"},{"l":"Duração","v":"1 a 5 anos, à escolha"},{"l":"ILR — Exceptional Talent","v":"3 anos"},{"l":"ILR — Exceptional Promise","v":"3 ou 5 anos, por campo"},{"l":"Emprego","v":"Liberdade total"},{"l":"Taxa de endosso","v":"£561 (a confirmar)"}],"requirements":["Obter <strong>endosso</strong> de organismo aprovado — ou ser vencedor de prémio da lista <em>Prestigious Prizes</em>, caso em que a etapa é dispensada.","Satisfazer o <strong>critério obrigatório</strong> (<em>mandatory criterion</em>): comprovação de reconhecimento como <strong>líder</strong> (Exceptional Talent) ou como <strong>líder potencial</strong> (Exceptional Promise).","Satisfazer <strong>2 de 4 critérios opcionais</strong> — no modelo da via de tecnologia digital: (i) inovação como fundador ou empregado sénior de produto digital; (ii) contribuição reconhecida além do trabalho ordinário — palestras, mentoria, projetos <em>open source</em>; (iii) contribuições académicas ou técnicas significativas; (iv) histórico comercial excecional — receita, captação, crescimento.","Apresentar <strong>cartas de recomendação</strong> de organização ou pessoa reconhecida no setor no Reino Unido (2 ou 3, conforme a via), <strong>declaração pessoal</strong> e <strong>CV</strong>.","Inglês exigido apenas no <strong>ILR</strong>, não na etapa do visto."],"process":[{"step":"Montagem do dossiê de evidências","detail":"Cartas de recomendação independentes, métricas de citação, evidências dos critérios, declaração pessoal e CV.","timing":"4–12 semanas"},{"step":"Solicitação de endosso (Etapa 1)","detail":"Desde <strong>agosto de 2025</strong>, as solicitações de endosso passaram a usar o <strong>formulário padrão do Home Office no GOV.UK</strong>, em vez de plataforma própria do endossante.","timing":"Submissão online"},{"step":"Avaliação e decisão de endosso","detail":"Aproximadamente <strong>8 semanas</strong> na via da Tech Nation; a UKRI e as academias têm prazos próprios.\n<strong>Recurso:</strong> não há <em>appeal</em> formal contra recusa de endosso, mas há <strong>pedido de revisão (<em>endorsement review</em>)</strong> dentro de prazo determinado, quando se alega erro na aplicação dos critérios.","timing":"≈8 semanas"},{"step":"Solicitação de visto (Etapa 2)","detail":"Pedido ao UKVI, válido por até <strong>3 meses</strong> após o endosso.","timing":"—"},{"step":"Biometria","detail":"Recolha biométrica nos postos da VFS Global no Brasil.","timing":"Agendamento"},{"step":"Decisão","detail":"<strong>3 semanas</strong> para pedidos de fora do Reino Unido; <strong>8 semanas</strong> para pedidos de dentro.","timing":"3–8 semanas"}],"costs":[{"item":"Taxa de endosso (Etapa 1)","value":"£561","note":"Pode ter sido reajustada em 8/abr/2026 — confirmar"},{"item":"Taxa de visto (Etapa 2) — até 1 ano","value":"£192","note":"A confirmar"},{"item":"Taxa de visto (Etapa 2) — 1 a 5 anos","value":"£623","note":"A confirmar"},{"item":"Immigration Health Surcharge","value":"£1.035/ano (adulto)","note":"£776/ano para menores de 18"}],"sections":[{"title":"Os organismos endossantes em 2026","body":"· <strong>Tecnologia digital</strong> — <strong>Tech Nation</strong>\n· <strong>Artes e cultura</strong> — <strong>Arts Council England</strong>, com sub-endossantes: <strong>Pact</strong> (cinema e TV), <strong>RIBA</strong> (arquitetura), <strong>British Fashion Council</strong> (moda)\n· <strong>Ciências naturais e pesquisa médica</strong> — <strong>The Royal Society</strong>\n· <strong>Humanidades e ciências sociais</strong> — <strong>The British Academy</strong>\n· <strong>Engenharia</strong> — <strong>The Royal Academy of Engineering</strong>\n· <strong>Pesquisa e inovação</strong> (rota <em>endorsed funder</em> ou <em>peer review</em>) — <strong>UK Research and Innovation (UKRI)</strong>"},{"title":"O histórico do endossante de tecnologia — o que o consultor precisa saber","body":"A via de tecnologia digital passou por instabilidade institucional relevante:\n\n· <strong>31/jan/2023</strong> — a Tech Nation original anunciou que <strong>cessaria operações</strong> ao fim de março de 2023, por perda do financiamento público, gerando incerteza sobre a rota digital;\n· <strong>25/abr/2023</strong> — o <strong>Founders Forum Group</strong> adquiriu formalmente a marca e as operações da Tech Nation;\n· <strong>outubro de 2023</strong> — relançamento sob o Founders Forum, com confirmação de continuidade como endossante;\n· <strong>27/mai/2025</strong> — a Tech Nation anunciou <strong>novo contrato com o Home Office</strong>, mantendo-a como endossante da via de tecnologia digital <strong>pelos 3 anos seguintes</strong>;\n· <strong>agosto de 2025</strong> — simplificação do processo: as solicitações de endosso da Etapa 1 passaram a usar o formulário padrão do Home Office no GOV.UK;\n· <strong>2026</strong> — ampliação dos critérios para incluir computação quântica, blockchain e cibersegurança avançada. <em>A confirmar diretamente com a Tech Nation.</em>\n\n<em>Nota:</em> uma das fontes menciona que o contrato do organismo endossante de tecnologia digital foi <strong>a licitação</strong>. Dado o histórico de instabilidade dessa via específica, <strong>confirme o endossante vigente antes de qualquer orientação</strong>."}],"brazilNote":"A Global Talent é, entre as rotas britânicas, a que menos depende de intermediários: <strong>sem patrocinador, sem oferta de emprego, sem requisito salarial e sem manutenção financeira</strong>. O que exige é <strong>dossiê probatório</strong> — e é aí que o brasileiro precisa investir.\n\n<strong>Combinação com o regime FIG:</strong> quem entra pela Global Talent e satisfaz o teste de 10 anos de não residência prévia pode reivindicar o FIG nos 4 primeiros anos fiscais, mantendo rendimentos e ganhos brasileiros fora da base britânica, com remessa livre. O ILR pode chegar ao 3.º ano na via Exceptional Talent.\n\n<strong>Documentação:</strong> cartas de recomendação de organizações brasileiras devem ser acompanhadas de evidência da reputação da organização no setor; publicações, patentes e prémios brasileiros devem ser contextualizados quanto ao seu alcance.\n\nDocumentos exigem <strong>apostila da Haia</strong> e tradução juramentada.","sources":[{"t":"Connaught Law · Global Talent Visa Endorsement 2026 — organismos e processo","u":"https://connaughtlaw.com/uk-visa-endorsement-requirements-legal-guide/"},{"t":"DavidsonMorris · Global Talent Visa UK 2026","u":"https://www.davidsonmorris.com/global-talent-visa/"},{"t":"Kingsley Napley · Anúncio da Tech Nation confirma que a rota permanece aberta","u":"https://www.kingsleynapley.co.uk/insights/blogs/immigration-law-blog/better-late-than-closed-tech-nation-announcement-confirms-the-visa-route-will-stay-open"},{"t":"GOV.UK · Global Talent visa — Tech Nation","u":"https://www.gov.uk/guidance/global-talent-visa-tech-nation-ceasing-operations"}]},{"name":"Skilled Worker visa e o «earned settlement»","status":"changed","legalBasis":"Immigration Rules, <strong>Appendix Skilled Worker</strong>, <strong>Appendix Skilled Occupations</strong>, <strong>Appendix English Language</strong> e <strong>Appendix Finance</strong>. Substituiu o Tier 2 (General) em 1/dez/2020. Reforma estrutural pelo <strong>Statement of Changes HC 997</strong>, publicado em 1/jul/2025, com efeitos a partir de <strong>22 de julho de 2025</strong>.","desc":"Rota de trabalho patrocinado, submetida a <strong>três reformas estruturais</strong> entre 2024 e 2026.\n\n<strong>Linha do tempo:</strong>\n· <strong>4/abr/2024</strong> — limiar salarial geral saltou de £26.200 para £38.700; extinção do desconto de 20% da <em>Shortage Occupation List</em>, substituída pela <em>Immigration Salary List</em>\n· <strong>11/mar/2024</strong> — <em>care workers</em> e <em>senior care workers</em> proibidos de trazer dependentes\n· <strong>22/jul/2025</strong> — <strong>limiar de qualificação elevado a RQF 6</strong> (nível de graduação); <strong>limiar salarial geral elevado a £41.700</strong>; <strong>fechamento da rota de <em>care worker</em></strong> a novas solicitações do exterior; criação da <strong>Temporary Shortage List (TSL)</strong>. Aproximadamente <strong>180 códigos de ocupação (SOC)</strong> foram retirados da lista elegível\n· <strong>8/jan/2026</strong> — <strong>requisito de inglês elevado de B1 para B2 (CEFR)</strong> para novos requerentes\n· <strong>8/abr/2026</strong> — verificação de conformidade salarial passa a ser feita <strong>por período de pagamento</strong> (<em>pay-period level</em>), não apenas sobre o valor anualizado","kv":[{"l":"Limiar salarial geral","v":"£41.700 ou 100% da going rate"},{"l":"Novo entrante","v":"£33.400 ou 70% da going rate"},{"l":"Nível de qualificação","v":"RQF 6 (graduação)"},{"l":"Inglês","v":"B2 desde 8/jan/2026"},{"l":"Manutenção financeira","v":"£1.270 por 28 dias"},{"l":"Permissão","v":"Até 5 anos, renovável"},{"l":"ILR — regra vigente","v":"5 anos"},{"l":"Sponsor licence — pequeno","v":"£611"},{"l":"Sponsor licence — médio/grande","v":"£1.682"},{"l":"Immigration Skills Charge — grande","v":"£1.320/ano"},{"l":"Temporary Shortage List","v":"RQF 3–5 até 31/dez/2026"},{"l":"TSL — dependentes","v":"Vedados"}],"requirements":["<strong>Certificate of Sponsorship (CoS)</strong> válido, emitido por empregador com <em>sponsor licence</em> de categoria <em>Worker</em>.","Ocupação constante do <strong>Appendix Skilled Occupations</strong>, com nível de qualificação <strong>RQF 6</strong> — ou RQF 3–5, se constar da Temporary Shortage List.","Salário igual ou superior ao maior entre o <strong>limiar geral</strong> aplicável e a <strong>going rate</strong> da ocupação.","<strong>Inglês nível B2 (CEFR)</strong> — desde 8/jan/2026; antes era B1.","<strong>Manutenção financeira de £1.270</strong> por 28 dias consecutivos — dispensada se o patrocinador certificar a manutenção no CoS, ou se o requerente já for residente há 12 meses ou mais.","<strong>Criminal record certificate</strong> para determinadas ocupações — saúde, educação e assistência social."],"sections":[{"title":"Limiares salariais e as opções de desconto","body":"· <strong>Opção A — padrão:</strong> <strong>£41.700/ano</strong> ou <strong>100% da <em>going rate</em></strong> da ocupação, <strong>o que for maior</strong>\n· <strong>Novo entrante</strong> (<em>new entrant</em>): <strong>£33.400/ano</strong> ou <strong>70% da going rate</strong>, o que for maior — aplicável a quem tem menos de 26 anos, é recém-graduado, faz transição de Student ou Graduate visa, ou está em formação para profissão regulamentada. <strong>Máximo de 4 anos</strong> nessa condição\n· <strong>Titulares de doutorado</strong> (STEM e não-STEM): descontos específicos sobre a going rate <em>— percentuais de 2026 a confirmar</em>\n· <strong>Immigration Salary List:</strong> desconto sobre o limiar geral <em>— a confirmar se ainda vigente após jul/2025</em>\n· <strong>Ocupações de saúde e educação</strong> com <em>national pay scales</em>: limiar próprio\n· <strong>Temporary Shortage List (TSL):</strong> ocupações de nível RQF 3–5 mantidas elegíveis <strong>até pelo menos 31 de dezembro de 2026</strong>, com <strong>dependentes vedados</strong>\n\n<em>Nota de verificação: confirmar se houve reajuste dos valores de £41.700 e £33.400 em abril de 2026.</em>"},{"title":"Custos do patrocinador — quem paga o quê","body":"· <strong>Sponsor licence</strong> — pequeno patrocinador ou instituição beneficente: <strong>£611</strong> (era £574), desde 8/abr/2026\n· <strong>Sponsor licence</strong> — médio ou grande patrocinador: <strong>£1.682</strong> (era £1.579), desde 8/abr/2026\n· <strong>Certificate of Sponsorship (CoS)</strong>: £525 <em>— valor pós-abril/2026 a confirmar</em>\n· <strong>Immigration Skills Charge</strong> — grande patrocinador: <strong>£1.320 por ano</strong> de patrocínio (elevada cerca de 32% em dezembro de 2025, de £1.000) <em>— a confirmar</em>\n· <strong>Immigration Skills Charge</strong> — pequeno patrocinador ou beneficente: <strong>£480 por ano</strong> (elevada de £364) <em>— a confirmar</em>\n\n<strong>A Immigration Skills Charge não pode ser repassada ao trabalhador</strong> — é despesa obrigatória do empregador.\n\n<strong>Taxas de visto do requerente:</strong> de fora do Reino Unido, <strong>£943</strong> até 3 anos e <strong>£1.865</strong> acima de 3 anos (confirmadas para 8/abr/2026); de dentro do Reino Unido, aproximadamente £1.000 a £1.900 <em>— a confirmar</em>."},{"title":"Earned settlement — o status legal real da proposta de 10 anos","body":"<strong>Esta é a questão de maior sensibilidade prática hoje, e a mais mal comunicada.</strong>\n\n· <strong>12/mai/2025</strong> — <em>Immigration White Paper «Restoring Control over the Immigration System»</em> propõe elevar o período-padrão de qualificação ao settlement de <strong>5 para 10 anos</strong>, com o conceito de <strong>earned settlement</strong> — possibilidade de antecipação por «contribuição»\n· <strong>20/nov/2025 a 12/fev/2026</strong> — consulta pública <em>«A Fairer Pathway to Settlement»</em>, detalhando o modelo: settlement condicionado a rendimentos sustentados, histórico de conformidade (impostos, benefícios, antecedentes criminais), nível de inglês e responsabilidade financeira. Aproximadamente <strong>130.000 respostas</strong> em análise pelo Home Office\n· <strong>março de 2026</strong> — declaração da <em>Home Secretary</em> manifestando intenção de aplicar o novo modelo também a <strong>pessoas já no Reino Unido</strong> que ainda não obtiveram ILR\n· <strong>2026</strong> — relatório do <em>Home Affairs Committee</em>: «Earned Settlement: Examining the Government's proposed reforms»\n\n<strong>STATUS EM MEADOS DE 2026: nenhuma Immigration Rule foi apresentada ao Parlamento.</strong> A <strong>rota de 5 anos permanece integralmente em vigor</strong> para todas as categorias em que já se aplicava. Implementação almejada para o <strong>outono de 2026</strong>, <strong>sem data vinculante</strong>.\n\n<strong>Leitura factual:</strong> o que existe hoje é <strong>proposta em consulta encerrada</strong>, não direito positivo. Contudo, a declaração ministerial de março de 2026 sinaliza <strong>aplicação a estoque</strong> — pessoas já residentes sem ILR —, o que representa risco material a considerar no planejamento, sem que se possa afirmar o resultado.\n\n<strong>Requisito de inglês para ILR:</strong> elevação de <strong>B1 para B2</strong> anunciada para <strong>26 de março de 2027</strong>; solicitações protocoladas antes dessa data seguem avaliadas pelo padrão B1."},{"title":"Regras de família","body":"Cônjuge ou parceiro e filhos menores; <strong>direito irrestrito de trabalho e estudo</strong>.\n\n<strong>Vedação de dependentes</strong> para ocupações da <strong>Temporary Shortage List</strong> e da rota de <em>care worker</em>.\n\nManutenção adicional de £285 (parceiro) + £315 (1.º filho) + £200 (cada filho adicional) — dispensada com certificação do patrocinador."}],"brazilNote":"Para o brasileiro, o Skilled Worker é a rota que <strong>mais depende de terceiro</strong>: exige empregador britânico disposto a manter <em>sponsor licence</em> e a arcar com a Immigration Skills Charge, que não pode ser repassada.\n\nO aumento do NIC patronal para <strong>15% com limiar de £5.000</strong> em abril de 2025 elevou o custo total de contratar sob patrocínio, o que na prática reduz a disposição de empregadores menores.\n\n<strong>Risco a monitorar:</strong> o <em>earned settlement</em> de 10 anos, se implementado com aplicação a estoque, dobraria o horizonte até o ILR para quem já está no Reino Unido sem settlement. É proposta, não lei — mas quem planeja a rota deve considerar o cenário.\n\n<strong>Combinação com o FIG:</strong> disponível nos 4 primeiros anos fiscais, para quem satisfaz o teste de 10 anos de não residência prévia. Sob a regra vigente de 5 anos até o ILR, o FIG cobre os 4 primeiros e o 5.º ano já é de tributação mundial.","sources":[{"t":"A Y & J Solicitors · Skilled Worker Visa — limiar salarial 2026","u":"https://ayjsolicitors.com/skilled-worker-visa-salary-threshold-uk-2026-new-rules/"},{"t":"Osborne Clarke · UK Immigration White Paper tracker","u":"https://www.osborneclarke.com/uk-immigration-white-paper-tracker"},{"t":"Home Affairs Committee · Earned Settlement — exame das reformas propostas","u":"https://publications.parliament.uk/pa/cm5901/cmselect/cmhaff/1409/report.html"},{"t":"DavidsonMorris · Earned Settlement UK — guia da reforma do ILR","u":"https://www.davidsonmorris.com/earned-settlement/"},{"t":"Fragomen · Reino Unido — aumentos de taxas em abril de 2026","u":"https://www.fragomen.com/insights/united-kingdom-fee-increases-in-april-2026.html"}]},{"name":"Outras rotas: Expansion Worker, HPI e Youth Mobility","status":"ok","legalBasis":"Immigration Rules: <strong>Appendix Global Business Mobility – UK Expansion Worker</strong> (criada em 11/abr/2022, substituindo a <em>Sole Representative of an Overseas Business</em>); <strong>Appendix High Potential Individual</strong> (criada em 30/mai/2022); <strong>Appendix Youth Mobility Scheme</strong>.","desc":"Três rotas complementares, com perfis e limitações muito distintos — e duas delas com restrições relevantes para brasileiros.","kv":[{"l":"Expansion Worker — duração máxima","v":"2 anos"},{"l":"Expansion Worker — settlement","v":"Não conduz ao ILR"},{"l":"Expansion Worker — salário","v":"£52.500 ou a going rate"},{"l":"Expansion Worker — dispensa de 12 meses","v":"Salário ≥ £73.900"},{"l":"HPI — duração","v":"2 anos (3 com doutorado)"},{"l":"HPI — patrocínio","v":"Nenhum"},{"l":"HPI — settlement","v":"Não conduz ao ILR"},{"l":"HPI — universidades brasileiras","v":"Não constam da lista"},{"l":"Youth Mobility — Brasil","v":"Não participa"},{"l":"Youth Mobility — Uruguai","v":"Único sul-americano na lista"}],"sections":[{"title":"UK Expansion Worker (Global Business Mobility)","body":"<strong>Finalidade:</strong> permitir que um gerente sénior ou funcionário especializado de empresa estrangeira <strong>sem operação ativa no Reino Unido</strong> venha estabelecer a presença britânica.\n\n<strong>Requisitos:</strong>\n· a empresa estrangeira <strong>ainda não iniciou operações comerciais</strong> no Reino Unido — pode ter entidade registada, mas sem <em>trading</em>;\n· obtenção prévia de <strong>provisional sponsor licence</strong> de categoria <em>UK Expansion Worker</em> pela empresa estrangeira, com <em>UK footprint</em> (endereço, entidade registada ou imóvel);\n· o requerente é <strong>gerente sénior</strong> ou <strong>funcionário especializado</strong>;\n· <strong>12 meses de trabalho prévio</strong> para o empregador no exterior — <strong>dispensado se o salário for £73.900/ano ou mais</strong>, ou se for nacional japonês em empresa japonesa (acordo Reino Unido–Japão);\n· salário de <strong>£52.500/ano</strong> ou a <em>going rate</em> da ocupação, o que for maior <em>— limiar a confirmar após jul/2025</em>;\n· ocupação de nível <strong>RQF 6</strong> <em>— a confirmar se o aumento de julho de 2025 alcançou a rota GBM</em>;\n· manutenção financeira de £1.270, dispensável com certificação do patrocinador;\n· <strong>sem requisito de inglês</strong>.\n\n<strong>Limitações estruturais:</strong>\n· duração de 12 meses ou o período do CoS mais 14 dias, o que for menor; extensível por mais 12 meses;\n· <strong>máximo absoluto de 2 anos</strong> no Reino Unido nesta rota, em qualquer período de 5 anos;\n· <strong>não conduz ao settlement</strong> — é rota expressamente temporária;\n· máximo de 5 trabalhadores por patrocinador provisório <em>— a confirmar</em>;\n· <strong>caminho de saída:</strong> uma vez que o negócio esteja operando, converte-se a licença provisória em <em>sponsor licence</em> plena e o trabalhador <strong>muda para Skilled Worker</strong>, que conduz ao ILR — ou para <em>Senior or Specialist Worker</em>, que também não conduz;\n· dependentes permitidos, com direito de trabalho.\n\n<strong>Taxa de visto:</strong> aproximadamente £319–£637 <em>— a confirmar</em>."},{"title":"High Potential Individual (HPI)","body":"<strong>Requisitos:</strong>\n· diploma equivalente a <strong>bacharelado, mestrado ou doutorado britânico</strong>, concedido por instituição constante da <strong>Global Universities List</strong>;\n· diploma obtido nos <strong>últimos 5 anos</strong> anteriores à solicitação;\n· a universidade deve constar da lista <strong>do ano em que o diploma foi concedido</strong>;\n· validação de qualificação pelo <strong>Ecctis</strong> (UK ENIC);\n· <strong>inglês nível B1</strong>;\n· <strong>manutenção financeira de £1.270</strong> por 28 dias;\n· <strong>não ter tido anteriormente permissão HPI ou Graduate visa</strong>.\n\n<strong>Características:</strong>\n· duração de <strong>2 anos</strong>; <strong>3 anos</strong> para doutorado;\n· <strong>sem patrocínio</strong>;\n· emprego livre — qualquer emprego, autónomo, empresário; troca de empregador sem restrição;\n· <strong>não extensível</strong>;\n· <strong>não conduz ao ILR</strong> — é necessário mudar para outra rota (Skilled Worker, Global Talent, Innovator Founder);\n· dependentes permitidos.\n\n<strong>A lista de universidades</strong> é publicada anualmente pelo UKVI, em novembro. Critério: figurar entre as <strong>top 50 mundiais</strong> em ao menos 2 dos 3 rankings (QS, Times Higher Education, Academic Ranking of World Universities).\n\n<strong>Ponto crítico para brasileiros: universidades brasileiras não constam da Global Universities List.</strong> A rota é acessível apenas a brasileiros graduados em instituições estrangeiras listadas — Estados Unidos, Canadá, Austrália, China, Singapura, Japão e países europeus. <em>Verificar a lista de novembro de 2025/2026.</em>\n\n<strong>Taxa:</strong> aproximadamente £822 <em>— a confirmar</em>."},{"title":"Youth Mobility Scheme — o Brasil não participa","body":"<strong>Cidadãos brasileiros não são elegíveis</strong> ao Youth Mobility Scheme.\n\n<strong>Países e territórios elegíveis:</strong>\n· <strong>18 a 35 anos:</strong> Austrália, Canadá, Nova Zelândia, República da Coreia\n· <strong>18 a 30 anos:</strong> Andorra, Islândia, Japão, Mónaco, San Marino, <strong>Uruguai</strong>\n· <strong>via sorteio (<em>ballot</em>) obrigatório:</strong> Hong Kong (passaporte SAR), Taiwan\n· também elegíveis: <em>British Overseas Citizens</em>, <em>British Overseas Territories Citizens</em>, <em>British Nationals (Overseas)</em>\n\n<strong>O Uruguai é o único país sul-americano na lista.</strong> Não há, até este levantamento, acordo Reino Unido–Brasil de mobilidade jovem. <em>Verificar se há negociação em curso.</em>\n\n<strong>Características gerais</strong> (para referência comparativa): duração de 2 anos — 3 anos para Austrália, Canadá, Nova Zelândia e Coreia do Sul; sem patrocinador; sem oferta de emprego; sem limiar salarial; exige fundos de <strong>£2.530</strong>; <strong>não conduz ao settlement</strong>; <strong>não permite dependentes</strong>. Taxa de aproximadamente £319."}],"brazilNote":"Das três rotas, apenas o <strong>UK Expansion Worker</strong> é plenamente acessível ao brasileiro — e é temporária, com máximo de 2 anos e sem caminho ao settlement, servindo apenas como ponte para a conversão em Skilled Worker.\n\nO <strong>HPI</strong> depende de diploma de universidade da <em>Global Universities List</em>, na qual <strong>nenhuma universidade brasileira consta</strong>. É acessível apenas a brasileiros que se graduaram no exterior, em instituição listada, nos últimos 5 anos.\n\nO <strong>Youth Mobility Scheme</strong> está <strong>fechado a brasileiros</strong> — o Uruguai é o único país sul-americano contemplado.\n\nPara o brasileiro que dirige empresa com operação no Brasil e pretende abrir subsidiária britânica, o Expansion Worker é a via de entrada — mas o planejamento deve prever, desde o início, a conversão para Skilled Worker antes de esgotar os 2 anos, sob pena de perder a continuidade da residência para efeito de ILR.","sources":[{"t":"GOV.UK · UK Expansion Worker visa (Global Business Mobility)","u":"https://www.gov.uk/uk-expansion-worker-visa"},{"t":"DavidsonMorris · UK Expansion Worker Visa — guia completo 2026","u":"https://www.davidsonmorris.com/uk-expansion-worker-visa/"},{"t":"DavidsonMorris · High Potential Individual Visa UK — guia 2026","u":"https://www.davidsonmorris.com/high-potential-individual-visa/"},{"t":"Rowan · Youth Mobility Scheme — lista completa de países elegíveis 2026","u":"https://withrowan.co.uk/guides/youth-mobility-eligible-countries"}]},{"name":"ILR, naturalização e a ausência de tratado com o Brasil","status":"risk","legalBasis":"<strong>ILR:</strong> Immigration Rules, Appendix Settlement, Appendix Continuous Residence e Appendix KoL UK. <strong>Naturalização:</strong> British Nationality Act 1981, seção 6(1) e Schedule 1 (via geral); seção 6(2) (cônjuge de britânico). <strong>Tratado:</strong> Convenção Brasil–Reino Unido assinada em 29/nov/2022, <strong>ainda não em vigor</strong>.","desc":"<strong>Etapa 1 — Indefinite Leave to Remain (ILR).</strong> Período de qualificação de <strong>5 anos</strong> (Skilled Worker; Global Talent <em>exceptional promise</em> em artes e tecnologia) ou <strong>3 anos</strong> (Innovator Founder; Global Talent <em>exceptional talent</em>).\n\n<strong>Residência contínua:</strong> não exceder <strong>180 dias de ausência do Reino Unido em qualquer período móvel de 12 meses</strong> ao longo de todo o período de qualificação.\n\n<strong>Etapa 2 — Naturalização.</strong> Via geral: ter ILR há pelo menos <strong>12 meses</strong>, mais <strong>5 anos de residência legal</strong>, com máximo de <strong>450 dias</strong> de ausência nos 5 anos e <strong>90 dias</strong> nos últimos 12 meses. Via cônjuge de cidadão britânico: <strong>3 anos</strong> de residência legal, máximo de <strong>270 dias</strong> de ausência, <strong>sem necessidade de aguardar os 12 meses após o ILR</strong>.\n\n<strong>Perda do ILR:</strong> ausência do Reino Unido por <strong>2 anos consecutivos</strong> faz o ILR caducar. Existe a <em>Returning Resident visa</em> para quem esteve fora por mais de 2 anos, com critérios discricionários. <strong>A cidadania britânica, por não caducar, é a proteção definitiva contra esse risco.</strong>","kv":[{"l":"ILR — período padrão","v":"5 anos"},{"l":"ILR — Innovator e Global Talent","v":"3 anos"},{"l":"Ausência máxima para ILR","v":"180 dias em 12 meses móveis"},{"l":"Naturalização — via geral","v":"5 anos + 12 meses de ILR"},{"l":"Naturalização — cônjuge","v":"3 anos, sem esperar 12 meses"},{"l":"Ausência máxima — 5 anos","v":"450 dias"},{"l":"Ausência máxima — últimos 12 meses","v":"90 dias"},{"l":"Inglês","v":"B1 (B2 previsto para 26/mar/2027)"},{"l":"Perda do ILR","v":"2 anos de ausência"},{"l":"Dupla cidadania","v":"Permitida pelos dois países"},{"l":"CDT Brasil–Reino Unido","v":"Assinada, NÃO em vigor"}],"requirements":["<strong>ILR:</strong> período de qualificação cumprido na rota aplicável — atualmente 5 anos (Skilled Worker) ou 3 anos (Innovator Founder, Global Talent <em>exceptional talent</em>).","<strong>ILR:</strong> residência contínua — não exceder <strong>180 dias de ausência em qualquer período móvel de 12 meses</strong>.","<strong>ILR:</strong> aprovação no <strong>Life in the UK Test</strong>.","<strong>ILR:</strong> inglês <strong>CEFR B1</strong> (falar e ouvir) — elevação a B2 prevista para 26/mar/2027.","<strong>ILR:</strong> ausência de condenações não expiradas e cumprimento dos <em>suitability requirements</em>.","<strong>Naturalização:</strong> ter <strong>ILR há pelo menos 12 meses</strong> (dispensado para cônjuge de britânico); <strong>5 anos</strong> de residência legal (3 anos para cônjuge); máximo de <strong>450 dias</strong> de ausência nos 5 anos (270 nos 3 anos) e <strong>90 dias</strong> nos últimos 12 meses.","<strong>Naturalização:</strong> estar <strong>fisicamente no Reino Unido</strong> na data exata de 5 anos antes da solicitação.","<strong>Naturalização:</strong> <em>good character requirement</em> — histórico criminal, <strong>fiscal</strong>, imigratório e financeiro. <strong>A conformidade fiscal é examinada:</strong> débitos com a HMRC, declarações em atraso ou participação em esquemas de evasão podem fundamentar recusa.","<strong>Naturalização:</strong> intenção de ter o Reino Unido como residência principal, e <strong>duas referências</strong> (<em>referees</em>) qualificadas."],"process":[{"step":"Acumulação do período de qualificação","detail":"3 ou 5 anos, conforme a rota, observando o limite de <strong>180 dias de ausência em qualquer período móvel de 12 meses</strong>.","timing":"3–5 anos"},{"step":"Life in the UK Test e teste de inglês","detail":"Aprovação no Life in the UK Test e no teste de inglês B1. <strong>Nenhum dos dois precisa ser refeito</strong> para a naturalização, se já aceito no ILR — a aprovação no Life in the UK <strong>não expira</strong>. Guardar o certificado e o <strong>Unique Reference Number (URN)</strong>.","timing":"Antes do ILR"},{"step":"Solicitação do ILR","detail":"Pedido ao UKVI. Para Innovator Founder: novo endosso e comprovação de 2 dos 7 critérios de settlement. Para rotas patrocinadas: manutenção do emprego e do salário no limiar exigido.","timing":"Decisão em até 6 meses"},{"step":"Solicitação da naturalização (N-400 britânico: Form AN)","detail":"12 meses após o ILR (via geral), ou imediatamente (cônjuge de britânico).","timing":"Decisão em até 6 meses"},{"step":"Cerimónia de cidadania","detail":"Perante autoridade local, com <em>Oath of Allegiance</em> e <em>Pledge</em>, a realizar em até <strong>3 meses</strong> da aprovação. Taxa de cerimónia à parte.","timing":"Até 3 meses"}],"costs":[{"item":"Indefinite Leave to Remain","value":"£3.226 por requerente","note":"Era £3.029; confirmado para 8/abr/2026"},{"item":"Naturalisation — adulto","value":"£1.709","note":"Era £1.605; confirmado para 8/abr/2026"},{"item":"Registration de criança como cidadã britânica","value":"£1.000","note":"Era £1.214 — redução; confirmado para 8/abr/2026"},{"item":"Cerimónia de cidadania","value":"£80","note":"A confirmar"},{"item":"Life in the UK Test","value":"£50 por tentativa","note":"A confirmar"},{"item":"Teste de inglês SELT (B1/B2)","value":"£150–£200","note":"Varia por provedor"},{"item":"Passaporte britânico (adulto, online)","value":"≈£94,50","note":"A confirmar"}],"sections":[{"title":"Aumento proposto da taxa de naturalização","body":"Há <strong>regra proposta (NPRM)</strong> do Home Office elevando a taxa de naturalização em aproximadamente <strong>75% a 80%</strong> — de £1.709 para faixa em torno de <strong>£1.280 a mais</strong>.\n\n<strong>Em agosto de 2026 é apenas proposta em fase de comentário público, não está em vigor.</strong> <em>Verificar o estágio processual atual.</em>"},{"title":"Dupla cidadania","body":"<strong>Lado britânico:</strong> o Reino Unido <strong>permite</strong> a dupla e a múltipla nacionalidade sem restrição. Não é exigida a renúncia à nacionalidade anterior.\n\n<strong>Lado brasileiro:</strong> a Constituição Federal, art. 12, §4.º, II, foi alterada pela <strong>Emenda Constitucional n.º 131, de 2023</strong>. Sob a redação vigente, a perda da nacionalidade brasileira ocorre, em regra, quando o brasileiro <strong>requer expressamente</strong> a perda — a <strong>aquisição voluntária de nacionalidade estrangeira deixou de acarretar perda automática</strong>. Antes da EC 131/2023, o texto previa perda pela aquisição voluntária, com exceções (reconhecimento de nacionalidade originária pela lei estrangeira; imposição de naturalização como condição de permanência ou de exercício de direitos civis).\n\n<strong>Consequência prática:</strong> um brasileiro que se naturaliza britânico <strong>m
