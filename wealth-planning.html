is, válidas apenas enquanto persistirem as circunstâncias que as justificaram e sujeitas a caducidade automática decorrido certo prazo após a cessação dessas circunstâncias (regra geral do art. 1.891: caducam se o testador não morrer na viagem nem nos noventa dias subsequentes ao desembarque em terra onde possa fazer testamento na forma ordinária).\n\n<strong>Marítimo</strong> (arts. 1.888–1.892): feito a bordo de navio nacional, de guerra ou mercante, perante o comandante, na presença de duas testemunhas, seguindo forma equivalente ao público ou cerrado.\n\n<strong>Aeronáutico</strong> (art. 1.889, remetendo ao regime do marítimo): feito a bordo de aeronave militar ou comercial perante pessoa designada pelo comandante.\n\n<strong>Militar</strong> (arts. 1.893–1.896): destinado a militares e demais pessoas a serviço das Forças Armadas em campanha, dentro ou fora do país, ou em praça sitiada ou com comunicações interrompidas, quando não seja possível testar na forma ordinária.\n\nNa prática de wealth planning internacional, essas formas têm relevância residual — são cobertas por precaução doutrinária, não por uso corrente entre clientes de banca privada."},{"title":"Inventário: judicial versus extrajudicial","body":"A partilha dos bens do falecido pode se dar por via <strong>judicial</strong> (processo de inventário no foro do último domicílio do autor da herança, art. 48 do CPC) ou <strong>extrajudicial</strong>, por escritura pública lavrada em tabelionato de notas — via mais célere e menos onerosa, regulada desde 2007 pela Resolução CNJ nº 35/2007 e substancialmente ampliada pela Resolução CNJ nº 571/2024.\n\nHistoricamente, o inventário extrajudicial exigia consenso entre todos os herdeiros capazes e ausência de testamento. A Resolução CNJ 571/2024 relaxou essas condições: passou a admitir escritura pública de inventário e partilha mesmo havendo herdeiro menor ou incapaz — desde que o quinhão hereditário deste seja pago em partes ideais de cada bem inventariado e haja manifestação favorável do Ministério Público — e mesmo quando o autor da herança tenha deixado testamento. A resolução também passou a permitir o reconhecimento da meação do convivente sobrevivente diretamente na escritura, e dispensou autorização judicial prévia para alienação de bens do espólio antes da partilha. Essas mudanças ampliaram substancialmente o universo de sucessões brasileiras que podem evitar o processo judicial — relevante para wealth planning porque reduz tempo, custo e exposição pública do inventário, ainda que a via extrajudicial continue exigindo consenso entre os interessados capazes."}],"brazilNote":"Testamento vital / diretivas antecipadas de vontade: embora não seja um veículo sucessório patrimonial em sentido estrito, integra o planejamento de wealth planning por afetar decisões de fim de vida e procuração duradoura. A matéria não tem lei específica no Brasil; é disciplinada pela Resolução CFM nº 1.995/2012, que permite ao paciente registrar, junto ao médico assistente, diretivas antecipadas sobre tratamentos que deseja ou não receber quando incapaz de manifestar vontade — registro que não exige testemunhas ou forma notarial, mas também não tem a força de um instrumento público, sendo vinculante apenas para a equipe médica (com limite no próprio Código de Ética Médica).","sources":[{"t":"Planalto — Código Civil (Lei nº 10.406/2002)","u":"http://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"t":"CNJ — Resolução nº 571/2024 (altera a Resolução CNJ nº 35/2007 sobre inventário e partilha extrajudiciais)","u":"https://www.cnj.jus.br/cnj-autoriza-divorcio-inventario-e-partilha-extrajudicial-mesmo-com-menores-de-idade/"},{"t":"CFM — Resolução nº 1.995/2012 (diretivas antecipadas de vontade)","u":"https://portal.cfm.org.br/noticias/pacientes-poderao-registrar-em-prontuario-a-quais-procedimentos-querem-ser-submetidos-no-fim-da-vida/"}]},{"name":"Testamento e sucessão internacional","eyebrow":"Conflito de leis e competência","legalBasis":"Decreto-Lei nº 4.657/1942 (LINDB), art. 10; Código de Processo Civil (Lei nº 13.105/2015), art. 23","desc":"Quando o patrimônio do cliente inclui bens em mais de uma jurisdição, dois problemas jurídicos distintos se colocam: qual lei rege a sucessão, e qual foro tem competência para processá-la. A LINDB resolve o primeiro pelo critério do <strong>domicílio do falecido</strong>: art. 10, <em>caput</em> — \"A sucessão por morte ou por ausência obedece à lei do país em que domiciliado o defunto ou o desaparecido, qualquer que seja a natureza e a situação dos bens\". O Brasil adota, portanto, o <strong>princípio da pluralidade dos juízos sucessórios</strong>: um falecido domiciliado no Brasil com bens em múltiplos países pode gerar tantos inventários quanto forem os países onde estejam situados bens sujeitos a processo local — a lei do domicílio define o regime sucessório material (herdeiros, quotas, legítima), mas não dispensa o processamento local de bens sujeitos a jurisdição estrangeira.\n\nDois parágrafos do art. 10 tratam de hipóteses específicas: o §1º determina que a sucessão de bens de estrangeiros situados no Brasil seguirá a lei brasileira em benefício do cônjuge ou filhos brasileiros, sempre que a lei pessoal do falecido não lhes for mais favorável; o §2º submete a capacidade para suceder à lei do domicílio do herdeiro ou legatário.\n\nNo plano processual, o art. 23, II, do CPC atribui à <strong>autoridade judiciária brasileira competência exclusiva</strong> — com exclusão de qualquer outra — para proceder ao inventário e à partilha de bens imóveis situados no Brasil, ainda que o autor da herança seja estrangeiro ou domiciliado fora do país; o inciso I faz o mesmo para a confirmação de testamento particular feito no Brasil. Bens móveis e imóveis situados no exterior seguem, inversamente, a competência do país onde estão situados — não integram o inventário brasileiro, ainda que o falecido fosse domiciliado no Brasil.","kv":[{"l":"Lei aplicável à sucessão","v":"Lei do domicílio do falecido (LINDB, art. 10)"},{"l":"Princípio adotado","v":"Pluralidade dos juízos sucessórios"},{"l":"Competência exclusiva brasileira","v":"Imóveis situados no Brasil (CPC, art. 23, II)"},{"l":"Reconhecimento de decisão estrangeira","v":"Homologação pelo STJ (EC 45/2004)"}],"sections":[{"title":"Reconhecimento de testamento estrangeiro no Brasil","body":"Um testamento validamente lavrado no exterior, segundo a lei do local de celebração ou do domicílio do testador, pode produzir efeitos sobre bens brasileiros, mas depende de reconhecimento formal: quando envolve decisão judicial estrangeira que dele decorra (por exemplo, decisão de probate estrangeira homologando a partilha), a eficácia no Brasil depende da <strong>homologação de sentença estrangeira</strong> pelo Superior Tribunal de Justiça, competência transferida do STF para o STJ pela Emenda Constitucional nº 45/2004. Sem essa homologação, a decisão estrangeira é juridicamente inerte no território nacional: não gera título executivo, não altera registro público brasileiro e não vincula juiz brasileiro.\n\nPara bens imóveis situados no Brasil, contudo, a competência exclusiva do art. 23, II, do CPC significa que o inventário e a partilha desses bens específicos devem necessariamente tramitar no Brasil, ainda que o testamento e o inventário principal do espólio corram no exterior — a homologação de sentença estrangeira não supre essa exigência para a parcela imobiliária brasileira."},{"title":"Incompatibilidade entre trust e legítima brasileira","body":"O ponto de maior risco técnico em wealth planning internacional para clientes com nexo brasileiro é a colisão entre a lógica do trust de common law — que permite ao settlor excluir herdeiros da distribuição, por tempo indefinido, mediante trustee discricionário — e a <strong>ordem pública</strong> brasileira, que reserva a legítima como direito indisponível dos herdeiros necessários (art. 1.846 CC) e veda disposição que a prejudique, sob pena de nulidade por fraude à lei imperativa (art. 166, VI, CC).\n\nQuando o instituidor é domiciliado no Brasil ou tem herdeiros necessários domiciliados no Brasil, há risco real de que um trust estrangeiro — mesmo válido e plenamente eficaz sob sua lei de regência — seja <strong>desconsiderado por tribunal brasileiro</strong> na parte em que prejudique a legítima, sob o fundamento de que a LINDB submete a sucessão à lei do domicílio do falecido (art. 10) e essa lei (a brasileira) é imperativa quanto à legítima. Os instrumentos processuais à disposição do herdeiro prejudicado incluem a ação de redução de doações inoficiosas, o pedido de colação, e — em casos de fraude mais evidente, como aporte de participações societárias ao trust em vida do instituidor com o efeito prático de esvaziar a legítima — pedidos de desconsideração da estrutura. Esse risco não é meramente teórico: doutrina especializada brasileira converge em apontar que o trust irrevogável e discricionário, tal como concebido em jurisdições de common law, é estruturalmente incompatível com a proteção da legítima sempre que há nexo relevante com o Brasil — domicílio do instituidor, domicílio de herdeiro necessário, ou bens situados no Brasil.\n\nA mitigação de risco passa por planejamento em vida compatível com a legítima (uso da porção disponível, doações com reserva de usufruto dentro dos limites legais, holding patrimonial com governança societária), e não pela mera transferência de patrimônio a trust estrangeiro na expectativa de que a estrutura afaste, por si, a aplicação da lei sucessória brasileira."}],"warning":"Para clientes brasileiros ou com herdeiros necessários domiciliados no Brasil, o trust estrangeiro não deve ser apresentado como substituto do planejamento sucessório doméstico, mas como camada adicional de governança e proteção patrimonial sobre a porção disponível — nunca como veículo para excluir a legítima de herdeiros necessários brasileiros.","sources":[{"t":"Planalto — LINDB (Decreto-Lei nº 4.657/1942)","u":"https://www.planalto.gov.br/ccivil_03/decreto-lei/del4657compilado.htm"},{"t":"Planalto — Código de Processo Civil (Lei nº 13.105/2015)","u":"https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2015/lei/l13105.htm"},{"t":"STJ — Homologação de Sentença Estrangeira e Exequatur de Carta Rogatória","u":"https://www.stj.jus.br/sites/portalp/Leis-e-normas/Principais-atos-por-tema/Cartas-Rogatorias-e-Sentenca-Estrangeira"}]},{"name":"Holding patrimonial familiar","eyebrow":"Alternativa societária doméstica","legalBasis":"Código Civil, arts. 997 a 1.038 (sociedades) e art. 1.390 a 1.411 (usufruto); Lei das S.A. (Lei nº 6.404/1976) quando constituída sob essa forma","desc":"A holding patrimonial (ou familiar) é uma sociedade — tipicamente limitada ou, em estruturas maiores, sociedade anônima fechada — constituída para deter e administrar o patrimônio da família (participações societárias, imóveis, investimentos), com finalidade dupla: organização de governança em vida e simplificação da transmissão sucessória. Diferentemente do trust, é integralmente reconhecida pelo direito brasileiro, com titularidade unitária e regime societário ordinário — o instituidor detém quotas ou ações, não bens diretamente.\n\nO mecanismo sucessório central é a <strong>doação de quotas com reserva de usufruto</strong>: os pais doam a nua-propriedade das quotas aos herdeiros ainda em vida, retendo o usufruto — que lhes garante os direitos econômicos (dividendos) e, tipicamente, os direitos políticos de administração, conforme cláusulas do contrato social. Sob o aspecto sucessório, essa técnica antecipa a transmissão patrimonial para o momento presente, sob condições e cláusulas restritivas definidas pelos doadores (incomunicabilidade, impenhorabilidade, inalienabilidade, reversão), reduzindo o volume de bens sujeitos a inventário no óbito — a nua-propriedade das quotas já estará no patrimônio dos herdeiros, e apenas a extinção do usufruto (por morte do usufrutuário) consolidará a propriedade plena, sem necessidade de novo ato de transmissão.\n\nA holding não escapa da legítima: a doação de quotas em vida é sujeita a colação no inventário (arts. 2.002 e seguintes do CC) e, se exceder a porção disponível do doador, é redutível por ação de redução movida por herdeiro prejudicado. A holding organiza e antecipa a transmissão patrimonial — não a exclui do regime da legítima.","kv":[{"l":"Natureza jurídica","v":"Sociedade (LTDA ou S.A.), reconhecida integralmente pelo direito brasileiro"},{"l":"Mecanismo sucessório","v":"Doação de quotas com reserva de usufruto"},{"l":"Sujeição à legítima","v":"Sim — doação em vida é sujeita a colação e redução"},{"l":"Instrumentos de governança","v":"Contrato/estatuto social, acordo de quotistas/acionistas, protocolo de família"}],"sections":[{"title":"Acordo de sócios e protocolo de família como instrumentos de governança","body":"O <strong>acordo de quotistas/acionistas</strong> é instrumento contratual, vinculante e oponível nos termos da lei societária, que disciplina exercício de voto, quóruns qualificados para matérias relevantes, direito de preferência, cláusulas de saída (tag-along, drag-along) e mecanismos de resolução de impasse entre os sócios familiares — normalmente arquivado na sede social e, quando referente a S.A., averbado nos termos do art. 118 da Lei das S.A.\n\nO <strong>protocolo de família</strong> é documento de natureza mais ampla e, em regra, não vinculante no mesmo grau: reúne princípios, valores, critérios de ingresso de novos membros na gestão, políticas de distribuição de dividendos e regras de convivência familiar que transcendem a esfera estritamente societária — é o instrumento onde a família formaliza sua visão de longo prazo e os critérios de mérito e legitimidade para acesso a cargos de gestão, distinto do acordo de sócios por incluir membros da família sem participação societária direta. Na prática de wealth planning, os dois instrumentos são complementares: o protocolo estabelece os princípios; o acordo de sócios lhes dá força jurídica exequível dentro da estrutura societária."}],"brazilNote":"A holding patrimonial é hoje o veículo sucessório doméstico mais utilizado no Brasil por famílias de alto patrimônio, precisamente porque opera dentro dos limites da legítima em vez de tentar contorná-la — reduzindo, assim, o risco de nulidade ou de disputa judicial que estruturas como o trust enfrentam quando aplicadas a instituidores ou herdeiros brasileiros.","sources":[{"t":"Planalto — Código Civil (Lei nº 10.406/2002)","u":"http://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"t":"Planalto — Lei das Sociedades por Ações (Lei nº 6.404/1976)","u":"https://www.planalto.gov.br/ccivil_03/leis/l6404consol.htm"},{"t":"IBDFAM — Holding familiar como ferramenta de planejamento patrimonial e sucessório","u":"https://ibdfam.org.br/artigos/1500/Holding+familiar+como+ferramenta+de+planejamento+patrimonial+e+sucess%C3%B3rio"}]},{"name":"Fundação privada brasileira","eyebrow":"Alternativa societária doméstica","legalBasis":"Código Civil, arts. 62 a 69","desc":"A fundação é pessoa jurídica de direito privado constituída pela afetação de um patrimônio livre, por escritura pública ou testamento, a uma finalidade específica declarada pelo instituidor (art. 62, <em>caput</em>). Diferentemente da holding, não tem sócios: nasce da dotação patrimonial em si, administrada por um órgão gestor (curadoria/conselho) segundo o estatuto aprovado e fiscalizado pelo Ministério Público do Estado onde tem sede (art. 66).\n\nA limitação central que diferencia a fundação brasileira das foundations offshore usadas em wealth planning internacional (Panamá, Liechtenstein, Nevis) é o <strong>rol taxativo de finalidades permitidas</strong>. O parágrafo único do art. 62 restringe a constituição de fundações a finalidades de: assistência social; cultura, defesa e conservação do patrimônio histórico e artístico; educação; saúde; segurança alimentar e nutricional; defesa, preservação e conservação do meio ambiente e promoção do desenvolvimento sustentável; pesquisa científica, desenvolvimento de tecnologias alternativas, modernização de sistemas de gestão, produção e divulgação de informações e conhecimentos técnicos e científicos; e atividades religiosas. Não há, portanto, espaço legal para uma fundação de finalidade privada e familiar destinada simplesmente a deter patrimônio em benefício de descendentes determinados — o que é o uso corrente da foundation em jurisdições como Panamá ou Liechtenstein.","kv":[{"l":"Constituição","v":"Escritura pública ou testamento, com dotação de bens livres (art. 62)"},{"l":"Fiscalização","v":"Ministério Público do Estado da sede (art. 66)"},{"l":"Finalidades permitidas","v":"Rol taxativo de utilidade pública (art. 62, parágrafo único)"},{"l":"Uso em wealth planning familiar","v":"Não aplicável — sem correspondência com foundation privada offshore"}],"warning":"A fundação do Código Civil brasileiro não é funcionalmente equivalente à private interest foundation usada internacionalmente como alternativa ao trust — é vedado por lei destiná-la a benefício privado e determinado de membros de uma família. Para esse propósito, o wealth planner brasileiro recorre à holding patrimonial (societária) ou, quando há componente internacional, a foundations em jurisdições que admitem finalidade privada (ver tópico seguinte).","sources":[{"t":"Planalto — Código Civil (Lei nº 10.406/2002), arts. 62 a 69","u":"http://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"t":"Ministério Público — Fundação: conceito, características principais e instituição","u":"https://www.mpsc.mp.br/direitos-humanos-e-terceiro-setor/fundacao-conceito-caracteristicas-principais-e-instituicao"}]},{"name":"Private Trust Company (PTC)","eyebrow":"Governança de trusteeship","legalBasis":"Legislação de trust companies da jurisdição de constituição (tipicamente isenta de licenciamento pleno quando restrita a trusts de uma única família — ex.: BVI Regulatory Code, Cayman Islands Private Trust Companies Regulations)","desc":"A Private Trust Company (PTC) resolve uma objeção comum de famílias de alto patrimônio ao trust tradicional: a perda de controle sobre a discricionariedade de um trustee corporativo terceiro. Em vez de nomear uma trust company profissional independente, a família constitui sua própria sociedade — a PTC — para atuar como trustee de um ou mais trusts da própria família, e apenas deles (a maioria das jurisdições exige que a PTC não capte trusteeship de terceiros, sob pena de precisar de licenciamento pleno como trust company regulada).\n\nA PTC é administrada por um conselho de administração no qual membros da família, assessores de confiança (advogados, contadores) e, tipicamente, um trustee profissional convidado, dividem assento — a família mantém maioria ou influência decisiva sobre as decisões de trusteeship (nomeação de novos trustees, exercício de discricionariedade em distribuições, mudanças de proper law), preservando continuidade e alinhamento com os valores familiares através de gerações sem depender da rotatividade de um trustee corporativo terceiro. Como pessoa jurídica, a PTC não morre, não se aposenta e não muda de emprego — atributo relevante para trusts dinásticos de longuíssimo prazo.","kv":[{"l":"Função","v":"Trustee dedicado a trust(s) de uma única família"},{"l":"Órgão de governança","v":"Conselho de administração (família + assessores + trustee profissional)"},{"l":"Licenciamento","v":"Tipicamente isento de licenciamento pleno se restrito a trusts da família"},{"l":"Jurisdições típicas","v":"BVI, Cayman Islands, Jersey, South Dakota"}],"sources":[{"t":"Ocorian — Preserving generational wealth with Private Trust Companies (PTCs)","u":"https://www.ocorian.com/knowledge-hub/insights/preserving-generational-wealth-private-trust-companies-ptcs"},{"t":"Holland & Knight — Private Trust Companies","u":"https://www.hklaw.com/en/services/practices/private-wealth-services/private-trust-companies"}]},{"name":"Foundations offshore: Panamá e Liechtenstein","eyebrow":"Híbrido trust-sociedade","legalBasis":"Panamá: Lei nº 25, de 12 de junho de 1995 (Private Interest Foundation Law); Liechtenstein: Personen- und Gesellschaftsrecht (PGR) de 1926, arts. 552 e seguintes, com reforma pela Lei de 26 de junho de 2008 (vigente desde 1º de abril de 2009)","desc":"A foundation de interesse privado (private interest foundation) é um híbrido entre trust e sociedade: como o trust, separa o patrimônio de seu instituidor e o destina a beneficiários segundo regras predefinidas; como a sociedade, tem <strong>personalidade jurídica própria</strong> — os bens passam a pertencer à própria fundação, não a um trustee fiduciário. É a alternativa natural ao trust em jurisdições de tradição civilista, e é usada por famílias latino-americanas com frequência precisamente porque seu funcionamento é mais intuitivo para quem vem de sistemas de direito civil (não exige assimilar a dissociação entre legal e equitable title).\n\nA <strong>Panama Private Interest Foundation</strong> (Lei 25/1995) é administrada por um Conselho de Fundação de ao menos três pessoas (art. 17), constituída sem fins lucrativos (ainda que possa exercer atividade comercial, desde que o resultado seja destinado exclusivamente à fundação), sem restrição de nacionalidade ou residência para fundador ou beneficiários. Exige patrimônio inicial mínimo de dez mil balboas (equivalente a US$ 10.000) e taxa anual de manutenção de US$ 300 perante o Fisco panamenho (art. 318 do Código Fiscal do Panamá). É amplamente usada para deter participações societárias, imóveis e investimentos financeiros em benefício de uma classe de beneficiários familiares.\n\nA <strong>Liechtenstein Stiftung</strong> (fundação, PGR arts. 552 e ss.) é a foundation de maior tradição e sofisticação jurídica dessa categoria — Liechtenstein é, junto de Jersey e Cayman, um dos poucos centros financeiros com judiciário e corpo regulatório especializados em disputas de trust e foundation de alto valor. É regida por um conselho de fundação (Stiftungsrat), sem acionistas, e — diferentemente da fundação brasileira do Código Civil — admite expressamente finalidade puramente privada e familiar: administração de patrimônio, sustento de membros da família, e organização sucessória, ao lado das finalidades filantrópicas tradicionais. A reforma de 2008/2009 do PGR modernizou substancialmente o regime de governança e supervisão, aproximando-o das melhores práticas internacionais de compliance em resposta à pressão por transparência pós-crise financeira.","kv":[{"l":"Panamá — órgão de governança","v":"Conselho de Fundação, mínimo 3 membros"},{"l":"Panamá — patrimônio inicial mínimo","v":"US$ 10.000 (dez mil balboas)"},{"l":"Panamá — manutenção anual","v":"US$ 300 (taxa fiscal, art. 318 Código Fiscal)"},{"l":"Liechtenstein — órgão de governança","v":"Stiftungsrat (conselho de fundação)"},{"l":"Liechtenstein — base legal","v":"PGR arts. 552 e ss., reforma vigente desde 1/4/2009"}],"sections":[{"title":"Panamá vs. Liechtenstein — quando usar cada uma","body":"A Panama Private Interest Foundation tende a ser preferida por sua simplicidade de constituição, custo de manutenção mais baixo e proximidade geográfica/cultural com famílias latino-americanas — mas com reputação internacional mais heterogênea (o Panamá esteve historicamente associado a episódios de baixa transparência, ainda que a legislação de compliance local tenha evoluído substancialmente). A Liechtenstein Stiftung tende a ser preferida em estruturas de maior porte e sofisticação, onde a robustez do judiciário local, o histórico de precedentes em disputas de foundation e o padrão regulatório europeu (Liechtenstein integra o Espaço Econômico Europeu) pesam mais do que o custo de constituição e manutenção, tipicamente superior ao panamenho."}],"brazilNote":"Assim como o trust, distribuições de uma foundation offshore a beneficiário residente fiscal no Brasil devem ser analisadas à luz do regime de transparência da Lei 14.754/2023 — a Receita Federal tende a examinar a substância da estrutura (existência de personalidade jurídica própria da foundation não afasta, por si, a possibilidade de tratamento como entidade controlada ou transparente conforme os critérios da lei) mais do que sua forma jurídica declarada no país de origem. [VERIFICAR: tratamento específico da IN RFB 2.180/2024 para private interest foundations — a norma trata expressamente de trusts e de entidades controladas no exterior, e a foundation panamenha/liechtensteiniana pode se enquadrar em um ou outro regime a depender de seus atributos concretos de governança e distribuição]","sources":[{"t":"Kraemer & Kraemer — Law 25 of 1995 on Private Interest Foundations in Panama","u":"https://kraemerlaw.com/en/articles/law-25-of-1995-about-private-interest-foundations/"},{"t":"Law No. 25 of June 12, 1995 — Private Interest Foundation Law of Panama (texto integral)","u":"https://www.londontrust.net/wp-content/uploads/2017/03/LAW_No_25_-Private_Foundation_Law_of_Panama.pdf"},{"t":"Grant Thornton — Overview of the Liechtenstein Foundation / \"Stiftung\"","u":"https://www.grantthornton.ch/en/insights/overview-liechtenstein-foundation-stiftung/"},{"t":"Library of Congress — Liechtenstein: Reformed Law of Private Foundations","u":"https://www.loc.gov/item/global-legal-monitor/2008-09-08/liechtenstein-reformed-law-of-private-foundations/"}]},{"name":"Comparativo: trust vs. testamento vs. holding","eyebrow":"Síntese decisória","legalBasis":"Síntese comparativa com base nos regimes tratados nos tópicos anteriores desta seção","desc":"Não existe veículo sucessório universalmente superior: a escolha depende do peso relativo que o cliente atribui a controle em vida, privacidade, velocidade de transmissão, custo de manutenção e — para clientes com nexo brasileiro — risco de desconsideração pela legítima. Os três veículos a seguir raramente são mutuamente excludentes na prática de wealth planning sofisticado; é comum combiná-los (por exemplo, holding patrimonial doméstica para a porção disponível compatível com a legítima, e trust ou foundation estrangeiros para ativos internacionais e camadas adicionais de governança e proteção patrimonial).","sections":[{"title":"Controle em vida do instituidor","body":"<strong>Trust irrevogável:</strong> baixo — a titularidade legal passa ao trustee; o settlor mantém influência apenas indireta, via protector ou letter of wishes. <strong>Testamento:</strong> total — não produz nenhum efeito em vida, é livremente revogável até o óbito, e o testador mantém plena disposição sobre os bens. <strong>Holding com doação de quotas e reserva de usufruto:</strong> alto — os doadores retêm usufruto (direitos econômicos e, por cláusula, políticos), perdendo apenas a nua-propriedade das quotas já doadas."},{"title":"Privacidade","body":"<strong>Trust:</strong> alta — trust deed e letter of wishes não são, em regra, documentos públicos ou registrados; a existência do trust pode ser inteiramente confidencial entre as partes (sujeita a CRS/troca automática de informações com autoridades fiscais, não ao público). <strong>Testamento:</strong> baixa após o óbito — o inventário, mesmo extrajudicial, é ato público lavrado em tabelionato, com a partilha sujeita a registro público. <strong>Holding:</strong> intermediária — o contrato social e alterações são registrados em junta comercial (públicos), mas o acordo de sócios e o protocolo de família, tipicamente, não são."},{"title":"Velocidade de transmissão (evita inventário)","body":"<strong>Trust irrevogável:</strong> alta — os bens já não integram o patrimônio do settlor no óbito; a transmissão segue os termos do trust deed, sem inventário. <strong>Testamento:</strong> baixa — mesmo o testamento válido não dispensa inventário (judicial ou extrajudicial); apenas organiza a partilha dentro dele. <strong>Holding com doação e usufruto:</strong> alta para as quotas já doadas — a nua-propriedade já está com os herdeiros; a morte do usufrutuário apenas consolida a propriedade plena, sem necessidade de inventário sobre essas quotas especificamente (ainda que outros bens do espólio, se houver, sigam via inventário)."},{"title":"Custo de manutenção","body":"<strong>Trust / foundation offshore:</strong> alto e recorrente — honorários de trustee profissional ou PTC, compliance de CRS/FATCA, assessoria jurídica multijurisdicional. <strong>Testamento:</strong> baixo em vida (custo concentrado no ato de lavratura e eventuais atualizações); custo de inventário recai sobre o espólio no óbito. <strong>Holding:</strong> intermediário e recorrente — contabilidade societária, obrigações fiscais e societárias correntes (declarações, atas, eventual auditoria), mas sem os custos de compliance internacional do trust."},{"title":"Risco de desconsideração pela legítima brasileira","body":"<strong>Trust irrevogável e discricionário:</strong> alto quando o instituidor é domiciliado no Brasil ou tem herdeiros necessários brasileiros — risco real de desconsideração parcial por ordem pública (art. 1.846 c/c art. 166, VI, CC), conforme detalhado no tópico sobre sucessão internacional. <strong>Testamento:</strong> baixo — a legítima é respeitada porque é o próprio Código Civil brasileiro que rege o instrumento; o risco é de nulidade apenas quando o testador extrapola a porção disponível, hipótese de fácil verificação e correção via ação de redução. <strong>Holding com doação e usufruto:</strong> baixo a moderado — desde que as doações respeitem a porção disponível de cada doador (o excedente é sujeito a colação e redução, mas a estrutura societária em si não é anulada, apenas a doação excedente)."}],"sources":[{"t":"Planalto — Código Civil (Lei nº 10.406/2002)","u":"http://www.planalto.gov.br/ccivil_03/leis/2002/l10406compilada.htm"},{"t":"IBDFAM — Planejamento sucessório: novos instrumentos. Considerações sobre a holding familiar e o trust","u":"https://ibdfam.org.br/index.php/artigos/1311/Planejamento+sucess%C3%B3rio:+novos+instrumentos.+Breves+considera%C3%A7%C3%B5es+sobre+a+holding+familiar+e+o+trust.++Terceira+parte"}]}]};
const ATV = {"sectionId":"ativos","sectionTitle":"Ativos de Alto Valor Agregado","sectionSubtitle":"Aeronaves executivas, embarcações de grande porte e obras de arte formam uma classe de ativos com lógica própria de titularidade, registro e tributação — frequentemente estruturada fora do regime doméstico do proprietário, com implicações diretas para o planejamento sucessório e patrimonial.","topics":[{"name":"Registro e Propriedade de Aeronaves — Panorama Internacional","eyebrow":"Aviação executiva","legalBasis":"Convenção da Cidade do Cabo sobre Garantias Internacionais em Equipamentos Móveis (Cape Town Convention, 2001) e Protocolo Aeronáutico, sob a égide conjunta de UNIDROIT e ICAO; regulamentos de registro de cada Estado de bandeira (ex.: Isle of Man Aircraft Registration Regulations, Cayman Islands Air Navigation Overseas Territories Order, FAA 14 CFR Part 47)","desc":"A imensa maioria das aeronaves executivas de grande porte operadas por famílias de alto patrimônio no Brasil e em outras jurisdições emergentes não é matriculada no país de residência do beneficiário final. A prática consolidada do mercado é registrar a aeronave em um dos registros de bandeira especializados — Ilha de Man (\"M-\"), Ilhas Cayman (\"VP-C\"), Aruba (\"P4-\"), San Marino (\"T7-\") ou, para operadores com forte vínculo econômico com os Estados Unidos, o registro americano (\"N-registry\") por meio de estrutura de <em>trust</em>.\n\nAs razões para essa escolha são operacionais e jurídicas, não apenas fiscais: (i) esses registros contam com autoridades de aviação civil dedicadas a aeronaves de grande porte e negócios, com prazos de matrícula e transferência mais curtos que os de registros generalistas; (ii) todos aderem à Convenção da Cidade do Cabo, o que reduz o custo de financiamento ao dar ao credor garantido um <em>International Interest</em> oponível erga omnes, registrável no International Registry eletrônico sediado na Irlanda; (iii) permitem o uso de estrutura de <em>Special Purpose Vehicle</em> (SPV) — normalmente uma sociedade constituída na própria jurisdição de registro ou em jurisdição correlata — para deter a aeronave, isolando o ativo de outros riscos patrimoniais do beneficiário final e simplificando a transferência de titularidade via venda de quotas/ações em vez de transferência do bem físico.\n\nA Convenção da Cidade do Cabo não substitui o registro de aeronavegabilidade nacional — ela cria um regime autônomo e paralelo de garantias internacionais (venda condicional, reserva de domínio, arrendamento) que é inscrito no International Registry e tem prioridade definida por ordem cronológica de registro, independentemente da lei doméstica aplicável ao contrato subjacente. O Brasil é parte da Convenção e do Protocolo Aeronáutico, com implementação acompanhada por força-tarefa da ANAC e da prática de advocacia aeronáutica local, embora a jurisprudência brasileira ainda apresente decisões que não observaram integralmente a prioridade do regime convencional em processos de recuperação judicial e falência — ponto de atenção relevante para financiadores.","kv":[{"l":"Registros mais usados","v":"Isle of Man, Cayman Islands, Aruba, San Marino, EUA (N-registry via trust)"},{"l":"Prefixo Isle of Man","v":"M- (ex.: M-XXXX)"},{"l":"Prefixo Cayman Islands","v":"VP-C"},{"l":"Prefixo Aruba","v":"P4-"},{"l":"Prefixo San Marino","v":"T7-"},{"l":"Base legal internacional","v":"Cape Town Convention (2001) + Aircraft Protocol"},{"l":"Partes na Convenção (dez/2025)","v":"86 Estados-parte da Convenção; 83 do Protocolo Aeronáutico"},{"l":"Estrutura típica de titularidade","v":"SPV (sociedade) no registro de bandeira ou em jurisdição correlata"}],"requirements":["Verificar exigência de vínculo (residência, nacionalidade Commonwealth/EEE) do registro de bandeira escolhido — a Isle of Man restringe registro de aeronaves de asa fixa abaixo de 5.700 kg a residentes","Constituir e manter a SPV proprietária em conformidade com as regras de substância econômica e de beneficiário final da jurisdição","Assegurar registro do International Interest no International Registry quando houver financiamento ou arrendamento","Manter certificado de aeronavegabilidade e conformidade regulatória junto à autoridade de aviação civil do registro (IOM Aircraft Registry, CAACI nas Cayman, DCA em Aruba, etc.)","Avaliar tratamento fiscal no país de residência do beneficiário final para uso pessoal de aeronave detida por SPV estrangeira (regras de preço de transferência, distribuição disfarçada de lucros, tributação de benefício)"],"sections":[{"title":"Por que não matricular no país de residência","body":"Registros generalistas de países emergentes tendem a ter processos de transferência de matrícula mais lentos, menor sofisticação em aeronaves de fabricação estrangeira, e — no caso específico do Brasil — exigência de que a aeronave seja de propriedade de pessoa física ou jurídica brasileira para obter matrícula nacional (marcas \"PP-\", \"PR-\" ou \"PT-\"), o que pode não ser compatível com a estrutura de SPV internacional preferida para isolamento patrimonial e financiamento. Registros como o de Aruba e San Marino, por sua vez, são procurados por operadores europeus e latino-americanos justamente por aceitarem SPVs de terceiros países sem exigência de vínculo de residência tão restritivo quanto o de Man."},{"title":"O papel prático da Cape Town Convention no financiamento","body":"Para o financiador (banco, arrendador, fabricante), a Convenção da Cidade do Cabo reduz o risco de crédito ao criar um direito real internacional autônomo — o <em>International Interest</em> — que é oponível independentemente da lei do foro em caso de inadimplência, insolvência ou recuperação judicial do devedor, sujeito às declarações feitas por cada Estado-parte (Alternativa A ou B do Artigo XI do Protocolo, relativa a remédios em caso de insolvência). Isso normalmente resulta em custo de capital mais baixo para aeronaves registradas em jurisdições com histórico consistente de respeito à Convenção."}],"brazilNote":"O Brasil ratificou a Convenção da Cidade do Cabo e o Protocolo Aeronáutico, que têm força de lei ordinária no ordenamento interno após a devida promulgação. Contudo, a efetividade prática do regime perante o Judiciário brasileiro — especialmente em processos de recuperação judicial — tem sido objeto de acompanhamento por parte da ANAC e da advocacia especializada, com precedentes que nem sempre respeitaram integralmente a prioridade do International Interest. Esse é um fator relevante na análise de risco de crédito para aeronaves com forte nexo operacional brasileiro, mesmo quando registradas no exterior.","warning":"[VERIFICAR: alcance exato da declaração brasileira quanto à Alternativa A/B do Artigo XI do Protocolo Aeronáutico (regime de insolvência) — não confirmado nas fontes consultadas nesta pesquisa; consultar o texto da declaração depositada pelo Brasil junto ao UNIDROIT/ICAO antes de aconselhar sobre prioridade em cenário de recuperação judicial.]","sources":[{"t":"UNIDROIT — Cape Town Convention (texto oficial)","u":"https://www.unidroit.org/instruments/security-interests/cape-town-convention/"},{"t":"ICAO — Cape Town Convention and Protocol (status de partes)","u":"https://www.icao.int/cape-town-convention-and-protocol"},{"t":"Isle of Man Government — Aircraft Registry","u":"https://www.gov.im/about-the-government/departments/enterprise/aircraft-registry/"},{"t":"L2b Aviation — Cape Town Convention, Brazilian Update","u":"https://l2baviation.com/cape-town-convention-brazilian-update-2025/"}]},{"name":"Registro de Aeronaves no Brasil (RAB)","eyebrow":"Regime doméstico","legalBasis":"Lei nº 7.565, de 19 de dezembro de 1986 (Código Brasileiro de Aeronáutica); regulamentos da ANAC (RBAC); Decreto nº 6.759/2009 (Regulamento Aduaneiro); TIPI (códigos 88.02 e 8806.10)","desc":"O Registro Aeronáutico Brasileiro (RAB), administrado pela ANAC, é o livro público em que se inscrevem a matrícula da aeronave, a propriedade e os direitos reais e contratos de exploração, utilização ou garantia sobre ela, nos termos do Código Brasileiro de Aeronáutica (Lei nº 7.565/1986). A matrícula nacional confere à aeronave as marcas de nacionalidade brasileira — historicamente \"PP-\" (aviação geral), \"PT-\" (aviação geral/táxi aéreo) e \"PR-\" (transporte aéreo regular) — e é pré-requisito para operação regular no espaço aéreo brasileiro sob bandeira nacional.\n\nA exigência central do RAB é que a propriedade da aeronave matriculada no Brasil seja de pessoa física residente no país ou de pessoa jurídica brasileira, o que frequentemente é incompatível com as estruturas de SPV internacional (Isle of Man, Cayman, etc.) preferidas por famílias de alto patrimônio para isolamento de risco e financiamento internacional. Essa é a razão prática mais citada para a opção por registro estrangeiro mesmo quando o beneficiário final e a base operacional da aeronave são brasileiros.\n\nNa importação, a aeronave sujeita-se, em regra, a alíquota zero de Imposto de Importação (II) para os produtos classificados nos códigos 88.02 e, desde 1º de abril de 2022, também 8806.10 da TIPI (aeronaves e certas categorias de veículos aéreos não tripulados), com o mesmo tratamento de alíquota zero estendido a PIS/PASEP-Importação e COFINS-Importação sobre essas operações. O IPI incidente no desembaraço aduaneiro e na saída desses mesmos códigos da TIPI, por sua vez, segue a Tabela de Incidência vigente à data do fato gerador — ou seja, não há isenção automática de IPI equivalente à de II, e a alíquota efetiva deve ser verificada na TIPI vigente no momento da operação. Há redução específica de alíquota de IPI (de 5% para 3,75%) para helicópteros e aeronaves adquiridos ou arrendados por empresas de táxi aéreo.","kv":[{"l":"Órgão registrador","v":"ANAC — Registro Aeronáutico Brasileiro (RAB)"},{"l":"Marcas de nacionalidade","v":"PP- / PR- / PT-"},{"l":"Exigência de propriedade","v":"Pessoa física residente no Brasil ou pessoa jurídica brasileira"},{"l":"II na importação (NCM 88.02 / 8806.10)","v":"Alíquota zero"},{"l":"PIS/COFINS-Importação","v":"Alíquota zero (mesmos códigos)"},{"l":"IPI","v":"Conforme Tabela TIPI vigente à data do fato gerador — sem isenção geral automática"},{"l":"IPI reduzido (táxi aéreo)","v":"De 5% para 3,75% em aeronaves/helicópteros de empresas de táxi aéreo"}],"requirements":["Titularidade por pessoa física residente no Brasil ou pessoa jurídica constituída no Brasil","Certificado de aeronavegabilidade emitido/validado pela ANAC (RBAC aplicável ao tipo de aeronave)","Desembaraço aduaneiro com verificação da classificação fiscal correta na TIPI (88.02 vs. 8806.10) para aplicação da alíquota zero de II","Registro de propriedade, ônus e contratos de garantia junto ao RAB","Avaliação de IPVA — [VERIFICAR: tratamento estadual de IPVA sobre aeronaves e embarcações de lazer, tema com decisões divergentes entre entes federativos e debate legislativo em curso; não há uniformidade nacional confirmada nas fontes consultadas]"],"sections":[{"title":"Matrícula brasileira vs. registro estrangeiro — o trade-off","body":"Matricular no Brasil (RAB) tem a vantagem de simplicidade documental para operação doméstica frequente, alinhamento entre proprietário registral e beneficiário final, e ausência de necessidade de estrutura societária no exterior. Em contrapartida, obriga a titularidade por pessoa física ou jurídica brasileira, o que reduz a flexibilidade de estruturação sucessória e de isolamento de responsabilidade civil (a aeronave fica potencialmente mais exposta a credores e a processos de inventário no foro brasileiro) e pode implicar carga tributária de IPI não isenta, a depender da classificação fiscal.\n\nRegistrar no exterior via SPV (Isle of Man, Cayman, Aruba) tende a facilitar o financiamento internacional sob a Convenção da Cidade do Cabo, permite transferência de titularidade por venda de quotas/ações da SPV sem nova matrícula, e frequentemente resulta em estrutura sucessória mais eficiente. O contraponto é a necessidade de operação sob bandeira estrangeira dentro do Brasil, sujeita a regras de admissão temporária, cabotagem aérea e limitações de uso doméstico continuado impostas pela regulamentação de aviação civil brasileira, além do custo de manutenção da estrutura societária estrangeira e da complexidade de compliance (CFC/substância econômica, declaração de bens e capitais no exterior ao Banco Central, tributação de ganho de capital na alienação de participação societária no exterior)."}],"brazilNote":"Toda aeronave com base operacional no Brasil, ainda que registrada no exterior, está sujeita à fiscalização da ANAC quanto a aeronavegabilidade e às regras de admissão temporária da Receita Federal quando não nacionalizada. A escolha entre matrícula brasileira e registro estrangeiro deve ser avaliada em conjunto com a legislação de declaração de capitais brasileiros no exterior (Banco Central) e as regras de tributação de pessoa física/jurídica sobre participações em SPVs estrangeiras.","warning":"[VERIFICAR: alíquota vigente de IPI aplicável a jatos executivos de uso privado (NCM 8802) na data da operação — a TIPI é periodicamente atualizada e a alíquota efetiva não deve ser citada a cliente sem consulta à tabela vigente.]","sources":[{"t":"ANAC — Lei nº 7.565/1986 (Código Brasileiro de Aeronáutica)","u":"https://www.anac.gov.br/assuntos/legislacao/legislacao-1/leis/lei-no-7-565-de-19-12-1986"},{"t":"Planalto — Lei nº 7.565, de 19 de dezembro de 1986","u":"https://www2.camara.leg.br/legin/fed/lei/1980-1987/lei-7565-19-dezembro-1986-368177-norma-pl.html"},{"t":"Importe Melhor — Alíquota Zero na Importação de Aeronaves","u":"https://importemelhor.com.br/aliquota-zero-na-importacao-de-aeronaves/"},{"t":"Mattos Filho — Novas regras de tributação de II e IPI para indústria aeronáutica","u":"https://www.mattosfilho.com.br/unico/regras-imposto-aeronautica/"}]},{"name":"Embarcações de Grande Porte (Yachts) — Registro Internacional","eyebrow":"Navegação de recreio de grande porte","legalBasis":"Registros de bandeira e respectivas Merchant Shipping Acts/regulamentos de cada jurisdição (Cayman Islands Shipping Registry, Republic of the Marshall Islands Maritime Administrator, Malta Merchant Shipping Act, Bahamas Maritime Authority, Isle of Man Ship Registry); Diretiva de IVA da União Europeia e Código Aduaneiro da União (UCC) para admissão temporária","desc":"Os grandes iates (superyachts) seguem lógica de estruturação análoga à das aeronaves executivas: a bandeira sob a qual navegam raramente coincide com a nacionalidade do proprietário beneficiário. Três registros concentram a maior parte da frota de iates acima de 40 metros — Cayman Islands, Marshall Islands e Malta — com Bahamas e Isle of Man também amplamente utilizados. A escolha de bandeira combina reputação junto a autoridades portuárias, ausência de tributação sobre a propriedade da embarcação em si (nas Cayman Islands não há IVA, imposto sucessório ou ganho de capital incidente sobre a titularidade do iate), e flexibilidade de tripulação e certificação.\n\nA titularidade é quase universalmente estruturada por meio de SPV — tipicamente uma <em>exempted company</em> constituída na própria jurisdição de bandeira ou em jurisdição correlata — que detém o título de propriedade da embarcação. Essa SPV pode ser estrutura \"on-balance sheet\", com as ações detidas diretamente pelo beneficiário final, ou estrutura \"off-balance sheet\"/órfã, com as ações detidas por um <em>trustee</em> sob trust de finalidade específica ou trust caritativo — modelo usado sobretudo para isolar o ativo de riscos de responsabilidade civil (incidentes a bordo, poluição, danos a terceiros) e simplificar a transferência de titularidade via venda de participação societária.\n\nPara uso em águas europeias, a questão central é o tratamento de IVA (VAT) e a admissão temporária. Um iate de bandeira não europeia, de propriedade de pessoa ou entidade estabelecida fora da UE, pode navegar em águas da União Europeia sob o regime de Admissão Temporária (Temporary Admission), com suspensão total de direitos aduaneiros e IVA, por prazo de até 18 meses. Esse regime, contudo, não permite operação comercial (charter) na maior parte dos Estados-membros — para operar comercialmente dentro da UE, a embarcação em regra precisa estar nacionalizada (IVA pago ou devidamente diferido) ou operar sob estruturas específicas de charter que alguns Estados-membros passaram a admitir, com a restrição de que os hóspedes do charter sejam não residentes na UE.","kv":[{"l":"Registros dominantes (40m+)","v":"Cayman Islands, Marshall Islands, Malta"},{"l":"Outros registros relevantes","v":"Bahamas, Isle of Man"},{"l":"Estrutura de titularidade típica","v":"SPV (exempted company) — on-balance ou off-balance sheet via trust"},{"l":"Tributação sobre titularidade (Cayman)","v":"Sem IVA, imposto sucessório ou ganho de capital sobre a propriedade do iate"},{"l":"Admissão Temporária na UE","v":"Até 18 meses, com suspensão de direitos aduaneiros e IVA"},{"l":"Restrição de charter sob Admissão Temporária","v":"Em regra vedado; algumas jurisdições da UE permitem com hóspedes não residentes na UE"}],"requirements":["Constituir SPV na jurisdição de bandeira ou correlata para deter o título de propriedade","Definir estrutura de titularidade (direta pelo beneficiário final vs. trust órfão) conforme objetivo de isolamento de responsabilidade e planejamento sucessório","Avaliar regime de IVA para uso projetado em águas da UE — Admissão Temporária (uso privado, não residente na UE) vs. nacionalização (IVA pago) vs. estrutura de charter comercial","Certificação de segurança e tripulação conforme a Convenção SOLAS/MLC e regras específicas do registro de bandeira para o porte da embarcação","Contratar seguro de casco, responsabilidade civil (P&I) e tripulação compatível com o registro e as águas de operação"],"sections":[{"title":"Charter comercial vs. uso privado como estrutura fiscal","body":"Operar o iate sob estrutura de charter comercial (fretamento a terceiros mediante remuneração, com a embarcação registrada como ativo de uma empresa de charter licenciada) pode viabilizar, em algumas jurisdições da UE, a recuperação de IVA sobre a aquisição e sobre despesas operacionais, além de permitir navegação mais ampla em águas europeias sem as restrições da Admissão Temporária. O contraponto é que a embarcação passa a estar sujeita a regras de licenciamento comercial, tripulação profissional certificada, e o uso privado pelo beneficiário final deve ser tratado como charter a preço de mercado (arm's length) para não descaracterizar o regime — com implicações de compliance fiscal e documentação que devem ser avaliadas caso a caso com aconselhamento local especializado em cada porto de bandeira e em cada Estado-membro de operação."}],"brazilNote":"Uma embarcação de bandeira estrangeira operada por residente fiscal brasileiro está sujeita, para fins de declaração de bens e capitais no exterior ao Banco Central e à Receita Federal, ao mesmo regime aplicável a qualquer participação societária ou ativo detido no exterior, incluindo a SPV proprietária da embarcação. A permanência prolongada em águas brasileiras de embarcação estrangeira sujeita-se a regras específicas de admissão temporária e cabotagem sob jurisdição da Marinha do Brasil e da Receita Federal — ver tópico seguinte para o regime doméstico.","sources":[{"t":"Conyers — What Makes the Cayman Islands an Ideal Jurisdiction for Superyacht Registration","u":"https://www.conyers.com/publications/view/what-makes-the-cayman-islands-an-ideal-jurisdiction-for-superyacht-registration/"},{"t":"Affinity — Why Cayman Islands, Marshall Islands and Malta Dominate 40m+ Superyacht Flag Registration","u":"https://www.affinityco.com/explore/why-the-cayman-islands-marshall-islands-and-malta-dominate-40m-superyacht-flag-registration"},{"t":"Mondaq/BTM Group — Temporary Admission for Yachts in EU Countries","u":"https://www.mondaq.com/italy/sales-taxes-vat-gst/1613190/temporary-admission-for-yachts-in-eu-countries"},{"t":"BTM Group — Temporary Admission (Importation) of Yachts into the EU","u":"https://btmgroupci.com/news/temporary-admission-importation-of-yachts-into-the-eu"}]},{"name":"Registro e Tributação de Embarcações no Brasil","eyebrow":"Regime doméstico","legalBasis":"Lei nº 9.432, de 8 de janeiro de 1997 e Decreto nº 2.256/1997 (Registro Especial Brasileiro); Normas da Autoridade Marítima da Diretoria de Portos e Costas (NORMAM), em especial a NORMAM-211/DPC (embarcações de esporte e/ou recreio); Tribunal Marítimo (registro de propriedade marítima acima de 100 AB); Decreto-Lei nº 37/1966 e Decreto nº 6.759/2009 (Regulamento Aduaneiro)","desc":"A titularidade e a documentação de embarcações no Brasil seguem um sistema dual conduzido pela Marinha do Brasil. Embarcações de esporte e/ou recreio — de natureza não comercial, disciplinadas pela NORMAM-211/DPC — são inscritas junto às Capitanias, Delegacias e Agências (CP/DL/AG) da Diretoria de Portos e Costas, recebendo o Título de Inscrição de Embarcação (TIE), documento com validade de 5 anos sujeito a renovação. Quando a Arqueação Bruta (AB) da embarcação ultrapassa 100, torna-se exigível também o registro de propriedade marítima junto ao Tribunal Marítimo, que emite a Provisão de Registro de Propriedade Marítima (PRPM) — a maior parte dos grandes iates de recreio, dado o porte, se enquadra nessa faixa e está sujeita a ambos os regimes (inscrição na Capitania e registro no Tribunal Marítimo).\n\nO Registro Especial Brasileiro (REB), instituído pela Lei nº 9.432/1997 e regulamentado pelo Decreto nº 2.256/1997, é frequentemente confundido com um regime aplicável a embarcações de recreio, mas não o é: o parágrafo único do art. 1º da Lei nº 9.432/1997 exclui expressamente embarcações de esporte e recreio, turismo, pesca e pesquisa do âmbito do REB, que se destina a embarcações mercantes operadas por empresas brasileiras de navegação. Para o planejamento patrimonial envolvendo iates de recreio, portanto, o REB não é a via aplicável — o regime relevante é o de inscrição/registro descrito acima.\n\nNa importação de embarcações de lazer, a regra geral histórica é a incidência de Imposto de Importação da ordem de 20% sobre o valor pago pelo comprador, com iniciativas recentes do governo federal para desoneração seletiva de determinadas categorias (por exemplo, isenção de II para a aquisição de veleiros e, por portaria de março de 2025, alíquota zero de II para jet-skis, balões e dirigíveis, no âmbito de política de fomento ao turismo náutico). Essas desonerações são setoriais e específicas por categoria de embarcação/NCM, não uma isenção geral para embarcações de lazer — a classificação fiscal correta e a verificação da norma vigente à data da operação são indispensáveis.","kv":[{"l":"Órgão de inscrição","v":"Marinha do Brasil — Capitanias/Delegacias/Agências (DPC)"},{"l":"Documento (embarcação ≤100 AB)","v":"Título de Inscrição de Embarcação (TIE), validade 5 anos"},{"l":"Documento (embarcação >100 AB)","v":"Provisão de Registro de Propriedade Marítima (PRPM) — Tribunal Marítimo"},{"l":"REB aplicável a recreio?","v":"Não — excluído expressamente pelo art. 1º, parágrafo único, da Lei nº 9.432/1997"},{"l":"Norma de recreio","v":"NORMAM-211/DPC"},{"l":"II histórico sobre embarcações de lazer","v":"Da ordem de 20% do valor pago pelo comprador, sujeito a desonerações setoriais específicas"}],"requirements":["Inscrição da embarcação de recreio na Capitania dos Portos, Delegacia ou Agência competente (TIE)","Registro de propriedade no Tribunal Marítimo quando AB > 100","Verificar NCM e norma vigente para determinar alíquota efetiva de II na importação (regras setoriais mudam por portaria)","Avaliar regime de Admissão Temporária junto à Receita Federal para embarcação estrangeira com permanência limitada em águas brasileiras","Vistoria e certificação de segurança conforme categoria e área de navegação definidas pela NORMAM aplicável"],"brazilNote":"Diferentemente das aeronaves, para as quais a matrícula RAB exige propriedade brasileira, o regime de inscrição de embarcações de recreio no Brasil não impede, por si, que a embarcação seja detida por SPV estrangeira operando sob bandeira estrangeira em águas brasileiras sob admissão temporária — mas a operação continuada e habitual no Brasil por longos períodos tende a atrair a exigência de nacionalização e inscrição doméstica, com a consequente sujeição à tributação de importação.","warning":"[VERIFICAR: se e como o IPVA é efetivamente cobrado sobre embarcações de recreio em cada estado — há debate legislativo e divergência entre entes federativos noticiada por fontes de imprensa (CNN Brasil/Sindifisco), mas não há uniformidade nacional confirmada; tratar como questão estadual a verificar caso a caso, nunca citar alíquota genérica.]","sources":[{"t":"Marinha do Brasil — Tribunal Marítimo, REB Embarcação Brasileira","u":"https://www.marinha.mil.br/tm/reb_brasileira"},{"t":"Planalto — Lei nº 9.432, de 8 de janeiro de 1997","u":"https://www.planalto.gov.br/ccivil_03/leis/l9432.htm"},{"t":"Marinha do Brasil (CPAP) — Inscrição de Embarcação de Esporte & Recreio","u":"https://www.marinha.mil.br/cpap/content/inscri%C3%A7%C3%A3o-de-embarca%C3%A7%C3%A3o-de-esporte-recreio"},{"t":"gov.br — Solicitar inscrição, transferência de propriedade e/ou jurisdição de embarcações","u":"https://www.gov.br/pt-br/servicos/solicitar-inscricao-transferencia-de-propriedade-e-ou-jurisdicao-titulos-e-certidoes-de-embarcacoes"}]},{"name":"Obras de Arte como Classe de Ativos em Wealth Planning","eyebrow":"Art wealth management","legalBasis":"Regras de titularidade e sucessão de cada jurisdição de domicílio do colecionador; regime de ITCMD de cada Estado brasileiro (Resolução do Senado Federal nº 9/1992 quanto ao teto de alíquota); regulamentos aduaneiros dos freeports (Genebra, Luxemburgo — Luxembourg High Security Hub, Singapura)","desc":"A arte de alto valor ocupa posição distinta na alocação patrimonial: é um ativo ilíquido, não fungível, de avaliação subjetiva e sujeito a risco de proveniência, mas também um veículo consolidado de diversificação, transmissão intergeracional e, em algumas estruturas, diferimento fiscal. A estruturação de titularidade costuma seguir uma de três vias: propriedade direta pela pessoa física; holding de arte (sociedade ou trust dedicado a deter a coleção, frequentemente na mesma jurisdição da estrutura patrimonial familiar mais ampla); ou fundação/trust com finalidade específica de preservação e eventual doação a instituição cultural.\n\nOs freeports — armazéns alfandegados de alta segurança em Genebra, no Luxemburgo (Luxembourg High Security Hub, sucessor do antigo Luxembourg Freeport) e em Singapura — cumprem função de armazenamento com diferimento de tributos de importação e IVA: enquanto a obra permanece dentro do freeport, é tratada como estando \"em trânsito\" e não ingressou na jurisdição fiscal do país onde o freeport está fisicamente localizado, de modo que a compra, venda e transferência de titularidade podem ocorrer dentro do freeport sem gerar fato gerador de IVA ou direitos de importação — que só incidem quando a obra efetivamente sai do freeport e é desembaraçada. O Geneva Freeport é o maior e mais antigo do gênero, com estimativa de aproximadamente 40% de seu conteúdo composto por obras de arte, avaliado por fontes de mercado em cerca de US$ 100 bilhões [VERIFICAR: valor de mercado agregado da coleção do Geneva Freeport — cifra recorrente em fontes secundárias, sem confirmação em fonte primária/oficial suíça].\n\nA due diligence de proveniência (provenance) é elemento central de qualquer aquisição relevante: verificação da cadeia de titularidade desde a criação da obra, cruzamento com bases de obras furtadas ou de restituição (Art Loss Register e equivalentes), e atenção especial a obras que possam ter circulado em contextos de espoliação (particularmente arte europeia de origem incerta entre 1933-1945) ou de exportação irregular de países de origem. O seguro de obras de arte segue lógica de subscrição especializada (fine art insurance), com apólices de valor agreed ou de mercado, cobertura em trânsito, exibição e armazenamento, e cláusulas específicas para obras em coleções privadas versus obras emprestadas a museus.\n\nNo Brasil, para fins sucessórios, obras de arte integram a base de cálculo do ITCMD (Imposto sobre Transmissão Causa Mortis e Doação), tributo estadual cuja alíquota varia por Estado dentro do teto de 8% fixado pela Resolução do Senado Federal nº 9/1992. A avaliação para fins de inventário e de base de cálculo do imposto normalmente exige laudo de avaliação especializado que comprove o valor de mercado da obra na data do fato gerador, dada a inexistência de tabela de referência oficial para bens dessa natureza — o que torna a avaliação um ponto de atrito recorrente entre contribuinte e fisco estadual.","kv":[{"l":"Estruturas de titularidade comuns","v":"Pessoa física direta / holding de arte / trust ou fundação"},{"l":"Freeports relevantes","v":"Genebra, Luxembourg High Security Hub, Singapura"},{"l":"Mecanismo fiscal do freeport","v":"Diferimento de IVA e direitos de importação até a saída física da obra"},{"l":"ITCMD sobre obras de arte no Brasil","v":"Integra a base de cálculo; alíquota estadual, teto de 8% (Resolução do Senado nº 9/1992)"},{"l":"Avaliação para inventário","v":"Laudo de avaliação especializado (valor de mercado na data do fato gerador)"},{"l":"Due diligence de proveniência","v":"Cadeia de titularidade + consulta a bases de obras furtadas/restituição"}],"requirements":["Documentar a cadeia de proveniência completa da obra antes da aquisição","Consultar bases de dados de obras furtadas/objeto de restituição (Art Loss Register e equivalentes)","Definir estrutura de titularidade (pessoa física, holding, trust) alinhada ao plano sucessório geral da família","Contratar seguro de arte com cobertura específica para trânsito, armazenamento e exibição","Obter laudo de avaliação atualizado periodicamente e, obrigatoriamente, por ocasião de evento sucessório (óbito ou doação) para fins de ITCMD"],"sections":[{"title":"Freeports — o que efetivamente diferem, e o que não fazem","body":"O freeport não é um mecanismo de elisão fiscal permanente: ele diere o fato gerador de IVA/direitos de importação para o momento em que a obra sai da zona alfandegada rumo ao mercado doméstico do país onde o freeport está localizado. Uma obra pode, dentro do freeport, mudar de proprietário diversas vezes sem gerar esses tributos — mas a tributação sobre a renda, sobre o ganho de capital na alienação, e a tributação sucessória do proprietário beneficiário permanecem regidas pela lei de domicílio fiscal desse proprietário, independentemente de onde a obra esteja fisicamente armazenada. O uso de freeports tem sido objeto de escrutínio crescente por reguladores europeus quanto a risco de lavagem de dinheiro e opacidade de titularidade, resultando em exigências mais rígidas de identificação de beneficiário final para acesso e movimentação de obras nesses armazéns nos últimos anos."}],"brazilNote":"A avaliação de obras de arte para fins de ITCMD é fonte recorrente de disputa com o fisco estadual, dada a ausência de tabela de referência oficial — a documentação de laudo técnico independente e atualizado é a principal defesa do espólio/donatário. Coleções relevantes mantidas fisicamente fora do Brasil por residente fiscal brasileiro também devem ser avaliadas quanto à declaração de bens e capitais no exterior ao Banco Central, ainda que a obra em si não gere renda.","warning":"[VERIFICAR: valor de mercado agregado atribuído ao conteúdo do Geneva Freeport (~US$ 100 bilhões) — cifra amplamente repetida em fontes secundárias de mercado, sem confirmação por fonte oficial suíça; usar com ressalva explícita de fonte.]","sources":[{"t":"Wikipedia (referenciando fontes primárias) — Geneva Freeport","u":"https://en.wikipedia.org/wiki/Geneva_Freeport"},{"t":"Wikipedia (referenciando fontes primárias) — Luxembourg High Security Hub","u":"https://en.wikipedia.org/wiki/Luxembourg_High_Security_Hub"},{"t":"Senado Federal — Resolução nº 9, de 1992 (teto de alíquota do ITCMD)","u":"https://www.gov.br/receitafederal/pt-br"}]},{"name":"Importação e Circulação Internacional de Obras de Arte e o Brasil","eyebrow":"Comércio exterior e compliance","legalBasis":"Decreto-Lei nº 37/1966 e Decreto nº 6.759/2009 (Regulamento Aduaneiro — regime de Admissão Temporária); Decreto nº 3.166/1999 (promulgação da Convenção UNIDROIT de 1995 sobre bens culturais furtados ou ilicitamente exportados); Convenção UNESCO de 1970 (meios de proibir e impedir a importação, exportação e transferência de propriedade ilícitas de bens culturais); Lei nº 9.613/1998, art. 9º, XI (Lei de Lavagem de Dinheiro — pessoas obrigadas no comércio de obras de arte e antiguidades); atuação do IPHAN na autorização de saída de bens culturais do território nacional","desc":"A movimentação internacional de obras de arte com destino ou origem no Brasil segue, em regra, o regime de Admissão Temporária previsto no Decreto-Lei nº 37/1966 e regulamentado pelo Decreto nº 6.759/2009 (Regulamento Aduaneiro), que permite a permanência de bens estrangeiros no país por prazo determinado com suspensão total ou parcial dos tributos de importação, mediante Declaração Simplificada de Importação (DSI) e prova do caráter temporário da operação — regime tipicamente utilizado por museus e galerias para exposições internacionais itinerantes (mostras, feiras, bienais). A concessão do regime depende de comprovação de conformidade com eventuais controles administrativos específicos de órgãos culturais e do compromisso de reexportação ou retorno ao país de origem.\n\nO IPHAN (Instituto do Patrimônio Histórico e Artístico Nacional) exerce papel central na saída de bens culturais do Brasil, autorizando ou vedando a exportação temporária ou definitiva conforme a natureza do bem. Há quatro categorias de bens cuja saída definitiva do país é vedada e cuja saída temporária é estritamente controlada: (i) acervos e bens tombados ou registrados pelo IPHAN; (ii) obras de arte e artesanato produzidas ou introduzidas no Brasil até o fim do período monárquico (1889); (iii) objetos de interesse arqueológico ou pré-histórico; e (iv) acervos bibliográficos e documentais compostos por obras brasileiras ou sobre o Brasil publicadas entre os séculos XVI e XIX.\n\nO Brasil é parte da Convenção UNESCO de 1970 sobre os meios de proibir e impedir a importação, exportação e transferência de propriedade ilícitas de bens culturais, e ratificou a Convenção UNIDROIT de 1995 sobre bens culturais furtados ou ilicitamente exportados por meio do Decreto nº 3.166/1999 — o instrumento de adesão foi depositado em 23 de março de 1999, com vigência para o Brasil a partir de 1º de setembro de 1999. Essas convenções, complementares entre si, estabelecem normas mínimas de direito internacional privado e cooperação para restituição de bens culturais furtados ou exportados ilicitamente, relevantes tanto para o colecionador que adquire obra com proveniência internacional quanto para a análise de risco de aquisição de peças de origem não totalmente documentada.\n\nEm termos de compliance contra lavagem de dinheiro, o art. 9º, XI, da Lei nº 9.613/1998 inclui expressamente, entre as pessoas obrigadas a prestar informações ao COAF, aquelas que comercializam joias, pedras e metais preciosos, obras de arte e antiguidades — impondo a esses agentes deveres de identificação de clientes, manutenção de registros e comunicação de operações suspeitas. Internacionalmente, o padrão regulatório vem se intensificando: a União Europeia exige procedimentos de AML de entidades que comercializam arte em valor igual ou superior a €10.000, e nos Estados Unidos o Anti-Money Laundering Act de 2020 estendeu obrigações de AML a negociantes de antiguidades, com projeto de lei adicional (Art Market Integrity Act, apresentado em julho de 2025) propondo estender formalmente essas obrigações a galerias e leiloeiras sob o Bank Secrecy Act — [VERIFICAR: status de aprovação do Art Market Integrity Act, projeto ainda em tramitação no momento da pesquisa].","kv":[{"l":"Regime de importação temporária","v":"Admissão Temporária (DL 37/1966, Decreto 6.759/2009) via DSI"},{"l":"Órgão de controle de saída de bens culturais","v":"IPHAN"},{"l":"Vedação de saída definitiva","v":"Bens tombados; obras até 1889; itens arqueológicos; bibliografia BR séc. XVI-XIX"},{"l":"Convenção UNESCO 1970","v":"Brasil é parte, como Estado de origem/fonte de bens culturais"},{"l":"Convenção UNIDROIT 1995","v":"Ratificada — Decreto nº 3.166/1999, vigente para o Brasil desde 1º/9/1999"},{"l":"AML — Lei 9.613/1998","v":"Art. 9º, XI — comerciantes de arte/antiguidades são pessoas obrigadas perante o COAF"},{"l":"AML — limiar UE","v":"€10.000 por operação em comércio de arte"}],"requirements":["Verificar se a obra a ser exportada do Brasil se enquadra nas categorias de restrição do IPHAN antes de qualquer movimentação internacional","Utilizar regime de Admissão Temporária com DSI para exposições e mostras internacionais itinerantes","Realizar due diligence de proveniência à luz das Convenções UNESCO 1970 e UNIDROIT 1995 antes de aquisição de obra com histórico de circulação internacional","Cumprir deveres de identificação de cliente e origem de recursos como pessoa obrigada (galerista, leiloeiro, negociante) nos termos do art. 9º, XI, da Lei nº 9.613/1998","Manter registro documental de toda transação de alto valor para fins de comunicação ao COAF quando aplicável"],"brazilNote":"A intersecção entre restrição de saída de bens culturais (IPHAN) e a lógica internacional de wealth planning exige atenção redobrada: uma obra de arte brasileira anterior a 1889, ou tombada, não pode ser transferida definitivamente para custódia em freeport ou jurisdição estrangeira como parte de estruturação patrimonial, independentemente da estrutura societária utilizada — a restrição incide sobre o bem, não sobre o veículo de titularidade.","warning":"[VERIFICAR: status legislativo atualizado do Art Market Integrity Act nos EUA (apresentado em julho de 2025) — verificar se foi aprovado, alterado ou arquivado antes de citar como regra vigente.]","sources":[{"t":"Planalto — Decreto nº 3.166, de 14 de setembro de 1999 (UNIDROIT 1995)","u":"https://www.planalto.gov.br/ccivil_03/decreto/d3166.htm"},{"t":"UNESCO — About the 1970 Convention","u":"https://www.unesco.org/en/fight-illicit-trafficking/about"},{"t":"UNIDROIT — 1995 Convention (texto oficial)","u":"https://www.unidroit.org/instruments/cultural-property/1995-convention/"},{"t":"gov.br/museus — Proteção e Circulação de Bens Culturais: Combate ao Tráfico Ilícito","u":"https://www.gov.br/museus/pt-br/centrais-de-conteudo/publicacoes/guias-e-manuais/cartilha-trafico-de-bens-culturais"},{"t":"Money Laundering News — U.S. Senate introduces Art Market Integrity Act","u":"https://www.moneylaunderingnews.com/2025/08/u-s-senate-introduces-act-to-apply-aml-bsa-laws-to-art-dealers-and-auction-houses/"}]},{"name":"Comparativo Estrutural — Aeronave, Embarcação e Obra de Arte","eyebrow":"Síntese comparativa","legalBasis":"Síntese consolidada a partir das normas citadas nos tópicos anteriores desta seção","desc":"As três classes de ativo de alto valor tratadas nesta seção compartilham a lógica de exigir estruturação de titularidade deliberada, mas divergem significativamente quanto à necessidade de veículo societário, ao regime tributário de aquisição e ao tratamento sucessório — o quadro a seguir resume essas diferenças para referência rápida em discussão de estruturação com o cliente.","sections":[{"title":"Necessidade de SPV / veículo de titularidade","body":"<strong>Aeronave:</strong> Uso quase universal de SPV quando registrada em jurisdição internacional (Isle of Man, Cayman, Aruba); no Brasil (RAB), a matrícula exige titularidade direta por pessoa física residente ou pessoa jurídica brasileira, tornando o SPV estrangeiro incompatível com a matrícula nacional.\n\n<strong>Embarcação:</strong> Uso quase universal de SPV nos registros internacionais de bandeira (Cayman, Marshall Islands, Malta); no regime doméstico brasileiro (inscrição/TIE ou PRPM), a titularidade pode ser de pessoa física ou jurídica brasileira, sem a mesma exigência restritiva do RAB para aeronaves.\n\n<strong>Obra de arte:</strong> SPV/holding de arte é comum mas não universal — muitas coleções relevantes permanecem em titularidade pessoal direta; a estrutura societária ou de trust ganha relevância principalmente quando há objetivo de governança familiar sobre a coleção ou plano de doação institucional."},{"title":"Tributação típica na aquisição/importação","body":"<strong>Aeronave (Brasil):</strong> II em alíquota zero para NCM 88.02/8806.10; IPI conforme TIPI vigente (sem isenção geral); redução de IPI para uso em táxi aéreo.\n\n<strong>Embarcação (Brasil):</strong> Historicamente da ordem de 20% de II sobre o valor pago, com desonerações setoriais específicas por categoria (veleiros, jet-skis, balões — por portaria recente) — não há isenção geral para embarcações de lazer.\n\n<strong>Obra de arte:</strong> Sem tributo de importação uniforme aplicável em bloco — depende de classificação e regime (definitiva vs. admissão temporária); freeports permitem diferimento de IVA/direitos de importação enquanto a obra não sai da zona alfandegada, sem eliminar a obrigação, apenas adiando o fato gerador."},{"title":"Custo de manutenção anual","body":"Faixas de referência amplamente utilizadas no mercado, sem fonte regulatória oficial — apresentadas como ordem de grandeza, não como dado fiscal:\n\n<strong>Aeronave executiva:</strong> manutenção, tripulação, hangar, seguro e depreciação operacional tipicamente representam entre 5% e 10% do valor do ativo ao ano, variável por tipo de aeronave e intensidade de uso — [VERIFICAR: faixa percentual específica junto a operador/gestor de aviação executiva antes de uso em material voltado a cliente].\n\n<strong>Yacht de grande porte:</strong> a prática consolidada do setor náutico estima custo operacional anual (tripulação, manutenção, doca, seguro) da ordem de 10% do valor de aquisição do iate — [VERIFICAR: fonte primária/regulatória para esse percentual; é referência de mercado amplamente citada por brokers e gestores de iates, não dado oficial].\n\n<strong>Obra de arte:</strong> custo de manutenção concentra-se em seguro (prêmio tipicamente uma fração pequena do valor segurado ao ano), armazenamento climatizado/freeport quando aplicável, e conservação periódica — ordem de grandeza substancialmente inferior à de aeronaves e embarcações em termos percentuais sobre o valor do ativo."},{"title":"Tratamento sucessório","body":"<strong>Aeronave e embarcação:</strong> quando detidas por SPV estrangeira, a sucessão do beneficiário final tende a ocorrer pela transmissão das quotas/ações da SPV (ou da participação no trust), regida pela lei de sucessão aplicável à estrutura societária/trust — não pelo bem físico diretamente; quando detidas diretamente por pessoa física brasileira (caso comum de matrícula RAB), integram o inventário brasileiro e a base de cálculo do ITCMD do domicílio do <em>de cujus</em> como qualquer outro bem móvel de alto valor, com avaliação técnica específica.\n\n<strong>Obra de arte:</strong> integra o inventário e a base de cálculo do ITCMD no Brasil quando de titularidade direta por residente brasileiro, exigindo laudo de avaliação especializado; quando estruturada via holding, trust ou mantida em freeport no exterior, o tratamento sucessório segue a lei da estrutura societária/trust e a legislação de domicílio fiscal do beneficiário final, com necessidade de declaração de bens e capitais no exterior ao Banco Central pelo residente brasileiro em qualquer caso."}],"kv":[{"l":"SPV — Aeronave internacional","v":"Praticamente universal"},{"l":"SPV — Aeronave RAB (Brasil)","v":"Incompatível — exige titularidade brasileira direta"},{"l":"SPV — Yacht internacional","v":"Praticamente universal"},{"l":"SPV — Yacht Brasil (TIE/PRPM)","v":"Não exigido; titularidade PF ou PJ brasileira admitida"},{"l":"SPV — Obra de arte","v":"Comum, não universal; ganha relevância em governança familiar/doação"},{"l":"II típico — Aeronave (NCM 88.02)","v":"Alíquota zero"},{"l":"II típico — Embarcação de lazer","v":"Ordem de 20%, com exceções setoriais"},{"l":"Sucessão — todos os três","v":"Via bem físico (ITCMD direto) ou via participação societária/trust, conforme estrutura"}],"sources":[{"t":"ANAC — Legislação (Lei nº 7.565/1986)","u":"https://www.anac.gov.br/assuntos/legislacao/legislacao-1/leis/lei-no-7-565-de-19-12-1986"},{"t":"Marinha do Brasil — Tribunal Marítimo","u":"https://www.marinha.mil.br/tm/reb_brasileira"},{"t":"UNIDROIT — Cape Town Convention","u":"https://www.unidroit.org/instruments/security-interests/cape-town-convention/"}]}]};
const SCE = {"sectionId":"sce","sectionTitle":"Providências — SCE IED e SCE Crédito","sectionSubtitle":"As obrigações declaratórias de capital estrangeiro perante o Banco Central — módulos SCE-IED e SCE-Crédito do novo Sistema Eletrônico de Declarações — e sua interface com estruturas patrimoniais internacionais de residentes brasileiros.","topics":[{"name":"Panorama do registro de capital estrangeiro no Brasil","eyebrow":"Base legal e evolução da plataforma","legalBasis":"Lei 4.131/1962; Lei 11.371/2006; Lei 14.286/2021 (Marco Legal do Mercado de Câmbio e Capitais Internacionais); Resoluções BCB 277 a 281, de 31/12/2022","desc":"A obrigação de declarar capital estrangeiro ao Banco Central do Brasil tem origem na <strong>Lei 4.131/1962</strong>, que disciplina a aplicação de capital estrangeiro no país e criou a exigência de registro como condição para a remessa de lucros, dividendos, juros e o repatriamento do capital via mercado de câmbio. A <strong>Lei 11.371/2006</strong> deu o salto tecnológico: substituiu o registro em papel por um <em>Registro Declaratório Eletrônico</em> (RDE), transferindo ao próprio declarante — pessoa física ou jurídica receptora do capital — a responsabilidade de manter as informações atualizadas diretamente no sistema do Bacen, sob sua responsabilidade legal, sem análise prévia do Banco Central a cada lançamento.\n\nDurante quase duas décadas esse arcabouço operou sob a marca RDE, com módulos como RDE-IED (investimento direto) e RDE-ROF (operações financeiras/crédito externo), regulamentados pela Circular 3.689/2013 e por sucessivas normas do Conselho Monetário Nacional. Esse desenho foi substituído a partir da entrada em vigor da <strong>Lei 14.286/2021</strong> — o novo Marco Legal do Mercado de Câmbio e Capitais Internacionais —, regulamentada pelo Bacen por meio de um pacote de resoluções editadas em 31/12/2022 (Resoluções BCB 277 a 281). A Resolução BCB 278/2022 é a que rege especificamente as operações de crédito externo e de investimento estrangeiro direto e a prestação de informações correspondente ao Bacen.\n\nNa prática operacional, os antigos módulos RDE-IED e RDE-ROF foram renomeados e reestruturados como <strong>SCE-IED</strong> e <strong>SCE-Crédito</strong>, dentro do que o mercado e a própria documentação técnica do Bacen já tratam como Sistema de Prestação de Informações de Capitais Estrangeiros (SCE). A transição ocorreu de forma escalonada a partir de 2023. [VERIFICAR: a data exata de desativação do ambiente RDE legado e de migração compulsória para o SCE, módulo a módulo, diretamente na página \"Capitais Estrangeiros\" ou nos comunicados de sistema do Bacen — fontes secundárias convergem em 2023, mas o cronograma oficial completo (e eventual continuidade de registros abertos no RDE antigo) deve ser confirmado em bcb.gov.br antes de orientar um caso concreto].\n\nEm linha de princípio, ambos os módulos hoje cobertos por este material — SCE-IED e SCE-Crédito — tratam de capital estrangeiro <em>ingressando</em> no Brasil (investidor não residente aportando em empresa brasileira, ou credor não residente concedendo crédito a um residente). O caso inverso — residente brasileiro com investimento no exterior — é disciplinado por regime declaratório distinto, a Declaração de Capitais Brasileiros no Exterior (CBE), que não integra o SCE-IED nem o SCE-Crédito e é tratada em separado neste material.","kv":[{"l":"Norma fundadora","v":"Lei 4.131/1962"},{"l":"Digitalização do registro","v":"Lei 11.371/2006 (RDE)"},{"l":"Marco atual","v":"Lei 14.286/2021 + Res. BCB 278/2022"},{"l":"Plataforma vigente","v":"SCE (sucessora do RDE-IED/RDE-ROF)"},{"l":"Responsável pelo registro","v":"Declarante residente (regra geral)"}],"requirements":["Identificar se a operação é de investimento direto (participação societária) ou de crédito externo (empréstimo/financiamento) antes de escolher o módulo","Confirmar se a empresa ou pessoa física já possui histórico de registro no RDE legado a migrar para o SCE","D
