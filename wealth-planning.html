ntes de cada extensão"},{"step":"Pedido de extensão","detail":"Desde <strong>1 de novembro de 2024</strong>, o pedido pode ser apresentado com até <strong>3 meses (90 dias) de antecedência</strong> do vencimento — antes eram 4 semanas.","timing":"Até 90 dias antes"}],"costs":[{"item":"Taxa de aplicação","value":"HKD 600","note":"Nova taxa introduzida em 26/fev/2025; antes não havia taxa de aplicação"},{"item":"Taxa de emissão de visto — validade acima de 180 dias","value":"HKD 1.300","note":"A taxa anterior era fixa em HKD 230"},{"item":"Taxa de emissão — validade de até 180 dias","value":"HKD 600"},{"item":"Extensão ou mudança de condições","value":"HKD 600 por pedido"},{"item":"Cartão de identidade de Hong Kong (HKID)","value":"Historicamente gratuito","note":"A confirmar"}],"sections":[{"title":"A lista de universidades elegíveis — atualização de 2026","body":"<strong>Anúncio governamental em 28 de dezembro de 2025; lista em vigor desde 1 de janeiro de 2026.</strong>\n\n<strong>200 instituições</strong> na lista de 2026, contra 199 em 2025.\n\n<strong>Metodologia:</strong> consolidação dos rankings <strong>Times Higher Education, QS, U.S. News e Shanghai ARWU</strong>, mantendo <strong>sub-listas dedicadas</strong> para hotelaria (<em>hospitality management</em>), arte e design, e as 20 melhores universidades do Continente.\n\n<strong>Alterações de 2026:</strong> inclusão da <strong>IE University</strong> (Espanha); <strong>remoção</strong> de École Polytechnique, Université Grenoble Alpes, Université Sorbonne Paris Cité (USPC) e University of Freiburg.\n\n<strong>Item de verificação indispensável para o cliente brasileiro:</strong> a <strong>presença de universidades brasileiras na lista não pôde ser confirmada</strong>. USP e UNICAMP historicamente figuram em rankings globais próximos das faixas de corte. <strong>Verificar obrigatoriamente a lista nominal em immd.gov.hk/eng/services/visas/TTPS.html antes de aconselhar cliente brasileiro sobre as Categorias B e C.</strong>\n\nPara a <strong>Categoria A</strong>, a lista é irrelevante — o critério é exclusivamente de renda (HKD 2.500.000 no ano anterior), o que a torna a via mais direta para o público de family office."},{"title":"Extensão — o que muda no primeiro pedido","body":"Ao término da estada inicial, o titular deve apresentar ao Immigration Department <strong>informação e documentação concretas</strong> comprovando que:\n· <strong>assumiu emprego em Hong Kong com renda estável</strong>; <strong>OU</strong>\n· <strong>constituiu ou ingressou em um negócio em Hong Kong</strong>.\n\nO emprego deve ser de <strong>nível compatível com portador de diploma superior</strong> e a remuneração deve estar <strong>em nível de mercado</strong>.\n\n<strong>Duração da extensão:</strong> normalmente <strong>36 meses adicionais</strong>.\n\n<strong>Via «top-tier employment stream» (2 + 6):</strong> quem tenha permanecido em Hong Kong sob o TTPS por <strong>2 anos ou mais</strong> <strong>e</strong> tenha rendimento tributável para fins de Salaries Tax de <strong>HKD 2.000.000 ou mais</strong> no ano de avaliação anterior obtém extensão normalmente concedida por <strong>6 anos</strong>.\n\n<strong>Novo requisito de conformidade — desde 30 de janeiro de 2026:</strong> todos os titulares devem completar a <strong>«Exclusive Survey»</strong> online <strong>antes</strong> de submeter qualquer pedido de extensão. É etapa <strong>bloqueante</strong>."},{"title":"Regras de família","body":"<strong>Cônjuge</strong> — incluindo, por política do Immigration Department, parceiro de união civil ou parceria registada de mesmo sexo, desde a decisão <em>QT v. Director of Immigration</em> (2018). <em>A confirmar.</em>\n\n<strong>Filhos solteiros dependentes menores de 18 anos.</strong>\n\nDependentes recebem <strong>visto de dependente com estada coincidente</strong> com a do requerente principal.\n\nDependentes têm, em regra, <strong>direito irrestrito de trabalhar e estudar</strong> em Hong Kong — o <em>dependant visa</em> de Hong Kong não impõe restrição de emprego, ao contrário de vários outros regimes asiáticos. <em>A confirmar.</em>\n\n<strong>Pais e filhos com 18 anos ou mais não são elegíveis</strong> como dependentes.\n\n<strong>O tempo de residência dos dependentes também conta</strong> para o cômputo dos 7 anos rumo ao Right of Abode."},{"title":"Como se sai do regime","body":"<strong>Não requerimento de extensão</strong> → a estada expira; o titular deve deixar Hong Kong.\n\n<strong>Indeferimento da extensão</strong> por não comprovação de emprego ou negócio → mesma consequência.\n\n<strong>Não há penalidade nem imposto de saída</strong> em Hong Kong; apenas o <em>tax clearance</em> de Salaries Tax, se houver emprego local (formulário IR56G, com notificação do empregador ao IRD com 1 mês de antecedência e retenção de pagamentos até a liberação)."}],"brazilNote":"O TTPS é, para o brasileiro, a rota de <strong>menor custo e maior simplicidade</strong> entre as de Hong Kong — <strong>não exige investimento nem oferta de emprego prévia</strong>.\n\n<strong>Categoria A</strong> é a via mais direta para o público de family office: basta comprovar renda anual de <strong>HKD 2.500.000</strong> (aproximadamente USD 320.000) no ano anterior, sem depender de lista de universidades. Concede <strong>36 meses</strong> de estada inicial.\n\n<strong>Categorias B e C</strong> dependem de a universidade brasileira constar da lista agregada de 200 instituições — <strong>ponto que deve ser verificado nominalmente antes de qualquer orientação</strong>.\n\n<strong>Atenção ao requisito de extensão:</strong> ao fim da estada inicial, é necessário comprovar <strong>emprego em Hong Kong com renda estável, ou negócio constituído em Hong Kong</strong>. O TTPS não é rota de residência passiva — exige integração económica efetiva no segundo ciclo.\n\n<strong>Posição fiscal:</strong> valem integralmente as observações do dossiê fiscal — Hong Kong é jurisdição de tributação favorecida para o Brasil, e a residência migratória não encerra a residência fiscal brasileira sem <strong>CSDP</strong> e <strong>DSDP</strong>.","sources":[{"t":"Immigration Department · Top Talent Pass Scheme","u":"https://www.immd.gov.hk/eng/services/visas/TTPS.html"},{"t":"Immigration Department · TTPS FAQ","u":"https://www.immd.gov.hk/eng/faq/TTPS.html"},{"t":"Hong Kong Talent Engage · Lista agregada de universidades elegíveis atualizada","u":"https://www.hkengage.gov.hk/en/media/news/top-talent-pass-scheme-aggregate-list-of-eligible-universities-updated"},{"t":"Gov.HK · Atualização anual da lista agregada de universidades (28/dez/2025)","u":"https://www.info.gov.hk/gia/general/202512/28/P2025122400232.htm"},{"t":"Gov.HK · Medidas para aprimorar o TTPS e o QMAS (1/nov/2024)","u":"https://www.info.gov.hk/gia/general/202411/01/P2024110100288.htm"},{"t":"VisaHQ · Novo passo de conformidade para titulares de TTPS (6/fev/2026)","u":"https://www.visahq.com/news/2026-02-06/hk/new-compliance-step-for-top-talent-pass-holders-mandatory-online-survey-before-visa-extension/"}]},{"name":"QMAS e demais esquemas de admissão","status":"changed","legalBasis":"Esquemas administrativos do <strong>Immigration Department</strong>, sob a Immigration Ordinance, Cap. 115. QMAS lançado em <strong>2006</strong>; reforma do General Points Test com efeito a partir de <strong>1 de novembro de 2024</strong>.","desc":"<strong>Quality Migrant Admission Scheme (QMAS)</strong> — esquema de admissão baseado em mérito, que <strong>não exige oferta de emprego prévia</strong>.\n\n<strong>Reforma confirmada, com efeito desde 1 de novembro de 2024:</strong> o Governo reformou o <strong>General Points Test (GPT)</strong>, adotando critérios «mais objetivos e claros» e simplificando o processo de aplicação e seleção.\n\n<strong>Alterações confirmadas:</strong>\n1. <strong>Eliminação da cota anual sob o GPT reformado</strong> — «<em>There will be no annual quotas under the enhanced GPT</em>». <strong>Correção a materiais em circulação:</strong> a cota do QMAS <strong>não «retornou»</strong> — ela foi <strong>abolida</strong> para o GPT. <em>A confirmar se a cota permanece aplicável ao Achievement-based Points Test.</em>\n2. <strong>Substituição do sistema de pontuação item a item por um questionário de avaliação</strong> — sistema binário de verdadeiro/falso.\n3. <strong>12 critérios de avaliação sob 6 aspectos:</strong> idade; qualificação académica; proficiência linguística; experiência profissional; <strong>renda anual</strong> (novo); e <strong>titularidade de negócio</strong> (novo).\n4. <strong>Remoção do aspecto «background familiar»</strong>, substituído pelos dois novos critérios.\n5. <strong>Limiar de submissão:</strong> o candidato pode submeter o pedido se atender a <strong>pelo menos 6 dos 12 critérios</strong>.\n6. A seleção permanece <strong>baseada em mérito</strong>, com preferência aos candidatos que satisfaçam mais critérios.\n\n<em>Item de verificação obrigatória: o conteúdo específico de cada um dos 12 critérios — limiares de idade, nível de diploma, valor de renda anual mínima, percentual de participação societária — não pôde ser apurado. Verificar em immd.gov.hk e no formulário do questionário.</em>","kv":[{"l":"QMAS — cota anual (GPT)","v":"Abolida em 1/nov/2024"},{"l":"QMAS — critérios","v":"12, sob 6 aspectos"},{"l":"QMAS — limiar de submissão","v":"Mínimo 6 dos 12 critérios"},{"l":"QMAS — oferta de emprego","v":"Não exigida"},{"l":"QMAS — taxa","v":"HKD 600"},{"l":"GEP — público","v":"Estrangeiros e empreendedores"},{"l":"ASMTP — público","v":"Residentes do Continente"},{"l":"IANG — benefício","v":"12 meses sem condições"},{"l":"TechTAS — mecânica","v":"Cota alocada à empresa"}],"requirements":["<strong>QMAS — pré-requisitos obrigatórios</strong> (ambas as vias): idade de 18 anos ou mais; capacidade de sustentar-se e aos dependentes sem recurso a fundos públicos; sem antecedentes criminais nem registo adverso de imigração; bom caráter; domínio de <strong>chinês (cantonês ou mandarim) ou inglês</strong> em nível suficiente; diploma de bacharelado de instituição reconhecida (ou qualificação profissional equivalente comprovada). <em>Conteúdo a confirmar em immd.gov.hk.</em>","<strong>QMAS — General Points Test:</strong> atender a <strong>pelo menos 6 dos 12 critérios</strong> do questionário de avaliação, distribuídos por idade, qualificação académica, proficiência linguística, experiência profissional, renda anual e titularidade de negócio.","<strong>QMAS — Achievement-based Points Test:</strong> via alternativa destinada a indivíduos com <strong>realização excecional</strong> — prémio de reconhecimento internacional (Nobel, medalha olímpica, prémio nacional ou internacional de destaque) ou contribuição significativa e reconhecida ao seu campo. <em>Pontuação de tudo-ou-nada; detalhes a confirmar.</em>","<strong>QMAS — não elegíveis:</strong> nacionais de Afeganistão, Cuba, Coreia do Norte, Laos, Nepal e Vietnã.","<strong>QMAS — não é exigida oferta de emprego prévia.</strong>"],"process":[{"step":"Autoavaliação pelo questionário","detail":"Preenchimento do questionário de autoavaliação dos 12 critérios. É necessário atingir <strong>6 ou mais</strong> para submeter.","timing":"—"},{"step":"Submissão do pedido","detail":"Submissão ao Immigration Department, com documentos comprobatórios e taxa de <strong>HKD 600</strong>.","timing":"—"},{"step":"Avaliação e seleção","detail":"Seleção baseada em mérito pelo Immigration Department, com aconselhamento do <strong>Advisory Committee on Admission of Quality Migrants and Professionals</strong>. <em>Historicamente, processos de vários meses.</em>","timing":"Meses (a confirmar)"},{"step":"Approval-in-Principle","detail":"Concedido o AIP, o candidato deve <strong>comparecer pessoalmente em Hong Kong</strong> para a etapa seguinte. <em>A confirmar.</em>","timing":"—"},{"step":"Formal approval e emissão do visto","detail":"Aprovação formal e concessão do visto. <em>Estada inicial historicamente de 24 meses, com padrão 2-3-3; verificar se foi alterada para 36 meses.</em>","timing":"A confirmar"}],"costs":[{"item":"QMAS — taxa de aplicação","value":"HKD 600"},{"item":"Taxa de emissão de visto — acima de 180 dias","value":"HKD 1.300"},{"item":"Taxa de emissão — até 180 dias","value":"HKD 600"},{"item":"Extensão ou mudança de condições","value":"HKD 600 por pedido"}],"sections":[{"title":"General Employment Policy (GEP)","body":"<strong>Público:</strong> profissionais estrangeiros (exceto residentes do Continente) e <strong>empreendedores</strong>.\n\n<strong>Duas vertentes:</strong>\n· <em>employment as professionals</em> — exige <strong>oferta de emprego</strong> de empregador em Hong Kong, com função que não possa ser prontamente preenchida localmente, remuneração de mercado e qualificação compatível;\n· <em>entry for investment</em> — estabelecer ou ingressar em negócio em Hong Kong, com plano de negócios e contribuição económica substancial.\n\n<strong>Estada inicial:</strong> historicamente 24 meses. <em>Verificar se foi elevada a 36 meses.</em>\n<strong>Padrão de extensão:</strong> 2-3-3 anos (ou 3-3).\n<strong>Sem cota.</strong>\n\n<em>Toda esta seção deve ser verificada em immd.gov.hk.</em>"},{"title":"ASMTP, IANG e TechTAS","body":"<strong>Admission Scheme for Mainland Talents and Professionals (ASMTP)</strong> — para <strong>residentes do Continente</strong>. Critérios substancialmente idênticos ao GEP: oferta de emprego, qualificação e remuneração de mercado. <strong>Sem cota.</strong>\n\n<strong>Immigration Arrangements for Non-local Graduates (IANG)</strong> — para não locais que obtiveram <strong>grau de bacharel ou superior</strong> em curso presencial de tempo integral em instituição de ensino superior de Hong Kong.\n<strong>Benefício:</strong> <strong>12 meses de estada sem condições</strong> (<em>unconditional stay</em>) para procurar emprego, <strong>sem necessidade de oferta prévia</strong> — pedido dentro de 6 meses da graduação, para <em>non-local fresh graduates</em>.\n<em>Extensão para 24 meses anunciada no Policy Address de 2023/2024, e ampliação-piloto para graduados de campi de universidades de Hong Kong na Grande Baía (GBA) — ambas a verificar.</em>\n\n<strong>Technology Talent Admission Scheme (TechTAS)</strong> — administrado pela <strong>Innovation and Technology Commission (ITC)</strong> em conjunto com o Immigration Department.\n<strong>Mecânica:</strong> a empresa de tecnologia elegível obtém <strong>cota</strong> junto ao ITC (<em>quota allotment</em>) e então patrocina profissionais de tecnologia sob um <em>fast-track</em> de imigração.\n<strong>Áreas cobertas:</strong> IA, biotecnologia, cibersegurança, cidade inteligente, fintech, ciência de materiais, robótica, dados.\n<strong>Requisito de treinamento local</strong> vinculado à cota, com contratação de residentes locais. <em>Verificar se ainda vigente.</em>\n\n<em>Existem ainda o Technology Talent Pass, o Admission Scheme for the Second Generation of Chinese Hong Kong Permanent Residents (ASSG) e o esquema para cônjuges e dependentes.</em>"}],"brazilNote":"Para o brasileiro, o <strong>QMAS</strong> é alternativa ao TTPS quando não se satisfaz o critério de renda da Categoria A nem a lista de universidades das Categorias B e C. A <strong>abolição da cota anual</strong> sob o GPT reformado, desde 1/nov/2024, removeu o principal gargalo histórico do esquema.\n\nO <strong>GEP</strong> exige oferta de emprego ou plano de negócios com contribuição económica substancial — é a via para quem já tem empregador ou pretende operar negócio em Hong Kong.\n\nO <strong>ASMTP</strong> não se aplica a brasileiros (é para residentes do Continente). O <strong>IANG</strong> aplica-se apenas a quem se graduou em instituição de Hong Kong. O <strong>TechTAS</strong> depende de a empresa contratante obter cota junto ao ITC.\n\n<strong>Em todos os casos</strong>, a residência migratória não encerra a residência fiscal brasileira — <strong>CSDP</strong> e <strong>DSDP</strong> permanecem indispensáveis, e a classificação de Hong Kong como jurisdição de tributação favorecida continua a produzir os efeitos descritos no dossiê fiscal.","sources":[{"t":"Immigration Department · QMAS FAQ","u":"https://www.immd.gov.hk/eng/faq/QMAS.html"},{"t":"Immigration Department · Esquemas de admissão de talentos, profissionais e empreendedores","u":"https://www.immd.gov.hk/eng/useful_information/admission-schemes-talents-professionals-entrepreneurs.html"},{"t":"news.gov.hk · Talent and migration plans refined (1/nov/2024)","u":"https://www.news.gov.hk/eng/2024/11/20241101/20241101_125039_861.html"},{"t":"Fragomen · Hong Kong — atualizações do TTPS e do QMAS","u":"https://www.fragomen.com/insights/hong-kong-sar-key-updates-for-top-talent-pass-scheme-and-quality-migrant-scheme-introduced.html"}]},{"name":"Right of Abode, nacionalidade e o passaporte da RAEHK","status":"risk","legalBasis":"<strong>Basic Law da RAEHK, art. 24</strong> — define as categorias de residentes permanentes. <strong>Immigration Ordinance, Cap. 115, Schedule 1</strong> — implementação, incluindo o parágrafo 7 (perda do status). Nacionalidade: <strong>Nationality Law of the People's Republic of China (1980)</strong>, aplicada em Hong Kong desde 1/jul/1997 conforme o Anexo III da Basic Law e a Explicação do Comité Permanente da Assembleia Popular Nacional de 15 de maio de 1996.","desc":"<strong>Aquisição do Right of Abode por pessoa NÃO de nacionalidade chinesa</strong> — o caso do brasileiro:\n· ter entrado em Hong Kong com <strong>visto ou entry permit válido</strong> (TTPS, QMAS, New CIES, GEP);\n· ter <strong>residido ordinariamente (<em>ordinarily resided</em>) em Hong Kong por período contínuo de não menos de 7 anos</strong>;\n· ter tomado Hong Kong como seu <strong>lugar de residência permanente</strong> — declaração juramentada, avaliando fatores como habitação habitual em Hong Kong, presença dos membros principais da família, ocupação razoável, e pagamento de impostos conforme a lei;\n· estar em Hong Kong <strong>imediatamente antes</strong> do pedido.\n\n<strong>Ponto favorável confirmado:</strong> «<strong>não é necessário estar fisicamente presente em Hong Kong durante os 7 anos inteiros; a lei apenas exige que a pessoa tenha sido <em>ordinarily resident</em> em Hong Kong durante esse período</strong>». O Director of Immigration exerce <strong>discricionariedade</strong> sobre o <em>Ordinary Residence Factor</em>, considerando a razão, a duração e a frequência de qualquer ausência, e se a pessoa tem residência habitual em Hong Kong.\n\n<strong>Implicação prática:</strong> ausências não descaracterizam automaticamente a residência ordinária, mas há <strong>risco discricionário concreto</strong>. <strong>Não existe uma «regra de X dias» objetiva publicada.</strong>","kv":[{"l":"Right of Abode","v":"7 anos de residência ordinária"},{"l":"Presença física integral","v":"Não exigida"},{"l":"Regra numérica de dias","v":"Não publicada"},{"l":"Perda do status (não chinês)","v":"36 meses de ausência contínua"},{"l":"Discricionariedade na perda","v":"Nenhuma"},{"l":"Passaporte da RAEHK","v":"Exige nacionalidade chinesa"},{"l":"Dupla nacionalidade chinesa","v":"Não admitida"},{"l":"Right to land (após perda)","v":"Estada incondicional"},{"l":"Documento do HKPR não chinês","v":"HKID permanente"}],"requirements":["Ter entrado em Hong Kong com <strong>visto ou entry permit válido</strong>.","Ter <strong>residido ordinariamente em Hong Kong por período contínuo de não menos de 7 anos</strong>.","Ter tomado Hong Kong como seu <strong>lugar de residência permanente</strong> — declaração juramentada, com avaliação de habitação habitual, presença da família, ocupação razoável e pagamento de impostos.","Estar em Hong Kong <strong>imediatamente antes</strong> do pedido de status de residente permanente. <em>A confirmar.</em>","<strong>O tempo de residência dos dependentes também conta</strong> para o próprio cômputo de 7 anos de cada um deles."],"sections":[{"title":"A regra dos 36 meses — perda automática e sem discricionariedade","body":"<strong>Immigration Ordinance, Schedule 1, parágrafo 7:</strong> um residente permanente da RAEHK que <strong>NÃO seja de nacionalidade chinesa</strong> <strong>PERDERÁ o seu status de HKPR</strong> se tiver estado ausente de Hong Kong por <strong>período contínuo de não menos de 36 meses</strong>, contado desde que deixou de ser <em>ordinarily resident</em> em Hong Kong.\n\n<strong>O Director of Immigration NÃO TEM PODER DISCRICIONÁRIO</strong> para estender o período de 36 meses de ausência nem para dispensar o cumprimento por circunstâncias especiais ou imprevistas.\n\n<strong>Consequência crítica para o brasileiro:</strong> o status de residente permanente de Hong Kong obtido por um brasileiro que permanece brasileiro <strong>NÃO é vitalício e NÃO é incondicional</strong>. É preciso <strong>retornar a Hong Kong antes de completar 36 meses ininterruptos de ausência</strong>, sob pena de perda automática.\n\n<strong>«Right to land» — a rede de proteção:</strong> ao perder o status de HKPR pela regra dos 36 meses, o não chinês <strong>adquire automaticamente o <em>right to land</em></strong>, que confere <strong>estada incondicional</strong> (<em>unconditional stay</em>) — pode residir, trabalhar e estudar em Hong Kong sem restrição e <strong>não pode ser deportado</strong> —, mas <strong>não vota</strong> e <strong>não tem passaporte da RAEHK</strong>.\n<em>Item de verificação prioritária: confirmar a existência e o conteúdo do right to land em immd.gov.hk/eng/services/roa/loss.html. Esta distinção é de importância central para o cliente brasileiro.</em>"},{"title":"Hong Kong não concede cidadania — e a China não admite dupla nacionalidade","body":"<strong>Não existe «cidadania de Hong Kong».</strong> Hong Kong é Região Administrativa Especial da República Popular da China. Existem apenas dois conceitos:\n· <strong>Residência permanente (Right of Abode)</strong> — status de imigração, acessível ao estrangeiro após 7 anos;\n· <strong>Nacionalidade chinesa</strong> — regida pela Nationality Law da RPC (1980).\n\n<strong>O passaporte da RAEHK exige nacionalidade chinesa.</strong> Somente <strong>cidadãos chineses</strong> que sejam residentes permanentes de Hong Kong podem obter o <em>HKSAR Passport</em>. Um brasileiro com Right of Abode, mas sem nacionalidade chinesa, <strong>não tem direito ao passaporte da RAEHK</strong> — viaja com o passaporte brasileiro, portando o <strong>HKID permanente</strong> como prova de residência.\n\n<strong>A China não admite dupla nacionalidade.</strong> O <strong>art. 3.º</strong> da Nationality Law dispõe que a RPC <strong>não reconhece dupla nacionalidade</strong> para nenhum cidadão chinês. O <strong>art. 9.º</strong> dispõe que o cidadão chinês que se estabelece no exterior e adquire voluntariamente nacionalidade estrangeira <strong>perde automaticamente</strong> a nacionalidade chinesa.\n\n<strong>Naturalização como cidadão chinês em Hong Kong:</strong> é juridicamente possível (art. 7.º da Nationality Law — parentes próximos chineses, estabelecimento em território chinês, ou «outras razões legítimas»), mediante requerimento ao Immigration Department, que age como autoridade delegada do Ministério da Segurança Pública da RPC.\n\n<strong>CONSEQUÊNCIA CONCRETA — advertência de máxima relevância:</strong> para obter o passaporte da RAEHK, o brasileiro precisaria <strong>naturalizar-se cidadão chinês</strong>. E a naturalização como cidadão chinês exige, na prática administrativa, a <strong>renúncia à nacionalidade estrangeira anterior</strong>.\n\nDo lado brasileiro, a <strong>EC 131/2023</strong> alterou o art. 12, §4.º, II da Constituição, permitindo expressamente a manutenção da nacionalidade brasileira em caso de aquisição voluntária de outra, salvo pedido expresso do interessado. <em>Confirmar o texto vigente.</em> <strong>Mesmo assim, do lado chinês, a RPC exigirá a renúncia</strong> — de modo que o problema prático subsiste independentemente da posição brasileira.\n\n<em>Toda esta seção deve ser verificada em immd.gov.hk/eng/services/chinese_nationality/index.html e no texto da Nationality Law.</em>"},{"title":"O desenho recomendável para o cliente brasileiro","body":"Na prática, o desenho usual é:\n\n· obter o <strong>Right of Abode</strong> após 7 anos → <strong>HKID permanente</strong> (cartão com o símbolo «***» e o código «A»);\n· <strong>manter exclusivamente a nacionalidade brasileira</strong> e viajar com passaporte brasileiro;\n· solicitar o <strong>Hong Kong Document of Identity for Visa Purposes (HKDI)</strong> apenas se apátrida ou impossibilitado de obter passaporte nacional <em>(a confirmar)</em>;\n· <strong>gerir ativamente a regra dos 36 meses</strong> — nunca completar 36 meses ininterruptos fora de Hong Kong;\n· ter ciência de que, mesmo perdendo o HKPR, retém o <strong><em>right to land</em></strong> (estada incondicional) <em>(a confirmar)</em>.\n\n<strong>Direitos do HKPR não chinês:</strong> residir, trabalhar e estudar sem restrição; não pode ser deportado nem ter a entrada recusada; direito de votar e de ser eleito em determinadas circunscrições funcionais, com restrições; acesso a serviços públicos, hospitais públicos e habitação pública em condições de residente. <strong>Não obtém passaporte da RAEHK</strong> nem acesso automático ao regime de isenção de visto do passaporte da RAEHK. <em>A confirmar.</em>"}],"brazilNote":"<strong>Duas assimetrias definem a posição do brasileiro em Hong Kong:</strong>\n\n1. <strong>O Right of Abode não é vitalício.</strong> A regra dos 36 meses de ausência contínua produz perda automática, sem qualquer discricionariedade do Director of Immigration. Quem obtém o status precisa <strong>gerir ativamente o calendário de retornos</strong> — não há dispensa por circunstância excecional.\n\n2. <strong>O passaporte da RAEHK é inacessível sem naturalização chinesa</strong>, e a China não admite dupla nacionalidade. Para o brasileiro, o Right of Abode é um <strong>status de residência</strong>, não um segundo passaporte.\n\n<strong>Do lado sucessório e fiscal:</strong>\n· <strong>Hong Kong não cobra nada</strong> — Estate Duty abolido desde 11/fev/2006 e sem imposto sobre doações;\n· <strong>ITCMD brasileiro:</strong> ativos mantidos em Hong Kong por residente fiscal brasileiro que venha a falecer, ou por ele doados, estão potencialmente sujeitos ao ITCMD estadual sob a regra transitória do art. 16 do ADCT (EC 132/2023). O STF, no Tema 825 (RE 851.108, 2021), decidiu que os Estados não podem cobrar sem lei complementar federal; a EC 132/2023 estabeleceu regra transitória, mas subsistem controvérsias sobre autoaplicabilidade e sobre a necessidade de lei estadual nova, com observância de anterioridade. <em>Verificar o status do PLP 108/2024 e a jurisprudência atual.</em>\n· se o titular <strong>já for não residente</strong> e o herdeiro ou donatário <strong>também for não residente</strong>, a competência tende a não se firmar em nenhum Estado brasileiro — <strong>mas isso depende de o rompimento da residência ter sido efetivo e documentado</strong> (CSDP e DSDP).","warning":"<strong>Gerir a regra dos 36 meses é obrigação permanente</strong>, não formalidade. O Director of Immigration <strong>não tem poder discricionário</strong> para relevar a ausência contínua de 36 meses — a perda do Right of Abode é automática.\n\n<strong>O passaporte da RAEHK não é uma opção realista para o brasileiro:</strong> exigiria naturalização como cidadão chinês, e a China exige renúncia à nacionalidade anterior. Materiais que apresentem Hong Kong como via para «segunda cidadania» estão incorretos — Hong Kong oferece <strong>residência permanente</strong>, não cidadania.","sources":[{"t":"Immigration Department · Elegibilidade para o Right of Abode na RAEHK","u":"https://www.immd.gov.hk/eng/services/roa/eligible.html"},{"t":"Immigration Department · Perda do status de residente permanente","u":"https://www.immd.gov.hk/eng/services/roa/loss.html"},{"t":"Immigration Department · Right of Abode FAQ","u":"https://www.immd.gov.hk/eng/faq/faqroa.html"},{"t":"Gov.HK · Resposta do Immigration Department sobre a regra dos 36 meses (29/mar/2022)","u":"https://www.info.gov.hk/gia/general/202203/29/P2022032900506.htm"},{"t":"Gov.HK · LCQ16 — residentes permanentes de Hong Kong não chineses (1/set/2021)","u":"https://www.info.gov.hk/gia/general/202109/01/P2021090100418.htm"},{"t":"CLIC · Residência de 7 anos","u":"https://www.clic.org.hk/en/topics/immigration/hk_permanent_residence/q1"}]}]}},"COUNTRY_ORDER":["ch","it","pt","es","gr","gb","ae","us","uy","hk"]};

  {id:'regimes', num:'04', title:'Regimes Especiais', short:'Regimes', data:()=>REGIMES,
    blurb:'Regimes fiscais especiais e programas imigratórios em 10 jurisdições estratégicas.'},
  {id:'sce', num:'05', title:'Providências — SCE', short:'SCE', data:()=>SCE,
    blurb:'Declarações obrigatórias ao Banco Central: SCE-IED e SCE-Crédito.'},
];

const SC = {ok:'s-ok',changed:'s-changed',ext:'s-ext',new:'s-new',risk:'s-risk'};
const StatusLabel = {ok:'Mantido',changed:'Alterado',ext:'Extinto',new:'Novo',risk:'Atenção'};

/* ════════════════════ HELPERS ════════════════════ */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s){ return esc(s).replace(/"/g,'&quot;'); }
function rt(text){
  if(!text) return '';
  const withBreaks = String(text).replace(/\n/g,'<br/>');
  if(window.DOMPurify){
    return window.DOMPurify.sanitize(withBreaks, {ALLOWED_TAGS:['strong','em','br'], ALLOWED_ATTR:[]});
  }
  return withBreaks;
}
function pt(n, singular, plural){ return `${n} ${n===1?singular:plural}`; }
const CARET = '<svg class="rg-acc-caret" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"></polyline></svg>';
const EXTLINK = '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>';

function accordion(title, meta, bodyHtml){
  return `<details class="rg-block"><summary><span class="rg-block-title">${CARET}${title}</span>${meta?`<span class="rg-acc-meta">${meta}</span>`:''}</summary><div class="rg-block-content">${bodyHtml}</div></details>`;
}

/* Generic topic card (Sociedades / Sucessório / Ativos / SCE) */
function topicCardHtml(t, idx){
  let html = `<article class="regime fadein" style="animation-delay:${(idx*0.06).toFixed(2)}s">`;
  html += `<div class="regime-top"><span class="regime-name">${esc(t.name)}</span>`;
  if(t.eyebrow) html += `<span class="regime-status s-eyebrow">${esc(t.eyebrow)}</span>`;
  html += `</div>`;
  if(t.legalBasis) html += `<div class="regime-legal"><span class="rg-legal-label">Base legal</span> ${rt(t.legalBasis)}</div>`;
  html += `<div class="regime-desc">${rt(t.desc)}</div>`;
  if(t.kv && t.kv.length){
    html += `<div class="regime-grid">` + t.kv.map(kv=>`<div class="kv"><div class="kv-l">${esc(kv.l)}</div><div class="kv-v">${esc(kv.v)}</div></div>`).join('') + `</div>`;
  }
  if(t.warning) html += `<div class="warn-box"><div class="l">— Atenção / Risco</div><div class="t">${rt(t.warning)}</div></div>`;
  if(t.requirements && t.requirements.length){
    html += accordion('Requisitos de elegibilidade', pt(t.requirements.length,'item','itens'),
      `<ul class="rg-checklist">${t.requirements.map(r=>`<li>${rt(r)}</li>`).join('')}</ul>`);
  }
  if(t.process && t.process.length){
    html += accordion('Processo, passo a passo', pt(t.process.length,'etapa','etapas'),
      `<ol class="rg-steps">${t.process.map(s=>`<li><div class="rg-step-head"><span class="rg-step-name">${esc(s.step)}</span>${s.timing?`<span class="rg-step-timing">${esc(s.timing)}</span>`:''}</div><div class="rg-step-detail">${rt(s.detail)}</div></li>`).join('')}</ol>`);
  }
  if(t.costs && t.costs.length){
    html += accordion('Custos e valores', pt(t.costs.length,'item','itens'),
      `<div class="rg-costs">${t.costs.map(c=>`<div class="rg-cost-row"><div class="rg-cost-item">${esc(c.item)}</div><div class="rg-cost-value">${esc(c.value)}</div>${c.note?`<div class="rg-cost-note">${esc(c.note)}</div>`:''}</div>`).join('')}</div>`);
  }
  (t.sections||[]).forEach(s=>{
    html += accordion(esc(s.title), '', `<div class="rg-block-body">${rt(s.body)}</div>`);
  });
  if(t.impact) html += accordion('Impacto HNWI', '', `<div class="impact-box"><div class="t">${rt(t.impact)}</div></div>`);
  if(t.brazilNote) html += accordion('Interação com o Brasil', '', `<div class="brazil-box"><div class="t">${rt(t.brazilNote)}</div></div>`);
  if(t.sources && t.sources.length){
    html += accordion('Fontes', pt(t.sources.length,'link','links'),
      `<div class="src-row">${t.sources.map(s=>`<a class="src-link" href="${escAttr(s.u)}" target="_blank" rel="noopener noreferrer">${EXTLINK} ${esc(s.t)}</a>`).join('')}</div>`);
  }
  html += `</article>`;
  return html;
}

  if(r.legalBasis) html += `<div class="regime-legal"><span class="rg-legal-label">Base legal</span> ${rt(r.legalBasis)}</div>`;

  if(r.kv && r.kv.length){

  }
  if(r.warning) html += `<div class="warn-box"><div class="l">— Atenção / Risco</div><div class="t">${rt(r.warning)}</div></div>`;

    html += accordion('Requisitos de elegibilidade', pt(r.requirements.length,'item','itens'),

  if(r.process && r.process.length){

  }
  if(r.costs && r.costs.length){
    html += accordion('Custos e valores', pt(r.costs.length,'item','itens'),

  }
  (r.sections||[]).forEach(s=>{

  });
  if(r.impact) html += accordion('Impacto HNWI', '', `<div class="impact-box"><div class="t">${rt(r.impact)}</div></div>`);
  if(r.brazilNote) html += accordion('Interação com o Brasil', '', `<div class="brazil-box"><div class="t">${rt(r.brazilNote)}</div></div>`);

  }
  html += `</article>`;
  return html;
}

/* ════════════════════ RENDERERS ════════════════════ */
function renderHome(){
  const html = `
  <div class="hero">
    <div class="hero-eyebrow">Edição <span id="hero-edition"></span> · Compêndio de Wealth Planning</div>
    <h1 class="hero-title serif">Estruturação patrimonial e <em>sucessória</em> internacional: sociedades, veículos sucessórios, ativos de alto valor, regimes fiscais e providências regulatórias.</h1>
    <p class="hero-sub">Material de consulta técnica para planejamento patrimonial de indivíduos de altíssimo patrimônio (HNWIs), reunindo estruturas societárias offshore, instrumentos sucessórios, classes de ativos de alto valor agregado, regimes fiscais/imigratórios especiais e as declarações regulatórias brasileiras associadas a essas estruturas.</p>
    <div class="hero-meta">
      ${SECTIONS.map(s=>`<div class="hero-stat"><div class="num"><em>${s.num}</em></div><div class="lbl">${esc(s.short)}</div></div>`).join('')}
    </div>
  </div>
  <div class="toc">
    <div class="toc-grid">
      ${SECTIONS.map(s=>`<a class="toc-card" href="#${s.id}">
        <div class="n">— ${s.num}</div>
        <div class="t serif">${esc(s.title)}</div>
        <div class="d">${esc(s.blurb)}</div>
        <div class="cnt">${topicCount(s)}</div>
      </a>`).join('')}
    </div>
  </div>`;
  return html;
}

function topicCount(s){
  if(s.id === 'regimes'){
    const d = s.data();
    const n = (d.COUNTRY_ORDER||[]).length;
    return `${n} jurisdições`;
  }
  const d = s.data();
  const n = (d.topics||[]).length;
  return pt(n, 'tópico', 'tópicos');
}

function renderTopicSection(s){
  const d = s.data();
  const topics = d.topics || [];
  return `
  <div class="hero">
    <div class="hero-eyebrow">— ${s.num} · Wealth Planning</div>
    <h1 class="hero-title serif" style="font-size:44px">${esc(d.sectionTitle||s.title)}</h1>
    <p class="hero-sub">${esc(d.sectionSubtitle||'')}</p>
  </div>
  <div class="section" style="padding-top:8px">
    <div class="topics-col">
      ${topics.length ? topics.map((t,i)=>topicCardHtml(t,i)).join('') : `<p style="color:var(--ink-soft);padding:24px 0">Conteúdo em preparação.</p>`}
    </div>
  </div>`;
}

/* ════════════════════ ROUTER ════════════════════ */
function buildNav(){
  const nav = document.getElementById('secnav');
  let html = `<a class="sec-tab home" href="#">Visão<br/>Geral</a>`;
  html += SECTIONS.map(s=>`<a class="sec-tab" data-id="${s.id}" href="#${s.id}"><span class="n">— ${s.num}</span><span class="t">${esc(s.title)}</span></a>`).join('');
  nav.innerHTML = html;
}

function updateNavActive(hash){
  const root = hash.split('-')[0] || '';
  document.querySelectorAll('.sec-tab').forEach(el=>{
    const id = el.getAttribute('data-id');
    el.classList.toggle('active', id ? id===root : hash==='');
  });
}

function route(){
  const hash = location.hash.replace('#','');
  const app = document.getElementById('app');
  updateNavActive(hash);
  if(!hash){ app.innerHTML = renderHome(); }
  else if(hash === 'regimes'){ app.innerHTML = renderRegimesOverview(); }
  else if(hash.startsWith('regimes-')){ app.innerHTML = renderCountryDossier(hash.slice('regimes-'.length)); }
  else {
    const s = SECTIONS.find(x=>x.id===hash);
    app.innerHTML = s ? renderTopicSection(s) : renderHome();
  }
  window.scrollTo({top:0, behavior:'instant'});
}

document.addEventListener('DOMContentLoaded', function(){
  const now = new Date();
  const months = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const editionStr = `${months[now.getMonth()]} · ${now.getFullYear()}`;
  document.getElementById('edition-label').textContent = editionStr;
  const heroEd = document.getElementById('hero-edition');
  if(heroEd) heroEd.textContent = editionStr;
  document.getElementById('footer-year').textContent = now.getFullYear();
  buildNav();
  route();
});
window.addEventListener('hashchange', route);
</script>
