\n· <strong>IGA FATCA (Modelo 1)</strong> — assinado em 23/set/2014, promulgado pelo <strong>Decreto n.º 8.506, de 24 de agosto de 2015</strong> — troca automática de informações de contas financeiras\n· <strong>Acordo de Previdência Social</strong> — Decreto n.º 9.422/2018, em vigor desde 1/out/2018\n· <strong>Convenção de dupla tributação da renda: NÃO EXISTE</strong>\n· <strong>Tratado de estate ou gift tax: NÃO EXISTE</strong>\n\n<strong>Nenhum desses instrumentos substitui uma convenção de dupla tributação.</strong> O TIEA e o IGA são de cooperação <strong>informacional</strong>; o acordo previdenciário trata de <strong>contribuições sociais</strong>, não de imposto de renda.\n\n<strong>CRS × FATCA — a assimetria.</strong> <strong>Os Estados Unidos NÃO aderiram ao Common Reporting Standard.</strong> Optaram por manter o FATCA (IRC §§1471 a 1474, do HIRE Act de 2010) como regime próprio, aplicado por IGAs bilaterais, e não assinaram o MCAA/CRS — ao qual mais de 120 jurisdições aderiram, <strong>o Brasil incluído</strong>.\n· <strong>O que o Brasil envia aos EUA:</strong> contas financeiras mantidas no Brasil por <em>US persons</em> e por entidades brasileiras com <em>substantial U.S. owners</em> — saldo, receitas brutas, produto de alienações, identificação do titular e do <strong>beneficiário final</strong>.\n· <strong>O que os EUA enviam ao Brasil:</strong> juros de depósito pagos a residentes do Brasil (Reg. §1.6049-8) e dividendos e outros rendimentos sujeitos a retenção reportados em Form 1042-S. <strong>Não incluem, em regra:</strong> saldos de conta; produto de alienações (<em>gross proceeds</em>); nem identificação do beneficiário final de entidades — o <em>look-through</em> para <em>controlling persons</em> de sociedades, trusts e LLCs americanas. <em>O escopo exato do fluxo IRS → RFB deve ser verificado nos Anexos I e II do IGA (Decreto 8.506/2015).</em>\n· No texto do IGA, «<strong>o Governo dos Estados Unidos reconhece a necessidade de alcançar nível equivalente de troca automática de informações com o Brasil</strong>» — formulação de <strong>compromisso político</strong>, não de obrigação exigível de reciprocidade plena.\n· O <strong>Corporate Transparency Act</strong> (31 U.S.C. §5336) criou registo de <em>beneficial ownership</em> junto ao FinCEN, mas é registo <strong>doméstico de aplicação da lei</strong>, não instrumento de troca automática tributária — e em <strong>março de 2025 o FinCEN publicou regra interina restringindo a exigência às <em>foreign reporting companies</em></strong>, dispensando as empresas domésticas americanas. <em>Status corrente a verificar.</em>\n\n<strong>Isso não altera a obrigação legal de declarar.</strong> O residente fiscal brasileiro está obrigado, independentemente da troca de informações, a declarar bens no exterior na DIRPF; apresentar a <strong>CBE</strong> ao Banco Central; e tributar os rendimentos sob a <strong>Lei 14.754/2023</strong> — <strong>15%</strong> sobre aplicações financeiras no exterior e sobre lucros de entidades controladas, estas apuradas em 31 de dezembro, <strong>independentemente de distribuição</strong>, quando a entidade esteja em jurisdição de tributação favorecida <strong>ou</strong> tenha renda ativa própria inferior a 60%. Trusts seguem regime específico de transparência.","warning":"<strong>O green card é uma decisão fiscal, não apenas migratória.</strong> Ele submete a pessoa à tributação sobre <strong>renda mundial</strong> e ao pacote declaratório completo — FBAR, 8938, 5471, 3520, 8621 —, com penalidades que partem de USD 10.000 por formulário e chegam a 50% do saldo no caso de FBAR <em>willful</em>.\n\n<strong>O portfólio brasileiro padrão entra no regime PFIC no momento da residência</strong>, e o §1291 alcança o <strong>período inteiro de detenção</strong>, inclusive anos anteriores. A eleição QEF, que seria a saída, é <strong>indisponível de fato</strong>, porque fundos brasileiros não emitem o <em>PFIC Annual Information Statement</em>.\n\n<strong>E a saída tem preço.</strong> O relógio de 8 anos do <em>long-term resident</em> conta <strong>frações de ano como ano cheio</strong>; o limiar de patrimônio de <strong>USD 2.000.000</strong> não é indexado desde 2008; e o <strong>§2801</strong> alcança, a 40% e <strong>sem limite de tempo</strong>, qualquer <em>US person</em> que venha a receber doação ou herança de um <em>covered expatriate</em> — atingindo a geração seguinte.\n\n<strong>Todo o planejamento eficaz é pré-imigratório</strong>, e a janela fecha na <em>residency starting date</em>.","sources":[{"t":"IRS · Report of Foreign Bank and Financial Accounts (FBAR)","u":"https://www.irs.gov/businesses/small-businesses-self-employed/report-of-foreign-bank-and-financial-accounts-fbar"},{"t":"IRS · Form 8938 — Statement of Specified Foreign Financial Assets","u":"https://www.irs.gov/forms-pubs/about-form-8938"},{"t":"IRS · Form 8621 — Information Return by a Shareholder of a PFIC","u":"https://www.irs.gov/forms-pubs/about-form-8621"},{"t":"IRS · Expatriation tax","u":"https://www.irs.gov/individuals/international-taxpayers/expatriation-tax"},{"t":"IRS · Form 8854 — Initial and Annual Expatriation Statement","u":"https://www.irs.gov/forms-pubs/about-form-8854"},{"t":"Receita Federal · Acordo Multilateral sobre o intercâmbio automático de informações (MCAA-CRS)","u":"https://www.gov.br/receitafederal/pt-br/acesso-a-informacao/legislacao/acordos-internacionais/acordos-para-intercambio-de-informacoes-relativas-a-tributos/convencao-multilateral-sobre-assistencia-mutua-administrativa-em-materia-tributaria/acordo-multilateral-entre-autoridades-competentes-sobre-o-intercambio-automatico-de-informacoes-financeiras-mcaa-crs"},{"t":"Receita Federal · Perguntas e respostas — offshores, Lei 14.754 e IN RFB 2.180 (PDF)","u":"https://www.gov.br/receitafederal/pt-br/assuntos/noticias/2024/abril/receita-federal-e-secretaria-da-reforma-tributaria-lancam-atualizacao-do-perguntas-e-respostas-sobre-tributacao-de-rendimentos-no-exterior/perguntas-e-respostas-offshores-lei-14-754-e-in-rfb-2-180.pdf"},{"t":"Receita Federal · Comunicação de Saída Definitiva do País","u":"https://www.gov.br/receitafederal/pt-br/assuntos/meu-imposto-de-renda/preenchimento/dsdp"}]}],"visa":[{"name":"EB-5 Immigrant Investor Program","status":"changed","legalBasis":"<strong>INA §203(b)(5)</strong> — 8 U.S.C. §1153(b)(5). Criado pelo <strong>Immigration Act of 1990</strong>, Pub. L. 101-649, §121. <strong>EB-5 Reform and Integrity Act of 2022 (RIA)</strong> — Division BB do Consolidated Appropriations Act, 2022, <strong>Pub. L. 117-103</strong>, sancionado em <strong>15 de março de 2022</strong>. <strong>8 C.F.R. §204.6</strong> (petição) e <strong>§216.6</strong> (remoção de condições). <strong>INA §216A</strong> — residência condicional. Formulários: I-526, I-526E, I-829, I-485, I-956, I-956F e I-956G.","desc":"<strong>Valores de investimento vigentes:</strong>\n· <strong>TEA rural</strong> → <strong>USD 800.000</strong>\n· <strong>TEA de alta taxa de desemprego (HUA)</strong> → <strong>USD 800.000</strong>\n· <strong>Projeto de infraestrutura</strong> → <strong>USD 800.000</strong>\n· <strong>Padrão (fora de TEA)</strong> → <strong>USD 1.050.000</strong>\n\n<strong>Reajuste automático programado.</strong> O RIA determina ajuste inflacionário <strong>a cada 5 anos, a partir de 1 de janeiro de 2027</strong>, pelo <strong>CPI-U</strong> acumulado desde a base de dezembro de 2021, com arredondamento para baixo ao múltiplo de USD 50.000; o valor de TEA e infraestrutura é fixado em <strong>75% do valor padrão ajustado</strong>.\n<em>Dados de base: CPI-U de dez/2021 = 278,802; jan/2026 = 325,252 — variação acumulada de cerca de 16,7%. Projeções de mercado para 1/jan/2027: TEA entre USD 900.000 e USD 937.500; padrão entre USD 1.200.000 e USD 1.250.000. São projeções de fontes privadas do setor — o valor oficial dependerá do CPI-U até a data-base e de publicação pelo USCIS.</em>\n\n<strong>Reserved visas (set-asides), INA §203(b)(5)(B):</strong> do total anual de EB-5 (7,1% do teto de imigração baseada em emprego), <strong>20% rural</strong>, <strong>10% HUA</strong>, <strong>2% infraestrutura</strong> e <strong>68% unreserved</strong>. Vistos reservados não utilizados transitam para o ano seguinte <strong>dentro da mesma categoria</strong>; se não usados no segundo ano, migram para <em>unreserved</em>.\n\n<strong>Visa Bulletin — situação do Brasil (agosto e setembro de 2026):</strong> <strong>EB-5 unreserved CURRENT</strong> para «All Chargeability Areas Except Those Listed», faixa que <strong>inclui o Brasil</strong>. <strong>Todas as categorias reservadas CURRENT para todos os países.</strong> China (mainland) com <em>final action date</em> de 22/set/2016 (cerca de 9,5 anos de backlog) e Índia em 1/mai/2022 (cerca de 4 anos).\n<strong>Advertência do Departamento de Estado:</strong> o aumento de demanda na EB-5 Unreserved pode exigir <strong>retrogressão ou tornar a categoria indisponível antes do fim do FY-2026</strong> (30/set/2026). <em>Verificar o Visa Bulletin do mês antes de qualquer protocolo — travel.state.gov.</em>","kv":[{"l":"TEA rural / HUA / infraestrutura","v":"USD 800.000"},{"l":"Padrão (fora de TEA)","v":"USD 1.050.000"},{"l":"Próximo reajuste","v":"1 de janeiro de 2027"},{"l":"Empregos exigidos","v":"10 full-time"},{"l":"Sustainment period","v":"2 anos"},{"l":"Set-aside rural","v":"20% da cota anual"},{"l":"Set-aside HUA","v":"10%"},{"l":"Set-aside infraestrutura","v":"2%"},{"l":"Brasil no Visa Bulletin","v":"Current (ago/2026)"},{"l":"Green card inicial","v":"Condicional, 2 anos"},{"l":"Concurrent filing","v":"Permitido se já nos EUA"},{"l":"Regional Center Program","v":"Autorizado até 30/set/2027"}],"requirements":["Investimento de <strong>USD 800.000</strong> (TEA, rural ou infraestrutura) ou <strong>USD 1.050.000</strong> (padrão) em <em>new commercial enterprise</em> (NCE) constituída após <strong>29/nov/1990</strong>, ou reestruturada ou expandida.","<strong>Capital <em>at risk</em></strong> — sem garantia de retorno, sem acordo de recompra, sem arranjo de <em>redemption</em> garantida.","<strong>Comprovação lícita da origem dos fundos</strong> (<em>source of funds</em>) e do <strong>caminho dos fundos</strong> (<em>path of funds</em>). O RIA ampliou a exigência: documentação de <strong>7 anos</strong> de declarações de imposto e de transações, com rastreamento de cada transferência internacional. <strong>Fundos emprestados são admitidos se garantidos por ativos de propriedade do investidor</strong> — mudança do RIA.","<strong>Criação ou preservação de 10 empregos full-time</strong> (35 horas ou mais por semana) para <em>qualifying U.S. workers</em> — cidadãos, LPRs, asilados e refugiados. <strong>Não conta o próprio investidor nem cônjuge e filhos.</strong>","<strong>Investimento direto:</strong> apenas empregos <strong>diretos</strong> da NCE. <strong>Via regional center:</strong> admite empregos <strong>indiretos e induzidos</strong> por modelagem econométrica (RIMS II, IMPLAN); o RIA limitou os <strong>empregos de construção com duração inferior a 2 anos a no máximo 75%</strong> do total computado.","<strong>Sustainment period de 2 anos</strong> — o RIA e a política do USCIS (2023/2024) fixam a manutenção do capital em risco por <strong>2 anos a contar da colocação integral do capital à disposição da NCE ou JCE</strong>, e não mais pelo período de residência condicional.","<strong>Envolvimento na gestão</strong> — como <em>limited partner</em> ou membro de LLC com direitos estatutários, o requisito é satisfeito; <strong>não exige gestão diária</strong>.","Admissibilidade migratória geral (INA §212).","<strong>Definição de TEA (pós-RIA):</strong> <strong>rural</strong> — fora de qualquer <em>Metropolitan Statistical Area</em> <strong>e</strong> fora do limite territorial de cidade ou vila com <strong>20.000 habitantes ou mais</strong> pelo censo decenal mais recente; <strong>HUA</strong> — <em>census tract</em>, ou conjunto de <em>tracts</em> diretamente contíguos, com taxa de desemprego de <strong>pelo menos 150% da média nacional</strong>; <strong>infraestrutura</strong> — projeto administrado por agência governamental como financiamento de obra pública.","<strong>Autoridade exclusiva do USCIS</strong> para designar TEA — o RIA <strong>eliminou</strong> a designação por autoridades estaduais. A designação vale por <strong>2 anos</strong>, renovável."],"process":[{"step":"Seleção de projeto e due diligence","detail":"Verificação do regional center — I-956F aprovado, histórico e estrutura. Análise do PPM e da modelagem de empregos.","timing":"1–3 meses"},{"step":"Subscrição e transferência do capital","detail":"Assinatura da <em>subscription</em> e do PPM; transferência do capital, em <em>escrow</em> ou direta.","timing":"1–2 meses"},{"step":"Montagem do dossiê de source of funds","detail":"Documentação de 7 anos de declarações e transações, com rastreamento de cada transferência internacional — a etapa mais trabalhosa para o investidor brasileiro.","timing":"2–4 meses"},{"step":"Protocolo do I-526E ou I-526","detail":"<strong>I-526E</strong> para investimento via regional center; <strong>I-526</strong> para investimento direto.","timing":"—"},{"step":"Adjudicação do I-526E","detail":"Prazos por categoria (dados de março de 2026): <strong>rural: 11,5 a 36,5 meses</strong>; <strong>HUA: 17 a 52 meses</strong>; <strong>unreserved: 30,5 a 61 meses</strong>. Média geral reportada em agosto de 2026: cerca de <strong>35 meses</strong> para o I-526E e 34 meses para o I-526.","timing":"11,5–61 meses"},{"step":"Concurrent filing do I-485 — inovação do RIA","detail":"Se já estiver nos EUA em status válido e a categoria estiver <strong>current</strong>, o I-485 pode ser protocolado <strong>junto</strong> com o I-526E. <strong>Vantagem operacional decisiva:</strong> o investidor obtém <strong>EAD</strong> (I-765) e <strong>Advance Parole</strong> (I-131) em prazo tipicamente muito inferior à adjudicação do I-526E, com autorização de trabalho e viagem enquanto aguarda.","timing":"Simultâneo ao I-526E"},{"step":"Alternativa — processamento consular","detail":"NVC → <strong>DS-260</strong> → entrevista no Consulado (Rio de Janeiro ou São Paulo). NVC: 2 a 6 meses; entrevista variável.","timing":"2–6 meses no NVC"},{"step":"Green card condicional de 2 anos","detail":"Emissão do visto CR/IR ou aprovação do I-485. Prazo do I-485 em categoria EB: <strong>9 a 42,5 meses</strong>.","timing":"9–42,5 meses"},{"step":"Protocolo do I-829","detail":"Nos <strong>90 dias anteriores</strong> ao segundo aniversário do green card condicional. <em>Adjudicação de vários anos; prazos correntes a verificar em egov.uscis.gov/processing-times.</em>","timing":"90 dias antes do 2.º aniversário"},{"step":"Green card permanente e cidadania","detail":"Green card de 10 anos após o I-829. Elegibilidade ao N-400 <strong>5 anos a contar da data de admissão como residente condicional</strong>.","timing":"5 anos até o N-400"}],"costs":[{"item":"Investimento — TEA, rural ou infraestrutura","value":"USD 800.000","note":"Reajuste previsto para 1/jan/2027; capital at risk, com possibilidade de retorno"},{"item":"Investimento — padrão","value":"USD 1.050.000"},{"item":"Taxa administrativa do regional center","value":"USD 50.000–70.000","note":"Não reembolsável; varia por RC e estrutura"},{"item":"Form I-526E — filing fee","value":"USD 3.675","note":"Restaurado por decisão judicial (Moody et al. v. Mayorkas), que anulou o aumento de abril/2024 para USD 11.160 por ausência do fee study exigido pelo RIA"},{"item":"EB-5 Integrity Fund fee","value":"USD 1.000","note":"Por petição, para investimentos de USD 800.000 ou mais"},{"item":"Form I-485 (adjustment of status)","value":"USD 1.440","note":"Por requerente"},{"item":"Taxa consular DS-260 / NVC","value":"USD 345","note":"Por requerente, se via consular — a confirmar em travel.state.gov"},{"item":"USCIS Immigrant Fee","value":"USD 235","note":"Após emissão do visto, antes da entrada — a confirmar"},{"item":"Exame médico (panel physician, Brasil)","value":"USD 200–400"},{"item":"Form I-829","value":"USD 3.750","note":"Fee restaurado; algumas fontes ainda indicam USD 9.525 (tabela de abril/2024) — divergência a confirmar no Form G-1055"},{"item":"Honorários advocatícios de imigração","value":"USD 25.000–60.000","note":"Mercado, não oficial"},{"item":"Assessoria de source of funds e contabilidade","value":"USD 5.000–20.000","note":"Mercado"},{"item":"Premium processing","value":"Indisponível","note":"Para I-526E e I-829 — a confirmar"}],"sections":[{"title":"Regras de família","body":"<strong>INA §203(d):</strong> o <strong>cônjuge</strong> e os <strong>filhos solteiros menores de 21 anos</strong> (<em>derivative beneficiaries</em>) obtêm green card com o investidor principal, <strong>sem investimento adicional</strong> — apenas as taxas por requerente (I-485 ou DS-260, exame médico, <em>immigrant fee</em>).\n\n<strong>Child Status Protection Act (CSPA)</strong>, Pub. L. 107-208: protege o filho que completa 21 anos durante a adjudicação — a idade «congela» durante o período de pendência do I-526 ou I-526E. Requer <em>«sought to acquire»</em> dentro de 1 ano da disponibilidade do visto.\n\n<strong>Filhos casados e filhos com 21 anos ou mais não são derivativos</strong> — precisam de petição própria.\n\nFilhos adotados e enteados seguem as regras do INA §101(b)(1) — no caso do enteado, casamento antes dos 18 anos do menor.\n\n<em>Nota: há debate sobre se o RIA alterou a forma como os derivativos contam contra a cota anual de vistos — item a verificar.</em>"},{"title":"Riscos documentados","body":"· A <strong>autorização do Regional Center Program</strong> foi estendida pelo RIA até <strong>30 de setembro de 2027</strong>. Investimentos diretos (I-526) <strong>não dependem</strong> dessa autorização.\n· <strong>Capital «at risk» significa possibilidade real de perda</strong> — não há garantia de devolução; historicamente houve projetos com perda total.\n· <strong>I-829 negado</strong> implica <strong>perda do green card condicional</strong>, mesmo com o capital investido.\n· O Federal Register de <strong>2 de julho de 2026</strong> publicou norma sobre <strong>revogação automática de petições</strong> em contexto de integridade do programa. <em>Conteúdo específico a verificar — federalregister.gov, documento 2026-13392.</em>\n· <strong>Volatilidade das taxas:</strong> em outubro de 2025 o DHS publicou proposta de novo <em>fee rule</em>; em novembro de 2025 decisão judicial restaurou as taxas anteriores a abril de 2024; há regra proposta pendente. <strong>As taxas devem ser conferidas no Form G-1055 na data do protocolo.</strong>"}],"brazilNote":"<strong>O Brasil está CURRENT em EB-5 unreserved e em todas as categorias reservadas</strong> no Visa Bulletin de agosto de 2026 — situação materialmente diferente da de China e Índia, que enfrentam <em>backlogs</em> de 9,5 e 4 anos na categoria <em>unreserved</em>.\n\n<strong>Mas há advertência formal do Departamento de Estado</strong> de que o aumento de demanda pode exigir <strong>retrogressão ou indisponibilidade da EB-5 Unreserved antes do fim do ano fiscal de 2026</strong> (30 de setembro). O reinício do ano fiscal em 1 de outubro tipicamente restaura a disponibilidade. <strong>As categorias reservadas — rural, HUA e infraestrutura — permanecem current para todos os países</strong>, e são a via de menor exposição a esse risco.\n\n<strong>Consequência fiscal decisiva:</strong> o EB-5 concede <strong>green card</strong> — e, com ele, o <strong>status de US person</strong> descrito no dossiê fiscal: tributação sobre renda mundial; herança e doação sobre patrimônio mundial; pacote declaratório completo (FBAR, 8938, 5471, 3520, 8621); e <strong>regime PFIC sobre todo o portfólio brasileiro de fundos</strong>, alcançando inclusive o período de detenção anterior à residência.\n\n<strong>O planejamento pré-imigratório precisa ser concluído antes da <em>residency starting date</em></strong> — que, no EB-5, é o primeiro dia de presença física nos EUA na condição de LPR. Liquidação de PFICs, step-up de base, <em>check-the-box</em> e estruturação de trust devem estar feitos antes disso.\n\n<strong>E a saída tem preço:</strong> o relógio de <strong>8 anos</strong> do <em>long-term resident</em> começa no primeiro ano-calendário de posse do green card, contando frações de ano como ano cheio. Um green card obtido em dezembro de 2026 e abandonado em janeiro de 2033 já perfaz 8 anos-calendário — acionando o exit tax do §877A se o patrimônio mundial atingir USD 2.000.000.\n\n<strong>Reajuste de 1/jan/2027:</strong> quem pretende entrar pelo valor de USD 800.000 tem uma janela até 31 de dezembro de 2026. Projeções de mercado apontam para USD 900.000 a 937.500 a partir de 2027 — mas o valor oficial dependerá do CPI-U apurado e de publicação pelo USCIS.","sources":[{"t":"USCIS · EB-5 Immigrant Investor Program","u":"https://www.uscis.gov/working-in-the-united-states/permanent-workers/eb-5-immigrant-investor-program"},{"t":"USCIS · EB-5 Reform and Integrity Act of 2022","u":"https://www.uscis.gov/working-in-the-united-states/permanent-workers/eb-5-immigrant-investor-program/eb-5-reform-and-integrity-act-of-2022"},{"t":"Cornell LII · 8 U.S. Code §1153(b)(5)","u":"https://www.law.cornell.edu/uscode/text/8/1153"},{"t":"Departamento de Estado · Visa Bulletin","u":"https://travel.state.gov/content/travel/en/legal/visa-law0/visa-bulletin.html"},{"t":"USCIS · Form G-1055 — Fee Schedule","u":"https://www.uscis.gov/g-1055"},{"t":"USCIS · Check case processing times","u":"https://egov.uscis.gov/processing-times/"}]},{"name":"E-2 Treaty Investor — o Brasil NÃO é país-tratado","status":"ext","legalBasis":"<strong>INA §101(a)(15)(E)(ii)</strong> — 8 U.S.C. §1101(a)(15)(E)(ii). <strong>8 C.F.R. §214.2(e)</strong>. <strong>9 FAM 402.9</strong> (Foreign Affairs Manual). Lista oficial de países-tratado: Departamento de Estado, <em>Treaty Countries</em>. Restrição: <strong>AMIGOS Act</strong> — <em>Advancing Mutual Interests and Growing Our Success Act</em> —, incorporado ao <strong>National Defense Authorization Act for FY2023, Pub. L. 117-263</strong>, sancionado em dezembro de 2022.","desc":"<strong>O visto E-2 depende da existência de tratado bilateral de comércio e navegação, ou de investimento (BIT), em vigor com os Estados Unidos, que contemple a categoria E.</strong>\n\n<strong>O Brasil está entre as maiores economias excluídas da lista de países-tratado E-2.</strong> As fontes consultadas são convergentes e explícitas. <strong>Nacionais brasileiros não podem requerer o E-2 com base na nacionalidade brasileira.</strong>\n\n<strong>Contexto histórico:</strong> o tratado de comércio e navegação Brasil–EUA de 1935 foi <strong>denunciado</strong>; o BIT assinado em 1995 <strong>nunca foi ratificado</strong> pelo Senado americano; e o <strong>ATEC</strong> (Acordo de Cooperação Económica e Comercial de 2011) e seus protocolos <strong>não incluem cláusula de investidor E-2</strong>. Houve, em legislaturas sucessivas, projetos de lei para incluir o Brasil (<em>Brazil Treaty Trader and Investor Act</em> e correlatos), <strong>nenhum aprovado</strong> até este levantamento. <em>Status legislativo corrente a verificar em congress.gov.</em>\n\nA lista do Departamento de Estado abrange <strong>mais de 80 países</strong>, incluindo Alemanha, Reino Unido, Canadá, Espanha, México, Colômbia, Turquia e Granada.","kv":[{"l":"Brasil na lista E-2","v":"Não consta"},{"l":"BIT de 1995","v":"Nunca ratificado"},{"l":"Tratado de 1935","v":"Denunciado"},{"l":"ATEC de 2011","v":"Sem cláusula E-2"},{"l":"Países-tratado","v":"Mais de 80"},{"l":"AMIGOS Act — domicílio exigido","v":"3 anos contínuos"},{"l":"Vigência do AMIGOS Act","v":"Dezembro de 2022"},{"l":"Natureza do E-2","v":"Não-imigrante; não gera green card"},{"l":"Cônjuge — trabalho","v":"Autorizado automaticamente"},{"l":"Filhos — trabalho","v":"Não autorizado"},{"l":"Filhos — perda do status","v":"Aos 21 anos, sem CSPA"}],"requirements":["<strong>Nacionalidade de país-tratado</strong> — o requisito é de <strong>nacionalidade</strong>, não de residência. <strong>Brasileiros não qualificam pela nacionalidade brasileira.</strong>","<strong>Restrição decisiva do AMIGOS Act:</strong> o estrangeiro que <strong>adquiriu a nacionalidade do país-tratado por meio de investimento financeiro</strong> e que <strong>nunca antes obteve status E</strong> deve ter estado <strong>domiciliado naquele país por período contínuo de, no mínimo, 3 anos</strong>, em algum momento anterior ao pedido do visto E.","<strong>Não estão sujeitos ao requisito de 3 anos:</strong> quem já obteve status E anteriormente; e quem adquiriu a nacionalidade do país-tratado por <strong>nascimento, ascendência, casamento ou naturalização por residência</strong> — ou seja, por via não-investimento.","<strong>Investimento substancial</strong> — não há valor mínimo legal; a prática consular aplica o <strong>teste de proporcionalidade</strong>: o investimento deve ser substancial em relação ao custo total de aquisição ou implantação do negócio. Valores abaixo de USD 100.000 enfrentam escrutínio elevado.","Fundos <strong>irrevogavelmente comprometidos</strong> e <em>at risk</em>.","Empresa <strong>real e operante</strong> (<em>bona fide enterprise</em>) — <strong>não pode ser marginal</strong> (<em>marginality test</em>): deve gerar renda além do sustento do investidor e da família, ou ter capacidade comprovada de gerar empregos em 5 anos.","O investidor exerce <strong>desenvolvimento e direção</strong> do negócio — 50% ou mais de propriedade, ou controlo operacional.","<strong>Intenção de saída</strong> ao término do status — o E-2 é <strong>não-imigrante</strong> e <strong>não gera green card</strong>."],"sections":[{"title":"A rota indireta via cidadania de país-tratado — e por que ficou mais longa","body":"Como o E-2 exige <strong>nacionalidade</strong> de país-tratado, a via utilizada por brasileiros na prática é a <strong>obtenção prévia de cidadania de país-tratado</strong>, tipicamente por programas de cidadania por investimento (CBI):\n\n· <strong>Granada</strong> — Citizenship by Investment (doação ao NTF ou imóvel aprovado), a partir de cerca de USD 235.000 <em>(valores revisados por acordo regional do Caribe Oriental em 2024 — a confirmar)</em>. <strong>É país-tratado E-2.</strong>\n· <strong>Turquia</strong> — cidadania por investimento imobiliário, USD 400.000 <em>(a confirmar)</em>. <strong>É país-tratado E-2.</strong>\n· <strong>Portugal</strong> — é país-tratado E-2, mas a naturalização portuguesa <strong>exige residência</strong>, não é CBI.\n· <strong>Egito</strong> — é país-tratado E-2.\n\n<strong>A restrição que mudou tudo: o AMIGOS Act (dezembro de 2022).</strong>\n\nAlterou o INA §101(a)(15)(E) para exigir <strong>3 anos de domicílio contínuo</strong> no país-tratado, para quem adquiriu a nacionalidade <strong>por investimento financeiro</strong> e nunca antes teve status E.\n\n<strong>Consequências práticas:</strong>\n· <strong>Comprar passaporte de Granada e requerer E-2 imediatamente NÃO é possível desde dezembro de 2022.</strong>\n· O requisito é de <strong>domicílio contínuo de 3 anos</strong>, <strong>não de mera titularidade do passaporte por 3 anos</strong> — a distinção é substancial e frequentemente ignorada em material comercial.\n· Ficam <strong>fora</strong> da restrição quem já teve status E, e quem obteve a nacionalidade por nascimento, ascendência, casamento ou naturalização por residência.\n\n<em>A seção específica do Pub. L. 117-263 que veicula o AMIGOS Act deve ser verificada em congress.gov ou govinfo.gov.</em>"},{"title":"Características operacionais, para quem tem nacionalidade elegível","body":"· <strong>Não é caminho para green card</strong> — é status não-imigrante <strong>renovável indefinidamente</strong> em incrementos de até 2 anos de admissão, com visto de validade variável por reciprocidade.\n· <strong>Cônjuge de titular E-2 tem autorização de trabalho automática</strong> (<em>work-authorized incident to status</em>, desde política do USCIS de 2021/2022) — não precisa de EAD, embora possa solicitá-lo.\n· <strong>Filhos solteiros menores de 21 anos</strong> obtêm status E-2 derivado, <strong>com autorização de estudo, sem autorização de trabalho</strong>; e <strong>perdem o status ao completar 21 anos</strong> — <strong>não há CSPA para não-imigrantes</strong>.\n· <strong>Taxas:</strong> Form DS-160 mais taxa consular de visto de <strong>USD 315</strong> para a categoria E <em>(a confirmar)</em>, mais <strong>USD 250 de Visa Integrity Fee</strong>; ou, para mudança de status dentro dos EUA, Form I-129 a <strong>USD 1.015</strong> mais <em>premium processing</em> de <strong>USD 2.965</strong> <em>(valores a confirmar no Form G-1055)</em>."}],"brazilNote":"<strong>O E-2 está fechado ao brasileiro pela nacionalidade brasileira.</strong> Esta é uma conclusão firme, não uma incerteza.\n\nA rota indireta — obter cidadania de país-tratado por investimento e depois requerer o E-2 — <strong>continua juridicamente possível, mas deixou de ser rápida</strong>: o <strong>AMIGOS Act</strong>, desde dezembro de 2022, exige <strong>3 anos de domicílio contínuo</strong> no país-tratado antes do pedido do visto E, para quem adquiriu a nacionalidade por investimento.\n\n<strong>Isso significa que o desenho «passaporte de Granada mais E-2» passou de um projeto de meses para um projeto de mais de três anos</strong>, com exigência de <strong>domicílio efetivo</strong> — não apenas de titularidade do passaporte.\n\n<strong>Alternativas reais para o brasileiro que busca residência ativa nos EUA:</strong> <strong>EB-5</strong> (investimento, com green card), <strong>EB-1A</strong> e <strong>EB-2 NIW</strong> (mérito, com auto-petição e green card), <strong>O-1A</strong> e <strong>L-1A</strong> (não-imigrantes, com patrocinador).\n\n<strong>Materiais comerciais que apresentem o E-2 via Granada como solução de curto prazo para brasileiros estão desatualizados em mais de três anos.</strong>","warning":"<strong>Brasileiros não são elegíveis ao E-2 pela nacionalidade brasileira</strong> — o Brasil não é país-tratado, o BIT de 1995 nunca foi ratificado, e nenhum projeto de inclusão foi aprovado.\n\n<strong>E a via indireta por cidadania por investimento exige agora 3 anos de domicílio contínuo</strong> no país-tratado (AMIGOS Act, dezembro de 2022), não bastando a titularidade do passaporte. Qualquer oferta que prometa E-2 imediato mediante compra de cidadania caribenha está incorreta.","sources":[{"t":"Departamento de Estado · Treaty Countries","u":"https://travel.state.gov/content/travel/en/us-visas/visa-information-resources/fees/treaty.html"},{"t":"Departamento de Estado · Treaty Trader (E-1) e Treaty Investor (E-2)","u":"https://travel.state.gov/content/travel/en/us-visas/employment/treaty-trader-investor-visa-e.html"},{"t":"Cornell LII · 8 U.S. Code §1101(a)(15)(E)","u":"https://www.law.cornell.edu/uscode/text/8/1101"},{"t":"Congress.gov · National Defense Authorization Act for FY2023 (Pub. L. 117-263)","u":"https://www.congress.gov/bill/117th-congress/house-bill/7776"}]},{"name":"EB-1A e EB-2 NIW — as rotas de auto-petição","status":"ok","legalBasis":"<strong>EB-1A:</strong> INA §203(b)(1)(A) — 8 U.S.C. §1153(b)(1)(A); <strong>8 C.F.R. §204.5(h)</strong>; USCIS Policy Manual, Volume 6, Part F, Chapter 2. <strong>EB-2 NIW:</strong> INA §203(b)(2)(B)(i) — 8 U.S.C. §1153(b)(2)(B)(i); <strong>8 C.F.R. §204.5(k)</strong>; USCIS Policy Manual, Volume 6, Part F, Chapter 5. Metodologia de análise: <em>Kazarian v. USCIS</em>, 596 F.3d 1115 (9th Cir. 2010). Critérios do <em>waiver</em>: <strong><em>Matter of Dhanasar</em>, 26 I&amp;N Dec. 884 (AAO 2016)</strong>.","desc":"As duas rotas de <strong>green card sem oferta de emprego, sem patrocinador e sem PERM</strong> — e ambas admitem <strong>auto-petição</strong>.\n\n<strong>EB-1A — Alien of Extraordinary Ability.</strong> Padrão: «<em>one of that small percentage who have risen to the very top of the field of endeavor</em>» (8 C.F.R. §204.5(h)(2)), com <strong>aclamação nacional ou internacional sustentada</strong>.\n<strong>Estrutura probatória em duas etapas</strong> (confirmada em decisões da AAO de 2026): (1) <strong>critérios</strong> — prémio internacional único de grande relevo (Nobel, Óscar, Pulitzer, medalha olímpica) <strong>ou</strong> satisfação de <strong>3 ou mais dos 10 critérios</strong> do §204.5(h)(3); e (2) <strong><em>final merits determination</em></strong> — análise holística da totalidade das provas para aferir se há aclamação sustentada e posicionamento no topo da área.\n\n<strong>EB-2 NIW — National Interest Waiver.</strong> Pré-requisito de categoria EB-2: <strong>grau académico avançado</strong> (mestrado ou superior, ou bacharelado mais 5 anos de experiência progressiva), <strong>ou</strong> <strong>habilidade excecional</strong> (3 ou mais de 6 critérios do §204.5(k)(3)(ii)).\nSobre isso, aplicam-se os <strong>três <em>prongs</em> cumulativos de <em>Matter of Dhanasar</em></strong>, que substituiu o padrão anterior de <em>Matter of New York State Dept. of Transportation</em> (NYSDOT), 22 I&amp;N Dec. 215 (1998).\n\n<strong>Visa Bulletin:</strong> <strong>EB-1 e EB-2 CURRENT para «All Chargeability Areas», faixa que inclui o Brasil</strong>, em agosto de 2026. EB-2 Índia consta como <em>unavailable</em>. Houve retrogressões pontuais em julho de 2026, e categorias <em>current</em> podem retrogredir antes do encerramento do ano fiscal por esgotamento de cota.","kv":[{"l":"Auto-petição","v":"Permitida em ambas"},{"l":"Oferta de emprego","v":"Não exigida"},{"l":"PERM (labor certification)","v":"Dispensada"},{"l":"EB-1A — critérios","v":"3 de 10, mais final merits"},{"l":"EB-2 NIW — critérios","v":"3 prongs de Dhanasar"},{"l":"Brasil no Visa Bulletin","v":"Current (ago/2026)"},{"l":"Form I-140","v":"USD 715"},{"l":"Premium processing","v":"USD 2.805 · 15 dias úteis"},{"l":"I-140 sem premium","v":"12–24 meses"},{"l":"Green card","v":"Permanente, não condicional"}],"requirements":["<strong>EB-1A — Etapa 1, os 10 critérios (bastam 3):</strong> prémios nacionais ou internacionais de menor relevo por excelência; filiação a associações que exijam realização destacada, julgada por especialistas reconhecidos; <strong>matérias publicadas SOBRE o requerente</strong> em mídia profissional ou de grande circulação; atuação como <strong>juiz ou avaliador</strong> do trabalho de terceiros na área; <strong>contribuições originais de significância maior</strong> (científica, académica, artística, atlética ou empresarial); <strong>autoria</strong> de artigos académicos em periódicos profissionais ou mídia de grande circulação; exposição do trabalho em mostras artísticas; desempenho de <strong>papel principal ou crítico</strong> em organizações de reputação destacada; <strong>remuneração elevada</strong> em relação a pares; e sucesso comercial em artes cénicas.","<strong>EB-1A — Etapa 2:</strong> <em>final merits determination</em> — análise holística da totalidade das provas, sob a metodologia de <em>Kazarian</em>.","<strong>EB-1A — atualizações de política do USCIS (2024–2026):</strong> <strong>prémios de equipe podem contar</strong>, desde que documentada a contribuição específica e crítica do requerente; e <strong>filiações passadas passam a contar</strong>, não apenas as vigentes, desde que a associação exigisse realização destacada à época. <em>Datas e números das atualizações do Policy Manual a verificar.</em>","<strong>EB-2 NIW — Prong 1:</strong> o <em>proposed endeavor</em> tem <strong>mérito substancial</strong> e <strong>importância nacional</strong>. Mérito pode ser em negócios, empreendedorismo, ciência, tecnologia, cultura, saúde ou educação. A importância nacional é avaliada pelas <strong>implicações prospetivas do empreendimento</strong> — <strong>não pela área em abstrato</strong>.","<strong>EB-2 NIW — Prong 2:</strong> o requerente está <strong>bem posicionado</strong> para avançar o empreendimento — avaliado por formação, histórico de sucesso, conhecimento especializado, plano de execução, interesse de investidores, utilizadores ou clientes, e progresso já alcançado.","<strong>EB-2 NIW — Prong 3:</strong> no cômputo geral, <strong>beneficia os Estados Unidos dispensar</strong> os requisitos de oferta de emprego e de <em>labor certification</em>. Considera-se a impraticabilidade de obter oferta de emprego, o benefício mesmo havendo trabalhadores americanos disponíveis, e a urgência do interesse nacional.","<strong>EB-1A:</strong> intenção de continuar trabalhando na área de <em>expertise</em> nos Estados Unidos."],"process":[{"step":"Montagem do dossiê probatório","detail":"Cartas de recomendação independentes, métricas de citação, evidências dos critérios, plano de <em>endeavor</em> (no NIW). É a etapa que determina o resultado.","timing":"2–6 meses"},{"step":"Form I-140","detail":"Petição com pedido de classificação EB-1A ou EB-2 NIW. Adjudicação regular de <strong>12 a 24 meses</strong>; com <em>premium processing</em>, <strong>15 dias úteis</strong>.","timing":"15 dias a 24 meses"},{"step":"Form I-485 — concurrent filing","detail":"Se já estiver nos EUA em status válido e a categoria estiver <strong>current</strong>, o I-485 pode ser protocolado junto com o I-140. Prazo do I-485 em categoria EB: <strong>9 a 42,5 meses</strong>.","timing":"9–42,5 meses"},{"step":"Alternativa — processamento consular","detail":"NVC → DS-260 → entrevista no Consulado (Rio de Janeiro ou São Paulo). NVC: 2 a 6 meses.","timing":"2–6 meses no NVC"},{"step":"Green card permanente","detail":"<strong>Green card de 10 anos, não condicional</strong> — não há I-829 nem remoção de condições, ao contrário do EB-5.","timing":"—"}],"costs":[{"item":"Form I-140","value":"USD 715"},{"item":"Premium processing do I-140","value":"USD 2.805","note":"15 dias úteis; valor de 2026, com ajustes por CPI-U"},{"item":"Form I-485 (adjustment of status)","value":"USD 1.440","note":"Por requerente"},{"item":"Forms I-765 (EAD) e I-131 (Advance Parole)","value":"A confirmar","note":"Verificar no Form G-1055"},{"item":"Taxa consular DS-260 / NVC","value":"USD 345","note":"Por requerente — a confirmar"},{"item":"USCIS Immigrant Fee","value":"USD 235","note":"A confirmar"},{"item":"Honorários advocatícios","value":"USD 10.000–30.000","note":"Mercado"}],"sections":[{"title":"EB-1A e EB-2 NIW — quando cada uma se aplica","body":"<strong>EB-1A</strong> exige <strong>aclamação sustentada</strong> e posicionamento no topo da área. É a rota de quem já tem reconhecimento consolidado — prémios, cobertura de mídia, cargos de liderança, citações relevantes.\n<strong>Vantagem:</strong> a categoria EB-1 tem prioridade na fila de vistos, e permanece <em>current</em> para o Brasil.\n\n<strong>EB-2 NIW</strong> não exige aclamação — exige que o <strong>empreendimento proposto</strong> tenha mérito substancial e importância nacional, que o requerente esteja bem posicionado para executá-lo, e que dispensar a oferta de emprego beneficie os Estados Unidos.\n<strong>Perfis documentados:</strong> pesquisadores, profissionais STEM, médicos, engenheiros, empreendedores de base tecnológica, executivos, especialistas em saúde pública, IA e biotecnologia.\n\n<strong>Ambas dispensam PERM e admitem auto-petição</strong> — o que as torna as únicas rotas de green card que <strong>não dependem de terceiro</strong> além do EB-5.\n\n<em>Premium processing está disponível para o I-140 em ambas desde 2023 — disponibilidade corrente a confirmar.</em>"},{"title":"Regras de família","body":"<strong>INA §203(d):</strong> cônjuge e filhos solteiros menores de 21 anos como <strong>derivativos</strong>, sem petição própria.\n\n<strong>CSPA aplicável</strong> — a idade do filho «congela» durante a pendência do I-140.\n\n<strong>Green card permanente (10 anos), sem condicionalidade</strong> — diferentemente do EB-5, não há residência condicional de 2 anos nem I-829."}],"brazilNote":"<strong>EB-1 e EB-2 estão CURRENT para o Brasil</strong> no Visa Bulletin de agosto de 2026 — situação favorável em comparação com a Índia (EB-2 <em>unavailable</em>) e a China. <em>Categorias current podem retrogredir antes do encerramento do ano fiscal; conferir o bulletin do mês.</em>\n\n<strong>São as rotas de menor dependência de terceiros:</strong> sem oferta de emprego, sem patrocinador, sem PERM, com auto-petição. Para o profissional brasileiro com trajetória consolidada — pesquisador, médico, engenheiro, executivo, empreendedor de base tecnológica —, tendem a ser a via mais direta ao green card, e a um custo de taxas oficiais uma ordem de grandeza inferior ao EB-5.\n\n<strong>Mas o resultado depende inteiramente do dossiê.</strong> Cartas de recomendação de instituições brasileiras devem contextualizar a reputação da instituição no setor; publicações, patentes e prémios brasileiros precisam ser explicados quanto ao seu alcance; e o <em>proposed endeavor</em> do NIW deve ser articulado em termos de <strong>implicações prospetivas para os Estados Unidos</strong>, não da relevância da área em abstrato.\n\n<strong>Consequência fiscal idêntica à do EB-5:</strong> o green card traz o status de <em>US person</em>, com tributação sobre renda mundial, o pacote declaratório completo e o regime PFIC sobre o portfólio brasileiro. <strong>O planejamento pré-imigratório deve estar concluído antes da <em>residency starting date</em></strong> — e, no caso de aprovação por <em>premium processing</em>, essa data pode chegar bem mais rápido do que no EB-5.","sources":[{"t":"USCIS · Employment-Based Immigration: First Preference EB-1","u":"https://www.uscis.gov/working-in-the-united-states/permanent-workers/employment-based-immigration-first-preference-eb-1"},{"t":"USCIS · Employment-Based Immigration: Second Preference EB-2","u":"https://www.uscis.gov/working-in-the-united-states/permanent-workers/employment-based-immigration-second-preference-eb-2"},{"t":"USCIS Policy Manual · Volume 6, Part F — Employment-Based Classifications","u":"https://www.uscis.gov/policy-manual/volume-6-part-f"},{"t":"Cornell LII · 8 C.F.R. §204.5","u":"https://www.law.cornell.edu/cfr/text/8/204.5"},{"t":"Departamento de Estado · Visa Bulletin","u":"https://travel.state.gov/content/travel/en/legal/visa-law0/visa-bulletin.html"}]},{"name":"O-1A, L-1A e H-1B — as rotas não-imigrantes","status":"changed","legalBasis":"<strong>O-1A:</strong> INA §101(a)(15)(O)(i) — 8 U.S.C. §1101(a)(15)(O)(i); 8 C.F.R. §214.2(o). <strong>L-1A:</strong> INA §101(a)(15)(L) — 8 U.S.C. §1101(a)(15)(L); 8 C.F.R. §214.2(l). <strong>H-1B:</strong> INA §101(a)(15)(H)(i)(b); 8 C.F.R. §214.2(h); 20 C.F.R. Part 655 (LCA). <strong>EB-1C:</strong> INA §203(b)(1)(C).","desc":"<strong>O-1A — Extraordinary Ability in Sciences, Education, Business or Athletics.</strong> Prémio internacional único de grande relevo <strong>ou 3 ou mais de 8 critérios</strong> do §214.2(o)(3)(iii). <em>Nota: são <strong>8</strong> critérios no O-1A, contra <strong>10</strong> no EB-1A.</em>\n<strong>Exige petição por empregador ou agente americano — NÃO admite auto-petição</strong>, diferença central em relação ao EB-1A. Um <em>agent</em> pode peticionar em nome de múltiplos empregadores. <strong>Sem cota anual</strong>; <em>dual intent</em> admitido na prática. Validade inicial de até 3 anos, com extensões de 1 ano ilimitadas. Exige <strong>consultation letter</strong> de organização ou sindicato da área.\n\n<strong>L-1A — Intracompany Transferee (Executive or Manager).</strong> Exige <strong>relação societária qualificada</strong> entre a entidade estrangeira e a americana — matriz, filial, subsidiária ou afiliada sob controlo comum. Duração máxima de <strong>7 anos</strong> (L-1A) ou 5 anos (L-1B).\n<strong>Ponte direta para green card:</strong> o L-1A gerencial ou executivo tem correspondência com o <strong>EB-1C</strong> (<em>Multinational Manager or Executive</em>), que <strong>dispensa PERM</strong>. <em>Dual intent</em> expressamente admitido (8 C.F.R. §214.2(l)(16)).\n\n<strong>H-1B — Specialty Occupation.</strong> Cota anual de <strong>85.000</strong> (65.000 mais 20.000 para mestres e doutores de instituições americanas). Duração de 3 anos, extensível a 6; extensões além disso sob AC21 §§104(c) e 106(a). <strong>Duas alterações estruturais em 2025–2026</strong> — ver a seção específica.","kv":[{"l":"O-1A — auto-petição","v":"Não admitida"},{"l":"O-1A — critérios","v":"3 de 8"},{"l":"O-1A — cota","v":"Nenhuma"},{"l":"O-1A — duração","v":"3 anos + 1/1 ilimitado"},{"l":"O-3 (dependentes)","v":"Sem autorização de trabalho"},{"l":"L-1A — experiência prévia","v":"1 ano em 3"},{"l":"L-1A — duração máxima","v":"7 anos"},{"l":"L-1A — new office","v":"Aprovação inicial de 1 ano"},{"l":"L-2 (cônjuge)","v":"Trabalho automático"},{"l":"H-1B — cota anual","v":"85.000"},{"l":"H-1B — taxa de USD 100k","v":"Em vigor sob stay judicial"},{"l":"H-1B — loteria","v":"Ponderada por salário, FY 2027"},{"l":"Visa Integrity Fee","v":"USD 250, sem waiver"}],"requirements":["<strong>O-1A:</strong> prémio internacional único de grande relevo, ou <strong>3 ou mais de 8 critérios</strong> — prémios; filiações; matérias publicadas sobre o requerente; participação como juiz; contribuições originais de significância maior; autoria de artigos académicos; papel crítico em organizações de reputação destacada; e alta remuneração.","<strong>O-1A:</strong> petição por <strong>empregador ou agente americano</strong>; e <strong>consultation letter</strong> de organização, sindicato ou <em>peer group</em> da área.","<strong>L-1A:</strong> relação societária <strong>qualificada</strong> entre a entidade estrangeira e a americana — matriz, filial, subsidiária ou afiliada sob controlo comum.","<strong>L-1A:</strong> o empregado trabalhou <strong>1 ano contínuo nos 3 anos anteriores</strong> para a entidade estrangeira, em função <strong>executiva ou gerencial</strong> (L-1A) ou de <strong>conhecimento especializado</strong> (L-1B).","<strong>L-1A:</strong> a entidade estrangeira <strong>permanece em operação</strong> durante todo o período do L-1; e a função nos EUA é executiva ou gerencial.","<strong>L-1A «new office»</strong> (entidade americana em operação há menos de 1 ano) — escrutínio elevado: <strong>instalações físicas suficientes já contratadas</strong> para abrigar o novo escritório; prova de que a empresa <strong>suportará uma posição executiva ou gerencial em 1 ano</strong>; e <strong>aprovação inicial limitada a 1 ano</strong>, contra 3 anos da petição padrão, com extensões subsequentes de até 2 anos.","<strong>H-1B:</strong> ocupação especializada exigindo, no mínimo, <strong>bacharelado</strong> (ou equivalente) na área específica; <strong>LCA certificada pelo DOL</strong> (Form ETA-9035) com pagamento do <em>prevailing wage</em>; e patrocínio por empregador — <strong>não admite auto-petição</strong>, salvo estruturas de <em>employer-employee relationship</em> válidas.","<strong>H-1B — cap-exempt:</strong> instituições de ensino superior, entidades ligadas e organizações de pesquisa sem fins lucrativos estão <strong>fora da cota</strong>."],"sections":[{"title":"H-1B — as duas alterações estruturais de 2025 e 2026","body":"<strong>1. Taxa de USD 100.000 — Proclamação de 19 de setembro de 2025.</strong>\nImpõe pagamento de <strong>USD 100.000 pelo empregador, ANTES do protocolo</strong> da petição H-1B, para beneficiário <strong>que esteja fora dos Estados Unidos</strong> — inclusive nos casos de processamento consular.\n\n<strong>Status judicial em agosto de 2026:</strong> o tribunal federal do <strong>Distrito de Massachusetts declarou a taxa ilegal em 8 de junho de 2026</strong>, qualificando-a como tributo que o Executivo não tem competência para instituir. <strong>Em 12 de junho de 2026, o mesmo tribunal suspendeu a própria decisão (<em>stay</em>)</strong>, restabelecendo a cobrança durante a apelação. <strong>A taxa vinha sendo cobrada no fim de junho de 2026</strong>, com recurso pendente no <strong>First Circuit</strong>. Um tribunal no estado de Washington havia anteriormente <strong>mantido</strong> a taxa, configurando divergência entre circuitos.\n<em>Número da Proclamação e status processual mais recente a verificar em federalregister.gov e nos autos do First Circuit.</em>\n\n<strong>2. Loteria ponderada por nível salarial.</strong>\nRegra final do DHS publicada em <strong>29 de dezembro de 2025</strong>, <strong>sem acolhimento de comentários públicos</strong>, com <strong>eficácia a partir de 27 de fevereiro de 2026</strong>.\nAplica-se a partir da <strong>loteria do FY 2027</strong>: as 85.000 vagas passam a ser sorteadas por sistema que atribui de <strong>1 a 4 entradas por registo</strong>, conforme o <strong>nível de <em>prevailing wage</em></strong> da posição (OES Levels I a IV).\n<strong>Efeito documentado:</strong> eleva a probabilidade de seleção de posições de salário mais alto e <strong>reduz a de posições de nível I</strong>."},{"title":"Custos e taxas transversais","body":"<strong>O-1A:</strong> Form I-129 a <strong>USD 1.015</strong> <em>(a confirmar)</em>, mais <em>premium processing</em> de <strong>USD 2.965</strong> — efetivo desde 1/mar/2026, após reajuste de 5,72% por CPI-U, saindo de USD 2.805 —, mais <strong>Visa Integrity Fee de USD 250</strong>.\n\n<strong>L-1A:</strong> Form I-129 a USD 1.015 <em>(a confirmar)</em>; <strong>Fraud Prevention and Detection Fee de USD 500</strong>; taxa «L Fraud» (Pub. L. 114-113) de <strong>USD 4.500</strong> para empregadores com 50 ou mais empregados e mais de 50% do quadro em status H-1B ou L-1 <em>(vigência a confirmar)</em>; <em>premium processing</em> de USD 2.965; e Visa Integrity Fee de USD 250. Existe <strong>Blanket L</strong> para grupos que atendam critérios de porte.\n\n<strong>H-1B:</strong> registo de loteria <em>(valor a confirmar)</em>; Form I-129 a USD 1.015 <em>(a confirmar)</em>; <strong>Asylum Program Fee de USD 600</strong> (USD 300 para pequeno empregador; USD 0 para <em>nonprofit</em>); taxa ACWIA de USD 750 ou 1.500 <em>(a confirmar)</em>; Fraud Fee de USD 500; a <strong>taxa de USD 100.000</strong> para beneficiário fora dos EUA (em litígio); e Visa Integrity Fee de USD 250.\n\n<strong>Taxas transversais criadas pelo One Big Beautiful Bill Act</strong> (Pub. L. 119-21, de 4/jul/2025):\n· <strong>Visa Integrity Fee — USD 250</strong>: incide sobre <strong>todo visto de não-imigrante</strong>; <strong>não é passível de <em>waiver</em></strong>; nominalmente reembolsável ao viajante que cumprir as condições e sair no prazo, mas <strong>não há processo de reembolso operacional divulgado</strong>;\n· <strong>ESTA</strong>: de USD 21 para <strong>USD 40</strong>, desde 30/set/2025 — <strong>não aplicável a brasileiros</strong>, pois o Brasil não integra o Visa Waiver Program;\n· <strong>I-94 (fronteira terrestre)</strong>: de USD 6 para USD 30;\n· <strong>TPS</strong>: de USD 50 para USD 500;\n· <strong>EAD vinculado a TPS ou asilo</strong>: de USD 470 para USD 550, <strong>sem <em>waiver</em></strong>."},{"title":"Regras de família","body":"<strong>O-3</strong> — cônjuge e filhos solteiros menores de 21 anos. <strong>SEM autorização de trabalho.</strong> Há ainda o <strong>O-2</strong>, para pessoal de apoio essencial.\n\n<strong>L-2</strong> — cônjuge com <strong>autorização de trabalho automática</strong> <em>incident to status</em> (política do USCIS desde novembro de 2021); filhos solteiros menores de 21 anos com autorização de estudo.\n\n<strong>H-4</strong> — cônjuge e filhos. <strong>EAD H-4 apenas se o principal tiver I-140 aprovado</strong> ou extensão sob AC21 §106.\n\n<strong>Em todos os casos, filhos perdem o status ao completar 21 anos — não há CSPA para não-imigrantes.</strong>"}],"brazilNote":"Para o brasileiro, estas três rotas têm perfis muito distintos:\n\n<strong>O-1A</strong> — o padrão probatório é próximo ao do EB-1A (8 critérios em vez de 10), mas <strong>exige empregador ou agente americano</strong>. Na prática, funciona como <strong>ponte</strong>: entra-se com O-1A e peticiona-se o EB-1A em paralelo, aproveitando o mesmo dossiê.\n\n<strong>L-1A</strong> — a rota natural para o executivo de empresa brasileira que abre operação nos Estados Unidos. A modalidade <strong>«new office»</strong> tem escrutínio elevado e aprovação inicial de apenas <strong>1 ano</strong>, exigindo instalações físicas já contratadas e prova de que a operação suportará uma posição executiva em 12 meses. <strong>Ponte direta para o EB-1C</strong>, que dispensa PERM.\n\n<strong>H-1B</strong> — a rota de maior atrito hoje. A <strong>taxa de USD 100.000</strong> para beneficiário fora dos EUA — em vigor sob <em>stay</em> judicial, com apelação pendente — atinge exatamente o brasileiro que se candidata do Brasil. E a <strong>loteria ponderada por salário</strong>, a partir do FY 2027, reduz a probabilidade de seleção de posições de nível salarial inicial.\n\n<strong>Nenhuma das três é imigrante.</strong> O-1A e L-1A admitem <em>dual intent</em> e servem como ponte ao green card (EB-1A e EB-1C, respetivamente). O H-1B também admite <em>dual intent</em>, mas depende de patrocinador e de sorteio.\n\n<strong>Consequência fiscal:</strong> o titular de visto não-imigrante <strong>não é automaticamente US person</strong> — mas cruza o <strong>Substantial Presence Test</strong> rapidamente, se residir efetivamente nos Estados Unidos. A partir daí, aplicam-se integralmente a tributação sobre renda mundial e o pacote declaratório. <strong>O planejamento pré-imigratório deve preceder a mudança, não a obtenção do green card.</strong>","sources":[{"t":"USCIS · O-1 Visa: Individuals with Extraordinary Ability or Achievement","u":"https://www.uscis.gov/working-in-the-united-states/temporary-workers/o-1-visa-individuals-with-extraordinary-ability-or-achievement"},{"t":"USCIS · L-1A Intracompany Transferee Executive or Manager","u":"https://www.uscis.gov/working-in-the-united-states/temporary-workers/l-1a-intracompany-transferee-executive-or-manager"},{"t":"USCIS · H-1B Specialty Occupations","u":"https://www.uscis.gov/working-in-the-united-states/temporary-workers/h-1b-specialty-occupations"},{"t":"Cornell LII · 8 C.F.R. §214.2","u":"https://www.law.cornell.edu/cfr/text/8/214.2"},{"t":"Federal Register","u":"https://www.federalregister.gov"}]},{"name":"Gold Card e Platinum Card — Executive Order 14351","status":"risk","legalBasis":"<strong>Executive Order 14351, «The Gold Card»</strong>, assinada em <strong>19 de setembro de 2025</strong>. <strong>Criada por ato do Executivo, sem lei do Congresso.</strong> Portal: trumpcard.gov. Formulário: <strong>Form I-140G</strong> (USCIS). Abertura de aplicações: <strong>10 de dezembro de 2025</strong>.","desc":"<strong>Estrutura do programa:</strong>\n· <strong>Individual Gold Card</strong> — contribuição de <strong>USD 1.000.000</strong> ao Departamento de Comércio ou ao Tesouro, <strong>não reembolsável</strong>, mais <strong>USD 15.000</strong> de taxa de processamento do DHS, também não reembolsável;\n· <strong>Corporate Gold Card</strong> — <strong>USD 2.000.000</strong> por funcionário patrocinado;\n· <strong>Membros da família</strong> — <strong>cada um exige contribuição própria de USD 1.000.000 mais USD 15.000</strong>;\n· <strong>Platinum Card</strong> — <strong>USD 5.000.000</strong>, <strong>em lista de espera; não liberado</strong>.\n\n<strong>Ponto estrutural decisivo:</strong> o Gold Card <strong>NÃO é uma nova categoria de visto</strong>. É apresentado como via de <strong>processamento acelerado dentro das categorias estatutárias existentes EB-1 e EB-2 NIW</strong> — o Form I-140G substitui o I-140 tradicional, mas <strong>o requerente ainda precisa demonstrar os requisitos substantivos de EB-1A ou EB-2 NIW</strong>. <strong>O pagamento não dispensa a qualificação.</strong>\n\nFontes indicam ainda que o programa <strong>não admite <em>Adjustment of Status</em></strong> — apenas processamento consular. <em>A confirmar nas instruções do Form I-140G.</em>","kv":[{"l":"Individual Gold Card","v":"USD 1.000.000 + USD 15.000"},{"l":"Corporate Gold Card","v":"USD 2.000.000 por funcionário"},{"l":"Por familiar","v":"USD 1.000.000 + USD 15.000 cada"},{"l":"Platinum Card","v":"USD 5.000.000 — não lançada"},{"l":"Contribuição","v":"Não reembolsável"},{"l":"Base jurídica","v":"Executive Order, não lei"},{"l":"Categoria estatutária","v":"EB-1 ou EB-2 NIW"},{"l":"Qualificação substantiva","v":"Não dispensada"},{"l":"Adjustment of Status","v":"Não admitido (a confirmar)"},{"l":"Aprovações até 27/jul/2026","v":"1"},{"l":"Litígio","v":"AAUP v. DHS, sem decisão"}],"requirements":["<strong>Contribuição de USD 1.000.000</strong> (individual) ou <strong>USD 2.000.000</strong> (corporate, por funcionário patrocinado), <strong>não reembolsável</strong>.","<strong>Taxa de processamento do DHS de USD 15.000</strong>, também não reembolsável.","<strong>Cada membro da família exige contribuição própria</strong> de USD 1.000.000 mais USD 15.000 — não há derivação gratuita como no EB-5 ou no EB-1A.","<strong>Demonstrar os requisitos substantivos de EB-1A ou EB-2 NIW</strong> — o Form I-140G substitui o I-140, mas <strong>não substitui a qualificação</strong>. O pagamento acelera o processamento, não dispensa o mérito.","<strong>Processamento consular</strong> — o programa não admitiria <em>Adjustment of Status</em>. <em>A confirmar nas instruções do formulário.</em>"],"sections":[{"title":"Os números divulgados — a adesão real","body":"Dados apurados até <strong>27 de julho de 2026</strong>:\n· registos no portal: <strong>338</strong> (fim de abril de 2026)\n· registos que pagaram a taxa: <strong>165</strong> (fim de abril de 2026)\n· petições <strong>I-140G efetivamente protocoladas: 59</strong> (fim de abril de 2026)\n· <strong>aprovações confirmadas: 1</strong>\n\n<em>Fonte: divulgação em litígio e cobertura jornalística. Não confirmado por dado oficial do USCIS.</em>\n\n<strong>Fatores de adesão reportados.</strong> A cobertura jornalística associa a baixa adesão a dois fatores: (i) a <strong>incerteza jurídica do programa</strong>; e (ii) a <strong>sujeição do <em>green card holder</em> à tributação mundial americana</strong> — descrita nas reportagens como resistência de investidores globais a submeter patrimônio e renda internacionais ao IRS em troca do status. <em>Fatos reportados, sem juízo de valor.</em>"},{"title":"Litígio — AAUP v. DHS","body":"<strong>Ação ajuizada em 3 de fevereiro de 2026</strong>, no <em>U.S. District Court for the District of Columbia</em>, pela <strong>American Association of University Professors (AAUP)</strong> e por profissionais imigrantes individuais, contra o DHS, o Departamento de Estado e o Departamento de Comércio.\n\n<strong>Fundamentos:</strong> o programa cria sistema de <em>pay-to-play</em> que <strong>contorna os critérios meritórios estatutários</strong>; carece de <strong>autorização do Congresso</strong>; e viola o <strong>Administrative Procedure Act</strong> (5 U.S.C. §§551 e seguintes, e §706) e a <strong>Immigration and Nationality Act</strong>.\n\n<strong>Status em meados de 2026:</strong> <strong>nenhuma liminar concedida; nenhuma decisão de mérito; moção de <em>dismissal</em> do governo pendente</strong>, centrada primordialmente em <em>standing</em> dos autores, <strong>sem enfrentar o mérito</strong>.\n\n<em>Juiz relatado: Richard J. Leon — atribuição mencionada em fonte secundária, a verificar no PACER ou CourtListener. Há ainda ação separada relativa a transparência/FOIA movida pela Democracy Defenders Fund — a confirmar.</em>"},{"title":"Platinum Card — e a promessa tributária sem base normativa","body":"<strong>Anunciada em setembro de 2025; em agosto de 2026 permanece em fase de lista de espera — não aberta a aplicações, sem data de lançamento divulgada.</strong>\n\nContribuição anunciada: <strong>USD 5.000.000</strong>, não reembolsável.\n\n<strong>Diferenciador anunciado pela administração:</strong> permitiria ao titular permanecer <strong>até 270 dias por ano nos Estados Unidos sem sujeição ao Substantial Presence Test</strong> — e, portanto, sem tributação americana sobre renda de fonte estrangeira.\n\n<strong>Ressalva jurídica essencial.</strong> O <strong>Substantial Presence Test é definido em lei federal (IRC §7701(b)(3))</strong>. <strong>Uma exceção ao SPT não pode ser criada por Executive Order nem por ato administrativo do DHS — exigiria alteração do Internal Revenue Code pelo Congresso.</strong>\n\n<strong>Nenhuma legislação nesse sentido foi identificada.</strong> Não foi localizada qualquer norma, projeto de lei aprovado, regulamento do Tesouro ou <em>guidance</em> do IRS que implemente a isenção de 270 dias. <strong>O benefício tributário anunciado permanece, até este levantamento, sem base normativa identificável.</strong>"},{"title":"Base de risco — comparação factual com o EB-5","body":"· Criado por <strong>Executive Order, não por lei</strong> — sujeito a revogação por administração subsequente ou por decisão judicial;\n· <strong>contribuição de USD 1.000.000 declarada não reembolsável</strong>, inclusive em caso de <strong>indeferimento</strong> ou de <strong>extinção do programa</strong>;\n· <strong>litígio de mérito pendente</strong>, sem decisão;\n· o estatuto substantivo continua sendo <strong>EB-1 ou EB-2 NIW</strong> — a qualificação técnica <strong>não é dispensada</strong>;\n· <strong>cada familiar exige contribuição própria</strong> de USD 1.000.000.\n\n<strong>Comparação factual:</strong> o <strong>EB-5 tem base estatutária</strong> (INA §203(b)(5), Pub. L. 101-649 e Pub. L. 117-103) e <strong>prevê possibilidade de retorno do capital</strong>; o <strong>Gold Card tem base em Executive Order</strong> e a contribuição é <strong>declaradamente não recuperável</strong>."}],"brazilNote":"Para o brasileiro, o Gold Card apresenta um perfil de risco que merece leitura literal dos números:\n\n· <strong>USD 1.000.000 não reembolsáveis por pessoa</strong> — uma família de quatro custaria <strong>USD 4.060.000</strong> em contribuições e taxas, sem qualquer possibilidade de retorno;\n· contra o <strong>EB-5</strong>, cujo investimento de <strong>USD 800.000</strong> é capital <em>at risk</em> com <strong>possibilidade de retorno</strong>, cobre toda a família sem aporte adicional, e tem <strong>base estatutária</strong>;\n· contra o <strong>EB-1A e o EB-2 NIW</strong>, que custam <strong>USD 715 de I-140</strong> e não exigem investimento algum — e cujos requisitos substantivos o Gold Card <strong>não dispensa</strong>.\n\n<strong>Ou seja:</strong> quem qualifica para EB-1A ou EB-2 NIW pode obter o green card sem contribuição; e quem não qualifica <strong>também não obtém o Gold Card</strong>, porque a qualificação substantiva permanece exigida. O que o pagamento compra é <strong>velocidade de processamento</strong>, não elegibilidade.\n\n<strong>A promessa de isenção de 270 dias do Platinum Card não tem base normativa identificável</strong> — o SPT está em lei federal e não pode ser alterado por Executive Order. Qualquer planejamento fiscal construído sobre essa premissa é, hoje, especulativo.\n\n<strong>E o green card traz o pacote completo:</strong> tributação sobre renda mundial, exclusão sucessória de USD 15.000.000 (contra os USD 60.000 do não domiciliado), pacote declaratório, regime PFIC sobre o portfólio brasileiro, e o relógio de 8 anos do exit tax.","warning":"<strong>A contribuição de USD 1.000.000 é declaradamente não reembolsável — inclusive em caso de indeferimento do pedido ou de extinção do programa.</strong>\n\nO Gold Card foi criado por <strong>Executive Order, não por lei do Congresso</strong>, está sob <strong>litígio de mérito pendente</strong> (AAUP v. DHS), e <strong>não dispensa os requisitos substantivos de EB-1A ou EB-2 NIW</strong>. Em cerca de oito meses de operação, registou <strong>1 aprovação confirmada</strong>.\n\n<strong>A isenção de 270 dias do Substantial Presence Test anunciada para o Platinum Card não tem base normativa identificável</strong> — o SPT é definido em lei federal (IRC §7701(b)(3)) e não pode ser excecionado por ato do Executivo.","sources":[{"t":"USCIS · Form I-140G","u":"https://www.uscis.gov/i-140g"},{"t":"Federal Register · Executive Orders","u":"https://www.federalregister.gov/presidential-documents/executive-orders"},{"t":"CourtListener · AAUP v. DHS (D.D.C.)","u":"https://www.courtlistener.com"},{"t":"Cornell LII · 26 U.S. Code §7701(b) — Substantial Presence Test","u":"https://www.law.cornell.edu/uscode/text/26/7701"}]},{"name":"Caminho à cidadania — N-400","status":"changed","legalBasis":"<strong>INA §316(a)</strong> — 8 U.S.C. §1427(a): regra geral de 5 anos. <strong>INA §319(a)</strong> — 8 U.S.C. §1430(a): 3 anos para cônjuge de cidadão americano. <strong>INA §312</strong> — 8 U.S.C. §1423: requisitos de inglês e <em>civics</em>. <strong>INA §337</strong> — juramento. <strong>8 C.F.R. Parts 316, 319, 335 e 337</strong>. Formulários: N-400, N-445, N-336, N-470, N-600. <strong>Child Citizenship Act of 2000</strong> (Pub. L. 106-395) — INA §320.","desc":"<strong>Regra geral (INA §316):</strong> <strong>18 anos ou mais</strong>; <strong>LPR por, no mínimo, 5 anos</strong> imediatamente anteriores ao protocolo; <strong>residência contínua</strong> de 5 anos; <strong>presença física de, no mínimo, 30 meses</strong> (metade dos 5 anos); <strong>residência de 3 meses</strong> no estado ou distrito do USCIS onde protocola; <em>good moral character</em>; registo no <em>Selective Service</em> (homens que residiram nos EUA entre 18 e 26 anos); inglês; e <em>civics test</em>.\n\n<strong>Regra dos 3 anos (INA §319(a)):</strong> LPR por 3 anos; <strong>casado com cidadão americano e vivendo em união conjugal durante os 3 anos inteiros</strong>; o cônjuge é cidadão durante todos os 3 anos; <strong>presença física de 18 meses</strong>; demais requisitos idênticos.\n\n<strong>Mudança confirmada no <em>civics test</em>:</strong>\n· N-400 protocolado <strong>antes de 20 de outubro de 2025</strong> → <strong>teste de 2008</strong>: banco de 100 questões, 10 perguntadas, <strong>6 acertos</strong> para aprovação;\n· N-400 protocolado <strong>em 20 de outubro de 2025 ou depois</strong> → <strong>teste de 2025</strong>: banco de <strong>128 questões</strong>, <strong>20 perguntadas</strong>, <strong>12 acertos</strong> exigidos.","kv":[{"l":"Regra geral","v":"5 anos de LPR"},{"l":"Cônjuge de cidadão","v":"3 anos"},{"l":"Presença física — 5 anos","v":"30 meses"},{"l":"Presença física — 3 anos","v":"18 meses"},{"l":"Residência no estado","v":"3 meses"},{"l":"Ausência de 6 meses a 1 ano","v":"Presunção rebatível de ruptura"},{"l":"Ausência de 1 ano ou mais","v":"Rompe a residência contínua"},{"l":"Civics test — desde 20/out/2025","v":"128 questões · 12 de 20"},{"l":"N-400 online","v":"USD 710"},{"l":"N-400 papel","v":"USD 760"},{"l":"Taxa reduzida","v":"USD 380"},{"l":"Protocolo antecipado","v":"90 dias antes"}],"requirements":["<strong>18 anos ou mais</strong> na data do protocolo.","<strong>LPR por, no mínimo, 5 anos</strong> imediatamente anteriores ao protocolo (3 anos para cônjuge de cidadão).","<strong>Continuous residence:</strong> ausência de <strong>6 meses a 1 ano</strong> cria <strong>presunção rebatível</strong> de ruptura; ausência de <strong>1 ano ou mais</strong> <strong>rompe</strong> a residência contínua, salvo <strong>Form N-470</strong> (preservação para trabalho qualificado no exterior). Rompido, o relógio reinicia — com regra de 4 anos e 1 dia após o retorno.","<strong>Physical presence</strong> de, no mínimo, <strong>30 meses</strong> (metade dos 5 anos), ou <strong>18 meses</strong> (metade dos 3 anos).","<strong>Residência de 3 meses</strong> no estado ou distrito do USCIS onde protocola.","<strong>Good moral character (GMC)</strong> no período estatutário — o USCIS pode examinar período anterior em situações graves. <strong>Bares permanentes:</strong> homicídio e <em>aggravated felony</em> posterior a 29/nov/1990. <strong>Bares condicionais:</strong> crimes de torpeza moral, embriaguez habitual, poligamia, jogo ilegal, falso testemunho para benefício migratório, <strong>inadimplência de imposto de renda</strong>, <strong>atraso em pensão alimentícia</strong>, e prisão agregada de 180 dias.","<strong>Registo no Selective Service</strong> — homens que residiram nos EUA entre 18 e 26 anos.","<strong>Inglês</strong> — leitura, escrita e fala. <strong>Isenções:</strong> <strong>50/20</strong> (50 anos ou mais e 20 anos de LPR) e <strong>55/15</strong>; a isenção <strong>65/20</strong> tem também versão simplificada do <em>civics</em>, com 20 questões designadas.","<strong>Civics test</strong> — 6 de 10 (teste de 2008) ou <strong>12 de 20</strong> (teste de 2025, para protocolos desde 20/out/2025).","Adesão aos princípios constitucionais e prestação do <strong>Oath of Allegiance</strong>."],"process":[{"step":"Protocolo do N-400","detail":"Online ou em papel. Pode ser protocolado <strong>90 dias antes</strong> de completar 5 (ou 3) anos de LPR.","timing":"90 dias antes"},{"step":"Recibo (I-797C)","detail":"Confirmação de recebimento pelo USCIS.","timing":"2–4 semanas"},{"step":"Biometria","detail":"Em <em>Application Support Center</em>, se exigida.","timing":"3–8 semanas"},{"step":"Entrevista","detail":"Revisão do N-400 e aplicação dos testes de inglês e de <em>civics</em>, no <em>USCIS Field Office</em>.","timing":"Variável por escritório"},{"step":"Decisão (N-652)","detail":"Na mesma data da entrevista, ou em até <strong>120 dias</strong>.","timing":"Até 120 dias"},{"step":"Cerimónia de juramento (N-445)","detail":"Perante o USCIS ou tribunal federal.","timing":"Semanas a meses"},{"step":"Certificado e passaporte","detail":"Certificado de naturalização pelo USCIS; passaporte americano pelo Departamento de Estado.","timing":"—"},{"step":"Indeferimento e recurso","detail":"Recurso <strong>N-336</strong> em 30 dias; depois, revisão judicial <em>de novo</em> perante o <em>District Court</em> (8 U.S.C. §1421(c)).","timing":"30 dias para o N-336"}],"costs":[{"item":"Form N-400 — online","value":"USD 710","note":"Biometria incluída"},{"item":"Form N-400 — papel","value":"USD 760"},{"item":"Taxa reduzida","value":"USD 380","note":"Renda entre 150% e 400% do federal poverty guideline"},{"item":"Isenção integral (Form I-912)","value":"USD 0","note":"Mediante requisitos"},{"item":"Form N-336 (recurso)","value":"A confirmar"},{"item":"Passaporte americano (primeira via, adulto)","value":"≈USD 165","note":"A confirmar"}],"sections":[{"title":"Aumento proposto — ainda não vigente","body":"Há <strong>regra proposta (NPRM)</strong> do DHS elevando a taxa do N-400 em aproximadamente <strong>75% a 80%</strong> — de USD 710 para faixa em torno de <strong>USD 1.280</strong>.\n\n<strong>Em agosto de 2026 é apenas proposta em fase de comentário público, não está em vigor.</strong> <em>Estágio processual atual a verificar em federalregister.gov e uscis.gov.</em>"},{"title":"Regras de família e o Child Citizenship Act","body":"<strong>Cada membro da família naturaliza-se individualmente</strong> — não há naturalização «por dependência» para adultos.\n\n<strong>Filhos menores de 18 anos adquirem cidadania automaticamente</strong> sob o <strong>Child Citizenship Act of 2000</strong> (Pub. L. 106-395), <strong>INA §320</strong>, se: (i) ao menos um dos pais é cidadão americano, por nascimento ou naturalização; (ii) o filho é menor de 18; (iii) é LPR; e (iv) reside nos EUA sob custódia legal e física do pai ou mãe cidadão.\nDocumenta-se com <strong>Form N-600</strong> (<em>Application for Certificate of Citizenship</em>) ou diretamente com passaporte americano."}],"brazilNote":"<strong>Dupla cidadania:</strong> os Estados Unidos <strong>não exigem renúncia</strong> à nacionalidade anterior. Do lado brasileiro, a Constituição Federal, art. 12, §4.º, II, na redação dada pela <strong>EC 131/2023</strong>, restringiu a perda da nacionalidade brasileira essencialmente a <strong>pedido expresso do próprio interessado</strong>. <strong>O brasileiro que se naturaliza americano mantém a nacionalidade brasileira</strong> — e, com ela, as obrigações brasileiras associadas, inclusive as fiscais, enquanto não formalizar a saída fiscal. <em>Redação vigente a confirmar.</em>\n\n<strong>Efeito fiscal decisivo — e irreversível na prática.</strong> A naturalização <strong>converte a tributação mundial de condicional em vinculada à cidadania</strong>:\n· o <strong>green card</strong> pode ser encerrado por <strong>Form I-407</strong>, com o exit tax do §877A incidindo apenas se houver <strong>8 dos últimos 15 anos</strong> de LPR;\n· a <strong>cidadania</strong> só se encerra por <strong>renúncia formal perante consulado</strong> (INA §349(a)(5)), com taxa consular de USD 2.350 <em>(a confirmar)</em>, e o §877A aplica-se <strong>sem o filtro dos 8 anos</strong> — bastam os testes de patrimônio (USD 2.000.000), de imposto médio (USD 211.000 em 2026) ou de certificação.\n\n<strong>Atenção ao <em>good moral character</em>:</strong> a <strong>conformidade fiscal é examinada</strong> na naturalização. Débitos com o IRS, declarações em atraso — inclusive FBAR e Forms 8938, 5471 e 3520 —, ou participação em esquemas de evasão podem fundamentar <strong>recusa</strong>. Para o brasileiro com estruturas no Brasil, a regularização declaratória deve estar concluída <strong>antes</strong> do protocolo do N-400, não depois.\n\n<strong>Perda do green card por ausência:</strong> ausência de <strong>2 anos consecutivos</strong> faz o LPR caducar, com necessidade de <em>Returning Resident visa</em> e critérios discricionários. A <strong>cidadania não caduca</strong> — é a proteção definitiva contra esse risco, ao custo da vinculação fiscal permanente.","sources":[{"t":"USCIS · Citizenship Through Naturalization","u":"https://www.uscis.gov/citizenship/learn-about-citizenship/citizenship-and-naturalization"},{"t":"USCIS · Form N-400, Application for Naturalization","u":"https://www.uscis.gov/n-400"},{"t":"USCIS Policy Manual · Volume 12 — Citizenship and Naturalization","u":"https://www.uscis.gov/policy-manual/volume-12"},{"t":"USCIS · Civics test (2025) e materiais de estudo","u":"https://www.uscis.gov/citizenship/find-study-materials-and-resources"},{"t":"Cornell LII · 8 U.S. Code §1427 — Requirements of naturalization","u":"https://www.law.cornell.edu/uscode/text/8/1427"}]}]},"uy":{"id":"uy","flagCode":"uy","name":"Uruguai","region":"Américas","alert":true,"sumFiscal":"Lei 20.446 — tax holiday 11 anos + 5 a 6%","sumFS":"changed","sumVisa":"Residência MERCOSUL gratuita para brasileiros","sumVS":"ok","fiscal":[{"name":"Territorialidade e a reforma da Lei 20.446 (vigente desde 1/jan/2026)","status":"changed","legalBasis":"Título 7 do Texto Ordenado 2023 (aprovado pelo Decreto 101/024) e Decreto regulamentar 148/007. <strong>Lei n.º 20.446 — Presupuesto Nacional 2025-2029, promulgada em 16/dez/2025</strong>, com vigência das mudanças tributárias desde <strong>1/jan/2026</strong>. Regulamentação: <strong>Decreto n.º 95/026, de 6/mai/2026</strong>. Operacionalização: <strong>Resolução DGI n.º 1.517/026, de 29/jun/2026</strong>.","desc":"O Uruguai adota o <strong>critério da fonte (territorialidade)</strong>: em regra, tributam-se apenas rendas de fonte uruguaia. O IRPF divide-se em <strong>Categoria I</strong> (rendas de capital) e <strong>Categoria II</strong> (rendas do trabalho, escala progressiva).\n\n<strong>A exceção histórica, até 31/dez/2025:</strong> eram tributados a <strong>12%</strong> apenas os <strong>rendimentos de capital mobiliário de fonte estrangeira</strong> — juros e dividendos originados em depósitos, empréstimos, colocações ou créditos junto a entidades não residentes. Ganhos de capital e rendimentos imobiliários do exterior <strong>não eram tributados</strong>.\n\n<strong>A exceção ampliada, desde 1/jan/2026:</strong> a Lei 20.446 alargou a ficção de fonte uruguaia. Passam a ser alcançados pelo IRPF Categoria I, obtidos por residentes fiscais uruguaios:\n\n| Renda do exterior | Até 2025 | Desde 1/jan/2026 |\n· Juros de entidades não residentes → 12% → <strong>12%</strong>\n· Dividendos de entidades não residentes → 12% → <strong>12%</strong>\n· <strong>Rendimentos de capital imobiliário</strong> (aluguéis de imóveis no exterior) → não tributado → <strong>12%</strong>\n· <strong>Incrementos patrimoniais</strong> (venda de ações, participações, imóveis, planos de <em>equity</em>) → não tributado → <strong>12%</strong>\n\n<strong>Em uma frase:</strong> o Uruguai deixou de tributar apenas juros e dividendos do exterior, passou a tributar também rendimentos imobiliários e ganhos de capital estrangeiros, extinguiu a opção dos 7% vitalícios para novos residentes, e condicionou o <em>tax holiday</em> a investimento para quem obtém residência por causal diferente dos 183 dias.","kv":[{"l":"Princípio","v":"Territorialidade, com exceções ampliadas"},{"l":"Juros e dividendos do exterior","v":"12%"},{"l":"Aluguéis do exterior","v":"12% (novo em 2026)"},{"l":"Ganhos de capital do exterior","v":"12% (novo em 2026)"},{"l":"Retenção na fonte local","v":"Bancos e corretoras uruguaias"},{"l":"IRPF Categoria II","v":"0% a 36% (8 faixas)"},{"l":"IRAE (empresas)","v":"25%"},{"l":"IVA","v":"22% (mínima 10%)"},{"l":"Imposto ao Patrimônio (PF)","v":"0,2% a 0,7% · territorial"},{"l":"Imposto sucessório","v":"Inexistente desde 1974"},{"l":"ITP na sucessão de imóvel","v":"3% ou 4%"}],"requirements":["A tributação alcança quem é <strong>residente fiscal uruguaio</strong> — a residência fiscal é aferida autonomamente, e é independente da residência legal migratória.","<strong>Retenção na fonte</strong> por bancos, corretoras, custodiantes e demais entidades uruguaias que intermedeiem a gestão de investimentos.","<strong>Rendas sem retenção:</strong> regime de <strong>pagamentos semestrais</strong> aplicando 12% sobre a renda acumulada no período; o contribuinte pode optar por torná-los <strong>definitivos</strong>, ficando dispensado da declaração anual quanto a essas rendas.","<strong>Transparência fiscal:</strong> o Decreto 95/026 regula a atribuição ao residente uruguaio de rendas auferidas por <strong>entidades não residentes interpostas</strong>. <em>A extensão exata — quais entidades, qual percentual de participação, se há look-through automático — precisa ser conferida no texto do Decreto; é decisiva para estruturas com holdings offshore, trusts e fundos.</em>"],"sections":[{"title":"Regime transitório de 2026","body":"Como o imposto começou a incidir em janeiro mas a regulamentação só saiu em maio, a <strong>DGI suspendeu retenções e antecipações dos primeiros meses</strong>; a arrecadação do primeiro semestre concentrou-se em <strong>julho de 2026</strong>.\n\n<em>Ponto de alto impacto econômico, não confirmado:</em> uma fonte profissional menciona <strong>alíquota efetiva de 2,4%</strong> para determinados incrementos patrimoniais, o que sugere aplicação de <strong>base ficta de 20% sobre o preço × 12%</strong> — mecânica análoga à do ganho de capital imobiliário interno uruguaio. <strong>A existência, o percentual da base ficta e as hipóteses de aplicação devem ser conferidos no texto do Decreto 95/026 antes de qualquer cálculo.</strong>\n\n<em>Segundo ponto não confirmado:</em> uma fonte menciona <strong>redução da alíquota de 12% para 8%</strong> nos casos em que há retenção praticada por agente uruguaio. Se confirmado, cria incentivo relevante à custódia local."},{"title":"Critérios de residência fiscal","body":"<strong>Base legal:</strong> art. 6.º do Título 7 do Texto Ordenado; Decreto 148/007; <strong>Decreto 163/020, de 11/jun/2020</strong>, que acrescentou duas hipóteses de «base de interesses econômicos».\n\n<strong>A. Permanência física<
