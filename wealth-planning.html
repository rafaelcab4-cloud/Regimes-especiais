ong>merece correção técnica</strong>: a norma não exige CDT, exige <strong>«acordo de cooperação administrativa em matéria fiscal em vigor»</strong>. E Brasil e Grécia são <strong>ambos partes da Convenção Multilateral sobre Assistência Mútua Administrativa em Matéria Fiscal</strong> (OCDE/Conselho da Europa, 1988, alterada pelo Protocolo de 2010) e do <strong>MCAA/CRS</strong>. Em tese, isso satisfaz o requisito.\n\n<strong>Porém não foi possível localizar circular, decisão ou lista da AADE</strong> que (i) confirme a aceitação de instrumento multilateral em lugar de CDT bilateral para efeitos do art. 5B, nem (ii) enumere o Brasil como Estado de origem elegível.\n\n<strong>Providência recomendada antes de qualquer decisão:</strong> obter confirmação escrita do Departamento de Tributação Alternativa da Δ.Ο.Υ. Κατοίκων Εξωτερικού και Εναλλακτικής Φορολόγησης Φορολογικών Κατοίκων Ημεδαπής (AADE, Atenas).\n\n<strong>Alternativa de mitigação:</strong> fazer a transferência da residência fiscal a partir de um Estado da UE/EEE ou de país com CDT com a Grécia — solução que exige planeamento de vários anos e cuidado com os requisitos de não residência prévia (5 em 6 anos para o 5B).\n\n<strong>Nota sobre o acordo previdenciário:</strong> existe Acordo de Previdência Social Brasil–Grécia em vigor, mas ele <strong>não satisfaz</strong> o requisito do art. 5B — o instrumento a invocar é a Convenção Multilateral de Assistência Administrativa Mútua <em>em matéria fiscal</em>, não o acordo previdenciário.\n\n<strong>Dupla tributação da pensão:</strong> sem CDT, a pensão do INSS pode ser tributada nos dois países — no Brasil como fonte pagadora, pela tabela progressiva (após o STF, Tema 1.174, que afastou a alíquota fixa de 25%), e na Grécia como Estado de residência, a 7%. O alívio depende do reconhecimento de reciprocidade de tratamento pela Receita Federal, que não pôde ser confirmado.\n\n<strong>Saída fiscal do Brasil:</strong> CSDP e DSDP são indispensáveis — sem elas, todo o benefício grego é neutralizado pela tributação brasileira sobre o rendimento mundial, sem crédito garantido.","warning":"<strong>Não recomende nem estruture o art. 5B para cliente vindo do Brasil sem confirmação escrita da AADE</strong> de que (i) a Convenção Multilateral de Assistência Administrativa Mútua satisfaz o requisito legal de «acordo de cooperação administrativa em matéria fiscal», e (ii) o Brasil é Estado de origem elegível.\n\nO art. 5A não tem esse requisito e é, por isso, o único dos três regimes gregos sem obstáculo estrutural identificado para quem vem do Brasil.","sources":[{"t":"AADE · Alternative Taxation (5A, 5B, 5C)","u":"https://www.aade.gr/en/greeks-abroad-non-residents/income-taxation/alternative-taxation-5a-5b-5c"},{"t":"AADE · FAQs para gregos no exterior e não residentes (PDF, 26/nov/2025)","u":"https://www.aade.gr/sites/default/files/2025-11/FAQs_omogeneis_en_0.pdf"},{"t":"AADE · Questões de cooperação administrativa internacional","u":"https://www.aade.gr/en/taxonomy/term/29511"},{"t":"OCDE · Convenção sobre assistência administrativa mútua em matéria fiscal","u":"https://www.oecd.org/en/topics/convention-on-mutual-administrative-assistance-in-tax-matters.html"},{"t":"e-EFKA · Acordo de Previdência Social Grécia–Brasil, formulário GR-B3 (PDF)","u":"https://www.e-efka.gov.gr/sites/default/files/2019-01/GR-B3%20%CE%91%CE%99%CE%A4%CE%97%CE%A3%CE%97%20%CE%93%CE%99%CE%91%20%CE%A3%CE%A5%CE%9D%CE%A4%CE%91%CE%9E%CE%97.pdf"}]},{"name":"Art. 5C — Isenção de 50% para trabalhadores e profissionais","status":"changed","legalBasis":"Art. 5C da Lei 4172/2013, introduzido pela Lei 4758/2020, de 4/dez/2020 («brain gain»). Decisão de execução do Governador da AADE (a referência usualmente citada é A.1087/2021, não confirmada). <strong>Alterado materialmente pela Lei 5222/2025, art. 206(7)</strong> — ΦΕΚ Α΄ 134, de 28/jul/2025.","desc":"Quem transfere a residência fiscal para a Grécia e passa a auferir <strong>rendimento do trabalho dependente e/ou de atividade empresarial ou profissional de fonte grega</strong> beneficia de <strong>isenção de 50% desse rendimento</strong>, tanto do imposto sobre o rendimento quanto da contribuição especial de solidariedade, durante <strong>7 exercícios fiscais</strong> consecutivos.\n\n<strong>Diferenças estruturais em relação aos arts. 5A e 5B:</strong>\n· incide sobre rendimento de <strong>fonte grega</strong> (os outros dois incidem sobre fonte estrangeira);\n· <strong>não</strong> exige investimento;\n· <strong>não</strong> é imposto fixo — é uma exclusão de 50% da base tributável, aplicando-se depois a escala progressiva normal sobre a metade tributável;\n· aplica-se também a rendimentos de <strong>atividade empresarial</strong> iniciada na Grécia.\n\n<strong>Mudança de 28/jul/2025:</strong> a Lei 5222/2025 <strong>aboliu o requisito de criação de «novo posto de trabalho»</strong>, aplicando-se a novos pedidos e aos pedidos pendentes de análise naquela data. O indivíduo qualifica-se independentemente de o posto ser de nova criação, de assumir posição já existente ou de constituir a própria atividade na Grécia.","kv":[{"l":"Benefício","v":"Isenção de 50% da base"},{"l":"Base","v":"Rendimento de fonte grega"},{"l":"Duração","v":"7 exercícios fiscais"},{"l":"Investimento exigido","v":"Nenhum"},{"l":"Não residência prévia","v":"5 dos 6 anos anteriores"},{"l":"Compromisso de permanência","v":"Mínimo 2 anos"},{"l":"Novo posto de trabalho","v":"Requisito abolido em 28/jul/2025"},{"l":"Acordo com país de origem","v":"Exigido (UE/EEE ou cooperação)"},{"l":"Contribuições EFKA","v":"Sobre 100% do rendimento"}],"requirements":["<strong>Não ter sido residente fiscal grego em 5 dos 6 anos</strong> anteriores à transferência da residência fiscal. <em>Uma das fontes refere «5 dos 7 anos» — divergência a resolver no texto consolidado do CIR.</em>","Transferir a residência fiscal <strong>a partir de Estado-Membro da UE/EEE ou de Estado com acordo de cooperação administrativa em matéria fiscal em vigor com a Grécia</strong>.","Prestar serviços na Grécia — como <strong>trabalhador dependente de empregador grego</strong>, ou como <strong>profissional independente / atividade empresarial</strong> exercida na Grécia.","<strong>Declarar a intenção de permanecer na Grécia por, no mínimo, 2 anos.</strong>","Transferir <strong>efetivamente</strong> a residência fiscal.","<strong>Requisito de «novo posto de trabalho»: ABOLIDO</strong> pela Lei 5222/2025, com efeitos desde 28/jul/2025."],"process":[{"step":"AFM, AMKA e inscrição no EFKA","detail":"Obtenção do número fiscal e do número de seguridade social, com inscrição no e-EFKA.","timing":"1–4 semanas"},{"step":"Contrato de trabalho ou abertura de atividade","detail":"Celebração de contrato com empregador grego, ou abertura de atividade (έναρξη εργασιών) junto à AADE.","timing":"Variável"},{"step":"Pedido de adesão ao regime","detail":"Apresentado à repartição fiscal competente (Δ.Ο.Υ.). O prazo usualmente indicado é <strong>até 31 de março</strong> do exercício relevante.\n<em>Nota de verificação: a Lei 5313/2026 aboliu expressamente o prazo de 31 de março para os arts. 5A e 5B; não foi possível confirmar se a abolição alcança também o art. 5C.</em>","timing":"31 de março (a confirmar)"},{"step":"Decisão","detail":"Análise e decisão pela AADE. <em>Não foi possível confirmar se se aplica o prazo de 60 dias dos arts. 5A e 5B.</em>","timing":"A confirmar"},{"step":"Aplicação da isenção","detail":"A isenção aplica-se na retenção na fonte pelo empregador e/ou na declaração anual de rendimento.","timing":"Anual"},{"step":"Manutenção durante 7 exercícios","detail":"O benefício mantém-se por 7 exercícios fiscais consecutivos, sem prorrogação.","timing":"7 anos"}],"costs":[{"item":"Imposto efetivo","value":"9%–44% sobre 50% do rendimento","note":"Escala progressiva aplicada à metade tributável"},{"item":"Investimento mínimo","value":"Nenhum"},{"item":"Taxa governamental de análise","value":"Não identificada"},{"item":"Contribuições sociais e-EFKA — trabalhador dependente","value":"35,16% do bruto","note":"13,37% empregado + 21,79% empregador; teto de €7.761,94/mês desde jan/2026"},{"item":"Contribuições e-EFKA — profissional independente","value":"A partir de ≈€220/mês","note":"Classes fixas por faixa; Circular e-EFKA n.º 6/2026, mais €10 de OAED"}],"sections":[{"title":"Como se sai do regime","body":"<strong>Cessação de qualquer condição</strong> — deixar de trabalhar ou de exercer atividade na Grécia, deixar de ser residente fiscal grego, ou sair antes de completar os 2 anos declarados: o indivíduo deixa de estar sujeito ao regime especial e passa a ser tributado sobre a totalidade do rendimento grego a partir daí.\n\n<strong>Termo dos 7 anos</strong> — tributação ordinária integral.\n\nNas fontes consultadas, o efeito da cessação é descrito como <strong>prospetivo</strong> («onwards»), não retroativo. <em>Nota de verificação: confirmar se há recaptura (clawback) do benefício já gozado, em especial no caso de saída antes de completar os 2 anos.</em>"},{"title":"Sobreposição com o visto de nômade digital","body":"Um nômade digital que se torne residente fiscal grego e passe a exercer atividade empresarial ou profissional <strong>na Grécia</strong> pode, em tese, candidatar-se ao art. 5C.\n\nHá, contudo, uma <strong>tensão estrutural</strong>: o visto de nômade digital exige que o empregador ou os clientes estejam <strong>fora</strong> da Grécia, enquanto o art. 5C incide sobre rendimento de <strong>fonte grega</strong>. A qualificação da fonte do rendimento de um profissional independente estabelecido na Grécia que fatura para o exterior é matéria técnica que exige análise casuística.\n\n<em>Nota de verificação — item crítico: não foi localizada posição oficial da AADE sobre a aplicação do art. 5C a titulares de visto de nômade digital nem sobre a qualificação da fonte do rendimento nesse desenho.</em>"}],"brazilNote":"Aplica-se aqui a <strong>mesma incerteza do art. 5B</strong>: a norma admite Estado da UE/EEE <strong>ou</strong> Estado com acordo de cooperação administrativa em matéria fiscal em vigor. Brasil e Grécia são ambos partes da Convenção Multilateral de Assistência Administrativa Mútua e do MCAA/CRS, o que em tese satisfaz o requisito — mas <strong>não foi possível confirmar a aceitação pela AADE nem a inclusão do Brasil em lista de Estados elegíveis</strong>.\n\nConfirmação escrita junto ao Departamento de Tributação Alternativa da AADE é indispensável antes de estruturar a operação para cliente vindo do Brasil.\n\n<strong>Contribuições sociais:</strong> a isenção do art. 5C é <strong>fiscal, não contributiva</strong> — as contribuições ao e-EFKA incidem sobre 100% do rendimento. <em>Nota de verificação: confirmar se a base do EFKA é reduzida sob o regime.</em>\n\nO Acordo de Previdência Social Brasil–Grécia permite <strong>totalização de tempos de contribuição</strong> entre INSS e e-EFKA, o que é relevante para quem exerce atividade dependente ou autónoma na Grécia sob este regime.\n\n<strong>Saída fiscal do Brasil</strong> (CSDP e DSDP) permanece indispensável.","sources":[{"t":"EY Greece · Incentivos fiscais para transferência de residência (Lei 4758/2020)","u":"https://www.ey.com/en_gr/technical/tax/tax-alerts/greece-tax-incentives-for-the-transfer-of-tax-residence-of-indiv"},{"t":"KPMG Greece · Tax Updates, 6/ago/2025 (Lei 5222/2025)","u":"https://kpmg.com/gr/en/insights/2025/08/tax-updates-06082025.html"},{"t":"PwC Greece · Tax Flash sobre o art. 5C (PDF)","u":"https://www.pwc.com/gr/en/newsletters/tax-flash-%205c_en.pdf"},{"t":"International Tax Review · Grécia introduz isenção de 50% para profissionais realocados","u":"https://www.internationaltaxreview.com/article/2a68rfy5bw2ycq1ybdoq7/greece-introduces-50-tax-break-for-relocating-professionals"}]},{"name":"Tributação ordinária — escalas, capital, ENFIA e sucessões","status":"changed","legalBasis":"Lei 4172/2013 (Código do Imposto sobre o Rendimento), art. 15, com a redação da Lei 5246/2025 (ΦΕΚ Α΄ 198, de 11/nov/2025), com efeitos desde 1/jan/2026. ENFIA: Lei 4223/2013 e alterações. Sucessões e doações: Lei 2961/2001. Contribuições: Circular e-EFKA n.º 6/2026.","desc":"Quadro da tributação ordinária grega, aplicável a quem não está (ou deixou de estar) sob os arts. 5A, 5B ou 5C — e, em todos os casos, ao <strong>rendimento de fonte grega</strong>.\n\nA <strong>Lei 5246/2025</strong> reformou a escala do imposto sobre o rendimento com efeitos a partir de <strong>1 de janeiro de 2026</strong>, criando um novo escalão de 39% e deslocando o topo de 44% de €40.000 para €60.000. A <strong>contribuição especial de solidariedade foi abolida</strong> para rendimento do setor privado e pensões a partir de 2026.","kv":[{"l":"IRPF — faixa inicial","v":"9% até €10.000"},{"l":"IRPF — topo","v":"44% acima de €60.000"},{"l":"Contribuição de solidariedade","v":"Abolida em 2026"},{"l":"Dividendos","v":"5%"},{"l":"Juros","v":"15%"},{"l":"Mais-valias em ações","v":"15% (com isenções)"},{"l":"Mais-valia imobiliária (PF)","v":"Suspensa até 31/dez/2026"},{"l":"ENFIA — imposto principal","v":"≈€2,50 a €16,25/m²"},{"l":"Sucessões — Categoria A","v":"1% a 10%, isento até €150.000"},{"l":"Transmissão imobiliária (ΦΜΑ)","v":"3,09%"},{"l":"IVA em construção nova","v":"Suspenso até 31/dez/2026"},{"l":"e-EFKA — teto mensal","v":"€7.761,94"}],"sections":[{"title":"Escala do imposto sobre o rendimento — 2026","body":"<strong>Escala vigente desde 1/jan/2026</strong> (Lei 5246/2025), com a escala anterior entre parênteses:\n\n· €0 – €10.000 → <strong>9%</strong> (9%)\n· €10.001 – €20.000 → <strong>20%</strong> (22%)\n· €20.001 – €30.000 → <strong>26%</strong> (28%)\n· €30.001 – €40.000 → <strong>34%</strong> (36%)\n· €40.001 – €60.000 → <strong>39%</strong> (escalão novo; antes já 44%)\n· acima de €60.000 → <strong>44%</strong> (44% já a partir de €40.000)\n\n<strong>Reduções por perfil:</strong>\n· contribuintes com <strong>menos de 25 anos</strong>: alíquota de <strong>0%</strong> sobre rendimento até €20.000;\n· contribuintes entre <strong>26 e 30 anos</strong>: alíquota de <strong>9%</strong> no segundo escalão (€10.000–€20.000);\n· <strong>famílias com filhos</strong>: a alíquota do escalão €10.000–€20.000 é reduzida em função do número de filhos, chegando a <strong>0% para agregados com 4 ou mais filhos dependentes</strong>."},{"title":"Rendimento de capital e mais-valias","body":"<strong>Dividendos: 5%</strong>, com retenção na fonte e esgotamento da obrigação.\n<strong>Juros: 15%</strong>, com retenção na fonte e esgotamento da obrigação.\n<strong>Royalties:</strong> <em>alíquota a confirmar (usualmente citada como 20%).</em>\n<strong>Rendimento predial (aluguéis):</strong> escala progressiva de <strong>15% a 45%</strong> em 2026. <em>Os limites dos escalões devem ser confirmados.</em>\n\n<strong>Mais-valias:</strong>\n· ações <strong>não cotadas</strong> → 15%\n· ações <strong>cotadas</strong>, alienante com <strong>≥ 0,5%</strong> do capital → 15%\n· ações <strong>cotadas</strong>, alienante com <strong>&lt; 0,5%</strong> do capital → <strong>isento</strong>\n· participações em ΙΚΕ/ΕΠΕ e sociedades de pessoas → 15%\n· obrigações do Estado, bilhetes do tesouro, obrigações societárias e derivados → 15%\n· fundos <strong>UCITS</strong> gregos e da UE/EEE → <strong>isento</strong>\n· alienação de empresa ou estabelecimento → 15%\n· <strong>imóveis (pessoas físicas)</strong> → 15% na lei, mas com <strong>suspensão em vigor até 31/dez/2026</strong>: na prática, o ganho de capital imobiliário de pessoa física <strong>não é tributado</strong> durante o período de suspensão.\n\n<em>Alerta de janela temporal:</em> a suspensão da mais-valia imobiliária vai até 31/dez/2026, e há notícias de julho de 2026 sobre possibilidade de extensão ou mesmo de eliminação definitiva do imposto. <em>Confirmar antes de qualquer planeamento de desinvestimento.</em>"},{"title":"ENFIA — imposto anual sobre imóveis","body":"Estrutura em camadas:\n\n<strong>Imposto principal:</strong> aproximadamente <strong>€2,50 a €16,25 por m²</strong>, conforme a zona (τιμή ζώνης) e o tipo de imóvel.\n\n<strong>Sobretaxa patrimonial</strong> — incide quando o valor total tributável do património imobiliário excede €500.000:\n· €500.000 – €650.000 → +5%\n· €650.000 – €800.000 → +10%\n· €800.000 – €1.000.000 → +15%\n· acima de €1.000.000 → <strong>+20%</strong>\n\n<strong>Reduções automáticas para patrimónios menores:</strong>\n· até €100.000 → −30% · até €150.000 → −25% · até €250.000 → −20%\n· até €300.000 → −15% · até €400.000 → −10% · acima de €400.000 → sem redução\n\n<strong>Reduções específicas de 2026:</strong>\n· <strong>−50%</strong> para residentes fiscais na Grécia cuja residência principal se situe em localidade com até <strong>1.500 habitantes</strong> (1.700 em certas regiões de fronteira);\n· <strong>−5% a −10%</strong> por instalação de painéis solares certificados, bombas de calor, ou certificação energética Classe A.\n\nPagamento parcelado, com calendário anual publicado pela AADE."},{"title":"Imposto sucessório e de doação","body":"<strong>Categoria A</strong> — cônjuge; descendentes de 1.º grau (filhos); descendentes consanguíneos de 2.º grau (netos); ascendentes consanguíneos de 1.º grau (pais).\nAbatimento: <strong>€150.000 por beneficiário</strong>. Alíquotas: <strong>1% a 10%</strong>.\n\n<strong>Categoria B</strong> — demais parentes. Abatimento: <strong>€30.000</strong>. Alíquotas: <strong>5% a 20%</strong>.\n\n<strong>Categoria C</strong> — não parentes, incluindo companheiros não casados. Abatimento: <strong>€6.000</strong>. Alíquotas: <strong>20% a 40%</strong>.\n\n<strong>Regimes especiais:</strong>\n· <strong>Doação em vida de pais a filhos (γονική παροχή):</strong> abatimento único de <strong>€800.000</strong> para beneficiários da Categoria A, com alíquota fixa de 10% sobre o excedente. Aplica-se a <strong>doações em vida</strong>, não a sucessões causa mortis.\n· <strong>Cônjuge sobrevivo</strong> de casamento com pelo menos 5 anos e filhos menores: abatimento adicional de <strong>€400.000 por beneficiário</strong>.\n· <strong>Isenção do art. 5A:</strong> o não-domiciliado admitido ao regime fica isento sobre bens móveis situados no exterior.\n\n<strong>Base de cálculo de imóveis:</strong> o <strong>valor objetivo</strong> (αντικειμενική αξία), determinado por fatores do Ministério das Finanças, à data do óbito.\n\n<strong>Âmbito territorial:</strong> o imposto sucessório grego incide sobre todo bem móvel e imóvel situado na Grécia, independentemente da residência do falecido ou dos herdeiros.\n\n<em>Nota de verificação: os limites exatos das faixas dentro de cada categoria não puderam ser confirmados em fonte oficial. Verificar em aade.gr e na Lei 2961/2001 antes de qualquer quantificação.</em>"},{"title":"Transmissão imobiliária, IVA e contribuições sociais","body":"<strong>Imposto de transmissão (ΦΜΑ): 3,09%</strong> (3% mais 0,3% de sobretaxa municipal), incidente sobre o <strong>maior</strong> entre o preço de venda e o valor objetivo.\n\n<strong>IVA sobre construção nova:</strong> taxa normal de 24%, mas <strong>suspensa até 31/dez/2026</strong> pela Lei 5246/2025 (suspensão introduzida originalmente pela Lei 4646/2019). Enquanto suspensa, a construção nova elegível paga <strong>3,09% de ΦΜΑ em vez de 24% de IVA</strong>. O regime é opcional para o promotor, que pode preferir aplicar o IVA para recuperar o imposto a montante.\n\n<strong>Custos acessórios de aquisição</strong> — notário, registo predial e cadastro, honorários advocatícios e due diligence: indicações de mercado apontam para <strong>7% a 10% do preço do imóvel</strong> no conjunto.\n\n<strong>Contribuições sociais e-EFKA 2026 — trabalhador dependente:</strong>\n· alíquota global de <strong>35,16%</strong> do salário bruto\n· parte do trabalhador: <strong>13,37%</strong>\n· parte do empregador: <strong>21,79%</strong>\n· <strong>teto contributivo mensal: €7.761,94</strong> de salário bruto, desde janeiro de 2026\n\n<strong>Trabalhador independente:</strong> montantes fixos mensais por classe de rendimento, a partir de aproximadamente <strong>€220/mês</strong>, mais €10 de OAED. Os montantes de cada classe constam da <strong>Circular e-EFKA n.º 6/2026</strong>."},{"title":"Regime de family office (art. 71H)","body":"A reforma de 2025 alterou o regime grego de family office em dois pontos com efeito direto para famílias brasileiras:\n\n<strong>1. Âmbito subjetivo alargado</strong> para incluir <strong>pessoas físicas residentes fiscais no estrangeiro</strong> — o family office estabelecido na Grécia deixa de estar limitado a gerir o património de residentes fiscais gregos.\n\n<strong>2. Cláusula de segurança quanto ao <em>place of effective management</em>:</strong> a residência fiscal de entidades estrangeiras detidas pela família <strong>não pode ser contestada</strong> com base na prestação de serviços pelo family office grego. A norma confirma que a prestação de serviços a entidades estrangeiras detidas, direta ou indiretamente, pelos indivíduos ou seus familiares <strong>não implica</strong> que tais entidades sejam efetivamente geridas a partir da Grécia.\n\nEsta segunda regra é operacionalmente relevante para estruturas offshore de famílias brasileiras que instalem um family office na Grécia.\n\n<em>Nota de verificação: o modelo de tributação do family office grego (margem cost-plus) não pôde ser confirmado. Verificar em aade.gr e no ΦΕΚ da lei de 2025.</em>"}],"brazilNote":"Sem CDT Brasil–Grécia, o residente fiscal brasileiro que <strong>mantenha</strong> a residência brasileira e tenha ativos na Grécia enfrenta tributação nos dois países, com alívio dependente do reconhecimento de reciprocidade pela RFB.\n\n<strong>Rendimentos gregos para residente fiscal brasileiro:</strong>\n· <strong>Aluguéis de imóvel na Grécia</strong> — Carnê-Leão Web, tabela progressiva mensal, alíquota marginal até 27,5%, além do ENFIA grego;\n· <strong>Aplicações financeiras no exterior</strong> (Lei 14.754/2023) — <strong>15% definitivo</strong>, apurado anualmente na DIRPF;\n· <strong>Lucros de entidades controladas no exterior</strong> — 15% em regime de competência, tributação automática independentemente de distribuição (Lei 14.754/2023, regulamentada pela IN RFB 2.180/2024, com efeitos desde 1/jan/2024);\n· <strong>Trusts</strong> — regime específico de transparência fiscal da Lei 14.754/2023;\n· <strong>Ganho de capital na alienação de imóvel grego</strong> — alíquotas progressivas de 15% a 22,5%;\n· <strong>Obrigação acessória</strong> — Declaração de Capitais Brasileiros no Exterior (CBE) ao Banco Central, quando atingidos os limiares regulamentares.\n\n<strong>Interação crítica:</strong> um brasileiro que mantenha residência fiscal no Brasil e adquira imóvel na Grécia paga <strong>ENFIA na Grécia e IRPF sobre aluguéis no Brasil</strong>, sem CDT que resolva a sobreposição, e com crédito por imposto grego dependente do reconhecimento de reciprocidade pela Receita Federal.\n\n<strong>Sucessões:</strong> o imposto sucessório grego incide sobre bens situados na Grécia independentemente da residência do falecido ou dos herdeiros. Do lado brasileiro, o ITCMD sobre bens no exterior permanece inexigível na ausência de lei complementar federal (STF, Tema 825 e ADI 6.830), com o <strong>PLP 108/2024</strong> como fator de risco a monitorar. Existe hoje uma janela em que bens móveis no exterior podem escapar simultaneamente ao ITCMD brasileiro e — sob o art. 5A — ao imposto sucessório grego; <strong>essa janela é instável e depende diretamente da não entrada em vigor do PLP 108</strong>.","sources":[{"t":"AADE · Tributação do rendimento","u":"https://www.aade.gr/en/greeks-abroad-non-residents/income-taxation/tax-incentives-order-attract-new-tax-residents"},{"t":"AADE · Imposto sucessório","u":"https://www.aade.gr/en/greeks-abroad-non-residents/property-taxation/inheritance-tax"},{"t":"AADE · Tributação de doações e provisões parentais","u":"https://www.aade.gr/en/greeks-abroad-non-residents/property-taxation/taxation-gifts-and-parental-provisions"},{"t":"AADE · ENFIA — pagamento 2026, 1.ª prestação","u":"https://www.aade.gr/en/node/15200"},{"t":"Lei 5246/2025 (ΦΕΚ Α΄ 198, 11/nov/2025) — texto consolidado","u":"https://www.e-nomothesia.gr/kat-oikonomia/n-5246-2025.html"},{"t":"Ministério da Economia e Finanças · Guia fiscal — tributação do capital","u":"https://minfin.gov.gr/en/tax-policy/tax-guide/capital-taxation/"},{"t":"Zepos & Yannopoulos · Family offices gregos — novo enquadramento","u":"https://www.zeya.com/newsletters/greek-family-offices-newly-evolved-framework"}]}],"visa":[{"name":"Golden Visa — Autorização de Residência Permanente para Investidor","status":"changed","legalBasis":"Lei 5038/2023 (Código de Imigração de 2023), arts. 99 e 100. Reprecificação e restrições: Lei 5100/2024, art. 64. Prorrogação do regime transitório: Lei 5167/2024. <strong>Novo Código de Imigração: Lei 5275/2026 (ΦΕΚ Α΄ 17, de 6/fev/2026)</strong>, que transpõe a Diretiva (UE) 2024/1233. Regime anterior: Lei 4251/2014, art. 16.","desc":"Autorização de residência permanente concedida a nacional de país terceiro que realize investimento qualificado na Grécia. <strong>Não há requisito de permanência mínima</strong> na Grécia para manter ou renovar a autorização.\n\n<strong>Limiares imobiliários por zona</strong> (regime em vigor em 2026):\n· <strong>€800.000</strong> — zonas de alta pressão: Unidade Regional da Ática (incluindo Grande Atenas), Município de Salónica, Míconos, Thira (Santorini) e ilhas com população superior a 3.100 habitantes (cerca de 32 ilhas, incluindo Creta, Rodes, Corfu e Zakynthos). Área mínima de <strong>120 m²</strong>.\n· <strong>€400.000</strong> — restante território. Área mínima de <strong>120 m²</strong>.\n· <strong>€250.000</strong> — imóvel de <strong>conversão de uso</strong> (áreas principais convertidas de outro uso para uso residencial), ou <strong>edifício classificado</strong> objeto de restauro ou reconstrução integral.\n· <strong>€250.000</strong> — <strong>startup inscrita no registo nacional Elevate Greece</strong> (via criada pela Lei 5275/2026).\n\n<strong>Regra do imóvel único:</strong> o investimento deve concentrar-se num <strong>único imóvel</strong> — não é permitido somar vários imóveis de menor valor para atingir o limiar.\n\n<strong>Mudança da Lei 5275/2026:</strong> o prazo de validade de 5 anos passou a correr <strong>da data de emissão do cartão de residência</strong>, e não da data do pedido — antes, o tempo de espera pela decisão consumia a própria validade da autorização. A lei introduziu ainda <strong>distribuição automática de processos</strong> ao serviço de migração com menor pendência.","kv":[{"l":"Zona de alta pressão","v":"€800.000 · mín. 120 m²"},{"l":"Restante território","v":"€400.000 · mín. 120 m²"},{"l":"Conversão de uso","v":"€250.000"},{"l":"Edifício classificado","v":"€250.000"},{"l":"Startup (Elevate Greece)","v":"€250.000"},{"l":"Contribuição de capital","v":"€500.000"},{"l":"Depósito bancário a prazo","v":"€500.000 · mín. 12 meses"},{"l":"Obrigações do Tesouro","v":"€500.000 · maturidade ≥ 3 anos"},{"l":"Fundo de Investimento Alternativo","v":"€350.000"},{"l":"Validade","v":"5 anos, renovável"},{"l":"Permanência mínima exigida","v":"Nenhuma"},{"l":"Aluguel de curta duração","v":"Proibido · coima de €50.000"},{"l":"Prazo total típico","v":"4–9 meses"}],"requirements":["Ser <strong>nacional de país terceiro</strong> (não UE/EEE) e ter <strong>18 anos ou mais</strong>.","Realizar investimento imobiliário no montante e nas condições da zona aplicável — <strong>imóvel único</strong>, área principal de <strong>pelo menos 120 m²</strong> nos escalões de €400.000 e €800.000.","Na via de <strong>conversão de uso (€250.000)</strong>, a mudança de uso deve estar <strong>concluída antes da apresentação</strong> do pedido de autorização.","Investimento <strong>integralmente pago</strong>, com escritura notarial formalizada e registada no Cadastro (Κτηματολόγιο) ou Conservatória.","Pagamento por <strong>meios bancários rastreáveis</strong> — transferência para conta grega ou cheque bancário; não em numerário.","Deter <strong>seguro de saúde</strong> válido na Grécia.","Apresentar <strong>registo criminal</strong> do país de origem ou de residência, apostilado e traduzido.","Não constituir ameaça à ordem pública ou à segurança, e não constar do SIS.","Comprometer-se a <strong>não arrendar o imóvel em regime de curta duração</strong>.","Prestar <strong>dados biométricos presencialmente</strong> na Grécia (ou em consulado, quando disponível)."],"process":[{"step":"AFM e conta bancária grega","detail":"Obtenção do número fiscal grego junto da AADE e abertura de conta em banco grego, indispensável para a rastreabilidade do pagamento.","timing":"2–4 semanas"},{"step":"Procuração ao advogado grego","detail":"Outorga de procuração, apostilada e traduzida, perante notário ou consulado grego no Brasil.","timing":"1–3 semanas"},{"step":"Due diligence do imóvel","detail":"Verificação de título, ónus, licenças, conformidade urbanística, <strong>elegibilidade da zona</strong> e <strong>área principal ≥ 120 m²</strong>. Envolve advogado, engenheiro civil e consulta ao Cadastro (Κτηματολόγιο).","timing":"2–6 semanas"},{"step":"Escritura e pagamento do ΦΜΑ","detail":"Escritura de compra e venda perante notário, com pagamento do imposto de transmissão de <strong>3,09%</strong> sobre o maior entre preço e valor objetivo.","timing":"1–4 semanas"},{"step":"Registo","detail":"Registo da aquisição no Cadastro (Κτηματολόγιο) ou na Conservatória (Υποθηκοφυλακείο).","timing":"1–8 semanas"},{"step":"Submissão do pedido","detail":"Pedido de autorização de residência permanente para investidor, apresentado ao <strong>Ministério da Migração e Asilo</strong>. A Lei 5275/2026 introduziu <strong>distribuição automática do processo</strong> ao serviço de migração com menor fila.","timing":"Eletrónica"},{"step":"Comprovativo de submissão («blue receipt»)","detail":"Emissão do comprovativo, que confere <strong>direito de estada legal</strong> enquanto o pedido é analisado.","timing":"Imediato"},{"step":"Biometria","detail":"Recolha de impressões digitais e fotografia — <strong>única etapa presencial obrigatória</strong>. Marcação tipicamente 1 a 2 semanas após a submissão.","timing":"1–2 semanas"},{"step":"Decisão e emissão do cartão","detail":"Decisão do Ministério da Migração e Asilo e emissão do cartão de residência. <strong>Os 5 anos de validade correm a partir desta emissão</strong> (Lei 5275/2026).","timing":"1–2 meses após a biometria"}],"costs":[{"item":"Taxa governamental — requerente principal","value":"€2.000","note":"Autorização inicial de 5 anos; mesmo valor na renovação"},{"item":"Taxa governamental — cada familiar adulto","value":"€150","note":"Mesmo valor na renovação"},{"item":"Menores de 18 anos","value":"Isentos","note":"Da taxa de pedido"},{"item":"Cartão eletrónico de residência","value":"€16","note":"Por pessoa"},{"item":"Imposto de transmissão imobiliária (ΦΜΑ)","value":"3,09%","note":"Sobre o maior entre preço e valor objetivo"},{"item":"Notário, registo, cadastro e due diligence","value":"7% a 10% do preço","note":"Estimativa de mercado, não valor legal"},{"item":"Honorários advocatícios","value":"€5.000–€15.000","note":"Estimativa de mercado, conforme dimensão do agregado"},{"item":"ENFIA anual","value":"Variável","note":"Ver o dossiê de tributação ordinária"}],"sections":[{"title":"Restrições de uso do imóvel","body":"<strong>Proibição de arrendamento de curta duração.</strong> Imóveis adquiridos ao abrigo do Golden Visa <strong>não podem ser arrendados em regime de curta duração</strong> — Airbnb, Booking ou arranjo privado. A lei grega trata como curta duração <strong>qualquer arrendamento inferior a 60 dias</strong>, esteja ou não anunciado em plataforma.\n\n<strong>Sanção:</strong> coima administrativa de <strong>€50.000</strong> e <strong>revogação da autorização de residência</strong>. Pode ainda desencadear auditorias fiscais e migratórias.\n\n<strong>Arrendamento de longa duração: permitido.</strong> Arrendamentos de longa duração a empresas turísticas que operem estabelecimentos de tipo hoteleiro permanecem permitidos, desde que sejam prestados serviços adicionais.\n\n<strong>Sede social:</strong> imóveis da via de conversão de uso (€250.000) <strong>não podem servir de sede social nem de sucursal</strong> de empresa.\n\n<strong>Direito adquirido:</strong> Golden Visas emitidas ao abrigo de quadros anteriores mantêm-se em vigor e <strong>não estão sujeitas</strong> às novas restrições, incluindo a proibição de arrendamento de curta duração. Transações realizadas a partir de 1/set/2024 cumprem integralmente o novo regime."},{"title":"Vias de investimento não imobiliárias","body":"<strong>Contribuição de capital — €500.000:</strong> em sociedade com sede na Grécia, incluindo Sociedade de Investimento Imobiliário (REIC), Sociedade de Capital de Risco ou Fundo de Capital de Risco (AIF), desde que o objeto seja investir <strong>exclusivamente na Grécia</strong>.\n\n<strong>Depósito bancário a prazo — €500.000:</strong> em banco grego, mantido por <strong>pelo menos 12 meses</strong>.\n\n<strong>Obrigações do Tesouro grego — €500.000:</strong> com maturidade residual de <strong>pelo menos 3 anos</strong>, adquiridas através de instituição de crédito estabelecida na Grécia, que atua como custodiante.\n\n<strong>Fundo de Investimento Alternativo (AIF) — €350.000:</strong> constituído na Grécia ou noutro Estado-Membro da UE, que invista <strong>exclusivamente na Grécia</strong> e detenha ativos de pelo menos €3 milhões.\n\n<strong>Startup — €250.000</strong> (novidade de 2026): startup inscrita no registo nacional <strong>Elevate Greece</strong>. A via escala com o montante: 1 autorização para investidor individual, até 3 autorizações em investimentos maiores que suportem quadros-chave.\n\n<em>Nota de verificação: a via de ações e obrigações societárias cotadas (usualmente citada como €800.000) não pôde ser confirmada.</em>"},{"title":"Regras de família — três gerações","body":"<strong>Cônjuge</strong> — sem condição adicional.\n<strong>Filhos do investidor e/ou do cônjuge</strong> — até aos <strong>21 anos</strong>, prorrogável até aos <strong>24 anos</strong> enquanto matriculados como estudantes.\n<strong>Pais do investidor</strong> — <strong>sem limite de idade e sem necessidade de provar dependência económica</strong>.\n<strong>Pais do cônjuge (sogros)</strong> — nas mesmas condições.\n\nO programa abrange, portanto, <strong>três gerações</strong>.\n\n<strong>Custo adicional:</strong> €150 por familiar adulto (menores isentos), mais €16 de cartão por pessoa. <strong>Não é exigido investimento adicional</strong> por familiar — um único investimento qualificado cobre todo o agregado.\n\n<strong>Direitos dos dependentes:</strong> autorização com a mesma validade da do investidor principal; acesso a educação e a serviços; circulação no Espaço Schengen nos limites gerais (90 dias em 180).\n\n<em>Nota de verificação: o direito de trabalhar na Grécia sob a Golden Visa é matéria historicamente restritiva; verificar o regime de acesso ao mercado de trabalho sob a Lei 5275/2026.</em>\n\nFilhos que atingem 21 ou 24 anos deixam de ser abrangidos como dependentes e devem transitar para categoria autónoma de autorização."},{"title":"Renovação, perda e saída do regime","body":"A autorização é de <strong>5 anos, renovável indefinidamente de 5 em 5 anos</strong>, enquanto o investimento for <strong>mantido</strong>.\n\n<strong>Alienação do imóvel a nacional de país terceiro</strong> — o comprador pode adquirir o direito à Golden Visa; o vendedor <strong>perde</strong> a autorização.\n<strong>Alienação a nacional da UE ou a grego</strong> — o vendedor perde a autorização, sem transmissão do direito.\n<strong>Arrendamento de curta duração</strong> — coima de €50.000 e revogação.\n<strong>Uso do imóvel de conversão como sede de empresa</strong> — violação de condição, com risco de revogação.\n<strong>Não renovação no prazo</strong> — caducidade. <strong>Renúncia voluntária</strong> — cessação.\n<strong>Ausência prolongada</strong> — <strong>não há requisito de permanência mínima</strong> para manter a Golden Visa.\n\n<strong>Consequência fiscal da saída:</strong> a perda da autorização de residência <strong>não implica automaticamente</strong> a perda de um regime fiscal dos arts. 5A, 5B ou 5C — são procedimentos distintos, perante órgãos distintos (Ministério da Migração e AADE). Se, porém, a residência fiscal grega deixar de ser sustentável, o regime fiscal cessa por essa via."},{"title":"Regime transitório — encerrado","body":"Todos os prazos transitórios <strong>já expiraram</strong>. Exigia-se depósito de 10% (ou pré-contrato qualificado com prova bancária) até <strong>31/ago/2024</strong> e conclusão da compra até <strong>31/dez/2024</strong>, prorrogada pela Lei 5167/2024 para <strong>28/fev/2025</strong>; substituição de imóvel até <strong>30/abr/2025</strong>.\n\n<strong>Pedidos apresentados em 2026 estão integralmente sujeitos aos limiares de €400.000 e €800.000.</strong>\n\n<em>Nota de verificação:</em> a articulação formal entre a Lei 5038/2023 (arts. 99 e 100) e a Lei 5275/2026 — se há revogação total ou apenas alteração — deve ser confirmada no ΦΕΚ Α΄ 17/2026 e em migration.gov.gr."}],"brazilNote":"Brasileiros são nacionais de país terceiro e, portanto, elegíveis por qualquer das vias.\n\n<strong>Documentos brasileiros</strong> exigem <strong>apostila da Haia</strong> (Brasil e Grécia são partes da Convenção) e tradução oficial para o grego. A procuração ao advogado grego é o instrumento que permite conduzir o processo à distância — apenas a biometria é presencial.\n\n<strong>Residência legal ≠ residência fiscal.</strong> A Golden Visa <strong>não exige permanência mínima</strong> e, por si só, <strong>não gera residência fiscal grega</strong>. Quem mantém residência fiscal no Brasil continua a tributar em bases universais: aluguéis do imóvel grego pelo Carnê-Leão (até 27,5%), ganho de capital na venda a 15%–22,5%, e o imóvel declarado na DIRPF e, acima dos limiares, na CBE ao Banco Central. O ENFIA grego incide em paralelo, e o crédito por imposto grego depende do reconhecimento de reciprocidade pela RFB — não confirmado.\n\n<strong>Cuidado com o arrendamento de curta duração.</strong> A prática, comum em imóveis de investimento na Grécia, é <strong>vedada</strong> ao imóvel da Golden Visa: coima de €50.000 e revogação da autorização. Recomenda-se cláusula contratual expressa de proibição de arrendamento inferior a 60 dias e gestão profissional com <em>compliance</em> documentado.","warning":"<strong>A Golden Visa não converte automaticamente em cidadania.</strong> O relógio dos 7 anos começa na data de emissão da primeira autorização, mas <strong>deter o imóvel por 7 anos vivendo fora da Grécia não qualifica</strong>: a naturalização exige <strong>presença física de pelo menos 183 dias por ano</strong> e residência fiscal grega ao longo de todo o período. Há assimetria estrutural entre os dois regimes — a Golden Visa não exige permanência, a naturalização exige.\n\n<em>Item de verificação prioritária:</em> as fontes divergem sobre se o tempo passado sob a autorização de investidor conta integralmente para o cômputo dos 7 anos de naturalização. Recomenda-se parecer jurídico grego específico antes de apresentar a Golden Visa como caminho para o passaporte da União Europeia.","sources":[{"t":"Ministério da Migração e Asilo","u":"https://migration.gov.gr"},{"t":"Watson Farley & Williams · Compreendendo a Lei 5100/2024 do Golden Visa","u":"https://www.wfw.com/articles/understanding-the-new-golden-visa-law-%CE%BD%CE%BF-5100-2024-key-points-and-implications/"},{"t":"Zepos & Yannopoulos · Nova Lei de Imigração 5275/2026","u":"https://www.zeya.com/newsletters/new-immigration-law-52752026-key-provisions-and-practical-implications"},{"t":"Stylopoulos & Associates · Art. 100 da Lei 5038/2023 — o Golden Visa","u":"https://slo.gr/publications/article-100-of-law-5038-2023-the-golden-visa-para-en.htm"},{"t":"IMI Daily · Grécia intensifica combate a fraude no Golden Visa","u":"https://www.imidaily.com/europe/greece-cracks-down-on-golden-visa-fraud-in-sprawling-new-circular/"},{"t":"Eurofast · Golden Visa grego 2026 — vias de imóvel e startup","u":"https://eurofast.eu/greeces-golden-visa-2026-real-estate-and-start-up-investment-routes/"}]},{"name":"Visto de Nômade Digital","status":"changed","legalBasis":"Lei 4825/2021, consolidada na Lei 5038/2023 (Código de Imigração). Alterada pela Lei 5100/2024 e, materialmente, pela <strong>Lei 5275/2026 (ΦΕΚ Α΄ 17, de 6/fev/2026)</strong>, que pôs fim ao pedido «in-country».","desc":"Regime em duas fases:\n\n<strong>1. Visto nacional D de nômade digital</strong> — permite estada de até <strong>12 meses</strong>.\n<strong>2. Autorização de residência de nômade digital</strong> — obtida na Grécia após a entrada com o visto D, com validade de <strong>2 anos</strong>, renovável enquanto se mantiverem as condições de rendimento.\n\n<strong>Requisito estrutural:</strong> o trabalho deve ser prestado <strong>remotamente para empregador ou clientes situados FORA da Grécia</strong>. O titular <strong>não pode</strong> prestar serviços a empresas gregas nem exercer atividade dependente na Grécia.\n\n<strong>Mudança material de 6/fev/2026:</strong> a Lei 5275/2026 <strong>acabou com o pedido «in-country»</strong> — o visto D passou a ser <strong>obrigatório antes da entrada</strong>. Não é mais possível entrar com visto C ou isenção de visto e requerer a autorização de residência já em território grego.\n\n<em>Nota: as fontes divergem quanto à duração e à periodicidade de renovação da autorização (2 anos com renovação trienal, ou 2 anos renováveis por 2). Verificar em migration.gov.gr.</em>","kv":[{"l":"Renda líquida mínima","v":"€3.500/mês (≈€42.000/ano)"},{"l":"Acréscimo — cônjuge","v":"+20% (→ €4.200/mês)"},{"l":"Acréscimo — por filho","v":"+15% (+€525/mês cada)"},{"l":"Visto D","v":"Até 12 meses"},{"l":"Autorização de residência","v":"2 anos, renovável"},{"l":"Pedido in-country","v":"Vedado desde 6/fev/2026"},{"l":"Clientes gregos","v":"Proibidos"},{"l":"Residência fiscal","v":"183 dias em 12 meses"}],"requirements":["Ser <strong>nacional de país terceiro</strong> (não UE/EEE) — brasileiros qualificam-se.","Trabalhar <strong>remotamente</strong> por conta de empregador, ou como profissional independente ou empresário, <strong>estabelecido fora da Grécia</strong>.","Comprovar <strong>rendimento líquido mensal mínimo de €3.500</strong> (aproximadamente €42.000/ano), <strong>após impostos</strong>.","Acrescer <strong>20% para o cônjuge</strong> (€4.200/mês) e <strong>15% por cada filho dependente</strong> (+€525/mês por filho).","Apresentar <strong>contrato de trabalho ou contratos de prestação de serviços</strong> com entidades estrangeiras.","Apresentar <strong>declaração de que não prestará serviços a empregador estabelecido na Grécia</strong>.","Apresentar <strong>seguro de saúde</strong> válido para a Grécia.","Apresentar <strong>registo criminal</strong> apostilado e traduzido.","Apresentar <strong>comprovativo de alojamento</strong> na Grécia.","<strong>Desde 6/fev/2026:</strong> apresentar o pedido no consulado grego (ou portal digital) <strong>ANTES da viagem</strong>. Pedidos apresentados já em território grego <strong>não são aceites</strong>."],"process":[{"step":"Legalização de documentos no Brasil","detail":"Apostila da Haia em cartórios brasileiros e tradução oficial para o grego por tradutor juramentado.","timing":"3–6 semanas"},{"step":"Pedido de visto D no consulado","detail":"Apresentado no <strong>Consulado-Geral da Grécia em São Paulo</strong> (Av. Paulista, 2073, Conjunto Nacional, Ed. Horsa II, 23.º andar, cj. 2303, CEP 01311-940) ou outra representação grega competente. Há Embaixada em Brasília e consulados no Rio de Janeiro, Curitiba, Manaus, Recife, Salvador, Santos e Vitória — <em>nem todos processam vistos nacionais D; confirmar a competência consular</em>.","timing":"Até 10 dias úteis (a confirmar)"},{"step":"Entrada na Grécia com o visto D","detail":"O visto D habilita a entrada e a permanência por até 12 meses.","timing":"—"},{"step":"Pedido da autorização de residência","detail":"Apresentado ao serviço de migração competente do Ministério da Migração e Asilo, dentro da validade do visto D.","timing":"Variável"},{"step":"Biometria e emissão do cartão","detail":"Recolha biométrica e emissão do cartão de residência de nômade digital.","timing":"1–3 meses (a confirmar)"},{"step":"Renovação","detail":"Renovação enquanto se mantiverem as condições de rendimento.","timing":"Ver nota de duração"}],"costs":[{"item":"Taxa do visto D","value":"A confirmar","note":"Indicação corrente de €75; não confirmada em fonte oficial"},{"item":"Taxa administrativa de processamento","value":"A confirmar","note":"Indicação corrente de €150"},{"item":"Taxa da autorização de residência","value":"A confirmar","note":"Indicação corrente de €1.000"},{"item":"Cartão eletrónico de residência","value":"€16","note":"Por analogia com a Golden Visa; confirmar"},{"item":"Seguro de saúde privado","value":"Custo de mercado"},{"item":"Apostilas e traduções juramentadas","value":"Custo de mercado"}],"sections":[{"title":"Tratamento fiscal — o ponto que decide a estrutura","body":"A residência fiscal grega segue o art. 4 da Lei 4172/2013. Permanência <strong>superior a 183 dias em qualquer período de 12 meses</strong> torna o indivíduo residente fiscal grego <strong>desde o primeiro dia</strong> desse período, com sujeição ao rendimento mundial.\n\n<strong>Estada inferior a 183 dias:</strong> o titular do visto D pode, em princípio, permanecer não-residente fiscal na Grécia — mas os <strong>outros critérios do art. 4</strong> (residência habitual, centro de interesses vitais) continuam a aplicar-se autonomamente, e são independentes do teste de dias.\n\n<em>Nota de verificação:</em> algumas fontes de consultoria referem um regime de não tributação do rendimento estrangeiro no primeiro período para titulares do visto D. <strong>Não foi localizada base legal para essa afirmação — tratar como inexistente até confirmação.</strong>"}],"brazilNote":"A ausência de CDT Brasil–Grécia torna o desenho do nômade digital brasileiro particularmente sensível: se a permanência ultrapassar 183 dias em 12 meses, há residência fiscal grega sobre o rendimento mundial, <strong>sem tie-breaker convencional</strong> caso o Brasil também considere a pessoa residente.\n\n<strong>Providência indispensável:</strong> quem pretende exceder os 183 dias deve formalizar a <strong>saída fiscal do Brasil</strong> (CSDP e DSDP). Quem pretende permanecer abaixo desse limiar deve documentar rigorosamente as entradas e saídas e a manutenção do centro de interesses no Brasil.\n\nO <strong>Acordo de Previdência Social Brasil–Grécia</strong> permite totalização de tempos de contribuição entre INSS e e-EFKA — relevante para quem se inscreve no sistema grego.\n\nDocumentos brasileiros exigem <strong>apostila da Haia</strong> e tradução juramentada para o grego.","sources":[{"t":"Palaiologos Law Office · Lei 4825/2021 — nômades digitais e investidores","u":"https://www.palaiologos.law/l4825-2021-digital-nomads-and-investors/"},{"t":"EY Greece · Lei 5275/2026 — políticas de imigração legal","u":"https://www.ey.com/en_gr/technical/tax/tax-alerts/law-5275-2026-immigration-policies"},{"t":"Consulado-Geral da Grécia em São Paulo","u":"https://embassies.info/ConsulateGeneralofgreeceinSaoPauloBrazil"}]},{"name":"Caminho para a cidadania — naturalização","status":"ok","legalBasis":"Código da Nacionalidade Grega — Lei 3284/2004. Reforma do processo de naturalização: Lei 4735/2020, que introduziu o ΠΕΓΠ (Certificado de Adequação de Conhecimentos para Naturalização) como pré-requisito. Autoridade: Ministério do Interior (Υπουργείο Εσωτερικών), Direção de Cidadania, e Secretarias Descentralizadas.","desc":"A naturalização de nacional de país terceiro exige <strong>7 anos de residência legal e contínua</strong> na Grécia, com <strong>presença física de pelo menos 183 dias por ano</strong> e condição de <strong>residente fiscal e contribuinte</strong> ao longo do período.\n\nO prazo cai para <strong>3 anos</strong> no caso de cidadãos da UE, refugiados reconhecidos e cônjuges de cidadãos gregos.\n\n<strong>A Grécia permite a dupla e a múltipla cidadania</strong>, sem exigência de renúncia à nacionalidade anterior.\n\n<strong>Via alternativa, independente e prioritária:</strong> brasileiros descendentes de gregos podem ter direito à cidadania por <strong>ius sanguinis</strong>, <strong>sem exigência de residência</strong>, mediante registo da ascendência nos registos municipais gregos (Lei 3284/2004, arts. 1.º e seguintes). Quando disponível, esta via precede em prioridade qualquer análise de Golden Visa.","kv":[{"l":"Residência exigida","v":"7 anos (3 para UE e cônjuges)"},{"l":"Presença física","v":"≥ 183 dias por ano"},{"l":"Residência fiscal grega","v":"Exigida no período"},{"l":"Língua","v":"Nível B1 do QECR"},{"l":"Exame","v":"ΠΕΓΠ · abril e outubro"},{"l":"Nota mínima","v":"70/100"},{"l":"Dupla cidadania","v":"Permitida"},{"l":"Via por ascendência","v":"Sem exigência de residência"}],"requirements":["Ser <strong>maior de 18 anos</strong>.","Ter completado <strong>7 anos de residência legal e contínua</strong> na Grécia imediatamente antes do pedido.","Ter permanecido <strong>pelo menos 183 dias por ano</strong> na Grécia durante esse período — exigência de <strong>presença física real</strong>.","Ter sido <strong>residente fiscal e contribuinte</strong> na Grécia durante o período de qualificação, com declarações fiscais e histórico de emprego ou atividade.","Deter <strong>autorização de residência válida</strong> de categoria que permita a naturalização.","Ter obtido o <strong>ΠΕΓΠ</strong> — aprovação no exame panhelénico de naturalização.","Comprovar <strong>proficiência em grego ao nível B1</strong> do Quadro Europeu Comum de Referência.","Demonstrar <strong>integração económica e social</strong>.","Não ter condenações que obstem à naturalização."],"process":[{"step":"Acumulação do período de residência","detail":"Sete anos de residência legal, com pelo menos <strong>183 dias por ano</strong> de presença física e declarações fiscais gregas em todo o período.","timing":"7 anos"},{"step":"Exame ΠΕΓΠ","detail":"Inscrição e aprovação no exame panhelénico. Realizado tipicamente em <strong>abril e outubro</strong>. Estrutura: <strong>língua grega</strong>, 40 pontos (mínimo de 20 para aprovação); <strong>conhecimentos gerais</strong> — História, Geografia e Instituições Políticas —, 60 pontos (mínimo de 40). <strong>Nota mínima global: 70/100.</strong>\n<em>Nota de verificação: a fonte apresenta a estrutura de pontos de forma internamente inconsistente; confirmar no site do Ministério do Interior.</em>","timing":"Abril e outubro"},{"step":"Pedido de naturalização","detail":"Apresentação do dossiê completo na Secretaria Descentralizada ou na Direção de Cidadania do Ministério do Interior.","timing":"—"},{"step":"Entrevista","detail":"Entrevista perante a Comissão de Naturalização.","timing":"Variável"},{"step":"Decisão ministerial","detail":"Decisão do Ministro do Interior e publicação no ΦΕΚ. Historicamente, <strong>2 a 5 anos</strong> de análise.\n<em>Obter o prazo médio atual junto do Ministério do Interior.</em>","timing":"2–5 anos (histórico)"},{"step":"Juramento","detail":"Cerimónia de juramento de cidadania perante o município.","timing":"—"}],"sections":[{"title":"Golden Visa e cidadania — a assimetria estrutural","body":"As fontes são convergentes: <strong>a Golden Visa não isenta da exigência de presença física</strong>.\n\n· O relógio dos 7 anos <strong>começa na data de emissão da primeira autorização</strong> Golden Visa;\n· mas <strong>deter o imóvel por 7 anos vivendo fora da Grécia NÃO qualifica</strong> para a cidadania;\n· é necessária <strong>presença física de pelo menos 183 dias por ano</strong> e <strong>residência fiscal grega</strong> ao longo de todo o período.\n\nHá, portanto, uma assimetria estrutural entre os dois regimes: a Golden Visa <strong>não exige permanência mínima</strong> para ser mantida e renovada, mas a naturalização <strong>exige 183 dias por ano durante 7 anos</strong>.\n\n<em>Item de verificação prioritária:</em> as fontes divergem sobre se o tempo passado sob a autorização de investidor (μόνιμη άδεια διαμονής επενδυτή) conta integralmente para o cômputo dos 7 anos de naturalização. Recomenda-se parecer jurídico grego específico."}],"brazilNote":"<strong>Do lado brasileiro:</strong> a Constituição Federal, art. 12, §4.º, II, com a redação da Emenda Constitucional de Revisão n.º 3/1994, previa a perda da nacionalidade brasileira por aquisição voluntária de outra nacionalidade, ressalvados o reconhecimento de nacionalidade originária pela lei estrangeira e a imposição de naturalização como condição de permanência ou de exercício de direitos civis.\n\nA <strong>EC 131/2023</strong> alterou o dispositivo para restringir a perda essencialmente a <strong>pedido expresso do próprio interessado</strong>, ressalvadas situações de apatridia. Na prática, <strong>a naturalização grega voluntária deixou de acarretar perda automática da nacionalidade brasileira</strong>.\n\n<em>Nota de verificação: confirmar o texto vigente do art. 12, §4.º, II da CF/88 após a EC 131/2023 e a regulamentação aplicável.</em>\n\n<strong>Via por ascendência — verificar primeiro.</strong> Brasileiros descendentes de gregos podem ter direito à cidadania por <strong>ius sanguinis</strong>, sem residência e sem investimento, mediante registo da ascendência nos registos municipais gregos. Quando disponível, esta via torna desnecessária toda a análise de Golden Visa e de residência.","sources":[{"t":"Dafni I. Siopi · Guia da cidadania por naturalização para nacionais de países terceiros","u":"https://siopi-law.gr/en/a-guide-to-citizenship-by-naturalization-for-third-country-nationals-in-greece/"},{"t":"AIDA · Naturalização — Grécia","u":"https://asylumineurope.org/reports/country/greece/content-international-protection/status-and-residence/naturalisation/"},{"t":"Generation 2.0 · Novo processo de naturalização","u":"https://g2red.org/new-naturalization-process-what-is-it-about/"}]}]},"ae":{"id":"ae","flagCode":"ae","name":"Emirados Árabes Unidos","region":"Oriente Médio","alert":false,"sumFiscal":"Zero IR pessoal · Corporate Tax 9% · VAT 5%","sumFS":"ok","sumVisa":"Golden Visa 10 anos · Green Visa 5 anos","sumVS":"ok","fiscal":[{"name":"Ausência de imposto de renda pessoal e o sistema tributário federal","status":"ok","legalBasis":"Federal Decree-Law n.º 47/2022 (Corporate Tax); Cabinet Decision n.º 100/2023 (qualifying income do QFZP); Ministerial Decisions n.º 229/2025 e n.º 230/2025 (atividades qualificantes e excluídas — revogam e substituem a MD 265/2023, com efeito retroativo a 1/jun/2023); Cabinet Decision n.º 142/2024 (DMTT, vigente desde 1/jan/2025); Cabinet Decision n.º 85/2022 (critérios de residência fiscal); Federal Decree-Law n.º 8/2017 (VAT); Cabinet Decision n.º 57/2020, alterada pela n.º 98/2024 (Economic Substance Regulations); Federal Decree-Law n.º 41/2022 (Estatuto Pessoal Civil para não muçulmanos).","desc":"Os Emirados <strong>não têm imposto de renda sobre pessoas físicas</strong> em nenhuma categoria: salários, dividendos recebidos, ganho de capital pessoal, juros e aluguéis recebidos fora de atividade empresarial. Também não há imposto sobre <strong>herança, doação ou patrimônio líquido</strong>.\n\nNão se trata de um regime opcional: não há cadastro, opção nem declaração anual de imposto de renda pessoal. Não existe, até esta edição, proposta ou decisão oficial anunciando a criação de imposto de renda pessoal.\n\n<strong>O que existe:</strong> VAT de 5%; <strong>Corporate Tax de 9%</strong> sobre lucro tributável acima de AED 375.000 — que alcança também a <strong>pessoa natural com receita de negócio superior a AED 1.000.000/ano</strong>; taxa municipal de habitação de 5% sobre o aluguel anual residencial em Dubai, cobrada mensalmente na conta da DEWA; 4% de transferência no Dubai Land Department mais taxas fixas; excise tax sobre bebidas açucaradas e tabaco; e taxas de turismo hoteleiro.\n\n<strong>Distinção essencial:</strong> visto de residência não é residência fiscal. O visto autoriza a permanência; a residência fiscal é definida pelo Cabinet Decision 85/2022 e é o que a Federal Tax Authority certifica no <strong>Tax Residency Certificate (TRC)</strong>.","kv":[{"l":"IR pessoal","v":"Inexistente"},{"l":"Imposto sucessório / doação","v":"Inexistente"},{"l":"Imposto sobre patrimônio","v":"Inexistente"},{"l":"Corporate Tax","v":"9% acima de AED 375.000"},{"l":"CT — pessoa natural","v":"Registro se receita > AED 1M/ano"},{"l":"VAT","v":"5%"},{"l":"DMTT (grupos ≥ €750M)","v":"15% desde 1/jan/2025"},{"l":"Taxa municipal — Dubai","v":"5% do aluguel anual"},{"l":"Transferência imobiliária (DLD)","v":"4% + taxas fixas"},{"l":"Câmbio","v":"AED 3,6725/USD desde 2002"},{"l":"Controle cambial","v":"Inexistente"},{"l":"Rede de CDTs","v":"137 acordos concluídos"}],"requirements":["<strong>Residência fiscal</strong> (Cabinet Decision 85/2022) — basta uma das hipóteses: (i) residência habitual e centro de interesses financeiros e pessoais nos EAU; (ii) <strong>183 dias</strong> de presença em período de 12 meses; ou (iii) <strong>90 a 182 dias</strong>, para nacional dos EAU, residente ou cidadão do GCC, <strong>com</strong> moradia permanente ou emprego/negócio no país.","<strong>Emissão do TRC</strong> — visto de residência válido há pelo menos <strong>180 dias</strong>, Emirates ID, contrato de locação ou título de propriedade registrado (<strong>Ejari</strong>), fonte de renda comprovada e relatório de entradas e saídas emitido pela ICP.","<strong>Corporate Tax</strong> — registro obrigatório na Federal Tax Authority para pessoas jurídicas e para pessoas naturais com receita de negócio superior a AED 1.000.000/ano.","<strong>Economic Substance Regulations</strong> — a obrigação de <em>relatório</em> foi abolida para exercícios iniciados a partir de 1/jan/2023 (Cabinet Decision 98/2024, alterando a 57/2020). A exigência de substância permanece, agora dentro do Corporate Tax."],"process":[{"step":"Obtenção do visto de residência","detail":"Por qualquer das vias disponíveis — Golden Visa, Green Visa, visto de empregado patrocinado por empresa, ou visto de investidor vinculado a licença comercial.","timing":"Prévio"},{"step":"Estabelecimento de moradia e Ejari","detail":"Registro do contrato de locação (<strong>Ejari</strong>, em Dubai) ou do título de propriedade. É documento exigido para o TRC e integra a demonstração de centro de interesses.","timing":"Após a residência"},{"step":"Acumulação do período mínimo","detail":"O TRC para fins de tratado exige visto de residência válido há pelo menos <strong>180 dias</strong> e presença física documentada pelo relatório de entradas e saídas da ICP.","timing":"180 dias"},{"step":"Pedido do TRC no EmaraTax","detail":"Conta no portal <strong>EmaraTax</strong> → «Tax Residency Certificate» → escolha da finalidade (tratado específico ou uso doméstico) → upload de passaporte, visto, Emirates ID, Ejari ou título, comprovante de renda e relatório de entradas e saídas da ICP → pagamento da taxa de submissão.\n<em>Nota de verificação: a dispensa de extratos bancários para pessoa física sob tratado não foi confirmada no guia oficial da FTA.</em>","timing":"Submissão"},{"step":"Emissão do TRC","detail":"Análise pela Federal Tax Authority e emissão eletrônica em <strong>5 a 7 dias úteis</strong> quando o dossiê está completo. Via física opcional, com taxa adicional.","timing":"5–7 dias úteis"},{"step":"Constituição de estrutura (opcional)","detail":"<strong>Free zone:</strong> escolha da zona → reserva de nome → aprovação inicial → assinatura de MOA/AOA → contrato de espaço (flexi-desk ou escritório) → emissão da licença → <em>establishment card</em> → alocação de cota de vistos → e-channel → vistos individuais. Prazo típico de 5 a 15 dias úteis.\n<strong>Mainland (DED/DET):</strong> licença emitida pelo departamento econômico do emirado, com Ejari comercial obrigatório. Desde a Lei Federal 26/2020, a maioria das atividades admite 100% de propriedade estrangeira.","timing":"5–15 dias úteis"}],"costs":[{"item":"TRC — submissão","value":"AED 50","note":"≈ USD 14"},{"item":"TRC — emissão com TRN de Corporate Tax","value":"AED 500","note":"≈ USD 136"},{"item":"TRC — pessoa física sem TRN","value":"AED 1.000","note":"≈ USD 272"},{"item":"TRC — pessoa jurídica sem TRN","value":"AED 1.750","note":"≈ USD 477"},{"item":"TRC — cópia impressa (opcional)","value":"AED 250","note":"≈ USD 68"},{"item":"Licença anual RAKEZ (a partir de)","value":"≈ AED 10.000","note":"Ano 1 típico: AED 18.500–25.000"},{"item":"IFZA — formação","value":"AED 12.900–18.500","note":"Conforme o número de vistos"},{"item":"DMCC — licença (a partir de)","value":"≈ AED 20.000","note":"Ano 1 típico: AED 35.000–55.000+"},{"item":"Establishment card","value":"≈ AED 1.825","note":"≈ USD 497"},{"item":"ADGM e DIFC — licença anual","value":"A confirmar","note":"Regimes de common law; faixas oficiais devem ser consultadas em adgm.com e difc.ae"},{"item":"Seguro-saúde — pacote básico federal","value":"AED 320/ano","note":"≈ USD 87; obrigatório em todo o país desde 1/jan/2025"},{"item":"DIFC Wills — Full Will","value":"USD 1.400","note":"Categoria única: USD 840; atualização anual USD 200"}],"sections":[{"title":"Corporate Tax e o regime de Qualifying Free Zone Person","body":"A alíquota de <strong>0%</strong> aplicável a um <strong>Qualifying Free Zone Person (QFZP)</strong> incide apenas sobre <em>qualifying income</em>.\n\n<strong>Qualifying Activities</strong> sob a Ministerial Decision 229/2025: manufatura e processamento de bens; <em>trading</em> de <em>qualifying commodities</em>; detenção de ações e valores mobiliários para investimento; entre outras.\n\n<strong>Excluded Activities:</strong> transações com pessoas naturais (com exceções); atividades bancárias; seguros (salvo resseguro qualificado); financiamento e leasing (salvo hipóteses específicas); propriedade ou exploração de imóveis (com exceções limitadas); e atividades acessórias a essas.\n\n<strong>Teste de <em>de minimis</em>:</strong> a receita não-qualificante não pode exceder o <strong>menor</strong> entre 5% da receita total e AED 5.000.000.\n\n<strong>Consequência do descumprimento:</strong> excedido o <em>de minimis</em> — ou descumprido qualquer outro requisito (substância adequada, contabilidade auditada, preços de transferência, não-opção pelo regime geral) — o QFZP <strong>perde a alíquota de 0% no período fiscal corrente e nos quatro subsequentes</strong>.\n\n<strong>DMTT:</strong> desde 1/jan/2025, grupos com receita consolidada igual ou superior a €750 milhões estão sujeitos ao Domestic Minimum Top-up Tax de <strong>15%</strong>, que prevalece sobre o 0% do QFZP nesses grupos."},{"title":"Visto, residência fiscal e substância","body":"Um Golden Visa <strong>sem presença física, sem moradia e sem centro de interesses não sustenta, isoladamente, uma alegação de residência fiscal</strong> perante o fisco de origem.\n\nO TRC é o documento que a autoridade estrangeira normalmente exige para aplicar um tratado. Sem ele, a alocação de residência sob o art. 4.º do CDT tende a ser resolvida pelos critérios de desempate: moradia permanente à disposição, centro de interesses vitais, permanência habitual e, por último, nacionalidade.\n\nHá aqui uma tensão estrutural: o Golden Visa é expressamente isento da regra dos 180 dias de ausência justamente porque <strong>não pressupõe presença</strong> — e é essa mesma característica que enfraquece a alegação de residência fiscal. O Green Visa, sujeito à regra dos 180 dias, tende a produzir um histórico de presença mais consistente com a obtenção do TRC."},{"title":"Sucessão e direito de família","body":"Para muçulmanos, aplica-se a Sharia.\n\nPara <strong>não muçulmanos</strong>, o <strong>Decreto-Lei Federal n.º 41/2022 sobre Estatuto Pessoal Civil</strong>, em vigor desde <strong>1/fev/2023</strong>, rege casamento, divórcio, herança, testamentos e filiação — salvo se o interessado invocar a lei de seu país de origem.\n\n<strong>Na ausência de testamento:</strong> metade ao cônjuge e metade dividida igualmente entre os filhos, sem distinção de sexo; não havendo filhos, aos pais.\n\n<strong>DIFC Wills Service Centre:</strong> registro de testamento que cobre ativos nos sete emirados, aberto a não muçulmanos residentes ou não residentes. <em>Full Will</em>: USD 1.400. Testamentos de categoria única (imóveis, participações societárias, ativos financeiros, guarda de menores): USD 840 cada. Atualização anual: USD 200. Honorários de redação à parte, tipicamente AED 3.000–10.000. Abu Dhabi mantém registro equivalente no ADJD.\n\n<em>Nota de verificação:</em> referências correntes a uma «Lei 15/2020» em matéria sucessória não foram confirmadas — o instrumento operativo é o Decreto-Lei 41/2022."},{"title":"Repatriação de capital e regras cambiais","body":"Não há controles cambiais nem restrições à remessa de lucros ou à repatriação de capital.\n\nO dirham está atrelado ao dólar em <strong>AED 3,6725/USD</strong> desde 2002, com o Banco Central dos EAU reafirmando a manutenção da paridade fixa.\n\n<strong>Declaração alfandegária obrigatória</strong> de numerário, cheques, metais e pedras preciosas acima de <strong>AED 60.000</strong>, tanto na entrada quanto na saída do país."}],"brazilNote":"<strong>CDT Brasil–EAU: existe e está em vigor.</strong> Assinado em Brasília em 12/nov/2018; aprovado pelo Decreto Legislativo n.º 4/2021; promulgado pelo <strong>Decreto n.º 10.705, de 26/mai/2021</strong>; vigência internacional desde <strong>15/mar/2021</strong> (art. 31). Cobre, no Brasil, IRPJ, IRPF e CSLL; nos EAU, <em>income tax</em> e <em>corporate tax</em>.\n\n<strong>Limites de tributação na fonte:</strong> dividendos reduzidos a <strong>5%</strong> para beneficiário efetivo qualificado (15% nos demais casos); juros a <strong>10%</strong> em empréstimos de prazo igual ou superior a 5 anos concedidos a bancos para aquisição de equipamentos ou projetos de investimento (regra geral de 15%); royalties e serviços técnicos a <strong>15%</strong>. A Convenção contém <strong>cláusula de limitação de benefícios (LOB)</strong>, que nega o tratado quando um dos propósitos principais da sociedade ou de sua condução for obter benefício em proveito de não residente nos EAU. <em>Nota de verificação: a data exata de produção de efeitos e o texto literal das alíquotas devem ser lidos no Decreto 10.705/2021 antes de qualquer cálculo.</em>\n\n<strong>Lista da IN RFB 1.037/2010 — mudança decisiva.</strong> Os Emirados foram <strong>excluídos</strong> da lista de jurisdições com tributação favorecida pela <strong>Instrução Normativa RFB n.º 2.265, de 9/mai/2025, publicada em 13/mai/2025</strong>. A base legal é o art. 24-C da Lei 9.430/1996, incluído pela Lei n.º 15.079/2024, que permite excluir país que promova desenvolvimento nacional mediante investimentos significativos. A mesma IN reduziu de 20% para <strong>17%</strong> a alíquota mínima de referência.\n<strong>Consequências:</strong> fim da alíquota de 25% de IRRF do art. 8.º da Lei 9.779/1999; fim da presunção agravada em preços de transferência; e fim do enquadramento automático como «controlada» para fins da Lei 14.754/2023.\n<strong>Duas ressalvas:</strong> (a) a exclusão foi concedida sob condição de plano de investimento e é, por natureza, <strong>reversível</strong>; (b) resta verificar, no texto consolidado da IN 1.037/2010, se algum regime de <em>free zone</em> dos EAU permanece listado no art. 2.º como <em>regime fiscal privilegiado</em>. Materiais em português que ainda tratam os EAU como paraíso fiscal estão desatualizados desde 13/mai/2025.\n\n<strong>Lei 14.754/2023.</strong> Vigente desde 1/jan/2024, regulamentada pela IN RFB 2.180/2024. Tributa a <strong>15%</strong>, anualmente e independentemente de distribuição, os lucros de entidades controladas no exterior por pessoa física residente no Brasil, quando a entidade (a) esteja em jurisdição com tributação favorecida ou goze de regime fiscal privilegiado, <strong>ou</strong> (b) apure renda ativa própria inferior a <strong>60%</strong> da renda total.\n<strong>Efeito prático da exclusão da lista:</strong> o gatilho (a) deixou de operar automaticamente para os EAU, e a análise passa a recair sobre o <strong>teste de renda ativa inferior a 60%</strong>. Uma FZCO de natureza <em>holding</em>, cuja receita seja majoritariamente dividendos, juros e royalties, tende a cair no gatilho (b) e a ser tributada anualmente a 15% no Brasil — a mudança de lista <strong>não neutraliza</strong> a Lei 14.754. <em>Trusts</em> com <em>settlor</em> residente no Brasil permanecem transparentes, com bens e rendimentos atribuídos ao <em>settlor</em> até a distribuição.\n\n<strong>Saída fiscal.</strong> Comunicação de Saída Definitiva do País até o último dia de fevereiro do ano seguinte ao da saída, e Declaração de Saída Definitiva do País até o último dia útil de abril do ano seguinte, nos termos da <strong>IN SRF n.º 208/2002</strong>. A ausência por mais de 12 meses consecutivos sem comunicação também caracteriza a não residência, com prazo de 30 dias a contar do 12.º mês. Sem a formalização, a pessoa permanece residente fiscal no Brasil, tributada em bases universais.\n\n<strong>CRS.</strong> O Brasil participa do Common Reporting Standard desde 2018; os EAU assumiram compromisso de primeira troca em 2018, relativa a dados de 2017. <em>Nota de verificação: a ativação bilateral específica Brasil–EAU na matriz do MCAA da OCDE e o ano da primeira troca efetiva devem ser conferidos no portal da OCDE.</em> Independentemente disso, o CDT contém cláusula de troca de informações a pedido.\n\n<strong>Obrigações acessórias.</strong> Contas e participações societárias nos EAU são declaráveis no IRPF (ficha de bens e direitos e ficha específica de entidades controladas) e, acima dos limites, na <strong>Declaração de Capitais Brasileiros no Exterior (DCBE)</strong> ao Banco Central.","warning":"A exclusão dos EAU da lista da IN RFB 1.037/2010 é <strong>condicionada e reversível</strong>: foi concedida em contrapartida a um plano de investimentos no Brasil, com fundamento no art. 24-C da Lei 9.430/1996. Estruturas montadas sobre a premissa de permanência indefinida dessa exclusão devem prever o cenário de reinclusão.\n\nA Lei 14.754/2023 <strong>continua a alcançar</strong> holdings dos EAU pelo teste de renda ativa inferior a 60%, mesmo com os Emirados fora da lista — a tributação anual de 15% sobre lucros não distribuídos permanece aplicável a estruturas predominantemente passivas.","sources":[{"t":"Planalto · Decreto n.º 10.705/2021 (CDT Brasil–EAU)","u":"http://www.planalto.gov.br/ccivil_03/_ato2019-2022/2021/decreto/d10705.htm"},{"t":"Receita Federal · Listas de jurisdições com tributação favorecida atualizadas (IN 2.265/2025)","u":"https://www.gov.br/receitafederal/pt-br/assuntos/noticias/2025/maio/listas-de-jurisdicoes-com-tributacao-favorecida-e-de-regimes-fiscais-privilegiados-e-atualizada"},{"t":"Ministry of Finance · Ministerial Decision n.º 229/2025 (PDF)","u":"https://mof.gov.ae/wp-content/uploads/2025/09/EN-Ministerial-Decision-No.-229-of-2025-Regarding-Qualifying-Activities-and-Excluded-Activities.pdf"},{"t":"Federal Tax Authority · Emissão de certificados de residência fiscal","u":"https://tax.gov.ae/en/services/issuance.of.tax.certificates.aspx"},{"t":"Ministry of Finance · Acordos de dupla tributação dos EAU","u":"https://mof.gov.ae/en/public-finance/international-relations/double-taxation-agreements-dtas/"},{"t":"Ministry of Finance · Alteração das Economic Substance Regulations","u":"https://mof.gov.ae/en/news/ministry-of-finance-announces-amendment-to-cabinet-decision-on-economic-substance-requirements/"},{"t":"UAE Legislation · Federal Decree-Law n.º 41/2022 (Estatuto Pessoal Civil)","u":"https://uaelegislation.gov.ae/en/legislations/1586/download"},{"t":"CBUAE Rulebook · Movimentação transfronteiriça de numerário","u":"https://rulebook.centralbank.ae/en/rulebook/2311-cross-border-movement-cash-and-cash-couriers"},{"t":"Receita Federal · IN SRF n.º 208/2002","u":"http://normas.receita.fazenda.gov.br/sijut2consulta/link.action?idAto=15079&visao=original"}]}],"visa":[{"name":"Golden Visa — Residência de Longo Prazo (10 anos)","status":"ok","legalBasis":"Federal Decree-Law n.º 29/2021 sobre Entrada e Residência de Estrangeiros e sua regulamentação (Cabinet Decision n.º 65/2022). Circular federal de fevereiro de 2026 sobre a via imobiliária — número e data oficiais a confirmar. Regime federal de seguro-saúde básico obrigatório desde 1/jan/2025.","desc":"Autorização de residência renovável de <strong>10 anos</strong>, sem necessidade de patrocinador local, com Emirates ID de igual validade.\n\n<strong>Característica distintiva:</strong> o Golden Visa <strong>não está sujeito ao cancelamento por permanência superior a 180 dias consecutivos fora do país</strong>. O portal oficial lista expressamente como benefício a possibilidade de permanecer fora «por mais do que o período usual de seis meses». Isso não é uma alteração recente — é isenção existente desde a criação do programa. Vistos de residência comuns permanecem sujeitos à regra dos 180 dias, com serviço de <em>re-entry permit</em> para regularizar ausências mais longas.\n\n<strong>Mudança de fevereiro de 2026 na via imobiliária:</strong> caiu a exigência de pagamento prévio de 50% ou de AED 1.000.000. Imóvel <strong>financiado</strong> passa a qualificar mediante <strong>NOC do banco</strong>, e imóvel <strong>off-plan</strong> qualifica mediante <strong>Oqood</strong>, desde que a avaliação certificada atinja AED 2.000.000. A base passou a ser a avaliação certificada, não o desembolso. Múltiplos imóveis podem ser somados.","kv":[{"l":"Validade","v":"10 anos, renovável"},{"l":"Patrocinador local","v":"Dispensado"},{"l":"Regra dos 180 dias","v":"Não se aplica"},{"l":"Via imóvel","v":"AED 2.000.000 (avaliação)"},{"l":"Via depósito / fundo","v":"AED 2.000.000"},{"l":"Depósito — imobilização","v":"Mínimo 2 anos"},{"l":"Via empresa","v":"Capital ou participação ≥ AED 2M"},{"l":"Via tributos pagos","v":"≥ AED 250.000/ano à FTA"},{"l":"Via empreendedor","v":"Projeto ≥ AED 500.000"},{"l":"Dependentes","v":"Cônjuge e filhos, sem limite de idade"},{"l":"Emirates ID","v":"10 anos"},{"l":"Prazo típico","v":"5–15 dias úteis"}],"requirements":["<strong>Comuns a todas as vias:</strong> passaporte válido por pelo menos 6 meses; exame médico (sorologia e raio-X de tórax) em centro credenciado; seguro-saúde válido (obrigatório em todo o país desde 1/jan/2025 e verificado na emissão e na renovação); biometria e Emirates ID de 10 anos; certidão de antecedentes e liberação de segurança; comprovante de endereço.","<strong>Via imóvel:</strong> carta do departamento de registro imobiliário (DLD, em Dubai) comprovando titularidade de um ou mais imóveis com valor total igual ou superior a <strong>AED 2.000.000</strong> pela avaliação registrada. Imóvel financiado qualifica com <strong>NOC do banco</strong>; <em>off-plan</em> qualifica com <strong>Oqood</strong>.","<strong>Via depósito ou fundo:</strong> depósito fixo de AED 2.000.000 ou mais em banco nacional dos EAU, <strong>imobilizado por no mínimo 2 anos</strong>, com certificado bancário de bloqueio; ou carta de fundo de investimento credenciado atestando aporte de AED 2.000.000. Capital próprio, não financiado, com prova de origem.","<strong>Via empresa ou sócio:</strong> licença comercial ou industrial válida com capital igual ou superior a AED 2.000.000, ou participação societária de valor equivalente; alternativamente, carta da Federal Tax Authority confirmando pagamento anual de tributos de pelo menos <strong>AED 250.000</strong>. <em>Consta ainda uma via de empresa com receita anual igual ou superior a AED 2.500.000, não confirmada em fonte oficial.</em>","<strong>Via empreendedor (5 ou 10 anos):</strong> projeto de valor igual ou superior a AED 500.000 com aprovação de incubadora credenciada nos EAU, ou PME com receita anual superior a AED 1.000.000, mais carta de auditor e aprovação da autoridade local competente.","<strong>Via talento especializado:</strong> endosso da autoridade setorial competente <strong>antes</strong> da submissão à ICP — Ministério da Saúde (médicos), Conselho dos Cientistas dos EAU (cientistas), Ministério da Economia (inventores), Ministério da Cultura e Juventude (artistas e criativos), Conselho Geral de Esportes (atletas). Executivos e especialistas devem comprovar diploma, contrato e salário mínimo.","<strong>Via estudante ou graduado:</strong> alunos de ensino médio nos EAU com média igual ou superior a 95% (5 anos); graduados de universidades classificadas com GPA elevado (10 anos, extensível aos pais).","<strong>Dependentes:</strong> cônjuge e filhos <strong>sem limite de idade</strong>; pais admitidos mediante comprovação de dependência financeira; empregados domésticos em número limitado."],"process":[{"step":"Aquisição e registro do imóvel (via imobiliária)","detail":"Pagamento no <em>trustee office</em> e emissão do <strong>title deed</strong> pelo Dubai Land Department — ou do <strong>Oqood</strong>, no caso de imóvel <em>off-plan</em>.","timing":"Ano 0"},{"step":"Carta de elegibilidade","detail":"Em Dubai, solicitada pelo canal do DLD/GDRFA (aplicativos Amer e Dubai REST). Nos demais emirados, pela ICP.","timing":"Dias"},{"step":"Submissão à ICP ou GDRFA","detail":"Apresentação do dossiê completo e validação federal — passaporte, verificação de segurança e biometria.","timing":"Dias"},{"step":"Entry permit ou mudança de status","detail":"<strong>Entry permit</strong> para quem está fora do país, ou <strong>status change</strong> para quem já está nos EAU. Validade de 60 dias.","timing":"60 dias de validade"},{"step":"Exame médico e biometria","detail":"Sorologia e raio-X de tórax em centro credenciado, seguidos da coleta biométrica para o Emirates ID.","timing":"1–3 dias"},{"step":"Emissão da residência","detail":"Estampagem eletrônica da residência e emissão do <strong>Emirates ID de 10 anos</strong>.","timing":"5–15 dias úteis no total"},{"step":"Renovação","detail":"Ao fim dos 10 anos, a renovação exige a comprovação de que o requisito da via original permanece atendido.","timing":"10 anos"}],"costs":[{"item":"Taxas governamentais — total por via","value":"AED 4.600–10.250","note":"≈ USD 1.253–2.791; via de depósito bancário no piso, via imobiliária no topo"},{"item":"Taxa de solicitação","value":"AED 2.150","note":"≈ USD 586"},{"item":"Exame médico","value":"AED 700","note":"≈ USD 191"},{"item":"Emirates ID (10 anos)","value":"AED 1.153","note":"≈ USD 314"},{"item":"Estampagem","value":"AED 500","note":"≈ USD 136"},{"item":"Dependentes — taxas por pessoa","value":"AED 7.000–9.000","note":"≈ USD 1.906–2.451"},{"item":"Seguro-saúde","value":"A partir de AED 320/ano","note":"Pacote básico federal; planos amplos a partir de AED 3.000"},{"item":"DLD — transferência imobiliária","value":"4% do valor","note":"Mais AED 4.000 de trustee e AED 250 de title deed"},{"item":"Oqood (off-plan)","value":"AED 4.020","note":"≈ USD 1.095"},{"item":"PRO / agente","value":"AED 3.000–15.000","note":"Faixa de mercado, não regulada"}],"sections":[{"title":"Custos recorrentes de manutenção do status","body":"Seguro-saúde anual obrigatório; <strong>taxa municipal de habitação de 5%</strong> sobre o aluguel anual residencial em Dubai, cobrada m
