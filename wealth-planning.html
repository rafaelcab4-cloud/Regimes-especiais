ensalmente na conta da DEWA; <em>service charges</em> do condomínio, no caso de imóvel; e renovação do Emirates ID no fim do período.\n\nPara a via de depósito bancário, o capital deve permanecer <strong>imobilizado por no mínimo 2 anos</strong>. Para a via imobiliária, a manutenção da titularidade é condição de renovação."},{"title":"Sucessão do imóvel nos EAU","body":"O imóvel situado nos Emirados integra o espólio regido pelo <strong>Decreto-Lei Federal n.º 41/2022</strong> (Estatuto Pessoal Civil para não muçulmanos), salvo invocação da lei do país de origem.\n\nO mecanismo usual de destinação é o registro de <strong>Property Will</strong> no DIFC Wills Service Centre, ao custo de USD 840 para testamento de categoria única — ou USD 1.400 para o <em>Full Will</em>, que cobre todas as categorias de ativos nos sete emirados."}],"brazilNote":"<strong>O Golden Visa, isoladamente, não encerra a residência fiscal brasileira.</strong> Sem a Comunicação e a Declaração de Saída Definitiva do País (IN SRF 208/2002), o titular continua tributado em bases universais no Brasil — inclusive sobre o ganho de capital na venda do imóvel nos EAU e sobre os rendimentos de aluguel —, com o CDT operando apenas como mecanismo de crédito e alocação.\n\n<strong>Obrigações declaratórias:</strong> a aquisição do imóvel deve constar da Declaração de Bens e Direitos do IRPF pelo custo de aquisição em reais e, se o valor superar os limites vigentes, da <strong>Declaração de Capitais Brasileiros no Exterior (DCBE)</strong> ao Banco Central. As remessas para a compra seguem o regime cambial ordinário.\n\n<strong>Efeito da IN RFB 2.265/2025:</strong> com a exclusão dos EAU da lista de jurisdições com tributação favorecida, deixou de incidir automaticamente a alíquota de 25% de IRRF sobre remessas e caiu a presunção agravada em preços de transferência. A exclusão é, contudo, <strong>condicionada e reversível</strong>.\n\n<strong>Ponto de atenção:</strong> a natureza do Golden Visa — que dispensa presença física — é justamente o que enfraquece a alegação de residência fiscal nos EAU perante a Receita Federal. Quem pretende invocar o CDT precisa de <strong>TRC emitido pela FTA</strong>, que por sua vez exige presença efetiva, moradia registrada (Ejari) e centro de interesses nos Emirados.","sources":[{"t":"u.ae · Long-term residence visas in the UAE","u":"https://u.ae/en/information-and-services/visa-and-emirates-id/residence-visa/long-term-residence-visas-in-the-uae"},{"t":"u.ae · Golden visa","u":"https://u.ae/en/information-and-services/visa-and-emirates-id/residence-visas/golden-visa"},{"t":"ICP · Golden Residency","u":"https://icp.gov.ae/en/golden-residency/"},{"t":"ADDED · Abu Dhabi Golden Visa — investidores não imobiliários","u":"https://www.added.gov.ae/en/live/long-term-residency/abu-dhabi-golden-visa/Investors/visa-for-non-real-estate-investors"},{"t":"Ministry of Economy & Tourism · Golden Visa para investidor em investimentos públicos","u":"https://www.moet.gov.ae/en/-/what-are-the-requirements-for-issuing-a-golden-visa-to-an-investor-in-public-investments-"},{"t":"MOHRE · Basic Health Insurance Scheme","u":"https://mohre.gov.ae/en/guidance-and-awareness-portal-new/the-basic-health-insurance-scheme"}]},{"name":"Green Visa — Residência de 5 anos sem patrocinador","status":"ok","legalBasis":"Federal Decree-Law n.º 29/2021 e Cabinet Decision n.º 65/2022 (Green Residence, disposições relativas a trabalhadores autônomos e qualificados); regulamentação do MOHRE sobre <em>self-employment</em> e níveis ocupacionais; Federal Decree-Law n.º 47/2022 (Corporate Tax aplicável a pessoa natural); regime federal de seguro-saúde básico.","desc":"Residência de <strong>5 anos</strong> que <strong>dispensa patrocinador ou empregador</strong>, destinada a trabalhadores autônomos e a empregados qualificados.\n\nPermite ao titular patrocinar cônjuge, filhos (filhos homens até 25 anos; filhas sem limite de idade) e pais. Concede <strong>período de graça de 6 meses</strong> após o cancelamento ou a expiração.\n\n<strong>Diferença material em relação ao Golden Visa:</strong> o Green Visa <strong>está sujeito</strong> à regra de cancelamento por permanência superior a 180 dias consecutivos fora dos Emirados. Existe serviço de <em>re-entry permit</em> para ausências acima de 6 meses.\n\n<strong>Migração para o Golden Visa</strong> exige nova solicitação independente — não há conversão automática.","kv":[{"l":"Validade","v":"5 anos"},{"l":"Patrocinador","v":"Dispensado"},{"l":"Regra dos 180 dias","v":"Aplica-se"},{"l":"Autônomo — renda mínima","v":"AED 360.000/ano"},{"l":"Autônomo — histórico","v":"2 anos anteriores"},{"l":"Empregado — nível MOHRE","v":"1, 2 ou 3"},{"l":"Dependentes","v":"Cônjuge, filhos e pais"},{"l":"Filhos homens","v":"Até 25 anos"},{"l":"Filhas","v":"Sem limite de idade"},{"l":"Período de graça","v":"6 meses"},{"l":"Prazo típico","v":"10–20 dias úteis"}],"requirements":["<strong>Autônomo / freelancer:</strong> licença de trabalho autônomo ou permissão de <em>self-employment</em> emitida pelo <strong>MOHRE</strong>; diploma de bacharelado, diploma especializado ou equivalente; e <strong>renda anual não inferior a AED 360.000</strong> proveniente da atividade autônoma em cada um dos dois anos anteriores — ou comprovação de solvência financeira para o período de residência.","<strong>Empregado qualificado:</strong> contrato de trabalho válido; classificação nos <strong>níveis ocupacionais 1, 2 ou 3 do MOHRE</strong>; bacharelado ou equivalente. <em>Fontes secundárias indicam salário mínimo de AED 15.000/mês; esse valor não foi confirmado em fonte oficial e deve ser verificado em icp.gov.ae.</em>","<strong>Comuns:</strong> exame médico, seguro-saúde válido, Emirates ID de 5 anos e certidão de antecedentes.","<strong>Presença:</strong> o visto é cancelado por permanência superior a 180 dias consecutivos fora dos EAU, salvo <em>re-entry permit</em>."],"process":[{"step":"Obtenção da licença ou do contrato","detail":"Licença ou permissão de <em>self-employment</em> do MOHRE, no caso do autônomo; contrato de trabalho registrado, no caso do empregado qualificado.","timing":"Prévio"},{"step":"Submissão à ICP","detail":"Apresentação à ICP ou à autoridade de residência do emirado, com <strong>diploma atestado</strong> (consulado dos EAU no país de origem e, depois, MOFA nos Emirados) e comprovantes de renda dos dois anos anteriores.","timing":"Dias"},{"step":"Entry permit ou mudança de status","detail":"Emissão do <em>entry permit</em> para quem está fora do país, ou mudança de status para quem já está nos EAU.","timing":"Dias"},{"step":"Exame médico e biometria","detail":"Exame médico em centro credenciado e coleta biométrica para o Emirates ID.","timing":"1–3 dias"},{"step":"Emissão da residência","detail":"Emissão do Emirates ID de <strong>5 anos</strong> e estampagem eletrônica da residência.","timing":"10–20 dias úteis no total"},{"step":"Renovação","detail":"Ao 5.º ano, a renovação exige a recomprovação integral dos requisitos — licença, qualificação e renda.","timing":"5 anos"}],"costs":[{"item":"Permissão de freelance / self-employment (MOHRE)","value":"A confirmar","note":"Faixa praticada no mercado de AED 7.500–20.000/ano, conforme a autoridade emissora (MOHRE, GoFreelance/TECOM, free zones) — não confirmada em fonte oficial"},{"item":"Visto e Emirates ID (5 anos)","value":"AED 3.000–5.000","note":"≈ USD 817–1.362; conjunto entry permit + médico + EID + estampagem"},{"item":"Exame médico","value":"AED 700","note":"≈ USD 191"},{"item":"Seguro-saúde","value":"A partir de AED 320/ano","note":"Pacote básico federal"},{"item":"Atestação de diploma","value":"AED 1.500–3.000","note":"Valor de mercado, não confirmado em fonte oficial"},{"item":"Ejari residencial","value":"≈ AED 220","note":"Obrigatório para patrocinar dependentes; valor não confirmado em fonte oficial"}],"sections":[{"title":"Green e Golden na ótica da residência fiscal","body":"O <strong>Green Visa</strong> exige presença efetiva — pela regra dos 180 dias — e recomprovação periódica de renda. O <strong>Golden Visa</strong> não exige nenhuma das duas coisas.\n\nPara quem efetivamente transfere o centro de vida para os Emirados, o Green tende a produzir um <strong>histórico de presença mais consistente</strong> com os requisitos do TRC: visto válido há pelo menos 180 dias, Ejari registrado e relatório de entradas e saídas da ICP demonstrando permanência."},{"title":"Renda de freelancer e Corporate Tax","body":"A pessoa natural com <strong>receita de negócio acima de AED 1.000.000/ano</strong> no ano-calendário fica sujeita a registro na Federal Tax Authority e ao <strong>Corporate Tax de 9%</strong> sobre a parcela do lucro tributável que exceder AED 375.000.\n\nO patamar de renda de <strong>AED 360.000</strong> exigido pelo Green Visa para autônomos situa-se abaixo do limiar de registro — mas a <strong>soma de todas as fontes de receita de negócio</strong> deve ser monitorada, já que é o total que determina a obrigação."}],"brazilNote":"O titular de Green Visa que passa a residir efetivamente nos Emirados deve formalizar a saída fiscal brasileira: <strong>Comunicação</strong> até o último dia de fevereiro do ano seguinte ao da saída e <strong>Declaração de Saída Definitiva</strong> até o último dia útil de abril do ano seguinte.\n\nEnquanto permanecer residente fiscal no Brasil, a renda de freelancer auferida nos EAU é tributável pelo <strong>carnê-leão</strong> a alíquotas progressivas de até 27,5%, com eventual crédito sob o CDT (Decreto 10.705/2021) — cuja aplicação depende de <strong>TRC emitido pela FTA</strong>.\n\nConta bancária nos Emirados é reportável no IRPF e, acima dos limites, na <strong>DCBE</strong> ao Banco Central. Aplicam-se o CRS e a Lei 14.754/2023 nos mesmos termos descritos no dossiê fiscal: com os EAU fora da lista da IN 1.037/2010 desde a IN 2.265/2025, o enquadramento de uma eventual entidade dos Emirados como controlada passa a depender do <strong>teste de renda ativa inferior a 60%</strong>.","sources":[{"t":"u.ae · Green visa","u":"https://u.ae/en/information-and-services/visa-and-emirates-id/Types-of-visas/Investor-visa/Green-visa"},{"t":"ICP · UAE Green Residency","u":"https://icp.gov.ae/en/services/uae-green-residency/"},{"t":"Receita Federal · IN SRF n.º 208/2002","u":"http://normas.receita.fazenda.gov.br/sijut2consulta/link.action?idAto=15079&visao=original"},{"t":"Receita Federal · Acordos para intercâmbio de informações","u":"https://www.gov.br/receitafederal/pt-br/acesso-a-informacao/legislacao/acordos-internacionais/acordos-para-intercambio-de-informacoes-relativas-a-tributos/acordos-para-intercambio-de-informacoes-relativas-a-tributos"}]}]},"us":{"id":"us","flagCode":"us","name":"Estados Unidos","region":"Américas","alert":true,"sumFiscal":"Tributação por cidadania · estate tax de USD 60k","sumFS":"risk","sumVisa":"EB-5 USD 800k · EB-1A · EB-2 NIW · Gold Card","sumVS":"new","fiscal":[{"name":"Residência fiscal — green card test e substantial presence test","status":"ok","legalBasis":"<strong>IRC §7701(b)</strong> — <em>Definition of resident alien and nonresident alien</em> (26 U.S.C. §7701(b)). <strong>Treas. Reg. §301.7701(b)-1 a -9</strong> (26 C.F.R.). IRS: <em>Determining an individual's tax residency status</em> e <em>Substantial Presence Test</em>.","desc":"Uma pessoa física estrangeira é <strong>resident alien</strong> — tributada sobre <strong>renda mundial</strong>, como um cidadão — se satisfizer <strong>qualquer um</strong> dos dois testes:\n\n<strong>(a) Green Card Test</strong> — IRC §7701(b)(1)(A)(i). Ser <em>lawful permanent resident</em> em qualquer momento do ano-calendário. O status fiscal começa no primeiro dia de presença física nos EUA na condição de LPR e <strong>persiste até que o green card seja formalmente abandonado (Form I-407), revogado, ou administrativa ou judicialmente determinado como abandonado</strong>. <strong>Morar fora dos EUA não encerra automaticamente a obrigação fiscal.</strong>\n\n<strong>(b) Substantial Presence Test (SPT)</strong> — IRC §7701(b)(3). Cumulativamente:\n· <strong>31 dias ou mais</strong> de presença física no ano-calendário corrente; <strong>e</strong>\n· <strong>183 dias ou mais</strong> na soma ponderada de três anos: ano corrente × <strong>1</strong>; ano anterior × <strong>1/3</strong>; segundo ano anterior × <strong>1/6</strong>.\n\n<strong>Regra prática derivada:</strong> uma permanência estável de <strong>até 121 dias por ano</strong> mantém o total ponderado abaixo de 183 (121 + 40,33 + 20,17 = 181,5). <strong>A partir de 122 dias por ano constantes, o teste é satisfeito.</strong>","kv":[{"l":"Green card","v":"Residência fiscal imediata"},{"l":"SPT — ano corrente","v":"Peso 1"},{"l":"SPT — ano anterior","v":"Peso 1/3"},{"l":"SPT — segundo ano anterior","v":"Peso 1/6"},{"l":"Limiar do SPT","v":"183 dias ponderados"},{"l":"Presença segura estável","v":"Até 121 dias/ano"},{"l":"Closer connection","v":"Só se < 183 dias efetivos"},{"l":"Form 8840","v":"Prazo do 1040-NR"},{"l":"Form 8843","v":"Dias de exempt individual"},{"l":"Tie-breaker de tratado","v":"Indisponível ao Brasil"}],"requirements":["<strong>Para permanecer NRA:</strong> não deter green card em nenhum dia do ano.","Manter <strong>dias ponderados abaixo de 183</strong> — planilha de contagem por <strong>ano-calendário</strong>, não por ano fiscal.","Se ultrapassar 183 ponderados: presença no ano corrente <strong>inferior a 183 dias efetivos</strong> e protocolo do <strong>Form 8840</strong>.","Documentar entradas e saídas — registos <strong>I-94</strong> do CBP, cartões de embarque, extratos.","Não realizar eleição de residência — §7701(b)(4) (<em>first-year election</em>) ou §6013(g) (<em>joint election</em>).","<strong>Closer connection (IRC §7701(b)(3)(B) e (C); Treas. Reg. §301.7701(b)-2):</strong> presença nos EUA <strong>inferior a 183 dias no ano-calendário corrente</strong> — a exceção é <strong>indisponível a partir de 183 dias efetivos</strong>.","<strong>Closer connection:</strong> manter <em>tax home</em> (IRC §911(d)(3)) em país estrangeiro durante todo o ano.","<strong>Closer connection:</strong> demonstrar vínculo mais estreito com esse país (ou com dois países, sob a regra especial do §301.7701(b)-2(f)) — avaliado por domicílio permanente, localização da família, bens pessoais, filiações sociais, políticas, culturais e religiosas, local de atividade económica, jurisdição da carteira de motorista, país de registo eleitoral, e país declarado como residência em formulários e contratos.","<strong>Closer connection:</strong> <strong>não</strong> ter requerido, nem ter pendente, pedido de green card — a solicitação de LPR, ou passos nessa direção, afasta a exceção (§7701(b)(3)(C))."],"process":[{"step":"Contagem e documentação dos dias","detail":"Planilha por ano-calendário, com registos I-94 do CBP, cartões de embarque e extratos. A contagem ponderada de três anos deve ser refeita a cada ano.","timing":"Contínua"},{"step":"Form 8843 — dias de exempt individual","detail":"<em>Statement for Exempt Individuals and Individuals With a Medical Condition</em>. Veículo declaratório dos dias que <strong>não contam</strong>: portador de visto <strong>A/G</strong> (diplomata ou organismo internacional); <strong>F/J/M/Q</strong> (estudante — até 5 anos-calendário; professor ou pesquisador J/Q — 2 de 6 anos); atleta profissional em evento beneficente; dias em que a pessoa não pôde sair por <strong>condição médica surgida nos EUA</strong>; dias de trânsito (menos de 24h) entre dois pontos fora dos EUA; e <em>commuters</em> regulares do Canadá e do México.\n<strong>A falta de protocolo pode implicar contagem dos dias.</strong>","timing":"Anual"},{"step":"Form 8840 — closer connection","detail":"Anexo ao <strong>Form 1040-NR</strong>, se houver obrigação de declarar; ou envio isolado ao IRS, se não houver 1040-NR devido. <em>Endereço de protocolo isolado a confirmar nas instruções vigentes do formulário.</em>","timing":"15/abr, 15/jun ou 15/out"},{"step":"Prazo do 1040-NR","detail":"<strong>15 de abril</strong> se houver salário sujeito a retenção; <strong>15 de junho</strong> se não houver salário; extensão até <strong>15 de outubro</strong> via Form 4868.","timing":"Anual"}],"costs":[{"item":"Form 8840","value":"Sem taxa"},{"item":"Form 8843","value":"Sem taxa"},{"item":"Form 1040-NR","value":"Sem taxa"},{"item":"Custo da perda do status de NRA","value":"Tributação mundial","note":"Renda, herança e doação sobre patrimônio global, mais o pacote declaratório completo"}],"sections":[{"title":"Data de início e término da residência","body":"<strong>Início</strong> (§7701(b)(2)(A)): primeiro dia de presença física no ano em que o SPT é satisfeito, com regra de <em>de minimis</em> de até <strong>10 dias</strong> desconsiderados, se houver <em>closer connection</em> nesse período.\n\n<strong>Término</strong> (§7701(b)(2)(B)): último dia de presença, desde que no restante do ano haja <em>closer connection</em> com país estrangeiro e nenhuma residência no ano seguinte.\n\n<strong>Dual-status return:</strong> no ano de entrada ou de saída, declara-se parte do ano como NRA e parte como <em>resident</em> — 1040 com anexo 1040-NR, ou vice-versa. <strong>Não se permite <em>married filing jointly</em></strong> no ano de <em>dual-status</em>, salvo eleição §6013(g) ou (h)."},{"title":"Por que o Form 8840 é a única saída para o brasileiro","body":"Como <strong>não há tratado de renda entre Brasil e Estados Unidos</strong>, <strong>não existe cláusula de <em>tie-breaker</em> de residência</strong> disponível ao brasileiro.\n\nO <strong>Form 8840</strong> é o <strong>único mecanismo doméstico de desempate</strong>.\n\nNacionais de países com tratado dispõem, adicionalmente, do <strong>Form 8833</strong> (<em>treaty-based return position</em>) — via <strong>indisponível ao residente do Brasil</strong>.\n\n<strong>Consequência do protocolo intempestivo:</strong> o Form 8840 <strong>não pode ser protocolado após o vencimento</strong> do 1040-NR correspondente, incluídas as extensões. A perda do prazo pode implicar tratamento como <em>resident alien</em>, com tributação mundial, salvo demonstração de <em>reasonable cause</em> (Treas. Reg. §301.7701(b)-8)."}],"brazilNote":"<strong>O brasileiro que cruza o SPT sem perceber é o cenário mais comum e mais caro deste dossiê.</strong> A contagem ponderada de três anos surpreende quem raciocina apenas com «menos de 183 dias por ano»: alguém que passe 150 dias por ano nos EUA satisfaz o teste no terceiro ano (150 + 50 + 25 = 225).\n\n<strong>Sem tratado, sem tie-breaker.</strong> Se o Brasil e os Estados Unidos considerarem a pessoa residente simultaneamente, não há regra convencional de desempate. O alívio depende do Form 8840 — que exige presença inferior a 183 dias efetivos no ano — e, no Brasil, do crédito por reciprocidade.\n\n<strong>Green card holder residindo no Brasil</strong> é o cenário de atrito máximo: US person por green card (renda mundial para o IRS) e residente fiscal brasileiro (renda mundial para a RFB), sem tie-breaker. Os alívios disponíveis são o <em>Foreign Tax Credit</em> (Form 1116) e o FEIE (Form 2555) do lado americano, e o crédito por reciprocidade (ADI SRF 28/2000) do lado brasileiro — este último <strong>rendimento a rendimento</strong>, sem <em>pooling</em>.\n\n<strong>Riscos residuais nesse cenário:</strong> (i) diferença de ano-base e de regime de caixa ou competência; (ii) rendimentos <strong>isentos no Brasil e tributáveis nos EUA</strong> — dividendos brasileiros, ganho em bolsa até R$ 20.000/mês, poupança, LCI e LCA — que geram imposto americano <strong>sem crédito brasileiro correspondente</strong>; (iii) regime PFIC sobre fundos brasileiros; (iv) o pacote FBAR, 8938, 5471 e 3520; e (v) <em>state income tax</em>, que <strong>não é creditável</strong> no Brasil.","sources":[{"t":"IRS · Substantial Presence Test","u":"https://www.irs.gov/individuals/international-taxpayers/substantial-presence-test"},{"t":"IRS · Determining an individual's tax residency status","u":"https://www.irs.gov/individuals/international-taxpayers/determining-an-individuals-tax-residency-status"},{"t":"Cornell LII · 26 U.S. Code §7701(b)","u":"https://www.law.cornell.edu/uscode/text/26/7701"},{"t":"IRS · Form 8840 — Closer Connection Exception Statement for Aliens","u":"https://www.irs.gov/forms-pubs/about-form-8840"},{"t":"IRS · Publication 519 — U.S. Tax Guide for Aliens","u":"https://www.irs.gov/forms-pubs/about-publication-519"}]},{"name":"Tributação do não residente — FDAP, ECI e a isenção de ganho de capital","status":"ok","legalBasis":"<strong>IRC §871(a)</strong> — imposto de 30% sobre FDAP. <strong>IRC §871(b)</strong> e <strong>§864(c)</strong> — ECI, alíquotas progressivas sobre lucro líquido. <strong>IRC §1441</strong> — retenção na fonte sobre pagamentos a estrangeiros; §1442 para corporações. <strong>IRS Publication 519</strong> e <strong>Publication 515</strong>. Formulários: 1040-NR, Schedule NEC, W-8BEN, 1042-S, 1042.","desc":"O não residente é tributado por dois regimes distintos e mutuamente excludentes.\n\n<strong>FDAP — <em>Fixed, Determinable, Annual or Periodical income</em>:</strong> alíquota <strong>fixa de 30% sobre o valor bruto</strong>, sem dedução alguma. Retido na fonte pelo <em>withholding agent</em> (§1441) e reportado em <strong>Form 1042-S</strong>. Alcança dividendos de empresas americanas, juros não abrangidos pela <em>portfolio interest exemption</em>, royalties, aluguéis (salvo eleição §871(d)), pensões e prémios. Declarado no <strong>Schedule NEC</strong> do Form 1040-NR.\n\n<strong>Redutível por tratado — mas não para o Brasil: aplica-se 30% cheio.</strong>\n\n<strong>ECI — <em>Effectively Connected Income</em>:</strong> renda vinculada a <em>U.S. trade or business</em> (§864(b)-(c)). Tributação por <strong>alíquotas progressivas</strong> — sete faixas de <strong>10% a 37%</strong> em 2026, estrutura tornada permanente pelo <strong>One Big Beautiful Bill Act</strong> (Pub. L. 119-21, de 4/jul/2025), com parâmetros na Rev. Proc. 2025-32 e topo de 37% acima de USD 640.600 para solteiro. Incide <strong>sobre o lucro líquido</strong>, admitindo deduções ordinárias e necessárias. Declarado na página 1 do Form 1040-NR.\n\n<strong>O NRA não tem direito à <em>standard deduction</em></strong> (USD 16.100 para solteiro em 2026 — inaplicável). A exceção histórica prevista em tratado para estudantes da Índia <strong>não se aplica ao Brasil</strong>.","kv":[{"l":"Dividendos de US corp","v":"30% — sem redução por tratado"},{"l":"Portfolio interest","v":"0%"},{"l":"Juros de depósito bancário","v":"0%"},{"l":"Royalties","v":"30%"},{"l":"Aluguel bruto (sem eleição)","v":"30% sobre o bruto"},{"l":"Aluguel com eleição §871(d)","v":"10%–37% sobre o líquido"},{"l":"Ganho em ações — < 183 dias","v":"0%"},{"l":"Ganho em ações — ≥ 183 dias","v":"30%"},{"l":"Ganho em imóvel US","v":"FIRPTA · ECI progressivo"},{"l":"ECI","v":"10% a 37%"},{"l":"Standard deduction","v":"Indisponível ao NRA"},{"l":"NIIT (3,8%)","v":"Não se aplica ao NRA"}],"requirements":["<strong>Portfolio interest exemption</strong> (IRC §871(h) e §881(c)) — requisitos cumulativos: o <strong>devedor é US person</strong> (ou o juro é de fonte americana); a obrigação está em <strong>forma registada</strong> (<em>registered form</em>, §163(f)) — obrigações ao portador emitidas após 18/mar/2012 não qualificam; o credor entrega <strong>Form W-8BEN</strong> (pessoa física) ou W-8BEN-E (entidade) ao pagador; o credor <strong>não é acionista de 10% ou mais</strong> do devedor (§871(h)(3)); o juro <strong>não é contingente</strong> (§871(h)(4)) — não atrelado a receita, lucro, fluxo de caixa, dividendos, valorização ou variação patrimonial do devedor; o credor <strong>não é banco</strong> recebendo o juro em extensão de crédito no curso ordinário; e o devedor <strong>não é CFC relacionado</strong> ao credor.","<strong>Efeito da portfolio interest:</strong> retenção <strong>zero</strong>; sem Form 1042 ou 1042-S; e, sem outra fonte de renda americana, <strong>não há obrigação de declarar</strong> nos EUA.","<strong>Juros de depósito bancário</strong> (§871(i)(2)(A)) — juros pagos por bancos, associações de poupança e instituições depositárias americanas a NRA <strong>não são tributados</strong>, desde que não conectados a US trade or business. Isenção <strong>distinta</strong> da portfolio interest, e <strong>não exige forma registada</strong>.","<strong>Ganho de capital — regra geral:</strong> ganho de capital de fonte americana não-ECI <strong>é isento</strong> para o NRA presente menos de 183 dias no ano-calendário.","<strong>Ganho de capital — exceção do §871(a)(2):</strong> se o NRA esteve presente <strong>183 dias ou mais no ano-calendário</strong> (aqui a contagem é de <strong>dias efetivos no ano</strong>, não ponderada), os ganhos líquidos de capital de fonte americana são tributados a <strong>30%</strong>, no Schedule NEC, <strong>sem compensação de perdas de outros anos</strong>.","<strong>Ganho de capital — exceção permanente:</strong> USRPI (FIRPTA, §897) é sempre tratado como ECI."],"sections":[{"title":"Não incidência de contribuições","body":"<strong>Net Investment Income Tax (3,8%, IRC §1411):</strong> por <strong>IRC §1411(e)(1)</strong>, <strong>não se aplica a nonresident aliens</strong>. <em>A citação da subseção deve ser confirmada em law.cornell.edu/uscode/text/26/1411.</em>\n\n<strong>FICA e Medicare:</strong> não incidem sobre NRA sem vínculo empregatício nos EUA. Incidem sobre salário pago nos EUA, com isenções específicas (F/J/M/Q).\n\n<strong>Acordo de Previdência Brasil–EUA:</strong> assinado em 30/jun/2015 em Washington, promulgado pelo <strong>Decreto n.º 9.422, de 25 de junho de 2018</strong>, <strong>em vigor desde 1 de outubro de 2018</strong>. Disciplina a lei aplicável, evita a dupla contribuição previdenciária, e permite <strong>totalização de períodos</strong> — cobre aposentadoria por idade, pensão por morte e aposentadoria por invalidez."},{"title":"O trade-off estrutural do brasileiro que investe nos EUA","body":"Um brasileiro NRA que detenha <strong>ações de empresas americanas</strong> está simultaneamente:\n· <strong>isento de imposto de renda americano</strong> sobre o ganho de capital, se presente menos de 183 dias; e\n· <strong>exposto a estate tax de até 40%</strong> sobre o mesmo ativo acima de <strong>USD 60.000</strong>, porque ação de US corporation é <em>US situs</em> (§2104(a)).\n\nO mesmo brasileiro que detenha <strong>ETF UCITS irlandês</strong> replicando o S&amp;P 500 está:\n· <strong>fora do estate tax americano</strong> (§2105); e\n· sujeito à retenção de <strong>15% sobre dividendos</strong> na camada Irlanda–EUA (tratado EUA–Irlanda), com <em>leakage</em> não recuperável no Brasil, em vez dos 30% da retenção direta. <em>Alíquota do tratado EUA–Irlanda a confirmar.</em>\n\n<strong>É a escolha central do desenho da carteira americana para o brasileiro:</strong> exposição direta preserva a isenção de ganho de capital, mas cria exposição sucessória de 40% acima de USD 60.000. A via UCITS elimina a exposição sucessória ao custo de uma camada de retenção sobre dividendos."},{"title":"Nota sobre o reporte de juros de depósito","body":"Desde <strong>2013</strong>, instituições americanas devem reportar em <strong>Form 1042-S</strong> os juros de depósito pagos a residentes de países listados como parceiros de troca automática. A lista foi publicada e atualizada por <em>Revenue Procedures</em> — Rev. Proc. 2012-24 e sucessoras, incluindo a Rev. Proc. 2014-64.\n\n<strong>O Brasil consta dessa lista</strong> — logo, o juro é <strong>isento de imposto, porém reportado</strong>.\n\n<em>A Revenue Procedure mais recente que atualiza as listas do §1.6049-8(a) e do §1.6049-4(b)(5), e a inclusão corrente do Brasil, devem ser confirmadas.</em>"}],"brazilNote":"<strong>Fluxo Brasil ↔ EUA, sem tratado — o quadro completo:</strong>\n\n· <strong>Dividendos de US corp</strong> → <strong>30%</strong> na fonte nos EUA, sem redução; no Brasil, Carnê-Leão até 27,5% (recebimento direto) ou <strong>15%</strong> se via entidade offshore controlada (Lei 14.754/2023). <strong>Crédito por reciprocidade, limitado ao IR brasileiro do mesmo rendimento</strong> — e, como 30% excede os 27,5% brasileiros, <strong>a diferença é custo definitivo</strong>.\n· <strong>Portfolio interest</strong> → 0% nos EUA; <strong>15%</strong> no Brasil (Lei 14.754/2023). Não há crédito, pois não houve imposto americano.\n· <strong>Juros de depósito bancário americano</strong> → 0% nos EUA (reportado em 1042-S); 15% no Brasil.\n· <strong>US Treasuries</strong> → 0% (portfolio interest); 15% no Brasil.\n· <strong>Ganho de capital em ações, com menos de 183 dias</strong> → <strong>0%</strong> nos EUA; 15% no Brasil (Lei 14.754/2023) ou 15%–22,5% (GCAP), conforme a classificação.\n· <strong>Ganho de capital em ações, com 183 dias ou mais</strong> → 30% nos EUA; crédito por reciprocidade no Brasil.\n· <strong>Aluguel de imóvel americano, sem eleição</strong> → 30% sobre o <strong>bruto</strong> (FDAP); Carnê-Leão no Brasil; crédito limitado.\n· <strong>Aluguel com eleição §871(d)</strong> → progressivo sobre o líquido, com depreciação dedutível; Carnê-Leão no Brasil.\n· <strong>State income tax</strong> sobre qualquer dos acima → <strong>NÃO é creditável</strong> no Brasil (o ADI SRF 28/2000 exclui tributos estaduais e municipais).\n\n<strong>Cálculo ilustrativo — dividendo de USD 100.000:</strong> retenção americana de USD 30.000 (30%); líquido de USD 70.000; imposto brasileiro pelo Carnê-Leão até USD 27.500 (27,5%); crédito por reciprocidade de até USD 27.500; imposto adicional no Brasil de USD 0; e <strong>excedente de USD 2.500 perdido</strong> — não restituível, não compensável com outros rendimentos, não carregável para anos seguintes.\n\n<strong>A carga efetiva do dividendo americano para o residente brasileiro é a retenção americana de 30%</strong>, superior à alíquota brasileira máxima.\n\n<strong>No sentido inverso — americano investindo no Brasil:</strong> dividendos brasileiros <strong>não são <em>qualified dividends</em></strong> (IRC §1(h)(11)(C)(i)(II) exige tratado abrangente com cláusula de troca de informações), sendo tributados como <strong>renda ordinária, até 37%</strong>, em vez de 0/15/20%. <em>Verificar a lista do IRS de tratados qualificados na Notice 2011-64 e sucessoras.</em>","warning":"<strong>Os 30% de retenção sobre dividendos americanos não são reduzíveis para o residente do Brasil.</strong> Um residente do Reino Unido paga 15%; do México, 10% ou 15%. A ausência de tratado é um custo direto e permanente, não uma formalidade.\n\nE como a alíquota americana (30%) <strong>excede</strong> a brasileira máxima (27,5%), o crédito por reciprocidade <strong>nunca cobre a diferença</strong> — os 2,5 pontos percentuais excedentes são perda definitiva a cada distribuição.","sources":[{"t":"IRS · Taxation of nonresident aliens","u":"https://www.irs.gov/individuals/international-taxpayers/taxation-of-nonresident-aliens"},{"t":"IRS · Publication 515 — Withholding of Tax on Nonresident Aliens and Foreign Entities","u":"https://www.irs.gov/forms-pubs/about-publication-515"},{"t":"IRS · Nontaxable types of interest income for nonresident aliens","u":"https://www.irs.gov/individuals/international-taxpayers/nontaxable-types-of-interest-income-for-nonresident-aliens"},{"t":"IRS · Effectively Connected Income (ECI)","u":"https://www.irs.gov/individuals/international-taxpayers/effectively-connected-income-eci"},{"t":"Planalto · Decreto n.º 9.422/2018 (Acordo de Previdência Brasil–EUA)","u":"https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/decreto/d9422.htm"}]},{"name":"Estate & Gift Tax do não domiciliado — a exclusão de USD 60.000","status":"risk","legalBasis":"<strong>IRC §2101</strong> — imposto sucessório sobre o espólio de <em>nonresident not a citizen</em>. <strong>IRC §2102(b)(1)</strong> — <em>unified credit</em> de <strong>USD 13.000</strong>, equivalente a exclusão de <strong>USD 60.000</strong>. <strong>IRC §2001(c)</strong> — tabela progressiva, alíquota marginal máxima de <strong>40%</strong>. <strong>IRC §§2103 a 2106</strong> — base de cálculo, situs e deduções proporcionais. <strong>IRC §2501(a)(2)</strong> — gift tax do NRA restrito a bens tangíveis nos EUA. <strong>IRC §2010(c)(3)(A)</strong> — <em>basic exclusion amount</em> do cidadão ou residente, fixado em <strong>USD 15.000.000</strong> para 2026 pelo <strong>One Big Beautiful Bill Act (Pub. L. 119-21, de 4/jul/2025)</strong>, <strong>sem sunset</strong>, com indexação a partir de 2027.","desc":"<strong>O contraste numérico — o dado mais importante deste dossiê:</strong>\n\n| Parâmetro (2026) | Cidadão ou residente domiciliado | <strong>Não residente não domiciliado</strong> |\n· Exclusão (estate) → USD <strong>15.000.000</strong> → <strong>USD 60.000</strong>\n· Unified credit → ≈USD 5.945.800 <em>(a confirmar)</em> → <strong>USD 13.000</strong>\n· Indexação da exclusão → sim, a partir de 2027 → <strong>nenhuma — congelada desde 1988</strong>\n· Base tributável → patrimônio <strong>mundial</strong> → apenas <strong>US situs assets</strong>\n· Alíquota marginal máxima → 40% → <strong>40%</strong>\n· Exclusão <em>lifetime</em> de gift tax → USD 15.000.000 → <strong>zero</strong>\n· Exclusão anual de doação, por donatário → USD 19.000 (2026) → <strong>USD 19.000</strong>\n· Exclusão anual — cônjuge não-cidadão → USD 194.000 → USD 194.000\n· <em>Marital deduction</em> ilimitada → sim, se cônjuge cidadão → <strong>não, salvo QDOT (§2056A)</strong>\n· <em>Gift splitting</em> entre cônjuges → sim → <strong>indisponível</strong> se o cônjuge for NRNC\n· Tratado sucessório com o Brasil → — → <strong>não existe</strong>\n\n<strong>Razão de proporção: 15.000.000 ÷ 60.000 = 250 vezes.</strong>\n\n<strong>Cálculo ilustrativo.</strong> Brasileiro não domiciliado falece em 2026 titular de <strong>USD 5.000.000 em ações de empresas americanas</strong> custodiadas em corretora nos EUA, sem estrutura: <em>gross estate</em> de 5.000.000, menos exclusão de 60.000, base de 4.940.000, imposto pela tabela do §2001(c) de aproximadamente <strong>USD 1.921.800</strong> <em>(cálculo aproximado, a recalcular pela tabela vigente)</em>. <strong>E não há crédito no Brasil para esse imposto.</strong>","kv":[{"l":"Exclusão do NRNC","v":"USD 60.000"},{"l":"Exclusão do cidadão (2026)","v":"USD 15.000.000"},{"l":"Razão de proporção","v":"250 vezes"},{"l":"Alíquota marginal máxima","v":"40%"},{"l":"Indexação da exclusão do NRNC","v":"Nenhuma desde 1988"},{"l":"Exclusão lifetime de gift tax","v":"Zero"},{"l":"Exclusão anual por donatário","v":"USD 19.000"},{"l":"Cônjuge não-cidadão — anual","v":"USD 194.000"},{"l":"Marital deduction ilimitada","v":"Só com QDOT"},{"l":"Tratado sucessório com o Brasil","v":"Inexistente"},{"l":"Form 706-NA","v":"9 meses do óbito"},{"l":"Transfer Certificate","v":"Meses a anos"}],"requirements":["<strong>Domicílio para transfer tax ≠ residência para income tax.</strong> Treas. Reg. §20.0-1(b)(1): domicílio é residir no país, ainda que por breve período, <strong>com a intenção de ali permanecer indefinidamente</strong> (<em>animus manendi</em>). É teste <strong>subjetivo e factual</strong>, distinto do SPT.","<strong>Consequência prática:</strong> uma pessoa pode ser <strong>NRA para income tax e, ainda assim, domiciliada para estate tax</strong> — com exposição mundial —, ou o inverso.","<strong>Fatores examinados:</strong> green card, imóvel de residência principal, localização da família, declarações em vistos e testamentos, sepultura, clubes, carteira de motorista, registo eleitoral.","<strong>A obtenção de green card é forte indício de domicílio</strong> — o titular passa, em regra, à exclusão de USD 15.000.000 e à base <strong>mundial</strong>.","<strong>Gift tax do NRNC — assimetria estrutural:</strong> a <strong>doação de bens intangíveis de situs americano não é tributada</strong> (IRC §2501(a)(2)) — ações de empresas americanas, títulos, participações societárias, contas bancárias. A <strong>doação de bens tangíveis situados nos EUA é tributada</strong> — imóveis, obras de arte fisicamente nos EUA, joias, dinheiro em espécie fisicamente nos EUA, veículos.","<strong>Não há exclusão lifetime de gift tax para o NRNC</strong> — apenas a exclusão anual (USD 19.000, ou USD 194.000 para cônjuge não-cidadão).","<strong>Consequência documentada:</strong> ações de empresas americanas <strong>podem ser doadas em vida por NRNC sem gift tax</strong>, mas, se mantidas até a morte, integram o <em>gross estate</em> a 40%. O tratamento diverge radicalmente conforme o evento."],"process":[{"step":"Form 706-NA — declaração do espólio","detail":"Devida quando os <em>US situs assets</em> superam <strong>USD 60.000</strong> no falecimento. Prazo de <strong>9 meses do óbito</strong>, com extensão de 6 meses via Form 4768.","timing":"9 meses"},{"step":"Form 709 — gift tax","detail":"Devido na doação de bem <strong>tangível</strong> situado nos EUA acima da exclusão anual. Prazo: 15 de abril do ano seguinte.","timing":"15 de abril"},{"step":"Transfer Certificate (Form 5173)","detail":"Documento que libera aos herdeiros os ativos custodiados nos EUA. Emitido após aceitação do 706-NA. <strong>Na prática, meses a anos.</strong>\n<strong>Ponto operacional crítico:</strong> custodiantes e <em>transfer agents</em> americanos costumam <strong>bloquear a transferência dos ativos aos herdeiros até a emissão do Transfer Certificate</strong>, o que prolonga a iliquidez do espólio <strong>independentemente do valor do imposto</strong>.","timing":"Meses a anos"},{"step":"Form 706-QDT","detail":"Declaração anual de distribuições de QDOT.","timing":"Anual"}],"costs":[{"item":"Exclusão do não residente não domiciliado","value":"USD 60.000","note":"Unified credit de USD 13.000; congelada desde 1988"},{"item":"Alíquota sobre o excedente","value":"Até 40%","note":"Tabela progressiva do §2001(c); topo de 40% acima de USD 1.000.000"},{"item":"Exclusão anual de doação, por donatário","value":"USD 19.000","note":"Valor de 2026"},{"item":"Exclusão anual — cônjuge não-cidadão","value":"USD 194.000","note":"Valor de 2026"},{"item":"DIFC Wills equivalente nos EUA","value":"Não existe","note":"O planejamento é feito por estrutura, não por registo de testamento"}],"sections":[{"title":"Situs rules — o mapa dos ativos (estate tax)","body":"<strong>Base legal:</strong> IRC §2104 (<em>Property within the United States</em>) e §2105 (<em>Property without</em>); Treas. Reg. §20.2104-1 e §20.2105-1; IRM 4.25.4.\n\n<strong>SÃO US situs:</strong>\n· <strong>Ações de corporação americana</strong> — <strong>mesmo que custodiadas fora dos EUA</strong>, mesmo em conta de corretora estrangeira (§2104(a)). Inclui ADRs de <em>US issuer</em> e ações não negociadas;\n· <strong>imóvel</strong> localizado nos EUA;\n· <strong>bens tangíveis</strong> fisicamente nos EUA — arte, joias, veículo, ouro em cofre;\n· <strong>caixa parado em conta de corretora (<em>brokerage</em>) ou <em>money market fund</em></strong> nos EUA — <strong>não é «bank deposit»</strong> para efeito do §2105(b);\n· <strong>US mutual funds e ETFs domiciliados nos EUA</strong> (registados como RIC) — são ações de entidade americana;\n· seguro de vida sobre a vida de <strong>terceiro</strong>, com apólice detida pelo NRNC <em>(a confirmar)</em>;\n· plano de aposentadoria americano — 401k, IRA <em>(a confirmar)</em>.\n\n<strong>NÃO SÃO US situs:</strong>\n· ações de corporação <strong>estrangeira</strong> — mesmo que custodiadas nos EUA e mesmo que a empresa detenha só ativos americanos;\n· <strong>depósito bancário em banco comercial americano</strong> (conta corrente, poupança, CD), não conectado a US trade or business — <strong>§2105(b)</strong>;\n· <em>proceeds</em> de <strong>seguro de vida sobre a vida do próprio NRNC</strong> — §2105(a);\n· dívida que se qualifique como <strong>portfolio debt</strong> (§871(h)) — §2105(b)(3);\n· <strong>US Treasuries</strong> e obrigações que gerem juros isentos ao NRA, em regra;\n· <strong>ETFs irlandeses ou luxemburgueses (UCITS)</strong> com carteira de ações americanas;\n· conta bancária em <strong>filial estrangeira</strong> de banco americano.\n\n<strong>Zonas cinzentas:</strong>\n· <strong><em>Partnership interest</em></strong> (LLC ou LP americana) — <strong>incerto</strong>; o IRS historicamente sustenta situs americano se a <em>partnership</em> tem US trade or business. Matéria litigiosa;\n· <strong>criptoativos</strong> custodiados em <em>exchange</em> americana — <strong>não há regra de situs específica publicada</strong>; posição do IRS não definida.\n\n<strong>Correção a material em circulação:</strong> «dinheiro em conta corrente doméstica» é frequentemente listado entre os US situs assets. <strong>Não é.</strong> Depósito em <strong>banco comercial</strong> americano não é US situs para estate tax (§2105(b)). <strong>É</strong> US situs, contudo, o <strong>caixa mantido em conta de corretora ou money market</strong> — distinção decisiva e frequentemente confundida.\n\n<strong>Situs para GIFT TAX (NRNC):</strong> ações de empresa americana → <strong>NÃO</strong> tributadas (intangível); conta bancária americana → <strong>NÃO</strong> (intangível); <strong>imóvel nos EUA → SIM</strong>; <strong>bens tangíveis nos EUA → SIM</strong>."},{"title":"Estruturas de blocker corporation e QDOT","body":"<em>Descrição técnica de estruturas documentadas na literatura fiscal americana. Não constitui recomendação — cada estrutura tem custo de compliance, exposição a regras anti-abuso e efeitos colaterais de income tax que devem ser avaliados caso a caso.</em>\n\n<strong>Foreign blocker corporation.</strong> O NRNC constitui sociedade em jurisdição estrangeira; a sociedade detém o ativo americano; o NRNC detém <strong>ações da sociedade estrangeira</strong>, que por §2105 são bens de situs não-americano — logo, fora do <em>gross estate</em>.\n<strong>Efeitos colaterais documentados:</strong> <strong>branch profits tax</strong> (IRC §884) — 30% adicional sobre o <em>dividend equivalent amount</em>, <strong>não reduzido por tratado no caso brasileiro</strong>; <em>corporate income tax</em> de 21% (IRC §11) sobre ECI; <strong>perda do tratamento de <em>long-term capital gain</em></strong> (0/15/20%) na venda do imóvel — o ganho da corporação é tributado a 21% e a distribuição sofre o <em>branch profits tax</em>; perda do <em>step-up in basis</em>; e <strong>FIRPTA continua incidindo</strong> sobre a venda pela corporação (§1445(e)).\n\n<strong>Estrutura de duas camadas</strong> (foreign corp → US corp): elimina o <em>branch profits tax</em> na camada operacional e mantém situs estrangeiro na camada detida pelo indivíduo; introduz tributação corporativa de 21% e retenção de <strong>30% sobre dividendos</strong> pagos à holding estrangeira, sem redução no caso brasileiro. É também a estrutura que pode acionar o <strong>§2104(b)</strong> (transferências com retenção de controlo) se mal desenhada.\n\n<strong>Irrevocable foreign trust</strong> constituído por NRNC <strong>antes</strong> de qualquer conexão americana. Riscos: §2036 e §2038 (poderes retidos); tratamento de <em>foreign grantor trust</em> (§672(f)); e, se houver beneficiário US person, Forms 3520 e 3520-A e tributação sob §679.\n\n<strong>Seguro de vida.</strong> IRC §2105(a) exclui do <em>gross estate</em> o <em>proceeds</em> de seguro sobre a vida do próprio NRNC. Estruturas de <em>private placement life insurance</em> emitidas fora dos EUA são usadas nesse contexto. <em>Apólices emitidas por seguradora americana podem gerar retenção FDAP em certos componentes — a confirmar.</em>\n\n<strong>Debt financing.</strong> Financiar o imóvel americano com dívida <em>non-recourse</em> de terceiro reduz o valor líquido do US situs asset. <strong>Atenção à dedução proporcional do §2106(a)(1):</strong> o espólio de NRNC só deduz despesas e dívidas na <strong>proporção entre o gross estate americano e o gross estate mundial</strong> — o que <strong>exige revelar ao IRS o patrimônio global</strong>. Dívida <em>non-recourse</em> garantida apenas pelo imóvel é tratada de forma distinta (redução do valor do ativo, sem dedução proporcional). <em>A confirmar em Reg. §20.2053-7.</em>\n\n<strong>QDOT — Qualified Domestic Trust (IRC §2056A).</strong> A <em>marital deduction</em> ilimitada (§2056) exige cônjuge sobrevivente <strong>cidadão americano</strong>; o §2056(d)(1) a nega quando o cônjuge é não-cidadão. O <strong>§2056A</strong> permite a dedução se os bens passarem a um <strong>QDOT</strong>: ao menos um <em>trustee</em> americano, retenção do imposto sobre distribuições de principal, e requisitos de garantia para trusts acima de USD 2.000.000 <em>(limiar a confirmar em Reg. §20.2056A-2(d))</em>.\n<strong>Efeito: diferimento, não eliminação</strong> — o imposto incide sobre distribuições de principal e no falecimento do cônjuge sobrevivente, à <strong>alíquota marginal máxima do primeiro falecido</strong>.\nO QDOT pode ser criado pelo executor <strong>após</strong> o óbito, ou por reforma do trust, dentro do prazo do 706 ou 706-NA.\n<strong>Alternativa legal:</strong> o cônjuge sobrevivente naturalizar-se cidadão americano antes do protocolo do 706 e ter residido nos EUA continuamente desde o óbito (§2056(d)(4))."}],"brazilNote":"<strong>Não existe tratado de estate ou gift tax entre Brasil e Estados Unidos.</strong> Os EUA mantêm cerca de 16 tratados sucessórios — Alemanha, Reino Unido, França, Japão, Suíça, Áustria, Dinamarca, Finlândia, Grécia, Irlanda, Itália, Holanda, Noruega, África do Sul, Austrália e Canadá. <strong>O Brasil não está entre eles.</strong> Logo, não há elevação da exclusão de USD 60.000 por tratado, nem regra de situs modificada, nem alívio de dupla tributação sucessória.\n\n<strong>ITCMD × Estate Tax — as duas incidências são independentes e não se compensam:</strong>\n· <strong>Estate Tax federal americano</strong> — imposto sobre o <strong>espólio</strong>, competência federal, base do NRNC limitada aos <em>US situs assets</em>, exclusão de USD 60.000, alíquota progressiva até 40%;\n· <strong>ITCMD brasileiro</strong> — imposto sobre a <strong>transmissão</strong>, devido pelo herdeiro ou donatário, competência <strong>estadual</strong> (CF, art. 155, I), alíquota de até 8% (teto da Resolução do Senado n.º 9/1992), com <strong>progressividade obrigatória</strong> pela EC 132/2023.\n\n<strong>Crédito recíproco: NENHUM.</strong> O estate tax americano <strong>não é creditável</strong> contra o ITCMD, e o ITCMD <strong>não é creditável</strong> contra o estate tax. O ADI SRF 28/2000 trata de imposto sobre a <strong>renda</strong>, não de imposto sobre transmissão causa mortis — não há base normativa para creditamento.\n\n<strong>Efeito documentado:</strong> o mesmo ativo — ações de empresa americana detidas por brasileiro falecido — pode ser alcançado <strong>cumulativamente</strong> pelo estate tax federal americano (até 40% acima de USD 60.000) e pelo ITCMD do estado brasileiro de domicílio do <em>de cujus</em> (até 8%), <strong>sem qualquer mecanismo de alívio</strong>.\n\n<strong>ITCMD sobre bens no exterior — o estado da questão:</strong>\n· <strong>CF, art. 155, §1.º, III</strong> exige lei complementar federal para o ITCMD incidir quando o doador tem domicílio no exterior, ou quando o <em>de cujus</em> possuía bens, era residente ou teve o inventário processado no exterior;\n· <strong>STF, RE 851.108 (Tema 825), 2021</strong> — declarou inconstitucional a cobrança pelos Estados nessas hipóteses <strong>enquanto não houver lei complementar federal</strong>;\n· <strong>EC 132/2023</strong> — inseriu o <strong>art. 16 do ADCT</strong>, estabelecendo <strong>regra transitória de competência</strong> até que sobrevenha a lei complementar: bens imóveis, ao Estado da situação do bem; bens móveis, títulos e créditos com doador no exterior, ao Estado do domicílio do donatário (ou, se este também for domiciliado no exterior, onde se encontrar o bem); bens do <em>de cujus</em>, ainda que no exterior, ao Estado onde ele era domiciliado (ou, se domiciliado no exterior, ao do domicílio do sucessor);\n· <strong>STF, outubro de 2025</strong> — ao julgar norma do Mato Grosso, <strong>reafirmou a necessidade de lei complementar federal</strong> e <strong>rejeitou expressamente a tese de «constitucionalidade superveniente»</strong>: leis estaduais anteriormente declaradas inconstitucionais (como a Lei paulista n.º 10.705/2000 no ponto) <strong>não recobram validade automaticamente</strong> com a EC 132/2023. Contexto correlato: ADI 6.838.\n\n<strong>Situação em agosto de 2026:</strong> a cobrança de ITCMD sobre heranças e doações com elementos no exterior <strong>permanece inviabilizada até a edição da lei complementar federal</strong>; e, ainda que a LC venha a ser editada, os Estados precisarão de <strong>leis estaduais novas</strong>, observando anterioridade anual e nonagesimal. <em>Verificar o status do PLP 108/2024.</em>\n\n<strong>Leitura para o cliente:</strong> um brasileiro com patrimônio nos EUA que faleça hoje enfrenta o <strong>estate tax americano com certeza</strong> e o <strong>ITCMD sobre bens no exterior com incerteza jurídica</strong> — dois riscos de naturezas distintas, sem compensação recíproca.","warning":"<strong>A exclusão de USD 60.000 é o risco mais subestimado do investimento brasileiro nos Estados Unidos.</strong> Ela está <strong>congelada desde 1988</strong>, não é indexada, e é <strong>250 vezes menor</strong> que a do cidadão americano.\n\nUma carteira de USD 5 milhões em ações americanas, detida diretamente por brasileiro não domiciliado, gera aproximadamente <strong>USD 1,9 milhão</strong> de estate tax no falecimento — <strong>sem crédito no Brasil</strong>, e cumulativamente com o ITCMD estadual sobre os bens brasileiros.\n\nAcresce a <strong>iliquidez</strong>: custodiantes americanos bloqueiam a transferência aos herdeiros até a emissão do <strong>Transfer Certificate</strong> pelo IRS, que na prática leva <strong>meses a anos</strong> — independentemente do valor do imposto devido.\n\n<strong>E a assimetria decisiva:</strong> ações de empresas americanas podem ser <strong>doadas em vida sem gift tax</strong> (são intangíveis), mas integram o <em>gross estate</em> a 40% se mantidas até a morte.","sources":[{"t":"IRS · Some nonresidents with U.S. assets must file estate tax returns","u":"https://www.irs.gov/businesses/small-businesses-self-employed/some-nonresidents-with-us-assets-must-file-estate-tax-returns"},{"t":"IRS · Estate tax for nonresidents not citizens of the United States","u":"https://www.irs.gov/businesses/small-businesses-self-employed/frequently-asked-questions-on-estate-taxes-for-nonresidents-not-citizens-of-the-united-states"},{"t":"Cornell LII · 26 U.S. Code §2104 — Property within the United States","u":"https://www.law.cornell.edu/uscode/text/26/2104"},{"t":"Cornell LII · 26 U.S. Code §2105 — Property without the United States","u":"https://www.law.cornell.edu/uscode/text/26/2105"},{"t":"IRS · Form 706-NA","u":"https://www.irs.gov/forms-pubs/about-form-706-na"},{"t":"STF · Tema 825 (RE 851.108) — ITCMD sobre bens no exterior","u":"https://portal.stf.jus.br/jurisprudenciaRepercussao/verAndamentoProcesso.asp?incidente=4667945&numeroProcesso=851108&classeProcesso=RE&numeroTema=825"}]},{"name":"FIRPTA — alienação de imóveis por estrangeiro","status":"ok","legalBasis":"<strong>FIRPTA</strong>, Pub. L. 96-499, Title XI (1980); <strong>PATH Act de 2015</strong> (Pub. L. 114-113) elevou a retenção de 10% para 15%. <strong>IRC §897</strong> — ganho na alienação de USRPI tratado como ECI. <strong>IRC §1445</strong> — obrigação de retenção do adquirente. <strong>26 C.F.R. §1.1445-1 a -11</strong> e <strong>§1.897-1</strong> e seguintes. Formulários: <strong>8288</strong>, <strong>8288-A</strong>, <strong>8288-B</strong> e <strong>8288-C</strong>.","desc":"Na alienação, por pessoa estrangeira, de <em>U.S. Real Property Interest</em> (USRPI), o <strong>comprador</strong> (<em>transferee</em>) é obrigado a reter <strong>15% do <em>amount realized</em></strong> — o <strong>preço bruto, não o ganho</strong> — e recolher ao IRS.\n\n<strong>A retenção é antecipação, não imposto definitivo:</strong> o vendedor apura o ganho real no Form 1040-NR (ou 1120-F) e pede restituição do excedente.\n\n<strong>USRPI abrange:</strong> imóveis nos EUA; benfeitorias; direitos minerários; e <strong>ações de <em>U.S. Real Property Holding Corporation</em> (USRPHC)</strong> — corporação americana cujo valor de USRPI represente 50% ou mais do valor agregado de seus ativos imobiliários (americanos e estrangeiros) mais ativos de <em>trade or business</em>, testado nos últimos 5 anos (§897(c)(2)).\n\n<strong>Escala de retenção:</strong>\n· regra geral → <strong>15%</strong> do <em>amount realized</em>\n· preço de <strong>até USD 300.000</strong> <strong>e</strong> comprador pessoa física que residirá no imóvel (teste dos 50% dos dias em cada um dos dois períodos de 12 meses subsequentes) → <strong>0%</strong>\n· preço entre <strong>USD 300.001 e USD 1.000.000</strong> <strong>e</strong> mesmo requisito de residência → <strong>10%</strong>\n· preço <strong>acima de USD 1.000.000</strong> → <strong>15%</strong> (a exceção de residência não reduz)\n· distribuições por corporações, <em>partnerships</em> e trusts (§1445(e)) → <strong>21%</strong> ou 15%, conforme o caso\n· alienação de interesse em <em>partnership</em> com ECI (§1446(f)) → <strong>10%</strong>","kv":[{"l":"Retenção padrão","v":"15% do preço bruto"},{"l":"Até USD 300.000 + residência","v":"0%"},{"l":"USD 300k–1M + residência","v":"10%"},{"l":"Acima de USD 1.000.000","v":"15%"},{"l":"Distribuições §1445(e)","v":"21% ou 15%"},{"l":"Partnership com ECI §1446(f)","v":"10%"},{"l":"Natureza","v":"Antecipação, não definitivo"},{"l":"Prazo do Form 8288","v":"20 dias da transferência"},{"l":"Withholding certificate","v":"Resposta-alvo em 90 dias"},{"l":"Depreciation recapture","v":"25%"}],"requirements":["<strong>Exceção — non-foreign affidavit</strong> (§1445(b)(2)): o vendedor certifica, sob pena de perjúrio, <strong>não ser pessoa estrangeira</strong>, informando o TIN.","<strong>Exceção — residência até USD 300.000:</strong> comprador pessoa física que residirá no imóvel, com o teste dos 50% dos dias em cada um dos dois períodos de 12 meses subsequentes.","<strong>Exceção — withholding certificate (Form 8288-B, §1445(b)(4)):</strong> reduz ou elimina a retenção quando o imposto efetivo devido é inferior — venda com prejuízo, base elevada, operação §1031. Deve ser protocolado <strong>até a data do fechamento</strong>; o IRS tem prazo-alvo de <strong>90 dias</strong> para responder, e enquanto pendente o valor fica retido em <em>escrow</em>.","<strong>Exceção — ações negociadas em bolsa reconhecida</strong> e o alienante detinha <strong>5% ou menos</strong> da classe nos 5 anos anteriores (§897(c)(3)).","<strong>Exceção — certificação de que a corporação não é USRPHC</strong> (§1445(b)(3)).","<strong>Exceção — transações não reconhecidas</strong> (§1031, reorganizações), mediante notificação ao IRS."],"process":[{"step":"Obtenção do ITIN","detail":"O vendedor estrangeiro obtém o ITIN pelo <strong>Form W-7</strong>, se ainda não o tiver. <em>Prazo corrente a confirmar; historicamente 7 a 11 semanas.</em>","timing":"7–11 semanas"},{"step":"Form 8288-B (opcional)","detail":"Protocolo do pedido de <em>withholding certificate</em> para reduzir a retenção. Deve ser apresentado <strong>até o fechamento</strong>.","timing":"Resposta-alvo em 90 dias"},{"step":"Fechamento e retenção","detail":"O comprador ou o <em>closing agent</em> retém 15% do <em>amount realized</em> na data do <em>closing</em>.","timing":"Data do closing"},{"step":"Forms 8288 e 8288-A","detail":"O comprador remete os formulários com o valor retido ao IRS no prazo de <strong>20 dias</strong> após a transferência.","timing":"20 dias"},{"step":"Cópia B do 8288-A","detail":"O IRS carimba e devolve a cópia B ao vendedor — documento necessário para reivindicar o crédito na declaração.","timing":"Semanas a meses"},{"step":"Form 1040-NR e pedido de restituição","detail":"O vendedor declara e apura o ganho real, pedindo a restituição do excedente retido.","timing":"15/abr ou 15/jun do ano seguinte"},{"step":"Restituição","detail":"<em>Historicamente, 6 a 18 meses. Prazo corrente a confirmar.</em>","timing":"6–18 meses"}],"costs":[{"item":"Retenção FIRPTA","value":"15% do preço bruto","note":"Antecipação; excedente restituível após a declaração"},{"item":"Imposto efetivo — ganho de capital de longo prazo","value":"0%, 15% ou 20%","note":"Conforme a faixa de renda"},{"item":"Depreciation recapture","value":"25%","note":"Sobre a depreciação acumulada deduzida"},{"item":"Retenção estadual adicional","value":"Variável","note":"Califórnia 3,33%, e regimes próprios em Nova York, Maryland e Havaí — percentuais a verificar por estado"},{"item":"Form W-7 (ITIN)","value":"Sem taxa"}],"sections":[{"title":"Regras de família e co-propriedade","body":"O FIRPTA não tem regra de família própria.\n\nA <strong>co-propriedade entre cônjuges é tratada pro rata</strong> — a retenção é proporcional à participação do alienante estrangeiro.\n\nSe um dos cônjuges for <em>US person</em> com <em>non-foreign affidavit</em>, a retenção incide <strong>apenas sobre a parcela do estrangeiro</strong>."}],"brazilNote":"<strong>Dupla incidência sem alívio pleno.</strong> O ganho imobiliário nos EUA é tributado nos EUA (FIRPTA e ECI) <strong>e também no Brasil</strong>, se o alienante for residente fiscal brasileiro — ganho de capital sob a Lei 13.259/2016, com alíquotas progressivas de <strong>15%, 17,5%, 20% e 22,5%</strong>.\n\n<strong>O imposto federal americano pode ser compensado no Brasil</strong> sob a reciprocidade do <strong>ADI SRF 28/2000</strong>.\n\n<strong>Mas o imposto estadual e municipal americano NÃO é compensável</strong> — <em>state income tax</em>, <em>transfer tax</em> e <em>property tax</em> ficam expressamente fora da reciprocidade reconhecida pelo Ato Declaratório.\n\n<strong>Atenção à retenção estadual adicional:</strong> alguns estados impõem retenção própria na venda por não residente — Califórnia a 3,33%, e regimes próprios em Nova York, Maryland e Havaí. <em>Percentuais a verificar individualmente.</em> Essa camada é <strong>custo puro</strong> para o brasileiro, sem crédito no Brasil.\n\n<strong>Planejamento de fluxo de caixa:</strong> a retenção de 15% incide sobre o <strong>preço bruto</strong>, não sobre o ganho. Numa venda com ganho pequeno ou com prejuízo, o valor retido pode exceder largamente o imposto devido — e a restituição leva de 6 a 18 meses. O <strong>Form 8288-B</strong>, protocolado até o fechamento, é o instrumento para evitar essa imobilização de capital.","sources":[{"t":"IRS · FIRPTA withholding","u":"https://www.irs.gov/individuals/international-taxpayers/firpta-withholding"},{"t":"IRS · Exceptions from FIRPTA withholding","u":"https://www.irs.gov/individuals/international-taxpayers/exceptions-from-firpta-withholding"},{"t":"IRS · Form 8288","u":"https://www.irs.gov/forms-pubs/about-form-8288"},{"t":"Cornell LII · 26 U.S. Code §897","u":"https://www.law.cornell.edu/uscode/text/26/897"}]},{"name":"Green card, tributação mundial e o pacote declaratório","status":"risk","legalBasis":"<strong>FBAR:</strong> 31 U.S.C. §5314; 31 C.F.R. §1010.350. <strong>FATCA:</strong> IRC §6038D. <strong>Form 5471:</strong> IRC §6038 e §6046. <strong>Form 3520:</strong> IRC §6048. <strong>PFIC:</strong> IRC §§1291 a 1298 e §1298(f). <strong>FEIE:</strong> IRC §911. <strong>Foreign Tax Credit:</strong> IRC §901 e §904.","desc":"Tornar-se <em>US person</em> — cidadão, LPR ou <em>resident alien</em> pelo SPT — submete a pessoa a:\n· <strong>tributação sobre renda mundial</strong> (IRC §1 e §61) — dividendos, juros, aluguéis, ganhos, lucros de empresas, <strong>independentemente da fonte e de remessa</strong>;\n· <strong>herança e doação sobre patrimônio mundial</strong>, com a contrapartida da exclusão de USD 15.000.000 (2026);\n· <strong>um dos dois únicos sistemas de tributação por cidadania do mundo</strong>, ao lado da Eritreia.\n\n<strong>Créditos disponíveis:</strong> <em>Foreign Tax Credit</em> (IRC §901 e §904, Form 1116) e, para renda de trabalho, <em>Foreign Earned Income Exclusion</em> (§911, Form 2555), cujo limite é de <strong>USD 132.900 em 2026</strong> <em>(a confirmar na Rev. Proc. 2025-32)</em>.\n\n<strong>PFIC — a armadilha crítica para brasileiros.</strong> Corporação estrangeira em que 75% ou mais da receita bruta é passiva, <strong>ou</strong> 50% ou mais dos ativos produzem renda passiva (§1297(a)). <strong>Não há limiar mínimo de participação — uma única cota aciona o regime.</strong>","kv":[{"l":"FBAR — limiar","v":"USD 10.000 agregados"},{"l":"FBAR — prazo","v":"15/abr, extensão a 15/out"},{"l":"Form 8938 — no exterior, solteiro","v":"USD 200k / 300k"},{"l":"Form 8938 — no exterior, casado","v":"USD 400k / 600k"},{"l":"Form 5471","v":"≥ 10% de voto ou valor"},{"l":"Form 3520 — doação do exterior","v":"> USD 100.000 de PF"},{"l":"Form 3520-A","v":"15 de março"},{"l":"Form 8621 (PFIC)","v":"Uma cota já aciona"},{"l":"FEIE 2026","v":"≈USD 132.900"},{"l":"Penalidade FBAR não-willful","v":"Até USD 16.536 por formulário"},{"l":"Penalidade FBAR willful","v":"50% do saldo"},{"l":"Penalidade Form 3520","v":"35% do valor transferido"}],"requirements":["<strong>FinCEN 114 (FBAR)</strong> — agregado superior a <strong>USD 10.000</strong> em qualquer momento do ano, em contas financeiras no exterior, <strong>inclusive por assinatura autorizada sem titularidade</strong>. Prazo: 15 de abril, com extensão automática para 15 de outubro. Penalidade não-willful: até <strong>USD 16.536 por formulário/ano</strong> — após <em>Bittner v. United States</em>, 598 U.S. 118 (2023), a penalidade é <strong>por formulário, não por conta</strong>. Willful: o maior entre cerca de USD 165.000 e <strong>50% do saldo</strong>, mais crime.","<strong>Form 8938 (FATCA)</strong> — ativos financeiros estrangeiros. Limiares: USD 50k/75k (solteiro nos EUA); USD 100k/150k (casado nos EUA); <strong>USD 200k/300k (solteiro no exterior)</strong>; <strong>USD 400k/600k (casado no exterior)</strong>. Penalidade: USD 10.000, até USD 50.000 por continuação.","<strong>Form 5471</strong> — participação em corporação estrangeira, tipicamente 10% ou mais de voto ou valor (5 categorias de <em>filers</em>). Penalidade: <strong>USD 10.000 por empresa/ano</strong>, mais até USD 50.000.","<strong>Form 3520</strong> — criação ou transferência a trust estrangeiro; distribuições recebidas; e <strong>doação ou herança do exterior superior a USD 100.000</strong> (de pessoa física) ou superior a cerca de USD 20.116 (de pessoa jurídica estrangeira) <em>(limiar indexado, a confirmar)</em>. Penalidade: <strong>35% do valor transferido</strong>, ou 5% ao mês até 25% para doações.","<strong>Form 3520-A</strong> — <em>foreign grantor trust</em> com <em>US owner</em>. Prazo: <strong>15 de março</strong>. Penalidade: 5% do valor dos ativos do trust.","<strong>Form 8621</strong> — ações de PFIC. <strong>A omissão suspende a prescrição de todo o ano fiscal</strong> enquanto não protocolado (§6501(c)(8)).","<strong>Form 8865</strong> (partnership estrangeira), <strong>Form 926</strong> (transferência de bens a corporação estrangeira — 10% do valor, até USD 100.000), <strong>Form 5472</strong> (USD 25.000) e <strong>Form 8858</strong> (<em>foreign disregarded entity</em> — USD 10.000)."],"sections":[{"title":"PFIC — o que é PFIC no portfólio brasileiro típico","body":"· <strong>Fundos de investimento brasileiros</strong> — multimercado, renda fixa, ações, DI → <strong>PFIC, praticamente todos</strong>\n· <strong>Fundos exclusivos e FIC-FIA</strong> → PFIC\n· <strong>FIIs (fundos imobiliários)</strong> → PFIC, em regra\n· <strong>PGBL e VGBL</strong> → <strong>PFIC ou <em>foreign trust</em></strong> — tratamento contestado, tipicamente PFIC pela composição da carteira; o VGBL pode ainda <strong>não qualificar como seguro de vida sob IRC §7702</strong>\n· <strong>ETFs brasileiros</strong> (BOVA11 e similares) → PFIC\n· <strong>Ações individuais de empresas brasileiras</strong> (PETR4, VALE3) → <strong>não</strong> são PFIC (empresas operacionais), mas geram Form 8938\n· <strong>Holding patrimonial brasileira</strong> Ltda. ou S.A. → <strong>PFIC e/ou CFC</strong>; se controlada por US persons, prevalece o regime de <strong>CFC</strong> (Subpart F e GILTI), com Form 5471\n· <strong>Poupança, CDB, LCI, LCA e Tesouro Direto</strong> → não são PFIC (são dívida), mas entram no FBAR e no 8938\n\n<strong>Os três regimes de tributação:</strong>\n\n<strong>1. Excess distribution (regime padrão, §1291) — o mais oneroso.</strong> Distribuições «em excesso» e o ganho na venda são <strong>alocados linearmente por todo o período de detenção</strong>; a parcela atribuída a anos anteriores é tributada à <strong>alíquota marginal máxima daquele ano</strong> — não à alíquota do contribuinte —, <strong>acrescida de juros compostos</strong> desde então. <strong>A carga efetiva pode superar o próprio ganho</strong> em posições antigas. Não há aproveitamento de perda.\n\n<strong>2. QEF — Qualified Electing Fund (§1295).</strong> Inclusão anual pro rata da renda ordinária e do ganho de capital líquido do fundo. <strong>Exige que o fundo forneça um <em>PFIC Annual Information Statement</em></strong> — que <strong>fundos brasileiros, na prática, não fornecem</strong>, o que torna a eleição <strong>normalmente indisponível de fato</strong>.\n\n<strong>3. Mark-to-market (§1296).</strong> Exige que a ação seja <em>marketable</em> — negociada em bolsa qualificada. Ganhos anuais tributados como <strong>renda ordinária</strong>; perdas dedutíveis apenas até ganhos previamente reconhecidos. Aplicável a ETFs listados, raramente a fundos abertos brasileiros.\n\n<strong>Regra de eleição tardia:</strong> feita a eleição QEF ou MTM em ano posterior ao primeiro de detenção, é necessário um <em>purging election</em> — venda ficta com tributação sob §1291 — para «limpar» o histórico.\n\n<strong>Consequência operacional decisiva:</strong> o brasileiro que se torna <em>US person</em> <strong>carrega para dentro do regime americano todo o portfólio brasileiro de fundos, com o histórico de detenção anterior</strong> — e o §1291 alcança o <strong>período inteiro de detenção</strong>, inclusive anos anteriores à residência, salvo eleição de <em>purging</em> na entrada."},{"title":"Planejamento pré-imigratório — a janela que se fecha","body":"<em>Técnicas documentadas na literatura fiscal americana. Todas dependem de execução <strong>antes</strong> da <em>residency starting date</em> (§7701(b)(2)(A)) — primeiro dia de presença física no ano em que o SPT é satisfeito, ou primeiro dia como LPR.</em>\n\n· <strong>Step-up de base</strong> — venda e recompra de ativos apreciados. <strong>Não há step-up automático na entrada</strong>; a base histórica é preservada. A venda prévia realiza o ganho <strong>sob a lei brasileira</strong> (15%–22,5%), evitando tributação americana futura sobre a valorização pré-residência. Custo fiscal imediato no Brasil; atenção à Lei 14.754/2023.\n· <strong>Check-the-box election</strong> (Form 8832; Treas. Reg. §301.7701-3) — converte a holding em <em>disregarded entity</em> ou <em>partnership</em> antes da entrada, permitindo liquidação com step-up. Prazo de eficácia retroativa de 75 dias; efeitos no Brasil a analisar.\n· <strong>Liquidação de posições em PFIC</strong> antes da entrada — evita que o período pré-residência seja alcançado pelo regime de <em>excess distribution</em>.\n· <strong>Aceleração de renda</strong> (dividendos, bónus, resgates) para o ano anterior — tributa no Brasil e não nos EUA.\n· <strong>Diferimento de deduções e perdas</strong> para após a entrada — aproveitamento contra renda americana.\n· <strong>Foreign grantor trust irrevogável</strong> constituído antes da entrada, com <em>grantor</em> não-US. <strong>Atenção ao §679:</strong> trata como <em>grantor trust</em> o trust estrangeiro constituído por quem se torna <em>US person</em> <strong>dentro de 5 anos</strong> antes da mudança de residência, se houver beneficiário americano — a «regra dos 5 anos». <strong>O trust deve ser estabelecido com antecedência.</strong>\n· <strong>Reestruturação de PGBL e VGBL</strong> — evita classificação como PFIC ou como seguro não qualificado sob §7702. O resgate no Brasil tem custo fiscal e perde a tabela regressiva.\n· <strong>Revisão de testamento e regime de bens</strong> — evita perda da <em>marital deduction</em> (§2056(d) e §2056A). A comunhão universal brasileira e o <em>community property</em> americano têm efeitos distintos.\n\n<strong>Streamlined Filing Compliance Procedures</strong> permanece disponível para regularização não-willful: <strong>penalidade de 0%</strong> para quem reside no exterior (SFOP) e <strong>5% do maior saldo agregado</strong> para quem reside nos EUA (SDOP). <em>O IRS já sinalizou revisões dos programas de regularização — verificar a disponibilidade corrente.</em>"},{"title":"Expatriação e Exit Tax — IRC §877A","body":"<strong>Base legal:</strong> IRC §877A (introduzido pelo <strong>HEART Act de 2008</strong>, Pub. L. 110-245, §301, para expatriações a partir de 17/jun/2008); IRC §877(a)(2); IRC §7701(a)(50) e §877A(g)(4); <strong>IRC §2801</strong> — regulamentos finais publicados em janeiro de 2025, com <strong>Form 708</strong>. Formulários: <strong>Form 8854</strong> e <strong>Form I-407</strong>.\n\n<strong>A quem se aplica:</strong> (i) <strong>cidadão americano</strong> que renuncia à cidadania; e (ii) <strong>long-term resident (LTR)</strong> — titular de green card em <strong>8 dos últimos 15 anos fiscais</strong>, <strong>contando qualquer fração de ano como ano inteiro</strong> (§877(e)(2)) — que abandone o status (I-407), tenha-o revogado, ou passe a ser tratado como residente de outro país sob tratado (o que <strong>não é possível para o Brasil</strong>, por inexistir tratado).\n\n<strong>Testes de <em>covered expatriate</em> — basta UM:</strong>\n· <strong>Net worth test:</strong> patrimônio líquido de <strong>USD 2.000.000 ou mais</strong> na data da expatriação. <strong>Valor fixo, não indexado desde 2008.</strong>\n· <strong>Tax liability test:</strong> média do imposto de renda federal líquido dos <strong>5 anos</strong> anteriores superior a <strong>USD 211.000</strong> (2026; era USD 206.000 em 2025) <em>(a confirmar na Rev. Proc. 2025-32)</em>.\n· <strong>Certification test:</strong> deixar de certificar, sob pena de perjúrio, <strong>conformidade fiscal integral nos 5 anos anteriores</strong> (Form 8854, Part IV). <strong>A simples omissão de protocolar o Form 8854 torna a pessoa covered expatriate automaticamente, independentemente de patrimônio.</strong>\n\n<strong>Consequências:</strong>\n· <strong>Mark-to-market (§877A(a))</strong> — venda ficta de <strong>todo o patrimônio mundial</strong> pelo valor de mercado no <strong>dia anterior</strong> à expatriação, com <strong>exclusão de ganho de USD 910.000</strong> (2026, indexado). O excedente é tributado às alíquotas de <em>capital gain</em>. As <em>wash sale rules</em> não se aplicam (§877A(a)(2)(B)). Há <strong>eleição de diferimento</strong> (§877A(b)) até a venda efetiva, mediante <strong>garantia adequada</strong>, <strong>renúncia irrevogável a benefícios de tratado</strong> e incidência de juros.\n· <strong>Regimes especiais (§877A(c)-(e))</strong> — <em>deferred compensation items</em>: planos americanos elegíveis sofrem retenção de <strong>30%</strong> nas distribuições futuras; planos não elegíveis são tratados como recebidos no dia anterior. <em>Specified tax deferred accounts</em> (IRA, 529, HSA): distribuição integral ficta. Interesses em <em>non-grantor trusts</em>: retenção de 30% na porção tributável de cada distribuição futura.\n· <strong>IRC §2801 — o efeito de mais longo alcance:</strong> o <em>US citizen</em> ou <em>resident</em> que <strong>receba</strong> doação ou herança de um <em>covered expatriate</em> paga imposto de <strong>40%</strong> sobre o valor recebido acima da exclusão anual, <strong>sem limite de tempo após a expatriação</strong>. Declarado em <strong>Form 708</strong>. <strong>Atinge a geração seguinte.</strong>\n· <strong>INA §212(a)(10)(E) — «Reed Amendment»:</strong> inadmissibilidade do ex-cidadão que renunciou «com propósito de evasão fiscal». Historicamente <strong>sem aplicação operacional relevante</strong> por ausência de regulamento. <em>Verificar se houve mudança em 2025-2026.</em>\n\n<strong>Custos:</strong> taxa consular de renúncia à cidadania de <strong>USD 2.350</strong> <em>(houve proposta de redução para USD 450 em 2023, com litígio — verificar a taxa vigente)</em>; <strong>Form I-407 sem taxa</strong>; Form 8854 sem taxa.\n\n<strong>A via mais frequente de exposição para brasileiros: obter green card e depois desistir.</strong>\n· O <strong>relógio de 8 anos</strong> começa no primeiro ano-calendário de posse do green card, <strong>contando frações de ano como ano cheio</strong> — um green card obtido em <strong>dezembro de 2026 já consome o ano-calendário de 2026</strong>;\n· consequência aritmética: green card emitido em <strong>dezembro de 2026</strong> e abandonado em <strong>janeiro de 2033</strong> já perfaz <strong>8 anos-calendário</strong> (2026 a 2033);\n· <strong>abandono com 7 anos ou menos de contagem afasta integralmente o regime de LTR</strong> — não há teste de patrimônio, nem exit tax, nem Form 8854;\n· o <strong>net worth test de USD 2.000.000</strong> considera o <strong>patrimônio mundial</strong>, inclusive imóveis, participações societárias e previdência no Brasil — limiar alcançado por boa parte do público de family office."},{"title":"State tax e state estate tax","body":"<strong>Nove estados sem imposto de renda estadual sobre pessoa física (2026):</strong> Alasca, Flórida, Nevada, New Hampshire, Dakota do Sul, Tennessee, Texas, Washington e Wyoming.\n\n<strong>Notas de precisão:</strong>\n· <strong>New Hampshire</strong> revogou o <em>Interest &amp; Dividends Tax</em> com efeitos a partir de <strong>1/jan/2025</strong> — passou a não ter imposto de renda nem imposto sobre vendas, combinação que compartilha apenas com o Alasca;\n· <strong>Tennessee</strong> revogou o <em>Hall Income Tax</em> a partir de 2021;\n· <strong>Washington</strong> não tributa renda ordinária, mas <strong>tributa ganho de capital de longo prazo a 7%</strong> na primeira faixa e <strong>9,9%</strong> acima de USD 1.000.000, com dedução-padrão de aproximadamente USD 262.000 <em>(valores de 2026 a confirmar)</em>;\n· ausência de imposto de renda estadual <strong>não</strong> implica ausência de outros tributos — <em>property tax</em>, <em>sales tax</em>, <em>franchise/margin tax</em> (Texas) e regimes municipais.\n\n<strong>Residência fiscal estadual:</strong> cada estado define de forma própria. Regras recorrentes: <strong>domicílio</strong> (intenção) mais <strong>statutory residence</strong> — em Nova York, <em>permanent place of abode</em> mais <strong>183 dias</strong> no estado. Estados de alta tributação (NY, CA) conduzem <strong>auditorias de mudança de domicílio</strong> com escrutínio documental intenso — registos de celular, cartões de crédito, dentista, veterinário. <strong>Não há tratado nem crédito estadual disponível ao Brasil.</strong>\n\n<strong>Doze estados mais o Distrito de Columbia com estate tax:</strong> Connecticut, Havaí, Illinois, Maine, Maryland, Massachusetts, Minnesota, Nova York, Oregon, Rhode Island, Vermont e Washington.\n· <strong>Oregon: USD 1.000.000</strong> — a menor exclusão do país\n· Massachusetts: USD 2.000.000 · Minnesota: USD 3.000.000\n· <strong>Washington: USD 3.076.000</strong> até 30/jun/2026; <strong>USD 3.000.000</strong> a partir de 1/jul/2026\n· Illinois: USD 4.000.000\n· <strong>Maryland: USD 5.000.000</strong> — <strong>único estado com estate tax E inheritance tax</strong> (10%)\n· Maine: USD 7.160.000\n· <strong>Nova York: USD 7.350.000</strong> — possui o <strong>«cliff»</strong>: ultrapassados 105% da exclusão, tributa-se <strong>todo</strong> o espólio\n· <strong>Connecticut: USD 15.000.000</strong> — acompanha o valor federal\n· Havaí, Rhode Island, Vermont e D.C. têm valores próprios <em>(a verificar)</em>\n\n<strong>Cinco estados com inheritance tax</strong> (imposto sobre o herdeiro, com alíquota variando pelo grau de parentesco): Kentucky, Maryland, Nebraska, Nova Jersey e Pensilvânia.\n\n<strong>O ponto crítico para o não domiciliado:</strong> diversos estados com estate tax <strong>tributam o não residente sobre imóveis e bens tangíveis localizados no estado</strong>, com exclusão calculada de forma proporcional — e <strong>as exclusões estaduais são muito inferiores à federal</strong>. Um brasileiro NRNC com apartamento em Manhattan ou em Boston pode enfrentar <strong>estate tax estadual além do federal</strong>, e <strong>nenhum dos dois é creditável no Brasil</strong>. <em>As regras de incidência sobre não residentes e o método de proporcionalização variam por estado e devem ser verificados individualmente.</em>\n\n<strong>Estados sem estate tax nem inheritance tax</strong> incluem Flórida, Texas, Nevada e Arizona. A Califórnia tem <em>income tax</em> elevado, mas <strong>não tem estate tax</strong>."}],"brazilNote":"<strong>Não existe tratado para evitar a dupla tributação da renda entre Brasil e Estados Unidos.</strong> As negociações remontam à década de 1960 e nunca se concluíram — os obstáculos historicamente apontados incluem os <strong>juros sobre capital próprio (JCP)</strong> brasileiros, a exigência americana de cláusula de <em>limitation on benefits</em>, e a tributação brasileira na fonte.\n\n<strong>O mecanismo substitutivo: reciprocidade de tratamento.</strong>\n· <strong>Lei n.º 4.862/1965, art. 5.º</strong> — autoriza a dedução do imposto pago no exterior quando houver reciprocidade;\n· <strong>Ato Declaratório SRF n.º 28, de 26 de abril de 2000</strong> — <strong>reconhece expressamente a reciprocidade de tratamento entre Brasil e Estados Unidos</strong>;\n· <strong>IN SRF n.º 208/2002, art. 16</strong> — disciplina a compensação;\n· <strong>Decreto n.º 9.580/2018 (RIR/2018)</strong>.\n\n<strong>Conteúdo do ADI SRF 28/2000:</strong> (1) a legislação <strong>federal</strong> americana admite a dedução, do imposto lá devido, do imposto pago no Brasil sobre rendimentos ali auferidos e tributados — configurando reciprocidade; (2) o imposto pago nos EUA <strong>pode ser compensado</strong> com o imposto devido no Brasil, dentro dos limites estabelecidos; e (3) <strong>a reciprocidade NÃO se estende aos impostos pagos a governos estaduais e municipais americanos</strong>.\n\n<strong>Requisitos de eficácia da compensação:</strong> compensação <strong>rendimento a rendimento</strong> (não há <em>pooling</em> global como no FTC americano); crédito <strong>limitado ao imposto brasileiro devido sobre aquele mesmo rendimento</strong>; conversão pela taxa de câmbio do BACEN <em>(regra exata a confirmar no art. 16)</em>; e <strong>comprovação documental</strong> do imposto pago — Form 1042-S, comprovante de retenção do custodiante, ou documento consularizado. A RFB pode exigir documento reconhecido pelo órgão arrecadador estrangeiro e traduzido por tradutor juramentado.\n\n<strong>O que EXISTE entre Brasil e EUA:</strong>\n· <strong>Reciprocidade de tratamento</strong> — ADI SRF 28/2000\n· <strong>TIEA</strong> — Acordo para Troca de Informações Tributárias, assinado em 20/mar/2007 <em>(número do decreto de promulgação a confirmar)</em> — troca de informações <strong>a pedido</strong>
