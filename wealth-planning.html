antém a nacionalidade brasileira</strong>, permanecendo sujeito às obrigações brasileiras associadas — inclusive as fiscais, enquanto não formalizar a saída fiscal.\n\n<em>Nota de verificação: confirmar a redação vigente do art. 12, §4.º, II da CF/88 e a regulamentação da EC 131/2023.</em>"},{"title":"Matriz de decisão temporal — o brasileiro que se muda","body":"<strong>Ano 1</strong> — início do FIG (se elegível); CSDP e DSDP no Brasil; concessão do visto\n<strong>Ano 2</strong> — FIG; TRF disponível se houver FIG anterior a 2025; Innovator Founder: <em>contact point</em> aos 12 meses\n<strong>Ano 3</strong> — FIG; TRF a 12% até 2026/27; Innovator Founder: <em>contact point</em> aos 24 meses\n<strong>Ano 4</strong> — <strong>último ano de FIG</strong>; TRF a 15% em 2027/28; Innovator Founder e Global Talent (<em>exceptional talent</em>): <strong>ILR</strong>\n<strong>Ano 5</strong> — <strong>tributação mundial pelo regime de competência</strong>; perda da isenção sobre FIG; Skilled Worker: <strong>ILR</strong> sob a regra vigente de 5 anos\n<strong>Ano 5–6</strong> — <strong>naturalização</strong>, 12 meses após o ILR\n<strong>Ano 10</strong> — <strong>torna-se long-term resident</strong>: patrimônio mundial entra no escopo do IHT\n<strong>Ano 15</strong> — cauda de IHT de 5 anos se sair nesse momento\n<strong>Ano 20 ou mais</strong> — cauda de IHT de <strong>10 anos</strong>"}],"brazilNote":"<strong>A Convenção Brasil–Reino Unido para evitar a dupla tributação NÃO está em vigor.</strong> Este é o dado central deste dossiê.\n\n<strong>Cronologia verificada:</strong>\n· <strong>29 de novembro de 2022</strong> — assinatura, em Brasília, da «Convenção entre a República Federativa do Brasil e o Reino Unido da Grã-Bretanha e Irlanda do Norte para Eliminar a Dupla Tributação em Relação aos Tributos sobre a Renda e Prevenir a Evasão e a Elisão Fiscais»;\n· <strong>julho de 2023</strong> — o <strong>Parlamento britânico aprova</strong> o acordo (procedimento CRaG mais <em>statutory instrument</em>); o lado britânico completa os trâmites internos;\n· <strong>2023 a 2026</strong> — tramitação pendente no <strong>Congresso Nacional brasileiro</strong> (Mensagem presidencial → Comissão de Relações Exteriores da Câmara → Plenário → Senado → Decreto Legislativo → depósito ou troca de notas → decreto presidencial de promulgação);\n· <strong>junho de 2026, última verificação</strong> — <strong>a Convenção não está em vigor</strong>. As autoridades britânicas continuam a reportá-la como <em>not yet in force</em>. Contribuintes seguem aplicando as normas internas de cada país e a reciprocidade.\n\n<strong>Qualquer material de planejamento que pressuponha a aplicação das alíquotas reduzidas da Convenção está incorreto na data deste levantamento.</strong> O status pode mudar a qualquer momento — consultar o portal Concórdia do Itamaraty, a Receita Federal, a tramitação do PDL no Congresso, e a coleção de tratados da HMRC.\n\n<strong>Conteúdo da Convenção assinada, para quando produzir efeitos</strong> (todos a confirmar no texto):\n· <strong>Dividendos</strong> — 10% em geral, com taxa reduzida (possivelmente 0%) para participações qualificadas e fundos de pensão\n· <strong>Juros</strong> — 15% em geral, com reduções específicas (bancos, prazos longos, entes públicos)\n· <strong>Royalties</strong> — 10% em geral; <strong>15% para marcas</strong>\n· <strong>Serviços técnicos</strong> — artigo específico com limite de retenção, inovação relevante frente aos tratados brasileiros mais antigos\n· <strong>Ganhos de capital</strong> — tributação no Estado de residência do alienante, com exceção para sociedades <em>property-rich</em>\n· <strong>Método</strong> — crédito ordinário em ambos os Estados\n· cláusula anti-abuso <strong>Principal Purpose Test (PPT)</strong>, padrão BEPS Ação 6, e procedimento amigável (MAP)\n\n<strong>Produção de efeitos, quando entrar em vigor</strong> (padrão dos tratados brasileiros): impostos retidos na fonte, sobre valores pagos ou creditados a partir de 1.º de janeiro do ano civil seguinte; demais impostos, para exercícios iniciados a partir de 1.º de janeiro do ano civil seguinte.\n\n<strong>Acordo bilateral estreito que existe e está vigente:</strong> Acordo Brasil–Reino Unido para evitar a dupla tributação de <strong>salários de tripulantes de aeronaves em tráfego internacional</strong>, assinado em Brasília em 2/set/2010, aprovado pelo Decreto Legislativo n.º 372/2013 e promulgado pelo <strong>Decreto n.º 8.984/2017</strong>. Escopo restrito — não é tratado abrangente de renda.\n\n<strong>NÃO EXISTE acordo de previdência social entre Brasil e Reino Unido.</strong> Consequências:\n· <strong>não há totalização</strong> de tempo de contribuição — períodos no INSS e no <em>National Insurance</em> permanecem estanques;\n· <strong>não há certificado de deslocamento temporário</strong> (equivalente ao A1) — um brasileiro transferido pode ficar sujeito a NIC britânico e contribuição previdenciária brasileira <strong>simultaneamente</strong>;\n· o Reino Unido é apontado como <strong>o único</strong> entre os dez países com maior comunidade brasileira no exterior <strong>sem</strong> acordo previdenciário com o Brasil. Há registo de contato diplomático, sem instrumento assinado.\n· <em>Verificar a regra de isenção de NIC de 52 semanas para <em>seconded workers</em> de países sem acordo, no NIC Manual da HMRC.</em>\n\n<strong>Planejamento previdenciário:</strong> avaliar (i) manter <strong>contribuição facultativa ao INSS</strong> (Lei n.º 8.213/1991, art. 11, e Decreto n.º 3.048/1999) para preservar carência e qualidade de segurado; e (ii) o mínimo de <strong>10 anos qualificantes</strong> de NIC para acesso à <em>new State Pension</em> britânica (35 anos para o valor integral), com possibilidade de compra de <strong>Class 3 voluntary contributions</strong>.","warning":"<strong>Não há tratado de dupla tributação em vigor entre Brasil e Reino Unido</strong>, e <strong>não há acordo de previdência social</strong>. As duas ausências, somadas, definem o perfil de risco do brasileiro que se muda:\n\n· sem tratado, <strong>não há tie-breaker</strong> para dupla residência fiscal — o alívio depende de mecanismos unilaterais, limitados e apurados rendimento a rendimento;\n· sem acordo previdenciário, <strong>não há totalização</strong> nem certificado de deslocamento — há risco de dupla contribuição.\n\nSome-se a isso o <strong>IHT tail de até 10 anos</strong> após a saída e a proposta de <strong>earned settlement</strong> de 10 anos com possível aplicação a estoque, e o horizonte de planejamento passa a ser de uma década ou mais — não de cinco anos.","sources":[{"t":"DavidsonMorris · Indefinite Leave to Remain (ILR) UK 2026","u":"https://www.davidsonmorris.com/indefinite-leave-to-remain/"},{"t":"DavidsonMorris · UK Dual Citizenship 2026","u":"https://www.davidsonmorris.com/dual-citizenship-uk/"},{"t":"EY Global · Brasil e Reino Unido assinam tratado abrangente de dupla tributação","u":"https://www.ey.com/en_gl/technical/tax-alerts/brazil-and-united-kingdom-sign-comprehensive-double-tax-treaty"},{"t":"BrasilTax · Acordo de bitributação Brasil–Reino Unido: está em vigor?","u":"https://brasiltax.com/blog/acordo-bitribuacao-brasil-reino-unido/"},{"t":"Agência Brasil · Parlamento britânico aprova acordo de não-bitributação com o Brasil","u":"https://agenciabrasil.ebc.com.br/economia/noticia/2023-07/parlamento-britanico-aprova-acordo-de-nao-bitributacao-com-o-brasil"},{"t":"Planalto · Decreto n.º 8.984/2017 (tripulantes de aeronaves)","u":"http://www.planalto.gov.br/ccivil_03/_ato2015-2018/2017/decreto/d8984.htm"},{"t":"Ministério da Previdência Social · Acordos internacionais","u":"https://www.gov.br/previdencia/pt-br/assuntos/acordos-internacionais/acordos-internacionais"}]}]},"hk":{"id":"hk","flagCode":"hk","name":"Hong Kong","region":"Ásia","alert":true,"sumFiscal":"Territorialidade · sem CGT, sem herança, sem IVA","sumFS":"ok","sumVisa":"New CIES HKD 30M · Top Talent Pass · QMAS","sumVS":"changed","fiscal":[{"name":"Princípio da territorialidade e a estrutura do sistema tributário","status":"ok","legalBasis":"<strong>Inland Revenue Ordinance (IRO), Cap. 112</strong> — norma-matriz de todos os impostos sobre renda em Hong Kong. Seções relevantes: s. 8 (Salaries Tax), s. 14 (Profits Tax), s. 5 (Property Tax), s. 41 (Personal Assessment), s. 15 (<em>deemed trading receipts</em>). <em>A numeração das Schedules deve ser confirmada em elegislation.gov.hk.</em>","desc":"Hong Kong adota o <strong>princípio da fonte territorial</strong>: <strong>somente lucros e rendimentos com fonte em Hong Kong são tributados</strong>. Rendimento de fonte estrangeira, em regra, não é tributado — <strong>independentemente de ser remetido ou não</strong> para Hong Kong. Não há regime de <em>remittance basis</em> como o do antigo sistema britânico.\n\nSob a IRO, uma pessoa é sujeita a <strong>Profits Tax</strong> quando <strong>cumulativamente</strong>:\n1. exerce um comércio, profissão ou negócio (<em>trade, profession or business</em>) em Hong Kong;\n2. esse negócio gera lucros; e\n3. os lucros <strong>surgem em, ou derivam de, Hong Kong</strong>.\n\nA ausência de qualquer um dos três elementos afasta a incidência.\n\n<strong>Ponto crítico para planejamento:</strong> o regime FSIE <strong>não alterou</strong> o princípio da fonte. Ele opera como regra de tributação <em>superveniente</em> sobre rendimento de fonte estrangeira <strong>recebido em Hong Kong por entidades de grupos multinacionais</strong> — e <strong>não se aplica a pessoas físicas</strong>.","kv":[{"l":"Princípio","v":"Fonte territorial"},{"l":"Rendimento estrangeiro de PF","v":"Não tributado"},{"l":"Regime de remessa","v":"Inexistente"},{"l":"Ano fiscal","v":"1 de abril a 31 de março"},{"l":"Salaries Tax — progressiva","v":"2% a 17%"},{"l":"Salaries Tax — standard rate","v":"15% até HKD 5M · 16% acima"},{"l":"Profits Tax — corporações","v":"8,25% até HKD 2M · 16,5%"},{"l":"Profits Tax — não incorporadas","v":"7,5% até HKD 2M · 15%"},{"l":"Property Tax","v":"15% sobre o NAV"},{"l":"MPF — contribuição","v":"5% + 5%, teto HKD 30.000/mês"}],"sections":[{"title":"Testes de fonte (source rules)","body":"O IRD aplica o <em>«operations test»</em> consolidado em <strong>CIR v. Hang Seng Bank</strong> e <strong>CIR v. HK-TVB International</strong>: pergunta-se <strong>«o que o contribuinte fez para ganhar o lucro e onde o fez»</strong>.\n\nRegras práticas usualmente citadas:\n· <strong>comércio de mercadorias</strong> — local onde os contratos de compra e de venda são efetivamente negociados e concluídos;\n· <strong>serviços</strong> — local onde os serviços são prestados;\n· <strong>juros</strong> (fora do setor financeiro) — <em>provision of credit test</em>: onde o crédito foi disponibilizado;\n· <strong>aluguéis de imóveis</strong> — local do imóvel;\n· <strong>comissões</strong> — onde a atividade que gerou a comissão foi exercida.\n\n<em>Nota de verificação: confirmar na DIPN n.º 21 do IRD (Locality of profits), última revisão.</em>"},{"title":"Salaries Tax — a regra do «melhor dos dois cálculos»","body":"O contribuinte paga <strong>o menor</strong> entre:\n\n<strong>(a) Cálculo pelas alíquotas progressivas</strong> — aplicadas sobre o <em>net chargeable income</em> (rendimento avaliável menos deduções menos <em>allowances</em> pessoais):\n· primeiros HKD 50.000 → 2%\n· HKD 50.001 – 100.000 → 6%\n· HKD 100.001 – 150.000 → 10%\n· HKD 150.001 – 200.000 → 14%\n· acima de HKD 200.000 → 17%\n\n<strong>(b) Cálculo pelo <em>standard rate</em></strong> — aplicado sobre o <em>net income</em> (rendimento avaliável menos deduções, <strong>sem</strong> as <em>allowances</em> pessoais).\n\n<strong>Two-tiered standard rates — mudança confirmada.</strong> A partir do ano de avaliação <strong>2024/25</strong> (iniciado em 1/abr/2024), o <em>standard rate</em> deixou de ser único de 15% e passou a ser escalonado:\n· primeiros <strong>HKD 5.000.000</strong> de <em>net income</em> → <strong>15%</strong>\n· excedente acima de HKD 5.000.000 → <strong>16%</strong>\n\nSegundo o Governo, a medida afeta cerca de <strong>12.000 contribuintes (0,6% do total)</strong>, com arrecadação estimada de <strong>HKD 910 milhões por ano</strong>.\n\n<strong>Implicação de teto:</strong> o <em>standard rate</em> funciona como <strong>teto efetivo</strong> da tributação do trabalho. Para rendimentos elevados, a carga tende a 15% até HKD 5 milhões de rendimento líquido e 16% no excedente.\n\n<strong>Personal Assessment</strong> (IRO, s. 41): mecanismo eletivo pelo qual residentes agregam Salaries Tax, Profits Tax (negócio não incorporado) e Property Tax numa única base, aplicando <em>allowances</em> e podendo deduzir juros de empréstimo para aquisição do imóvel locado e prejuízos. <strong>A partir de 2024/25, as two-tiered standard rates também se aplicam sob Personal Assessment.</strong>"},{"title":"Allowances e deduções — valores de referência","body":"<strong>Allowances pessoais</strong> (congeladas desde 2018/19 em vários casos) — <em>valores a confirmar integralmente em ird.gov.hk</em>:\n· Basic allowance (individual): HKD 132.000\n· Married person's allowance: HKD 264.000\n· Child allowance (1.º ao 9.º filho, cada): HKD 130.000, com adicional de HKD 130.000 no ano de nascimento\n· Dependent parent ou grandparent com 60 anos ou mais: HKD 50.000 cada; entre 55 e 59 anos: HKD 25.000 cada\n· <em>Additional</em> dependent parent (coabitação): dobra o valor\n· Dependent brother ou sister: HKD 37.500\n· Single parent allowance: HKD 132.000\n· Disabled dependant allowance e Personal disability allowance: HKD 75.000 cada\n\n<strong>Deduções</strong> (aplicáveis a ambos os cálculos), com tetos anuais:\n· despesas de autoaperfeiçoamento (<em>self-education</em>): HKD 100.000\n· juros de financiamento habitacional: HKD 100.000, limitado a 20 anos de avaliação\n· aluguel de residência (<em>domestic rents</em>): HKD 100.000, elevado para 120.000 em caso de recém-nascido, a partir de 2024/25\n· despesas com lar de idosos: HKD 100.000\n· contribuições obrigatórias ao MPF: HKD 18.000\n· contribuições voluntárias qualificadas (TVC) mais produtos de anuidade diferida (QDAP): HKD 60.000 no conjunto\n· prémios VHIS (seguro-saúde voluntário), por segurado: HKD 8.000\n· doações a instituições de caridade aprovadas: 35% do rendimento\n\n<strong>Redução anual («tax rebate»):</strong> Hong Kong concede anualmente uma redução percentual do imposto devido, com teto — 100% com teto de HKD 3.000 em 2023/24, reduzido para HKD 1.500 em 2024/25. <em>Tetos de 2025/26 e 2026/27 a verificar no Budget respectivo.</em>\n\n<strong>Prazos:</strong> ano fiscal de 1/abr a 31/mar; <em>Individual Tax Return</em> (BIR60) emitida em maio, com prazo de 1 mês (3 meses se houver negócio individual); empregador emite <strong>IR56B</strong> anualmente.\n\n<strong>Saída de Hong Kong:</strong> o empregador deve notificar o IRD com <strong>1 mês de antecedência</strong> (formulário <strong>IR56G</strong>) e <strong>reter pagamentos</strong> até a liberação fiscal (<em>tax clearance</em>). Esta é a etapa de saída do regime para o expatriado."},{"title":"Profits Tax e regimes concessionários","body":"<strong>Pessoas jurídicas (corporations):</strong>\n· primeiros <strong>HKD 2.000.000</strong> de lucro tributável → <strong>8,25%</strong>\n· excedente → <strong>16,5%</strong>\n\n<strong>Negócios não incorporados</strong> (firmas individuais e <em>partnerships</em>):\n· primeiros HKD 2.000.000 → <strong>7,5%</strong>\n· excedente → <strong>15%</strong>\n\n<strong>Regra «um grupo, uma entidade»:</strong> dentro de um grupo de <em>connected entities</em>, <strong>apenas uma</strong> pode gozar da alíquota reduzida em cada ano; as demais aplicam 16,5% sobre a totalidade. A eleição é feita na declaração anual.\n\n<strong>Características estruturais:</strong>\n· <strong>sem tributação em base mundial</strong> e <strong>sem regras CFC</strong> próprias;\n· <strong>sem imposto sobre dividendos distribuídos</strong> nem retenção na fonte sobre dividendos pagos ao exterior;\n· <strong>sem retenção sobre juros</strong> pagos ao exterior;\n· <strong>retenção sobre royalties</strong>: existe, via <em>deemed trading receipt</em> (IRO, s. 15(1)(a)/(b)); alíquota efetiva usual de <strong>4,95%</strong> (16,5% sobre 30% do bruto) para não residentes não associados, ou 16,5% sobre 100% se associado e o IP já tiver sido tributado em Hong Kong;\n· <strong>prejuízos fiscais</strong>: transporte indefinido para frente; <strong>sem <em>carry-back</em></strong>;\n· <strong>sem consolidação fiscal de grupo</strong>.\n\n<strong>Regimes concessionários setoriais</strong> (alíquota de 8,25% ou menor): <em>corporate treasury centres</em>, <em>aircraft leasing</em>, <em>ship leasing</em> e <em>ship agency</em>, resseguro e <em>captive insurance</em>, e <strong>patent box</strong> — alíquota concessionária de <strong>5%</strong>, introduzida pela Inland Revenue (Amendment) (Tax Concessions for Intellectual Property Income) Ordinance 2024.\n\n<strong>Pillar Two:</strong> Hong Kong promulgou em 2025 a Inland Revenue (Amendment) (Minimum Tax for Multinational Enterprise Groups) Ordinance 2025, implementando a <strong>IIR</strong> e o <strong>Hong Kong Minimum Top-up Tax (HKMTT) a 15%</strong> para grupos multinacionais com receita consolidada igual ou superior a <strong>€750 milhões</strong>, com efeitos para exercícios iniciados a partir de 1/jan/2025. <em>Data de sanção, escopo e existência de UTPR a confirmar.</em>\n<strong>Relevância para famílias brasileiras:</strong> grupos familiares cujo faturamento consolidado global atinja €750 milhões podem estar no escopo — situação plausível em famílias com operações produtivas no Brasil."},{"title":"Tributos que não existem em Hong Kong","body":"· <strong>Imposto sobre ganhos de capital: não existe.</strong> <em>Atenção:</em> o IRD pode <strong>requalificar ganhos como lucro comercial</strong> tributável por Profits Tax quando houver <em>badges of trade</em> — frequência, prazo de detenção, motivação, financiamento. Existe o <strong>Tax Certainty Enhancement Scheme</strong> (desde 2023), que permite obter certeza de tratamento como capital em alienações de participações societárias que atendam a requisitos objetivos <em>(participação de 15% ou mais, mantida por 24 meses ou mais, entre outros — a confirmar)</em>.\n· <strong>Imposto sobre dividendos recebidos: não existe</strong> — dividendos de fonte de Hong Kong são isentos (IRO, s. 26); dividendos estrangeiros seguem o FSIE, quando aplicável.\n· <strong>Retenção sobre dividendos pagos: não existe.</strong>\n· <strong>Imposto sobre juros de depósito: não existe</strong> — juros pagos por bancos, associações de poupança e instituições depositárias autorizadas em Hong Kong são isentos para pessoas físicas e para negócios.\n· <strong>IVA, GST ou imposto geral sobre consumo: não existem.</strong> Há impostos especiais sobre 4 produtos: bebidas alcoólicas fortes, tabaco, hidrocarbonetos e álcool metílico.\n· <strong>Imposto sucessório (Estate Duty): abolido.</strong> Aplica-se a falecimentos ocorridos <strong>em ou após 11 de fevereiro de 2006</strong>, por força da <strong>Revenue (Abolition of Estate Duty) Ordinance 2005</strong>, que emendou a Estate Duty Ordinance, Cap. 111. <em>Data e número a confirmar em elegislation.gov.hk.</em>\n· <strong>Imposto sobre doações: não existe.</strong>\n· <strong>Imposto sobre patrimônio ou fortuna: não existe.</strong>\n· <strong>Contribuições sociais sobre folha:</strong> não há previdência estatal contributiva clássica; há o <strong>MPF (Mandatory Provident Fund)</strong> — contribuição obrigatória de <strong>5% do empregador mais 5% do empregado</strong>, com teto de rendimento relevante de <strong>HKD 30.000/mês</strong> (contribuição máxima de HKD 1.500/mês cada).\n\n<strong>Consequência para o planejamento sucessório:</strong> com o Estate Duty abolido desde 2006 e sem imposto sobre doações, a transmissão de ativos situados em Hong Kong <strong>não gera tributo local</strong>. O risco tributário para o brasileiro migra integralmente para o <strong>lado brasileiro</strong> — ITCMD estadual e IRPF sobre ganho de capital."},{"title":"Property Tax, rates e Stamp Duty — o que mudou em 2024, 2025 e 2026","body":"<strong>Property Tax</strong> (IRO, s. 5): incide a <strong>15% sobre o Net Assessable Value (NAV)</strong> de imóveis situados em Hong Kong locados a terceiros. NAV = aluguel bruto recebido, menos as <em>rates</em> pagas pelo proprietário, menos <strong>abatimento padrão de 20%</strong> para reparos e manutenção (não há dedução de despesas reais). Fórmula efetiva: 15% sobre 80% do aluguel líquido de rates — <strong>carga efetiva de aproximadamente 12% do aluguel</strong>.\n· <strong>Sociedades</strong> que auferem aluguéis podem obter isenção de Property Tax e tributar por Profits Tax (IRO, s. 5(2)(a)), o que em geral permite deduzir juros e depreciação.\n· <strong>Pessoas físicas</strong> podem eleger <strong>Personal Assessment</strong> para deduzir juros do financiamento.\n· Imóvel de uso próprio não paga Property Tax, mas paga <em>rates</em> e <em>Government rent</em>.\n\n<strong>Rates e Government rent:</strong> <em>rates</em> a 5% do <em>rateable value</em> anual, pagas trimestralmente; <em>Government rent</em> a 3% do <em>rateable value</em> para a maioria dos terrenos. Não são impostos sobre renda.\n\n<strong>Stamp Duty sobre imóveis — a sequência de três mudanças:</strong>\n\n<strong>1. Abolição das medidas de arrefecimento — 28 de fevereiro de 2024.</strong> Foram <strong>abolidas todas as <em>demand-side management measures</em></strong> para transações residenciais:\n· <strong>BSD — Buyer's Stamp Duty</strong> (15% que incidia sobre compradores <strong>não residentes permanentes</strong> de Hong Kong e sobre pessoas jurídicas) — <strong>abolido</strong>;\n· <strong>SSD — Special Stamp Duty</strong> (imposto de revenda rápida, até 20%) — <strong>abolido</strong>;\n· <strong>NRSD — New Residential Stamp Duty</strong> (15% flat) — <strong>abolido</strong>.\n\n<strong>Consequência direta:</strong> desde 28/fev/2024, o <strong>comprador estrangeiro — incluindo o brasileiro não residente permanente — paga a mesma alíquota que o residente permanente de Hong Kong</strong>: a Scale 2 do AVD. Este é o ponto de maior relevância prática para o público-alvo.\n\n<strong>2. Ad Valorem Stamp Duty (AVD) — Scale 2 desde 26 de fevereiro de 2025.</strong> Todas as transações, residenciais e não residenciais, independentemente da nacionalidade ou residência do comprador e de já possuir outro imóvel, sujeitam-se às <em>rates</em> originais da Scale 2:\n· imóveis de valor <strong>até HKD 4.000.000</strong> pagam <strong>HKD 100</strong> de selo;\n· alíquota máxima da Scale 2: <strong>4,25%</strong>, atingida a partir de <strong>HKD 21.739.120</strong>.\n<em>A tabela progressiva completa entre HKD 4M e HKD 21,74M deve ser obtida em ird.gov.hk ou no anexo à Stamp Duty Ordinance.</em>\n\n<strong>3. Nova faixa superior — desde 26 de fevereiro de 2026 (Budget 2026-27).</strong> Para instrumentos executados em ou após 26/fev/2026:\n· até HKD 100.000.000 → Scale 2, máximo de <strong>4,25%</strong>\n· HKD 100.000.001 – 109.574.470 → <strong>HKD 4.250.000 mais 30% do excedente sobre HKD 100.000.000</strong> (faixa de transição)\n· HKD 109.574.471 ou mais → <strong>6,5% flat</strong> sobre a contraprestação total\nSegundo o IRD, a medida afeta aproximadamente <strong>0,3% das transações residenciais</strong>.\n\n<strong>Outros selos:</strong>\n· <strong>transferência de ações de sociedade de Hong Kong</strong>: 0,1% por parte (comprador e vendedor), total de <strong>0,2%</strong> — reduzido de 0,26% em 17/nov/2023. Relevante para reorganizações societárias e veículos de family office;\n· <strong>contratos de locação</strong>: 0,25% a 1%, conforme o prazo;\n· <strong>alívio para transferências intragrupo</strong> (Stamp Duty Ordinance, s. 45): isenção para transferências entre sociedades associadas com 90% ou mais de participação. Houve modernização da arquitetura de <em>corporate relief</em> nos Orçamentos de 2024-25 a 2026-27, e o Budget 2026-27 iniciou a abertura de incentivos de <em>stamp duty</em> a novas estruturas de mercado, incluindo REITs. <em>Detalhes a confirmar.</em>"}],"brazilNote":"<strong>Hong Kong CONSTA da lista brasileira de jurisdições com tributação favorecida.</strong> Esta é, do ponto de vista de wealth planning brasileiro, a informação mais determinante de todo este dossiê.\n\nHong Kong está incluída no <strong>art. 1.º da IN RFB n.º 1.037, de 4 de junho de 2010</strong>, e <strong>permanece na lista após as alterações de 2025</strong>. A <strong>IN RFB n.º 2.265/2025</strong> (assinada em 9/mai/2025, publicada em 13/mai/2025) excluiu os Emirados Árabes Unidos da lista de jurisdições com tributação favorecida e o regime austríaco de holding da lista de regimes fiscais privilegiados — <strong>Hong Kong não foi excluída</strong>.\n\n<strong>Racional técnico:</strong> Hong Kong satisfaz o critério do art. 24 da Lei 9.430/1996 porque (i) <strong>não tributa rendimento de fonte estrangeira</strong> e (ii) a alíquota máxima de Profits Tax, de <strong>16,5%</strong>, é <strong>inferior ao limiar de 17%</strong> (reduzido de 20% para 17% para jurisdições alinhadas aos padrões de transparência, pela Portaria MF n.º 488/2014). <em>O inciso exato do art. 1.º em que «Hong Kong» figura deve ser verificado no texto compilado da IN.</em>\n\n<strong>Consequências jurídicas da classificação como JTF — todas relevantes:</strong>\n\n· <strong>IRRF majorado a 25%</strong> (Lei 9.779/1999, art. 8.º) — rendimentos, ganhos de capital e demais proventos pagos, creditados, entregues, empregados ou remetidos por fonte no Brasil a pessoa física ou jurídica residente ou domiciliada em JTF sofrem IRRF de <strong>25%</strong>, em vez das alíquotas ordinárias.\n· <strong>Ganho de capital de não residente</strong> (Lei 10.833/2003, art. 18) — alienação de bens no Brasil por residente em JTF: <strong>25%</strong>, em vez da escala progressiva de 15% a 22,5%.\n· <strong>Perda dos benefícios de investidor estrangeiro (Res. CMN 4.373)</strong> — investidor não residente em JTF <strong>não</strong> faz jus à alíquota zero de IR sobre ganhos em bolsa, títulos públicos federais, FIP e FIA.\n· <strong>Preços de transferência</strong> (Lei 14.596/2023, vigente desde 1/jan/2024) — operações com residente em JTF, <strong>ainda que não vinculado</strong>, sujeitam-se obrigatoriamente às regras de <em>arm's length</em>.\n· <strong>Subcapitalização</strong> (Lei 12.249/2010, arts. 24 a 26) — juros pagos a residente em JTF: dedutibilidade limitada a <strong>30% do patrimônio líquido</strong> da devedora brasileira, regra mais restritiva que a de 2:1 aplicável a vinculadas comuns.\n· <strong>Dedutibilidade de despesas</strong> (Lei 9.430/1996, art. 26, com a redação da Lei 12.249/2010) — pagamentos a residente em JTF só são dedutíveis se houver identificação do <strong>beneficiário efetivo</strong>, comprovação de <strong>capacidade operacional</strong> e prova documental do efetivo pagamento e do recebimento dos bens ou serviços.\n· <strong>Tributação automática de controladas no exterior</strong> (<strong>Lei 14.754/2023, art. 5.º, §1.º, I</strong>) — <strong>o ponto crítico:</strong> entidades controladas por pessoa física residente no Brasil que estejam <strong>localizadas em JTF</strong> têm seus lucros <strong>tributados anualmente a 15%, em 31 de dezembro de cada ano, INDEPENDENTEMENTE da composição de sua renda</strong> — isto é, <strong>sem</strong> o filtro de «renda passiva superior a 40%». <strong>Uma holding em Hong Kong controlada por brasileiro cai automaticamente nesta hipótese.</strong>\n\n<strong>Síntese para o consultor:</strong> a residência fiscal do indivíduo em Hong Kong e a tributação em Hong Kong são uma coisa; a <strong>classificação de Hong Kong como JTF pelo Brasil</strong> é outra, e produz efeitos (a) enquanto o cliente ainda for residente fiscal brasileiro e (b) sobre quaisquer ativos que permaneçam no Brasil após a saída. <strong>A estrutura FIHV ou UFR de Hong Kong, do ponto de vista brasileiro e enquanto o titular for residente no Brasil, é uma entidade controlada em JTF sujeita a tributação anual automática de 15% pela Lei 14.754/2023 — a alíquota de 0% de Profits Tax local não produz diferimento algum.</strong> A eficiência dessas estruturas só se materializa <strong>após</strong> a efetiva saída fiscal do Brasil.\n\n<strong>Saída fiscal do Brasil</strong> (IN SRF n.º 208/2002; Lei n.º 3.470/1958, art. 17; RIR/2018): <strong>CSDP</strong> da data da saída até o último dia de fevereiro do ano-calendário subsequente, e <strong>DSDP</strong> no prazo da DIRPF do ano seguinte.\n· <strong>Saída em caráter permanente:</strong> não residente <strong>a partir da data da saída</strong>, desde que apresentada a CSDP.\n· <strong>Saída em caráter temporário:</strong> não residente a partir do <strong>dia seguinte ao 12.º mês</strong> consecutivo de ausência.\n· <strong>Sem CSDP:</strong> residente nos primeiros 12 meses; não residente a partir do 13.º.\n· Após a saída, rendimentos de fonte brasileira passam a sofrer tributação exclusiva na fonte — <strong>e, por Hong Kong ser JTF, à alíquota de 25% em vez de 15%</strong>. É necessário nomear procurador no Brasil, comunicar fontes pagadoras, bancos e CVM/B3, e migrar investimentos para o regime da Resolução CMN n.º 4.373/2014 — <strong>sem</strong> acesso às alíquotas favorecidas, por conta da classificação JTF.\n\n<strong>CRS.</strong> Hong Kong é participante do CRS, com regime AEOI implementado na IRO. Em abril de 2026, tinha relações de troca ativadas com <strong>mais de 80 jurisdições</strong>, com base em acordo bilateral ou no MCAA. Hong Kong só realiza AEOI com uma jurisdição reportável quando há arranjo em vigor com ela. Instituições financeiras de Hong Kong devem identificar contas de residentes fiscais de jurisdições reportáveis <strong>e de NFEs passivas cujas <em>controlling persons</em> sejam residentes fiscais de jurisdições reportáveis</strong>, reportando ao IRD.\n<em>Item de verificação crítica: a inclusão específica do BRASIL na lista de «Reportable Jurisdictions» de Hong Kong não pôde ser confirmada nesta pesquisa. Verificar em ird.gov.hk/eng/tax/aeoi/rpt_jur.htm.</em> Indicação de conhecimento prévio sugere que o Brasil consta desde a expansão de 2020, quando a lista passou de cerca de 75 para mais de 126 jurisdições — tratar como <strong>provável, mas não verificado</strong>.\nEm <strong>dezembro de 2025</strong>, Hong Kong abriu <strong>consulta pública sobre a implementação do Cryptoasset Reporting Framework (CARF) e do CRS 2.0</strong> — a acompanhar, pois ampliará o reporte a criptoativos.\n\n<strong>Obrigações brasileiras independem da troca de informações:</strong> declarar bens no exterior na <strong>DIRPF</strong>; apresentar a <strong>Declaração de Capitais Brasileiros no Exterior (CBE)</strong> ao Banco Central — anual se os ativos no exterior somarem <strong>USD 1.000.000 ou mais</strong> em 31/12, e trimestral se <strong>USD 100.000.000 ou mais</strong> <em>(limiares revisados pela Resolução BCB n.º 281/2022 e sucessoras — confirmar)</em>; e tributar os rendimentos sob a Lei 14.754/2023.\n<strong>Penalidades por omissão:</strong> multa da CBE de até R$ 250.000, com agravantes; multa de ofício de 75% a 150% sobre imposto não pago; e, conforme o caso, tipificação penal (Lei 8.137/1990 e Lei 9.613/1998).","warning":"<strong>Hong Kong é jurisdição de tributação favorecida para o Brasil.</strong> A consequência mais severa é o art. 5.º, §1.º, I da Lei 14.754/2023: uma entidade controlada em Hong Kong por pessoa física residente no Brasil tem os lucros <strong>tributados anualmente a 15%, em 31 de dezembro, independentemente de distribuição e independentemente da composição da renda</strong> — sem o filtro de renda passiva que se aplica a outras jurisdições.\n\nIsso significa que a alíquota de <strong>0% de Profits Tax</strong> do regime FIHV, e a alíquota de 8,25%/16,5% do Profits Tax ordinário, <strong>não produzem diferimento algum</strong> para o titular ainda residente no Brasil. A eficiência só existe <strong>depois</strong> da saída fiscal formalizada.\n\nAcresce que remessas do Brasil para Hong Kong sofrem <strong>IRRF de 25%</strong>, e o ganho de capital de não residente sobre bem no Brasil é tributado a <strong>25%</strong> — em vez das alíquotas ordinárias.","sources":[{"t":"IRD · A Simple Guide on The Territorial Source Principle of Taxation","u":"https://www.ird.gov.hk/eng/paf/bus_pft_tsp.htm"},{"t":"elegislation.gov.hk · Inland Revenue Ordinance (Cap. 112) e demais Ordinances","u":"https://www.elegislation.gov.hk"},{"t":"IRD · FAQ","u":"https://www.ird.gov.hk/eng/faq/index.htm"},{"t":"IRD · Reportable Jurisdictions (AEOI/CRS)","u":"https://www.ird.gov.hk/eng/tax/aeoi/rpt_jur.htm"},{"t":"Receita Federal · IN RFB n.º 1.037/2010 (texto compilado)","u":"http://normas.receita.fazenda.gov.br/sijut2consulta/link.action?idAto=16002&visao=compilado"},{"t":"Receita Federal · Listas de jurisdições com tributação favorecida atualizadas (IN 2.265/2025)","u":"https://www.gov.br/receitafederal/pt-br/assuntos/noticias/2025/maio/listas-de-jurisdicoes-com-tributacao-favorecida-e-de-regimes-fiscais-privilegiados-e-atualizada"},{"t":"DLA Piper · Medidas fiscais do Budget 2026-2027 de Hong Kong","u":"https://www.dlapiper.com/en/insights/publications/2026/03/key-tax-measures-proposed-under-the-2026-2027-hong-kong-budget"},{"t":"Budget 2026-27 · Public Finance","u":"https://www.budget.gov.hk/2026/eng/pf.html"}]},{"name":"FSIE — Foreign-sourced Income Exemption (aplicável apenas a grupos multinacionais)","status":"changed","legalBasis":"<strong>FSIE 1.0</strong> — Inland Revenue (Amendment) (Taxation on Specified Foreign-sourced Income) Ordinance 2022, em vigor para rendimento auferido e recebido em Hong Kong a partir de <strong>1/jan/2023</strong>. <strong>FSIE 2.0</strong> — lei promulgada em <strong>8 de dezembro de 2023</strong>, aplicável a rendimento no escopo auferido e recebido a partir de <strong>1/jan/2024</strong>. Localização na IRO: <strong>Part 4AA, ss. 15H a 15V</strong> <em>(numeração a confirmar)</em>. Origem: compromisso com o Código de Conduta da UE, após a inclusão de Hong Kong na lista cinzenta (Annex II) em outubro de 2021.","desc":"<strong>Escopo subjetivo — o ponto que decide tudo:</strong>\n\n<strong>O regime FSIE aplica-se EXCLUSIVAMENTE a «MNE entities»</strong> — entidades que integram um grupo multinacional, isto é, grupo com pelo menos uma entidade ou estabelecimento permanente em jurisdição diferente da da entidade-mãe.\n\n<strong>O FSIE NÃO se aplica a pessoas físicas.</strong> Também <strong>não se aplica a entidades puramente domésticas</strong> de Hong Kong (<em>standalone</em> ou grupos locais).\n\n<strong>Consequência prática:</strong>\n· um <strong>indivíduo brasileiro residente fiscal em Hong Kong</strong> que aufere dividendos, juros, royalties ou ganhos de capital de fonte estrangeira <strong>não é alcançado pelo FSIE</strong>. Seu rendimento estrangeiro permanece fora da base de Salaries Tax por força do princípio da territorialidade;\n· uma <strong>holding familiar de Hong Kong que integre um grupo multinacional</strong> — por exemplo, com subsidiária no Brasil ou nas BVI — <strong>está no escopo</strong> e precisa satisfazer os testes abaixo para não ser tributada a 16,5% sobre rendimento estrangeiro recebido em Hong Kong.","kv":[{"l":"Escopo subjetivo","v":"Só entidades de grupos multinacionais"},{"l":"Pessoas físicas","v":"Fora do escopo"},{"l":"Entidades puramente domésticas","v":"Fora do escopo"},{"l":"Juros, dividendos, ganhos em equity","v":"No escopo desde 1/jan/2023"},{"l":"Rendimentos de IP","v":"No escopo desde 1/jan/2023"},{"l":"Ganhos em todos os demais ativos","v":"No escopo desde 1/jan/2024"},{"l":"Alíquota se não excluído","v":"16,5%"},{"l":"Participation exemption — participação","v":"≥ 5%"},{"l":"Participation exemption — detenção","v":"≥ 12 meses"},{"l":"Subject to tax condition","v":"≥ 15% no exterior"}],"requirements":["<strong>Rendimento no escopo</strong> (<em>specified foreign-sourced income</em>): juros; dividendos; ganhos na alienação de <strong>participações societárias</strong>; e rendimentos de <strong>propriedade intelectual</strong> — todos desde <strong>1/jan/2023</strong>. Desde <strong>1/jan/2024</strong> (FSIE 2.0), acrescem os <strong>ganhos na alienação de todos os demais tipos de ativos</strong> — móveis e imóveis, financeiros e não financeiros, de capital ou de renda.","<strong>Teste de «recebimento em Hong Kong»:</strong> considera-se recebido quando (i) remetido a, transmitido para ou trazido para Hong Kong; (ii) usado para satisfazer dívida contraída em relação a negócio exercido em Hong Kong; ou (iii) usado para adquirir bem móvel trazido para Hong Kong. <em>A confirmar no guidance do IRD.</em>","<strong>Via de exclusão A — teste de substância económica</strong> (para juros, dividendos e ganhos não-IP): empregar número <strong>adequado</strong> de funcionários qualificados em Hong Kong; incorrer em montante <strong>adequado</strong> de despesas operacionais em Hong Kong; e exercer em Hong Kong as <strong>atividades essenciais geradoras de renda (CIGA)</strong>. Para <strong>entidades puramente de holding</strong> (<em>pure equity holding entities</em>), o teste é <strong>reduzido</strong>: basta cumprir as obrigações de registo societário e ter recursos humanos e locais adequados em Hong Kong. É admitido <strong>outsourcing</strong> das CIGA para prestador em Hong Kong, desde que a entidade exerça monitoramento e controlo adequados.","<strong>Via de exclusão B — teste de nexo</strong> (exclusivo para rendimento de IP): aplicável apenas a <strong>patentes e ativos assimilados</strong> (software protegido por copyright); <strong>marcas e direitos autorais de marketing NÃO qualificam</strong>. Fração do nexo = despesas de P&amp;D qualificadas × 1,3, limitado ao total, dividido pelas despesas totais. <strong>Apenas a porção correspondente à fração é excluída</strong> da tributação.","<strong>Via de exclusão C — participation exemption</strong> (para dividendos e ganhos em alienação de participações): ser <strong>residente de Hong Kong</strong> ou ter EP em Hong Kong; deter <strong>5% ou mais</strong> das participações na entidade investida; detenção mantida por <strong>12 meses ou mais</strong> ininterruptos imediatamente antes do fato gerador; e observar as regras anti-abuso.","<strong>Regras anti-abuso da participation exemption:</strong> <em>subject to tax condition</em> — o rendimento (ou o lucro subjacente) foi sujeito a imposto em jurisdição estrangeira a alíquota de <strong>15% ou mais</strong>; <em>switch-over rule</em> — se a alíquota estrangeira for inferior a 15%, aplica-se crédito em vez de isenção; <em>main purpose rule</em> — o arranjo não pode ter como um de seus propósitos principais a obtenção da vantagem fiscal; e regra <strong>anti-hibridismo</strong> — o pagamento não pode ser dedutível na jurisdição do pagador."],"sections":[{"title":"Intra-group transfer relief e advance rulings","body":"<strong>Intra-group transfer relief.</strong> O FSIE 2.0 introduziu <strong>diferimento</strong> da tributação quando o ativo é transferido entre <strong>entidades associadas</strong>, sujeito a regras anti-abuso específicas.\n\n<strong>Advance rulings.</strong> A entidade de grupo multinacional pode requerer <em>advance ruling</em> ao Commissioner of Inland Revenue sobre o cumprimento do teste de substância económica — para juros, dividendos e ganhos não-IP —, se exercer <em>trade or business</em> em Hong Kong. Os prazos de referência de acúmulo são <strong>1/jan/2023</strong> (juros, dividendos e alienação de <em>equity</em>) e <strong>1/jan/2024</strong> (alienação de ativos não-IP).\n\n<em>O ruling é usualmente concedido por até 5 anos de avaliação, sem taxa nos primeiros anos do regime — a confirmar em ird.gov.hk.</em>\n\n<strong>Situação na lista da UE:</strong> Hong Kong foi <strong>removida da lista cinzenta</strong> da União Europeia após a implementação do FSIE 2.0 (decisão de fevereiro de 2024). <em>Confirmar o status atual na lista Annex II do Conselho da UE.</em>"}],"brazilNote":"<strong>O FSIE não altera a posição brasileira.</strong> Ainda que uma entidade de Hong Kong satisfaça o teste de substância económica e obtenha exclusão do FSIE — pagando, portanto, <strong>0% em Hong Kong</strong> sobre o rendimento estrangeiro —, essa mesma entidade continua sendo, para o Brasil, uma <strong>entidade controlada em jurisdição de tributação favorecida</strong>.\n\n<strong>Resultado:</strong> lucros tributados a <strong>15% anualmente, em 31 de dezembro, independentemente de distribuição</strong> (Lei 14.754/2023, art. 5.º, §1.º, I), enquanto o controlador for pessoa física residente no Brasil.\n\n<strong>Ponto de atenção para o indivíduo:</strong> se o brasileiro <strong>já é residente fiscal em Hong Kong</strong> e detém os ativos <strong>pessoalmente</strong> (não por meio de entidade), o FSIE <strong>não se aplica</strong> — e o rendimento de fonte estrangeira fica fora da base de Hong Kong pela territorialidade. A introdução de uma holding de Hong Kong entre a pessoa e os ativos é justamente o que traz o FSIE para dentro do quadro, com os testes de substância que ele exige.\n\nA decisão de estruturar por meio de entidade em Hong Kong deve, portanto, ponderar simultaneamente (i) os testes de substância do FSIE, (ii) o custo de manter substância real em Hong Kong, e (iii) a tributação brasileira automática de 15% enquanto o controlador for residente no Brasil.","sources":[{"t":"IRD · Foreign-sourced Income Exemption","u":"https://www.ird.gov.hk/eng/tax/bus_fsie.htm"},{"t":"IRD · Press release sobre o FSIE (29/nov/2023)","u":"https://www.ird.gov.hk/eng/ppr/archives/23112905.htm"},{"t":"EY · Hong Kong revê o seu regime FSIE","u":"https://www.ey.com/en_gl/technical/tax-alerts/hong-kong-to-further-revise-its-foreign-source-income-exemption-"},{"t":"PwC China · Regime FSIE de Hong Kong","u":"https://www.pwccn.com/en/services/tax/fsie.html"},{"t":"International Tax Review · O regime FSIE expandido de Hong Kong","u":"https://www.internationaltaxreview.com/article/2cr3bcal3erhsfmwcdszk/sponsored/hong-kongs-expanded-foreign-sourced-income-exemption-regime-key-considerations"}]},{"name":"Regimes de family office — FIHV e Unified Fund Exemption","status":"changed","legalBasis":"<strong>Inland Revenue (Amendment) (Tax Concessions for Family-owned Investment Holding Vehicles) Ordinance 2023</strong>, publicada no Diário Oficial em <strong>19 de maio de 2023</strong>, com <strong>efeito retroativo a 1 de abril de 2022</strong> (ano de avaliação 2022/23). Introduziu na IRO a Schedule 16E e as seções operativas ss. 19E a 19M <em>(numeração a confirmar)</em>. <strong>UFR:</strong> IRO, ss. 20AM a 20AY, introduzidas pela Inland Revenue (Profits Tax Exemption for Funds) (Amendment) Ordinance 2019, com efeito desde 1/abr/2019.","desc":"Hong Kong estruturou uma política dedicada a family offices, com unidade própria dentro do <strong>InvestHK</strong> (<em>FamilyOfficeHK</em>), o <em>Policy Statement on Developing Family Office Businesses in Hong Kong</em> (março de 2023), a <em>Network of Family Office Service Providers</em> e a <em>Hong Kong Academy for Wealth Legacy</em>.\n\n<strong>FIHV — Family-owned Investment Holding Vehicle.</strong> Alíquota de <strong>Profits Tax de 0%</strong> sobre lucros do FIHV — e de FSPEs (<em>Family-owned Special Purpose Entities</em>) — decorrentes de <strong>transações qualificadas</strong> em ativos da Schedule 16C da IRO.\n\n<strong>Unified Fund Exemption (UFR).</strong> Isenção de Profits Tax para «funds» conforme definidos na s. 20AM, <strong>independentemente de estrutura</strong> (sociedade, <em>partnership</em>, trust), <strong>de domicílio</strong> (<em>onshore</em> ou <em>offshore</em> — o regime unificou os antigos regimes de <em>offshore fund</em> e <em>offshore private equity fund</em>), <strong>de tamanho ou de finalidade</strong>.\n\n<strong>FIHV × UFR:</strong> o FIHV foi criado justamente porque o UFR exige <strong>múltiplos investidores</strong> — a definição de «fund» é importada da Securities and Futures Ordinance (Cap. 571) e pressupõe arranjo de investimento coletivo com múltiplos investidores que não têm controlo diário sobre a gestão. <strong>Uma família única não satisfaz essa definição.</strong>","kv":[{"l":"FIHV — Profits Tax","v":"0%"},{"l":"FIHV — AUM mínimo","v":"HKD 240.000.000"},{"l":"FIHV — empregados em HK","v":"Mínimo 2, em tempo integral"},{"l":"FIHV — despesa operacional anual","v":"Mínimo HKD 2.000.000"},{"l":"FIHV — participação familiar","v":"≥ 95% dos interesses económicos"},{"l":"FIHV — máximo por família","v":"50 veículos (a confirmar)"},{"l":"ESFO — receita de serviços à família","v":"≥ 75% (safe harbour)"},{"l":"Eleição pelo regime","v":"Irrevogável"},{"l":"Efeito retroativo","v":"1 de abril de 2022"},{"l":"Bill 2026","v":"Em escrutínio no LegCo"}],"requirements":["<strong>FIHV:</strong> ser uma <strong>entidade</strong> (sociedade, <em>partnership</em> ou trust), constituída em ou fora de Hong Kong.","<strong>FIHV:</strong> <strong>não</strong> ser um empreendimento com finalidade comercial ou industrial geral.","<strong>FIHV:</strong> ser <strong>normalmente gerido ou controlado em Hong Kong</strong> durante o período-base.","<strong>FIHV:</strong> ser <strong>gerido por um Eligible Single Family Office (ESFO)</strong> em Hong Kong.","<strong>FIHV:</strong> <strong>95% ou mais dos interesses económicos</strong> detidos, direta ou indiretamente, por membros de <strong>uma única família</strong>. <em>Percentual e definição de «família» a confirmar na Schedule 16E.</em>","<strong>FIHV:</strong> máximo de <strong>50 FIHVs por família</strong> podem gozar da concessão em cada ano. <em>A confirmar em ird.gov.hk.</em>","<strong>Limiar de ativos:</strong> o agregado dos ativos da <strong>Schedule 16C</strong> geridos pelo ESFO para a família deve ser de <strong>no mínimo HKD 240.000.000</strong>. Ativos da Schedule 16C incluem valores mobiliários, ações, debêntures, <em>bonds</em> e <em>notes</em> de sociedades privadas, entre outros.","<strong>Requisito de atividade substancial:</strong> no mínimo <strong>2 empregados em tempo integral</strong> em Hong Kong que executem as atividades de investimento e possuam as qualificações necessárias.","<strong>Requisito de atividade substancial:</strong> no mínimo <strong>HKD 2.000.000 de despesa operacional anual</strong> incorrida em Hong Kong para a execução dessas atividades.","<strong>ESFO:</strong> ser <em>private company</em> constituída em ou fora de Hong Kong; ser normalmente gerida ou controlada em Hong Kong; ter <strong>95% ou mais</strong> dos interesses económicos detidos por membros da família; prestar serviços a membros da família e/ou aos FIHVs, com <strong>75% ou mais da receita</strong> proveniente desses serviços (<em>safe harbour rule</em>); e <strong>não prestar serviços a terceiros</strong> fora da família.","<strong>Eleição:</strong> a opção pelo regime é <strong>irrevogável</strong> e feita por escrito ao Commissioner, aplicando-se ao ano eleito e a todos os subsequentes."],"sections":[{"title":"Reforma em curso — o Bill 2026","body":"Em <strong>12 de junho de 2026</strong>, o Governo publicou no Diário Oficial o <strong>Inland Revenue (Amendment) (Preferential Tax Regimes for Funds, Family-owned Investment Holding Vehicles and Carried Interest) Bill 2026</strong>.\n\n<strong>Escopo:</strong> reforma simultânea de <strong>três regimes</strong> — Unified Fund Exemption (UFR), FIHV, e a concessão sobre <em>carried interest</em>.\n\n<strong>Tramitação:</strong> precedido de consulta pública com <em>stakeholders</em> em 2024 e sessões de engajamento em 2025; <strong>primeira leitura no Legislative Council em 24 de junho de 2026</strong>; <strong>em agosto de 2026, ainda em escrutínio de comissão — NÃO PROMULGADO</strong>. Se aprovado, com <strong>efeito retroativo ao ano de avaliação 2025/26</strong>.\n\n<strong>Principais alterações propostas ao FIHV:</strong>\n1. <strong>Mudança do cálculo do limiar mínimo de ativos</strong> — substituição da regra de <em>Net Asset Value</em> por um requisito de <em>asset value</em>, de modo que <strong>empréstimos de sócios (<em>shareholders' loans</em>) ao FIHV deixem de ser deduzidos</strong> no cômputo do valor;\n2. <strong>expansão da Schedule 16C</strong> para refletir estratégias de investimento contemporâneas;\n3. <strong>eliminação das referências a «qualifying transactions» e «incidental transactions»</strong> e do limiar de transações incidentais (atualmente 5%), simplificando a qualificação;\n4. <strong>inclusão de classes de ativos alternativos</strong> no perímetro da concessão: <strong>crédito privado (<em>private credit</em>), ativos digitais, imóveis no exterior, metais preciosos e instrumentos ligados a carbono</strong>.\n\n<strong>Nota de planejamento:</strong> para famílias brasileiras avaliando a estruturação de um FIHV em 2026, a existência do Bill 2026 significa que <strong>o desenho definitivo do regime ainda não está estabilizado</strong>. Recomenda-se acompanhar a tramitação no LegCo antes de comprometer estrutura."},{"title":"Unified Fund Exemption — mecânica","body":"<strong>Efeito:</strong> isenção de Profits Tax para «funds» definidos na IRO, s. 20AM, independentemente de estrutura, domicílio, tamanho ou finalidade.\n\n<strong>Definição de «fund»</strong> importada da Securities and Futures Ordinance (Cap. 571) — arranjo de investimento coletivo com <strong>múltiplos investidores</strong> que não têm controlo diário sobre a gestão.\n\n<strong>Transações qualificadas:</strong> ativos da Schedule 16C da IRO.\n<strong>Transações incidentais:</strong> isentas se representarem <strong>5% ou menos</strong> do valor total das receitas <em>— percentual a confirmar</em>.\n\n<strong>Regras anti-abuso:</strong> <em>anti-round-tripping</em> — investidores residentes em Hong Kong com 30% ou mais de participação, ou qualquer participação se o fundo for entidade associada, podem ser tributados por <em>deeming</em>.\n\n<strong>SPEs (Special Purpose Entities):</strong> isentas na proporção da participação do fundo.\n\n<strong>Investimento em empresas privadas:</strong> sujeito a testes adicionais — teste de imóveis, teste de detenção de 2 anos, teste de controlo de curto prazo.\n\n<strong>Veículos domésticos comumente utilizados:</strong> <strong>OFC</strong> (Open-ended Fund Company) e <strong>LPF</strong> (Limited Partnership Fund, Cap. 637, desde 31/ago/2020).\n\n<em>Toda esta seção deve ser confirmada em ird.gov.hk/eng/tax/bus_ufe.htm.</em>"},{"title":"Carried interest","body":"<strong>Inland Revenue (Amendment) (Tax Concessions for Carried Interest) Ordinance 2021:</strong> <strong>0% de Profits Tax e 0% de Salaries Tax</strong> sobre <em>eligible carried interest</em> distribuído por fundos de <em>private equity</em> qualificados, com efeito retroativo a 1 de abril de 2020, mediante <strong>certificação pela Hong Kong Monetary Authority (HKMA)</strong>.\n\n<strong>Também objeto de reforma pelo Bill 2026</strong> — confirmado que o projeto abrange o regime de <em>carried interest</em>.\n\n<em>Detalhes a confirmar em ird.gov.hk e junto à HKMA.</em>"}],"brazilNote":"<strong>Para o titular ainda residente fiscal no Brasil, a alíquota de 0% do FIHV não produz efeito algum.</strong>\n\nHong Kong é <strong>jurisdição de tributação favorecida</strong> na IN RFB 1.037/2010. Por força do <strong>art. 5.º, §1.º, I da Lei 14.754/2023</strong>, uma entidade controlada por pessoa física residente no Brasil localizada em JTF tem os lucros <strong>tributados a 15% anualmente, em 31 de dezembro, independentemente de distribuição e independentemente da composição da renda</strong>.\n\n<strong>Ou seja:</strong> o FIHV paga 0% em Hong Kong e 15% no Brasil, todos os anos, sobre o lucro apurado — sem diferimento. <strong>A eficiência do FIHV só se materializa após a efetiva saída fiscal do Brasil</strong> (CSDP e DSDP formalizadas, com a caracterização da não residência).\n\n<strong>Custo de substância.</strong> O FIHV exige, em Hong Kong: <strong>2 empregados qualificados em tempo integral</strong>, <strong>HKD 2.000.000 de despesa operacional anual</strong>, e <strong>HKD 240.000.000 de ativos sob gestão</strong>. Esse é o piso de entrada — e é um piso real, não formal.\n\n<strong>Selo sobre transferência de ações</strong> de sociedade de Hong Kong: 0,1% por parte, total de 0,2%, reduzido de 0,26% em 17/nov/2023 — relevante para as reorganizações societárias envolvidas na montagem da estrutura.\n\n<strong>Recomendação de sequência:</strong> a estruturação de um family office em Hong Kong por família brasileira deve vir <strong>depois</strong> da saída fiscal, não antes — e deve aguardar a estabilização do Bill 2026, cuja tramitação ainda estava em escrutínio de comissão em agosto de 2026.","sources":[{"t":"IRD · Tax Concessions for Family-owned Investment Holding Vehicles","u":"https://www.ird.gov.hk/eng/tax/bus_fihv.htm"},{"t":"InvestHK / FamilyOfficeHK · Novas concessões fiscais para family offices","u":"https://www.familyofficehk.gov.hk/en/new-tax-concessions-family-offices/index.html"},{"t":"KPMG China · Hong Kong apresenta projeto de lei para tornar o regime de family office mais atrativo","u":"https://kpmg.com/cn/en/insights/2026/06/tax-alert-11-hk-hong-kong-sar-unveils-draft-law-to-make-its-family-office-tax-regime-more-attractive.html"},{"t":"Baker McKenzie · Regimes de concessão fiscal para fundos, family offices e carried interest (jul/2026)","u":"https://www.bakermckenzie.com/en/insight/publications/2026/07/hk-enhanced-tax-concession-regimes-funds-family-offices-carried-interest"},{"t":"Withers · A nova lei de concessão fiscal para veículos de investimento familiar","u":"https://www.withersworldwide.com/en-gb/insight/read/hong-kong-s-new-law-providing-a-tax-concession-for-family-investment-vehicles-has-finally-passed"},{"t":"Charltons · Novos regimes fiscais para fundos, family offices e carried interest","u":"https://www.charltonslaw.com/new-tax-regimes-for-hong-kong-funds-family-offices-and-carried-interest/"}]},{"name":"Rede de CDTs e a inexistência de acordo com o Brasil","status":"risk","legalBasis":"Hong Kong é <strong>Região Administrativa Especial com sistema tributário autónomo</strong> (art. 108 da Basic Law) e <strong>negocia os seus próprios CDTAs</strong>. Não é coberta pelos tratados tributários da República Popular da China continental — o CDTA Hong Kong–Mainland China é acordo <strong>separado</strong>, o que confirma a autonomia.","desc":"<strong>Rede de Hong Kong:</strong> <strong>59 CDTAs assinados</strong> e negociações iniciadas ou agendadas com <strong>16 jurisdições</strong>, segundo dado apurado em julho de 2026. <em>Conferir o número exato em ird.gov.hk.</em> Hong Kong é parte da Convenção Multilateral (MLI) e mantém ainda <strong>TIEAs</strong> (acordos de troca de informações) e a rede <strong>AEOI/CRS</strong>.\n\nCDTAs recentes: <strong>Bangladesh e Croácia</strong> entraram em vigor em dezembro de 2024; <strong>CDTA Hong Kong–Noruega</strong> assinado em dezembro de 2025.\n\n<strong>NÃO EXISTE acordo de dupla tributação entre Brasil e Hong Kong.</strong>","kv":[{"l":"CDTAs de Hong Kong","v":"59 assinados"},{"l":"Em negociação","v":"16 jurisdições"},{"l":"CDT Brasil–Hong Kong","v":"Não existe"},{"l":"CDT Brasil–China","v":"Não se estende a Hong Kong"},{"l":"Brasil na lista de prioridades","v":"Sim — como parceiro proposto"},{"l":"Retenção reduzida","v":"Indisponível"},{"l":"Procedimento amigável (MAP)","v":"Indisponível"},{"l":"Troca de informações","v":"Via CRS/MCAA"}],"sections":[{"title":"A verificação: o que a pesquisa encontrou","body":"<strong>Não foi encontrada qualquer evidência da existência de um Acordo para Evitar a Dupla Tributação entre o Brasil e Hong Kong</strong> — assinado em 24 de novembro de 2022 ou em qualquer outra data.\n\n<strong>Evidências apuradas:</strong>\n1. Documento da <strong>ASIFMA</strong>, «Annex B — Proposed CDTA partners to be accorded with priority» (março de 2024), lista o <strong>Brasil como jurisdição PROPOSTA</strong> como parceiro prioritário para negociação de um CDTA com Hong Kong, com a justificativa de que «um CDTA apoiaria a competitividade dos bancos de Hong Kong que prestam serviços financeiros a clientes sediados no Brasil». Isso demonstra que, <strong>em março de 2024, não havia acordo</strong> — o Brasil era apenas alvo de negociação futura.\n2. As buscas em fontes brasileiras — Receita Federal, Câmara dos Deputados, Senado, Itamaraty/Concórdia — <strong>não retornaram nenhum decreto legislativo, mensagem presidencial ou decreto de promulgação</strong> relativo a acordo com Hong Kong.\n3. As buscas na base de CDTAs de Hong Kong (FSTB, IRD) <strong>não listam o Brasil</strong> entre os signatários.\n\n<strong>Hipótese sobre a origem da confusão</strong> (não confirmada): em torno da data indicada, o Brasil assinou o <strong>Acordo de Dupla Tributação Brasil–Reino Unido, em 29 de novembro de 2022, em Brasília</strong> — data muito próxima. Outra possibilidade é confusão com o <strong>Protocolo Alterando o Acordo Brasil–China</strong>, assinado em 23 de maio de 2022 e promulgado pelo <strong>Decreto n.º 12.620, de 12 de setembro de 2025</strong>.\n\n<strong>ATENÇÃO — erro frequente em planejamentos mal elaborados:</strong> <strong>nem o acordo Brasil–China, nem qualquer acordo brasileiro com a República Popular da China, se estende a Hong Kong.</strong> Como Região Administrativa Especial com sistema tributário autónomo (art. 108 da Basic Law), Hong Kong negocia os próprios CDTAs."},{"title":"Consequências práticas da ausência de acordo","body":"· <strong>Nenhuma redução de alíquotas de retenção na fonte</strong> entre Brasil e Hong Kong;\n· <strong>nenhum mecanismo de MAP</strong> (procedimento amigável) para resolver dupla tributação;\n· <strong>nenhum artigo de não-discriminação</strong>;\n· <strong>nenhuma troca de informações por via de tratado</strong> — a troca ocorre apenas via <strong>CRS/MCAA</strong> e, eventualmente, via <strong>Convenção Multilateral sobre Assistência Mútua Administrativa em Matéria Tributária</strong>. <em>Nota: a extensão da Convenção Multilateral a Hong Kong foi feita pela China por declaração territorial — verificar.</em>\n· A eliminação de dupla tributação depende <strong>exclusivamente da legislação interna</strong> de cada lado: no Brasil, o crédito de imposto pago no exterior sob a Lei 9.249/1995, art. 26, e a Lei 14.754/2023; em Hong Kong, a própria territorialidade torna a questão quase sempre irrelevante, já que rendimento estrangeiro não é tributado.\n\n<strong>Nota de contexto:</strong> a ausência de tratado, somada à classificação de Hong Kong como jurisdição de tributação favorecida pelo Brasil, produz o cenário mais desfavorável do ponto de vista de fluxo Brasil → Hong Kong: <strong>IRRF de 25%</strong> sobre remessas, sem redução convencional, e sem mecanismo de resolução de disputas."}],"brazilNote":"A combinação de <strong>ausência de CDT</strong> e <strong>classificação como jurisdição de tributação favorecida</strong> define o perfil de risco de Hong Kong para o brasileiro.\n\n<strong>Fluxo Brasil → Hong Kong:</strong> IRRF de <strong>25%</strong> sobre rendimentos, ganhos e proventos remetidos, sem redução convencional; ganho de capital de não residente sobre bem no Brasil a <strong>25%</strong>; perda dos benefícios da Resolução CMN 4.373; preços de transferência obrigatórios ainda que sem vinculação; subcapitalização limitada a 30% do PL; e dedutibilidade condicionada à identificação do beneficiário efetivo e à comprovação de capacidade operacional.\n\n<strong>Estruturas de Hong Kong detidas por residente fiscal brasileiro:</strong> tributação automática de <strong>15% ao ano</strong>, em 31 de dezembro, independentemente de distribuição e da composição da renda.\n\n<strong>Do lado de Hong Kong:</strong> a territorialidade significa que o rendimento de fonte brasileira auferido por residente de Hong Kong <strong>não é tributado em Hong Kong</strong> — logo, não há dupla tributação a resolver nesse sentido, e a ausência de tratado importa pouco. O problema está no sentido inverso, do Brasil para Hong Kong.\n\n<strong>Monitorar:</strong> o Brasil consta da lista de <strong>parceiros propostos</strong> para negociação de CDTA com Hong Kong (documento ASIFMA de março de 2024). Um eventual acordo alteraria materialmente o quadro — e poderia, inclusive, abrir caminho para a revisão da classificação de Hong Kong na IN RFB 1.037/2010.","sources":[{"t":"IRD · Comprehensive Double Taxation Agreements concluded","u":"https://www.ird.gov.hk/eng/tax/dta_inc.htm"},{"t":"FSTB · Comprehensive Avoidance of Double Taxation Agreement","u":"https://www.fstb.gov.hk/en/treasury/general/comprehensive-avoidance-of-double-taxation-agreement.htm"},{"t":"ASIFMA · Annex B — Proposed CDTA partners to be accorded with priority (PDF, mar/2024)","u":"https://www.asifma.org/wp-content/uploads/2024/04/240307-proposed-tax-treaty-partners-for-hk.pdf"},{"t":"Receita Federal · Acordos para evitar a dupla tributação","u":"https://www.gov.br/receitafederal/pt-br/acesso-a-informacao/legislacao/acordos-internacionais/acordos-para-evitar-a-dupla-tributacao/acordos-para-evitar-a-dupla-tributacao"},{"t":"Itamaraty · Sistema Concórdia (base de atos internacionais)","u":"https://concordia.itamaraty.gov.br"}]}],"visa":[{"name":"New Capital Investment Entrant Scheme (New CIES)","status":"changed","legalBasis":"Esquema administrativo com base na <strong>Immigration Ordinance, Cap. 115</strong>. CIES original: 2003, <strong>suspenso em 2015</strong>. <strong>Relançado em 1 de março de 2024</strong> como New CIES. Órgãos: <strong>New CIES Office</strong> (unidade do InvestHK), <strong>Immigration Department</strong> e <strong>Hong Kong Investment Corporation Limited (HKIC)</strong>. Portal oficial: newcies.gov.hk.","desc":"Programa de residência por investimento de <strong>HKD 30.000.000</strong>, estruturado em duas camadas:\n· <strong>HKD 27.000.000 ou mais</strong> em ativos permissíveis (financeiros e imobiliários);\n· <strong>HKD 3.000.000</strong> obrigatoriamente destinados ao <strong>CIES Investment Portfolio</strong>, gerido pela HKIC.\n\nAcresce o <strong>requisito patrimonial</strong>: o requerente deve demonstrar ser <strong>absolutamente titular beneficiário</strong> de ativos líquidos não inferiores a <strong>HKD 30.000.000</strong> — ou equivalente em outras moedas — durante <strong>todo o período de 6 meses imediatamente anteriores</strong> à data do pedido de <em>Net Asset Assessment</em>.\n\n<strong>Alteração vigente desde 1 de março de 2026:</strong> o New CIES atualizou as condições relativas a <strong>sociedades de participação privadas</strong>, permitindo que o requerente utilize uma <em>eligible private holding company</em> constituída há <strong>menos de seis meses</strong> para fins de avaliação do cumprimento dos requisitos de investimento, <strong>sem período mínimo de constituição</strong>. Efeito prático: o investimento pode ser feito por meio de veículo societário recém-constituído. <em>O requisito de titularidade integral do veículo não foi confirmado.</em>","kv":[{"l":"Investimento total","v":"HKD 30.000.000"},{"l":"Ativos permissíveis","v":"≥ HKD 27.000.000"},{"l":"CIES Investment Portfolio","v":"HKD 3.000.000 (obrigatório)"},{"l":"Patrimônio líquido exigido","v":"HKD 30.000.000 por 6 meses"},{"l":"Certificados de depósito","v":"Teto de HKD 3.000.000"},{"l":"Imóveis não residenciais","v":"Computáveis até HKD 10.000.000"},{"l":"Entry permit para investir","v":"Visitante, até 180 dias"},{"l":"Right of Abode","v":"Após 7 anos"},{"l":"Residentes do Continente","v":"Não elegíveis (sem PR estrangeira)"},{"l":"Taxa de aplicação","v":"HKD 600 por pessoa"},{"l":"Taxa de emissão (> 180 dias)","v":"HKD 1.300"}],"requirements":["<strong>Requisito patrimonial (Net Asset Requirement):</strong> demonstrar ser <strong>absolutamente titular beneficiário</strong> de ativos líquidos não inferiores a <strong>HKD 30.000.000</strong>, ou equivalente em outras moedas, durante <strong>todo o período de 6 meses imediatamente anteriores</strong> à data do pedido de avaliação. <em>A exigência formal de verificação por CPA de Hong Kong ou profissional aprovado deve ser confirmada.</em>","<strong>Requisito de investimento:</strong> <strong>HKD 27.000.000 ou mais</strong> em ativos permissíveis, mais <strong>HKD 3.000.000</strong> no CIES Investment Portfolio — total de <strong>HKD 30.000.000</strong>.","<strong>Ativos financeiros permissíveis:</strong> <strong>ações</strong> listadas na Bolsa de Hong Kong e negociadas em HKD ou RMB <em>(restrição de moeda a confirmar)</em>; <strong>títulos de dívida</strong>; <strong>certificados de depósito (CD)</strong> — sujeitos a <strong>teto de HKD 3.000.000</strong>; <strong>dívida subordinada</strong>; <strong>esquemas de investimento coletivo elegíveis</strong> — fundos autorizados pela SFC, OFCs, REITs; e <strong>limited partnership funds (LPFs)</strong> registados em Hong Kong.","<strong>Imóveis:</strong> imóveis <strong>não residenciais</strong> são computáveis até o <strong>teto de HKD 10.000.000</strong>. <em>Desde 16 de outubro de 2024 (medida de aprimoramento do Policy Address 2024), imóveis residenciais adquiridos por preço igual ou superior a HKD 50.000.000 também passaram a ser computáveis, até o mesmo teto de HKD 10.000.000 — ponto relevante para clientes brasileiros que deve ser verificado obrigatoriamente na página de Enhancement Measures do familyofficehk.gov.hk.</em>","<strong>Apólices de seguro elegíveis:</strong> mencionadas em material de mercado e comercializadas por AIA, Manulife e HSBC como produtos CIES, <strong>mas não localizadas explicitamente entre os ativos permissíveis</strong> nas fontes oficiais consultadas. <em>Verificar em newcies.gov.hk antes de estruturar.</em>","<strong>Idade:</strong> 18 anos ou mais.","<strong>Elegíveis:</strong> nacionais estrangeiros; residentes de Macau; residentes chineses de Taiwan; e nacionais chineses que tenham obtido residência permanente em país estrangeiro.","<strong>NÃO elegíveis:</strong> residentes do Continente (Mainland China) que não possuam residência permanente no exterior — <strong>diferença relevante em relação ao Top Talent Pass Scheme</strong>. Também não elegíveis: nacionais de Afeganistão, Cuba, Coreia do Norte, Laos, Nepal e Vietnã.","Sem antecedentes criminais nem registo adverso de imigração; capacidade de sustentar-se e aos dependentes."],"process":[{"step":"Pedido de Net Asset Assessment","detail":"Comprovação de <strong>HKD 30.000.000 de patrimônio líquido durante 6 meses</strong>, junto ao <strong>New CIES Office / InvestHK</strong>. Resulta na emissão do <strong>Certifying Proof for Net Asset Requirement</strong>; o Office notifica o Director of Immigration.","timing":"A confirmar"},{"step":"Entry Application ao Director of Immigration","detail":"Submissão do pedido de entrada ao <strong>Immigration Department</strong>, dentro do prazo de validade do certificado.","timing":"Dentro da validade do certificado"},{"step":"Approval-in-Principle (AIP)","detail":"Avaliação sob a perspectiva de imigração e concessão do <strong>Approval-in-Principle</strong>.","timing":"A confirmar"},{"step":"Entry permit como visitante","detail":"Emissão de visto ou <em>entry permit</em> para entrada como <strong>VISITANTE por até 180 dias</strong>, destinado a permitir a realização do investimento comprometido.","timing":"Até 180 dias"},{"step":"Realização do investimento","detail":"Investimento de <strong>HKD 30.000.000</strong> — HKD 27 milhões em ativos permissíveis e HKD 3 milhões no CIES Investment Portfolio. Prazo prático: dentro dos 180 dias do <em>entry permit</em>.","timing":"Dentro dos 180 dias"},{"step":"Verificação do Investment Requirement","detail":"Pedido de verificação junto ao <strong>InvestHK</strong>, resultando na emissão do <strong>Certifying Proof for Fulfillment of Investment Requirements</strong>.","timing":"A confirmar"},{"step":"Apresentação ao ImmD e Formal Approval","detail":"Apresentação do <em>Certifying Proof</em> ao Immigration Department, dentro do seu prazo de validade, seguida de avaliação final e <strong>Formal Approval</strong>, com concessão do visto de residência.","timing":"A confirmar"},{"step":"Registo do HKID","detail":"Registo do Hong Kong Identity Card junto ao Registration of Persons Office, dentro de <strong>30 dias</strong> da chegada. <em>Prazo a confirmar.</em>","timing":"30 dias"},{"step":"Extensões periódicas","detail":"Mediante comprovação de manutenção do investimento. <em>Padrão histórico de 2 + 3 + 3 anos, a confirmar.</em>","timing":"Periódicas"},{"step":"Right of Abode","detail":"Após <strong>7 anos</strong> de residência ordinária contínua, pedido de Right of Abode; alternativamente, <em>unconditional stay</em>.","timing":"7 anos"}],"costs":[{"item":"Investimento em ativos permissíveis","value":"≥ HKD 27.000.000"},{"item":"CIES Investment Portfolio (HKIC)","value":"HKD 3.000.000","note":"Obrigatório; não resgatável durante a permanência no esquema; retorno não garantido"},{"item":"TOTAL de investimento","value":"HKD 30.000.000"},{"item":"Taxa de aplicação de visto — requerente principal","value":"HKD 600","note":"Não reembolsável; nova estrutura em vigor desde 11h00 de 26/fev/2025"},{"item":"Taxa de aplicação — cada dependente","value":"HKD 600","note":"Não reembolsável"},{"item":"Taxa de emissão de visto — validade acima de 180 dias","value":"HKD 1.300","note":"A taxa anterior era fixa em HKD 230"},{"item":"Taxa de emissão — validade de até 180 dias","value":"HKD 600"},{"item":"Mudança de condições de estada ou extensão","value":"HKD 600 por pedido"},{"item":"Taxa do New CIES Office pela Net Asset Assessment","value":"Não identificada","note":"Nenhuma taxa localizada nas fontes; verificar"},{"item":"Honorários de CPA ou auditor para certificação patrimonial","value":"Custo de mercado"}],"sections":[{"title":"O CIES Investment Portfolio","body":"Constituído e gerido pela <strong>Hong Kong Investment Corporation Limited (HKIC)</strong>.\n\nInveste em <strong>empresas e projetos com nexo em Hong Kong</strong>, com vistas a apoiar o desenvolvimento das <strong>indústrias de inovação e tecnologia</strong> e de outras indústrias estratégicas.\n\n<strong>O aporte de HKD 3 milhões é não resgatável durante a permanência no esquema, e o retorno não é garantido.</strong> É a parcela do investimento com risco e liquidez menos favoráveis, e deve ser tratada, no modelo financeiro, como custo de entrada e não como investimento."},{"title":"Regras de manutenção e saída do regime","body":"<strong>Manutenção:</strong> o investimento deve ser mantido durante todo o período de estada sob o esquema.\n\n<strong>Realocação (<em>switching</em>):</strong> é permitido realocar entre ativos permissíveis, mas <strong>não é permitido retirar capital ou realizar lucros para fora do portfólio</strong> durante o período.\n\n<strong>Queda de valor:</strong> se o valor de mercado cair, <strong>não há obrigação de aporte adicional</strong> (<em>no top-up required</em>).\n\n<strong>Após obter o Right of Abode</strong> ou a <em>unconditional stay</em>, o investidor deixa de estar sujeito à manutenção do portfólio.\n\n<strong>Não há imposto de saída nem <em>clawback</em> fiscal</strong> em Hong Kong.\n\n<em>Itens a verificar nas «Rules on Portfolio Maintenance» em newcies.gov.hk: se dividendos, juros e cupões podem ser retirados livremente durante o período.</em>"},{"title":"Regras de família","body":"<strong>Cônjuge</strong> e <strong>filhos solteiros dependentes com menos de 18 anos</strong> podem ser incluídos como dependentes.\n\nCada dependente paga as próprias taxas de <strong>HKD 600</strong> de aplicação, mais a taxa de emissão.\n\n<strong>Não foi identificada</strong>, no New CIES, a exigência de aumento do valor de investimento por dependente que existia no CIES original. <em>A confirmar.</em>\n\n<strong>Dependentes computam o próprio período de 7 anos</strong> para o Right of Abode."}],"brazilNote":"Brasileiros são <strong>nacionais estrangeiros</strong> e, portanto, elegíveis ao New CIES.\n\n<strong>O ponto decisivo, contudo, não é a elegibilidade migratória — é a posição fiscal brasileira.</strong> Hong Kong é <strong>jurisdição de tributação favorecida</strong> na IN RFB 1.037/2010, e enquanto o investidor for residente fiscal no Brasil:\n· qualquer entidade de Hong Kong que ele controle tem lucros <strong>tributados a 15% ao ano no Brasil</strong>, independentemente de distribuição (Lei 14.754/2023, art. 5.º, §1.º, I);\n· os ativos financeiros mantidos em Hong Kong são <strong>reportáveis na DIRPF</strong> e, acima dos limiares, na <strong>CBE</strong> ao Banco Central;\n· rendimentos de aplicações financeiras no exterior são tributados a <strong>15%</strong> anualmente.\n\n<strong>O visto não encerra a residência fiscal brasileira.</strong> Sem <strong>CSDP</strong> (até o último dia de fevereiro do ano seguinte à saída) e <strong>DSDP</strong> (no prazo da DIRPF), o titular permanece residente fiscal brasileiro, tributado em bases universais — e, como não há CDT Brasil–Hong Kong, <strong>não existe tie-breaker convencional</strong> para resolver a dupla residência.\n\n<strong>Após a saída fiscal</strong>, os rendimentos de fonte brasileira passam a sofrer tributação exclusiva na fonte — e, por Hong Kong ser JTF, à alíquota de <strong>25%</strong> em vez de 15%, com perda dos benefícios da Resolução CMN 4.373.\n\n<strong>Sequência recomendada:</strong> a formalização da saída fiscal deve ser planejada em conjunto com o investimento, não depois dele.","sources":[{"t":"New CIES · Visão geral do processo","u":"https://www.newcies.gov.hk/en/application-procedures/overview/"},{"t":"New CIES · Critérios de elegibilidade","u":"https://www.newcies.gov.hk/en/eligibility-criteria/"},{"t":"New CIES · Investment Requirement","u":"https://www.newcies.gov.hk/en/application-procedures/application-to-investhk/investment-requirement/"},{"t":"New CIES · Nova medida em vigor desde 1 de março de 2026","u":"https://www.newcies.gov.hk/en/new-measures/"},{"t":"Immigration Department · New Capital Investment Entrant Scheme","u":"https://www.immd.gov.hk/eng/services/visas/newcies.html"},{"t":"InvestHK / FamilyOfficeHK · Enhancement Measures do New CIES","u":"https://www.familyofficehk.gov.hk/en/new-capital-investment-entrant-scheme/index.html"},{"t":"Gov.HK · Nova taxa de aplicação e de visto para esquemas de admissão (26/fev/2025)","u":"https://www.info.gov.hk/gia/general/202502/26/P2025022600221.htm"},{"t":"Morrison Foerster · O New CIES de Hong Kong","u":"https://www.mofo.com/resources/insights/240115-hong-kong-capital-investment-cies"}]},{"name":"Top Talent Pass Scheme (TTPS)","status":"changed","legalBasis":"Esquema administrativo do <strong>Immigration Department</strong>, sob a Immigration Ordinance, Cap. 115, e as Immigration Regulations, Cap. 115A. Lançado em <strong>28 de dezembro de 2022</strong>. Apoio institucional: <strong>Hong Kong Talent Engage (HKTE)</strong>.","desc":"Esquema de admissão de talentos que <strong>não exige oferta de emprego prévia</strong> em Hong Kong — característica que o distingue das demais rotas.\n\n<strong>Três categorias:</strong>\n· <strong>Categoria A</strong> — renda anual de <strong>HKD 2.500.000 ou mais</strong> (ou equivalente em moeda estrangeira) no ano imediatamente anterior ao pedido. <strong>Sem cota.</strong> Estada inicial de <strong>36 meses</strong>.\n· <strong>Categoria B</strong> — graduado (bacharelado em regime integral) de universidade elegível, <strong>com 3 anos ou mais de experiência profissional</strong> nos últimos 5 anos. <strong>Sem cota.</strong> Estada inicial de <strong>24 meses</strong>.\n· <strong>Categoria C</strong> — graduado de universidade elegível <strong>com menos de 3 anos de experiência</strong> nos últimos 5 anos (graduação nos últimos 5 anos). <strong>Cota anual de 10.000.</strong> Estada inicial de <strong>24 meses</strong>.\n\n<strong>Duas correções a materiais em circulação:</strong>\n1. a estada inicial da <strong>Categoria A foi elevada de 24 para 36 meses</strong>; as Categorias B e C permanecem em 24 meses — a afirmação genérica de que «o visto passou a 3 anos» vale <strong>apenas para a Categoria A</strong>;\n2. as Categorias B e C <strong>não estão mais limitadas às «top 100 universidades»</strong>: aplica-se a <strong>lista agregada de universidades elegíveis</strong>, atualizada anualmente.","kv":[{"l":"Categoria A — renda","v":"HKD 2.500.000/ano"},{"l":"Categoria A — estada inicial","v":"36 meses"},{"l":"Categoria A e B — cota","v":"Sem cota"},{"l":"Categoria C — cota anual","v":"10.000"},{"l":"Categorias B e C — estada","v":"24 meses"},{"l":"Oferta de emprego","v":"Não exigida"},{"l":"Universidades elegíveis (2026)","v":"200 instituições"},{"l":"Extensão típica","v":"36 meses"},{"l":"Via top-tier (2+6)","v":"6 anos, renda ≥ HKD 2M"},{"l":"Exclusive Survey","v":"Obrigatória desde 30/jan/2026"},{"l":"Taxa de aplicação","v":"HKD 600"}],"requirements":["<strong>Categoria A:</strong> renda anual de <strong>HKD 2.500.000 ou mais</strong> no ano imediatamente anterior à data do pedido.","<strong>Categoria B:</strong> bacharelado em regime integral de universidade constante da lista agregada, <strong>mais 3 anos ou mais de experiência profissional</strong> nos últimos 5 anos anteriores ao pedido.","<strong>Categoria C:</strong> graduação de universidade elegível nos últimos 5 anos, com <strong>menos de 3 anos de experiência</strong>. Sujeita a <strong>cota anual de 10.000</strong>.","Não possuir <strong>antecedentes criminais</strong> nem registo adverso de imigração.","Ter <strong>meios suficientes</strong> para sustentar-se e aos dependentes sem recurso a fundos públicos.","<strong>Não ser nacional</strong> de Afeganistão, Cuba, Coreia do Norte, Laos, Nepal ou Vietnã (restrição usual dos esquemas de admissão de Hong Kong).","Residentes do Continente (Mainland) <strong>podem</strong> aplicar ao TTPS — ao contrário do New CIES.","<strong>Não é necessário ter oferta de emprego</strong> em Hong Kong no momento do pedido."],"process":[{"step":"Preparação da documentação","detail":"Passaporte, comprovação de renda (Categoria A) ou diploma e comprovação de experiência (Categorias B e C), certidões.","timing":"—"},{"step":"Submissão online","detail":"Via <em>Immigration Department e-Services</em>, ou aplicação em papel.","timing":"—"},{"step":"Pagamento da taxa de aplicação","detail":"HKD 600, não reembolsável.","timing":"—"},{"step":"Processamento e decisão","detail":"Pelo Immigration Department. <em>O prazo-alvo divulgado historicamente é de cerca de 4 semanas para casos completos; verificar em immd.gov.hk.</em>","timing":"≈4 semanas (a confirmar)"},{"step":"Emissão do visto ou entry permit","detail":"Mediante pagamento da taxa de emissão.","timing":"—"},{"step":"Entrada e registo do HKID","detail":"Registo do Hong Kong Identity Card junto ao Registration of Persons Office, dentro de <strong>30 dias</strong> da chegada. <em>Prazo a confirmar.</em>","timing":"30 dias"},{"step":"Exclusive Survey — obrigatória desde 30/jan/2026","detail":"<strong>Todos os titulares de TTPS devem completar uma «Exclusive Survey» online ANTES de submeter qualquer pedido de extensão.</strong> A pesquisa recolhe dados de renda e de resultados de integração. É <strong>etapa obrigatória e bloqueante</strong> do procedimento.","timing":"A
