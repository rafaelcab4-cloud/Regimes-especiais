dezembro (Anexos I e II). Portaria n.º 52-A/2025/1, de 25 de fevereiro. Aviso n.º 4812/2025/2 (IAPMEI) e Aviso n.º 5309/2025/2 (AICEP). Ofício Circulado n.º 20276/2025 (AT). Lei n.º 21/2023, de 25 de maio (Lei das Startups).","desc":"Criado pela Lei 82/2023 para substituir o NHR, com escopo substancialmente mais restrito. <strong>Benefício:</strong> alíquota especial de <strong>20%</strong> sobre o rendimento líquido das categorias A (trabalho dependente) e B (empresarial e profissional) de <strong>fonte portuguesa</strong>, derivado da atividade elegível.\n\n<strong>Rendimentos estrangeiros isentos:</strong> categorias <strong>A, B, E (capitais), F (prediais) e G (mais-valias)</strong>. A isenção é <strong>com progressividade</strong> — os rendimentos estrangeiros isentos são considerados para determinar a taxa aplicável aos rendimentos não isentos.\n\n<strong>Categoria H (pensões) está expressamente excluída da isenção</strong> — é a única categoria fora. Pensões estrangeiras entram na tabela progressiva do IRS.\n\n<strong>Duração:</strong> 10 anos, contados do primeiro ano de residência fiscal.\n\nÉ um regime de <em>trabalho qualificado</em>, não de residência passiva: o rentista puro, o aposentado e o investidor passivo não se qualificam.","kv":[{"l":"Alíquota especial","v":"20% sobre renda PT qualificada"},{"l":"Renda estrangeira (A, B, E, F, G)","v":"Isenta, com progressividade"},{"l":"Pensões estrangeiras (cat. H)","v":"12,5%–48% (progressiva)"},{"l":"Renda de jurisdição listada","v":"35%, sem isenção"},{"l":"Duração","v":"10 anos"},{"l":"Prazo de inscrição","v":"Até 15 de janeiro"},{"l":"Confirmação pelas entidades","v":"Até 15 de fevereiro"},{"l":"Comprovativo da AT","v":"Até 31 de março"},{"l":"Nacionalidade","v":"Irrelevante"}],"requirements":["Tornar-se <strong>residente fiscal em Portugal</strong> no ano do pedido, nos termos do art. 16.º do CIRS.","<strong>Não ter sido residente fiscal em Portugal nos 5 anos anteriores.</strong>","<strong>Não beneficiar nem ter beneficiado</strong> do NHR nem do Programa Regressar.","Exercer <strong>atividade elegível</strong> em <strong>entidade elegível</strong> — ambas as condições são cumulativas.","<strong>Habilitação:</strong> doutoramento, <em>ou</em> licenciatura/mestrado com no mínimo <strong>3 anos de experiência profissional</strong> comprovada.","<strong>Nacionalidade é irrelevante</strong> — portugueses, cidadãos da UE e nacionais de países terceiros qualificam-se igualmente. Relevante para o brasileiro com dupla nacionalidade.","Para profissões exercidas em <strong>empresas industriais e de serviços</strong>: a empresa deve ter atividade principal em código CAE do Anexo II e <strong>exportar ao menos 50%</strong> do volume de negócios."],"process":[{"step":"Obter NIF e registar residência fiscal","detail":"NIF junto da AT (com representante fiscal, se ainda não residente) e alteração do domicílio fiscal no Portal das Finanças. É pressuposto do benefício."},{"step":"Iniciar a atividade elegível","detail":"Em entidade elegível, conforme o Anexo I (profissão) e o Anexo II (CAE da entidade)."},{"step":"Submeter o pedido de inscrição","timing":"Até 15 de janeiro do ano seguinte","detail":"Submissão no <strong>Portal das Finanças</strong>. A Portaria n.º 52-A/2025/1 centralizou todas as inscrições diretamente no Portal, mediante protocolo entre as entidades envolvidas."},{"step":"Confirmação pelas entidades certificadoras","timing":"Até 15 de fevereiro","detail":"FCT, ANI, AICEP, IAPMEI ou Startup Portugal, conforme o caso, comunicam à AT; as empresas confirmam o cumprimento dos requisitos."},{"step":"Disponibilização do comprovativo","timing":"Até 31 de março","detail":"A AT disponibiliza na área reservada do Portal das Finanças a informação sobre o estado da inscrição e o respetivo comprovativo."},{"step":"Comunicação anual de alterações","timing":"Até 15 de janeiro do ano seguinte","detail":"Qualquer alteração aos pressupostos deve ser comunicada pelo Portal das Finanças. Cumprimento declarativo anual pela Modelo 3 de IRS, com o anexo próprio do regime, ao longo dos 10 anos."}],"costs":[{"item":"Taxa de candidatura ao IFICI","value":"Não existe","note":"custo é honorários e obtenção das certificações setoriais"},{"item":"IRS — 1.º escalão (2026)","value":"12,5%","note":"taxas do 2.º ao 5.º escalão reduzidas em 0,3 p.p."},{"item":"IRS — escalões intermédios (2026)","value":"15,7% · 21,2% · 24,1% · 31,1%"},{"item":"IRS — taxa máxima (2026)","value":"48%","note":"a partir de €86.634 de rendimento coletável"},{"item":"Mais-valias mobiliárias","value":"28%","note":"englobamento obrigatório se títulos <365 dias e coletável ≥ €86.634"},{"item":"Mais-valias imobiliárias (residentes)","value":"50% do ganho englobado","note":"isenção possível por reinvestimento em habitação própria"},{"item":"Imposto do Selo — transmissões gratuitas","value":"10%","note":"cônjuge, descendentes e ascendentes são isentos, mas declaram"}],"sections":[{"title":"Rendimentos abrangidos e excluídos, categoria a categoria","body":"<strong>Fonte portuguesa:</strong> taxa especial de 20% sobre o rendimento líquido das categorias <strong>A</strong> (trabalho dependente) e <strong>B</strong> (empresarial e profissional) derivado da atividade elegível.\n\n<strong>Fonte estrangeira:</strong> isenção de IRS para as categorias <strong>A, B, E</strong> (capitais), <strong>F</strong> (prediais) e <strong>G</strong> (mais-valias).\n\n<strong>Método:</strong> isenção <em>com progressividade</em> — os rendimentos estrangeiros isentos entram no cálculo da taxa aplicável aos rendimentos não isentos. Consequência concreta: uma pensão brasileira empurra para cima a taxa aplicável aos rendimentos portugueses.\n\n<strong>Categoria H (pensões) está fora da isenção</strong> e entra na tabela progressiva de 12,5% a 48%. Foi precisamente a tributação de pensões que gerou a pressão política europeia sobre o NHR original.\n\n<em>Contexto (não normativo):</em> o IFICI foi desenhado como incentivo à atividade produtiva — investigação, inovação, emprego qualificado — e não como regime de captação de reformados."},{"title":"Quem certifica cada via de elegibilidade","body":"<strong>ANI</strong> (Agência Nacional de Inovação) — entidades reconhecidas em I&D no âmbito do SIFIDE.\n<strong>Startup Portugal</strong> — startups e scale-ups certificadas ao abrigo da Lei n.º 21/2023.\n<strong>AICEP</strong> — empresas industriais e de serviços com atividade reconhecida de interesse económico nacional em contratos de incentivo ao investimento.\n<strong>AICEP / IAPMEI</strong> — empresas sob benefícios fiscais contratuais ou RFAI.\n<strong>FCT, I.P.</strong> — unidades de investigação públicas e instituições de ensino superior reconhecidas.\n\n<strong>Profissões do Anexo I</strong> (códigos CPP): 112 (diretor-geral e gestor executivo); 12 (diretores administrativos e comerciais); 13 (diretores de produção e serviços especializados, exceto 1349); 21 (especialistas em ciências físicas, matemáticas e engenharias, exceto 216); 2163.1 (designer de produto industrial); 221 (médicos); 231 (professor do ensino universitário e superior); 25 (especialistas em TIC).\n\n<em>NÃO CONFIRMADO:</em> a enumeração completa do Anexo II (códigos CAE) e o período de referência do cálculo dos 50% de exportação."},{"title":"Lista portuguesa de jurisdições de tributação privilegiada","body":"Base: <strong>Portaria n.º 150/2004</strong>, de 13 de fevereiro, com alterações posteriores.\n\n<strong>Atualização relevante:</strong> a <strong>Portaria n.º 292/2025/1</strong>, de 5 de setembro, <strong>excluiu Hong Kong, Liechtenstein e Uruguai</strong> da lista, com efeitos a <strong>1 de janeiro de 2026</strong>. A lista conta atualmente com cerca de 77 jurisdições.\n\n<strong>Efeito prático:</strong> dividendos e mais-valias com origem em entidade listada são tributados a <strong>35%</strong> e ficam fora da isenção do IFICI. A lista serve ainda de gatilho para preços de transferência e para o regime CFC.\n\n<strong>O Brasil não consta da lista.</strong> Mas estruturas offshore frequentes no património de HNWIs brasileiros — BVI, Cayman, Panamá, Bahamas — constam. Este é o ponto de maior risco silencioso na transição para a residência portuguesa."},{"title":"Residência fiscal vs. residência legal em Portugal","body":"<strong>Art. 16.º, n.º 1, do CIRS</strong> — é residente fiscal quem, no ano dos rendimentos:\n(a) permaneceu <strong>mais de 183 dias</strong>, seguidos ou interpolados, em qualquer período de 12 meses com início ou fim no ano em causa; ou\n(b) tendo permanecido menos tempo, <strong>dispunha de habitação</strong>, em qualquer dia daquele período, em condições que façam supor intenção atual de a manter e ocupar como residência habitual.\n\nA jurisprudência do CAAD exige, na alínea (b), a reunião de um <em>corpus</em> (o local de residência) e de um <em>animus</em> (a intenção de a manter como residência habitual).\n\n<strong>Distinção operacional decisiva:</strong> ter título de residência ARI <strong>não</strong> torna alguém residente fiscal — o ARI exige apenas 7 dias no primeiro ano e 14 por biénio. Inversamente, um brasileiro sem qualquer título pode tornar-se residente fiscal apenas por permanência. São eixos independentes.\n\n<em>NÃO CONFIRMADO:</em> os n.os 3 e 4 do art. 16.º, que regulam a residência fiscal parcial e o momento inicial e final do estatuto no ano de mudança."}],"brazilNote":"<strong>CDT Brasil–Portugal:</strong> Convenção celebrada em Brasília em 16/mai/2000, promulgada pelo <strong>Decreto n.º 4.012, de 13/11/2001</strong>, em vigor desde 5 de outubro de 2001. Cobre os impostos federais sobre o rendimento dos dois Estados (IRPF/IRPJ e IRS/IRC). <strong>Não cobre</strong> ITCMD, IOF, contribuições nem o Imposto do Selo português — o risco sucessório fica inteiramente fora da Convenção.\n\n<strong>Retenções máximas na fonte:</strong> dividendos <strong>15%</strong> para pessoa singular residente em Portugal; juros <strong>15%</strong>; royalties <strong>15%</strong>. Método de eliminação: <strong>crédito de imposto</strong>.\n\n<strong>Atenção operacional decisiva:</strong> sob o IFICI, o rendimento estrangeiro está <em>isento</em> em Portugal — não há imposto português contra o qual creditar, e a retenção brasileira torna-se <strong>custo final</strong>.\n\n<strong>Aposentadorias e pensões — bifurcação frequentemente mal compreendida:</strong> pelo <strong>art. 18.º, n.º 2</strong>, as pensões pagas ao abrigo da legislação de Segurança Social de um Estado só podem ser tributadas pelo Estado da fonte — <strong>a aposentadoria do INSS só é tributável no Brasil</strong>. Já as pensões privadas e complementares (PGBL, VGBL, previdência fechada) seguem a regra do Estado da residência.\n\n<em>NÃO CONFIRMADO:</em> a redação exata do art. 18.º, n.º 1 (competência exclusiva vs. cumulativa nas pensões privadas) e se Portugal considera a pensão do INSS, isenta, para efeitos de progressividade. A resposta altera materialmente a carga efetiva.\n\n<strong>Desempate de dupla residência (art. 4.º, n.º 2):</strong> na ordem — habitação permanente disponível; centro de interesses vitais (relações pessoais e económicas mais estreitas); permanência habitual; nacionalidade. O brasileiro que mantém casa nos dois países cai no segundo critério, que é factual e probatório.\n\n<strong>Segurança social:</strong> Acordo Brasil–Portugal de 1991 (Decreto n.º 1.457/1995, alterado pelo Decreto n.º 7.999/2013) e Convenção Multilateral Ibero-Americana (Decreto n.º 8.358/2014 no Brasil; Decreto n.º 20/2014 em Portugal). Mecanismo de <strong>totalização de períodos</strong> — somam-se os períodos contributivos e cada país paga a parcela proporcional. <strong>Limitação:</strong> a Convenção Ibero-Americana não cobre aposentadoria por tempo de contribuição.\n\n<strong>Saída fiscal do Brasil</strong> (IN SRF 208/2002): Comunicação de Saída Definitiva da data da saída até o <strong>último dia de fevereiro</strong> do ano seguinte; Declaração de Saída Definitiva reportando a situação patrimonial na data da saída; e comunicação formal da condição de não residente a todas as fontes pagadoras no Brasil. <strong>Ganho de capital do não residente</strong> sobre bens situados no Brasil: alíquotas de 15% até R$ 5 mi, 17,5% até R$ 10 mi, 20% até R$ 30 mi e 22,5% acima — <strong>sem</strong> as isenções e reduções previstas para residentes.\n\n<strong>CRS:</strong> Brasil participa desde 2018; Portugal implementou em 1/jan/2016, com primeira troca em 2017. A declaração de residência fiscal prestada ao banco português determina para onde os dados são enviados — uma Comunicação de Saída não apresentada gera divergência detetável por cruzamento automático.\n\n<strong>Estatuto de Igualdade (Tratado de Porto Seguro, Decreto n.º 3.927/2001):</strong> equipara o brasileiro ao nacional português em direitos civis; a modalidade que inclui direitos políticos exige 3 anos de residência habitual e requerimento próprio, e <strong>importa a suspensão dos direitos políticos no Brasil</strong> enquanto durar. <strong>Não confere nacionalidade portuguesa, passaporte português nem cidadania da União Europeia</strong>, e não substitui a naturalização. Portugal retomou a concessão a brasileiros em setembro de 2025.","impact":"Restrito a rendimentos portugueses qualificados das categorias A e B, mediante atividade e entidade elegíveis. Não alcança rentistas, aposentados nem investidores passivos. A isenção sobre rendimentos estrangeiros das categorias A, B, E, F e G opera com progressividade, o que eleva a taxa aplicável aos rendimentos portugueses.","warning":"A lista de profissões do Anexo I é fechada por código: advogados, contabilistas, arquitetos e profissionais financeiros não-TIC ficam de fora. Rendimento com origem em jurisdição da lista portuguesa (que inclui BVI, Cayman, Panamá e Bahamas) é tributado a 35% sem isenção — ponto de risco frequente em patrimônios com estruturas offshore. Hong Kong, Liechtenstein e Uruguai saíram dessa lista com efeitos a 1/jan/2026.","sources":[{"t":"DRE · Portaria n.º 352/2024/1 (23/dez/2024)","u":"https://diariodarepublica.pt/dr/detalhe/portaria/352-2024-901014291"},{"t":"DRE · Portaria n.º 52-A/2025/1 (25/fev/2025)","u":"https://diariodarepublica.pt/dr/detalhe/portaria/52-a-2025-908703847"},{"t":"AT · FAQ IFICI","u":"https://info.portaldasfinancas.gov.pt/pt/apoio_contribuinte/questoes_frequentes/pages/faqs-01018.aspx"},{"t":"AT · Folheto informativo IFICI (PDF)","u":"https://info.portaldasfinancas.gov.pt/pt/apoio_contribuinte/Folhetos_informativos/Documents/incentivos_investigacao.pdf"},{"t":"AT · Art. 16.º do CIRS (residência fiscal)","u":"https://info.portaldasfinancas.gov.pt/pt/informacao_fiscal/codigos_tributarios/cirs_rep/Pages/irs16.aspx"},{"t":"DRE · Portaria n.º 292/2025/1 (lista de jurisdições)","u":"https://diariodarepublica.pt/dr/detalhe/portaria/292-2025-934278891"},{"t":"Planalto · Decreto n.º 4.012/2001 (CDT Brasil–Portugal)","u":"http://www.planalto.gov.br/ccivil_03/decreto/2001/D4012.htm"}]}],"visa":[{"name":"Golden Visa — ARI (Autorização para Investimento)","status":"changed","desc":"Investimento imobiliário em áreas urbanas densas (Lisboa, Porto, Algarve) excluído desde out/2023. Opções remanescentes: (A) €1.500.000 em transferência de capital; (B) €500.000 em fundos de capital de risco/private equity portugueses não-imobiliários; (C) 10 postos de trabalho; (D) €500.000 em imóveis em zonas de baixa densidade.\n\n<strong>Permanência:</strong> mínimo de 7 dias (seguidos ou interpolados) no primeiro ano, e não menos de 14 dias em cada período subsequente de dois anos. Residência permanente após 5 anos.\n\n<strong>Família:</strong> cônjuge, filhos menores ou incapazes e ascendentes dependentes do titular obtêm autorização de residência própria por reagrupamento familiar (art. 98.º), com os mesmos direitos de circulação no espaço Schengen, e podem requerer naturalização de forma independente.\n\n<strong>Naturalização (atualizado):</strong> desde 19/mai/2026, com a Lei Orgânica n.º 1/2026, o prazo mínimo de residência legal para naturalização passou de 5 para <strong>7 anos</strong> (nacionais de países de língua oficial portuguesa, incluindo o Brasil) ou <strong>10 anos</strong> (demais nacionalidades). Pedidos protocolados até 18/mai/2026 continuam regidos pela regra anterior de 5 anos.","kv":[{"l":"Fundo de investimento","v":"€500.000"},{"l":"Transferência capital","v":"€1.500.000"},{"l":"Imóvel urbano","v":"❌ Excluído"},{"l":"Presença mín.","v":"7 dias (1º ano) + 14 dias/biênio"},{"l":"Residência perm.","v":"Após 5 anos"},{"l":"Naturalização (CPLP/Brasil)","v":"7 anos (desde 19/mai/2026)"},{"l":"Naturalização (demais)","v":"10 anos (desde 19/mai/2026)"},{"l":"Pedidos até 18/mai/2026","v":"Regra antiga: 5 anos"}],"impact":"Com o NHR extinto e o Golden Visa restrito a modalidades não-imobiliárias, a combinação Golden Visa + IFICI permanece disponível para empreendedores elegíveis. O aumento do prazo de naturalização (Lei Orgânica 1/2026) afeta diretamente o planejamento de titulares que ainda não tenham submetido pedido.","sources":[{"t":"AIMA · Autorização de Residência para Investimento (Art. 90.º-A)","u":"https://aima.gov.pt/pt/viver/autorizacao-de-residencia-para-investimento-art-90-o-a"},{"t":"AIMA · Reagrupamento familiar (Art. 98.º)","u":"https://aima.gov.pt/pt/viver/reagrupamento-familiar-com-familiar-fora-de-territorio-nacional-art-98-o-n-o-1"},{"t":"DRE · Lei Orgânica n.º 1/2026 (18/mai/2026)","u":"https://diariodarepublica.pt/dr/detalhe/lei-organica/1-2026-1123539996"}]}]},"es":{"id":"es","flagCode":"es","name":"Espanha","region":"Europa","alert":true,"sumFiscal":"Lei Beckham (art. 93 LIRPF) · Ley Mbappé (Madrid)","sumFS":"ok","sumVisa":"Golden Visa extinto · Teletrabalho internacional","sumVS":"ext","fiscal":[{"name":"Lei Beckham — Regime de Impatriados (Art. 93 LIRPF)","status":"ok","legalBasis":"Art. 93 da Ley 35/2006, de 28 de novembro (LIRPF), na redação dada pela Ley 28/2022, de 21 de dezembro (Ley de fomento del ecosistema de las empresas emergentes, «Ley de Startups»), disposición final tercera. Desenvolvimento regulamentar: Real Decreto 439/2007 (RIRPF), arts. 113 a 120. Modelos 149 e 151 aprovados pela Orden HFP/1338/2023, de 13 de dezembro (BOE-A-2023-25416). Exclusão de desportistas profissionais: Real Decreto 1006/1985, com efeitos desde 1/jan/2015.","desc":"Regime opcional que permite ao trabalhador deslocado para a Espanha ser tributado <strong>pelas regras do Imposto sobre a Renda de Não Residentes (IRNR)</strong>, mantendo formalmente a condição de contribuinte do IRPF. Alíquota fixa de <strong>24% até €600.000</strong> de base liquidável e <strong>47% sobre o excedente</strong>; a base do poupança (dividendos, juros e mais-valias de <em>fonte espanhola</em>) segue a escala do aforro de 19% / 21% / 23% / 27% / 30%.\n\nDuração: o período impositivo da mudança de residência <strong>mais os 5 seguintes</strong> — seis exercícios no total.\n\n<strong>Ponto mais frequentemente mal compreendido:</strong> o art. 93.2.b) determina que <strong>a totalidade dos rendimentos do trabalho</strong> obtidos durante a aplicação do regime <em>se entende obtida em território espanhol</em>. Isso significa que salário pago por empregador estrangeiro, por trabalho fisicamente realizado no exterior, <strong>é tributado na Espanha</strong> a 24%/47% — admitida a dedução por dupla tributação internacional. O regime <strong>não</strong> é um sistema de tributação territorial sobre o trabalho.\n\nEm contrapartida, <strong>rendas de capital de fonte estrangeira</strong> (dividendos, juros, mais-valias e aluguéis obtidos fora da Espanha) ficam <strong>fora</strong> da base espanhola.\n\nA Ley 28/2022 reduziu de 10 para 5 os anos de não residência prévia exigidos e estendeu o regime ao <strong>cônjuge, aos filhos menores de 25 anos</strong> (ou com deficiência, sem limite de idade) e ao progenitor dos filhos, sob condições próprias.","kv":[{"l":"Alíquota — trabalho","v":"24% até €600k · 47% acima"},{"l":"Base do aforro (fonte ES)","v":"19% · 21% · 23% · 27% · 30%"},{"l":"Rendas de capital estrangeiras","v":"Fora da base espanhola"},{"l":"Rendimento do trabalho estrangeiro","v":"Tributado na Espanha"},{"l":"Duração","v":"6 exercícios (ano da mudança + 5)"},{"l":"Não residência prévia","v":"5 períodos impositivos"},{"l":"Prazo de opção","v":"6 meses (Modelo 149)"},{"l":"Declaração anual","v":"Modelo 151"},{"l":"IP e ISGF","v":"Obligación real (só bens em ES)"},{"l":"Família","v":"Cônjuge · filhos < 25 anos"}],"requirements":["Não ter sido residente fiscal na Espanha nos <strong>5 períodos impositivos</strong> anteriores ao do deslocamento.","O deslocamento decorrer de uma das causas admitidas: contrato de trabalho com empregador espanhol ou estrangeiro; <strong>teletrabalho internacional</strong> por meios exclusivamente telemáticos; aquisição da condição de <strong>administrador</strong> de entidade; atividade econômica qualificada como <strong>empreendedora</strong>; ou prestação de serviços como profissional altamente qualificado a empresas emergentes ou de I+D+i.","No caso de administrador: a participação no capital <strong>não pode ser igual ou superior a 25%</strong> se a entidade for <strong>patrimonial</strong>. Para entidades não patrimoniais, a Ley 28/2022 removeu o limite.","Não obter rendas por meio de <strong>estabelecimento permanente</strong> situado na Espanha, salvo nas hipóteses empreendedoras expressamente admitidas.","<strong>Desportistas profissionais</strong> submetidos ao Real Decreto 1006/1985 estão expressamente excluídos desde 1/jan/2015.","Extensão a familiares: exige deslocamento com o contribuinte principal (ou em momento posterior, sem que tenha terminado o primeiro período impositivo do regime) e que a soma das bases liquidáveis dos familiares seja inferior à do contribuinte principal."],"process":[{"step":"Deslocamento e alta na Seguridad Social","detail":"Inscrição no sistema espanhol de seguridade social, ou apresentação de documentação equivalente — certificado de legislação aplicável emitido pelo país de origem, ao abrigo de acordo bilateral. A data de início da atividade constante da alta é o marco inicial do prazo de opção.","timing":"Na chegada"},{"step":"Comunicação da opção — Modelo 149","detail":"Apresentação do <strong>Modelo 149</strong> à AEAT comunicando a opção pelo regime. Prazo máximo: <strong>6 meses contados da data de início da atividade</strong> que consta da alta na Seguridad Social. Perdido o prazo, a opção não pode ser exercida.","timing":"Até 6 meses"},{"step":"Emissão do documento acreditativo","detail":"A Administração emite o documento que acredita a sujeição ao regime, a apresentar ao empregador para efeitos de retenção na fonte pela alíquota do regime.","timing":"Até 10 dias úteis"},{"step":"Declaração anual — Modelo 151","detail":"O impatriado declara pelo <strong>Modelo 151</strong>, e não pelo Modelo 100 do IRPF geral. Prazo coincidente com a campanha anual da Renta (abril a junho do ano seguinte).","timing":"Anual"},{"step":"Renúncia ou exclusão","detail":"A renúncia ao regime comunica-se também pelo <strong>Modelo 149</strong>, nos meses de novembro e dezembro anteriores ao início do ano civil em que deva produzir efeitos. A exclusão (por deixar de cumprir os requisitos) é igualmente comunicada por Modelo 149, no prazo de um mês.","timing":"Nov–dez / 1 mês"},{"step":"Fim do regime","detail":"Esgotados os seis exercícios, o contribuinte passa automaticamente ao IRPF geral: tributação por renda mundial, escalas estatal e autonômica, e Impuesto sobre el Patrimonio e ISGF por <em>obligación personal</em> (patrimônio mundial).","timing":"6º exercício"}],"costs":[{"item":"Rendimento do trabalho até €600.000","value":"24%","note":"Alíquota fixa, sem escala autonômica"},{"item":"Rendimento do trabalho acima de €600.000","value":"47%"},{"item":"Base do aforro — fonte espanhola","value":"19% a 30%","note":"5 tramos"},{"item":"Impuesto sobre el Patrimonio (IP)","value":"Só bens em ES","note":"Obligación real; mínimo isento estatal €700.000 + €300.000 de habitação habitual"},{"item":"ISGF — Imposto de Solidariedade das Grandes Fortunas","value":"1,7% a 3,5%","note":"0% até €3.000.000; Modelo 718, apresentado de 1 a 31 de julho"},{"item":"Seguridad Social — autônomo (RETA), 2026","value":"≈€217 a ≈€796/mês","note":"15 tramos por rendimento líquido real; bases congeladas nos valores de 2025"},{"item":"Modelos 149 e 151","value":"Sem taxa"}],"sections":[{"title":"Impuesto sobre el Patrimonio e ISGF sob o regime","body":"O impatriado tributa o <strong>Impuesto sobre el Patrimonio</strong> e o <strong>Impuesto Temporal de Solidaridad de las Grandes Fortunas (ISGF)</strong> por <strong>obligación real</strong> — apenas sobre bens e direitos situados em território espanhol. O patrimônio mantido no exterior fica fora de ambos.\n\n<strong>Escala estatal supletória do IP</strong> (mínimo isento de €700.000, mais isenção da habitação habitual até €300.000): 0,2% até €167.129 · 0,3% até €334.252 · 0,5% até €668.499 · 0,9% até €1.336.999 · 1,3% até €2.673.999 · 1,7% até €5.347.998 · 2,1% até €10.695.996 · <strong>3,5%</strong> acima.\n\n<strong>ISGF</strong> (estatal, não cedido às Comunidades Autônomas): 0% até €3.000.000 · 1,7% de €3.000.000 a €5.347.998 · 2,1% até €10.695.996 · 3,5% acima. Prorrogado por prazo indeterminado pelo Real Decreto-ley 8/2023.\n\n<strong>Bonificações autonômicas no IP:</strong> bonificação de 100% em Madrid, Andaluzia, Cantábria, Extremadura, La Rioja e Região de Múrcia. <strong>Galiza: 50%</strong>. Extremadura fixa mínimo isento próprio de €500.000; as Baleares não bonificam, mas aplicam mínimo isento de €3.000.000.\n\n<strong>Mecânica de neutralização:</strong> o ISGF estatal permite deduzir a cuota efetivamente paga de IP. Onde o IP resulta em €0 por bonificação autonômica, o ISGF é devido integralmente acima de €3.000.000 — a bonificação autonômica fica economicamente neutralizada nessa faixa, mantendo efeito apenas entre o mínimo isento e €3.000.000. Diversas Comunidades Autônomas responderam criando gravames próprios para reter a arrecadação.\n\n<strong>Alteração de 2026:</strong> a Orden HAC/652/2026, de 26 de junho (BOE 29/06/2026, BOE-A-2026-14011), eliminou do Modelo 718 a restrição que aplicava o limite da cuota íntegra \"unicamente a sujetos pasivos por obligación personal\", passando a admiti-lo também para <strong>obligación real</strong> — situação típica do impatriado. Aplicável já ao exercício de 2025, com apresentação a partir de 1/jul/2026."},{"title":"Obrigações informativas: Modelos 720 e 721","body":"<strong>Modelo 720</strong> — declaração informativa de bens e direitos situados no estrangeiro, dividida em três blocos: (i) contas em instituições financeiras; (ii) valores, direitos, seguros e rendas; (iii) bens imóveis. Limiar de <strong>€50.000 por bloco</strong> em 31 de dezembro. A reapresentação em anos seguintes só é exigida se houver incremento superior a <strong>€20.000</strong> em relação à última declaração. Prazo: <strong>1 de janeiro a 31 de março</strong>.\n\n<strong>Modelo 721</strong> — criptoativos custodiados no exterior, mesmo limiar de €50.000 e mesmo prazo.\n\n<strong>Regime sancionatório:</strong> o acórdão do <strong>TJUE de 27/01/2022 (processo C-788/19)</strong> declarou contrário ao Direito da União o regime anterior — imprescritibilidade e multas proporcionais de 150%, além de multas fixas desproporcionadas. A <strong>Ley 5/2022, de 9 de março</strong>, suprimiu esses regimes; aplicam-se hoje as regras gerais da Ley General Tributaria (arts. 198 e 199, infrações por não apresentar ou apresentar de forma incompleta declarações informativas) e o prazo ordinário de prescrição de <strong>4 anos</strong>.\n\n<em>Nota de verificação:</em> os importes fixos exatos das sanções após a Ley 5/2022 devem ser confirmados nos arts. 198 e 199 da LGT antes de qualquer quantificação."},{"title":"Exit tax espanhol — art. 95 bis LIRPF","body":"Aplica-se ao contribuinte que <strong>perde a residência fiscal espanhola</strong> tendo sido residente em <strong>pelo menos 10 dos 15 períodos impositivos</strong> anteriores ao último a declarar.\n\nTributa as <strong>mais-valias latentes</strong> de ações e participações de qualquer entidade quando, na data do último período a declarar:\n· o <strong>valor de mercado conjunto</strong> das participações exceder <strong>€4.000.000</strong>; ou\n· a participação numa entidade for <strong>superior a 25%</strong> e o valor dessas ações exceder <strong>€1.000.000</strong>.\n\nIntroduzido pela Ley 26/2014, em vigor desde 1/jan/2015. Existem regras de diferimento e parcelamento para deslocamentos à União Europeia ou ao Espaço Económico Europeu e para deslocamentos temporários por motivo laboral.\n\n<strong>Relevância prática:</strong> os seis exercícios da Lei Beckham não são suficientes para atingir o limiar de 10 em 15 anos. A exposição ao exit tax surge para quem permanece residente fiscal na Espanha depois de esgotado o regime."},{"title":"Escalas do IRPF geral, para comparação","body":"Quem não opta (ou deixa de estar) sob o art. 93 tributa pelo IRPF geral, cuja alíquota resulta da soma de uma escala <strong>estatal</strong> e de uma escala <strong>autonômica</strong>.\n\n<strong>Escala estatal 2026:</strong> de 9,5% (até €12.450) a 24,5% (acima de €300.000).\n<strong>Escala autonômica de Madrid 2026:</strong> de 8,50% a 20,50% (acima de €60.000), resultando em marginal máximo agregado de <strong>45,00%</strong> em Madrid.\n<strong>Tipo supletório estatal</strong> (aplicável quando não há escala autonômica própria): 47%.\nComunidades com marginais mais elevados, como a Catalunha e a Comunidade Valenciana, chegam a aproximadamente 54%.\n\n<em>Nota de verificação:</em> há fontes secundárias divergentes que citam 43,50% como marginal agregado de Madrid. O valor deve ser confirmado no texto refundido madrileno vigente para 2026 antes de ser usado em cálculo."},{"title":"Imposto sobre sucessões e doações (ISD)","body":"O ISD é <strong>cedido às Comunidades Autônomas</strong>, e a carga varia radicalmente conforme a residência do falecido ou do donatário e o grau de parentesco.\n\n· <strong>Madrid</strong> — bonificação de 99% na cuota para os Grupos I e II (descendentes, ascendentes e cônjuge).\n· <strong>Andaluzia</strong> — redução própria e bonificação de 99% para os Grupos I e II.\n· <strong>Catalunha</strong> — reduções por parentesco (descendentes menores de 21 anos até €100.000; demais descendentes e cônjuge até €50.000; ascendentes até €30.000) e bonificações decrescentes conforme a base, <strong>sem</strong> bonificação geral de 99%.\n\n<em>Nota de verificação:</em> os percentuais e limites exatos por Comunidade Autônoma para 2026 devem ser conferidos na normativa autonômica vigente antes de qualquer planejamento sucessório."}],"brazilNote":"<strong>CDT Brasil–Espanha:</strong> Convenção para evitar a dupla tributação assinada em Brasília em <strong>14/nov/1974</strong>, publicada no BOE (BOE-A-1975-26928) e promulgada no Brasil pelo <strong>Decreto n.º 76.975</strong>. Há troca de Cartas interpretativas de 17 e 26/fev/2003 (BOE-A-2003-18257). Indicações preliminares apontam limite de 15% para dividendos e juros e cláusulas de <em>tax sparing / matching credit</em> com alíquotas fictas de 20% (juros) e 25% (royalties) — <strong>as alíquotas-limite por artigo devem ser confirmadas no Anexo III «Límites de imposición en los convenios» da AEAT antes de aplicação</strong>.\n\n<strong>Ponto crítico — Beckham e o acesso ao CDT.</strong> Quem opta pelo art. 93 LIRPF <strong>não tem, em regra, a condição de «residente» para efeitos de aplicação de um Convênio de Dupla Tributação</strong>: o impatriado é submetido a tributação exclusivamente sobre rendas de fonte espanhola (<em>obligación real</em>), enquanto a definição de residente do art. 4 dos CDT exige sujeição a imposto por renda mundial. Consequências práticas para o brasileiro: dificuldade de obter da AEAT o certificado de residência fiscal «a efeitos de convênio»; risco de o Brasil não reconhecer a residência espanhola e manter a tributação de renda mundial; e retenções na fonte no Brasil sem a redução convencional. <em>Recomenda-se localizar consulta vinculante da DGT sobre o tema antes de estruturar a operação.</em>\n\n<strong>Seguridade social:</strong> o Acordo Brasil–Espanha, promulgado pelo <strong>Decreto n.º 1.689/1995</strong>, permite a <strong>totalização</strong> de períodos de seguro (art. 16.2) para aposentadoria por idade, invalidez, pensão por morte e acidentes de trabalho, e a emissão de <strong>Certificado de Deslocamento</strong>, que mantém a filiação no país de origem durante deslocamentos temporários.\n\n<strong>Saída fiscal do Brasil</strong> — dois atos distintos e complementares: (1) <strong>Comunicação de Saída Definitiva do País (CSDP)</strong>, a partir da data de saída e até o último dia útil de fevereiro do ano-calendário seguinte; (2) <strong>Declaração de Saída Definitiva do País (DSDP)</strong>, no mesmo prazo da DIRPF do ano seguinte. Sem esses atos, o contribuinte continua tratado como residente fiscal no Brasil, com tributação de renda mundial e risco de dupla residência. A condição de não residente aplica-se a partir da data da saída (saída com caráter permanente) ou após <strong>12 meses consecutivos de ausência</strong> (saída sem caráter permanente).\n\n<strong>CRS:</strong> Espanha e Brasil são jurisdições participantes do Common Reporting Standard da OCDE. Instituições financeiras espanholas reportam contas de residentes fiscais brasileiros à AEAT, que as troca com a Receita Federal, e vice-versa. Somando-se o Modelo 720/721 espanhol e a e-Financeira brasileira, há dupla via de visibilidade patrimonial.\n\n<strong>ITCMD:</strong> a Convenção de 1974 não cobre imposto sucessório. Sucessões e doações que envolvam bens na Espanha e herdeiros no Brasil ficam sujeitas cumulativamente ao ISD autonômico espanhol e ao ITCMD estadual brasileiro, sem instrumento convencional de alívio.","warning":"O art. 93.2.b) faz com que <strong>todo o rendimento do trabalho</strong>, inclusive o pago por empregador estrangeiro por trabalho realizado fora da Espanha, seja considerado obtido em território espanhol e tributado a 24%/47%. Estruturas montadas sobre a premissa oposta — de que só o salário de fonte espanhola seria alcançado — produzem passivo tributário retroativo.\n\nA perda da condição de residente convencional para efeitos do CDT Brasil–Espanha é a segunda exposição relevante: o impatriado pode ficar sem acesso às reduções de retenção na fonte no Brasil e sem certificado de residência fiscal aceitável pela Receita Federal.","sources":[{"t":"AEAT · Régimen especial de impatriados (art. 93 LIRPF)","u":"https://sede.agenciatributaria.gob.es/Sede/ayuda/manuales-videos-folletos/manuales-practicos/manual-tributacion-no-residentes/regimenes-opcionales/regimen-especial-impatriados.html"},{"t":"AEAT · Modelo 149 — comunicação da opção","u":"https://sede.agenciatributaria.gob.es/Sede/procedimientos/G606.shtml"},{"t":"AEAT · Modelo 151 — declaração anual do impatriado","u":"https://sede.agenciatributaria.gob.es/Sede/procedimientoini/G615.shtml"},{"t":"BOE · Orden HFP/1338/2023 (modelos 149 e 151)","u":"https://www.boe.es/diario_boe/txt.php?id=BOE-A-2023-25416"},{"t":"AEAT · Impuesto Temporal de Solidaridad de las Grandes Fortunas","u":"https://sede.agenciatributaria.gob.es/Sede/declaraciones-informativas-otros-impuestos-tasas/impuesto-temporal-solidaridad-grandes-fortunas.html"},{"t":"AEAT · Modificação do ITSGF (Modelo 718), 29/06/2026","u":"https://sede.agenciatributaria.gob.es/Sede/todas-noticias/2026/junio/29/modificacion-impuesto-temporal-solidaridad-grandes-fortunas.html"},{"t":"AEAT · Anexo III — límites de imposición en los convenios","u":"https://sede.agenciatributaria.gob.es/Sede/ayuda/manuales-videos-folletos/manuales-practicos/manual-tributacion-no-residentes/anexos/limites-imposicion-convenios.html"},{"t":"BOE · Convenio España–Brasil 1974 (BOE-A-1975-26928)","u":"https://www.boe.es/buscar/act.php?id=BOE-A-1975-26928"},{"t":"Planalto · Decreto n.º 76.975 (promulgação da CDT)","u":"https://www.planalto.gov.br/ccivil_03/decreto/1970-1979/d76975.htm"},{"t":"Planalto · Decreto n.º 1.689/1995 (acordo previdenciário)","u":"https://www.planalto.gov.br/ccivil_03/decreto/1995/d1689.htm"},{"t":"Receita Federal · Comunicação de Saída Definitiva do País","u":"https://www.csdp.receita.fazenda.gov.br/csdp/pages/orientacoes/orientacoes-gerais.xhtml"}]},{"name":"Ley Mbappé — Dedução autonômica de Madrid (Ley 4/2024)","status":"new","legalBasis":"Ley 4/2024, de 20 de novembro, da Comunidade de Madrid, que modifica o Decreto Legislativo 1/2010, de 21 de outubro (texto refundido das disposições legais da Comunidade de Madrid em matéria de tributos cedidos pelo Estado). Publicada no BOCM em 28/11/2024; publicação estatal BOE-A-2025-3302. Produz efeitos para residências fiscais adquiridas a partir de 1/jan/2024.","desc":"Dedução na <strong>cuota íntegra autonômica</strong> do IRPF de Madrid, correspondente a <strong>20% do valor de aquisição</strong> de determinados investimentos realizados por quem se torna contribuinte do IRPF com residência habitual na Comunidade de Madrid vindo do exterior.\n\n<strong>Não é um regime especial de tributação.</strong> É uma dedução dentro do IRPF geral — quem a utiliza tributa pela renda mundial, com as escalas estatal e autonômica, e sujeita-se ao Impuesto sobre el Patrimonio e ao ISGF por <em>obligación personal</em> (patrimônio mundial).\n\n<strong>Relação com a Lei Beckham:</strong> os dois não se somam. A dedução é autonômica, dentro do IRPF geral; o impatriado do art. 93 tributa pelas regras do IRNR e não acede a deduções autonômicas. A escolha é excludente na prática.\n\nBase da dedução: valor de aquisição, incluindo gastos e tributos inerentes. Insuficiência de cuota íntegra: o saldo não aproveitado aplica-se no exercício e nos <strong>5 exercícios seguintes, imediatos e sucessivos</strong>.","kv":[{"l":"Dedução","v":"20% do valor de aquisição"},{"l":"Âmbito","v":"Cuota íntegra autonômica · Madrid"},{"l":"Não residência prévia","v":"5 anos"},{"l":"Prazo do investimento","v":"Ano da mudança ou o seguinte"},{"l":"Manutenção obrigatória","v":"6 anos (investimento e residência)"},{"l":"Participação máxima","v":"40% (com grupo familiar)"},{"l":"Imóveis","v":"Excluídos da base"},{"l":"Saldo não aproveitado","v":"5 exercícios seguintes"},{"l":"Tributação","v":"IRPF geral · renda mundial"}],"requirements":["Ser pessoa física <strong>não residente</strong> na Espanha que passa a contribuinte do IRPF com <strong>residência habitual na Comunidade de Madrid</strong>.","Não ter sido residente na Espanha nos <strong>5 anos</strong> anteriores à mudança.","Investir em <strong>valores representativos da cessão a terceiros de capitais próprios</strong> (renda fixa) ou em <strong>valores representativos da participação em fundos próprios</strong> de entidades de qualquer tipo, cotados ou não em mercados organizados.","<strong>Investimento imobiliário está excluído</strong> da base da dedução.","Ficam excluídas entidades domiciliadas em <strong>paraísos fiscais ou territórios não cooperativos</strong>.","Participação direta ou indireta <strong>não superior a 40%</strong> do capital ou dos direitos de voto da entidade, computando-se cônjuge e parentes em linha reta ou colateral, por consanguinidade ou afinidade, <strong>até o 2.º grau inclusive</strong>.","<strong>Não exercer funções executivas ou de direção</strong> na entidade investida nem manter com ela relação laboral.","Manter o investimento <strong>e</strong> a residência na Comunidade de Madrid durante <strong>6 anos</strong>."],"process":[{"step":"Aquisição de residência fiscal em Madrid","detail":"Passar a contribuinte do IRPF com residência habitual na Comunidade de Madrid, pelos critérios gerais do art. 9 da LIRPF (permanência superior a 183 dias em território espanhol ou núcleo principal de interesses económicos), com permanência majoritária em Madrid.","timing":"Ano 0"},{"step":"Realização do investimento elegível","detail":"O investimento deve ser realizado <strong>no exercício de aquisição da residência ou no exercício seguinte</strong>.","timing":"Ano 0 ou ano 1"},{"step":"Declaração na Renta","detail":"A dedução é declarada no bloco de deduções autonômicas de Madrid da declaração anual do IRPF, no intervalo de casillas <strong>1039–1051</strong>.\n<em>Nota de verificação: a casilla exata dentro desse intervalo, para o modelo do exercício corrente, deve ser confirmada no manual de ajuda da AEAT.</em>","timing":"Campanha anual"},{"step":"Aproveitamento do saldo","detail":"Havendo insuficiência de cuota íntegra autonômica, o saldo é aplicável no próprio exercício e nos <strong>5 exercícios seguintes, imediatos e sucessivos</strong>.","timing":"Até 6 exercícios"},{"step":"Manutenção e regularização","detail":"O descumprimento do prazo de manutenção de 6 anos — do investimento ou da residência em Madrid — obriga à <strong>regularização</strong> das quantias deduzidas, com os juros correspondentes.","timing":"6 anos"}],"costs":[{"item":"Taxa administrativa própria","value":"Não há"},{"item":"IRPF geral (estatal + Madrid)","value":"9,5%–24,5% + 8,5%–20,5%","note":"Marginal agregado máximo em Madrid: 45,00% — a confirmar no texto refundido madrileno de 2026"},{"item":"IP e ISGF","value":"Obligación personal","note":"Patrimônio mundial; IP bonificado em 100% em Madrid, ISGF devido acima de €3.000.000"}],"sections":[{"title":"Incompatibilidades declaradas","body":"Para os mesmos investimentos, a dedução é <strong>incompatível</strong> com as demais deduções madrilenhas «por inversión en adquisición de acciones y participaciones de nuevas entidades» e «por inversiones en entidades cotizadas en el Mercado Alternativo Bursátil (MAB)».\n\n<em>Nota de verificação:</em> o texto literal da incompatibilidade entre esta dedução e o regime do art. 93 LIRPF, no articulado da Ley 4/2024, deve ser lido diretamente no BOE-A-2025-3302. A incompatibilidade prática decorre da própria mecânica: o impatriado tributa pelas regras do IRNR e não acede às deduções autonômicas do IRPF."},{"title":"Comparação factual entre os dois regimes","body":"<strong>Art. 93 (Beckham):</strong> alíquota fixa de 24% até €600.000; sem escalas autonômicas; rendas de capital de fonte estrangeira fora da base espanhola; IP e ISGF por <em>obligación real</em> (apenas bens espanhóis); sem acesso a deduções autonômicas do IRPF; sem acesso, em regra, aos benefícios do CDT; duração de 6 exercícios; rendimento do trabalho de fonte estrangeira <em>é</em> tributado na Espanha.\n\n<strong>Ley 4/2024 (Mbappé):</strong> tributação pelo IRPF geral — escalas estatal e autonômica de Madrid, renda mundial, IP e ISGF por <em>obligación personal</em> sobre o patrimônio mundial; crédito de 20% do valor de aquisição do investimento elegível; sem limite temporal de 6 anos para a condição de residente; exige imobilização de 6 anos e residência mantida em Madrid; mantém acesso pleno ao CDT como residente convencional."}],"brazilNote":"Por tributar pelo IRPF geral, quem utiliza a dedução da Ley 4/2024 <strong>mantém a condição de residente para efeitos do CDT Brasil–Espanha</strong> (Decreto n.º 76.975) — diferentemente do impatriado do art. 93. Isso preserva o acesso ao certificado de residência fiscal «a efeitos de convênio» emitido pela AEAT, às alíquotas-limite convencionais sobre dividendos, juros e royalties de fonte brasileira, e ao crédito de imposto pago no Brasil.\n\nEm contrapartida, a tributação por renda mundial alcança rendimentos de fonte brasileira (aluguéis, dividendos, juros, ganhos de capital), e o Impuesto sobre el Patrimonio e o ISGF passam a incidir por <em>obligación personal</em> sobre o patrimônio global, incluindo bens no Brasil — com a ressalva de que Madrid bonifica o IP em 100%, restando o ISGF acima de €3.000.000.\n\nObrigações informativas espanholas aplicáveis ao patrimônio brasileiro: <strong>Modelo 720</strong> (contas, valores e imóveis, limiar de €50.000 por bloco) e <strong>Modelo 721</strong> (criptoativos custodiados no exterior). No Brasil, permanecem exigíveis a CSDP e a DSDP para formalizar a saída fiscal.","sources":[{"t":"BOE · Ley 4/2024 da Comunidade de Madrid (BOE-A-2025-3302)","u":"https://www.boe.es/diario_boe/txt.php?id=BOE-A-2025-3302"},{"t":"AEAT · Deducción por inversiones de nuevos contribuyentes procedentes del extranjero","u":"https://sede.agenciatributaria.gob.es/Sede/ayuda/manuales-videos-folletos/manuales-practicos/irpf-2025-deducciones-autonomicas/comunidad-madrid/inversiones-nuevos-contribuyentes-procedentes-extranjero.html"},{"t":"AEAT · Cumplimentación — casillas 1039–1051","u":"https://sede.agenciatributaria.gob.es/Sede/ayuda/manuales-videos-folletos/manuales-ayuda-presentacion/irpf-2025/10-cumplimentacion-irpf-deducciones-autonomicas/10_12-comunidad-madrid/10_12_23-inversiones-nuevos-contribuyentes-procedentes-extranjero.html"},{"t":"Gómez-Acebo & Pombo · Análise da Ley Mbappé (PDF)","u":"https://ga-p.com/wp-content/uploads/2024/11/Ley_Mbappe.pdf"}]}],"visa":[{"name":"Golden Visa — Autorização de Residência por Investimento","status":"ext","legalBasis":"Revogado pela Ley Orgánica 1/2025, de 2 de janeiro, de medidas en materia de eficiencia del Servicio Público de Justicia — disposición final vigésima primera, que derroga os arts. 63, 64, 65, 66 e 67 da Ley 14/2013, de 27 de setembro. Entrada em vigor da derrogação: 3 de abril de 2025. Regime transitório: disposición transitoria segunda.","desc":"<strong>Encerrado para novas admissões desde 3 de abril de 2025.</strong> A Ley Orgánica 1/2025 revogou os artigos da Ley 14/2013 que instituíam a autorização de residência para investidores — incluindo a via de aquisição de imóvel a partir de €500.000, que concentrava a maior parte dos pedidos.\n\n<strong>Regime transitório:</strong> pedidos apresentados <strong>antes de 3/abr/2025</strong> continuam a ser tramitados pela normativa vigente na data de apresentação. Vistos e autorizações <strong>já concedidos mantêm validade por todo o período para o qual foram emitidos</strong>, e os pedidos de <strong>renovação</strong> tramitam-se e resolvem-se pela normativa vigente na data da concessão inicial.\n\nTitulares que já não pretendam manter o investimento devem avaliar a migração para outra figura de residência — teletrabalho internacional, profissional altamente qualificado ou residência não lucrativa. <strong>Não há direito adquirido de conversão automática</strong> entre figuras.","kv":[{"l":"Status","v":"Extinto em 3/abr/2025"},{"l":"Base da revogação","v":"L.O. 1/2025 · D.F. 21.ª"},{"l":"Artigos revogados","v":"Arts. 63 a 67 da Ley 14/2013"},{"l":"Limiar imobiliário anterior","v":"€500.000"},{"l":"Autorizações vigentes","v":"Mantêm validade integral"},{"l":"Renovações","v":"Regras da concessão inicial"},{"l":"Pedidos anteriores a 3/abr/2025","v":"Tramitados pelo regime anterior"}],"requirements":["Não há novas admissões — o regime está revogado.","Para titulares atuais: a manutenção da autorização segue as condições da concessão inicial, incluindo a manutenção do investimento durante a vigência.","Para pedidos protocolados antes de 3/abr/2025: aplicam-se integralmente os requisitos da Ley 14/2013 na redação vigente na data de apresentação."],"sections":[{"title":"Vias de residência que permanecem abertas","body":"Com o encerramento do Golden Visa, as figuras de residência disponíveis a nacionais de terceiros Estados na Espanha passam a ser, entre outras:\n\n· <strong>Teletrabalho internacional</strong> (arts. 74 bis e seguintes da Ley 14/2013) — detalhada no cartão seguinte.\n· <strong>Profissional altamente qualificado</strong> e <strong>transferência intraempresarial</strong>, também na Sección de movilidad internacional da Ley 14/2013.\n· <strong>Empreendedor</strong> — projeto de interesse geral com relatório favorável da ENISA.\n· <strong>Residência não lucrativa</strong> — via do regime geral de estrangeria, que exige meios económicos suficientes e <strong>proíbe o exercício de atividade laboral ou profissional</strong> na Espanha.\n\n<em>Nota de verificação:</em> os limiares de meios económicos e a documentação da residência não lucrativa sob o Real Decreto 1155/2024 (vigente desde 20/05/2025) devem ser confirmados na sede eletrónica do Ministerio de Inclusión antes de qualquer candidatura."}],"brazilNote":"Brasileiros titulares de Golden Visa concedido antes de 3/abr/2025 mantêm a autorização e o direito de renovação pelas regras originais. O encerramento não altera a situação fiscal: residência legal e residência fiscal continuam a ser figuras distintas, e a permanência inferior a 183 dias por ano na Espanha não gera, por si só, residência fiscal espanhola.\n\nPara quem pretendia usar o Golden Visa como porta de entrada para a Lei Beckham, a via remanescente mais direta é a autorização de <strong>teletrabalho internacional</strong>, que é causa de deslocamento expressamente admitida pelo art. 93 LIRPF.","sources":[{"t":"Ministerio de Vivienda · Fim das Golden Visa (3/abr/2025)","u":"https://www.mivau.gob.es/el-ministerio/sala-de-prensa/noticias/mie-02042025-1739"},{"t":"KPMG · Legal Alert — eliminação do Golden Visa (L.O. 1/2025)","u":"https://assets.kpmg.com/content/dam/kpmgsites/es/pdf/2025/01/legal-alert-eliminacion-golden-visa.pdf.coredownload.inline.pdf"},{"t":"Laboral-Social · L.O. 1/2025 e o fim das golden visa","u":"https://www.laboral-social.com/ley-organica-2025-fin-golden-visa-espana"}]},{"name":"Teletrabalho Internacional — Visto de Nômade Digital","status":"new","legalBasis":"Ley 14/2013, de 27 de setembro, Sección de movilidad internacional, arts. 74 bis a 74 quinquies, introduzidos pela Ley 28/2022, de 21 de dezembro, disposición final undécima. Regulamento de estrangeria: Real Decreto 1155/2024, de 19 de novembro, vigente desde 20/05/2025. Instrução conjunta da DG de Españoles en el Exterior e da DG de Migraciones sobre teletrabalhadores de caráter internacional.","desc":"Autorização de residência para nacionais de terceiros Estados que exerçam atividade laboral ou profissional <strong>à distância, para empresas situadas fora do território espanhol</strong>, por meios exclusivamente informáticos e telemáticos.\n\n<strong>Duas vias de acesso:</strong> (i) <strong>visto consular</strong>, pedido no consulado espanhol da demarcação de residência no Brasil, com vigência máxima de 1 ano; (ii) <strong>autorização pela UGE-CE</strong>, para quem já esteja em situação regular na Espanha — inclusive em estada de turista dentro dos 90 dias —, com vigência de até 3 anos.\n\n<strong>Renda mínima exigida:</strong> 200% do Salário Mínimo Interprofissional, o que corresponde em 2026 a aproximadamente <strong>€2.849/mês</strong> (cerca de €34.188/ano), sobre um SMI de €1.221 em 14 pagas. Acrescem <strong>75% do SMI</strong> pelo primeiro familiar e <strong>25% do SMI</strong> por cada familiar adicional.\n\n<strong>É causa de deslocamento admitida pelo art. 93 LIRPF</strong> — o titular pode optar pela Lei Beckham, desde que apresente o Modelo 149 nos 6 meses seguintes à alta na Seguridad Social.","kv":[{"l":"Renda mínima (2026)","v":"≈€2.849/mês (200% do SMI)"},{"l":"1.º familiar","v":"+75% do SMI"},{"l":"Familiares adicionais","v":"+25% do SMI cada"},{"l":"Visto consular","v":"Até 1 ano"},{"l":"Autorização UGE-CE","v":"Até 3 anos, renovável por 3"},{"l":"Resolução UGE-CE","v":"Máx. 20 dias · silêncio positivo"},{"l":"Cliente espanhol (autônomo)","v":"Até 20% da atividade"},{"l":"Antiguidade do vínculo","v":"Mínimo 3 meses"},{"l":"Atividade da empresa estrangeira","v":"Mínimo 1 ano"},{"l":"Residência de longa duração","v":"Após 5 anos"},{"l":"Lei Beckham","v":"Causa de deslocamento admitida"}],"requirements":["Ser nacional de terceiro Estado e exercer atividade <strong>à distância para empresas situadas fora da Espanha</strong>, por meios exclusivamente informáticos e telemáticos.","Por conta alheia: só pode trabalhar para empresas fora da Espanha. Por conta própria: admite-se cliente espanhol desde que <strong>não exceda 20%</strong> da atividade profissional total.","A empresa ou o cliente estrangeiro deve ter <strong>atividade real e contínua há pelo menos 1 ano</strong>.","Relação laboral ou mercantil com <strong>antiguidade mínima de 3 meses</strong>, com autorização expressa do empregador para o teletrabalho a partir da Espanha.","Qualificação: graduação ou pós-graduação de universidade, formação profissional ou escola de negócios de reconhecido prestígio, <strong>ou</strong> experiência profissional mínima de <strong>3 anos</strong>.","Meios económicos de <strong>200% do SMI</strong> (≈€2.849/mês em 2026), acrescidos de 75% do SMI pelo primeiro familiar e 25% por cada familiar adicional.","<strong>Seguro de doença</strong>, público ou privado, contratado com entidade autorizada a operar na Espanha e ativo durante toda a vigência da autorização.","Certificado de antecedentes criminais dos países de residência dos <strong>últimos 2 anos</strong>, acompanhado de declaração de inexistência de antecedentes nos últimos 5 anos.","Não figurar como rejeitável no espaço Schengen.","Certificado de cobertura de seguridade social ao abrigo de acordo bilateral, ou alta no sistema espanhol."],"process":[{"step":"Via consular — pedido no Brasil","detail":"Pedido apresentado no <strong>Consulado da Espanha</strong> da demarcação de residência no Brasil. Documentos apostilados nos termos da Convenção da Haia e traduzidos por tradutor juramentado. O visto emitido habilita a residir e trabalhar, com vigência <strong>máxima de 1 ano</strong>.","timing":"Antes da mudança"},{"step":"Via UGE-CE — pagamento da tasa 038","detail":"Para quem já está em situação regular na Espanha: autoliquidação da <strong>tasa 038</strong> pelo modelo 790, na modalidade «Principal», hecho imponible n.º 7, «Autorización inicial».","timing":"Antes do pedido"},{"step":"Via UGE-CE — apresentação telemática","detail":"Pedido apresentado por via telemática à <strong>Unidad de Grandes Empresas y Colectivos Estratégicos</strong>. Prazo de resolução de <strong>20 dias no máximo</strong>; decorrido o prazo sem resolução, aplica-se o <strong>silêncio administrativo positivo</strong>.","timing":"Até 20 dias"},{"step":"Emissão da autorização","detail":"Autorização com vigência de <strong>até 3 anos</strong> (ou período menor, se solicitado), <strong>renovável por mais 3</strong>. Após 5 anos de residência, abre-se o acesso à residência de longa duração.","timing":"3 + 3 anos"},{"step":"TIE — Tarjeta de Identidad de Extranjero","detail":"Pedido no prazo de <strong>1 mês</strong> contado da entrada em território espanhol ou da notificação favorável. Formulário EX-17, taxa modelo 790-012, cita prévia e recolha de impressões digitais.","timing":"Até 1 mês"},{"step":"Reagrupamento familiar","detail":"Cônjuge ou parceiro, filhos menores e ascendentes a cargo podem solicitar <strong>conjuntamente</strong> com o titular — mesmo procedimento e mesmos prazos, com os meios económicos majorados na proporção indicada.","timing":"Conjunto ou posterior"},{"step":"Opção pela Lei Beckham","detail":"Sendo o teletrabalho internacional causa de deslocamento admitida pelo art. 93 LIRPF, o titular pode apresentar o <strong>Modelo 149</strong> nos <strong>6 meses</strong> seguintes à alta na Seguridad Social.","timing":"Até 6 meses"}],"costs":[{"item":"Tasa 038 (autorização inicial UGE-CE)","value":"A confirmar","note":"Fontes secundárias indicam ≈€70; o importe oficial de 2026 deve ser lido na sede eletrónica do Ministerio de Inclusión"},{"item":"TIE — modelo 790-012","value":"≈€16,08","note":"Valor de 2026"},{"item":"Taxa consular de visto nacional no Brasil","value":"A confirmar","note":"Cobrada em reais pelo consulado; consultar a tabela vigente em exteriores.gob.es"},{"item":"Seguro de doença privado","value":"Custo de mercado","note":"Obrigatório durante toda a vigência da autorização"},{"item":"Seguridad Social — RETA, se autônomo","value":"≈€217 a ≈€796/mês","note":"15 tramos por rendimento líquido real; base mínima de €1.000/mês para autônomo societário"}],"sections":[{"title":"Residência legal e residência fiscal","body":"A autorização de teletrabalho internacional confere <strong>residência legal</strong>. A <strong>residência fiscal</strong> é definida autonomamente pelo art. 9 da LIRPF: permanência superior a <strong>183 dias</strong> em território espanhol no ano civil, ou localização na Espanha do núcleo principal ou da base das atividades ou interesses económicos.\n\nPresume-se, salvo prova em contrário, que o contribuinte reside na Espanha quando aí residam habitualmente o cônjuge não separado e os filhos menores dependentes.\n\nO titular da autorização que permaneça menos de 183 dias e mantenha o centro de interesses fora da Espanha pode não adquirir residência fiscal espanhola — situação que, contudo, é incompatível com a opção pelo art. 93 LIRPF, que pressupõe a aquisição da residência fiscal."}],"brazilNote":"Para o brasileiro, o pedido consular é feito no consulado espanhol da sua demarcação, com documentos <strong>apostilados</strong> (Brasil e Espanha são partes da Convenção da Haia sobre apostila) e traduzidos por tradutor público juramentado.\n\n<strong>Seguridade social:</strong> o Acordo Brasil–Espanha (Decreto n.º 1.689/1995) permite obter <strong>Certificado de Deslocamento</strong>, mantendo a filiação ao INSS durante deslocamentos temporários e evitando a dupla contribuição, além de permitir a <strong>totalização</strong> de períodos para efeitos de aposentadoria.\n\n<strong>Saída fiscal:</strong> o titular que adquira residência fiscal espanhola deve formalizar no Brasil a <strong>CSDP</strong> e a <strong>DSDP</strong>. Sem elas, permanece residente fiscal brasileiro, com tributação de renda mundial no Brasil em paralelo à espanhola.\n\n<strong>Atenção ao art. 93:</strong> quem opta pela Lei Beckham vê o rendimento do trabalho pago por empresa estrangeira ser considerado obtido em território espanhol — o que, no desenho típico do nômade digital, significa que a remuneração paga por empregador de fora da Espanha é integralmente tributada a 24%/47%.","sources":[{"t":"UGE-CE · Teletrabajadores de carácter internacional","u":"https://www.inclusion.gob.es/en/web/unidadgrandesempresas/teletrabajadores"},{"t":"Sede Inclusión · Tasa 038","u":"https://sede.inclusion.gob.es/en/w/autorizaciones-de-trabajo-y-residencia-tasa-038"},{"t":"PRIE · Teletrabajadores de carácter internacional","u":"https://prie.comercio.gob.es/es-es/Paginas/Teletrabajadores-caracter-internacional.aspx"},{"t":"Instrucción conjunta · Teletrabajadores de carácter internacional (PDF)","u":"https://www.inclusion.gob.es/documents/410169/0/report_report_2301+Instrucci%C3%B3n+conjunta+Teletrabajadores+de+car%C3%A1cter+internacional_rev13_FIRMADAS.pdf"},{"t":"Exteriores · Requisitos do visto de teletrabalho internacional (PDF)","u":"https://www.exteriores.gob.es/Consulados/santiagodechile/es/ServiciosConsulares/Documents/Requisitos%20visado%20TEL.pdf"}]}]},"gr":{"id":"gr","flagCode":"gr","name":"Grécia","region":"Europa","alert":true,"sumFiscal":"Art. 5A €100k · Art. 5B 7% · Art. 5C 50%","sumFS":"changed","sumVisa":"Golden Visa €250k–€800k · Nômade digital","sumVS":"changed","fiscal":[{"name":"Art. 5A — Imposto fixo de €100.000 para HNWIs (regime «non-dom»)","status":"ok","legalBasis":"Art. 5A da Lei 4172/2013 (Código do Imposto sobre o Rendimento), introduzido pela Lei 4646/2019. Investimentos elegíveis e período de retenção: Decisão Ministerial n.º 46834/2023 (ΦΕΚ Β΄ 3393, de 19/mai/2023), que substituiu a Decisão Conjunta 147269 ΕΞ 2020; alterada pela Decisão Ministerial 30257 ΕΞ 2024 (ΦΕΚ Β΄ 1271, de 23/fev/2024). Alterado pela Lei 5313/2026 (ΦΕΚ de 25/jun/2026).","desc":"Quem transfere a residência fiscal para a Grécia e é admitido ao regime paga <strong>imposto fixo de €100.000 por ano</strong> sobre a <strong>totalidade do rendimento de fonte estrangeira</strong>, qualquer que seja o montante desse rendimento — é o chamado <em>esgotamento da obrigação tributária</em>.\n\nConsequências diretas:\n· <strong>não há obrigação de declarar</strong> o rendimento de fonte estrangeira na Grécia;\n· <strong>não há crédito</strong> na Grécia por imposto pago no exterior sobre esse rendimento, porque a obrigação já está esgotada;\n· o <strong>rendimento de fonte grega</strong> é tributado pelas regras ordinárias (escala progressiva, 5% sobre dividendos, 15% sobre juros);\n· o contribuinte fica <strong>isento de imposto sucessório e de doação sobre bens móveis situados no exterior</strong>.\n\n<strong>Duração máxima: 15 exercícios fiscais</strong>, não prorrogáveis.","kv":[{"l":"Imposto anual","v":"€100.000 fixos"},{"l":"Por familiar","v":"€20.000/ano"},{"l":"Base","v":"Todo rendimento de fonte estrangeira"},{"l":"Investimento exigido","v":"€500.000 em até 3 anos"},{"l":"Não residência prévia","v":"7 dos 8 anos anteriores"},{"l":"Duração","v":"15 exercícios fiscais"},{"l":"Decisão da AADE","v":"60 dias"},{"l":"Vencimento do imposto","v":"Último dia útil de dezembro"},{"l":"Acordo com país de origem","v":"Não exigido"},{"l":"Rendimento de fonte grega","v":"Regras ordinárias"}],"requirements":["<strong>Não ter sido residente fiscal grego em 7 dos 8 anos</strong> anteriores à transferência da residência fiscal para a Grécia.","Transferir <strong>efetivamente</strong> a residência fiscal para a Grécia, nos termos do art. 4 da Lei 4172/2013.","Comprovar ter investido, ou que investirá, <strong>pelo menos €500.000 na Grécia</strong>.","Concluir o investimento no prazo máximo de <strong>3 anos</strong> contados da data do pedido.","O investimento deve enquadrar-se nas <strong>categorias elegíveis</strong> da Decisão Ministerial 46834/2023 (imóveis, valores mobiliários, participações societárias, entre outras).","O investimento pode ser realizado <strong>pelo próprio requerente</strong>, por <strong>parente</strong> (cônjuge e parentes em linha ascendente ou descendente) ou por <strong>pessoa jurídica</strong> em que o requerente detenha a maioria das ações ou quotas.","Pagar integralmente o imposto fixo de €100.000 no prazo legal, em <strong>prestação única</strong>.","Apresentar <strong>declaração anual de manutenção do investimento</strong> até 31 de maio de cada ano.","<em>Dispensa do investimento:</em> há entendimento de que o requisito de €500.000 é dispensado a quem obteve autorização de residência por investimento (Golden Visa). <em>Verificar a redação vigente do art. 5A, §2, e o efeito da Lei 5275/2026 sobre a remissão legislativa.</em>"],"process":[{"step":"Obtenção do AFM (número fiscal grego)","detail":"Pedido na <strong>Δ.Ο.Υ. Κατοίκων Εξωτερικού</strong> (Repartição Fiscal para Residentes no Exterior) da AADE. Se aplicável, obter também o AMKA (número de seguridade social).","timing":"1–3 semanas"},{"step":"Estruturação e início do investimento","detail":"Estruturação do investimento de €500.000 em categoria elegível. O investimento não precisa estar concluído no pedido — basta o compromisso, com prazo de 3 anos para conclusão.","timing":"Variável"},{"step":"Pedido de adesão ao regime","detail":"Apresentado ao <strong>Departamento de Tributação Alternativa</strong> da Repartição Fiscal para Residentes no Exterior e Tributação Alternativa de Residentes Fiscais Nacionais, em Atenas.\n<strong>O prazo legal de 31 de março foi abolido pela Lei 5313/2026</strong> — a data passa a ser fixada por decisão do Governador da AADE. <em>Verificar a decisão vigente no momento do pedido.</em>","timing":"Calendário da AADE"},{"step":"Decisão de deferimento","detail":"Análise e decisão pela AADE no prazo de <strong>60 dias</strong> contados da apresentação.","timing":"60 dias"},{"step":"Pagamento do imposto fixo","detail":"Pagamento dos €100.000 em <strong>parcela única</strong>. A Lei 5313/2026 moveu o vencimento do último dia útil de julho para o <strong>último dia útil de dezembro</strong>.","timing":"Dezembro"},{"step":"Conclusão do investimento","detail":"Conclusão e comprovação do investimento de €500.000 à AADE, dentro de <strong>3 anos</strong> contados do pedido.","timing":"Até 3 anos"},{"step":"Declaração anual de manutenção","detail":"Apresentação da <em>application-declaration for the continuous retention of the completed investment</em>, com os documentos do art. 5 da Decisão Ministerial 46834/2023, até <strong>31 de maio</strong> de cada ano — e a qualquer momento, se solicitado pela administração.","timing":"31 de maio, anual"}],"costs":[{"item":"Imposto fixo — requerente principal","value":"€100.000/ano","note":"Prestação única; não há pro-rata identificado no ano de entrada"},{"item":"Imposto fixo — por familiar admitido","value":"€20.000/ano","note":"Sem escalonamento por número de familiares"},{"item":"Investimento mínimo obrigatório","value":"€500.000","note":"Ativo do próprio investidor, não é taxa"},{"item":"Taxa administrativa de análise","value":"Não identificada","note":"Nenhuma taxa governamental específica localizada; verificar em aade.gr"}],"sections":[{"title":"Regras de família","body":"Podem ser incluídos os <strong>familiares</strong> na acepção do art. 2 da Lei 4172/2013 — cônjuge ou parceiro em união civil registada e dependentes.\n\n<strong>Custo:</strong> €20.000/ano por familiar, contra €100.000 do requerente principal.\n\n<strong>Momento da inclusão:</strong> originalmente só era possível no pedido inicial; alteração legislativa recente permite que os familiares adiram <strong>a qualquer momento durante os 15 anos</strong>.\n\n<strong>Efeito:</strong> os familiares admitidos ficam igualmente com a obrigação esgotada quanto ao rendimento de fonte estrangeira e fora do imposto sucessório e de doação grego sobre bens móveis no exterior.\n\n<strong>Investimento:</strong> um único investimento de €500.000 cobre todo o núcleo familiar — não há exigência de aporte adicional por familiar."},{"title":"Como se sai do regime","body":"<strong>Renúncia voluntária</strong> — pedido de revogação em qualquer exercício dos 15 anos; o contribuinte passa a ser tributado pelas regras gerais, sobre o rendimento mundial, a partir daquele exercício.\n\n<strong>Não pagamento integral do imposto fixo</strong> — o regime especial é abolido e o contribuinte é tributado sobre o rendimento mundial.\n\n<strong>Não conclusão do investimento</strong> nos 3 anos — revogação.\n\n<strong>Interrupção do investimento por mais de 6 meses contínuos</strong> após a conclusão — revogação.\n\n<strong>Termo dos 15 anos</strong> — passagem automática à tributação ordinária sobre o rendimento mundial.\n\n<em>Nota de verificação:</em> a existência de vedação legal expressa ao reingresso após a perda do regime deve ser confirmada no texto do art. 5A."},{"title":"Isenção sucessória sobre bens móveis no exterior","body":"O admitido ao art. 5A fica <strong>isento de imposto sucessório e de doação grego sobre bens móveis situados no exterior</strong>, recebidos por morte ou por doação.\n\nSegundo alteração recente, a isenção estende-se também aos <strong>bens transferidos pelo próprio investidor a terceiros</strong> e alcança <strong>donatários e herdeiros</strong> do não-domiciliado.\n\n<strong>Ressalva:</strong> <em>imóveis situados na Grécia continuam integralmente sujeitos</em> ao imposto sucessório grego — a isenção alcança apenas bens móveis no exterior.\n\n<em>Nota de verificação:</em> a extensão exata da isenção a donatários e herdeiros deve ser confirmada no parágrafo específico do art. 5A na redação vigente."}],"brazilNote":"<strong>Não existe Convenção para evitar a dupla tributação entre Brasil e Grécia.</strong> A Grécia não consta da lista de acordos da Receita Federal (38 acordos abrangentes em vigor em agosto de 2026), e o Brasil não figura entre os mais de 55 parceiros de CDT da Grécia.\n\n<strong>Consequência mais grave:</strong> não há <em>tie-breaker</em> convencional para resolver dupla residência fiscal. Se as leis internas dos dois países considerarem a pessoa residente simultaneamente, não existe regra de desempate (habitação permanente → centro de interesses vitais → estada habitual → nacionalidade → acordo amigável). Também não há limitação convencional de alíquotas na fonte, cláusula de pensões, procedimento amigável nem cláusula de não discriminação.\n\n<strong>Ponto favorável ao art. 5A:</strong> este é o <strong>único dos três regimes gregos que não exige acordo de cooperação administrativa</strong> com o país de origem — os arts. 5B e 5C exigem. Para quem vem do Brasil, o art. 5A não apresenta o obstáculo estrutural que afeta os outros dois.\n\n<strong>Crédito de imposto no Brasil:</strong> o art. 26 da Lei 9.249/1995 admite crédito por imposto pago no exterior mediante <strong>reciprocidade de tratamento</strong>, mesmo sem CDT. <em>Nota de verificação — item de prioridade máxima: é necessário confirmar se existe ato declaratório ou parecer da RFB reconhecendo reciprocidade com a Grécia. Sem CDT e sem reciprocidade reconhecida, o imposto grego não é creditável no Brasil.</em>\n\n<strong>Saída fiscal do Brasil</strong> (IN SRF 208/2002): <strong>CSDP</strong> — Comunicação de Saída Definitiva do País, da data da saída até o último dia de fevereiro do ano-calendário seguinte, pelo portal csdp.receita.fazenda.gov.br ou e-CAC; e <strong>DSDP</strong> — Declaração de Saída Definitiva, no prazo geral da declaração de ajuste. Sem esses atos, o contribuinte continua residente fiscal no Brasil, com tributação de renda mundial — o cenário mais oneroso possível na ausência de tie-breaker convencional.\n\n<strong>CRS:</strong> Brasil e Grécia são partes da Convenção Multilateral sobre Assistência Mútua Administrativa em Matéria Fiscal e do MCAA/CRS; a Grécia está ainda vinculada pela DAC2 (Diretiva 2014/107/UE). Contas no exterior de residente fiscal grego <strong>continuam a ser reportadas à AADE</strong> mesmo sob o art. 5A — a dispensa de declarar é legal, não é opacidade.\n\n<strong>Acordo de Previdência Social Brasil–Grécia: existe</strong> e está em vigor, confirmado inclusive por formulário oficial do e-EFKA grego (GR-B3). Permite <strong>totalização de tempos de contribuição</strong>. Gestão pelo INSS (APSAI Brasília) e pelo e-EFKA. <em>Nota de verificação: o número do Decreto de promulgação e a data de vigência não puderam ser confirmados.</em> <strong>Atenção:</strong> é instrumento previdenciário, não tributário — <strong>não resolve</strong> a dupla tributação da renda, e não serve para satisfazer o requisito de «cooperação administrativa em matéria fiscal» dos arts. 5B e 5C.\n\n<strong>Pensão do INSS — mudança relevante:</strong> o <strong>STF, no ARE 1.327.491 (Tema 1.174)</strong>, julgado em outubro de 2024, declarou <strong>inconstitucional</strong> a alíquota fixa de 25% de IRRF sobre aposentadoria e pensão pagas a residente no exterior (art. 7.º da Lei 9.779/1999, com a redação da Lei 13.315/2016). Aplica-se a <strong>tabela progressiva</strong>, com isenções e deduções, e cabe <strong>restituição do indevido dos últimos 5 anos</strong>.\n\n<strong>ITCMD sobre bens no exterior:</strong> o STF, no Tema 825 (RE 851.108, 2021), declarou inconstitucional a cobrança pelos Estados sem lei complementar federal. A EC 132/2023 atribuiu competência aos Estados, mas o STF e os tribunais estaduais têm mantido a necessidade da lei complementar (referência recente: RE 1.553.620/SP; ADI 6.830/SP). O <strong>PLP 108/2024</strong>, aprovado pelo Senado em 30/set/2025, é o fator de risco a monitorar.","warning":"A ausência de CDT Brasil–Grécia é o risco estrutural mais relevante deste dossiê: sem <em>tie-breaker</em> convencional, uma situação de dupla residência fiscal não tem solução negociada — resolve-se apenas por litígio administrativo em cada país.\n\nO crédito, no Brasil, do imposto grego depende de <strong>reconhecimento de reciprocidade de tratamento pela Receita Federal</strong>, que não foi possível confirmar. Sem esse reconhecimento, os €100.000 pagos na Grécia não são creditáveis no Brasil.\n\nQuatro leis gregas entre julho de 2025 e junho de 2026 alteraram materialmente o quadro (Leis 5222/2025, 5246/2025, 5275/2026 e 5313/2026). Material de consultoria produzido antes de julho de 2026 está desatualizado — o «prazo de 31 de março», em particular, deixou de ser a regra legal.","sources":[{"t":"AADE · Tax Incentives (arts. 5A, 5B, 5C do CIR) — PDF","u":"https://www.aade.gr/sites/default/files/2024-01/Tax%20Incentives%20(articles%205A,5B,%205C%20of%20the%20ITC).pdf"},{"t":"AADE · Alternative Taxation (5A, 5B, 5C)","u":"https://www.aade.gr/en/greeks-abroad-non-residents/income-taxation/alternative-taxation-5a-5b-5c"},{"t":"AADE · Guia fiscal para gregos no exterior e não residentes (PDF, 9/jul/2025)","u":"https://www.aade.gr/sites/default/files/2025-07/Useful%20Tax%20Guide%20for%20Greeks%20abroad%20and%20Non-residents_enriched_9.7.2025.pdf"},{"t":"AADE · Residência fiscal de pessoas físicas (CIR)","u":"https://www.aade.gr/en/greeks-abroad-non-residents/income-taxation/tax-residence-natural-persons-itc"},{"t":"International Bar Association · Procedimento e documentação para o regime non-dom grego","u":"https://www.ibanet.org/Procedure-and-supporting-documentation-for-application-to-the-Greek-non-dom-taxation-regime"},{"t":"Grant Thornton Greece · Lei 5313/2026 — mudanças em imposto imobiliário e investimentos","u":"https://www.grant-thornton.gr/en/insights/article/new-law-5313-2026-tax-real-estate/"},{"t":"Receita Federal · Acordos para evitar a dupla tributação","u":"https://www.gov.br/receitafederal/pt-br/acesso-a-informacao/legislacao/acordos-internacionais/acordos-para-evitar-a-dupla-tributacao/acordos-para-evitar-a-dupla-tributacao-e-prevenir-a-evasao-fiscal"},{"t":"STF · Tema 1.174 (ARE 1.327.491) — IR de 25% sobre aposentadoria no exterior","u":"https://portal.stf.jus.br/jurisprudenciaRepercussao/verAndamentoProcesso.asp?incidente=6179161&numeroProcesso=1327491&classeProcesso=ARE&numeroTema=1174"}]},{"name":"Art. 5B — Regime dos aposentados estrangeiros (7%)","status":"risk","legalBasis":"Art. 5B da Lei 4172/2013, introduzido por lei de julho de 2020 (a referência usualmente citada é a Lei 4714/2020, não confirmada). Procedimento e documentação: decisão do Governador da AADE. Alterado pela Lei 5313/2026 (ΦΕΚ de 25/jun/2026), que aboliu o prazo de 31 de março e moveu o pagamento para dezembro.","desc":"A pessoa física beneficiária de <strong>rendimento de pensão de fonte estrangeira</strong> que transfere a residência fiscal para a Grécia é tributada à <strong>alíquota fixa de 7%</strong> sobre a <strong>totalidade do rendimento de fonte estrangeira</strong> — não apenas sobre a pensão.\n\nA alíquota de 7% abrange também dividendos, juros, rendimentos prediais de imóveis no exterior, mais-valias de fonte estrangeira e montantes de resgate de planos de pensão estrangeiros.\n\nDiferentemente do art. 5A (valor absoluto fixo), aqui há uma <strong>alíquota proporcional</strong> — o imposto cresce com o rendimento. O rendimento de fonte grega é tributado pelas regras ordinárias.\n\n<strong>Duração: 15 exercícios fiscais.</strong>\n\n<strong>Requisito que condiciona o acesso do brasileiro:</strong> o regime exige transferência de residência fiscal a partir de Estado com o qual esteja em vigor um <strong>acordo de cooperação administrativa em matéria fiscal</strong> com a Grécia — ver a nota de interação com o Brasil.","kv":[{"l":"Alíquota","v":"7% flat"},{"l":"Base","v":"Todo rendimento de fonte estrangeira"},{"l":"Duração","v":"15 exercícios fiscais"},{"l":"Investimento exigido","v":"Nenhum"},{"l":"Valor mínimo de pensão","v":"Nenhum limiar identificado"},{"l":"Não residência prévia","v":"5 dos 6 anos anteriores"},{"l":"Acordo com país de origem","v":"Exigido — ponto crítico"},{"l":"Declaração anual","v":"Obrigatória (Ε1)"},{"l":"Decisão da AADE","v":"60 dias"},{"l":"Vencimento","v":"Último dia útil de dezembro"}],"requirements":["Ser <strong>beneficiário de rendimento de pensão pago no exterior</strong> — por instituição de segurança social estrangeira, autoridade governamental, fundo de pensões profissional ou seguro equivalente.","<strong>Não ter sido residente fiscal grego em 5 dos 6 anos</strong> anteriores à transferência da residência fiscal.","Transferir a residência fiscal <strong>a partir de um Estado com o qual esteja em vigor um acordo de cooperação administrativa em matéria fiscal com a Grécia</strong> — CDT ou outro instrumento de troca de informações.","Transferir <strong>efetivamente</strong> a residência fiscal para a Grécia.","Pagar o imposto de 7% em <strong>prestação única</strong> no prazo legal."],"process":[{"step":"Obtenção do AFM","detail":"Pedido de número fiscal grego na Δ.Ο.Υ. Κατοίκων Εξωτερικού (AADE), e do AMKA se aplicável.","timing":"1–3 semanas"},{"step":"Reunião da prova documental","detail":"Certificado de residência fiscal do Estado de origem, comprovativo da pensão estrangeira e prova de não-residência fiscal grega em 5 dos 6 anos anteriores.\nDocumentos brasileiros exigem <strong>apostila da Haia</strong> (Brasil e Grécia são partes da Convenção) e tradução oficial para o grego.","timing":"Variável"},{"step":"Pedido de adesão","detail":"Apresentado ao Departamento de Tributação Alternativa da Δ.Ο.Υ. Κατοίκων Εξωτερικού και Εναλλακτικής Φορολόγησης Φορολογικών Κατοίκων Ημεδαπής (AADE). <strong>Prazo de 31 de março abolido pela Lei 5313/2026</strong>; calendário atual fixado por decisão do Governador da AADE.","timing":"Calendário da AADE"},{"step":"Decisão","detail":"Análise e decisão de deferimento ou indeferimento pela AADE.","timing":"60 dias"},{"step":"Declaração anual de rendimento","detail":"Diferentemente do art. 5A, o regime do 5B <strong>exige declaração anual</strong> (formulário Ε1) do rendimento de fonte estrangeira.","timing":"Anual"},{"step":"Pagamento","detail":"Pagamento dos 7% em prestação única, até o <strong>último dia útil de dezembro</strong> (a Lei 5313/2026 moveu o vencimento, que antes era em julho).","timing":"Dezembro"}],"costs":[{"item":"Imposto sobre rendimento de fonte estrangeira","value":"7% flat","note":"Sobre a totalidade, não apenas sobre a pensão"},{"item":"Investimento mínimo","value":"Nenhum"},{"item":"Valor mínimo de pensão","value":"Nenhum limiar legal identificado"},{"item":"Taxa governamental de análise","value":"Não identificada"},{"item":"Contribuição de saúde (EFKA/PEKA) sobre pensão estrangeira","value":"A confirmar","note":"Ponto materialmente relevante que não pôde ser verificado"}],"sections":[{"title":"Regras de família","body":"O art. 5B <strong>não prevê mecanismo de extensão a familiares com preço fixo</strong>, ao contrário dos €20.000 do art. 5A.\n\nCada cônjuge que seja, ele próprio, beneficiário de pensão estrangeira e cumpra os requisitos deve apresentar <strong>pedido autónomo</strong>.\n\nUm cônjuge sem pensão estrangeira própria <strong>não é abrangido</strong> pelos 7% do outro e é tributado pelas regras gerais sobre o seu rendimento.\n\n<em>Nota de verificação: a redação do art. 5B quanto a familiares deve ser confirmada.</em>"},{"title":"Como se sai do regime","body":"<strong>Renúncia voluntária</strong> — passagem à tributação ordinária sobre o rendimento mundial.\n\n<strong>Não pagamento integral</strong> do imposto no prazo — perda do regime.\n\n<strong>Deixar de ser residente fiscal grego</strong> — cessação.\n\n<strong>Termo dos 15 anos</strong> — para um aposentado, a pensão estrangeira passaria a ser tributada pela escala ordinária de 9% a 44%."}],"brazilNote":"<strong>Este é o ponto de maior incerteza de todo o dossiê grego para o público brasileiro.</strong>\n\nA leitura corrente de que «a ausência de CDT Brasil–Grécia inviabiliza o art. 5B» <str
