/strong> — mais de <strong>183 dias</strong> no território uruguaio durante o ano civil. Computam-se as ausências esporádicas, desde que não superem <strong>30 dias corridos</strong> consecutivos.\n\n<strong>B. Núcleo principal ou base das atividades</strong> — radicar no território o núcleo principal ou a base de suas atividades.\n\n<strong>C. Base de interesses econômicos</strong> — radicar no território a base de seus interesses econômicos.\n\n<strong>D. Base de interesses vitais</strong> — presunção <em>iuris tantum</em>: presume-se, salvo prova em contrário, quando cônjuge e filhos menores dependentes residem habitualmente no país. A DGI avalia o conjunto de indícios «em conjunto e com critério de razoabilidade».\n\n<strong>E. Investimento imobiliário — Decreto 163/020:</strong> imóveis de valor superior a <strong>UI 3.500.000</strong>, adquiridos a partir de 1/jul/2020, com <strong>presença efetiva mínima de 60 dias</strong> no ano civil.\n\n<strong>F. Investimento empresarial — Decreto 163/020:</strong> valor superior a <strong>UI 15.000.000</strong> com geração de, no mínimo, <strong>15 novos postos de trabalho</strong> em regime integral durante o ano civil. Dispensa a declaração de interesse nacional.\n\n<strong>G. Investimento imobiliário — Decreto 148/007</strong> (regime original, mantido): imóveis de valor superior a <strong>UI 15.000.000</strong>.\n\n<strong>H. Investimento empresarial — Decreto 148/007:</strong> participação direta ou indireta em empresa de valor superior a <strong>UI 45.000.000</strong>, compreendendo atividades ou projetos declarados de <strong>interesse nacional</strong> (Lei 16.906).\n\n<em>Sobre o limiar de «UI 2.000.000 com 60 dias» que circula em materiais de consultoria: não foi localizado em nenhuma fonte. O valor do Decreto 163/020 é UI 3.500.000. Recomenda-se descartar a referência a UI 2.000.000 salvo confirmação documental — é possível que se trate de confusão com a cifra de USD 2.000.000, equivalente aproximado de UI 12.500.000 no regime de 2026.</em>"},{"title":"Conversão da Unidade Indexada (UI)","body":"Os limiares uruguaios são fixados em <strong>Unidades Indexadas</strong>, e a conversão em dólares varia com o câmbio e com a indexação.\n\n<strong>Valor implícito derivado das fontes profissionais de 2026:</strong> as firmas convertem UI 12.500.000 ≈ USD 2.000.000–2.066.000, o que implica <strong>1 UI ≈ USD 0,160 a 0,165</strong>.\n\n· Imóvel — Decreto 163/020: <strong>UI 3.500.000</strong> ≈ USD 560.000–590.000\n· Empresa + 15 empregos — Decreto 163/020: <strong>UI 15.000.000</strong> ≈ USD 2.400.000–2.475.000\n· Imóvel — Decreto 148/007: <strong>UI 15.000.000</strong> ≈ USD 2.400.000–2.475.000\n· Empresa + interesse nacional — Decreto 148/007: <strong>UI 45.000.000</strong> ≈ USD 7.200.000–7.425.000\n· <strong>Imóvel — tax holiday 2026: UI 12.500.000</strong> ≈ USD 2.000.000–2.066.000\n· <strong>Fundos de inovação — tax holiday 2026: UI 625.000/ano</strong> ≈ USD 100.000–103.000/ano\n· Regime simplificado — quota fixa: UI 1.875.000 ≈ USD 300.000\n· Regime simplificado — quota reduzida: UI 1.250.000 ≈ USD 200.000\n\n<strong>Nota histórica relevante para planejamento:</strong> a mesma UI 3.500.000 equivalia a cerca de USD 380.000–400.000 em 2020 e a cerca de USD 590.000 em 2026. A UI <strong>valoriza-se contra o dólar</strong> em cenários de apreciação do peso uruguaio, o que <strong>eleva o custo real de entrada em dólares ao longo do tempo</strong>.\n\n<em>A cotação oficial da UI deve ser consultada no BCU (bcu.gub.uy) e no INE (ine.gub.uy) na data da operação — o INE publica informe mensal.</em>"},{"title":"IRPF Categoria II — escala do trabalho, exercício 2026","body":"<strong>Base de Prestaciones y Contribuciones (BPC) 2026: $ 6.864</strong> (pesos uruguaios) — fonte: BPS, Comunicado R 5/2026.\n\nEscala <strong>progressiva por faixas</strong> (cada faixa tributa apenas o excedente):\n· até 7 BPC ($ 48.048/mês) → <strong>0%</strong>\n· mais de 7 a 10 BPC ($ 48.049 – $ 68.640) → <strong>10%</strong>\n· mais de 10 a 15 BPC ($ 68.641 – $ 102.960) → <strong>15%</strong>\n· mais de 15 a 30 BPC ($ 102.961 – $ 205.920) → <strong>24%</strong>\n· mais de 30 a 50 BPC ($ 205.921 – $ 343.200) → <strong>25%</strong>\n· mais de 50 a 75 BPC ($ 343.201 – $ 514.800) → <strong>27%</strong>\n· mais de 75 a 115 BPC ($ 514.801 – $ 789.360) → <strong>31%</strong>\n· mais de 115 BPC (a partir de $ 789.361) → <strong>36%</strong>\n\n<strong>Mínimo Não Imponível Geral (MNIG): $ 48.048/mês.</strong>\n\nHá regime paralelo de <strong>deduções</strong> com crédito próprio (filhos, aluguel, previdência, saúde) — a mecânica uruguaia calcula imposto e deduções separadamente."},{"title":"Imposto ao Patrimônio e sucessões","body":"<strong>Impuesto al Patrimonio — pessoas físicas, 2026:</strong>\n· mínimo não imponível — pessoa física ou sucessão indivisa: <strong>$ 6.653.000</strong>\n· mínimo não imponível — núcleo familiar: <strong>$ 13.306.000</strong> (o dobro)\n· alíquotas para residentes: <strong>0,2% a 0,7%</strong>, progressivas\n· alíquotas para não residentes que não pagam IRNR: <strong>0,5% a 1,5%</strong>, progressivas\n\n<strong>Regra estruturante:</strong> o Imposto ao Patrimônio uruguaio é <strong>territorial</strong> — em regra, <strong>ativos situados no exterior não integram a base de cálculo</strong>. Entram na base: imóveis no Uruguai, veículos, depósitos e créditos no Uruguai, e participações em sociedades uruguaias.\n\n<strong>Atenção técnica:</strong> ativos isentos e não computáveis <strong>reduzem o passivo dedutível</strong> do contribuinte — quem tem muitos ativos isentos deduz menos dívidas, efeito contraintuitivo que aumenta a base tributável.\n\n<strong>Sucessões — não há imposto sucessório.</strong> O imposto sucessório geral foi <strong>revogado em 1974</strong>.\n\n<strong>O que incide na sucessão: o ITP — Impuesto a las Transmisiones Patrimoniales</strong> (Lei 16.107/1990; Título 19 do Texto Ordenado). Fato gerador: transmissão de <strong>bens imóveis situados no Uruguai</strong> por causa de morte. Alíquotas de <strong>3% ou 4%</strong> sobre o <strong>valor real</strong> do imóvel, conforme o grau de parentesco — <em>a distribuição usual é 3% para sucessores em linha reta e 4% para os demais; confirmar no Título 19</em>.\n\n<strong>O que NÃO paga ITP na sucessão:</strong> contas bancárias, veículos, ações, quotas sociais, créditos e demais bens móveis.\n\n<strong>Consequência para planejamento:</strong> o Uruguai não tributa a sucessão de patrimônio financeiro. O único ponto de atrito sucessório é o imóvel local, a 3%–4%. Isso <strong>não afasta</strong> o ITCMD brasileiro sobre bens situados no Brasil."},{"title":"Zonas Francas e o efeito de holding","body":"<strong>Zonas Francas</strong> — Lei 15.921, de 17/dez/1987, reformada substancialmente pela <strong>Lei 19.566, de 8/dez/2017</strong>.\n\n<strong>Benefício central:</strong> os usuários de zona franca são <strong>isentos de todo tributo nacional, criado ou a criar</strong>, inclusive dos que exigem exoneração específica por lei, relativamente às atividades desenvolvidas na zona. Abrange IRAE, imposto sobre distribuição de dividendos e Imposto ao Patrimônio, e <strong>não há retenções sobre pagamentos ao exterior</strong> (serviços, royalties).\n\n<strong>Contrapartidas:</strong>\n· <strong>mínimo de 75% do pessoal</strong> deve ser constituído por cidadãos uruguaios, naturais ou legais — percentual reduzível em casos excepcionais, com autorização prévia do Poder Executivo;\n· <strong>substância econômica efetiva</strong> — exigência introduzida pela Lei 19.566 por recomendação da OCDE: as empresas beneficiárias devem desenvolver atividades substantivas na zona;\n· contrato de usuário aprovado pela Área Zonas Francas do Ministerio de Economía y Finanzas.\n\nZonas de serviços relevantes: Aguada Park, WTC Free Zone, Zonamerica.\n\n<strong>Regime de holding:</strong> o Uruguai <strong>não possui regime de holding nominado</strong> análogo ao holandês ou luxemburguês. O efeito de holding decorre da <strong>territorialidade</strong>: uma sociedade uruguaia (S.A. ou SAS) que detenha participações no exterior não é tributada por IRAE sobre dividendos e ganhos de capital de fonte estrangeira — <strong>salvo</strong> as regras de rendas passivas do exterior para <strong>entidades sem substância adequada</strong> integrantes de grupos multinacionais (Leis 19.484 e 20.095).\n\n<strong>A SAFI</strong> (Sociedad Anónima Financiera de Inversión), veículo histórico de holding uruguaio, foi <strong>extinta pela reforma tributária de 2007</strong>, com regime transitório encerrado em 31/dez/2010. <strong>Não existe mais</strong> — o que é relevante para a leitura da IN RFB 1.037/2010 brasileira.\n\n<strong>Novidade 2026:</strong> a Lei 20.446 introduziu o <strong>IMCD — Impuesto Mínimo Complementario Doméstico</strong>, tributo mínimo alinhado ao Pilar Dois da OCDE (QDMTT). <em>Alíquota (presumivelmente 15%), limiar de receita do grupo (presumivelmente €750 milhões) e vigência a confirmar.</em> Relevante apenas para grupos multinacionais de grande porte."}],"brazilNote":"<strong>Acordo para Eliminar a Dupla Tributação Brasil–Uruguai: está em vigor.</strong>\n· Assinatura: <strong>7 de junho de 2019</strong>, em Brasília\n· Aprovação pelo Uruguai: dezembro de 2021\n· Aprovação legislativa concluída no Brasil: junho de 2023\n· Entrada em vigor (lado uruguaio): <strong>21 de julho de 2023</strong>\n· Promulgação no Brasil: <strong>Decreto n.º 11.747, de 23 de outubro de 2023</strong>\n· <strong>Produção de efeitos no Brasil: 1.º de janeiro de 2024</strong>\n\n<strong>Tributos abrangidos:</strong> no Brasil, IRPJ, IRPF e <strong>CSLL</strong>; no Uruguai, <strong>IRAE, IRPF, IRNR, IASS e o Impuesto al Patrimonio</strong>. A inclusão do Imposto ao Patrimônio é significativa — o acordo é sobre renda <strong>e capital</strong>.\n\n<strong>Alíquotas máximas na fonte (confirmadas):</strong>\n· <strong>Royalties</strong> — regra geral: <strong>10%</strong>\n· <strong>Royalties</strong> por uso de <strong>marcas de indústria ou comércio</strong>: <strong>15%</strong>\n· <strong>Serviços técnicos e de assistência técnica</strong> (artigo próprio, art. 13): <strong>10%</strong>\n· <strong>Dividendos e juros:</strong> <em>a confirmar nos arts. 10 e 11 do Decreto 11.747/2023 — indicações preliminares apontam 10%/15% para dividendos e 15% para juros.</em>\n\n<strong>Ponto de atenção brasileiro:</strong> a existência de <strong>artigo específico para serviços técnicos</strong> resolve a controvérsia histórica sobre a qualificação de serviços técnicos como royalties ou lucros de empresas (ADI RFB 5/2014). Aqui há regra expressa: 10% na fonte.\n\n<strong>Risco não testado:</strong> quem opta pelo <em>tax holiday</em> paga <strong>IRNR</strong> (não IRPF) sobre rendas do exterior. Como o IRNR <strong>está listado</strong> entre os tributos abrangidos pelo acordo, e o Uruguai emite certificado de residência fiscal, a aplicação do tratado deveria seguir normalmente — <strong>mas a possibilidade de o Brasil questionar a condição de «residente» para fins do art. 4.º de alguém sujeito a tributação apenas territorial e beneficiado por tax holiday é um risco real e não testado.</strong>\n\n<strong>Lista brasileira de jurisdições de tributação favorecida.</strong> O <strong>Uruguai NÃO consta</strong> do art. 1.º da IN RFB 1.037/2010 («paraísos fiscais»). O art. 2.º (regimes fiscais privilegiados) listava o regime das <strong>Safis</strong>, <strong>até 31/dez/2010</strong> — menção histórica e sem efeito prático desde 2011, já que a SAFI foi extinta.\n<em>Ponto de risco material a verificar:</em> não foi possível confirmar se o <strong>regime de zonas francas uruguaias</strong> foi incluído no art. 2.º da IN 1.037/2010 como regime fiscal privilegiado. Dado que o regime concede isenção total de tributos nacionais, e que há material profissional brasileiro específico sobre o tema, <strong>a redação vigente da IN 1.037/2010 deve ser conferida no site da RFB antes de qualquer estruturação via zona franca</strong>. A caracterização como regime fiscal privilegiado atrai preços de transferência, subcapitalização, IRRF majorado a 25% em certos pagamentos e restrições à dedutibilidade.\n\n<strong>Saída fiscal do Brasil</strong> (IN SRF 208/2002): <strong>CSDP</strong> até o último dia de fevereiro do ano-calendário subsequente à saída, e <strong>DSDP</strong> até o último dia útil de abril. Sem elas, a pessoa continua residente fiscal no Brasil, tributada em bases universais, com dupla residência — que o CDT resolveria pelos <em>tie-breakers</em> do art. 4.º, mas ao custo de litígio.\n<strong>Descompasso de calendários:</strong> o Uruguai adota o <strong>ano civil</strong> para os 183 dias; o Brasil conta 12 meses móveis na ausência de CSDP. <strong>É possível ficar sem residência fiscal em nenhum dos dois países, ou em ambos.</strong>\n\n<strong>Previdência social:</strong> o <strong>Acordo Multilateral de Seguridade Social do MERCOSUL</strong> permite totalização de períodos de contribuição entre Brasil, Argentina, Paraguai e Uruguai. <em>O decreto de promulgação no Brasil e a existência de acordo bilateral anterior devem ser confirmados.</em> O tratamento fiscal da aposentadoria do INSS recebida no Uruguai depende do artigo de Pensões do CDT — <em>verificar nos arts. 17/18 do Decreto 11.747/2023</em>. Nota: o Uruguai tributa aposentadorias locais pelo <strong>IASS</strong>, tributo distinto do IRPF e <strong>incluído no escopo do CDT</strong>.\n\n<strong>CRS:</strong> Brasil e Uruguai são signatários do Common Reporting Standard e da Convenção Multilateral. O Uruguai levantou o sigilo bancário para fins fiscais e reporta contas de residentes fiscais brasileiros à RFB. <strong>Ponto essencial de planejamento:</strong> ao obter residência fiscal uruguaia e informar o TIN uruguaio às instituições financeiras, o cliente <strong>redireciona o reporte CRS</strong> — mas apenas a partir da atualização da <em>self-certification</em>. Contas mantidas com TIN brasileiro continuam sendo reportadas ao Brasil. O art. 26 do CDT reforça a troca de informações a pedido.\n\n<strong>ITCMD:</strong> a EC 132/2023 tornou a progressividade obrigatória e disciplinou a competência para bens no exterior; o STF, no Tema 825 (RE 851.108), decidiu que os Estados não podem cobrar sem lei complementar federal. A combinação de <strong>ausência de imposto sucessório uruguaio</strong>, <strong>ITP de 3%–4% apenas sobre imóveis uruguaios</strong> e as regras de ITCMD brasileiro sobre bens no Brasil é o eixo do planejamento sucessório — que deve ser conduzido com assessoria e monitorando a tramitação da lei complementar.","warning":"<strong>O regime descrito na maior parte do material de consultoria em circulação é o regime revogado.</strong> A premissa corrente — tax holiday de 11 anos incondicional, opção de 7% vitalícia, territorialidade com exceção restrita a juros e dividendos, entrada por imóvel de cerca de UI 3.500.000 mais 60 dias — descreve com precisão o direito uruguaio <strong>até 31 de dezembro de 2025</strong>.\n\nA Lei 20.446/2025, com efeitos desde 1/jan/2026, e sua regulamentação (Decreto 95/026 e Resolução DGI 1.517/026) reconfiguraram os quatro pilares.\n\n<strong>Dois pontos permanecem materialmente indefinidos</strong> e não podem ser resolvidos sem leitura do texto legal primário:\n1. se os limiares de <strong>UI 12.500.000 / UI 625.000</strong> substituíram as <strong>causais de residência fiscal</strong> do Decreto 163/020, ou se apenas condicionam o <em>tax holiday</em>. As firmas uruguaias afirmam o segundo; a PwC Worldwide Tax Summaries afirma o primeiro. <strong>As consequências para quem já comprou imóvel de UI 3.500.000 são opostas.</strong>\n2. a existência e o percentual da <strong>base ficta para ganhos de capital do exterior</strong> (a referência a 2,4% sugere base de 20% × 12%).\n\nAmbos devem ser confirmados no IMPO e junto a assessoria uruguaia antes de qualquer decisão.","sources":[{"t":"IMPO · Lei n.º 20.446 — Presupuesto Nacional 2025-2029","u":"https://www.impo.com.uy/bases/leyes-originales/20446-2025"},{"t":"Presidencia · Lei n.º 20.446, de 16/dez/2025","u":"https://www.gub.uy/presidencia/institucional/normativa/ley-n-20446-fecha-16122025-se-aprueba-presupuesto-nacional-para-periodo"},{"t":"IMPO · Texto Ordenado 2023, Título 7 (IRPF), atualizado em março/2026","u":"https://www.impo.com.uy/bases/todgi-2023/7-2024"},{"t":"DGI · Regulamentação do novo regime sobre rendas do exterior","u":"https://www.gub.uy/direccion-general-impositiva/comunicacion/noticias/se-regulan-aspectos-asociados-nuevo-regimen-sobre-rentas-del-exterior"},{"t":"DGI · Tax Holidays — opção para novos residentes fiscais","u":"https://www.gub.uy/direccion-general-impositiva/comunicacion/publicaciones/tax-holidays-opcion-para-nuevos-residentes-fiscales-uruguay"},{"t":"DGI · Causais de residência fiscal","u":"https://www.gub.uy/direccion-general-impositiva/comunicacion/publicaciones/causales-residencia-fiscal"},{"t":"DGI · Unidade Indexada","u":"https://www.gub.uy/direccion-general-impositiva/datos-y-estadisticas/datos/unidad-indexada"},{"t":"BPS · Comunicado R 5/2026 — valores e escalas do IRPF 2026 (PDF)","u":"https://www.bps.gub.uy/bps/file/23860/3/2026---comunicado-r-5---valores-escalas-irpf-2026.pdf"},{"t":"Planalto · Decreto n.º 11.747/2023 (CDT Brasil–Uruguai)","u":"http://www.planalto.gov.br/ccivil_03/_ato2023-2026/2023/decreto/d11747.htm"},{"t":"IMPO · Lei n.º 15.921 (Zonas Francas)","u":"https://www.impo.com.uy/bases/leyes/15921-1987"}]},{"name":"Tax holiday — regime de novos residentes fiscais (Lei 20.446)","status":"changed","legalBasis":"Lei 18.718/2010 (5 exercícios); Lei 19.937/2021, art. 1.º (11 exercícios); <strong>Lei 20.446/2025</strong>, que criou o novo regime aplicável a quem adquire residência fiscal a partir de 1/jan/2026. Regulamentação: Decreto 95/026 e Resolução DGI 1.517/026.","desc":"<strong>Nota de precisão terminológica:</strong> juridicamente não se trata de «isenção», mas da <strong>opção por tributar-se pelo IRNR</strong> (Imposto à Renda de Não Residentes) durante o período. Como o IRNR <strong>não alcança</strong> rendas de fonte estrangeira, o efeito prático é <strong>carga zero</strong>. A distinção importa para efeitos de tratado e de certificado de residência fiscal.\n\n<strong>Estrutura do benefício para quem adquire residência fiscal a partir de 1/jan/2026:</strong>\n· <strong>Anos 1 a 11</strong> (exercício da mudança mais os 10 seguintes): opção por IRNR → rendas passivas do exterior <strong>não tributadas</strong>;\n· <strong>Anos 12 a 16</strong> (5 exercícios seguintes): IRPF à <strong>metade da alíquota → 6%</strong>;\n· <strong>a partir do ano 17</strong>: IRPF à alíquota geral de <strong>12%</strong>.\n\n<strong>A «via curta» foi extinta.</strong> A combinação de imóvel de UI 3.500.000 (cerca de USD 590.000 em valores de 2026) mais 60 dias de presença anual <strong>deixou de dar acesso ao tax holiday</strong> para quem adquire residência a partir de 1/jan/2026.\n\n<strong>A opção dos 7% vitalícios foi extinta</strong> para novos residentes fiscais a partir de 1/jan/2026, e substituída pela sequência 11 anos a 0% → 5 anos a 6% → 12% em diante.","kv":[{"l":"Anos 1–11","v":"0% (opção pelo IRNR)"},{"l":"Anos 12–16","v":"6%"},{"l":"Ano 17 em diante","v":"12%"},{"l":"Opção 7% vitalícia","v":"Extinta para novos residentes"},{"l":"Via A — permanência","v":"183 dias/ano · sem investimento"},{"l":"Via B — imobiliária","v":"UI 12.500.000 (≈ USD 2M)"},{"l":"Via C — fundos de inovação","v":"UI 625.000/ano (≈ USD 100k)"},{"l":"Não residência prévia","v":"2 exercícios anteriores"},{"l":"Opção","v":"Única e irrevogável"}],"requirements":["<strong>Não ter sido residente fiscal uruguaio nos 2 exercícios fiscais imediatamente anteriores.</strong>","<strong>Não</strong> ter utilizado anteriormente o regime de <em>tax holiday</em>.","Exercer a opção <strong>uma única vez</strong> — é irrevogável quanto ao conjunto do período.","Cumprir <strong>uma</strong> das três vias de acesso: <strong>(A) permanência</strong> — mais de <strong>183 dias</strong> no ano civil, sem investimento exigido, devendo os 183 dias configurar-se <strong>em cada exercício</strong> em que o regime vigorar; <strong>(B) imobiliária</strong> — para quem obtém residência por causal diversa dos 183 dias: imóveis de valor superior a <strong>UI 12.500.000</strong> (≈ USD 2.000.000); <strong>(C) fundos de inovação</strong> — capitalização de fundos de investimento destinados a financiar projetos produtivos, pesquisa ou inovação aplicada à produção, mínimo de <strong>UI 625.000/ano</strong> (≈ USD 100.000/ano). <em>Uma fonte indica 11 anos consecutivos de aporte.</em>"],"process":[{"step":"Diagnóstico prévio","detail":"Análise da composição de patrimônio e de rendas para definir se o custo do novo regime compensa, e qual via de acesso é aplicável.","timing":"Prévio"},{"step":"Configuração da residência fiscal","detail":"Escolha e configuração da causal — 183 dias, investimento, ou interesses vitais. <strong>Decisão crítica sob a Lei 20.446</strong>, dada a divergência entre fontes sobre a natureza dos limiares de UI 12.500.000 e UI 625.000.","timing":"Ano 0"},{"step":"Exercício da opção perante a DGI","detail":"A opção pelo <em>tax holiday</em> é exercida perante a DGI, é <strong>única e irrevogável</strong>. <em>Verificar o prazo aplicável na regulamentação vigente.</em>","timing":"Ao configurar a residência"},{"step":"Certificado de residência fiscal","detail":"Solicitação do «Certificado de residencia fiscal de Persona Física» à DGI, pelo portal gub.uy. É o documento que instrumentaliza a aplicação do CDT Brasil–Uruguai e a comunicação de saída fiscal do Brasil.","timing":"Após a configuração"},{"step":"Manutenção do investimento (vias B e C)","detail":"Manutenção do investimento imobiliário ou dos aportes anuais nos fundos de inovação durante a vigência do regime.","timing":"Contínua"}],"costs":[{"item":"Via B — investimento imobiliário","value":"UI 12.500.000","note":"≈ USD 2.000.000–2.066.000; ativo do investidor, não é taxa"},{"item":"Via C — fundos de inovação","value":"UI 625.000/ano","note":"≈ USD 100.000–103.000/ano; uma fonte indica 11 anos consecutivos"},{"item":"Via A — permanência","value":"Nenhum investimento","note":"Exige 183 dias em cada exercício de vigência do regime"},{"item":"Regime simplificado de quota fixa — regra geral","value":"UI 1.875.000/ano","note":"≈ USD 300.000; valores anuais ou totais divergem entre fontes — confirmar"},{"item":"Regime simplificado — quota reduzida","value":"UI 1.250.000/ano","note":"≈ USD 200.000; aplicável a quem permanece mais de 183 dias no exercício"}],"sections":[{"title":"Regime transitório — quem já estava no sistema","body":"<strong>Adquiriu residência fiscal até 31/dez/2025 e optou pelo tax holiday:</strong> <strong>conserva integralmente as condições originais</strong> de ingresso. Deve verificar se a cobertura do regime alcança as <strong>novas categorias de renda</strong> tributadas a partir de 2026 (imobiliárias e ganhos de capital) — há disposição transitória específica na Lei 20.446 estendendo a cobertura.\n\n<strong>Tax holiday expirado em 31/dez/2025:</strong> pode optar por <strong>IRPF a 6% durante 5 exercícios</strong> sobre a totalidade das rendas passivas do exterior, <strong>desde que realize, a partir de 1/jan/2026, os investimentos especificados</strong>.\n\n<strong>Optou pelos 7% vitalícios antes de 2026:</strong> os resultados indicam que a opção <strong>deixou de ser permitida para novos residentes</strong>, mas <strong>não confirmam se quem já a exerceu conserva o direito adquirido</strong>. Dada a natureza irrevogável e vitalícia da opção original, o mais provável é a manutenção — <em>mas isso precisa ser confirmado no texto legal</em>.\n\n<strong>Escritura de imóvel assinada (boleto ou compromisso) antes de 1/jan/2026 e outorgada em 2026:</strong> <strong>zona cinzenta</strong> — requer análise caso a caso; pode aplicar-se o limiar antigo (UI 3.500.000) ou o novo (UI 12.500.000), conforme a interpretação."},{"title":"Comparação numérica entre o regime antigo e o novo","body":"Sobre um fluxo anual constante de rendas passivas do exterior, ao longo de 16 anos:\n\n· <strong>Regime antigo (opção dos 7% vitalícios):</strong> 7% × 16 anos = <strong>112% do fluxo anual</strong> em imposto acumulado;\n· <strong>Regime novo:</strong> 0% × 11 anos + 6% × 5 anos = <strong>30% do fluxo anual</strong>.\n\nA partir do ano 17, o regime antigo mantinha 7% ao ano e o novo aplica 12% ao ano. O ponto de indiferença acumulado ocorre por volta do <strong>ano 33</strong> de residência.\n\n<em>Cálculo ilustrativo, sem desconto a valor presente. O legislador substituiu uma alíquota reduzida perpétua por um período mais longo de desoneração seguido de tributação plena.</em>"},{"title":"Regime simplificado de quota fixa (novidade 2026)","body":"Introduzido pela Lei 20.446 e regulado pelo Decreto 95/026: pagamento de <strong>valor fixo anual</strong> em substituição à liquidação individualizada de cada renda.\n\n· <strong>UI 1.875.000/ano</strong> (≈ USD 300.000) — regra geral;\n· <strong>UI 1.250.000/ano</strong> (≈ USD 200.000) — quando o contribuinte permanece <strong>mais de 183 dias</strong> no Uruguai no exercício;\n· prazo: <strong>20 exercícios fiscais</strong>;\n· dirigido a pessoas físicas residentes que <strong>não gozaram do tax holiday</strong>.\n\n<em>Nota de verificação:</em> as fontes divergem quanto a se os valores são <strong>anuais ou totais</strong>, e quanto às condições de acesso. Um regime de quota fixa de USD 300.000 por ano durante 20 anos só faz sentido econômico para patrimônios muito elevados — o ponto de indiferença situa-se em renda passiva do exterior superior a cerca de <strong>USD 2,5 milhões por ano</strong> a 12%. <strong>Confirmar no Decreto 95/026 antes de qualquer decisão.</strong>"},{"title":"Perda da residência fiscal","body":"A Lei 20.446 <strong>definiu o momento da perda da residência fiscal</strong> uruguaia. <em>O conteúdo exato não pôde ser obtido — verificar o artigo correspondente no IMPO.</em>\n\nÉ ponto essencial para planejamento de saída, especialmente para quem pretende retornar ao Brasil, e interage diretamente com o descompasso de calendários descrito na nota de interação com o Brasil (ano civil uruguaio × 12 meses móveis brasileiros)."}],"brazilNote":"A opção pelo <em>tax holiday</em> significa tributar-se pelo <strong>IRNR</strong>. Como o IRNR <strong>consta</strong> da lista de tributos abrangidos pelo CDT Brasil–Uruguai (Decreto 11.747/2023) e a DGI emite certificado de residência fiscal, a aplicação do tratado deveria seguir normalmente.\n\n<strong>Risco não testado:</strong> a possibilidade de o Brasil questionar a condição de «residente» para fins do art. 4.º do CDT, tratando-se de pessoa sujeita a tributação apenas territorial e beneficiada por <em>tax holiday</em>. É risco real, sem precedente conhecido, e deve ser dimensionado com tributarista antes de estruturar a operação.\n\n<strong>Sequência operacional recomendada</strong> para a família brasileira:\n1. diagnóstico de patrimônio e composição de rendas;\n2. entrada no Uruguai (brasileiro dispensado de visto, entra com RG ou passaporte);\n3. <strong>residência legal MERCOSUL</strong> junto à DNM — gratuita para brasileiros, sem apostila nem tradução;\n4. Cédula de Identidad junto à DNIC;\n5. configuração da <strong>residência fiscal</strong> perante a DGI, escolhendo a causal;\n6. <strong>exercício da opção de tax holiday</strong> perante a DGI — única e irrevogável;\n7. obtenção do <strong>certificado de residência fiscal</strong>;\n8. <strong>CSDP e DSDP no Brasil</strong>, nos prazos de fevereiro e abril;\n9. atualização da <em>self-certification</em> CRS nas instituições financeiras, para redirecionar o reporte;\n10. reestruturação patrimonial, considerando o ITP uruguaio e o ITCMD brasileiro.","sources":[{"t":"DGI · Tax Holidays — opção para novos residentes fiscais","u":"https://www.gub.uy/direccion-general-impositiva/comunicacion/publicaciones/tax-holidays-opcion-para-nuevos-residentes-fiscales-uruguay"},{"t":"DGI · Solicitação de certificado de residência fiscal de pessoa física","u":"https://www.gub.uy/tramites/solicitud-certificado-residencia-fiscal-persona-fisica"},{"t":"IMPO · Lei n.º 20.446","u":"https://www.impo.com.uy/bases/leyes-originales/20446-2025"},{"t":"Guyer & Regules · Regime tributário aplicável a residentes fiscais por rendas do exterior","u":"https://www.guyer.com.uy/informes-&-noticias/regimen-tributario-aplicable-a-personas-fisicas-residentes-fiscales-en-uruguay-por-sus-rentas-en-el-exterior"},{"t":"Guyer & Regules · Principais aspectos do novo decreto sobre IRPF de rendas do exterior","u":"https://www.guyer.com.uy/informes-&-noticias/principales-aspectos-del-nuevo-decreto-sobre-irpf-aplicable-a-rentas-e-inversiones-del-exterior-1"},{"t":"Forvis Mazars · Uruguai 2026 — nova rota para residentes fiscais e investidores","u":"https://www.forvismazars.com/uy/es/insights/nuestras-publicaciones/impuestos/uruguay-2026-residencia-fiscal-e-inversores"},{"t":"OCDE · Uruguai — informação sobre residência para fins fiscais (PDF)","u":"https://www.oecd.org/content/dam/oecd/en/topics/policy-issue-focus/aeoi/uruguay-residency.pdf"}]}],"visa":[{"name":"Residência MERCOSUL — a via para brasileiros","status":"ok","legalBasis":"Acordo sobre Residência para Nacionais dos Estados Partes do MERCOSUL, Bolívia e Chile (2002). No Uruguai, incorporado pela <strong>Lei n.º 18.250, de 6/jan/2008</strong> (Ley de Migraciones) e pelo <strong>Decreto n.º 394/009, de 24/ago/2009</strong>, com alterações pelos Decretos 356/018 e 45/023.","desc":"<strong>Princípio fundamental:</strong> residência fiscal (DGI) e residência legal (DNM) são <strong>procedimentos autônomos e independentes</strong>. É possível ser residente fiscal sem residência legal — basta configurar uma causal do art. 6.º do Título 7 — e é possível ter residência legal sem residência fiscal. São órgãos, requisitos, prazos e efeitos distintos, e não há comunicação automática entre a DGI e a DNM.\n\nO portal gub.uy mantém <strong>dois trâmites distintos</strong>: «Residencia Legal – Temporaria Mercosur» e «Residencia Legal – Permanente Mercosur». Brasileiros podem, conforme o caso, iniciar diretamente pela permanente ou pela temporária.\n\n<strong>Residência temporária MERCOSUL:</strong> vigência de <strong>2 anos</strong>, prorrogáveis por igual período, uma única vez. A renovação deve ser solicitada dentro dos <strong>90 dias anteriores</strong> ao vencimento. Após o período, pode-se solicitar a conversão em residência permanente.\n\n<em>Nota de verificação: uma fonte menciona conversão automática após 3 anos consecutivos de residência temporária renovada; a norma MERCOSUL padrão prevê conversão ao término dos 2 anos, mediante comprovação de meios de vida lícitos. Confirmar diretamente com a DNM.</em>","kv":[{"l":"Taxa para brasileiros","v":"Gratuito"},{"l":"Apostila de documentos brasileiros","v":"Dispensada"},{"l":"Tradução juramentada","v":"Dispensada"},{"l":"Temporária","v":"2 anos + 2"},{"l":"Renovação","v":"Nos 90 dias anteriores ao vencimento"},{"l":"Entrada no Uruguai","v":"RG ou passaporte, sem visto"},{"l":"Órgão","v":"DNM · Ministerio del Interior"},{"l":"Escritórios da DNM","v":"12 dos 19 departamentos"},{"l":"Residência fiscal","v":"Procedimento separado (DGI)"}],"requirements":["Ser nacional de Estado Parte ou Associado do MERCOSUL — <strong>brasileiros qualificam-se</strong>.","<strong>Fotografia.</strong>","<strong>Documento de identidade válido</strong> — passaporte ou RG brasileiro.","<strong>Certidão de nascimento.</strong>","<strong>Certidão de antecedentes criminais</strong> do país ou países onde residiu nos <strong>últimos 5 anos</strong>.","<strong>Certificado de vacinação</strong> conforme o esquema uruguaio, obtido no Uruguai.","<strong>Comprovante de domicílio</strong> no Uruguai.","Certidão de casamento, se aplicável."],"process":[{"step":"Entrada no Uruguai","detail":"Brasileiro entra como turista com <strong>RG ou passaporte, sem visto</strong>.","timing":"Imediato"},{"step":"Apresentação na DNM","detail":"Agendamento e apresentação em qualquer escritório da Dirección Nacional de Migración, presente em <strong>12 dos 19 departamentos</strong>.","timing":"A confirmar"},{"step":"Protocolo do pedido","detail":"Protocolo e entrega dos documentos no dia da audiência.","timing":"Dia da audiência"},{"step":"Certificado de vacinação","detail":"Obtenção do certificado de vacinação conforme o esquema uruguaio, junto a prestador de saúde no Uruguai.","timing":"Dias"},{"step":"Constância de trâmite iniciado","detail":"A DNM emite constância que permite solicitar a <strong>Cédula de Identidad</strong> provisória.","timing":"A confirmar"},{"step":"Cédula de Identidad","detail":"Emissão da Cédula de Identidad uruguaya pela <strong>Dirección Nacional de Identificación Civil (DNIC)</strong>.","timing":"Semanas"},{"step":"Resolução final","detail":"Resolução final de residência pela DNM. <em>Historicamente, a via MERCOSUL permitia obter a cédula em poucas semanas após o início do trâmite, com a resolução definitiva vindo depois. Prazos correntes devem ser atualizados junto à DNM.</em>","timing":"A confirmar"}],"costs":[{"item":"Taxa de residência MERCOSUL — brasileiros","value":"Gratuito","note":"Confirmado; gratuito também para paraguaios. Nacionais dos demais países pagam as taxas correspondentes"},{"item":"Apostila de documentos brasileiros","value":"Não exigida","note":"Confirmado — exceção expressa aos documentos emitidos pelo Brasil"},{"item":"Tradução juramentada de documentos brasileiros","value":"Não exigida","note":"Confirmado"},{"item":"Certidão de antecedentes criminais (Brasil)","value":"Custo brasileiro corrente","note":"Polícia Federal e polícia estadual"},{"item":"Certificado de vacinação (Uruguai)","value":"A confirmar"},{"item":"Cédula de Identidad (DNIC)","value":"A confirmar"},{"item":"Assessoria jurídica local","value":"Custo de mercado","note":"Opcional"}],"sections":[{"title":"As duas facilitações específicas para brasileiros","body":"Estas são as duas vantagens operacionais mais concretas, ambas confirmadas:\n\n<strong>1. Dispensa de apostila e de tradução.</strong> A regra geral uruguaia exige que todo documento estrangeiro esteja apostilado ou legalizado e, se for o caso, traduzido ao espanhol — <strong>«com exceção dos emitidos pelo Brasil»</strong>. Documentos brasileiros <strong>não requerem apostila da Haia nem tradução juramentada</strong>.\n\n<strong>2. Gratuidade.</strong> O trâmite é <strong>gratuito para nacionais brasileiros e paraguaios</strong>. Nacionais dos demais países do MERCOSUL e associados pagam as taxas correspondentes.\n\nA combinação de gratuidade e dispensa de apostila e tradução <strong>reduz materialmente custo e prazo</strong> do processo para brasileiros em comparação com qualquer outra via de residência uruguaia."},{"title":"Regras de família","body":"O Acordo de Residência do MERCOSUL prevê, como regra, a extensão da residência a <strong>cônjuge ou concubino, filhos solteiros menores ou com deficiência, e ascendentes</strong> do titular.\n\nCada dependente apresenta a própria documentação — identidade, certidão de nascimento ou casamento, antecedentes criminais para maiores de 18 anos, e vacinação.\n\nSendo o trâmite gratuito para brasileiros, <strong>presume-se que a gratuidade se estenda aos dependentes brasileiros</strong>. <em>Confirmar junto à DNM.</em>"},{"title":"Residência permanente pelo regime geral","body":"Alternativa à via MERCOSUL, para quem não é nacional de Estado Parte ou Associado, ou para quem prefira essa rota.\n\n<strong>Órgão:</strong> Dirección Nacional de Migración (Ministerio del Interior), ou, alternativamente, a autoridade consular uruguaia no exterior, com intervenção do Ministerio de Relaciones Exteriores.\n\n<strong>Documentação:</strong> documento de identidade válido; certidão de nascimento legalizada ou apostilada e traduzida; certidão de casamento, se aplicável; <strong>certidão de antecedentes criminais</strong> do país de origem e dos países de residência nos últimos 5 anos (alternativamente, a informação pode ser obtida via Oficina Central Nacional INTERPOL-Uruguay ou certificação consular); certificado de esquema de vacinação; <strong>Carné de Salud</strong> (exame médico realizado no Uruguai — <em>a confirmar se exigido em todos os casos</em>); <strong>comprovação de meios de vida</strong> — no caso de aposentado, reformado, pensionista ou rentista, deve acreditar essa condição de forma fidedigna e demonstrar que os rendimentos permitem custear as despesas no país; comprovante de domicílio; e fotografia.\n\n<strong>Prazo processual:</strong> uma vez ingressado em território nacional, o solicitante dispõe de <strong>30 dias hábeis</strong> para apresentar-se à DNM e completar a documentação. <em>O prazo total de processamento é variável; historicamente, meses a mais de um ano no regime geral.</em>\n\n<strong>Documento resultante:</strong> resolução de residência permanente, que habilita a obtenção da Cédula de Identidad uruguaya junto à DNIC."},{"title":"Como se sai do regime","body":"A <strong>residência permanente</strong> não se perde por ausência de curta duração, mas a Lei 18.250 e o Decreto 394/009 preveem hipóteses de <strong>cancelamento</strong> — ausência prolongada do país, obtenção fraudulenta, condenação penal. <em>Verificar o prazo de ausência que enseja perda.</em>\n\nA <strong>residência temporária</strong> extingue-se pelo decurso do prazo sem renovação.\n\n<strong>Renúncia voluntária</strong> é possível.\n\n<strong>Importante:</strong> perder a residência legal <strong>não</strong> implica automaticamente perder a residência fiscal, e vice-versa."}],"brazilNote":"A via MERCOSUL é, com folga, a rota de residência legal uruguaia mais acessível ao brasileiro: <strong>gratuita</strong>, <strong>sem apostila</strong> e <strong>sem tradução juramentada</strong>, com entrada no país mediante RG ou passaporte, sem visto.\n\n<strong>Não confunda com residência fiscal.</strong> Obter a residência MERCOSUL <strong>não</strong> configura, por si, residência fiscal uruguaia — nem encerra a residência fiscal brasileira. São procedimentos independentes, perante órgãos distintos (DNM e DGI), com requisitos e efeitos próprios.\n\nPara produzir efeito fiscal, é necessário: (i) configurar uma causal de residência fiscal perante a DGI; (ii) exercer a opção de <em>tax holiday</em>, se aplicável; (iii) obter o certificado de residência fiscal; e (iv) formalizar no Brasil a <strong>CSDP</strong> (até o último dia de fevereiro do ano-calendário seguinte) e a <strong>DSDP</strong> (até o último dia útil de abril).\n\nO <strong>Acordo Multilateral de Seguridade Social do MERCOSUL</strong> permite a totalização de períodos de contribuição entre Brasil e Uruguai, e o <strong>Estatuto da Cidadania do MERCOSUL</strong> (Decisão CMC n.º 64/10) confere base política ao Acordo de Residência.","sources":[{"t":"gub.uy · Residencia Legal — Permanente Mercosur","u":"https://www.gub.uy/tramites/residencia-legal-permanente-mercosur"},{"t":"gub.uy · Residencia Legal — Temporaria Mercosur","u":"https://www.gub.uy/tramites/residencia-legal-temporaria-mercosur"},{"t":"gub.uy · Residencia Legal — Permanente (regime geral)","u":"https://www.gub.uy/tramites/residencia-legal-permanente"},{"t":"IMPO · Decreto n.º 394/009","u":"https://www.impo.com.uy/bases/decretos/394-2009/4"},{"t":"EY Uruguay · Residencia fiscal y residencia legal en Uruguay","u":"https://www.ey.com/es_uy/services/tax/residencia-fiscal-y-residencia-legal-en-uruguay"},{"t":"Andersen Uruguay · Residencia permanente para nacionais do Mercosul","u":"https://uy.andersen.com/residencia-permanente-nacionales-mercosur-y-asociados.php"}]},{"name":"Cidadania legal uruguaia — e a distinção em relação à nacionalidade","status":"risk","legalBasis":"Constituição da República, arts. 73 a 81 — art. 74 (cidadãos naturais), art. 75 (cidadãos legais), art. 81 (a nacionalidade não se perde pela naturalização em outro país). Lei n.º 16.021, de 13/abr/1989 (define quem tem a nacionalidade uruguaia). Lei n.º 8.196, de 1928 (normas sobre cidadania legal). <strong>Circular da Corte Electoral n.º 11.376/2022 — «Manual de Ciudadanía»</strong>, fonte procedimental central.","desc":"<strong>Via A — com família constituída na República:</strong> <strong>3 anos</strong> de residência habitual no país, boa conduta, <strong>arraigo</strong> (capital em giro, propriedade no país, ou exercício de ciência, arte ou indústria) e inscrição no Registro Cívico.\n\n<strong>Via B — sem família constituída:</strong> <strong>5 anos</strong> de residência habitual, com os demais requisitos idênticos.\n\n<strong>«Família constituída»</strong> — conforme o Manual de Ciudadanía: além de provar arraigo e residência própria, deve-se demonstrar que <strong>vivem e estão a seu cargo</strong> pai, mãe ou irmão no <strong>mesmo domicílio</strong>; ou cônjuge ou filhos uruguaios.\n\n<strong>Comprovação de arraigo</strong> — meios admitidos pelo Manual: permanência no país por lapso superior a <strong>três meses</strong>; arrendamento ou aquisição de uma finca; instalação de comércio ou indústria; emprego no país; ou inscrição em centro de estudo público ou privado por, ao menos, dois meses.\n\n<strong>Testemunhas:</strong> exigem-se testemunhas que conheçam o requerente pelo tempo necessário — 3 anos (com família constituída) ou 5 anos (sem família).","kv":[{"l":"Com família constituída","v":"3 anos de residência"},{"l":"Sem família constituída","v":"5 anos de residência"},{"l":"Órgão","v":"Corte Electoral"},{"l":"Documento","v":"Carta de Ciudadanía"},{"l":"Direitos políticos","v":"3 anos após a Carta"},{"l":"Cargos privativos de naturais","v":"Presidência e Vice"},{"l":"Nacionalidade","v":"Ver a distinção — ponto crítico"},{"l":"Perda da nacionalidade uruguaia","v":"Não ocorre (art. 81)"}],"requirements":["<strong>3 anos</strong> de residência habitual no país, com <strong>família constituída na República</strong>; ou <strong>5 anos</strong> sem família constituída.","<strong>Boa conduta.</strong>","<strong>Arraigo</strong> comprovado — capital em giro, propriedade no país, ou exercício de alguma ciência, arte ou indústria.","<strong>Inscrição no Registro Cívico.</strong>","<strong>Testemunhas</strong> que conheçam o requerente pelo tempo exigido."],"process":[{"step":"Agendamento","detail":"Em <strong>Montevidéu</strong>: agendamento prévio pela Agenda de Ciudadanía Legal, no portal gub.uy, e comparecimento presencial. No <strong>interior</strong>: trâmite iniciado nas Oficinas Electorales Departamentales.","timing":"—"},{"step":"Apresentação do pedido","detail":"Trâmite «Carta de ciudadanía (ciudadanía legal uruguaya)» perante a <strong>Corte Electoral — Sección Ciudadanía Legal</strong>, com prova de residência, arraigo e testemunhas.","timing":"—"},{"step":"Emissão da Carta de Ciudadanía","detail":"Documento resultante do procedimento.","timing":"—"},{"step":"Exercício dos direitos políticos","detail":"O cidadão legal só pode exercer os direitos de cidadania <strong>três anos após</strong> o outorgamento da Carta (art. 75 <em>in fine</em> da Constituição).","timing":"3 anos após a Carta"}],"sections":[{"title":"Cidadania legal ≠ nacionalidade — a questão central","body":"Este é o ponto mais mal compreendido do sistema uruguaio, e o mais relevante para quem busca um segundo passaporte.\n\n<strong>A doutrina tradicional uruguaia:</strong>\n· a <strong>nacionalidade</strong> é vínculo natural, adquirido pelo <strong>nascimento</strong> (<em>ius soli</em>) ou por <strong>filiação</strong> (<em>ius sanguinis</em>, nos termos da Lei 16.021);\n· a <strong>cidadania legal</strong> é um <strong>status político</strong> conferido ao estrangeiro;\n· consequência: o <strong>cidadão legal não é nacional uruguaio</strong>;\n· o <strong>art. 81</strong> da Constituição estabelece que a nacionalidade não se perde nem pela naturalização em outro país — mas a <strong>cidadania legal pode ser suspensa ou perdida</strong>.\n\n<strong>Efeitos práticos:</strong>\n· <strong>Passaporte:</strong> o cidadão legal obtém passaporte uruguaio, mas o campo de <strong>nacionalidade</strong> historicamente indicava o <strong>país de nascimento</strong>, não «uruguaia» — o que gerava questionamentos de autoridades de terceiros países. Há trâmite específico: «Solicitud de pasaporte – Primera vez – Ciudadanos legales».\n· <strong>Direitos políticos:</strong> exercíveis apenas <strong>três anos após</strong> o outorgamento da Carta.\n· <strong>Cargos públicos:</strong> Presidência, Vice-Presidência e outros são privativos de cidadãos <strong>naturais</strong>.\n\n<strong>Desenvolvimentos recentes, em curso:</strong>\n· parte da doutrina sustenta que os cidadãos legais <strong>eram e são nacionais</strong> do Uruguai; pesquisadores documentaram que passaportes uruguaios emitidos <strong>antes de 1925</strong> não distinguiam entre tipos de cidadãos;\n· <strong>4/dez/2023</strong> — cidadãos uruguaios solicitaram <strong>audiência temática perante a Comissão Interamericana de Direitos Humanos (CIDH)</strong> sobre a revogação e denegação arbitrária de nacionalidade a cidadãos legais;\n· <strong>junho de 2024</strong> — os ministros Paganini e Martinelli confirmaram que os passaportes seriam emitidos <strong>corrigindo erros anteriores</strong> quanto à anotação de cidadania;\n· existe estudo técnico sobre o impacto da normativa da OACI/ICAO nos passaportes uruguaios de cidadãos legais (documento de outubro de 2023)."},{"title":"Como se sai do regime","body":"A cidadania legal pode ser <strong>renunciada</strong>.\n\nPode ser <strong>suspensa</strong> nas hipóteses constitucionais dos arts. 80 e 81.\n\n<em>Verificar hipóteses de perda por ausência prolongada do país.</em>"}],"brazilNote":"Para o brasileiro que busca cidadania uruguaia <strong>com finalidade de mobilidade internacional</strong>, a distinção entre cidadania legal e nacionalidade é o ponto decisivo — e a prática de emissão de passaporte estava <strong>em transição em 2024</strong>.\n\n<strong>Verificação indispensável antes de qualquer decisão:</strong> qual é a prática de emissão de passaporte para cidadãos legais vigente em 2026? A questão deve ser confirmada junto à DNIC e ao Ministerio del Interior. É o dado mais importante deste bloco.\n\n<strong>Do lado brasileiro:</strong> a Constituição Federal, art. 12, §4.º, II, na redação dada pela <strong>EC 131/2023</strong>, restringiu a perda da nacionalidade brasileira essencialmente a pedido expresso do próprio interessado. A cidadania legal uruguaia, obtida voluntariamente, não acarreta perda automática da nacionalidade brasileira. <em>Confirmar o texto vigente.</em>\n\n<strong>Sequência típica:</strong> residência MERCOSUL (gratuita) → Cédula de Identidad → residência habitual de 3 ou 5 anos com arraigo comprovado → Carta de Ciudadanía → direitos políticos após mais 3 anos.","warning":"A <strong>cidadania legal uruguaia não confere nacionalidade uruguaia</strong> segundo a doutrina tradicional do país. O passaporte emitido a cidadãos legais historicamente indicava o país de nascimento no campo de nacionalidade, o que gerou questionamentos de autoridades de terceiros países.\n\nA situação estava <strong>em transição em 2024</strong>, com declarações ministeriais de correção e com o tema levado à Comissão Interamericana de Direitos Humanos. <strong>A prática de emissão vigente em 2026 deve ser confirmada junto à DNIC antes de qualquer orientação</strong> — este é o item de verificação de maior impacto para quem busca a cidadania uruguaia como instrumento de mobilidade.","sources":[{"t":"Corte Electoral · Carta de ciudadanía (cidadania legal uruguaia)","u":"https://www.gub.uy/tramites/carta-ciudadania-ciudadania-legal-uruguaya"},{"t":"Corte Electoral · Agenda de Ciudadanía Legal","u":"https://www.gub.uy/corte-electoral/tramites-y-servicios/servicios/agenda-ciudadania-legal"},{"t":"IMPO · Manual de Ciudadanía — Circular Corte Electoral 11.376/2022","u":"https://www.impo.com.uy/bases/circulares-corte-electoral/11376-2022?verOriginal=1"},{"t":"gub.uy · Solicitação de passaporte — primeira vez, cidadãos legais","u":"https://www.gub.uy/tramites/solicitud-pasaporte-primera-vez-ciudadanos-legales"},{"t":"IMPO · Lei n.º 8.196 (cidadania)","u":"https://www.impo.com.uy/bases/leyes/8196-1928"},{"t":"Nacionalidad.uy · Análise do impacto da normativa OACI nos passaportes (PDF, out/2023)","u":"https://www.nacionalidad.uy/downloads/Analisis_impactos_cambio_normativa_oaci_pasportes_uruguayos_ciudadanos_legales_octubre%202023.pdf"}]},{"name":"Hoja de Identidad Provisoria para Nómadas Digitales","status":"new","legalBasis":"Lançada em <strong>maio de 2023</strong>. Decreto n.º 238/022, que modificou a regulamentação aplicável aos trâmites migratórios; o Decreto n.º 394/009 já previa a hoja de identidad provisoria para quem viesse trabalhar por menos de seis meses. <em>Nota: a referência corrente a um «Decreto 108/023» não pôde ser confirmada no IMPO.</em>","desc":"Não é tecnicamente um visto, mas uma <strong>permissão especial de residência legal provisória</strong>, dirigida a trabalhadores estrangeiros que exercem atividade <strong>remota</strong>, de forma independente ou para empresas sediadas no exterior.\n\n<strong>Característica distintiva: não há exigência de renda mínima.</strong> Basta firmar declaração juramentada de que se dispõe de recursos econômicos suficientes para o sustento durante o período.\n\n<strong>Processo integralmente online.</strong>\n\n<strong>Prazo:</strong> até <strong>180 dias</strong>, prorrogável por mais <strong>180 dias</strong> — total de até 1 ano. Para a prorrogação exigem-se, adicionalmente, certidão de antecedentes criminais de todos os países onde residiu por mais de 6 meses nos últimos 5 anos, e certificado de vacinação emitido no Uruguai.\n\nAo término, quem desejar permanecer deve tramitar <strong>residência temporária</strong> ou <strong>MERCOSUL</strong>.","kv":[{"l":"Renda mínima","v":"Nenhuma"},{"l":"Prazo inicial","v":"Até 180 dias"},{"l":"Prorrogação","v":"Mais 180 dias"},{"l":"Total máximo","v":"1 ano"},{"l":"Processo","v":"Integralmente online"},{"l":"Taxa de visto","v":"Não cobrada"},{"l":"Órgão","v":"Dirección Nacional de Migración"},{"l":"Confere residência fiscal","v":"Não, por si só"}],"requirements":["Ingressar no Uruguai como <strong>turista</strong>.","Preencher <strong>formulário online</strong> com dados pessoais.","Fazer upload de <strong>cópia do passaporte</strong>.","Firmar <strong>declaração juramentada</strong> de que dispõe de recursos econômicos suficientes para se sustentar durante o período.","<strong>Não há exigência de renda mínima</strong> — característica distintiva deste programa.","<strong>Para a prorrogação:</strong> certidão de antecedentes criminais de todos os países onde residiu por mais de 6 meses nos últimos 5 anos, e <strong>certificado de vacinação emitido no Uruguai</strong>."],"costs":[{"item":"Taxa de visto","value":"Não cobrada","note":"O Uruguai não cobra taxa de visto para a permissão de nômade digital"},{"item":"Taxa administrativa","value":"A confirmar","note":"Fontes secundárias mencionam algo em torno de USD 10–15"}],"sections":[{"title":"Advertência fiscal — o risco central","body":"A Hoja de Identidad Provisoria <strong>não confere residência fiscal</strong> por si só.\n\n<strong>Mas a permanência superior a 183 dias no ano civil configura residência fiscal automaticamente</strong>, por força do art. 6.º do Título 7, <strong>independentemente do status migratório</strong>.\n\n<strong>Consequência prática:</strong> um nômade digital que use os <strong>dois períodos de 180 dias dentro do mesmo ano civil</strong> torna-se residente fiscal uruguaio — com todas as consequências do novo regime de 2026 sobre rendas do exterior, incluindo a tributação de 12% sobre juros, dividendos, aluguéis do exterior e ganhos de capital.\n\n<strong>Este risco deve ser explicitado antes de qualquer planejamento de calendário.</strong> A janela de 180 + 180 dias só é fiscalmente neutra se atravessar a virada do ano civil."}],"brazilNote":"Brasileiro entra no Uruguai com <strong>RG ou passaporte, sem visto</strong>, e pode requerer a Hoja de Identidad Provisoria integralmente online, sem exigência de renda mínima.\n\n<strong>Ponto de atenção de calendário:</strong> quem usar os dois períodos de 180 dias dentro do <strong>mesmo ano civil</strong> torna-se residente fiscal uruguaio — e, sem a saída fiscal do Brasil (CSDP e DSDP), passa a ser residente fiscal nos dois países simultaneamente. O CDT Brasil–Uruguai (Decreto 11.747/2023) oferece <em>tie-breakers</em> no art. 4.º, mas resolvê-los custa litígio.\n\n<strong>Descompasso relevante:</strong> o Uruguai conta os 183 dias pelo <strong>ano civil</strong>; o Brasil conta <strong>12 meses móveis</strong> na ausência de CSDP. É possível ficar sem residência fiscal em nenhum dos dois países — ou em ambos.\n\nPara quem pretende permanência efetiva, a <strong>residência MERCOSUL</strong> é a via mais direta e é gratuita para brasileiros.","sources":[{"t":"gub.uy · Hoja de identidad provisoria","u":"https://www.gub.uy/tramites/hoja-identidad-provisoria"},{"t":"AGESIC · Permiso especial de residencia legal","u":"https://www.gub.uy/agencia-gobierno-electronico-sociedad-informacion-conocimiento/comunicacion/noticias/permiso-especial-residencia-legal"},{"t":"Bloomberg Línea · Uruguai busca atrair nômades digitais com permissão especial","u":"https://www.bloomberglinea.com/2023/05/08/uruguay-busca-atraer-nomades-digitales-con-permiso-de-residencia-especial/"}]}]},"gb":{"id":"gb","flagCode":"gb","name":"Reino Unido","region":"Europa","alert":true,"sumFiscal":"Non-dom extinto · Regime FIG de 4 anos","sumFS":"changed","sumVisa":"Sem golden visa · Innovator Founder · Global Talent","sumVS":"ext","fiscal":[{"name":"Fim do regime non-domiciled e da remittance basis","status":"ext","legalBasis":"<strong>Finance Act 2025 (c. 8), Parte 2</strong>, com efeitos a partir de <strong>6 de abril de 2025</strong>. Revoga ou altera: ITA 2007, ss. 809A a 809Z10 (remittance basis); ITA 2007, s. 835BA e IHTA 1984, s. 267 (deemed domicile); TCGA 1992, s. 86 e Schedule 5 (proteções de trust); ITTOIA 2005, s. 624 e ss. 628A/B.","desc":"O sistema britânico tributava pessoas físicas com base em duas variáveis simultâneas: <strong>residência</strong> e <strong>domicílio</strong> — este último um conceito de <em>common law</em> (domicílio de origem, de dependência e de escolha), distinto de residência fiscal e de status migratório.\n\nO <strong>residente não domiciliado</strong> («non-dom») podia optar pela <strong>remittance basis of taxation</strong>: rendimentos e ganhos estrangeiros (FIG) eram tributados <strong>apenas se remetidos</strong> ao Reino Unido, mediante pagamento do <em>remittance basis charge</em> de <strong>£30.000/ano</strong> (7 de 9 anos de residência) ou <strong>£60.000/ano</strong> (12 de 14 anos). A partir de 6/abr/2017, quem fosse residente em <strong>15 dos 20 anos</strong> anteriores tornava-se <em>deemed domiciled</em> e perdia definitivamente o regime.\n\n<strong>O que foi extinto em 6 de abril de 2025:</strong>\n· a <strong>remittance basis</strong>, para rendimentos e ganhos <em>surgidos a partir de 6/abr/2025</em> — o FIG anterior a essa data permanece sujeito ao regime de remessa, o que explica a relevância do TRF;\n· o <strong>remittance basis charge</strong> (£30k/£60k);\n· o <strong>deemed domicile</strong> para <em>income tax</em> e <em>CGT</em>;\n· o <strong>domicílio como critério de conexão para IHT</strong>, substituído por residência de longo prazo;\n· as <strong>trust protections</strong> (TCGA 1992, s. 86, e regras TOAA);\n· a <strong>proteção permanente dos excluded property trusts</strong>;\n· a <strong>Overseas Workday Relief na formulação antiga</strong>, substituída por versão vinculada ao FIG, com teto.","kv":[{"l":"Data da extinção","v":"6 de abril de 2025"},{"l":"Instrumento","v":"Finance Act 2025 (c. 8)"},{"l":"Remittance basis charge","v":"Extinto (era £30k/£60k)"},{"l":"Deemed domicile (IR e CGT)","v":"Extinto"},{"l":"Domicílio como critério de IHT","v":"Substituído por residência"},{"l":"Proteções de trusts offshore","v":"Removidas"},{"l":"Excluded property trusts","v":"Proteção permanente eliminada"},{"l":"FIG pré-6/abr/2025","v":"Ainda sob regime de remessa"}],"sections":[{"title":"O que era a remittance basis, em detalhe","body":"<strong>Rendimentos de fonte britânica</strong> eram sempre tributados no regime de competência (<em>arising basis</em>).\n\n<strong>Rendimentos e ganhos de fonte estrangeira</strong> eram tributados <strong>apenas se remetidos</strong>. A definição de «remessa» era amplíssima: dinheiro, bens, serviços pagos com FIG, uso de garantia, e qualquer benefício auferido por <em>relevant person</em> — cônjuge, filhos menores, trusts e companhias fechadas relacionadas.\n\n<strong>Custo:</strong> gratuita nos anos 1 a 6 de residência; <strong>£30.000/ano</strong> a partir de 7 de 9 anos; <strong>£60.000/ano</strong> a partir de 12 de 14 anos. Havia ainda um encargo de £90.000/ano para 17 de 20 anos, abolido em 2017 e substituído pelo <em>deemed domicile</em>.\n\n<strong>Perda de deduções:</strong> quem optava perdia a <em>personal allowance</em> e o <em>CGT annual exempt amount</em> no ano da opção (salvo FIG inferior a £2.000).\n\n<strong>Deemed domicile</strong> (desde 6/abr/2017): residente em <strong>15 dos 20 anos fiscais anteriores</strong> passava a ser domiciliado por presunção para <em>income tax</em>, CGT e IHT.\n\n<strong>Formerly domiciled resident (FDR):</strong> nascido no Reino Unido com domicílio de origem britânico e retornado — tornava-se <em>deemed domiciled</em> já no primeiro ano de residência.\n\n<strong>Excluded property trusts (EPT):</strong> ativos não britânicos em trust constituído por non-dom ficavam <strong>permanentemente fora do IHT</strong>, ainda que o settlor depois se tornasse <em>deemed domiciled</em> — proteção que a reforma eliminou.\n\n<strong>Overseas Workday Relief (OWR):</strong> vinculada à remittance basis; 3 primeiros anos; exigia conta bancária offshore e não-remessa; <strong>sem teto</strong>.\n\n<em>Nota de verificação: a numeração exata de seções e Schedules do Finance Act 2025 para cada medida deve ser confirmada em legislation.gov.uk. A estrutura é a Parte 2 do Act, seções aproximadamente 40 a 47 e Schedules 9 a 13.</em>"}],"brazilNote":"Para brasileiros que já eram residentes britânicos sob a <em>remittance basis</em> antes de 6/abr/2025, a extinção do regime tem duas consequências imediatas:\n\n1. <strong>FIG surgido a partir de 6/abr/2025</strong> passa a ser tributado no Reino Unido pelo regime de competência — dividendos brasileiros, aluguéis de imóveis no Brasil, juros e ganhos de capital em ativos brasileiros entram na base britânica, remetidos ou não;\n2. <strong>FIG anterior a 6/abr/2025</strong> permanece sob o regime de remessa — e é exatamente esse estoque que o <strong>Temporary Repatriation Facility</strong> permite «limpar» a alíquota reduzida durante a janela de 3 anos.\n\nQuem se torna residente britânico a partir de 2025 e satisfaz o teste de 10 anos de não residência anteriores entra diretamente no <strong>regime FIG</strong>, que é mais simples e mais amplo do que a remittance basis — mas dura apenas 4 anos.","sources":[{"t":"legislation.gov.uk · Finance Act 2025","u":"https://www.legislation.gov.uk/ukpga/2025/8/contents"},{"t":"GOV.UK · Remittance basis changes","u":"https://www.gov.uk/guidance/remittance-basis-changes"},{"t":"HM Treasury · Reforming the taxation of non-UK domiciled individuals (PDF)","u":"https://assets.publishing.service.gov.uk/media/672105124da1c0d41942a8a8/Reforming_the_taxation_of_non-UK_individuals.pdf"},{"t":"Macfarlanes · Finance Act 2025 e a implementação das reformas","u":"https://www.macfarlanes.com/what-we-think/102eli5/the-finance-act-2025-implementation-of-the-reforms-to-the-taxation-of-non-uk-domiciliaries-102jvct/"},{"t":"Chartered Institute of Taxation · Novo Finance Act extingue o status non-dom","u":"https://www.tax.org.uk/new-finance-act-scraps-non-dom-tax-status-and-vat-exemption-for-school-fees"}]},{"name":"Regime FIG — Foreign Income and Gains (4 anos)","status":"new","legalBasis":"Finance Act 2025, Parte 2 (regime dos <em>qualifying new residents</em>), em vigor desde <strong>6 de abril de 2025</strong>. Insere novo capítulo no ITTOIA 2005 e no TCGA 1992. Manuais HMRC: Residence, Domicile and Remittance Basis Manual (RDRM), capítulos sobre o regime FIG.","desc":"O FIG é uma <strong>isenção</strong> — não um diferimento nem um regime de remessa.\n\nPara o indivíduo qualificado, <strong>rendimentos estrangeiros</strong> (dividendos, juros, aluguéis, lucros de atividade não britânica, distribuições de trusts offshore) e <strong>ganhos de capital estrangeiros</strong> ficam <strong>fora do escopo do imposto britânico</strong> durante os <strong>4 primeiros anos fiscais de residência</strong>.\n\n<strong>Diferença crucial em relação à remittance basis:</strong> o dinheiro pode ser <strong>livremente remetido ao Reino Unido sem qualquer tributação</strong>. Isso elimina toda a engenharia de segregação de contas — contas offshore separadas, <em>clean capital accounts</em>, análise de <em>mixed funds</em> — que caracterizava o planejamento non-dom.\n\n<strong>O regime é cego ao domicílio:</strong> aplica-se inclusive a britânicos com domicílio de origem no Reino Unido que retornem após 10 anos de não residência — algo impossível sob a remittance basis.\n\n<strong>Rendimentos e ganhos de fonte britânica</strong> continuam integralmente tributados.\n\n<strong>Contagem dos 4 anos:</strong> é de <strong>anos fiscais</strong>, não de anos de permanência efetiva. Se a pessoa sai do Reino Unido no ano 2 e volta no ano 4, os anos 2 e 3 são consumidos mesmo assim.","kv":[{"l":"Duração","v":"4 anos fiscais"},{"l":"Não residência prévia","v":"10 anos consecutivos"},{"l":"Rendimento estrangeiro","v":"Isento"},{"l":"Ganhos estrangeiros","v":"Isentos"},{"l":"Remessa ao Reino Unido","v":"Livre e sem imposto"},{"l":"Personal allowance","v":"Perdida (£12.570)"},{"l":"CGT annual exempt amount","v":"Perdido (£3.000)"},{"l":"Claim","v":"Expresso, na Self Assessment"},{"l":"Prazo do claim — 2025/26","v":"31 de janeiro de 2028"}],"requirements":["Ser <strong>residente fiscal britânico</strong> no ano em questão, pelo Statutory Residence Test.","<strong>Não ter sido residente fiscal britânico em nenhum dos 10 anos fiscais consecutivos imediatamente anteriores</strong> ao primeiro ano de residência.","Estar dentro dos <strong>4 primeiros anos fiscais</strong> contados a partir do primeiro ano de residência — a contagem é de anos fiscais, não de anos de permanência efetiva.","Fazer <strong>claim expresso</strong> na <em>Self Assessment tax return</em> de cada ano.","<strong>Quantificar e declarar</strong> os montantes de FIG a serem isentos — a declaração exige identificação dos valores, não basta marcar uma caixa.","Aceitar a <strong>perda da personal allowance</strong> (£12.570) e do <strong>CGT annual exempt amount</strong> (£3.000) naquele ano."],"process":[{"step":"Determinação da residência pelo SRT","detail":"Aplicação do Statutory Residence Test para o ano fiscal britânico (6 de abril a 5 de abril).","timing":"Contínuo"},{"step":"Registo para Self Assessment","detail":"Registo junto à HMRC pelo formulário <strong>SA1</strong> e obtenção do <strong>UTR</strong> (Unique Taxpayer Reference).","timing":"Até 5 de outubro seguinte ao 1.º ano fiscal"},{"step":"Apuração e segregação contábil do FIG","detail":"Apuração dos rendimentos e ganhos estrangeiros do ano. Diferentemente da remittance basis, não é necessária segregação bancária — apenas contábil, para efeitos da declaração.","timing":"Ao longo do ano"},{"step":"Apresentação da Self Assessment com o claim FIG","detail":"Declaração com as páginas <strong>SA106</strong> (Foreign), <strong>SA108</strong> (Capital Gains) e <strong>SA109</strong> (Residence, remittance basis etc.), fazendo o claim FIG e informando os valores.","timing":"Até 31 de janeiro (declaração online)"},{"step":"Pagamento de imposto sobre rendimentos britânicos","detail":"Saldo até 31 de janeiro; <em>payment on account</em> até 31 de julho.","timing":"31 de janeiro e 31 de julho"},{"step":"Prazo-limite para fazer ou emendar o claim","detail":"Primeiro aniversário do prazo de entrega. Para o ano fiscal <strong>2025/26: 31 de janeiro de 2028</strong>.","timing":"12 meses após o prazo"}],"costs":[{"item":"Custo da opção — perda da personal allowance","value":"≈£5.028 (faixa de 40%)","note":"£12.570 × 40%; ≈£5.657 na faixa de 45%"},{"item":"Custo da opção — perda do CGT annual exempt amount","value":"Até £720","note":"£3.000 × 24%"},{"item":"Custo para quem já ganha acima de £125.140","value":"Até £720","note":"A personal allowance já estaria eliminada pelo taper; resta apenas o AEA"},{"item":"Imposto sobre rendimento estrangeiro","value":"£0","note":"Durante os 4 anos, remessa livre incluída"}],"sections":[{"title":"Regras transitórias para quem já era residente em 6/abr/2025","body":"Quem já era residente britânico em 6/abr/2025 pode usar o FIG <strong>pelo saldo remanescente</strong> dos 4 anos, desde que satisfaça o teste de 10 anos de não residência anteriores à chegada. <strong>O status de domicílio anterior é irrelevante</strong> — o teste é exclusivamente o dos 10 anos.\n\n· Primeiro ano de residência em <strong>2021/22 ou anterior</strong> → nenhum ano de FIG disponível\n· <strong>2022/23</strong> → 1 ano (2025/26)\n· <strong>2023/24</strong> → 2 anos (2025/26 e 2026/27)\n· <strong>2024/25</strong> → 3 anos (2025/26 a 2027/28)\n· <strong>2025/26</strong> → 4 anos (2025/26 a 2028/29)"},{"title":"A aritmética da renúncia às deduções","body":"Ao optar pelo FIG, perde-se a <em>personal allowance</em> de <strong>£12.570</strong> e o <em>CGT annual exempt amount</em> de <strong>£3.000</strong>.\n\n· Para contribuinte na faixa de <strong>40%</strong>, o custo direto da perda da allowance é de aproximadamente <strong>£5.028</strong>;\n· na faixa de <strong>45%</strong>, cerca de <strong>£5.657</strong>;\n· para quem já tem renda acima de <strong>£125.140</strong>, a personal allowance já estaria integralmente eliminada pelo <em>taper</em>, e o custo da opção é apenas os £3.000 de AEA — até <strong>£720</strong> a 24%.\n\n<strong>A decisão é aritmética, ano a ano:</strong> compensa optar sempre que o imposto que incidiria sobre o FIG do ano supere o valor das deduções perdidas."},{"title":"Overseas Workday Relief reformada","body":"Indissociável do FIG para executivos transferidos.\n\n<strong>Elegibilidade:</strong> ser <em>qualifying new resident</em> — mesmo teste do FIG, 10 anos de não residência.\n<strong>Duração:</strong> até <strong>4 anos fiscais</strong> consecutivos (antes eram 3).\n<strong>Efeito:</strong> isenta a parcela do salário correspondente a dias trabalhados <strong>fora</strong> do Reino Unido.\n<strong>Teto (novidade):</strong> o menor entre <strong>30% do <em>qualifying employment income</em></strong> do ano e <strong>£300.000</strong>.\n<strong>Exigência de conta offshore e de não-remessa: eliminada</strong> — o valor pode ser recebido e mantido no Reino Unido.\n<strong>Transição:</strong> quem usava a remittance basis antes de 6/abr/2025 e ainda está nos 4 primeiros anos <strong>não fica sujeito ao teto</strong>.\n\nManual HMRC: EIM43600 e seguintes."},{"title":"Trusts offshore — remoção das proteções","body":"<strong>Antes de 6/abr/2025:</strong> o settlor non-dom residente não era tributado sobre o FIG do trust enquanto não recebesse benefício (TCGA 1992, s. 86 e Schedule 5; ITTOIA 2005, ss. 628A/B; regras TOAA com <em>motive defence</em>). A proteção aplicava-se independentemente do tempo de residência, até o <em>deemed domicile</em>.\n\n<strong>Desde 6/abr/2025:</strong> o settlor <strong>residente</strong> e <em>settlor-interested</em> é tributado <strong>pelo regime de competência</strong> sobre a renda estrangeira do trust (ITTOIA 2005, s. 624) e sobre os ganhos do trust (TCGA 1992, s. 86), <strong>à medida que surgem</strong>. As regras TOAA passam a alcançar a renda de sociedades subjacentes ao trust.\n\n<strong>Exceção:</strong> a proteção subsiste se o settlor for um <em>qualifying new resident</em> no ano — nesse caso, o FIG do trust também fica isento durante os 4 anos do FIG.\n\n<strong>Consequência para o beneficiário:</strong> beneficiários que sejam <em>qualifying new residents</em> podem receber <strong>benefícios e distribuições de trusts offshore livres de imposto britânico durante os 4 anos do FIG</strong>, inclusive quando o valor é trazido ao Reino Unido — o que difere do regime anterior, em que a distribuição remetida era tributável."}],"brazilNote":"<strong>Interação crítica — e contraintuitiva.</strong> Durante os 4 anos do FIG, os rendimentos estrangeiros são <strong>isentos</strong> no Reino Unido, o que <strong>elimina a base para crédito</strong> de imposto brasileiro pago.\n\nUm brasileiro que ainda sofra retenção no Brasil — por exemplo, sobre aluguéis de imóvel brasileiro (Carnê-Leão até 27,5%) ou ganho de capital em ativo brasileiro (15% a 22,5%) — <strong>não terá contra o que creditar</strong> no Reino Unido durante o período FIG. Em certos perfis, a opção pelo FIG <strong>pode não reduzir a carga combinada</strong>, porque o imposto brasileiro continua e o britânico não existia de qualquer forma.\n\nA modelagem quantitativa deve ser feita rendimento a rendimento, comparando: (i) FIG + imposto brasileiro integral, sem crédito; contra (ii) tributação britânica normal + crédito unilateral do imposto brasileiro sob a TIOPA 2010, com a personal allowance preservada.\n\n<strong>Ponto de partida indispensável:</strong> formalizar a saída fiscal do Brasil (<strong>CSDP</strong> até o último dia de fevereiro do ano seguinte à saída, e <strong>DSDP</strong> no prazo da DIRPF). Sem elas, a pessoa permanece residente fiscal brasileira nos primeiros 12 meses de ausência, com tributação em bases universais — e, como não há tratado em vigor entre Brasil e Reino Unido, <strong>não há tie-breaker convencional</strong> para resolver a dupla residência.","sources":[{"t":"GOV.UK · RDR3 — Statutory Residence Test","u":"https://gov.uk/government/publications/rdr3-statutory-residence-test-srt/guidance-note-for-statutory-residence-test-srt-rdr3"},{"t":"Saffery · Non-dom tax changes — o regime FIG, CGT e income tax","u":"https://www.saffery.com/insights/articles/non-dom-tax-changes-the-fig-regime-cgt-and-income-tax/"},{"t":"Deloitte TaxScape · Foreign Income and Gains (FIG) regime","u":"https://taxscape.deloitte.com/article/foreign-income-and-gains-(fig)-regime.aspx"},{"t":"HMRC · EIM43600 — Overseas Workday Relief, limite financeiro","u":"https://gov.uk/hmrc-internal-manuals/employment-income-manual/eim43600"},{"t":"Tax Adviser Magazine (CIOT) · Trusts não residentes — o fim das proteções","u":"https://www.taxadvisermagazine.com/article/non-resident-trusts-end-tax-trust-protections"}]},{"name":"Temporary Repatriation Facility (TRF) e rebasing a 5/abr/2017","status":"new","legalBasis":"Finance Act 2025, Parte 2. Janela de <strong>3 anos fiscais</strong>: 2025/26, 2026/27 e 2027/28. Manual HMRC: <strong>RDRM71000</strong> e seguintes — <em>Temporary repatriation facility</em>. O rebasing é regra transitória de CGT do mesmo Act, para alienações a partir de 6/abr/2025.","desc":"<strong>Temporary Repatriation Facility.</strong> O TRF opera por <strong>designação</strong>, não por remessa. O contribuinte declara na <em>tax return</em> o montante de FIG anterior a 6/abr/2025 que deseja «limpar», paga a alíquota reduzida sobre esse montante, e o valor designado pode ser trazido ao Reino Unido <strong>naquele ano ou em qualquer ano futuro</strong>, sem imposto adicional. Não é necessário remeter — nem sequer é necessário que o dinheiro exista em forma líquida no momento da designação.\n\n<strong>Alíquotas confirmadas:</strong>\n· ano da designação <strong>2025/26 → 12%</strong>\n· ano da designação <strong>2026/27 → 12%</strong>\n· ano da designação <strong>2027/28 → 15%</strong>\n· <strong>2028/29 em diante</strong> — facilidade encerrada; remessas voltam a ser tributadas às alíquotas ordinárias.\n\n<strong>Rebasing a 5 de abril de 2017.</strong> Certos ex-non-doms podem tratar o <strong>valor de mercado em 5 de abril de 2017</strong> como custo de aquisição de ativos estrangeiros detidos <strong>pessoalmente</strong> (não em trust nem em sociedade), para fins de <em>Capital Gains Tax</em>. O ganho anterior a essa data fica fora da base.","kv":[{"l":"TRF — 2025/26","v":"12%"},{"l":"TRF — 2026/27","v":"12%"},{"l":"TRF — 2027/28","v":"15%"},{"l":"TRF — a partir de 2028/29","v":"Encerrado"},{"l":"TRF — mecânica","v":"Designação, não remessa"},{"l":"TRF — base","v":"FIG anterior a 6/abr/2025"},{"l":"Rebasing — data de referência","v":"5 de abril de 2017"},{"l":"Rebasing — ativos","v":"Detidos pessoalmente"},{"l":"Rebasing — aplicação","v":"Automática, com opt-out por ativo"}],"requirements":["<strong>TRF:</strong> ter sido tributado sob a <strong>remittance basis em pelo menos um ano fiscal anterior a 2025/26</strong>. <em>A qualificação automática por FIG inferior a £2.000 é desconsiderada em algumas hipóteses — verificar.</em>","<strong>TRF:</strong> ser <strong>residente fiscal britânico no ano da designação</strong>.","<strong>TRF:</strong> os montantes designados devem ser <strong>FIG surgidos antes de 6/abr/2025</strong>.","<strong>TRF:</strong> designar na Self Assessment do ano correspondente, identificando os valores, e pagar o encargo no prazo ordinário (31 de janeiro seguinte).","<strong>Rebasing:</strong> não ter sido domiciliado nem <em>deemed domiciled</em> no Reino Unido em nenhum momento <strong>antes</strong> do ano fiscal 2025/26.","<strong>Rebasing:</strong> ter reivindicado a <strong>remittance basis em pelo menos um dos anos fiscais de 2017/18 a 2024/25</strong> — anos de qualificação <em>automática</em> são desconsiderados.","<strong>Rebasing:</strong> ser titular do ativo em <strong>5 de abril de 2017</strong>.","<strong>Rebasing:</strong> a alienação ocorrer em ou após <strong>6 de abril de 2025</strong>.","<strong>Rebasing:</strong> o ativo ter estado <strong>situado fora do Reino Unido durante todo o período de 6 de março de 2024 a 5 de abril de 2025</strong>, com exceções específicas."],"sections":[{"title":"Pontos operacionais do TRF","body":"<strong>Regras de ordenação alteradas.</strong> Montantes designados são considerados remetidos <strong>prioritariamente</strong>, o que evita que a remessa «puxe» FIG não designado de um <em>mixed fund</em>.\n\n<strong>Alcance ampliado:</strong> aplica-se também a <strong>benefícios recebidos de trusts offshore</strong> que sejam <em>matched</em> com FIG do trust anteriores a 6/abr/2025.\n\n<strong>Limitações:</strong> a carga do TRF <strong>não é creditável</strong> contra imposto estrangeiro, e <strong>não admite dedução</strong> de perdas, <em>reliefs</em> ou <em>allowances</em>. <em>Não há alívio de dupla tributação sob tratado para o TRF charge — a confirmar em RDRM71000+.</em>\n\n<em>Ponto em aberto:</em> se ex-<em>deemed domiciled</em> que nunca reivindicaram formalmente a remittance basis (por já serem <em>deemed dom</em>) mantêm acesso ao TRF sobre FIG de anos anteriores. A leitura corrente da doutrina é afirmativa, mas exige confirmação."},{"title":"Mecânica do rebasing","body":"O rebasing é <strong>automático</strong> quando as condições são atendidas, mas o contribuinte pode <strong>optar por não aplicá-lo, ativo a ativo</strong> (<em>election to disapply</em>) — o que é relevante quando o ativo desvalorizou desde 2017 e o custo histórico produz perda dedutível.\n\n<strong>Observação factual sobre o alcance:</strong> o conjunto de condições — especialmente a exclusão de quem já foi <em>deemed domiciled</em>, ou seja, de quem tem 15 anos ou mais de residência — <strong>restringe substancialmente o universo de beneficiários</strong>."}],"brazilNote":"O TRF é relevante para o brasileiro que residiu no Reino Unido sob a remittance basis e acumulou rendimentos e ganhos brasileiros fora do país sem os remeter — dividendos de empresas brasileiras, produto de venda de participações, aluguéis acumulados no Brasil.\n\nEsse estoque, antes bloqueado pela tributação de até 45% na remessa, pode ser designado a <strong>12%</strong> (até 2026/27) ou <strong>15%</strong> (2027/28) e trazido ao Reino Unido a qualquer momento futuro.\n\n<strong>Atenção:</strong> a carga do TRF <strong>não admite crédito por imposto brasileiro</strong> já pago sobre esses mesmos rendimentos, e <strong>não há tratado em vigor</strong> entre Brasil e Reino Unido que ofereça alívio. A designação deve, portanto, ser comparada ao custo de manter os fundos fora do Reino Unido.\n\nO <strong>rebasing a 5/abr/2017</strong> pode ser materialmente relevante para brasileiros com participações societárias no Brasil valorizadas desde então: o ganho anterior a essa data fica fora da base britânica de CGT — mas apenas para quem <strong>nunca foi deemed domiciled</strong>, o que exclui residentes de 15 anos ou mais.","sources":[{"t":"HMRC · RDRM71000 — Temporary repatriation facility","u":"https://www.gov.uk/hmrc-internal-manuals/residence-domicile-and-remittance-basis/rdrm71000"},{"t":"Deloitte TaxScape · Temporary Repatriation Facility (TRF)","u":"https://taxscape.deloitte.com/article/temporary-repatriation-facility-(trf).aspx"},{"t":"Saffery · Temporary Repatriation Facility — como funciona","u":"https://www.saffery.com/insights/articles/temporary-repatriation-facility-trf-how-it-works-and-what-to-include-in-your-2025-26-tax-return/"},{"t":"Chambers and Partners · O fim da remittance basis e as duas disposições transitórias","u":"https://chambers.com/articles/the-end-of-the-remittance-basis-and-the-two-transitional-provisions"}]},{"name":"Inheritance Tax — do domicílio à residência de longo prazo","status":"changed","legalBasis":"Finance Act 2025, Parte 2, que altera o <strong>Inheritance Tax Act 1984</strong>, substituindo o critério de domicílio pelo de <strong>long-term UK residence</strong>. Vigência: <strong>6 de abril de 2025</strong>. Medidas adicionais no Autumn Budget de 26 de novembro de 2025.","desc":"<strong>O novo critério.</strong> Um indivíduo é <strong>long-term resident (LTR)</strong> se foi residente fiscal no Reino Unido em <strong>pelo menos 10 dos 20 anos fiscais imediatamente anteriores</strong> ao ano em que ocorre o fato gerador de IHT — morte ou transferência tributável em vida.\n\n· <strong>LTR</strong> → IHT sobre o <strong>patrimônio mundial</strong>\n· <strong>Não-LTR</strong> → IHT apenas sobre ativos situados no Reino Unido (<em>UK situs assets</em>), incluindo imóveis britânicos detidos indiretamente por sociedades estrangeiras (regra de 2017, mantida)\n\nO conceito de <strong>domicílio deixou de ser relevante para IHT</strong>, assim como o <em>deemed domicile</em> e o regime do <em>formerly domiciled resident</em>.\n\n<strong>O «IHT tail» — a cauda após a saída.</strong> Quem se torna LTR e depois deixa o Reino Unido permanece no escopo mundial do IHT por período escalonado:\n· 10 a 13 anos de residência → <strong>3 anos fiscais</strong> de cauda\n· 14 anos → 4 anos · 15 anos → 5 anos · 16 anos → 6 anos\n· 17 anos → 7 anos · 18 anos → 8 anos · 19 anos → 9 anos\n· <strong>20 anos ou mais → 10 anos fiscais</strong> (máximo)\n\nApós 10 anos fiscais consecutivos de não residência, o rel
